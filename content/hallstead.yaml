# Gesetze, auf die der Lobbyist Druck machen kann (GDD §10). Ersatzkatalog, bis
# das Gesetzessystem (4.3) seinen eigenen Katalog liefert; die ids sollen dort gleich heißen.
# oil: was die Förderer-Lobby will (for/against).
laws:
  transport_duty:
    name: { de: "Transportpflicht für Pipelines", en: "Common carrier pipelines" }
    oil: against
  antitrust:
    name: { de: "Kartellgesetz", en: "Antitrust act" }
    oil: against
  income_tax:
    name: { de: "Einkommensteuer", en: "Income tax" }
    oil: against
  depletion_allowance:
    name: { de: "Steuerabzug für Ölvorkommen", en: "Depletion allowance" }
    oil: for
  production_quota:
    name: { de: "Förderquoten, Verbot von heißem Öl", en: "Production quotas, hot oil ban" }
