  labour_act:
    name: { de: "Gewerkschaftsgesetz", en: "Labour act" }
    oil: against
  bank_supervision:
    name: { de: "Bankaufsicht", en: "Banking supervision" }
    oil: against
  import_quota:
    name: { de: "Importquoten", en: "Import quotas" }
    oil: for
  environment:
    name: { de: "Umweltgesetze", en: "Environmental laws" }
    oil: against

