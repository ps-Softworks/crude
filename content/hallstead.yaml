# Hallstead-Mappe (4.16, GDD §8, §10, §11): Nebeninvestments und Lobbyist – ab Kapitel 3.
# Zahlen stehen in content/balance.yaml → hallstead. Platzhalter in Texten:
# {name} {amount} {favors} {party} {rounds} {cost}

object:
  name: { de: "Hallstead-Mappe", en: "Hallstead file" }
  hint: { de: "Beteiligungen, Lobbyist und Gesetze in der Hauptstadt.", en: "Holdings, lobbyist and bills in the capital." }
  locked: { de: "Hallsteads Türen öffnen sich erst einem Konzernherrn (ab Kapitel 3).", en: "Hallstead only opens its doors to a captain of industry (from chapter 3)." }
  nameProvince: { de: "Provinzpolitik", en: "Provincial politics" }
  hintProvince: { de: "Abgeordnete, Spenden und Gesetze. Ein eigener Lobbyist und die Hauptstadt kommen später – wer groß genug ist, wird in Hallstead gehört.", en: "Members of parliament, donations and bills. A lobbyist of your own and the capital come later – those big enough get heard in Hallstead." }

tabs:
  holdings: { de: "Beteiligungen", en: "Holdings" }
  lobby: { de: "Lobbyist", en: "Lobbyist" }
  laws: { de: "Gesetze", en: "Bills" }

holdings:
  land:
    name: { de: "Land in Boomtowns", en: "Boomtown land" }
    text: { de: "Steigt mit jeder neuen Quelle in der Gegend. Versiegt das Feld, ist das Land kaum noch etwas wert.", en: "Rises with every new well nearby. When the field runs dry, the land is worth next to nothing." }
    shock: { de: "Das Feld unter der Boomtown versiegt. Jacobs Land verliert {amount}.", en: "The field beneath the boomtown runs dry. Jacob's land loses {amount}." }
  bahn:
    name: { de: "Eisenbahnaktien", en: "Railroad shares" }
    text: { de: "Gute Dividende, solange die Wirtschaft brummt. Im Crash fallen sie schwer.", en: "A fine dividend while business hums. They fall hard in a crash." }
  auto:
    name: { de: "Autoaktien", en: "Motorcar shares" }
    text: { de: "Wachsen mit jedem Automobil auf der Straße – und stürzen im Crash am tiefsten.", en: "Grow with every motorcar on the road – and fall deepest in a crash." }
  zeitung:
    name: { de: "Eigene Zeitung", en: "Own newspaper" }
    text: { de: "Kostet eher, als sie bringt. Dafür lenkt sie Schlagzeilen – solange man ihr noch glaubt.", en: "Costs more than it earns. But it steers the headlines – as long as people still believe it." }
  bank:
    name: { de: "Eigene Bank", en: "Own bank" }
    text: { de: "Billigeres Geld für die eigene Firma. In jeder Kreditkrise droht der Ansturm auf die Schalter.", en: "Cheaper money for the company. In every credit crisis a run on the counters looms." }
    shock: { de: "Ansturm auf die Schalter! Die Kunden räumen Jacobs Bank leer – sie verliert {amount}.", en: "A run on the bank! Customers empty Jacob's vaults – it loses {amount}." }

newspaper:
  campaign: { de: "Kampagne fahren", en: "Run a campaign" }
  campaignDone: { de: "Die Kampagne dieser Runde läuft.", en: "This round's campaign is running." }
  credibility:
    high: { de: "Die Leser glauben dem Blatt.", en: "Readers trust the paper." }
    scratched: { de: "Die Leser werden misstrauisch.", en: "Readers are growing suspicious." }
    lost: { de: "Niemand glaubt dem Blatt mehr ein Wort.", en: "Nobody believes a word the paper prints." }

bank:
  discount: { de: "Jacobs Firma leiht bei der eigenen Bank {amount} Punkte billiger.", en: "Jacob's company borrows {amount} points cheaper from its own bank." }

lobbyists:
  pryce:
    name: { de: "Edmund Pryce", en: "Edmund Pryce" }
    text: { de: "Dreißig Jahre in Hallsteads Fluren, kennt jeden Ausschuss beim Vornamen. Fasst keinen Umschlag an.", en: "Thirty years in Hallstead's corridors, on first-name terms with every committee. Won't touch an envelope." }
  lowell:
    name: { de: "Harriet Lowell", en: "Harriet Lowell" }
    text: { de: "Brillant, wenn sie will. Manche Woche will sie nicht.", en: "Brilliant when she wants to be. Some weeks she doesn't." }
  tibbs:
    name: { de: "Warren Tibbs", en: "Warren Tibbs" }
    text: { de: "Billig, laut und in jedem Club bekannt – nicht immer nüchtern.", en: "Cheap, loud and known in every club – not always sober." }

