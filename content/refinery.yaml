  lubricant:
    name: { de: "Schmieröl", en: "Lubricating oil" }
    text: { de: "Für Maschinen, Lokomotiven und Mühlen. Kleine Mengen, guter Preis.", en: "For machines, locomotives and mills. Small amounts, good price." }
  fuelOil:
    name: { de: "Heizöl", en: "Fuel oil" }
