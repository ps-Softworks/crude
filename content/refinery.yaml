# Raffinerie und Produktmix (4.6, GDD §6) – Texte für den Gegenstand am Schreibtisch
# und sein Fenster. Ab Kapitel 2; in Kapitel 1 erscheint nichts davon.
# Zahlen stehen in content/balance.yaml (Block refinery), die Logik in src/sim/refinery.ts.
# Jeder Text mit Sprachschlüssel de/en (Englisch darf leer bleiben, dann erscheint Deutsch).
# Platzhalter in geschweiften Klammern füllt die Oberfläche, z. B. {cost}.
# ENTWURF: Ton und Wortwahl sind Vorschläge.

object:
  de: Raffinerie
  en: Refinery

sheetTitle:
  de: Raffinerie
  en: Refinery

tabs:
  plant: { de: "Anlage", en: "Plant" }
  mix: { de: "Produktmix", en: "Product mix" }
  compare: { de: "Verkaufen oder raffinieren", en: "Sell or refine" }

intro:
  de: Wer nur fördert, verkauft zu dem Preis, den andere diktieren. Eine eigene Raffinerie macht aus Rohöl Kerosin, Schmieröl, Heizöl – und ein wenig Benzin.
  en: Whoever only pumps sells at the price others dictate. A refinery of your own turns crude into kerosene, lubricating oil, fuel oil – and a little gasoline.

