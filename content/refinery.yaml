  none: { de: "Noch keine Raffinerie.", en: "No refinery yet." }
  building: { de: "Im Bau – fertig in {rounds}.", en: "Under construction – ready in {rounds}." }
  running: { de: "Läuft: {capacity} bbl Rohöl je Runde (Stufe {level}, {tech}).", en: "Running: {capacity} bbl of crude per round (stage {level}, {tech})." }
  expanding: { de: "Läuft mit {capacity} bbl je Runde; der Ausbau ist fertig in {rounds}.", en: "Running at {capacity} bbl per round; the expansion is ready in {rounds}." }
  damaged: { de: "Nach dem Brand steht die Anlage still – noch {rounds}.", en: "After the fire the plant stands idle – {rounds} to go." }
  short:
    none: { de: "nicht gebaut", en: "not built" }
    building: { de: "im Bau", en: "under construction" }
    running: { de: "läuft", en: "running" }
    expanding: { de: "wird ausgebaut", en: "expanding" }
    damaged: { de: "steht still", en: "idle" }

actions:
  build: { de: "Raffinerie bauen ({cost}, {rounds})", en: "Build refinery ({cost}, {rounds})" }
  expand: { de: "Ausbauen: +{capacity} bbl ({cost}, {rounds})", en: "Expand: +{capacity} bbl ({cost}, {rounds})" }
  intake: { de: "Anteil der Kapazität, der am Rundenende aus dem Tank in die Raffinerie geht", en: "Share of capacity taken from the tank into the refinery at the end of the round" }
  apply: { de: "Mix übernehmen", en: "Apply mix" }

hints:
  intake:
    de: Am Rundenende geht Rohöl, das dann noch im Tank steht, in die Raffinerie – bis zu dieser Menge. Die Raffinerie steht am Bahnhof; das Öl fährt über deine Wege (Pipeline, eigene Fuhrwerke, Bahn, Fuhrwerk) und zahlt deren Fracht. Was du vorher verkaufst, ist schon weg und belegt die Wege.
    en: At the end of the round, crude still in the tank goes into the refinery – up to this amount. The refinery stands at the railway station; the oil travels over your routes (pipeline, own wagons, railway, hired wagons) and pays their freight. Whatever you sell beforehand is already gone and takes up the routes.
  feedLimited: { de: "Mehr schaffen deine Wege diese Runde nicht ({crude} bbl frei) – eine Pipeline brächte mehr.", en: "Your routes cannot carry more this round ({crude} bbl free) – a pipeline would carry more." }
  lessIntake: { de: "Die letzten Barrel bringen in der Raffinerie nur {marginal} – beim Verkauf {crude}. Weniger hineingeben hebt die Produktpreise.", en: "The last barrels only earn {marginal} in the refinery – {crude} if sold. Sending less raises product prices." }
  mix:
    de: Den Mix stellst du innerhalb der Grenzen der Destillation ein. Benzin fällt als Nebenprodukt an. Jedes Produkt hat seine eigenen Käufer – wer zu viel von einem anbietet, drückt den Preis.
    en: You set the mix within the limits of distillation. Gasoline comes out as a by-product. Each product has its own buyers – offer too much of one and its price drops.
  planned: { de: "Am Rundenende gehen {crude} bbl aus dem Tank in die Raffinerie.", en: "At the end of the round {crude} bbl go from the tank into the refinery." }
  noCrude: { de: "Der Tank ist leer – diese Runde gibt es nichts zu raffinieren.", en: "The tank is empty – there is nothing to refine this round." }
  compare:
    de: Je Barrel Rohöl im Durchschnitt, beide Wege nach Fracht, die Raffinerie zusätzlich nach Betriebskosten. Förderzins und Fixkosten fallen auf beiden Wegen an.
    en: Average per barrel of crude, both after freight, the refinery also after operating costs. Royalties and fixed costs apply either way.
  refineBetter: { de: "Raffinieren bringt {diff} je Barrel mehr.", en: "Refining earns {diff} more per barrel." }
  sellBetter: { de: "Rohöl verkaufen bringt {diff} je Barrel mehr – weniger in die Raffinerie geben oder den Mix ändern.", en: "Selling crude earns {diff} more per barrel – send less to the refinery or change the mix." }
  lastRun: { de: "Letzte Runde: {crude} bbl verarbeitet, {revenue} Erlös, {net} nach allen Kosten.", en: "Last round: {crude} bbl processed, {revenue} revenue, {net} after all costs." }
  unlockDebug: { de: "Raffinerie freischalten (Kapitel 2 vorab)", en: "Unlock refinery (chapter 2 preview)" }

