    panic_nodebt: { de: "Harlan Oil hat keine Schulden – soll die Panik ruhig kommen.", en: "Harlan Oil owes nothing – let the panic come." }
    panic_ride: { de: "Jacob bohrt weiter auf Pump.", en: "Jacob keeps drilling on credit." }
    automobile_invest: { de: "Harlan Oil steigt bei einer Benzinanlage ein ({betrag}).", en: "Harlan Oil buys into a gasoline plant ({betrag})." }
