    navy_decline: { de: "Jacob lehnt den Marinevertrag ab.", en: "Jacob turns down the navy contract." }
    grady_take: { de: "Harlan Oil beteiligt sich an Pachten auf Reserveland ({betrag}). Niemand schreibt darüber – noch nicht.", en: "Harlan Oil takes a stake in leases on reserve land ({betrag}). Nobody writes about it – not yet." }
    grady_refuse: { de: "Jacob lässt Senator Gradys Angebot unbeantwortet.", en: "Jacob leaves Senator Grady's offer unanswered." }
    college_go: { de: "Thomas geht aufs College im Osten ({betrag}).", en: "Thomas goes off to college in the east ({betrag})." }
    college_firm: { de: "Thomas fängt in der Firma an – ohne College.", en: "Thomas starts at the company – without college." }

  # Einzahl, wenn {n} = 1 ist.
  one:
    wells_found: { de: "Harlan Oil bringt eine neue Quelle in Förderung.", en: "Harlan Oil brings a new well into production." }
    wells_dry: { de: "Eine Bohrung des Verwalters bleibt trocken.", en: "One of the manager's wells comes up dry." }
