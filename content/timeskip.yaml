# Kapitel 2 „Der Herausforderer“ (4.12): Stempel unter der Chronik, Überschrift zum Kapitelstart.
# {bis} = letztes Quartal des neuen Kapitels in Föderationsjahren (0.4.19+3, chapterGoalDate – wie Kalender und Kopfleiste).
chapter2:
  badge: { de: "Kapitel 2 · Der Herausforderer", en: "Chapter 2 · The Challenger" }
  title: { de: "Kapitel 2 – Der Herausforderer", en: "Chapter 2 – The Challenger" }
  text:
    de: Harlan Oil ist eine ernstzunehmende Firma, aber der Crane Trust beherrscht Raffinerien und Pipelines. Ziel bis {bis} – eigene Raffinerie oder Pipeline zum Hafen, Kontrolle über die Firma, ein Imperium von {ziel}.
    en: Harlan Oil is a company to be reckoned with, but the Crane Trust controls the refineries and pipelines. Goal by {bis} – your own refinery or pipeline to the harbour, control of the company, an empire worth {ziel}.
  # 0.4.19+2: wenn die Firma schwach aus dem Sprung kommt (balance.yaml timeskip.weakStart).
  textWeak:
    de: Harlan Oil hat die sechs Jahre überstanden, mehr nicht – kaum Quellen, wenig Geld, und der Crane Trust beherrscht Raffinerien und Pipelines. Ziel bis {bis} – eigene Raffinerie oder Pipeline zum Hafen, Kontrolle über die Firma, ein Imperium von {ziel}. Ein weiter Weg.
    en: Harlan Oil has survived the six years, nothing more – few wells, little money, and the Crane Trust controls the refineries and pipelines. Goal by {bis} – your own refinery or pipeline to the harbour, control of the company, an empire worth {ziel}. A long way to go.

# Bericht des Verwalters (0.4.20+2) unter der Chronik von Zeitsprung I: Förderung vorher/nachher und was das
# Geld jetzt kauft (src/sim/managerReport.ts). {vorher}/{nachher} = bbl je Runde, {kosten} = grobe Kosten,
# {n} = freie Ranches in der Provinz. Die Namen in „…“ sind die Schilder am Schreibtisch.
report:
  title: { de: "Bericht des Verwalters", en: "The manager's report" }
  flowFell:
    de: "Die alten Quellen geben nach: Harlan Oil fördert {nachher} bbl je Runde, vor sechs Jahren waren es {vorher}. Junge Quellen fördern anfangs am meisten und verlieren jedes Quartal einen Teil – die {altQuellen} Quellen von damals bringen heute nur noch {altFoerderung} bbl, die {neuQuellen} neuen des Verwalters {neuFoerderung} bbl. Gutes Land war knapp – erst jetzt ist die ganze Provinz vermessen und zu haben."
    en: "The old wells are giving out: Harlan Oil produces {nachher} bbl a round, six years ago it was {vorher}. Young wells produce most at first and lose a share every quarter – the {altQuellen} wells from back then now yield only {altFoerderung} bbl, the manager's {neuQuellen} new ones {neuFoerderung} bbl. Good land was scarce – only now is the whole province surveyed and up for grabs."
  flowHeld:
    de: "Die Förderung hält: {nachher} bbl je Runde, vor sechs Jahren waren es {vorher}. Jetzt ist die ganze Provinz vermessen und zu haben."
    en: "Production is holding: {nachher} bbl a round, six years ago it was {vorher}. Now the whole province is surveyed and up for grabs."
  ideas: { de: "Wofür das Geld jetzt reicht:", en: "What the money can buy now:" }
  refinery:
    de: "Eine eigene Raffinerie – rund {kosten}. Das erfüllt einen Teil des Kapitelziels. Am Tisch: „Raffinerie“."
    en: "A refinery of your own – about {kosten}. That meets part of the chapter goal. On the desk: “Refinery”."
  harbor:
    de: "Eine Fernleitung zum Hafen – rund {kosten} mit Vermessung und Wegerechten, an Thornes Bahn vorbei. Erfüllt denselben Teil des Kapitelziels. Am Tisch: „Fracht“, Reiter „Fernleitung“."
    en: "A trunk line to the harbour – about {kosten} with survey and rights of way, bypassing Thorne's railway. Meets the same part of the chapter goal. On the desk: “Freight”, tab “Trunk line”."
  land:
    de: "Neues Öl – {n} Ranches in der Provinz sind frei, Pacht und Bohrung kosten rund {kosten}. Erst hinreiten und umhören (Kalender), dann auf der Karte pachten."
    en: "New oil – {n} ranches in the province are free, lease and well cost about {kosten}. Ride out and ask around first (calendar), then lease on the map."
  tooExpensive: { de: "noch zu teuer", en: "still too expensive" }
  flowLabel: { de: "Förderung je Runde", en: "Production per round" }
  # Die Chronik hat zwei Seiten: erst die Jahre, dann Bilanz, Bericht und Kapitelziel.
  page: { de: "Seite {seite} von 2", en: "Page {seite} of 2" }
  next: { de: "Weiter – Bilanz und Bericht des Verwalters", en: "Next – balance and the manager's report" }
  nextBalance: { de: "Weiter – Bilanz", en: "Next – balance" }
  back: { de: "‹ Die Jahre", en: "‹ The years" }

# Kapitel 3 „Der Konzernherr“ (4.19): Stempel unter der Chronik von Zeitsprung II, Ziel zum Kapitelstart.
chapter3:
  badge: { de: "Kapitel 3 · Der Konzernherr", en: "Chapter 3 · The Magnate" }
  title: { de: "Kapitel 3 – Der Konzernherr", en: "Chapter 3 – The Magnate" }
  text:
    de: Harlan Oil ist ein Konzern. Die Börse lockt, und Hallsteads alte Familien öffnen die ersten Türen – oder schlagen sie zu. Ziel bis {bis} – eine eigene Marke mit mindestens {regionAnteil} Marktanteil in {regionen} Regionen gegen Crane oder {anteil} landesweit, und am Ende mindestens Rating {rating} bei der Bank.
    en: Harlan Oil is a corporation. The stock exchange beckons, and Hallstead's old families open the first doors – or slam them shut. Goal by {bis} – your own brand holding at least {regionAnteil} market share in {regionen} regions against Crane or {anteil} nationwide, and at least a {rating} rating with the bank at the end.
  textWeak:
