  year: { de: "Jahr {jahr} der Föderation", en: "Year {jahr} of the Federation" }
  quiet: { de: "Ein ruhiges Jahr am Salt Hill.", en: "A quiet year at Salt Hill." }
  balance: { de: "Was die Jahre gebracht haben", en: "What the Years Brought" }
  continue: { de: "An den Schreibtisch – Frühjahr {jahr}", en: "Back to the desk – spring {jahr}" }
  end: { de: "Das Ende der Firma", en: "The end of the company" }
