# Zeitsprünge (4.5, GDD §2/§13): Texte für Direktiven, Weichen-Telegramme, die Chronik
# „Die Jahre dazwischen“ und den Platzhalter-Start von Kapitel 2.
# Zahlen stehen in balance.yaml unter timeskip, Regeln in src/sim/timeskip.ts.
# Platzhalter in geschweiften Klammern setzt das Spiel ein: {n} Anzahl, {betrag} Geld,
# {name} Name, {partei} Partei, {gesetz} Gesetz, {preis} Preis, {wort} Zustandswort,
# {jahr} Jahr der Föderation, {von}/{bis} Jahre.
# draft: true = von Claude geschrieben, Philipp soll drüberlesen.
draft: true

start:
  title: { de: "Die Jahre bis Kapitel 2", en: "The Years Until Chapter 2" }
  text:
    de: Sechs Jahre lang führt ein Verwalter das Tagesgeschäft. Jacob gibt ihm einen Brief mit, wie er es halten soll – und bleibt für Telegramme erreichbar.
    en: For six years a manager runs the daily business. Jacob leaves him a letter on how to go about it – and stays reachable by telegram.
  button: { de: "Die Jahre ziehen ins Land …", en: "The years go by …" }
  blockedIpo: { de: "Erst über die Aktiengesellschaft entscheiden.", en: "Decide on the stock company first." }

# Zeitsprung II (4.19): Angebot am Ende von Kapitel 2.
start2:
  title: { de: "Die Jahre bis Kapitel 3", en: "The Years Until Chapter 3" }
  text:
    de: Wieder sechs Jahre in der Hand eines Verwalters – diesmal mit Raffinerie, Leitungen und Aufsichtsrat. Jacob schreibt ihm, wie er es halten soll, und bleibt für Telegramme erreichbar.
    en: Another six years in the hands of a manager – this time with refinery, pipelines and board. Jacob writes to him how to go about it and stays reachable by telegram.
  button: { de: "Die Jahre ziehen ins Land …", en: "The years go by …" }

directives:
  title: { de: "An den Verwalter", en: "To the Manager" }
  text:
    de: "Port Ellis, Winter {jahr}. Sie führen die Firma, bis ich zurück am Schreibtisch sitze. Halten Sie es so:"
    en: "Port Ellis, winter {jahr}. You will run the company until I am back at my desk. Keep to this:"
  stance:
    label: { de: "Haltung", en: "Stance" }
    aggressive:
      label: { de: "Wagemutig", en: "Bold" }
      text: { de: "Jeden Dollar in neue Bohrungen, auch auf Pump und in Nachbarbezirken. Viel Gewinn – oder, wenn die Bank Kredite kündigt, viel Verlust.", en: "Every dollar into new wells, borrowed money and neighbouring districts too. Big gains – or, if the bank calls in its loans, big losses." }
    balanced:
      label: { de: "Ausgewogen", en: "Balanced" }
      text: { de: "Die Hälfte in neue Bohrungen, ein wenig tilgen, ein Polster behalten.", en: "Half into new wells, pay down a little, keep a cushion." }
    cautious:
      label: { de: "Vorsichtig", en: "Cautious" }
      text: { de: "Schulden zurückzahlen, nur sichere Ranches anbohren, viel Rücklage.", en: "Pay off debts, drill only safe ranches, keep a big reserve." }
  family:
    label: { de: "Familie", en: "Family" }
    little:
      label: { de: "Die Firma zuerst", en: "Business first" }
      text: { de: "Jacob ist kaum zu Hause und treibt den Verwalter an. Mehr Bohrungen – Ruth und die Kinder leiden.", en: "Jacob is hardly home and drives the manager hard. More wells – Ruth and the children suffer." }
    some:
      label: { de: "Wie bisher", en: "As before" }
      text: { de: "Sonntags zu Hause, unter der Woche im Büro.", en: "Home on Sundays, at the office during the week." }
    much:
      label: { de: "Viel Zeit zu Hause", en: "Plenty of time at home" }
      text: { de: "Jacob sieht seine Kinder aufwachsen. Der Verwalter bohrt weniger, und ohne Aufsicht bringt das Öl weniger ein.", en: "Jacob watches his children grow up. The manager drills less, and without oversight the oil earns less." }
  send: { de: "Brief abschicken", en: "Send the letter" }
  back: { de: "Zurück zum Kapitelende", en: "Back to the chapter's end" }

# Weichen-Telegramme: unterbrechen den Sprung, wenn die Welt sie hergibt (GDD §13, Zeitsprung I).
switches:
  telegram: { de: "Telegramm", en: "Telegram" }
  funds: { de: "Kasse {kasse} · Schulden {schulden} · Bankrahmen frei {rahmen}", en: "Cash {kasse} · debt {schulden} · free credit line {rahmen}" }
  onCredit: { de: "auf Kredit", en: "on credit" }
  blocked: { de: "Kasse und Bankrahmen reichen nicht", en: "Cash and credit line won't cover it" }
  bank_panic:
    title: { de: "Das Geld ist zu billig", en: "Money Is Too Cheap" }
    text:
      de: "VERWALTER AN HARLAN – BANKEN LEIHEN JEDEM – KURSE STEIGEN OHNE GRUND – ALTE HASEN WARNEN VOR DER PANIK – SCHULDEN JETZT ZURÜCKZAHLEN ODER WEITER AUF PUMP BOHREN – ERBITTE ANTWORT"
      en: "MANAGER TO HARLAN – BANKS LEND TO ANYONE – PRICES RISE FOR NO REASON – OLD HANDS WARN OF A PANIC – PAY DEBTS NOW OR KEEP DRILLING ON CREDIT – REPLY REQUESTED"
    repay: { de: "Schulden zurückzahlen", en: "Pay off the debts" }
    ride: { de: "Weiter auf Pump bohren", en: "Keep drilling on credit" }
  automobile:
    title: { de: "Der erste Motorwagen", en: "The First Motor Car" }
    text:
      de: "VERWALTER AN HARLAN – IN PORT ELLIS FÄHRT EIN MOTORWAGEN – LÄUFT AUF BENZIN – EIN CHEMIKER SUCHT GELD FÜR EINE BENZINANLAGE – EINSTEIGEN ODER NICHT"
      en: "MANAGER TO HARLAN – A MOTOR CAR DRIVES IN PORT ELLIS – RUNS ON GASOLINE – A CHEMIST WANTS MONEY FOR A GASOLINE PLANT – IN OR OUT"
    invest: { de: "Einsteigen ({betrag})", en: "Buy in ({betrag})" }
    ignore: { de: "Eine Mode – nicht einsteigen", en: "A fad – stay out" }
  okara:
    title: { de: "Öl in Okara", en: "Oil in Okara" }
    text:
      de: "VERWALTER AN HARLAN – FUND IN DER PRÄRIEPROVINZ OKARA – PACHTEN NOCH BILLIG – BULLARD SCHON UNTERWEGS – PACHTEN KAUFEN ODER LASSEN"
      en: "MANAGER TO HARLAN – STRIKE IN THE PRAIRIE PROVINCE OF OKARA – LEASES STILL CHEAP – BULLARD ALREADY ON HIS WAY – BUY LEASES OR PASS"
    lease: { de: "Pachten kaufen ({betrag})", en: "Buy leases ({betrag})" }
    pass: { de: "Bullard soll sie haben", en: "Let Bullard have them" }
  clara:
    title: { de: "Ruth erwartet ein Kind", en: "Ruth Is Expecting" }
    text:
      de: "RUTH AN JACOB – WIR BEKOMMEN EIN ZWEITES KIND – THOMAS FREUT SICH – KOMMST DU NACH HAUSE"
      en: "RUTH TO JACOB – WE ARE HAVING A SECOND CHILD – THOMAS IS THRILLED – WILL YOU COME HOME"
    home: { de: "Die Monate zu Hause bleiben", en: "Stay home for those months" }
    business: { de: "Die Geschäfte gehen vor", en: "Business comes first" }
  # Zeitsprung II (4.19, GDD §13, Story-Bibel §2)
  war_export:
    title: { de: "Kriegsgefahr in Übersee", en: "War Clouds Overseas" }
    text:
      de: "VERWALTER AN HARLAN – ALDMARK UND VARENHOLD RÜSTEN – REEDER ZAHLEN JEDEN PREIS FÜR ÖL – TANKER FAHREN DURCH MINENFELDER – EXPORTIEREN ODER IM LAND VERKAUFEN"
      en: "MANAGER TO HARLAN – ALDMARK AND VARENHOLD ARE ARMING – SHIPOWNERS PAY ANY PRICE FOR OIL – TANKERS SAIL THROUGH MINEFIELDS – EXPORT OR SELL AT HOME"
    export: { de: "Exportieren – trotz des Risikos", en: "Export – despite the risk" }
    hold: { de: "Im Land verkaufen", en: "Sell at home" }
  navy:
    title: { de: "Die Marine braucht Heizöl", en: "The Navy Needs Fuel Oil" }
    text:
      de: "VERWALTER AN HARLAN – DIE MARINE STELLT AUF ÖL UM – EIN ADMIRAL BIETET FESTPREIS FÜR HEIZÖL BIS ZUM ENDE DES JAHRZEHNTS – ANNEHMEN"
      en: "MANAGER TO HARLAN – THE NAVY IS SWITCHING TO OIL – AN ADMIRAL OFFERS A FIXED PRICE FOR FUEL OIL TO THE END OF THE DECADE – ACCEPT"
    accept: { de: "Den Vertrag annehmen", en: "Accept the contract" }
    decline: { de: "Ablehnen – der Markt zahlt mehr", en: "Decline – the market pays more" }
  grady:
    title: { de: "Ein Angebot von Senator Grady", en: "An Offer from Senator Grady" }
    text:
      de: "GRADY AN HARLAN – PACHTEN AUF STAATLICHEM RESERVELAND – NIEMAND FRAGT NACH – EINE BETEILIGUNG FÜR ALTE FREUNDE – DISKRETION SELBSTVERSTÄNDLICH"
      en: "GRADY TO HARLAN – LEASES ON STATE RESERVE LAND – NOBODY ASKS QUESTIONS – A STAKE FOR OLD FRIENDS – DISCRETION GUARANTEED"
    take: { de: "Einsteigen ({betrag})", en: "Buy in ({betrag})" }
    refuse: { de: "Die Finger davon lassen", en: "Keep well clear" }
  college:
    title: { de: "Thomas und das College", en: "Thomas and College" }
    text:
      de: "RUTH AN JACOB – THOMAS HAT DEN BRIEF VOM COLLEGE IM OSTEN – ER WILL HIN – ODER SOFORT IN DIE FIRMA WENN DU ES SAGST – ER WARTET AUF DEIN WORT"
      en: "RUTH TO JACOB – THOMAS HAS THE LETTER FROM THE COLLEGE IN THE EAST – HE WANTS TO GO – OR STRAIGHT INTO THE COMPANY IF YOU SAY SO – HE AWAITS YOUR WORD"
    college: { de: "Aufs College ({betrag})", en: "Off to college ({betrag})" }
    company: { de: "Gleich in die Firma", en: "Straight into the company" }

