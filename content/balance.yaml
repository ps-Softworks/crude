# Spielzahlen für den Prototyp.
# PLATZHALTER: grob geschätzt, werden durch das Tabellenmodell (Schritt 0.6)
# und den Papierprototyp (0.7–0.9) ersetzt. Nur hier ändern, nicht im Code.

start:
  cash: 2500          # $ Bargeld bei Spielbeginn (GDD §13: 2.000; 1.15: zwei Startbohrungen müssen drin sein)
  year: 88            # Jahr der Föderation
  rounds: 16          # Runden in Kapitel 1 (ein Quartal pro Runde)

# Ranches und Farmen (0.2.15+5): Das bohrbare Land (Gebiete in content/map.yaml) wird
# je Seed in unregelmäßige Grundstücke zerlegt (src/sim/ranches.ts). Karteneinheit ≈ alte Rasterparzelle.
ranches:
  spacing: 1.7        # Abstand der Hofstellen
  jitter: 0.8         # Versatz als Anteil des Abstands – höher = unregelmäßiger
  relax: 2            # Glättungsrunden (Lloyd)
  minArea: 0.6        # kleinere Reste gehen an die Nachbarn
  minEdge: 0.15       # so lang muss eine gemeinsame Grenze sein, damit Ranches Nachbarn sind
  slotArea: 1.5       # Fläche je Bohrplatz; Reserven und Pachtbonus aus diesem Block gelten für so viel Fläche
  maxSlots: 5         # mehr Bohrlöcher passen auf keine Ranch
  sizes:              # Größenklassen der Hofstellen: Anteil und Gewicht (größer = mehr Land)
    - { share: 0.40, weight: 0 }      # Kleinfarm
    - { share: 0.40, weight: 0.35 }   # Weide
    - { share: 0.20, weight: 0.9 }    # große Ranch

# Geologie je Zone (Profil „salzdom“ in content/map.yaml). Die Zone hängt vom Abstand
# der Ranch-Mitte zur Mitte des Salzdoms ab (in Karteneinheiten). Reserven gelten je
# ranches.slotArea Fläche – größere Ranches haben entsprechend mehr Öl.
# Wahrscheinlichkeiten pro Zone müssen zusammen 1 ergeben.
geology:
  zones:
    - name: kern
      maxDistance: 2.5     # 0.2.15+5: Ranch-Mitten statt Rasterfelder (vorher 1,5)
      dry: 0.30
      small: 0.55
      gusher: 0.15
    - name: ring
      maxDistance: 5.0     # 0.2.15+5: vorher 3,5 – Anteil Kern/Ring/Rand an den Ranches etwa wie früher an den Feldern
      dry: 0.40
      small: 0.52
      gusher: 0.08
    - name: rand
      maxDistance: 99
      dry: 0.75          # 2.15: vorher 0,55 – blinde Wildcat-Bohrung traf 1 von 3, GDD §15 sagt 1 von 5 bis 1 von 10
      small: 0.24
      gusher: 0.01
  # Förderbare Gesamtmenge in Barrel (gleichverteilt zwischen min und max).
  # 1.15: deutlich angehoben (vorher 2.000–12.000 und 30.000–120.000), damit die Anfangsrate im GDD-Rahmen liegt
  # (kleiner Fund 50–125 bbl/Tag, Gusher 200–650 bbl/Tag).
  reserves:
    small:
      min: 18000
      max: 45000
    gusher:
      min: 60000
      max: 200000

# Pacht (GDD §5, §15). Bonus und Förderzins hängen von der Lage zum nächsten
# bekannten Fund und vom Landbesitzer ab.
lease:
  termRounds: 4         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  delayRental: 25       # PLATZHALTER: $ Verzögerungszins je ungebohrter Pacht und Runde
  royaltyMin: 0.10      # Förderzins wird auf 10–25 % begrenzt
  royaltyMax: 0.25
  bonusRounding: 10     # Bonus und Optionsgebühr auf 10 $ gerundet
  # Lage nach Abstand zum nächsten bekannten Fund, in Nachbarschaftsschritten
  # (gemeinsame Grenze = 1). Der Bonus gilt je ranches.slotArea Fläche: große Ranches kosten mehr.
  # Nach maxDistance aufsteigend sortiert; die letzte Lage gilt für den Rest.
  locations:
    - name: amFund
      label: Am Fund
      maxDistance: 1
      bonus: 4000         # 0.2.15+5: je Standardfläche (vorher 8.000 je Rasterfeld; eine Ranch hat im Schnitt 2 Standardflächen)
      royalty: 0.20
    - name: nachbar
      label: Nachbar eines Funds
      maxDistance: 2
      bonus: 500           # 1.15: vorher 2.000 – sonst bleibt Nachbarland vor dem ersten Fund unbezahlbar; 0.2.15+5: je Standardfläche (vorher 1.000 je Feld)
      royalty: 0.1666667  # 1/6
    - name: randlage
      label: Randlage
      maxDistance: 99
      bonus: 80            # 0.2.15+5: je Standardfläche (vorher 150 je Feld)
      royalty: 0.125
  # Landbesitzer: weight = Häufigkeit (vorerst alle gleich),
  # bonusFactor multipliziert den Lagebonus, royaltyAdd kommt auf den Förderzins.
  landowners:
    - name: neutral
      label: neutral
      weight: 1           # PLATZHALTER
      bonusFactor: 1.00
      royaltyAdd: 0
    - name: gierig
      label: gierig
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: 0.03
    - name: verschuldet
      label: verschuldet
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: -0.03
    - name: misstrauisch
      label: misstrauisch
      weight: 1           # PLATZHALTER
      bonusFactor: 1.50
      royaltyAdd: 0
    - name: fromm
      label: fromm
      weight: 1           # PLATZHALTER
      bonusFactor: 0.90
      royaltyAdd: 0
  # Pachtoption: sichert Bonus und Förderzins für kurze Zeit.
  option:
    feeShare: 0.10        # PLATZHALTER: Gebühr = Anteil am Bonus
    termRounds: 2         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  # Jacob beginnt mit freien Optionen auf Ranches in Randlage.
  startOptions:
    count: 2              # PLATZHALTER
    termRounds: 4         # PLATZHALTER

# Förderung (GDD §5). Das Öl liegt in Lagerstätten, die mehrere Ranches
# umfassen. Jede Quelle startet mit einem Anteil der Reserve je Standardfläche (ranches.slotArea) ihrer Ranch und fällt je
# Quartal. Das Feld ist gemeinsam: Mehr als freeWells Quellen senken den Druck
# aller Quellen und verringern die Gesamtausbeute des Feldes.
production:
  # Anfangsrate je Runde als Anteil der Reserve je Standardfläche der eigenen Ranch – für
  # kleine Funde und für Gusher je eigener Wert.
  initialRateShare:
    small: 0.25              # PLATZHALTER
    gusher: 0.30             # PLATZHALTER
  decline: 0.10              # Rückgang je Quartal (GDD: 8–15 %); 2.15: vorher 0,12 – gemessen kamen mit Druckverlust und leeren Feldern 14,5 % heraus
  freeWells: 4               # PLATZHALTER: so viele Quellen verträgt ein Feld ohne Druckverlust
  pressureLossPerWell: 0.15  # PLATZHALTER: Druckverlust je Quelle über freeWells
  pressureMin: 0.40          # PLATZHALTER: tiefster Druckfaktor
  recoveryLossPerWell: 0.06  # PLATZHALTER: Ausbeuteverlust des Feldes je Quelle über freeWells
  recoveryLossMax: 0.30      # GDD: Überförderung senkt die Ausbeute um bis zu 30 %
  # Pumpe (0.2.15+7): nachrüsten an einer fündigen Quelle. +25 % Rate und die Hälfte des
  # Druckverlusts aufgefangen – aber 400 $ Unterhalt je Runde. Beispiel: gute Quelle 10.000 bbl,
  # 0,90 $ netto → +2.500 bbl ≈ 2.250 $ − 400 $ = 1.850 $ je Runde, bezahlt nach 3 Runden.
  # Müde Quelle 2.000 bbl, 0,60 $ netto → +500 bbl ≈ 300 $ – weniger als der Unterhalt, lohnt nie.
  pump: { cost: 4000, upkeep: 400, rateFactor: 1.25, pressureKeep: 0.5 }

# Geologe (GDD §5): Er nennt nie die wahre Fundchance, sondern eine
# Bandbreite. Je genauer und je weniger verzerrt, desto eher deckt sie die
# Wahrheit ab.
forecast:
  widthMax: 50            # PLATZHALTER: breiteste Bandbreite in Prozentpunkten
  widthMin: 10            # PLATZHALTER: schmalste Bandbreite (bester Geologe)
  rounding: 5             # PLATZHALTER: Bandbreitengrenzen auf 5 Prozentpunkte runden
  geologist:
    accuracy: 3           # PLATZHALTER: Genauigkeit 1–5
    bias: 0               # PLATZHALTER: Verzerrung −15 bis +15 Punkte

# Bohren (GDD §5): Stufe 1 ist die Zieltiefe, jede weitere Stufe heißt
# "tiefer bohren". Tiefer = teurer und gefährlicher (Push your luck).
# oilShare: in welcher Stufe das Öl einer nicht trockenen Ranch liegt (Summe 1).
# accident: Unfall-Chance je Stufe (Entschädigung, Stufe wird wiederholt).
# stuck: Chance, dass das Werkzeug klemmt (bergen oder aufgeben).
drilling:
  # Bohrtürme (0.2.15+7): Je Turm läuft eine Bohrung zugleich. Jacob startet mit
  # Silas' geliehenem Seilschlag-Turm; weitere kauft oder mietet er in Port Ellis.
  rigs:
    start: 1                # Türme zu Spielbeginn (der erste ist Silas' geliehener)
    max: 4                  # PLATZHALTER: höchstens so viele Türme
    buy: { cost: 2500, deliveryRounds: 1 }   # PLATZHALTER: Kaufpreis, Lieferung zur nächsten Runde
    rent: { costPerRound: 350 }               # PLATZHALTER: Miete je Runde, sofort da, jederzeit zurückzugeben
    assetShare: 0.5         # gekaufte Türme zählen zur Hälfte des Kaufpreises im Imperiumswert
    # Dampfmaschine statt Handwinde: jede Stufe 20 % billiger und eine Runde schneller (mind. 1).
    # Lohnt nach etwa 1.200 / (0,2 × 1.000) = 6 Bohrstufen – für wer viel bohrt.
    steam: { cost: 1200, costFactor: 0.8, roundsLess: 1 }
    # Stahlgestänge statt Manila-Seil: halb so viele Unfälle und klemmende Werkzeuge.
    # Spart im Schnitt (0,04·200 + 0,05·300)·0,5 ≈ 12 $ je Stufe 1, mehr in der Tiefe – eher Sicherheit als Rendite.
    rods: { cost: 600, riskFactor: 0.5 }
  accidentCost: 200       # PLATZHALTER: $ Entschädigung je Unfall
  fishingCost: 300        # PLATZHALTER: $ Bergung bei klemmendem Werkzeug
  stages:                 # PLATZHALTER; 1.15: Stufe 1 unter GDD (1.500–3.000 $), damit Tieferbohren mit der Startkasse geht
    - { depth: 300, cost: 1000, rounds: 1, oilShare: 0.7, accident: 0.04, stuck: 0.05 }
    - { depth: 600, cost: 1100, rounds: 1, oilShare: 0.2, accident: 0.08, stuck: 0.10 }
    - { depth: 900, cost: 1400, rounds: 2, oilShare: 0.1, accident: 0.15, stuck: 0.15 }

# Markt (GDD §7.3): Der Crane Trust kauft das Öl zum Posted Price. Der Preis
# entsteht jede Runde aus Angebot und Nachfrage am Salt Hill:
#   P = T · (N / A)^ε · S − k, begrenzt auf priceMin..priceMax, auf Cent gerundet.
# A = Förderung von Jacob und den Nachbarn in der Runde. Der neue Preis gilt ab
# der nächsten Runde. Alle Werte PLATZHALTER.
# 1.15: Ohne Jacob fällt der Preis über das Kapitel von etwa 1,30 $ auf etwa
# 0,70 $ (Überbohrung), aber nicht unter das Fuhrwerk. Darunter drückt ihn nur
# Jacobs eigene Förderung. Eine kleine Quelle ist etwa 5 % des Marktes.
market:
  basePrice: 1.00          # T: Trendpreis in $ je Barrel
  demand: 150000           # N: Nachfrage am Salt Hill in Barrel je Runde
  elasticity: 1.2          # ε: hoch = kleines Überangebot drückt den Preis stark
  shock: 1.0               # S: Schockfaktor (Ereignisse kommen später)
  regionalDiscount: 0.00   # k: Abschlag in $ je Barrel (Fracht läuft schon über transport)
  priceMin: 0.20           # Untergrenze in $ je Barrel
  priceMax: 1.60           # Obergrenze in $ je Barrel
  neighbours:              # Förderung der anderen Firmen am Salt Hill (bis es Rivalen gibt)
    startWells: 30         # Bohrtürme der Nachbarn in Runde 1
    newWellsPerRound: 1    # so viele kommen jede Runde dazu
    ratePerWell: 4000      # Barrel je Nachbarquelle und Runde
  newsThreshold: 0.10      # Preisänderung ab 10 % kommt ins Protokoll

# Transport (GDD §6): Fuhrwerk oder Bahn. Die Bahn gehört Augustus Thorne – sie
# ist billiger, aber Thorne kann den Tarif erhöhen, solange Jacob sie nutzt.
# capacity = höchstens so viele Barrel je Runde.
transport:
  wagon:
    label: Fuhrwerk
    costPerBarrel: 0.60     # PLATZHALTER: gemietete Fuhrleute, keine Fixkosten
    capacity: 3000          # PLATZHALTER
  rail:
    label: Bahn
    costPerBarrel: 0.25     # PLATZHALTER: Starttarif
    capacity: 20000         # PLATZHALTER
  # 0.2.15+2: eigene Fuhrwerke – Fixkosten je Runde, dafür billig je Barrel. Lohnt erst ab Menge:
  # gegen das Mietfuhrwerk ab ~460 bbl je Gespann und Runde, gegen die Bahn (0,25 $) erst ab ~1.700.
  # 0.2.15+4: 0,10 → 0,12 $ und Lohn 180 → 220 $ – vorher schlugen eigene Fuhrwerke in den Bot-Läufen jeden anderen Weg.
  teams:
    label: Eigene Fuhrwerke
    costPerBarrel: 0.12     # PLATZHALTER: Futter, Fässer, Verschleiß
    capacity: 2000          # PLATZHALTER: je Gespann und Runde
    wagePerRound: 220       # PLATZHALTER: Lohn je Gespann und Runde, auch wenn es steht
    hireCost: 250           # PLATZHALTER: Wagen und Ochsen, einmalig
    resale: 0.5             # Wer ein Gespann abgibt, bekommt diesen Anteil zurück
    maxTeams: 5
  # 0.2.15+2: kleine Pipeline zum Bahnhof/Hafen. Erst Route vermessen (surveyCost) – dann kommen
  # Briefe der Landbesitzer; mit allen Wegerechten (rights) kann gebaut werden.
  pipeline:
    label: Pipeline
    costPerBarrel: 0.03     # PLATZHALTER
    capacity: 40000         # PLATZHALTER
    surveyCost: 150         # Route vermessen
    buildCost: 6000         # PLATZHALTER
    buildRounds: 3          # GDD §6: 1–4 Runden
    upkeepPerRound: 120     # Streckenwärter
    rights:                 # Wegerechte: Merkzeichen aus content/events/, Name für den Schreibtisch, Figur aus map.yaml (deren Ranch die Route kreuzt)
      - { mark: wegerecht_moss, label: "Moss' Weide", figure: moss }
      - { mark: wegerecht_bahndamm, label: "Bahndamm (Witwe Pruitt)", figure: pruitt }
    sabotageChance: 0.08    # PLATZHALTER: je Runde, sobald sie läuft
    sabotageFactor: 2       # … × 2 bei Fehde mit Bullard oder Streit mit Thorne
    repairCost: 600
    repairRounds: 1         # so lange liegt sie nach einem Anschlag still
    guardsPerRound: 100     # Wachleute
    guardsFactor: 0.25      # … senken die Sabotage-Chance auf ein Viertel
  thorne:
    hikeChance: 0.30        # PLATZHALTER: Chance je Runde mit Bahnfracht (0.2.15+4: 0,20 → 0,30 – Thorne soll spürbar drücken, sonst lohnt kein anderer Weg)
    hikeStep: 0.15          # PLATZHALTER: Erhöhung in $ je Barrel (0.2.15+4: 0,10 → 0,15)
    maxTariff: 1.00         # PLATZHALTER: höchster Bahntarif (darf über dem Fuhrwerk liegen; 0.2.15+4: 0,80 → 1,00)
    # Verhandlung (Brief „Frachtvertrag“, rivals.thorne.contractRounds Runden):
    volumeDiscount: 0.08    # Mengenrabatt in $ je Barrel …
    minVolume: 5000         # … gegen Mindestabnahme je Runde (ab der Runde nach der Unterschrift) …
    shortfallPenalty: 0.10  # … sonst Strafe je fehlendem Barrel
    exclusivePenalty: 0.30  # Exklusivvertrag: Tarif eingefroren, jeder Barrel über einen anderen Weg kostet diese Strafe
    threatCut: 0.10         # Drohung mit Pipeline: senkt den Tarif – nur wenn sie glaubwürdig ist
    minTariff: 0.15         # tiefer geht Thorne nie
    threatCooldown: 4       # Runden bis zur nächsten Drohung
  # 0.2.15+2: zweiter Käufer – unabhängiger Händler in Port Ellis.
  trader:
    label: Händler in Port Ellis
    premium: 0.10           # PLATZHALTER: zahlt Posted Price + Aufschlag (ohne Cranes Abschlag)
    capacity: 2500          # PLATZHALTER: nimmt höchstens so viel je Runde
    grudgeCut: 0.05         # Crane merkt es sich: zahlt danach so viel weniger je Barrel …
    grudgeRounds: 2         # … so viele Runden nach dem letzten Händlerverkauf
  # 0.2.15+2: Lager. Was über die Tanks hinaus gefördert wird, läuft aus.
  storage:
    startCapacity: 15000    # PLATZHALTER: Jacobs Holztanks am Feld
    tankCapacity: 10000     # je zusätzlichem Tank
    tankCost: 400           # PLATZHALTER
    maxTanks: 6
    costPerBarrel: 0.01     # Lagerkosten je Barrel und Runde
    shrink: 0.02            # Schwund je Runde (Verdunstung, Lecks)
    fireChance: 0.02        # Brand je Runde mit Öl im Tank …
    fireLoss: 0.5           # … vernichtet diesen Anteil
  assetShare: 0.5           # Tanks, Gespanne und Pipeline zählen mit diesem Anteil ihrer Kosten zum Imperiumswert

# Bankkredit (GDD §8, §15). Der Rahmen wächst mit jeder fördernden Quelle, weil
# sie als Pfand dient. Der Jahreszins steht nach dem Rating der Bank; mit Pfand
# zahlt Jacob zwei Punkte weniger, ohne Sicherheit drei mehr. Reicht die Kasse
# für die Zinsen nicht, leiht Jacob automatisch zuerst bei der Bank (billiger);
# gibt die nichts mehr, leiht der Geldverleiher sofort und ohne Sicherheit, aber
# zu 40 % (Notkredit).
credit:
  startRating: B           # Rating, mit dem Jacob in Port Ellis ankommt
  minLoan: 500             # kleinster Kredit am Stück
  sliderStep: 100          # Schrittweite der Regler „Kredit aufnehmen“ und „Tilgen“ in der Bank
  limitBase: 5000          # Bankrahmen ohne Pfand (GDD §12: 3.000; 1.15: Platz für 3–4 Wildcat-Bohrungen)
  limitPerWell: 2000       # Rahmen je fördernder Quelle
  rates:                   # Jahreszins je Rating (GDD §12)
    A: 0.05
    B: 0.07
    C: 0.10
    D: 0.15
  collateralDiscount: 0.02 # fördernde Quelle als Pfand senkt den Zins um 2 Punkte
  unsecuredAdd: 0.03       # ohne Sicherheit steigt er um 3 Punkte
  # Das Rating folgt der Verschuldung (Anteil am Bankrahmen) und der
  # Zahlungshistorie (Runden, für die der Geldverleiher einspringen musste).
  usageC: 0.25             # bis hierher bleibt es bei B, PLATZHALTER
  usageD: 0.60             # darüber ist es D, PLATZHALTER
  missedC: 1               # eine Runde mit Notkredit/offenen Zinsen bringt C, PLATZHALTER
  missedD: 2               # zwei solche Runden bringen D, PLATZHALTER
  emergency:               # Notkredit vom Geldverleiher
    limit: 1000            # so viel leiht er insgesamt (GDD §12: 2.000; 1.15: Schuldenfalle muss zur Pleite führen können)
    rate: 0.40             # Jahreszins ohne Sicherheit

# Bankrott (GDD §8): Bargeld unter null ohne Kreditrahmen startet eine Frist.
# Wer sie übersteht, macht weiter; wer sie verstreichen lässt, ist pleite.
bankruptcy:
  graceRounds: 2           # Runden Frist, bevor es Konkurs gibt

# Imperiumswert (GDD §4): Kasse + Öl im Tank + Reserven im Boden − Schulden.
# Reserven zählen nur vorsichtig, weil Förderkosten und Risiko noch darin stecken.
empire:
  reserveFactor: 0.4       # GDD §4: Reserven im Boden vorsichtig bewertet

# Kapitelprüfung und Kapitelende (2.11, GDD §13, §14, §8 Börsengang).
# Geschafft ist Kapitel 1, wenn Jacob am Ende nicht bankrott ist (Kasse nicht im Minus)
# und der Imperiumswert mindestens goalValue beträgt ODER mindestens goalWells Quellen fördern.
# Texte und Boni: content/chapter.yaml. Wer das Ziel verfehlt, darf keine Aktien ausgeben.
chapter:
  goalValue: 50000         # GDD §13: Imperiumswert ab so viel $ …
  goalWells: 5             # … oder so viele fördernde Quellen
  ipo:
    shares: [0.2, 0.33, 0.49]  # GDD §8: zur Wahl stehende Anteile, die Jacob verkaufen kann (typisch 20–49 %)
    priceFactor: 0.8           # PLATZHALTER: Anleger zahlen Imperiumswert × Anteil × 0,8 (Abschlag für Risiko und Bankprovision)

# Bot-Läufe (GDD §17, Schritt 1.14/2.15): Partien ohne Grafik mit vier Strategien.
# Was die Bots damit machen, steht in src/sim/bots.ts. Alle Werte PLATZHALTER.
bots:
  games: 1000              # Partien je Strategie
  seedPrefix: bot          # Seeds bot-0, bot-1, … – für jede Strategie dieselben
  cautious: { minChance: 0.5, cashReserve: 500, maxStage: 2 }   # vorsichtig: Fundchance ab 50 %, 500 $ Rücklage, höchstens Stufe 2
  greedy: { minChance: 0.25, maxUndrilled: 1 }                 # gierig: pachtet ab 25 % Fundchance, hält höchstens 1 ungebohrte Pacht
  random: { actionsPerRound: 3, logisticsChance: 0.15 }         # zufällig: so viele Aktionen je Runde; mit 15 % je Runde eine zufällige Anschaffung (Tank, Gespann, Pipeline, Drohung …)
  # 2.15: ausgewogen ist der Standard-Bot – leiht, aber nur bis maxDebtShare des Bankrahmens.
  balanced: { minChance: 0.4, cashReserve: 300, maxStage: 3, maxDebtShare: 0.5, maxUndrilled: 1 }
  daysPerRound: 91         # ein Quartal; für die Anfangsrate in bbl/Tag (GDD §15)
  # Ereignisse (2.15): So bewerten die Bots eine Antwort – Geld zählt in $, dazu
  # strength = $ je Kraftpunkt, family = $ je Beziehungspunkt (Ruth, Thomas),
  # appointment = $ je Termin, overtimeFrom = Überstunden nur ab dieser Kraft (über 100 = nie).
  # Den Verkauf an Crane wählt kein Bot – die Partie läuft immer bis zum Kapitelende.
  events:
    cautious: { strength: 30, family: 20, appointment: 25, overtimeFrom: 101 }
    greedy: { strength: 5, family: 0, appointment: 5, overtimeFrom: 40 }
    balanced: { strength: 15, family: 10, appointment: 10, overtimeFrom: 70 }
  # Transport (0.2.15+4): So nutzen die planenden Bots Lager und Wege – jeder nach seinem Charakter.
  # trader never|always|calc · teams never|overflow|cheaper · pipelinePayback: Pipeline nur, wenn die erwartete
  # Ersparnis das Wievielfache der Kosten bringt (0 = nie) · thorne exclusive|volume|calc|refuse ·
  # guards never|always|enemies · holdShare: so viel bleibt im Tank, wenn der Preis gerade steigt ·
  # margin: nur verkaufen, wenn nach Fracht und Förderzins etwas übrig bleibt (gierig: Menge vor Marge).
  transport:
    cautious: { trader: never, teams: overflow, tanks: true, pipelinePayback: 2, thorne: exclusive, threaten: false, guards: always, holdShare: 0, margin: true }
    greedy: { trader: always, teams: overflow, tanks: true, pipelinePayback: 1, thorne: refuse, threaten: false, guards: never, holdShare: 0.5, margin: false }
    balanced: { trader: calc, teams: cheaper, tanks: true, pipelinePayback: 1.5, thorne: calc, threaten: true, guards: enemies, holdShare: 0, margin: true }
  # Investitionen (0.2.15+7): Amortisation laut src/sim/invest.ts (mit Felddruck und Preisdruck).
  # pumpPayback/wellPayback = höchstens so viele Runden, bis sich Pumpe/weiteres Bohrloch bezahlt machen
  # (0 = nie) · rigs = höchstens so viele Türme (ein weiterer nur, wenn lohnende Bohrlöcher auf einen Turm
  # warten) · rent = mieten statt kaufen · steam/rods = Turm nachrüsten (nur aus der Kasse, ab der ersten Quelle).
  # Justiert mit npm run bots: Ein zweiter Turm lässt den gierigen Bot schneller wildcatten – auf Kredit;
  # schon mit 3 Türmen ging er in 20 % der Partien pleite. Ausgewogen mit 2 Türmen gewann 43 % der Seeds (über 40 %).
  invest:
    cautious: { pumpPayback: 2, wellPayback: 3, rigs: 1, rent: false, steam: false, rods: true }
    greedy: { pumpPayback: 2, wellPayback: 4, rigs: 2, rent: true, steam: true, rods: false }
    balanced: { pumpPayback: 3, wellPayback: 4, rigs: 1, rent: false, steam: true, rods: true }
  rightsEstimate: 600      # grobe Schätzung der Bots: so viel kosten die Wegerechte für die Pipeline zusammen
  # Zielwerte Kapitel 1 (2.15, GDD §15 und §17): Toleranzbereich min–max je Kennzahl.
  # Was gemessen wird, steht in src/sim/bots.ts (TARGETS); die Tabelle Ist/Ziel in docs/botlaeufe.md.
  targets:
    winRate: { min: 0, max: 0.40 }            # höchste Siegquote einer Strategie (GDD §17: keine über 40 %)
    standardBankrupt: { min: 0, max: 0.15 }   # Pleitequote ausgewogen (Standard-Bot): Kapitel 1 ist der Einstieg
    greedyBankrupt: { min: 0.05, max: 0.45 }  # Pleitequote gierig (GDD §15: wer im Boom zu viele Schulden macht, stirbt; Crashs kommen erst später)
    cautiousBehind: { min: 0, max: 0.95 }     # Ø Imperium vorsichtig ÷ bester Ø der Mutigeren (GDD §15: wird überholt)
    standardGoal: { min: 0.20, max: 0.70 }    # Kapitelziel ausgewogen: erreichbar, aber nicht geschenkt
    smallRateInRange: { min: 0.90, max: 1 }   # Anteil kleiner Funde mit 50–500 bbl/Tag (GDD §15)
    gusherFactor: { min: 2, max: 20 }         # Ø Anfangsrate Gusher ÷ kleiner Fund (GDD §15: deutlich mehr)
    decline: { min: 0.08, max: 0.15 }         # gemessener Rückgang je Quartal (GDD §15: 8–15 %)
    wildcatHit: { min: 0.05, max: 0.25 }      # blinde Wildcat-Bohrung in Randlage auf 300 m (GDD §15: 1 von 5 bis 1 von 10)
    appointments: { min: 4.5, max: 5 }        # Ø Termine je Runde des Standard-Bots (GDD §15: 5 je Quartal)
    routeShare: { min: 0, max: 0.75 }         # 0.2.15+4: höchster Anteil eines Transportwegs an allen verkauften Barrel – kein Weg dominiert
    pipelineSuccess: { min: 0, max: 0.6 }     # 0.2.15+4: Anteil der Partien mit Kapitelziel (planende Bots), in denen eine Pipeline läuft
    # 0.2.15+8 Ausbau: Gute Quellen lohnen den Ausbau, aber „alles ausbauen“ ist keine Siegformel.
    expandedShare: { min: 0.05, max: 0.7 }    # Anteil der Ranches mit Fund (planende Bots) mit Pumpe oder weiterem Bohrloch
    investGain: { min: 1.02, max: 10 }        # Ø Imperium ausgewogen ÷ derselbe Bot ohne Ausbau (Investieren zahlt sich aus)
    allOutWins: { min: 0, max: 0.5 }          # Anteil der Seeds, in denen „alles ausbauen“ den Standard-Bot schlägt

# Rivalen (GDD §9.2, §15). Bullard pachtet und bohrt nach Gewinn-Formel.
rivals:
  bullard:
    name: '"Big" Jim Bullard'
    personality: { risk: 5, aggression: 5, loyalty: 5, grudge: 5, patience: 1 }
    startCash: 6000
    actionsPerRound: 1
    valuePerFind: 25000      # 1.16: vorher 8.000 – alte Größenordnung; ein kleiner Fund (Ø 31.500 bbl × ~0,8 $) bringt jetzt etwa 25.000 $
    riskWeight: 0.10
    nearJacobBonus: 300
    nearFindChance: 0.15
    noise: 1000              # 1.16: vorher 200, mit valuePerFind mitgezogen
    minUtility: 0
    drillRounds: 1
    ratePerWell: 4000        # Anfangsförderung je Quelle in Barrel je Runde; fällt wie bei Jacob um production.decline
    # Nachbesserung 0.1.14+3: statt pauschal 3.000 $ je Quelle und Runde verkauft Bullard
    # seine Förderung zum Posted Price: Förderung · (Preis · (1 − Förderzins) − Transport).
    transportPerBarrel: 0.40 # PLATZHALTER: $ je Barrel (eigene Fuhrwerke, zwischen Bahn 0,25 und Fuhrwerk 0,60)
    # 2.8: Bullard merkt sich Jacobs Antwort im Saloon (Merkzeichen, content/events/k1-rivalen.yaml).
    # Handschlag: Er pachtet nichts direkt neben Jacobs Land. Fehde (oder Verrat): Nachbarschaftsbonus × feudFactor.
    feudFactor: 2            # PLATZHALTER
  # 2.8 (GDD §9.2): Cornelius Crane, Crane Trust – diktiert den Posted Price und bietet am Kapitelende die Übernahme an.
  crane:
    name: Cornelius Crane
    priceCut: 0.10           # PLATZHALTER: Posted-Price-Druck – so viel $ je Barrel zahlt der Trust Jacob weniger …
    cutRounds: 4             # PLATZHALTER: … so viele Runden lang (ab der Runde nach der Antwort)
    allianceFactor: 0.5      # PLATZHALTER: mit Delgados Verband unabhängiger Produzenten nur die Hälfte
    takeoverPremium: 1.25    # PLATZHALTER: Übernahmeangebot = Imperiumswert × 1,25 …
    loyalPremium: 1.10       # PLATZHALTER: … nach einer Treueerklärung nur × 1,10 (er hat Jacob schon in der Tasche) …
    takeoverMin: 3000        # PLATZHALTER: … aber mindestens so viel $
  # 2.8 (GDD §9.2): Augustus Thorne, Thorne Rail & Trust Bank – Bahntarife (Erhöhung: transport.thorne).
  thorne:
    name: Augustus Thorne
    contractRounds: 6        # PLATZHALTER: Frachtvertrag – so viele Runden keine Tariferhöhung (ab der Unterschrift)
    refusedHikeFactor: 2     # PLATZHALTER: Vertrag abgelehnt – Thorne erhöht danach doppelt so oft
  # 2.8 (GDD §9.2): kleine Wildcatter im Hintergrund. Ihnen gehören die Nachbarquellen am Salt Hill
  # (market.neighbours) – sie ändern den Markt nicht, sie geben ihm Namen.
  wildcatters:
    min: 6                   # so viele kleine Firmen je Partie (mindestens …
    max: 8                   # … höchstens)
    names:                   # ENTWURF: Namen, aus denen jede Partie zieht (mindestens max Stück)
      - Ezra Pickett
      - Haskell & Dunn
      - Widow Carraway
      - Lars Lindqvist
      - Bascom Brothers
      - Caleb Shaw
      - Two-Rig Tilly
      - Jeb Merriwether
      - O'Rourke Drilling
      - Amos Fairweather

# --- 4.10 Andockpunkt: eigener Block diplomacy, bewusst neben rivals statt am Dateiende ---
# 4.10 Rivalen-Diplomatie und Crane-Nachfolge (GDD §9, §13 Kapitel 2). Eigenes Modul:
# src/sim/diplomacy*.ts. Erst ab Kapitel unlockChapter; in Kapitel 1 unsichtbar.
# Texte: content/diplomacy.yaml und content/events/k2-diplomatie.yaml.
# Alle Zahlen PLATZHALTER, bis Kapitel 2 spielbar ist und Bots darüber laufen.
diplomacy:
  unlockChapter: 2
  # Beziehungen (GDD §9.3): Vertrauen −100…+100 und Groll 0…100 getrennt; Verrat verfällt nie.
  relations:
    trustDrift: 2            # Vertrauen wandert je Runde so viele Punkte Richtung 0
    grudgeDecay: 4           # Groll verblasst je Runde um grudgeDecay × (6 − Nachtragen) / 5
    respectStart: 50         # Branchen-Respekt 0–100: wie sehr die Rivalen Jacobs Wort trauen
    betrayalTrust: 60        # Verrat: Vertrauen −60 beim Betrogenen …
    betrayalGrudge: 50       # … Groll +50 …
    betrayalRespect: 15      # … und Branchen-Respekt −15 bei allen
    revengeGrudge: 60        # ab diesem Groll schlägt ein Rivale zurück (GDD §9.5) …
    revengeChance: 0.3       # … je Runde mit dieser Chance × Aggressivität / 5
    revengeRounds: 2         # Rache wirkt so viele Runden
    revengePrice: 0.05       # Margaret/Pruett: Trust zahlt so viel $ je Barrel weniger
    revengeLeaseCost: 0.15   # Bullard/Delgado: Pachten so viel teurer (Anteil am Bonus)
    revengeRail: 0.03        # Thorne: Bahntarif dauerhaft so viel $ je Barrel höher
    revengeRelief: 25        # nach der Rache sinkt der Groll um so viel
    reconcileGrudge: 20      # Versöhnungsbrief nach einer Rache (Ereignis k2_rache_…): Groll − so viel
  # Persönlichkeiten (GDD §9.2, Skala 1–5); Bullard steht unter rivals.bullard.
  # kinds: welche Absprachen der Rivale überhaupt eingeht (price, territory, supply, cross).
  rivals:
    margaret: { personality: { risk: 4, aggression: 3, loyalty: 2, grudge: 3, patience: 4 }, kinds: [supply, cross] }
    pruett:   { personality: { risk: 1, aggression: 2, loyalty: 4, grudge: 3, patience: 5 }, kinds: [price, territory, cross] }
    bullard:  { kinds: [price, territory, cross] }
    thorne:   { personality: { risk: 3, aggression: 4, loyalty: 1, grudge: 4, patience: 4 }, kinds: [cross] }
    delgado:  { personality: { risk: 2, aggression: 2, loyalty: 5, grudge: 2, patience: 3 }, kinds: [] }
  # Startbeziehung aus Kapitel 1 (Merkzeichen aus content/events/k1-rivalen.yaml).
  carryOver:
    bullardPactTrust: 40     # Handschlag mit Bullard
    bullardFeudGrudge: 50    # Fehde
    craneLoyalTrust: 15      # Treueerklärung an Cornelius: beide Erben trauen Jacob etwas mehr
    delgadoMemberTrust: 30   # schon in Kapitel 1 in Delgados Verband
    thorneContractTrust: 15  # Frachtvertrag mit Thorne
    thorneRefusedGrudge: 20  # Frachtvertrag abgelehnt
  # Nachfolge im Crane Trust (GDD §13 Kapitel 2): Margaret Crane gegen Harold Pruett.
  succession:
    rounds: 8                # so viele Runden ringen beide um den Aufsichtsrat
    boardSeats: 12           # Sitze im Aufsichtsrat (nur Anzeige: Anteil × Sitze)
    startShare: 0.5          # Margarets Anteil im Aufsichtsrat zu Beginn
    creditDrift: 0.04        # Boom hilft Margaret, Krise Pruett: Anteil += creditDrift × (Kreditklima − 50) / 50
    noise: 0.06              # Zufall je Runde (± noise / 2)
    backCost: 1500           # Jacob stellt sich öffentlich hinter einen Erben: kostet so viel $ …
    backShift: 0.08          # … und verschiebt den Anteil um so viel (× Respekt-Faktor) …
    backAppointments: 1      # … und so viele Termine; einmal je Runde
    visitShift: 0.05         # Zusage beim Besuch (Ereignis) verschiebt den Anteil einmalig
    farewellTrust: 10        # Abschiedsbesuch bei Cornelius: beide Erben trauen Jacob mehr
    winnerTrust: 25          # Wer gewinnt, vergisst Jacobs Rückhalt nicht …
    loserGrudge: 20          # … wer verliert, auch nicht
    doubleGameTrust: 30      # beiden zugesagt: beide trauen Jacob danach so viel weniger
    congratsTrust: 10        # Glückwunsch an die Siegerin / den Sieger
    partnerTrust: 20         # Margaret führt: Partneraufschlag ab diesem Vertrauen – oder mit laufendem Liefervertrag/Kreuzbeteiligung
    margaretPremium: 0.06    # $ je Barrel, die Margarets Trust ihren Partnern mehr zahlt
    pruettCut: 0.05          # $ je Barrel, die Pruetts Trust allen weniger zahlt (Kostenkürzer) – außer Partnern einer Preisabsprache
    breakupPremium: 0.04     # zerschlagen: Crane Eastern und Crane Midland bieten gegeneinander, so viel $ je Barrel mehr
    # Zerschlagung (GDD §7.2): Druck sammelt sich je Runde; ab 1 wird der Trust zerschlagen.
    breakup:
      law: 0.2               # je Runde mit Kartellgesetz
      volksbund: 0.1         # je Runde, in der der Volksbund regiert
      mood: 0.15             # × (50 − Stimmung) / 50, nur bei Unmut
      decay: 0.05            # ohne Anlass sinkt der Druck je Runde
      push: 0.15             # Jacob schiebt an (Unterlagen an die Presse) oder bremst (Freunde in Hallstead)
      pushCost: 2000         # kostet so viel $ und einen Termin; einmal je Runde
      maxWithoutLaw: 0.9     # ohne Kartellgesetz keine Zerschlagung
  # Absprachen (GDD §9.4 Kooperation).
  pacts:
    appointments: 1          # ein Vorschlag am Schreibtisch kostet so viele Termine
    acceptThreshold: 15      # Zusage, wenn Vertrauen + Respekt-Bonus + Treue-Bonus − Groll ≥ diese Zahl
    respectWeight: 0.5       # Respekt-Bonus = respectWeight × (Respekt − 50)
    loyaltyWeight: 6         # Treue-Bonus = loyaltyWeight × (Vertragstreue − 3)
    acceptTrust: 5           # angenommenes Angebot: Vertrauen + so viel
    declineGrudge: 5         # abgelehntes Angebot: Groll + so viel
    rounds: 6                # eine Absprache gilt so viele Runden
    pricePremium: 0.08       # Preisabsprache: so viel $ je Barrel mehr
    territoryLeaseCost: 0.15 # Gebietsabsprache: Pachten so viel billiger (Anteil am Bonus)
    supplyPremium: 0.10      # Exklusiver Liefervertrag mit Crane Eastern: so viel $ je Barrel mehr …
    supplyBullardGrudge: 25  # … aber Bullard verliert seinen Abnehmer (GDD §9.7)
    crossCost: 3000          # Kreuzbeteiligung: so viel $ für die Aktien des anderen …
    crossShield: 0.25        # … und so viel Schutz vor Übernahmen (für 4.8)
    cartelHeat: 3            # Preis- und Gebietsabsprachen mit Kartellgesetz: Spur der Schwere 3
    cartelMood: 2            # jede laufende Kartellabsprache drückt die Stimmung um so viel (für 4.2)
    breakChance: 0.03        # Rivale bricht je Runde mit Chance breakChance × (6 − Vertragstreue) + Groll / 1000
    breakRounds: 2           # wer zuerst bricht, kassiert so viele Runden doppelt
    offerChance: 0.35        # je Runde schlägt ein Rivale mit dieser Chance selbst etwas vor …
    offerMaxGrudge: 40       # … aber nur, wenn sein Groll darunter liegt …
    offerMargin: 10          # … und er selbst fast zusagen würde: acceptScore ≥ acceptThreshold − offerMargin
    offerRounds: 2           # ein Angebot liegt so viele Runden auf dem Tisch
  # Übernahmen (GDD §9.4, §9.6): kleine Wildcatter kaufen; Pruett kauft in Krisen auf.
  takeovers:
    appointments: 1
    pricePerWell: 2500       # Kaufpreis je Quelle der Firma …
    premium: 0.2             # … plus Aufschlag
    barrelsPerWell: 300      # gekaufte Firma: Förderung je Quelle und Runde …
    costPerBarrel: 0.45      # … abzüglich Kosten je Barrel; der Rest geht an Jacob
    crisisCredit: 35         # Krise: Kreditklima unter diesem Wert
    pruettBuyChance: 0.3     # in der Krise kauft Pruett je Runde mit dieser Chance eine Firma (als Trustchef doppelt)
    distressPremium: 0.6     # Steht Jacob vor der Pleite, bietet Pruett Imperiumswert × 0,6 …
    distressMin: 5000        # … mindestens so viel $
    crisisHelpTrust: 5       # Jacob nimmt die Leute einer von Pruett geschluckten Firma auf: Delgado traut ihm mehr …
    crisisHelpGrudge: 5      # … Pruett grollt
  # Delgados Produzentenverband (GDD §9.2, §13 Kapitel 2).
  guild:
    foundDelay: 2            # Delgado gründet den Verband so viele Runden nach Kapitelbeginn
    startMembers: 12         # Mitglieder bei der Gründung
    fullMembers: 40          # ab so vielen Mitgliedern verhandelt der Verband mit voller Kraft
    growChance: 0.5          # je Runde kommt mit dieser Chance ein Mitglied dazu (mit Jacob zwei)
    dues: 150                # Beitrag je Runde
    premium: 0.06            # $ je Barrel mehr bei voller Kraft (gemeinsam gegen den Posted Price)
    leaveTrust: 10           # Austritt: Delgado traut Jacob so viel weniger
    tooBigValue: 600000      # ab diesem Imperiumswert ist Jacob für Delgado selbst ein Trust
    fightGrudge: 30          # Ausschluss im Streit: Delgados Groll + so viel
    outsiderLeaseCost: 0.1   # zu groß und nicht (mehr) im Verband: Unabhängige verpachten nur teurer
# --- Ende 4.10 Andockpunkt (Block diplomacy) ---

# Ereignis-System (2.1): Ereignisse stehen in content/events/, hier nur die Taktung.
events:
  maxPerRound: 1           # PLATZHALTER: höchstens so viele neue Ereignisse je Runde
  repeatCooldown: 3        # Wiederholungsschutz (2.10a): wiederkehrende Ereignisse und Varianten einer Gruppe frühestens nach 3 Runden wieder (ein Ereignis kann eigenen cooldown haben; höchstens guaranteeRounds, sonst stockt die Post-Garantie)
  # Posteingang (2.4, GDD §3): Briefe (mail: offer/demand/info/personal) kommen zusätzlich mit der Post.
  mail:
    maxPerRound: 1         # PLATZHALTER: höchstens so viele neue Briefe je Runde
    deadlineRounds: 2      # PLATZHALTER: Frist eines Briefs in Runden (Ankunftsrunde mitgezählt); letzte Runde = rotes Siegel
    guaranteeRounds: 6     # Kam von einer Briefart 6 Runden keiner, bringt die Post sicher einen (jede Art kommt so in jeder Partie)
  # Dokumentenprüfung (2.5, GDD §3): Briefe mit Dokument (Pachturkunde, Gutachten) können gefälscht sein.
  documents:
    forgeryChance: 0.5     # PLATZHALTER: Chance, dass ein Dokument gefälscht ist (ein Ereignis kann eigene forgeryChance haben)
    maxChecks: 2           # PLATZHALTER: so viele Felder prüft die Lupe je Dokument (sonst wäre alles prüfen zu leicht)
  # Befristete Nachwirkungen (0.2.15+3): Ereignis-Effekte price ($ je Barrel beim Crane Trust),
  # production (Anteil der eigenen Förderung) und leaseCost (Anteil am Pachtbonus) gelten so viele
  # Runden, die Antwortrunde mitgezählt. Dieselbe Wirkung aus demselben Ereignis zählt nur einmal.
  timedRounds: 4           # PLATZHALTER
  # Prüfung schwacher Antworten (0.2.15+3, npm run check:events): Eine Antwort ist spürbar, wenn sie
  # mindestens minShare × chapterMoney wert ist (hier 200 $), eine dauerhafte Wirkung hat (Tarif,
  # Fuhrwerke, Preis, Förderung, Pacht) oder ein Merkzeichen setzt, das später etwas abfragt.
  # Kraft und Familie zählen mit den Gewichten des Standard-Bots (bots.events.balanced), Öl zum Trendpreis.
  relevance:
    chapterMoney: 10000    # typisches Geld eines Kapitels: Startkasse 2.500 $, Kapitelziel 50.000 $ – grob die Kasse zur Mitte
    minShare: 0.02         # 2 % davon = 200 $
    refBarrels: 5000       # typischer Verkauf je Runde (eine kleine Quelle zur Kapitelmitte)
    refLeaseSpend: 1500    # typischer Pachtbonus in timedRounds Runden

# Termine und Kraft (2.3, GDD §3 und §4). Kraft ist für den Spieler nie als Zahl sichtbar.
agenda:
  appointments: 5          # Termine je Runde (GDD §3: zu Beginn 5 pro Quartal)
  maxOvertime: 2           # Überstunden: bis zu 2 Termine extra (GDD §3)
  overtimeCost: 5          # Kraft je Überstunde (GDD §4: −5 je Extra-Termin)
  restBonus: 5             # Kraft nach einer Runde ohne Überstunden (GDD §4: +5)
  tiredBelow: 50           # unter dieser Kraft … (GDD §4)
  tiredPenalty: 1          # … 1 Termin weniger je Runde
  strengthStart: 100
  strengthMax: 100         # Kapitel 1; sinkt mit dem Alter (90, 80, 70, 55) – kommt mit späteren Kapiteln
  # Schwellen (2.7, GDD §4): Was niedrige Kraft anrichtet.
  errorsBelow: 30          # unter 30: Fehler – die besten Antworten (sharp) fehlen, …
  errorsCheckPenalty: 1    # … und die Lupe prüft so viele Felder weniger
  sickBelow: 15            # unter 15 am Rundenende: Jacob wird krank (keine Termine, Ereignisse laufen ohne ihn)
  sickRoundsMax: 3         # krank 1–3 Runden: je tiefer die Kraft, desto länger (kein Zufall)
  collapseRounds: 4        # bei 0: Zusammenbruch, lange Krankheit (Tod und Erbfolge erst ab späteren Kapiteln)
  sickRecovery: 10         # PLATZHALTER: Kraft je Runde im Krankenbett (zusätzlich zur ruhigen Runde)

# Familie (2.7, GDD §12 und §4): Ruth und Thomas. Beziehung 0–100, angezeigt als Zustandswort.
# Texte stehen in content/family.yaml, Familientermine in content/events/.
family:
  ruthStart: 70            # PLATZHALTER: Beziehung zu Ruth bei Spielbeginn
  thomasBirthRound: 3      # Thomas kommt zu Beginn von Runde 3 zur Welt (Herbst 88; Ruth ist zu Spielbeginn schwanger)
  thomasStart: 70          # PLATZHALTER: Beziehung zu Thomas bei der Geburt
  neglect: 4               # PLATZHALTER: Beziehung −4 je Runde ohne Familienzeit (nicht, solange Jacob krank zu Hause liegt)
  strengthFrom: 3          # Familienzeit gibt am Rundenende Kraft: +3 bei kaputter …
  strengthTo: 8            # … bis +8 bei bester Beziehung (GDD §4: +3 bis +8)
  contentFrom: 60          # ab 60: zufrieden
  neglectedFrom: 35        # ab 35: vernachlässigt
  bitterFrom: 15           # ab 15: verbittert, darunter entfremdet

# Zeitung (2.6, GDD §7.2): Frühwarnzeichen. Die Zeitung schätzt den Posted Price,
# den der Trust am Ende der Runde festlegt, und zeigt nur eine Schlagzeile, nie die Zahl.
# Texte stehen in content/newspaper.yaml.
newspaper:
  fallFrom: 0.05           # PLATZHALTER: erwarteter Preisverfall ab 5 % → „Volle Tanks“ (die Nachbarn allein drücken ~4 % je Runde)
  crashFrom: 0.12          # PLATZHALTER: ab 12 % → „Tanks laufen über“
  riseFrom: 0.05           # PLATZHALTER: erwarteter Anstieg ab 5 % → „Leere Tanks“
  maxItems: 3              # Kurzmeldungen unter der Titelseite

# Einstieg (2.13): Tutorial-Hinweise führen durch Pacht, Bohrung und Verkauf.
# Texte stehen in content/tutorial.yaml; im Spiel lassen sie sich abschalten.
tutorial:
  lastRound: 8               # spätestens nach Runde 8 schweigen die Hinweise (halbes Kapitel)
  endAfterProducedRounds: 2  # fertig, wenn die erste Quelle 2 Runden gefördert hat (die Verkaufsrunde ist vorbei)
  deeperMinChance: 25        # PLATZHALTER: tiefer bohren nur raten, wenn der Geologe der nächsten Stufe mind. 25 % gibt
  loanRounding: 100          # vorgeschlagene Kredite auf 100 $ aufgerundet (mindestens credit.minLoan)

# Weltmodell (4.1, GDD §7.1): neun Weltgrößen, je Runde (Quartal) fortgeschrieben
# in src/sim/world.ts. Indizes: Nachfrage, Förderkapazität und Weltpreis starten
# bei 1; Kreditklima, Stimmung, Außenspannung, Technik und Nationalismus laufen
# von 0 bis 100. Drei Rückkopplungen: (1) Preis → Neubohrungen → Angebot → Preis
# (dämpft, aber verzögert), (2) Boom → Kredit → Spekulation → Crash (schaukelt
# sich auf), (3) Knappheit → Außenspannung → Aufrüstung → Nachfrage → Knappheit
# (schaukelt sich auf, bis Krieg). Zielwerte (GDD §15) einer Welt ohne Spieler je
# Kampagne (73 Jahre): 2–4 Kreditkrisen, 1–3 Ölschwemmen, 0–2 Kriege.
# Alle Werte PLATZHALTER; Verläufe prüft `npm run welt` (docs/weltmodell.md).
worldModel:
  start:                     # jede Kampagne würfelt ihre eigene Ausgangslage
    tech: { min: 6, max: 10 }
    credit: { min: 32, max: 62 }     # breit: Welten starten in verschiedenen Phasen des Kreditzyklus
    mood: { min: 48, max: 60 }
    tension: { min: 10, max: 28 }
    nationalism: { min: 8, max: 20 }
    handel: { min: 0.30, max: 0.42 }     # Anteile der Parteien vor dem Normieren: meist führt die Handelspartei,
    volksbund: { min: 0.24, max: 0.38 }  # in etwa jeder vierten Welt eine andere
    provinz: { min: 0.22, max: 0.36 }
  supply:                    # Schleife 1: Angebot & Lager
    elasticity: 1.4          # ε: Nachfrage/Förderung hoch ε → Preis
    stockNorm: 0.25          # normales Lager in Quartalsbedarf
    stockMax: 1.0            # mehr passt in keinen Tank – der Rest läuft aus
    stockWeight: 0.35        # wie stark volle Tanks den Preis drücken
    utilBase: 0.85           # Auslastung der Quellen bei normaler Knappheit (Weltpreis = Trendpreis)
    utilSlope: 0.4           # Knappheit über/unter 1 → mehr/weniger gefördert (drosseln)
    utilMin: 0.6
    depletion: 0.02          # so viel Kapazität versiegt je Runde
    investSlope: 0.04        # Neubohrungen je Punkt Knappheit über 1 (Anteil der Kapazität), dazu Ersatz und Wachstum
    investMax: 0.07
    delay: 6                 # Runden, bis eine Neubohrung fördert (Verzögerung der Schleife 1)
    creditInvest: 0.6        # Kreditklima 100 → 60 % mehr Neubohrungen, 0 → 60 % weniger
    findChance: 0.007        # Riesenfund je Runde → Ölschwemme
    findSize: { min: 0.12, max: 0.22 }   # so viel Kapazität kommt auf einen Schlag dazu
  demand:
    growth: 0.012            # Wachstum je Runde ohne Sättigung (Industrie, später Autos)
    cap: 9                   # Sättigung des Nachfrage-Index
    techBoost: 0.6           # Technik 100 → Wachstum × 1,6
    crashDrop: 0.08          # im Crash fehlt so viel Nachfrage
    warBoost: 0.12           # im Krieg kommt so viel dazu
    armsDemand: 0.06         # Aufrüstung: Außenspannung 100 → so viel mehr Nachfrage
  price:
    min: 0.35                # Weltpreis-Index höchstens auf ein gutes Drittel …
    max: 2.8                 # … und höchstens auf knapp das Dreifache
    techCost: 0.25           # Technik senkt den Trendpreis: +100 Punkte → −25 %
    trendMin: 0.5            # tiefer sinkt der Trendpreis nie
  tech:
    rate: 0.017              # logistisches Wachstum je Runde (Forschung aller Firmen)
  credit:                    # Schleife 2: Kreditklima
    boom: 4                  # Punkte je Runde bei doppelter Knappheit (Weltpreis = 2 × Trendpreis; Boom macht Banken mutig)
    speculation: 0.09        # über 50 schaukelt es sich auf: + speculation × (Klima − 50)
    revert: 0.05             # Rückkehr zur Mitte
    noise: 3.5
    handel: 0.3              # Regierung Handelspartei lockert je Runde
    volksbund: -0.4          # Regierung Volksbund: Bankaufsicht
    provinz: 0
    crashFrom: 68            # ab hier kann es kippen
    crashChance: 0.04        # Chance je Runde an der Schwelle …
    crashSlope: 0.5          # … plus so viel bei Klima 100
    priceTrigger: 0.2        # Preissturz ab 20 % in einer Runde kippt ein Klima …
    priceTriggerFrom: 60     # … über diesem Wert
    after: 0.35              # Klima nach dem Crash = Klima × after
    pipelineCut: 0.5         # im Crash wird so viel der Bohrungen im Bau weitergebaut (Rest gestoppt)
    investCut: 0.5           # solange der Crash nachwirkt, wird nur so viel neu gebohrt
    rounds: { min: 4, max: 8 }   # so lange wirkt ein Crash nach
  mood:
    speed: 0.2               # wie schnell die Stimmung ihrem Ziel folgt
    price: 25                # doppelte Knappheit → −25 Punkte (teures Benzin, teures Heizöl)
    crash: 18                # Arbeitslosigkeit im Crash
    war: 6
    boom: 8                  # Kreditklima 100 → +8 (Wohlstand)
    noise: 3
  politics:
    drift: 0.012             # Anteilsverschiebung je Runde und Stimmungsabstand (in 50 Punkten)
    noise: 0.012
    minShare: 0.1
    fatigue: 0.002           # Regierungsmüdigkeit: die regierende Partei verliert je Runde so viel
    revert: 0.01             # Anteile kehren langsam zur Mitte zurück (keine Partei verschwindet für immer)
    electionEvery: 16        # GDD §7.1: Wahlen alle 4 Jahre
  acts:                      # 4.2: Jacobs öffentliches Handeln, wirkt am Rundenende auf Stimmung (Punkte) und Parteianteile
    maxMood: 6               # je Runde höchstens ± so viele Stimmungspunkte aus Jacobs Handeln
    maxParty: 0.015          # … und höchstens so viel Anteil je Partei
    price_war:         { mood: -2.5, handel: -0.004, volksbund: 0.002, provinz: 0.006 }  # Preiskampf am Salt Hill: kleine Förderer rufen nach der Provinzliga
    field_fire:        { mood: -3,   handel: -0.003, volksbund: 0.006, provinz: 0 }      # Feldbrand: Rauch bis Port Ellis, Ruf nach Aufsicht
    strike:            { mood: -1.5, handel: -0.002, volksbund: 0.004, provinz: 0 }
    strike_break:      { mood: -3,   handel: 0,      volksbund: 0.008, provinz: 0 }      # Streikbrecher
    charity:           { mood: 1,    handel: 0,      volksbund: 0,     provinz: 0 }      # Spende für Kirche, Schule, Witwen
    support_handel:    { mood: 0,    handel: 0.006,  volksbund: 0,     provinz: 0 }      # Spende/Stimmen für eine Partei
    support_volksbund: { mood: 0,    handel: 0,      volksbund: 0.006, provinz: 0 }
    support_provinz:   { mood: 0,    handel: 0,      volksbund: 0,     provinz: 0.006 }
    press_praise:      { mood: 1,    handel: 0.002,  volksbund: 0,     provinz: 0 }      # freundliche Presse
    press_scandal:     { mood: -2,   handel: -0.003, volksbund: 0.003, provinz: 0 }      # Skandal in der Zeitung
  programs:                  # 4.2: wie streng die Regierung auf Verfehlungen schaut (Faktor auf Stimmung nach unten)
    handel: { scrutiny: 0.75 }    # niedrige Steuern, wenig Regulierung – man drückt ein Auge zu
    volksbund: { scrutiny: 1.5 }  # gegen Trusts, für Aufsicht – jeder Brand wird zum Thema
    provinz: { scrutiny: 1 }
  tension:                   # Schleife 3: Außenspannung
    base: 18                 # Ruhe-Niveau der Diplomatie
    revert: 0.04
    scarcity: 20             # Knappheit (Weltpreis ÷ Trendpreis) über scarcityFrom → Spannung steigt
    scarcityFrom: 1.1
    arms: 0.08               # Aufrüstung: + arms × (Spannung − armsFrom); ab gut 60 stärker als die Diplomatie
    armsFrom: 40
    nationalism: 0.02        # Nationalismus über nationalismFrom heizt die Lage an
    nationalismFrom: 50
    noise: 2.5
    warFrom: 70
    warChance: 0.03
    warSlope: 0.3
    warRounds: { min: 8, max: 16 }
    afterWar: 22
  nationalism:
    base: 15
    revert: 0.02
    drift: 0.12              # je Runde × Nachfrage-Index: je mehr Öl die Welt braucht, desto mehr Einmischung
    tension: 0.015           # × Außenspannung
    noise: 2
    nationalizeFrom: 80
    nationalizeChance: 0.06
    nationalizeLoss: 0.06    # so viel Förderkapazität geht bei einer Verstaatlichung verloren
    after: 40
  chapter1:                  # wie sanft Kapitel 1 die Welt spürt
    priceWeight: 0.5         # Posted Price-Trend: 1 + 0,5 × (Weltpreis − 1) …
    priceMaxDev: 0.15        # … höchstens ±15 %
    rateWeight: 0.01         # Kreditklima 0/100 → Zins +1/−1 Punkt
    crashRate: 0.02          # im Crash zwei Punkte mehr
    rateMaxAdd: 0.03
    nationalBarrels: 5000000 # Barrel je Runde, die der Weltindex 1 bedeutet (Salt Hill ist ein Bruchteil)
  news:                      # wann die Zeitung Zustände andeutet (keine Zahlen)
    creditEasy: 70
    creditTight: 30
    moodAngry: 32
    tensionHigh: 60
    pollFrom: 2              # 4.2: so viele Runden vor der Wahl druckt die Zeitung eine Umfrage

# Raffinerie und Produktmix (4.6, GDD §6) – ab Kapitel 2, in Kapitel 1 unsichtbar.
# Leistung = Kapazität × Technikstufe × Produktmix. Rohöl, das am Rundenende noch im
# Tank steht, geht bis zur eingestellten Menge in die Raffinerie; die Produkte gehen
# an den Großhandel. Logik: src/sim/refinery.ts, Texte: content/refinery.yaml.
# Alle Werte PLATZHALTER bis zu den Bot-Läufen für Kapitel 2.
refinery:
  unlockChapter: 2         # GDD §13: Raffinerie und Produktmix sind neue Mechanik in Kapitel 2
  buildCost: 150000        # $ für die erste Destillationsanlage (gut eingestellt in ~10 Runden bezahlt, achtlos in ~30; tools/raffinerieLaeufe.ts)
  buildRounds: 3           # Bauzeit in Runden
  unitCapacity: 25000      # bbl Rohöl je Runde und Ausbaustufe
  maxLevel: 4              # höchstens so viele Ausbaustufen
  expandCost: 80000        # $ je weitere Ausbaustufe
  expandRounds: 2          # Bauzeit je Ausbau (die alte Anlage läuft weiter)
  upkeepPerLevel: 2500     # Fixkosten je fertiger Ausbaustufe und Runde (Löhne, Kessel, Wache)
  operatingCost: 0.40      # $ je verarbeitetem Barrel Rohöl (Kohle, Chemikalien, Fässer)
  assetShare: 0.6          # Buchwert der Anlage im Imperiumswert (Anteil der Baukosten)
  fire:                    # GDD §6: Raffinerien brennen
    chance: 0.03           # je Runde, in der die Anlage läuft
    repairCost: 15000      # $
    repairRounds: 2        # so lange steht sie still
  sour:                    # GDD §6: saures Rohöl braucht mehr Verarbeitung und bringt weniger
    yieldLoss: 0.05        # zusätzlicher Verlust bei 100 % saurem Öl
    costAdd: 0.15          # $ je Barrel mehr bei 100 % saurem Öl
  crudeRef: 1.00           # Bezugs-Rohölpreis: Produktpreise hängen zu crudeLink am Posted Price
  worldDefaults:           # Bezugswelt: typische Welt zu Beginn von Kapitel 2 (Median aus 300 Welten nach 40 Runden,
                           # npm run welt); gilt auch, solange es kein Weltmodell gibt. Skalen wie state.worldModel (4.1).
    tech: 15               # Technikstand 0–100 (Kampagnenstart 6–10, nach 40 Runden ~12–17)
    tension: 20            # Außenspannung 0–100
    demand: 1.55           # Nachfrage-Index der Welt (effectiveDemand; Start 1, nach 40 Runden ~1,55)
  techs:                   # GDD §6: Technikstufen; Kapitel 2 kennt nur Stufe I
    - stage: 1
      label: Destillation
      loss: 0.05           # Verlust beim Destillieren (Gas, Rückstand)
      mix:                 # Spielraum je Produkt als Anteil der Ausbeute; Benzin ist Nebenprodukt (ca. 20 %)
        kerosene: { min: 0.35, max: 0.60 }
        lubricant: { min: 0.05, max: 0.15 }
        fuelOil: { min: 0.10, max: 0.35 }
        gasoline: { min: 0.15, max: 0.20 }
  startMix: { kerosene: 0.55, lubricant: 0.10, fuelOil: 0.15, gasoline: 0.20 }
  # Je Produkt: Grundpreis in $ je Barrel, Nachfrage des Großhandels in bbl je Runde (in der Bezugswelt),
  # Preiselastizität, Bindung an den Rohölpreis, Preisgrenzen (Anteil am Grundpreis).
  # Die Nachfrage aller Produkte zusammen (23.000 bbl) entspricht etwa der Ausbeute EINER
  # Ausbaustufe (25.000 bbl Rohöl − 5 % Verlust): Schon in Stufe I drückt ein schiefer Mix
  # oder zu viel Menge den Preis; erst wenn die Welt mehr Öl braucht, lohnt der Ausbau.
  # Der Startmix (viel Kerosin, viel Benzin) liegt bewusst daneben.
  # Wachstum: Das allgemeine Wachstum trägt der Nachfrage-Index der Welt (trend.demand =
  # Exponent auf Welt-Nachfrage / worldDefaults.demand). perYear ist nur die Verschiebung
  # des Produkts gegenüber dieser allgemeinen Ölnachfrage (Kerosin verliert Anteile,
  # Benzin gewinnt); tech und tension wirken je 50 bzw. 100 Punkte über der Bezugswelt.
  products:
    kerosene:              # dominiert zu Beginn, verliert mit der Elektrifizierung Anteile
      basePrice: 2.20
      demand: 11000
      elasticity: 1.0
      crudeLink: 0.3
      floor: 0.4
      ceiling: 1.2
      trend: { refYear: 98, perYear: -0.02, tech: -0.15, tension: 0, war: 0, demand: 1, min: 0.2 }
    lubricant:             # Maschinen und Eisenbahn: kleine Menge, guter Preis, schnell gesättigt
      basePrice: 3.60
      demand: 3000
      elasticity: 1.2
      crudeLink: 0.2
      floor: 0.4
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.0, tech: 0.10, tension: 0, war: 0.1, demand: 1, min: 0.2 }
    fuelOil:               # Marine, Eisenbahn, Industrie
      basePrice: 1.10
      demand: 5500
      elasticity: 1.0
      crudeLink: 0.5
      floor: 0.4
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.0, tech: 0.05, tension: 0.8, war: 0.6, demand: 1, min: 0.2 }
    gasoline:              # Nebenprodukt; gewinnt mit der Automobilisierung Anteile
      basePrice: 1.00
      demand: 3500
      elasticity: 1.3
      crudeLink: 0.3
      floor: 0.3
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.08, tech: 0.30, tension: 0, war: 0.3, demand: 1, min: 0.2 }

# 4.7 Fernleitungen (GDD §6, Kapitel 2): große Pipelines vom Feld zum Hafen oder Bahnhof.
# Route planen (gerade Trasse über die Karte) → vermessen → Wegerechte je Ranch verhandeln
# (Briefe der Landbesitzer, Querköpfe, Stadtrat, Thornes Bahnkreuzung) → Bau über 1–4 Runden.
# Eine fertige Leitung zum Hafen umgeht Thornes Bahn: Ihr Öl fließt über den Weg „Pipeline“
# (transport.pipeline.costPerBarrel), Thorne senkt den Tarif (Druck) – und schickt Saboteure.
# Eine Leitung zum Bahnhof ist billiger und ruhiger, bringt das Öl aber nur auf Thornes Gleise:
# Sie erhöht die Kapazität des Wegs „Bahn“, jedes Barrel zahlt weiter Thornes Bahntarif. Code: src/sim/bigPipeline.ts. Alle Zahlen PLATZHALTER bis zur Balance von Kapitel 2.
bigPipelines:
  fromChapter: 2            # in Kapitel 1 unsichtbar
  destinations:             # Landmarken aus content/map.yaml
    - { id: hafen, bypassesRail: true }              # Hafen Port Ellis: an Thornes Bahn vorbei – Weg „Pipeline“
    - { id: bahnhof_portellis, bypassesRail: false } # Bahnhof Port Ellis: Öl bleibt auf Thornes Gleisen – Weg „Bahn“ zu seinem Tarif
  surveyPerUnit: 60         # Vermessung je Karteneinheit Trasse
  costPerUnit: 3000         # Bau je Karteneinheit (Salt Hill → Hafen ≈ 17 Einheiten ≈ 51.000 $)
  unitsPerRound: 5          # Baufortschritt je Runde …
  minRounds: 1              # … aber immer 1–4 Runden (GDD §6)
  maxRounds: 4
  capacity: 120000          # bbl je Runde und fertiger Fernleitung (Hafen: Weg „Pipeline“, Bahnhof: Weg „Bahn“)
  upkeepPerUnit: 40         # Streckenwärter je Einheit und Runde
  maxProjects: 3
  smallUpgradeCost: 8000    # Anschluss an die kleine Pipeline aus Kapitel 1: ihre Strecke wird aufgeweitet (Wegerechte hat Jacob schon)
  rights:
    pricePerArea: 400       # fairer Preis eines Wegerechts je Einheit² Ranchfläche …
    minPrice: 500           # … mindestens so viel
    acceptBase: 0.55        # Grundchance, dass ein faires Angebot angenommen wird
    offerFactor: { low: 0.7, fair: 1.0, generous: 1.6 }
    offerBonus: { low: -0.25, fair: 0, generous: 0.25 }
    landowner: { neutral: 0, gierig: -0.10, verschuldet: 0.15, misstrauisch: -0.15, fromm: -0.05 }
    moodWeight: 0.005       # je Punkt öffentlicher Stimmung über/unter 50 (Weltmodell 4.1)
    reputationBonus: 0.10   # Jacob gilt als anständiger Verhandler (Ereignis „Querkopf“)
    thorneMeddling: 0.10    # Thorne hetzt die Landbesitzer gegen eine Leitung zum Hafen auf
    holdoutAfter: 2         # nach so vielen Absagen (oder einer Absage auf ein großzügiges Angebot) stellt er sich quer
    holdoutDemand: 3        # der Querkopf verlangt das Dreifache
    detourLength: 2         # Umweg um eine Ranch: so viele Einheiten mehr Trasse
    townPrice: 3000         # Stadtrat Port Ellis: Durchleitung durch die Stadt
    townAccept: 0.6
    railDemand: 25000       # Thornes Preis für die Kreuzung seiner Gleise
    courtCost: 3000         # Klage auf Kreuzungsrecht beim Bezirksrichter …
    courtRounds: 2          # … dauert so lange …
    courtChance: 0.5        # … und geht so oft gut aus (+ politischer Einfluss / 200)
    expropriateInfluence: 60 # Enteignung nur mit politischem Einfluss ab 60 (GDD §6, §10)
    expropriateShare: 0.5   # Entschädigung: halber fairer Preis
  sabotage:
    building: 0.06          # Chance je Runde im Bau …
    ready: 0.08             # … und im Betrieb …
    perUnit: 0.003          # … plus so viel je Einheit Trasse
    thorneFactor: 1.5       # Leitung zum Hafen: Thorne schickt Leute
    thorneFeudFactor: 1.5   # … noch mehr, wenn Jacob seinen Unterhändler hinausgeworfen hat
    truceFactor: 0.5        # Waffenstillstand mit Thorne
    rivalFactor: 1.5        # Fehde mit Bullard
    revengeFactor: 1.5      # nach Einschüchterung der Landbesitzer
    guardsPerUnit: 15       # Wachleute je Einheit und Runde …
    guardsFactor: 0.3       # … senken die Chance auf 30 %
    repairShare: 0.04       # Reparatur: Anteil der Baukosten
    repairRounds: 1         # so lange steht sie still (im Bau: eine Runde Verzug)
    maxChance: 0.6
  thorne:
    cut: 0.04               # Tarifsenkung je Runde bei vollem Druck ($ je Barrel): vom Starttarif 0,25 $ fünf Runden bis zum Boden
    minTariff: 0.08         # eigener Boden in Kapitel 2 (tiefer als transport.thorne.minTariff aus Kapitel 1)
    fullPressureCapacity: 60000 # ab so viel fertiger Kapazität zum Hafen ist der Druck voll
  carrier:                  # Transportpflicht-Gesetz (4.3): fremdes Öl gegen Gebühr
    fee: 0.05
    volume: 20000
  assetShare: 0.5           # Fernleitungen zählen mit diesem Anteil ihrer Baukosten zum Imperiumswert

# 4.8 Aktien, Aufsichtsrat, Anleihen (GDD §8) – ab Kapitel 2, in Kapitel 1 unsichtbar.
# Regeln: src/sim/stocks.ts, Zahlen lesen: src/sim/stocksBalance.ts, Namen und Texte: content/stocks.yaml.
# Der Börsengang selbst fällt am Ende von Kapitel 1 (chapter.ipo). Alle Werte PLATZHALTER bis zu den Bot-Läufen von Kapitel 2.
stocks:
  fromChapter: 2             # ab diesem Kapitel gibt es Aktienbuch und Anleihen
  totalShares: 1000          # Aktien beim Börsengang (Jacob behält 1 − verkaufter Anteil)
  # Kurs = Imperiumswert / Aktien × Stimmung. Die Stimmung (1 = fair) folgt Gewinn, Dividende,
  # Kreditklima (4.1: credit 0–100, 50 = normal) und öffentlicher Stimmung (mood) und zieht zurück zur 1.
  price:
    min: 1                   # tiefer fällt eine Aktie nie (in $)
    sentimentMin: 0.4
    sentimentMax: 1.8
    profitWeight: 0.5        # Wertzuwachs der Runde (Anteil, höchstens ±0,2) × dieses Gewicht
    creditWeight: 0.06       # Boom an der Börse hebt, Kreditklemme drückt (je voller Ausschlag)
    moodWeight: 0.04         # schlechte Stimmung im Land drückt
    noise: 0.04              # Gerüchte: zufälliger Ausschlag je Runde (±)
    reversion: 0.15          # so viel des Abstands zur 1 holt die Stimmung je Runde auf
  dividend:
    rates: [0.01, 0.03]      # wählbare Dividende: Anteil am Börsenwert (klein, groß)
    graceRounds: 4           # so lange ohne Dividende bleibt der Kurs ruhig (ein Jahr)
    missPenalty: 0.04        # danach je Runde ohne Dividende: Stimmung −0,04
    bonus: 0.03              # Runde mit Dividende: Stimmung +0,03
  issue:
    maxShare: 0.2            # höchstens so viele neue Aktien je Ausgabe (Anteil an allen Aktien)
    discount: 0.1            # neue Aktien gehen mit 10 % Abschlag auf den Kurs weg (Bankprovision)
    dilutionPenalty: 0.5     # Stimmung − Anteil neuer Aktien × 0,5
  buyback:
    premium: 0.1             # Rückkauf kostet Kurs + 10 %
    bonus: 0.2               # Stimmung + Anteil zurückgekaufter Aktien × 0,2
  # Aufsichtsrat: 5–9 Sitze (GDD §8). Sitze = seatsBase + verkaufter Anteil × seatsPerShare.
  board:
    seatsMin: 5
    seatsMax: 9
    seatsBase: 4
    seatsPerShare: 6         # 20 % → 5 Sitze, 49 % → 7 Sitze
    loyalFrom: 50            # ab dieser Treue (0–100) stimmt ein Rat mit Jacob
    weight: 0.6              # loyale Räte bringen diesen Anteil der Stimmen der freien Aktionäre mit
    gain: 3                  # Treue je Runde, in der die Agenda erfüllt ist …
    loss: 4                  # … und je Runde, in der sie verletzt ist
    maxDebtRatio: 0.3        # Agenda Sicherheit: Schulden höchstens 30 % des Imperiumswerts
    courtCost: 2000          # „Rat umstimmen“: Essen, Gefälligkeiten
    courtGain: 12            # … bringt so viel Treue (höchstens einmal je Runde)
    bigDecision: 0.25        # Anleihen über 25 % des Firmenwerts brauchen die Mehrheit (neue Aktien immer)
  # Forderungen des Aufsichtsrats: der unzufriedenste Rat verlangt etwas mit Frist.
  demands:
    chance: 0.35             # Chance je Runde ohne offene Forderung
    dueRounds: 3             # Frist in Runden
    dividendShare: 0.02      # Forderung Dividende: so viel vom Börsenwert
    debtCut: 0.25            # Forderung Schulden: um ein Viertel senken
    buybackShare: 0.03       # Forderung Rückkauf: so viele Aktien
    issueShare: 0.1          # Thornes Mann fordert so viele neue Aktien
    fulfillGain: 15          # zugesagt und erfüllt: Treue +15
    quietGain: 5             # erfüllt, ohne vorher zuzusagen: nur +5 (die Zusage zählt)
    failLoss: 20             # zugesagt, aber nicht erfüllt – oder die Zusage zurückgezogen: −20
    rejectLoss: 10           # abgelehnt oder ignoriert: −10
    # Thornes Mann fordert eigens (nicht als „unzufriedenster Rat“, seine Treue ist immer 0):
    spyChance: 0.15          # Chance je Runde ohne offene Forderung, solange Thorne im Rat sitzt
    spyPenalty: 0.08         # abgelehnt oder ignoriert: Thornes Zeitungen streuen Gerüchte, Stimmung der Börse −0,08
  # Thorne und die Strohmänner (GDD §8, §13: „zu viele Aktien verkauft – Thorne kauft sich über Strohmänner ein“).
  thorne:
    minOutside: 0.4          # erst wenn mindestens 40 % der Aktien nicht bei Jacob liegen, kann Thorne unbemerkt kaufen
    buyChance: 0.5           # Chance je Runde, dass er zukauft
    buyShare: 0.03           # so viele Aktien (Anteil an allen) je Kauf
    hostileFactor: 1.5       # hat Jacob ihn in Kapitel 1 abgewiesen (hostileMarks), kauft er so viel mehr
    hostileMarks: [thorne_abgelehnt]
    cheapBelow: 0.8          # Stimmung unter 0,8: Die Aktie ist billig – Thorne kauft doppelt
    floatKeep: 0.05          # so viel bleibt immer bei den Kleinaktionären
    maxStake: 0.45           # mehr will er nicht
    seatPer: 0.1             # je 10 % Anteil bekommt Thorne einen Sitz im Aufsichtsrat (sein Mann)
    maxSeats: 3
    investigateCost: 1500    # Detektei durchleuchtet das Aktienbuch: alle Strohmänner fliegen auf
    pressure: 2              # je Runde und je Mann Thornes im Rat verliert jeder andere Rat so viel Treue (er bearbeitet sie)
    blockFrom: 0.25          # Sperrminorität: ab diesem Anteil blockiert Thorne Rückkäufe (Jacobs Mittel im Stellvertreterkampf)
  # Misstrauensvotum und Stellvertreterkampf (GDD §8): nur wenn die Kontrolle unter 50 % liegt.
  vote:
    lookback: 2              # Kurs der letzten 2 Runden …
    dropFrom: 0.15           # … um 15 % gefallen, oder …
    moodBelow: 30            # … die Stimmung im Land (Skandale) unter 30
    proxyRounds: 2           # Stellvertreterkampf: so viele Runden Zeit
    pressCost: 1500          # Kleinaktionäre über die Presse mobilisieren …
    pressBonus: 0.04         # … bringt so viel Kontrolle (bis zum Ende des Kampfs)
  # Anleihen (GDD §8: ab Kapitel 2, große Summen, fester Zins, Zinsen laufen auch in Krisen).
  bonds:
    sizes: [10000, 25000, 50000]
    terms: [8, 12]           # Laufzeit in Runden (2 oder 3 Jahre)
    baseRate: 0.05           # Jahreszins …
    spreads: { A: 0, B: 0.01, C: 0.03 }  # … plus Aufschlag nach Rating (D: niemand zeichnet)
    climateSpread: 0.03      # … plus bis zu 3 Punkte in der Kreditklemme (credit 0), minus bis zu 3 im Boom (credit 100)
    minRate: 0.03
    fee: 0.02                # Bankprovision beim Ausgeben
    perRound: 1              # höchstens so viele neue Anleihen je Runde
    limitShare: 0.5          # Rahmen: alle Anleihen zusammen höchstens 50 % des Imperiumswerts …
    limitMin: 25000          # … aber mindestens so viel (damit auch eine kleine Firma eine Anleihe bekommt)
    loadSpread: 0.03         # Zinsaufschlag: je voll ausgeschöpftem Rahmen +3 Punkte (Anleihen-Quote nach der neuen Anleihe)

# Personal (4.9, GDD §11 und §3): Sekretärin/Prokurist und Fixer ab Kapitel 2, Richtlinien
# statt Mikromanagement, Loyalität und Löhne. Namen, Merkmale und Texte stehen in
# content/staff.yaml, die Regeln in src/sim/staff.ts und src/sim/staffRound.ts.
# Alles PLATZHALTER – Balance klärt sich mit den Bot-Läufen für Kapitel 2.
staff:
  unlockChapter: 2           # ab Kapitel 2 sichtbar (GDD §11); in Kapitel 1 gibt es kein Personal
  hireAppointments: 1        # Vorstellungsgespräch: 1 Termin (GDD §3: Besucher empfangen)
  recognitionAppointments: 1 # persönliche Anerkennung: 1 Termin (GDD §11)
  candidatesPerRole: 2       # so viele Bewerber je Stelle liegen auf dem Tisch
  candidateRefreshRounds: 4  # alle 4 Runden kommen neue Bewerbungen
  revealRounds: 4            # so lange ist die Kompetenz nur ungefähr (±1) sichtbar (GDD §11)
  namePool: 6                # Namen je Stelle in content/staff.yaml (muss passen)
  candidate:                 # wie Bewerber gewürfelt werden
    competence: { min: 1, max: 5 }
    ambition: { min: 1, max: 5 }
    secondTraitChance: 0.35  # Anteil mit zwei Merkmalen (GDD §11: 1–2)
  wage:
    secretary: 120           # $ je Runde bei Kompetenz 3, Lohnstufe „Markt“
    fixer: 220
    competenceStep: 0.15     # je Kompetenzstufe über/unter 3: ±15 %
    creditSensitivity: 0.004 # Lohnniveau folgt dem Kreditklima (4.1): je Punkt über 50 +0,4 %
    severanceRounds: 1       # Abfindung bei Entlassung: ein Rundenlohn
    # Lohn-Richtlinie (GDD §11 „Löhne 10 % über Markt“): Faktor und Loyalität je Runde.
    levels:
      - { id: knapp, factor: 0.9, loyalty: -3 }
      - { id: markt, factor: 1.0, loyalty: 0 }
      - { id: gut, factor: 1.1, loyalty: 2 }
      - { id: grosszuegig, factor: 1.25, loyalty: 4 }
    startLevel: markt
  loyalty:
    start: 60                # Loyalität 0–100 beim Einstellen
    recognition: 8           # persönliche Anerkennung (ein Termin, einmal je Runde und Person)
    cut: 10                  # Lohnkürzung: sofort minus
    scapegoat: 6             # ein Kollege wird entlassen: die anderen minus
    illegalOrder: 15         # Gewissenhafte bekommen einen schmutzigen Auftrag
    conscience: 2            # Gewissenhafte bei hoher Hitze: je Runde minus (sie sehen, was läuft)
    ambitionDrift: 1         # je Ehrgeiz über 3: minus je Runde (keine Beförderung)
    genieSwing: 4            # Genie ist launisch: ± so viel je Runde
    loyalFloor: 40           # „Treu bis zum Tod“ fällt nie darunter
    poachBelow: 35           # darunter kann ein Rivale abwerben …
    poachChance: 0.15        # … mit dieser Chance je Runde (Gierige doppelt)
    betrayBelow: 25          # darunter und …
    betrayAmbition: 4        # … ab diesem Ehrgeiz droht Verrat …
    betrayChance: 0.2        # … mit dieser Chance je Runde
    words:                   # Zustandswörter: ab diesem Wert
      treu: 75
      zufrieden: 50
      unzufrieden: 25        # darunter: abtrünnig
  secretary:
    extraAppointments: 1     # Termine mehr je Runde (GDD §3: 5, mit Sekretärin bis zu 7) …
    extraFromCompetence: 4   # … ab dieser Kompetenz einer mehr
    drunkChance: 0.2         # Trinker: Aussetzer in einer Runde (kein Extra-Termin, keine Post, kein Verkauf)
    judgementNoise: 200      # $ Fehleinschätzung je Antwort bei Kompetenz 1 (bei 5: keine)
    greedChance: 0.25        # Gierig: Chance je Verkauf, dass ein Teil verschwindet …
    greedSkim: 0.1           # … so viel vom Erlös
    charmBonus: 0.03         # Charmant: $ je Barrel mehr beim Verkauf nach Regel
    mailSpendLimit: 100      # Start-Richtlinie: Antworten bis 100 $ darf das Vorzimmer selbst geben
  sales:
    minPrice: 1.0            # Start-Richtlinie: Mindestpreis beim Trust in $ je Barrel
    share: 0.5               # Start-Richtlinie: so viel vom Tank je Runde
    misjudgeChance: 0.3      # bei Kompetenz 1 hält sich das Vorzimmer nicht an die Regel (bei 5: nie; Spieler doppelt)
  fixer:
    defense: 0.6             # Sabotage gegen Jacob × (1 − defense × Kompetenz/5)
    heatDecay: 5             # Hitze sinkt je Runde …
    heatDecayDiscreet: 10    # … beim Verschwiegenen schneller
    scandalFrom: 60          # ab dieser Hitze droht ein Skandal …
    scandalChance: 0.25      # … mit dieser Chance je Runde
    scandalFine: 500         # Geldstrafe und Schweigegeld
    scandalCool: 30          # danach ist es so viel kühler
    leakHeat: 30             # Verrat eines Fixers / Whistleblower: Hitze plus
    eventHeat: 15            # ein Brief schickt den Fixer los (Merkzeichen fixer_auftrag_brief): Hitze plus
    words:                   # Hitze als Wort: ab diesem Wert
      lauwarm: 20
      heiss: 60
    orders:                  # Aufträge (GDD §11: Spionage, Sabotage – und Hitze)
      spy: { cost: 150, heat: 10, successMin: 0.4, successMax: 0.95 }
      sabotage: { cost: 300, heat: 25, successMin: 0.25, successMax: 0.85, rivalCash: 400, delay: 1, caughtHeat: 15 }
