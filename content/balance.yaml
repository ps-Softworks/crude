# Spielzahlen für den Prototyp.
# PLATZHALTER: grob geschätzt, werden durch das Tabellenmodell (Schritt 0.6)
# und den Papierprototyp (0.7–0.9) ersetzt. Nur hier ändern, nicht im Code.

start:
  cash: 2500          # $ Bargeld bei Spielbeginn (GDD §13: 2.000; 1.15: zwei Startbohrungen müssen drin sein)
  year: 88            # Jahr der Föderation
  rounds: 16          # Runden in Kapitel 1 (ein Quartal pro Runde)

# Ranches und Farmen (0.2.15+5): Das bohrbare Land (Gebiete in content/map.yaml) wird
# je Seed in unregelmäßige Grundstücke zerlegt (src/sim/ranches.ts). Karteneinheit ≈ alte Rasterparzelle.
ranches:
  spacing: 1.7        # Abstand der Hofstellen
  jitter: 0.8         # Versatz als Anteil des Abstands – höher = unregelmäßiger
  relax: 2            # Glättungsrunden (Lloyd)
  minArea: 0.6        # kleinere Reste gehen an die Nachbarn
  minEdge: 0.15       # so lang muss eine gemeinsame Grenze sein, damit Ranches Nachbarn sind
  slotArea: 1.5       # Fläche je Bohrplatz; Reserven und Pachtbonus aus diesem Block gelten für so viel Fläche
  maxSlots: 5         # mehr Bohrlöcher passen auf keine Ranch
  sizes:              # Größenklassen der Hofstellen: Anteil und Gewicht (größer = mehr Land)
    - { share: 0.40, weight: 0 }      # Kleinfarm
    - { share: 0.40, weight: 0.35 }   # Weide
    - { share: 0.20, weight: 0.9 }    # große Ranch

# Geologie je Zone (Profil „salzdom“ in content/map.yaml). Die Zone hängt vom Abstand
# der Ranch-Mitte zur Mitte des Salzdoms ab (in Karteneinheiten). Reserven gelten je
# ranches.slotArea Fläche – größere Ranches haben entsprechend mehr Öl.
# Wahrscheinlichkeiten pro Zone müssen zusammen 1 ergeben.
geology:
  # Termine als Hauptwerkzeug (Etappe 1): Jede Ranch hat eine verdeckte Fundchance q =
  # Grundwert der Zone (base, öffentliches Wissen) + Salzrücken-Aufschlag bzw. -Abschlag + Rauschen.
  # base ersetzt das frühere dry (Kern 0,30 / Ring 0,40 / Rand 0,85 trocken). prior ist, was jeder
  # über die Zone weiß (Ø q der Zone): Startwert der Erkundung und Bullards Bild. small : gusher ist
  # nur noch das Verhältnis der Fundarten, wenn Öl da ist.
  zones:
    - name: kern
      maxDistance: 2.5     # 0.2.15+5: Ranch-Mitten statt Rasterfelder (vorher 1,5)
      base: 0.50           # PLATZHALTER (Etappe 1): auf dem Rücken ≈ 80 %, daneben ≈ 30 %
      prior: 0.58          # öffentliches Wissen = Ø q der Zone (gemessen über 500 Seeds); Startwert der Erkundung
      small: 0.55
      gusher: 0.15
    - name: ring
      maxDistance: 5.0     # 0.2.15+5: vorher 3,5 – Anteil Kern/Ring/Rand an den Ranches etwa wie früher an den Feldern
      base: 0.40           # PLATZHALTER (Etappe 1): auf dem Rücken ≈ 70 %, daneben ≈ 20 % (Plan: 0,35 – damit lag das Kapitelziel aller Bots zu tief)
      prior: 0.41
      small: 0.52
      gusher: 0.08
    - name: rand
      maxDistance: 99
      base: 0.15           # PLATZHALTER (Etappe 1): auf dem Rücken ≈ 45 %, daneben ≈ 3 %; blinde Wildcat-Bohrung bleibt bei 1 von 5 bis 1 von 10 (GDD §15)
      prior: 0.12
      small: 0.14
      gusher: 0.01
  # Salzrücken je Gebiet (fest aus dem Seed, nicht im Spielstand). Eine Linie läuft durch einen Punkt
  # offsetMin–offsetMax vom Salzdom in zufälliger Richtung, halfLength zu beiden Seiten.
  trends:
    perRegion: 2           # PLATZHALTER
    radius: 1.2            # PLATZHALTER: bis zu diesem Abstand liegt eine Ranch „auf dem Rücken“
    bonus: 0.30            # PLATZHALTER
    offTrend: -0.20        # PLATZHALTER (Plan: −0,10; damit hätte kaum eine Kernranch q ≤ 30 %)
    noise: 0.10            # PLATZHALTER (Plan: 0,08)
    qMin: 0.03
    qMax: 0.85
    offsetMin: 1.5         # PLATZHALTER: Rücken an der Flanke des Doms, nicht mitten hindurch
    offsetMax: 4.0
    halfLength: 6
  # Förderbare Gesamtmenge in Barrel (gleichverteilt zwischen min und max).
  # 1.15: deutlich angehoben (vorher 2.000–12.000 und 30.000–120.000), damit die Anfangsrate im GDD-Rahmen liegt
  # (kleiner Fund 50–125 bbl/Tag, Gusher 200–650 bbl/Tag).
  reserves:
    small:
      min: 18000
      max: 45000
    gusher:
      min: 60000
      max: 200000

# Pacht (GDD §5, §15). Bonus und Förderzins hängen von der Lage zum nächsten
# bekannten Fund und vom Landbesitzer ab.
lease:
  termRounds: 4         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  delayRental: 25       # PLATZHALTER: $ Verzögerungszins je ungebohrter Pacht und Runde
  royaltyMin: 0.10      # Förderzins wird auf 10–25 % begrenzt
  royaltyMax: 0.25
  bonusRounding: 10     # Bonus und Optionsgebühr auf 10 $ gerundet
  # Lage nach Abstand zum nächsten bekannten Fund, in Nachbarschaftsschritten
  # (gemeinsame Grenze = 1). Der Bonus gilt je ranches.slotArea Fläche: große Ranches kosten mehr.
  # Nach maxDistance aufsteigend sortiert; die letzte Lage gilt für den Rest.
  locations:
    - name: amFund
      label: Am Fund
      maxDistance: 1
      bonus: 4000         # 0.2.15+5: je Standardfläche (vorher 8.000 je Rasterfeld; eine Ranch hat im Schnitt 2 Standardflächen)
      royalty: 0.20
    - name: nachbar
      label: Nachbar eines Funds
      maxDistance: 2
      bonus: 500           # 1.15: vorher 2.000 – sonst bleibt Nachbarland vor dem ersten Fund unbezahlbar; 0.2.15+5: je Standardfläche (vorher 1.000 je Feld)
      royalty: 0.1666667  # 1/6
    - name: randlage
      label: Randlage
      maxDistance: 99
      bonus: 80            # 0.2.15+5: je Standardfläche (vorher 150 je Feld)
      royalty: 0.125
  # Landbesitzer: weight = Häufigkeit (vorerst alle gleich),
  # bonusFactor multipliziert den Lagebonus, royaltyAdd kommt auf den Förderzins.
  landowners:
    - name: neutral
      label: neutral
      weight: 1           # PLATZHALTER
      bonusFactor: 1.00
      royaltyAdd: 0
    - name: gierig
      label: gierig
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: 0.03
    - name: verschuldet
      label: verschuldet
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: -0.03
    - name: misstrauisch
      label: misstrauisch
      weight: 1           # PLATZHALTER
      bonusFactor: 1.50
      royaltyAdd: 0
    - name: fromm
      label: fromm
      weight: 1           # PLATZHALTER
      bonusFactor: 0.90
      royaltyAdd: 0
  # Pachtoption: sichert Bonus und Förderzins für kurze Zeit.
  option:
    feeShare: 0.10        # PLATZHALTER: Gebühr = Anteil am Bonus
    termRounds: 2         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  # Jacob beginnt mit freien Optionen auf Ranches in Randlage.
  startOptions:
    count: 2              # PLATZHALTER
    termRounds: 4         # PLATZHALTER
    # Startquelle (0.4.20+26): Die erste Startoption liegt auf einer Ranch mit sicherem Öl in der ersten
    # Stufe (300 m) – eigene kleine Lagerstätte, ohne Unfall und Klemmen beim ersten Loch. Die Prognose
    # zeigt „Öl sicher“. sureReserves = Barrel in dieser Lagerstätte (gemessen: tools/startquelle.ts).
    # Die zweite Option bleibt Zufall.
    # Gemessen (docs/startquelle.md): Ab etwa 25.000 bbl findet der Einsteiger, der nur mit eigenem Geld sucht,
    # in 91 % der Partien eine zweite Quelle (6.000 → 60 %, 15.000 → 85 %, 40.000 → 93 %); mehr bringt kaum noch etwas.
    sureReserves: 25000
    # Anfangsrate der Startquelle je Runde als Anteil von sureReserves – fest, nicht nach Ranchgröße (sonst
    # leerte eine kleine Ranch die Quelle in 4 Runden, eine große hielt das ganze Kapitel). Mit decline 0,09
    # fördert ein Loch so etwa 12 Runden: 0,13 × (1 − 0,91^12) ÷ 0,09 ≈ 1.
    sureRateShare: 0.13

# Förderung (GDD §5). Das Öl liegt in Lagerstätten, die mehrere Ranches
# umfassen. Jede Quelle startet mit einem Anteil der Reserve je Standardfläche (ranches.slotArea) ihrer Ranch und fällt je
# Quartal. Das Feld ist gemeinsam: Mehr als freeWells Quellen senken den Druck
# aller Quellen und verringern die Gesamtausbeute des Feldes.
production:
  # Anfangsrate je Runde als Anteil der Reserve je Standardfläche der eigenen Ranch – für
  # kleine Funde und für Gusher je eigener Wert.
  initialRateShare:
    small: 0.25              # PLATZHALTER
    gusher: 0.30             # PLATZHALTER
  decline: 0.09              # Rückgang je Quartal (GDD: 8–15 %); Frühes Öl (0.4.4+): vorher 0,10 – mehr Quellen je Feld drücken den Druck, gemessen kamen 15,7 % heraus; 2.15: vorher 0,12 – gemessen kamen mit Druckverlust und leeren Feldern 14,5 % heraus
  freeWells: 4               # PLATZHALTER: so viele Quellen verträgt ein Feld ohne Druckverlust
  pressureLossPerWell: 0.15  # PLATZHALTER: Druckverlust je Quelle über freeWells
  pressureMin: 0.40          # PLATZHALTER: tiefster Druckfaktor
  recoveryLossPerWell: 0.06  # PLATZHALTER: Ausbeuteverlust des Feldes je Quelle über freeWells
  recoveryLossMax: 0.30      # GDD: Überförderung senkt die Ausbeute um bis zu 30 %
  # Pumpe (0.2.15+7): nachrüsten an einer fündigen Quelle. +25 % Rate und die Hälfte des
  # Druckverlusts aufgefangen – aber 400 $ Unterhalt je Runde. Beispiel: gute Quelle 10.000 bbl,
  # 0,90 $ netto → +2.500 bbl ≈ 2.250 $ − 400 $ = 1.850 $ je Runde, bezahlt nach 3 Runden.
  # Müde Quelle 2.000 bbl, 0,60 $ netto → +500 bbl ≈ 300 $ – weniger als der Unterhalt, lohnt nie.
  pump: { cost: 4000, upkeep: 400, rateFactor: 1.25, pressureKeep: 0.5 }

# Geologe (GDD §5): Er nennt nie die wahre Fundchance, sondern eine
# Bandbreite. Je genauer und je weniger verzerrt, desto eher deckt sie die
# Wahrheit ab.
forecast:
  widthMax: 50            # PLATZHALTER: breiteste Bandbreite in Prozentpunkten
  widthMin: 10            # PLATZHALTER: schmalste Bandbreite (bester Geologe)
  rounding: 5             # PLATZHALTER: Bandbreitengrenzen auf 5 Prozentpunkte runden
  geologist:
    accuracy: 3           # PLATZHALTER: Genauigkeit 1–5
    bias: 0               # PLATZHALTER: Verzerrung −15 bis +15 Punkte
  # Spielspaß K1 (Tieferbohren): Nach einer trockenen Stufe schätzt der Geologe die nächste
  # aus dem Bohrklein – Fehler relativ zur Chance (± 40 %), Bandbreite 50 % der Mitte, auf 1 Punkt
  # gerundet. Vorher galt die breite 30-Punkte-Spanne: Bei 5–10 % echter Chance wurde sie an 0 %
  # abgeschnitten, die Mitte zeigte im Schnitt 17,6 % bei 8,9 % echten Treffern.
  deeper: { error: 0.4, width: 0.5, rounding: 1 }

# Erkundung (Termine als Hauptwerkzeug, Etappe 1): Wer übers Land reitet, Farmer fragt oder einen
# Geologen kartieren lässt, sammelt Hinweise. Jeder Hinweis verschiebt die Chance wie eine Wette:
# Quote × P(gesehen|Öl) ÷ P(gesehen|trocken), nicht gesehen entsprechend. Startwert ist zones.prior.
# Regeln in src/sim/exploration.ts, Texte in content/plans.yaml. Alles PLATZHALTER.
exploration:
  neighbourPower: 0.2          # Hinweise auf Nachbarranches (gleiches Gebiet) wirken mit Faktor^0,2 (Plan: 0,5 – damit war die Prognose 10–12 Punkte zu selbstsicher, docs/plan-termine-messung.md)
  width:                       # Bandbreite der Prognose je Wissensstufe in Prozentpunkten
    rode: 40                   # Stufe 1: beritten
    mappedBase: 40             # Stufe 2: kartiert, 40 − 5 × Genauigkeit (Genauigkeit 3 → 25, 5 → 15)
    mappedPerAccuracy: 5
    report: 10                 # Stufe 3: Bohrbericht
  noiseShare: 0.15             # Mitte der Prognose schwankt um ± 15 % der Bandbreite (ehrlich, aber unscharf)
  greedyLie: 0.30              # gieriger Farmer: erzählt in 30 % der Fälle von Öl, das er nie sah
  friendlyOwners: [fromm]      # freundliche Farmer geben beim Gespräch Nachlass auf den Pachtbonus …
  friendlyDiscount: 0.10       # … 10 %
  # 0.4.19+3: Der Geologe kartiert die Ranch und so viele Nachbarn (vorher 1). Gemessen brachte Geologe + Karte
  # (300 $ und Lohn) nur so viel wie ein kostenloser Farmer; jetzt deckt eine Karte so viele Ranches ab wie ein Ritt,
  # mit dem stärkeren Hinweis – dafür kostet sie Lohn.
  mapNeighbours: 2
  reportCost: { dry: 150, found: 300 }   # Bohrbericht kaufen: trockenes bzw. fündiges Loch
  diary: { ranches: 3, caught: 0.25 }    # Bullards Bohrtagebuch: bis zu 3 Ranches, zu 25 % erwischt (Fehde)
  clues:                       # P(gesehen | Öl) und P(gesehen | trocken)
    sickerstelle: { oil: 0.45, dry: 0.10 }
    salzwasser: { oil: 0.40, dry: 0.18 }
    formation: { oil: 0.35, dry: 0.20 }
    brunnen: { oil: 0.50, dry: 0.12 }
    kartierung: { oil: 0.55, oilPerAccuracy: 0.07, dry: 0.35, dryPerAccuracy: -0.05 }
    bohrbericht: { oil: 0.95, dry: 0.03 }
    rute: { oil: 0.5, dry: 0.5 }  # Wünschelrute: reiner Zufall, Faktor 1
    seismik: { oil: 0.85, dry: 0.25 }  # Kapitel 3: Struktur im Seismik-Bericht – muss 1 − kapitel3.seismik.missTrap bzw. falseTrap sein (Test)
  geologists:
    standard: { accuracy: 3, biasMax: 10, wage: 100 }   # Verzerrung verdeckt, zufällig ±10 Punkte
    hallstead: { accuracy: 5, bias: 0, wage: 200 }
    hale: { accuracy: 1, bias: 15, wage: 40 }           # billig, ungenau, sieht überall Öl

# Planungsbrett (Etappe 1): Karten, mit denen Jacob seine Termine verplant. Texte stehen in
# content/plans.yaml, Regeln in src/sim/plans.ts (handler). event = ein fester Termin aus
# content/events/, den die Karte ersetzt (Termine und Wirkung wie dort). Feste Termine ohne eigene
# Karte kommen automatisch in den Reiter „leute“. Alles PLATZHALTER.
plans:
  cards:
    ritt: { tab: land, appointments: 2, strength: -3, target: ranch, handler: ritt }           # Ranch + 2 Nachbarn: Sickerstelle, Salzwasser, Formation
    farmer: { tab: land, appointments: 1, target: ranch, handler: farmer }                     # Hinweis „alter Brunnen“
    geologe_einstellen: { tab: land, appointments: 1, cash: 300, handler: geologe_einstellen } # Genauigkeit 3
    # 0.4.19+2: Hale und das nächtliche Tagebuch nur in Kapitel 1 – ab Kapitel 3 ist Dr. Hale der Seismik-Gelehrte,
    # und der Konzernherr bricht nicht selbst in Bohrhütten ein.
    geologe_hale: { tab: land, appointments: 1, cash: 100, handler: geologe_hale, requires: { maxChapter: 1 } }   # Genauigkeit 1, Verzerrung +15
    geologe_hallstead: { tab: land, appointments: 3, cash: 600, handler: geologe_hallstead }   # Genauigkeit 5
    geologe_besprechung: { tab: land, appointments: 1, target: ranch, handler: geologe_besprechung }  # Ranch + exploration.mapNeighbours Nachbarn kartiert
    bohrbericht: { tab: land, appointments: 1, target: ranch, handler: bohrbericht }           # Preis: exploration.reportCost
    tagebuch: { tab: land, appointments: 2, strength: -5, handler: tagebuch, requires: { maxChapter: 1 } }   # 1 Termin + 1 Nacht (Überstunden-Kraft)
    rute: { tab: land, appointments: 1, cash: 20, strength: 1, target: ranch, handler: rute }  # Faktor 1, hebt die Laune
    feldinspektion: { tab: land, event: termin_rundgang }
    # Etappe 2: Preis-Aktionen (Reiter Markt, Zahlen der Regeln: priceActions) – nur Kapitel 1 (ab Kapitel 2 gibt es die Diplomatie) …
    foerderbremse: { tab: markt, appointments: 2, cash: 100, target: option, timing: rundenende, handler: foerderbremse, requires: { maxChapter: 1 } }   # Bewirtung im Saloon
    pakt_halten: { tab: markt, appointments: 1, timing: rundenende, handler: pakt_halten, requires: { maxChapter: 1 } }
    pakt_verlaengern: { tab: markt, appointments: 1, timing: rundenende, handler: pakt_verlaengern, requires: { maxChapter: 1 } }
    bullard_einladen: { tab: markt, appointments: 1, timing: rundenende, handler: bullard_einladen, requires: { maxChapter: 1 } }
    zur_rede: { tab: markt, appointments: 1, timing: rundenende, handler: zur_rede, requires: { maxChapter: 1 } }
    liefervertrag: { tab: markt, appointments: 1, target: option, timing: rundenende, handler: liefervertrag, requires: { maxChapter: 1 } }
    geruecht: { tab: markt, appointments: 1, cash: 150, target: option, timing: rundenende, handler: geruecht, requires: { maxChapter: 1 } }
    crane_feilschen: { tab: markt, appointments: 2, target: option, timing: rundenende, handler: crane_feilschen, requires: { maxChapter: 1 } }
    # … und Transport-Aktionen (Reiter Fracht, Zahlen der Regeln: transport.negotiation)
    thorne_vorsprechen: { tab: fracht, appointments: 2, cash: 30, strength: -3, target: option, timing: rundenende, handler: thorne_vorsprechen, requires: { maxChapter: 1 } }
    brennan: { tab: fracht, appointments: 1, cash: 150, handler: brennan, requires: { maxChapter: 1 } }
    transportgemeinschaft: { tab: fracht, appointments: 2, cash: 100, target: option, timing: rundenende, handler: transportgemeinschaft, requires: { maxChapter: 1 } }
    gemeinschaft_halten: { tab: fracht, appointments: 1, timing: rundenende, handler: gemeinschaft_halten, requires: { maxChapter: 1 } }
    exklusiv_kuendigen: { tab: fracht, appointments: 1, cash: 800, handler: exklusiv_kuendigen, requires: { maxChapter: 1 } }
    # 0.4.20+31 Deals im Adressbuch (Regeln src/sim/deals.ts, Zahlen unten im Block deals). Alles PLATZHALTER.
    bank_zins: { tab: markt, appointments: 1, timing: rundenende, handler: bank_zins }
    bank_stundung: { tab: markt, appointments: 1, handler: bank_stundung }
    bank_pfand: { tab: markt, appointments: 1, handler: bank_pfand }
    bahn_festtarif: { tab: fracht, appointments: 2, strength: -2, target: option, timing: rundenende, handler: bahn_festtarif }
    bahn_kontingent: { tab: fracht, appointments: 1, target: option, handler: bahn_kontingent }
    crane_vorschuss: { tab: markt, appointments: 1, target: option, handler: crane_vorschuss, requires: { maxChapter: 1 } }
    haendler_grossabnahme: { tab: markt, appointments: 1, handler: haendler_grossabnahme, requires: { maxChapter: 1 } }
    turm_verleihen: { tab: leute, appointments: 1, target: option, handler: turm_verleihen, requires: { maxChapter: 1 } }
    foerderzins: { tab: land, appointments: 1, target: ranch, timing: rundenende, handler: foerderzins, requires: { maxChapter: 1 } }
    interview: { tab: leute, appointments: 1, timing: rundenende, handler: interview, requires: { maxChapter: 1 } }
    wache: { tab: leute, appointments: 1, cash: 60, handler: wache, requires: { maxChapter: 1 } }
    # 0.4.20+34 Telefon: Anrufe (call = Gewicht beim Auslosen), nur ab Kapitel 2.
    bank_angebot: { tab: markt, appointments: 1, target: option, handler: bank_angebot, call: 1, requires: { minChapter: 2 } }
    # 0.4.20+39 Lieferverträge der Raffinerie (Marine nur ohne den Rohöl-Vertrag aus k2_ag_marine).
    marine_heizoel: { tab: markt, appointments: 2, target: option, handler: marine_heizoel, requires: { minChapter: 2, notMarked: [k2_marine_vertrag] } }
    fabrik_schmieroel: { tab: markt, appointments: 1, target: option, handler: fabrik_schmieroel, requires: { minChapter: 2 } }
    lampenoel_kerosin: { tab: markt, appointments: 1, target: option, handler: lampenoel_kerosin, requires: { minChapter: 2 } }
    # 0.4.20+36 Versicherung, Arbeiter, Presse.
    versicherung: { tab: markt, appointments: 1, target: option, handler: versicherung, requires: { minChapter: 2 } }
    lohnerhoehung: { tab: leute, appointments: 1, handler: lohnerhoehung, requires: { minChapter: 2 } }
    streik_droht: { tab: leute, appointments: 1, target: option, handler: streik_droht, call: 1, requires: { minChapter: 2 } }
    anzeigen: { tab: leute, appointments: 1, handler: anzeigen, requires: { minChapter: 2 } }
    interview_presse: { tab: leute, appointments: 1, timing: rundenende, handler: interview_presse, requires: { minChapter: 2 } }
    # 0.4.20+37 Lohnbohrer, Ausrüster, Motorwagen, Abgeordneter (Anrufe mit call).
    ausruester_sammel: { tab: land, appointments: 1, target: option, handler: ausruester_sammel, requires: { minChapter: 2 } }
    lohnbohrer: { tab: land, appointments: 1, handler: lohnbohrer, requires: { minChapter: 2 } }
    motorwagen_benzin: { tab: markt, appointments: 1, target: option, handler: motorwagen_benzin, requires: { minChapter: 2 } }
    motorwagen_beteiligung: { tab: markt, appointments: 2, handler: motorwagen_beteiligung, call: 0.5, requires: { minChapter: 2, maxChapter: 2 } }
    abgeordneter_stimme: { tab: leute, appointments: 1, handler: abgeordneter_stimme, call: 1, requires: { minChapter: 2 } }
    abgeordneter_gefallen: { tab: leute, appointments: 1, target: option, handler: abgeordneter_gefallen, call: 1, requires: { minChapter: 2 } }

# Deals im Adressbuch (0.4.20+31, src/sim/deals.ts). Alles PLATZHALTER bis zu Bot-Läufen.
deals:
  bank:
    rate: { chance: { A: 0.75, B: 0.5, C: 0.25, D: 0 }, cut: 0.01, floor: 0.04, cooldown: 4 }   # Zins nachverhandeln: Bankkredite −1 Punkt
    defer: { surcharge: 0.5, cooldown: 6 }      # Stundung: Zinsen der Runde × 1,5 auf die Schuld
    pledge: { limitBonus: 2500 }                # Turm verpfänden: Bankrahmen +2.500 $; bei versäumter Zahlung gehört der Turm der Bank (Jacob mietet ihn)
    offer: { sizes: [5000, 10000, 25000], discount: 0.02, floor: 0.03, rounds: 8, penalty: 0.04 }   # 0.4.20+34 Anruf: Sonderkredit 2 Punkte billiger, in 8 Runden tilgen, sonst +4 Punkte
  rail:
    fixed: { rounds: [4, 8], minimum: 4000, shortfall: 0.10 }   # Festtarif: kein Aufschlag, dafür mind. 4.000 bbl je Runde per Bahn
    quota: { sizes: [5000, 10000], discount: 0.2, rounds: 6 }  # Frachtkontingent: heute zahlen, 20 % billiger, 6 Runden gültig
  crane:
    advance: { sizes: [3000, 6000], discount: 0.15, rounds: 2, penalty: 0.3 }   # Vorschuss: 85 % sofort, Lieferung in 2 Runden, sonst Rest × Preis × 1,3 zurück
  trader:
    bulk: { extra: 5000, cooldown: 3 }          # Großabnahme: Händler nimmt diese Runde 5.000 bbl mehr
  rig:
    lend: { rounds: [2, 4], rent: 350, damage: 0.2, repair: 700 }   # Turm verleihen
  royalty: { chance: 0.55, cut: 0.03, floor: 0.08, horizon: 8, priceShare: 0.8, cooldown: 4 }   # Förderzins nachverhandeln
  interview: { chance: 0.65, rumourPenalty: 0.3, shift: 0.06, cooldown: 4 }   # Ruf bei den Wildcattern ±0,06
  theft: { chance: 0.06, minStock: 3000, loss: 0.2 }
  phone: { chance: 0.35 }
  # 0.4.20+36 Versicherung, Arbeiter, Presse (Telefon, Kapitel 2). PLATZHALTER.
  insurance: { rounds: [4, 8], base: 150, share: 0.004, cover: 0.8, claimRaise: 0.5 }   # zahlt 80 % bei Feuer in Raffinerie/Tanks
  workers:
    raise: { perWell: 40, rounds: 8, reputation: 15 }   # Lohnerhöhung: Ruf bei den Arbeitern hebt die Förderung (eventSystems.reputation.production)
    strike: { dealPerWell: 120, dealReputation: 5, breakerCost: 1500, breakerReputation: 20, loss: 0.4 }   # Anruf „Streik droht“; ignoriert = −40 % Förderung nächste Runde
  press:
    ads: { cost: 3000, reputation: 6, backlash: 0.15, cooldown: 4 }
    interview: { chance: 0.6, reputation: 5, cooldown: 4 }
  # 0.4.20+39 Lieferverträge der Raffinerie (Telefon, Kapitel 2): fester Preis (heutiger Großhandelspreis × (1 + premium)),
  # die Vertragsmenge drückt den Großhandel nicht; fehlt etwas (auch bei Stillstand), kostet jedes Barrel shortfall.
  supply:
    marine: { product: fuelOil, sizes: [1000, 2500], rounds: 8, premium: 0, shortfall: 0.3 }       # Marine: Heizöl, sichere Abnahme
    lubricant: { product: lubricant, sizes: [500, 1000], rounds: 6, premium: 0.1, shortfall: 0.6 }  # Fabriken: Schmieröl mit Aufschlag
    kerosene: { product: kerosene, sizes: [1000, 2000], rounds: 12, premium: 0.05, shortfall: 0.3 } # Lampenöl-Händler: Kerosin, lange Laufzeit
    gasoline: { product: gasoline, sizes: [1000, 2000], rounds: 12, premium: 0.08, shortfall: 0.4 } # 0.4.20+37 Motorwagen-Werke: Benzin-Rahmenvertrag
  # 0.4.20+37 Lohnbohrer, Ausrüster, Motorwagen, Abgeordneter (Telefon, Kapitel 2). PLATZHALTER.
  outfitter: { rigs: [2, 3], discount: 0.2, delivery: 2 }         # Sammelbestellung Bohrtürme
  crew: { rigs: 2, rounds: 6, discount: 0.3 }                      # Lohnbohrer: 2 Mietürme 30 % billiger, frühe Rückgabe = Restmiete
  motor: { stake: { cost: 15000, income: 1400, fail: 0.25 } }       # Beteiligung: zahlt ab Kapitel 3, scheitert mit 25 %
  deputy: { donation: 2000, favors: 2, rounds: 6, demand: 3000, refuse: 15 }   # Abgeordneter: 2 Gefallen sofort, nach 6 Runden will er 3.000 $   # 0.4.20+34: ab Kapitel 2 klingelt das Telefon in so vielen Runden   # Öldiebe in Kapitel 1; die Wache des Sheriffs verhindert sie für eine Runde

# Preis-Aktionen (Termine als Hauptwerkzeug, Etappe 2, src/sim/pricing.ts). Alles PLATZHALTER.
priceActions:
  # Ein gemeinsamer Ruf bei den Wildcattern (−0,3 bis +0,3) für Förderbremse und Transportgemeinschaft.
  standing: { min: -0.3, max: 0.3, collapse: -0.2, betrayal: -0.3, exposed: -0.1, held: 0.1, heldRounds: 4 }
  cartel:                    # Förderbremse
    join: { base: 0.55, alliance: 0.15, min: 0.10, max: 0.85 }   # Beitritt je Wildcatter-Firma: 0,55 + Ruf (+0,15 mit Delgados Verband)
    cut: 0.16                # Drossel 16 % … (Plan: 20 % – damit stieg der Preis der Folgerunde im Median um 20 %, Ziel 10–18 %)
    rounds: 4                # … für 4 Runden, danach verlängern (1 Termin)
    organizerCut: 0.10       # Organisatoren-Klausel: Jacob drosselt nur 10 % …
    organizerCheat: 0.03     # … dafür Betrugschance aller +0,03 (Plan: 0,05)
    cheat: { base: 0.02, perRound: 0.01, unheld: 0.10, bullardFull: 0.10 }   # je Mitglied und Runde: 0,02 + 0,01 je Runde seit Gründung; ohne „Pakt halten“ +0,10; fuhr Bullard voll auf +0,10 (Plan: 0,05 + 0,03, Bullard +0,15 – damit platzten 73 % der Pakte, Ziel 30–60 %; kleine Pakte platzen schon, wenn ein großes Mitglied betrügt)
    breakShare: 0.334        # bricht mehr als 1/3 der Kartellquellen, platzt der Pakt
    collapseBoost: 0.10      # danach fördern die Nachbarn eine Runde 10 % mehr (Tanks werden geleert)
    banRounds: 4             # und 4 Runden will niemand mehr einen Pakt
    bullard: { handshake: 0.60, neutral: 0.25, feud: 0, full: 0.20, break: 0.15, breakFactor: 1.5 }   # Beitritt je Haltung; draußen fährt er mit 20 % voll auf, drinnen bricht er mit 15 % (dann ×1,5 Förderung)
    craneTrigger: 1.15       # Preis über 1,15 × Trendpreis: Crane zahlt Jacob den Abschlag (rivals.crane.priceCut)
    antitrust: { chance: 0.10, fine: 1000 }   # Kartellgesetz in Kraft: je Runde 10 % Verfahren, 1.000 $ Strafe
  contract:                  # Liefervertrag mit dem Händler in Port Ellis
    minQty: 2000             # Menge je Runde: 2.000 bis min(6.000, Förderung der Vorrunde)
    maxQty: 10000            # Spielspaß K1: 6.000 → 10.000 – größere Mengen, damit Gewinn und Verlust spürbar werden
    qtyStep: 1000
    rounds: [4, 8]
    premium: 0.04            # Festpreis = Posted Price + 0,04 − 0,02 × Laufzeit (Plan: + 0,10 – weil der Preis am Salt Hill mit jeder neuen Nachbarquelle fällt, war damit fast jeder Vertrag ein Gewinn, Ziel 20–50 % Verlustverträge)
    perRound: 0.02
    shortfall: 0.20          # Fehlmenge kostet 0,20 $ je bbl (Spielspaß K1: 0,15 → 0,20)
    grudgeAfter: 2           # Cranes Groll (transport.trader.grudgeCut) für Laufzeit + 2 Runden
    failChance: 0.30         # Bankpanik oder Crash: Händler zu 30 % pleite, die laufende Runde bleibt unbezahlt
  rumour:                    # Gerücht streuen
    cooldown: 3
    dry: { shock: 0.15, minTank: 5000 }                    # „Quellen versiegen“: Preis +15 %, nur mit vollem Tank
    rounds: 2                # Spielspaß K1: Ein Gerücht wirkt 2 Runden auf den Preis (vorher 1)
    bullard: { shock: -0.12, leaseCost: -0.15, rounds: 2 }  # „Riesenfund bei Bullard“: Preis −12 %, Pachten 15 % billiger, Bullard pachtet 2 Runden nichts
    wear: 0.6                # jedes weitere Gerücht wirkt × 0,6
    exposed: { base: 0.20, perRumour: 0.15, backlash: -0.10 }   # Entlarvung 20 % + 15 % je früheres Gerücht; Spielspaß K1: „Quellen versiegen“ entlarvt – der Preis fällt sofort 10 % (eine Runde)
  crane:                     # Mit Crane feilschen
    points: { contract: 1, freight: 1, cartel: 2, alliance: 1, share: 1, antitrust: 1, tank: 1 }
    freightTeams: 2          # „eigene Wege“: mindestens 2 Gespanne oder Pipeline
    shareMin: 0.08           # Marktanteil am Salt Hill ab 8 %
    tankMin: 10000           # Tank ab 10.000 bbl
    rebuffExtra: 2           # 1 Punkt: Abfuhr, der Abschlag kommt sofort und dauert 2 Runden länger
    deal: { bonus: 0.08, rounds: 6 }        # ab 3: +0,08 $ je bbl für 6 Runden (nur gegen Austritt aus Pakt oder Händlervertrag)
    contract: { premium: 0.05, rounds: 6 }  # ab 4: fester Abnahmevertrag zu Posted Price + 0,05
    mood: { down: 0.45, up: 0.15 }          # Spielspaß K1: Cranes Laune −1 / 0 / +1 Punkt mit 45 / 40 / 15 % (Gesamt-Balance: mit 35 / 45 / 20 % ging Feilschen nur in 18,6 % schief, Ziel 20–45 %) – der Trust ist öfter schlecht gelaunt als gut
    resistance: { base: 1, recent: 1, rounds: 4 }   # Spielspaß K1: Cranes Gegendruck 1 Punkt, +1, wenn er in den letzten 4 Runden schon nachgegeben hat (vorher keiner)

# Bohren (GDD §5): Stufe 1 ist die Zieltiefe, jede weitere Stufe heißt
# "tiefer bohren". Tiefer = teurer und gefährlicher (Push your luck).
# oilShare: in welcher Stufe das Öl einer nicht trockenen Ranch liegt (Summe 1).
# accident: Unfall-Chance je Stufe (Entschädigung, Stufe wird wiederholt).
# stuck: Chance, dass das Werkzeug klemmt (bergen oder aufgeben).
drilling:
  # Bohrtürme (0.2.15+7): Je Turm läuft eine Bohrung zugleich. Jacob startet mit
  # Silas' geliehenem Seilschlag-Turm; weitere kauft oder mietet er in Port Ellis.
  rigs:
    start: 1                # Türme zu Spielbeginn (der erste ist Silas' geliehener)
    max: 4                  # PLATZHALTER: höchstens so viele Türme
    buy: { cost: 2500, deliveryRounds: 1 }   # PLATZHALTER: Kaufpreis, Lieferung zur nächsten Runde
    rent: { costPerRound: 350 }               # PLATZHALTER: Miete je Runde, sofort da, jederzeit zurückzugeben
    assetShare: 0.5         # gekaufte Türme zählen zur Hälfte des Kaufpreises im Imperiumswert
    # Dampfmaschine statt Handwinde: jede Stufe 20 % billiger und eine Runde schneller (mind. 1).
    # Lohnt nach etwa 1.200 / (0,2 × 1.000) = 6 Bohrstufen – für wer viel bohrt.
    steam: { cost: 1200, costFactor: 0.8, roundsLess: 1 }
    # Stahlgestänge statt Manila-Seil: halb so viele Unfälle und klemmende Werkzeuge.
    # Spart im Schnitt (0,02·200 + 0,03·300)·0,5 ≈ 7 $ je Stufe 1, mehr in der Tiefe – eher Sicherheit als Rendite.
    rods: { cost: 600, riskFactor: 0.5 }
  accidentCost: 200       # PLATZHALTER: $ Entschädigung je Unfall
  fishingCost: 300        # PLATZHALTER: $ Bergung bei klemmendem Werkzeug
  stages:                 # PLATZHALTER; 1.15: Stufe 1 unter GDD (1.500–3.000 $), damit Tieferbohren mit der Startkasse geht
    # Frühes Öl (0.4.4+): vorher oilShare 0,7/0,2/0,1 und Stufe 1 Unfall 0,04 / Klemmen 0,05 – die erste
    # Bohrung auf einem Feld mit ≥ 60 % Prognose traf nur rund 40 %, mit der Startkasse reichte das oft nicht.
    - { depth: 300, cost: 1000, rounds: 1, oilShare: 0.85, accident: 0.02, stuck: 0.03, findFactor: 1 }
    - { depth: 600, cost: 1800, rounds: 2, oilShare: 0.10, accident: 0.08, stuck: 0.10, findFactor: 2.5 }
    - { depth: 900, cost: 3200, rounds: 3, oilShare: 0.05, accident: 0.15, stuck: 0.15, findFactor: 4 }

# Markt (GDD §7.3): Der Crane Trust kauft das Öl zum Posted Price. Der Preis
# entsteht jede Runde aus Angebot und Nachfrage am Salt Hill:
#   P = T · (N / A)^ε · S − k, begrenzt auf priceMin..priceMax, auf Cent gerundet.
# A = Förderung von Jacob und den Nachbarn in der Runde. Der neue Preis gilt ab
# der nächsten Runde. Alle Werte PLATZHALTER.
# 1.15: Ohne Jacob fällt der Preis über das Kapitel von etwa 1,30 $ auf etwa
# 0,70 $ (Überbohrung), aber nicht unter das Fuhrwerk. Darunter drückt ihn nur
# Jacobs eigene Förderung. Eine kleine Quelle ist etwa 5 % des Marktes.
market:
  basePrice: 1.00          # T: Trendpreis in $ je Barrel
  demand: 150000           # N: Nachfrage am Salt Hill in Barrel je Runde
  elasticity: 1.2          # ε: hoch = kleines Überangebot drückt den Preis stark
  shock: 1.0               # S: Schockfaktor (Ereignisse kommen später)
  regionalDiscount: 0.00   # k: Abschlag in $ je Barrel (Fracht läuft schon über transport)
  priceMin: 0.20           # Untergrenze in $ je Barrel
  priceMax: 1.60           # Obergrenze in $ je Barrel
  neighbours:              # Förderung der anderen Firmen am Salt Hill (bis es Rivalen gibt)
    startWells: 30         # Bohrtürme der Nachbarn in Runde 1
    newWellsPerRound: 1    # so viele kommen jede Runde dazu
    ratePerWell: 4000      # Barrel je Nachbarquelle und Runde
  newsThreshold: 0.10      # Preisänderung ab 10 % kommt ins Protokoll

# Transport (GDD §6): Fuhrwerk oder Bahn. Die Bahn gehört Augustus Thorne – sie
# ist billiger, aber Thorne kann den Tarif erhöhen, solange Jacob sie nutzt.
# capacity = höchstens so viele Barrel je Runde.
transport:
  wagon:
    label: Fuhrwerk
    costPerBarrel: 0.60     # PLATZHALTER: gemietete Fuhrleute, keine Fixkosten
    capacity: 3000          # PLATZHALTER
  rail:
    label: Bahn
    costPerBarrel: 0.25     # PLATZHALTER: Starttarif
    capacity: 20000         # PLATZHALTER
  # 0.2.15+2: eigene Fuhrwerke – Fixkosten je Runde, dafür billig je Barrel. Lohnt erst ab Menge:
  # gegen das Mietfuhrwerk ab ~460 bbl je Gespann und Runde, gegen die Bahn (0,25 $) erst ab ~1.700.
  # 0.2.15+4: 0,10 → 0,12 $ und Lohn 180 → 220 $ – vorher schlugen eigene Fuhrwerke in den Bot-Läufen jeden anderen Weg.
  teams:
    label: Eigene Fuhrwerke
    costPerBarrel: 0.12     # PLATZHALTER: Futter, Fässer, Verschleiß
    capacity: 2000          # PLATZHALTER: je Gespann und Runde
    wagePerRound: 220       # PLATZHALTER: Lohn je Gespann und Runde, auch wenn es steht
    hireCost: 250           # PLATZHALTER: Wagen und Ochsen, einmalig
    resale: 0.5             # Wer ein Gespann abgibt, bekommt diesen Anteil zurück
    maxTeams: 5
  # 0.2.15+2: kleine Pipeline zum Bahnhof/Hafen. Erst Route vermessen (surveyCost) – dann kommen
  # Briefe der Landbesitzer; mit allen Wegerechten (rights) kann gebaut werden.
  pipeline:
    label: Pipeline
    costPerBarrel: 0.03     # PLATZHALTER
    capacity: 40000         # PLATZHALTER
    surveyCost: 150         # Route vermessen
    buildCost: 9000         # Spielspaß K1: 6.000 → 9.000 $ – Kapitel 1 ist reicher geworden; mit 6.000 $ lief in 79,8 % der erfolgreichen Partien eine Pipeline (Grenze 80 %), jetzt um 60 %
    buildRounds: 3          # GDD §6: 1–4 Runden
    upkeepPerRound: 120     # Streckenwärter
    rights:                 # Wegerechte: Merkzeichen aus content/events/, Name für den Schreibtisch, Figur aus map.yaml (deren Ranch die Route kreuzt)
      - { mark: wegerecht_moss, label: "Moss' Weide", figure: moss }
      - { mark: wegerecht_bahndamm, label: "Bahndamm (Witwe Pruitt)", figure: pruitt }
    sabotageChance: 0.08    # PLATZHALTER: je Runde, sobald sie läuft
    sabotageFactor: 2       # … × 2 bei Fehde mit Bullard oder Streit mit Thorne
    repairCost: 600
    repairRounds: 1         # so lange liegt sie nach einem Anschlag still
    guardsPerRound: 100     # Wachleute
    guardsFactor: 0.25      # … senken die Sabotage-Chance auf ein Viertel
  thorne:
    hikeChance: 0.30        # PLATZHALTER: Chance je Runde mit Bahnfracht (0.2.15+4: 0,20 → 0,30 – Thorne soll spürbar drücken, sonst lohnt kein anderer Weg)
    hikeStep: 0.15          # PLATZHALTER: Erhöhung in $ je Barrel (0.2.15+4: 0,10 → 0,15)
    maxTariff: 1.00         # PLATZHALTER: höchster Bahntarif (darf über dem Fuhrwerk liegen; 0.2.15+4: 0,80 → 1,00)
    # Verhandlung (Brief „Frachtvertrag“, rivals.thorne.contractRounds Runden):
    volumeDiscount: 0.08    # Mengenrabatt in $ je Barrel …
    minVolume: 5000         # … gegen Mindestabnahme je Runde (ab der Runde nach der Unterschrift) …
    shortfallPenalty: 0.10  # … sonst Strafe je fehlendem Barrel
    exclusivePenalty: 0.30  # Exklusivvertrag: Tarif eingefroren, jeder Barrel über einen anderen Weg kostet diese Strafe
    minTariff: 0.15         # tiefer geht Thorne nie (auch nicht beim Vorsprechen, Etappe 2)
  # Termine als Hauptwerkzeug, Etappe 2: Verhandeln über das Planungsbrett (src/sim/freight.ts).
  # Ersetzt die alte Drohung mit der Pipeline. Alles PLATZHALTER.
  negotiation:
    bundle: [8000, 20000]   # Druckmittel 1 und 2: gebündelt so viel bbl per Bahn (eigene + Gemeinschaft + Mindestmenge)
    fallbackShare: 0.5      # Druckmittel 3: Ausweichkapazität (Gespanne, Brennan, Pipeline) ≥ 50 % der Bahnmenge der Vorrunde
    resistance: { base: 1, perConcession: 1, concessionRounds: 4, feud: 1 }   # Widerstand: 1 + 1 je Zugeständnis der letzten 4 Runden + 1, wenn Bullard in Fehde Jacobs Mengen verrät (Plan: 2 – damit gab Thorne kaum je nach, Ø Tarifsenkung 0,02 $ statt 0,05–0,15 $)
    mood: { down: 0.25, up: 0.25 }   # Thornes Laune: −1 / 0 / +1 mit 25 / 50 / 25 %
    cuts: [0.10, 0.15, 0.20]         # Tarifsenkung bei Druck − Widerstand = 1, 2, ≥ 3 (Spielspaß K1: vorher 0,05 / 0,10 / 0,15)
    freeze: [2, 3, 4]                # … und so viele Runden keine Erhöhung (Spielspaß K1: vorher 0 / 2 / 4)
    special: { tariff: 0.20, rounds: 6 }   # ab 3 wahlweise: Sondertarif fest für 6 Runden
    rebuff: { factor: 2, rounds: 4, raise: 0.05 }   # Abfuhr (≤ 0) oder erwischter Bluff: Erhöhungschance × 2 für 4 Runden; Spielspaß K1: bei der Abfuhr steigt der Tarif sofort um 0,05 $
    # Hing das Zugeständnis an Ausweichwegen oder Pipeline, zählt Thorne in den 2 Folgerunden je Runde mit 35 % nach; geht in so einer
    # Runde mehr als 60 % per Bahn: +0,15 $. Spielspaß K1: vorher Summe beider Runden > 80 %, +0,10 $ – damit erwischte Thorne fast nie jemanden (0,6 %).
    bluff: { rounds: 2, railShare: 0.6, penalty: 0.15, check: 0.35 }
    # Brennans Fuhrleute ersetzen die Mietfuhrwerke. Spielspaß K1: 5.000 → 8.000 bbl, Mindestmenge bleibt 2.000, Fehlmenge 0,15 → 0,25 $.
    brennan: { costPerBarrel: 0.35, capacity: 8000, rounds: 4, minimum: 2000, shortfall: 0.25, raise: 200 }
    pool:                   # Transportgemeinschaft
      base: 0.25            # Zusage je Firma: 0,25 + (Tarif − 0,25) + Ruf (+0,20 Verband, −0,10 Fehde Bullard) …
      tariffRef: 0.25
      alliance: 0.20
      feud: -0.10
      min: 0.10             # … begrenzt auf 0,1–0,8
      max: 0.80
      perWell: 4000         # gebündelte Menge = eigene + Mitgliedsquellen × 4.000 × 0,25
      wellShare: 0.25
      leave: 0.15           # Abspringen je Mitglied und Runde (nicht in einer Runde mit „Gemeinschaft halten“)
      pipelineDiscount: 0.4 # Pipeline gemeinsam: −40 % Baukosten …
      foreignShare: 0.3     # … dafür 30 % der Kapazität für Fremdöl …
      transitFee: 0.05      # … gegen 0,05 $ Durchleitung je Barrel
      # Spielspaß K1: Rabatt auf Jacobs Bahnfracht, solange die Gemeinschaft läuft – 0,01 $ je 2.000 bbl Gemeinschaftsmenge, höchstens 0,08 $ …
      discountPer: 2000
      discountStep: 0.01
      discountMax: 0.08
      minimum: 8000         # … gegen die Zusage, gemeinsam (Jacobs Bahnfracht + Gemeinschaft) mindestens 8.000 bbl je Runde zu verladen …
      shortfall: 0.10       # … sonst 0,10 $ je fehlendem Barrel (ab der Runde nach der Gründung)
    cancelPressure: 2       # Exklusivvertrag kündigen geht erst ab so viel Druck
  # 0.2.15+2: zweiter Käufer – unabhängiger Händler in Port Ellis.
  trader:
    label: Händler in Port Ellis
    premium: 0.10           # PLATZHALTER: zahlt Posted Price + Aufschlag (ohne Cranes Abschlag)
    capacity: 2500          # PLATZHALTER: nimmt höchstens so viel je Runde
    grudgeCut: 0.05         # Crane merkt es sich: zahlt danach so viel weniger je Barrel …
    grudgeRounds: 2         # … so viele Runden nach dem letzten Händlerverkauf
  # 0.2.15+2: Lager. Was über die Tanks hinaus gefördert wird, läuft aus.
  storage:
    startCapacity: 15000    # PLATZHALTER: Jacobs Holztanks am Feld
    tankCapacity: 10000     # je zusätzlichem Tank
    tankCost: 400           # PLATZHALTER
    maxTanks: 6
    costPerBarrel: 0.01     # Lagerkosten je Barrel und Runde
    shrink: 0.02            # Schwund je Runde (Verdunstung, Lecks)
    fireChance: 0.02        # Brand je Runde mit Öl im Tank …
    fireLoss: 0.5           # … vernichtet diesen Anteil
  assetShare: 0.5           # Tanks, Gespanne und Pipeline zählen mit diesem Anteil ihrer Kosten zum Imperiumswert

# Bankkredit (GDD §8, §15). Der Rahmen wächst mit jeder fördernden Quelle, weil
# sie als Pfand dient. Der Jahreszins steht nach dem Rating der Bank; mit Pfand
# zahlt Jacob zwei Punkte weniger, ohne Sicherheit drei mehr. Reicht die Kasse
# für die Zinsen nicht, leiht Jacob automatisch zuerst bei der Bank (billiger);
# gibt die nichts mehr, leiht der Geldverleiher sofort und ohne Sicherheit, aber
# zu 40 % (Notkredit).
credit:
  startRating: B           # Rating, mit dem Jacob in Port Ellis ankommt
  minLoan: 500             # kleinster Kredit am Stück
  sliderStep: 100          # Schrittweite der Regler „Kredit aufnehmen“ und „Tilgen“ in der Bank
  limitBase: 5000          # Bankrahmen ohne Pfand (GDD §12: 3.000; 1.15: Platz für 3–4 Wildcat-Bohrungen)
  limitPerWell: 2000       # Rahmen je fördernder Quelle
  rates:                   # Jahreszins je Rating (GDD §12)
    A: 0.05
    B: 0.07
    C: 0.10
    D: 0.15
  collateralDiscount: 0.02 # fördernde Quelle als Pfand senkt den Zins um 2 Punkte
  unsecuredAdd: 0.03       # ohne Sicherheit steigt er um 3 Punkte
  # Das Rating folgt der Verschuldung (Anteil am Bankrahmen) und der
  # Zahlungshistorie (Runden, für die der Geldverleiher einspringen musste).
  usageC: 0.25             # bis hierher bleibt es bei B, PLATZHALTER
  usageD: 0.60             # darüber ist es D, PLATZHALTER
  missedC: 1               # eine Runde mit Notkredit/offenen Zinsen bringt C, PLATZHALTER
  missedD: 2               # zwei solche Runden bringen D, PLATZHALTER
  shiftRecoveryRounds: 4   # 0.4.19+2: eine schlechte Note aus Ereignissen verblasst nach 4 Runden ohne versäumte Zahlung um eine Stufe
  # 4.20, GDD §8: „In Kreditkrisen kündigen Banken Kredite. Hoch verschuldete Spieler können dann binnen zwei Runden
  # zusammenbrechen.“ Bricht eine Bankpanik oder ein Crash aus, kündigt die Bank share + leverage × Auslastung
  # (Bankschulden ÷ Grundrahmen, höchstens 1) ihrer Kredite – sofort fällig, notfalls ins Minus der Kasse (dann läuft
  # die Frist unter bankruptcy). Vorher gab es Kündigungen nur im Zeitsprung (timeskip.crisis). PLATZHALTER.
  crisisCall: { share: 0.1, leverage: 0.5 }
  emergency:               # Notkredit vom Geldverleiher
    limit: 1000            # so viel leiht er insgesamt (GDD §12: 2.000; 1.15: Schuldenfalle muss zur Pleite führen können)
    rate: 0.40             # Jahreszins ohne Sicherheit

# Bankrott (GDD §8): Bargeld unter null ohne Kreditrahmen startet eine Frist.
# Wer sie übersteht, macht weiter; wer sie verstreichen lässt, ist pleite.
bankruptcy:
  graceRounds: 2           # Runden Frist, bevor es Konkurs gibt

# Imperiumswert (GDD §4): Kasse + Öl im Tank + Reserven im Boden − Schulden.
# Reserven zählen nur vorsichtig, weil Förderkosten und Risiko noch darin stecken.
empire:
  reserveFactor: 0.4       # GDD §4: Reserven im Boden vorsichtig bewertet

# Kapitelprüfung und Kapitelende (2.11, GDD §13, §14, §8 Börsengang).
# Geschafft ist Kapitel 1, wenn Jacob am Ende nicht bankrott ist (Kasse nicht im Minus)
# und der Imperiumswert mindestens goalValue beträgt ODER mindestens goalWells Quellen fördern.
# Texte und Boni: content/chapter.yaml. Wer das Ziel verfehlt, darf keine Aktien ausgeben.
chapter:
  goalValue: 95000         # Spielspaß K1: 70.000 → 95.000 $ und 8 Quellen – tiefe Funde, Karten und Tieferbohren mit Gewinnschwelle machen Kapitel 1 reicher (Ø Imperium Standard-Bot 112.000 → ~124.000 $), mit 70.000 $ / 6 bestand er in 78 %. GDD §13: 50.000 $; 0.4.20+1: 70.000 $ – mit der guten ersten Startoption trifft die erste Bohrung fast immer, mit 50.000 $ / 5 Quellen bestand der Standard-Bot in 78 % (Ziel höchstens 70 %), jetzt 66,9 % (npm run bots, 1.000 Partien) …
  goalWells: 8             # … oder so viele fördernde Quellen (GDD §13: 5; 0.4.20+1: 6; Spielspaß K1: 8)
  ipo:
    shares: [0.2, 0.33, 0.49]  # GDD §8: zur Wahl stehende Anteile, die Jacob verkaufen kann (typisch 20–49 %)
    lateFactor: 1.0            # Später Börsengang (Kapitel 2/3, Familienfirma → AG): Erlös = Imperiumswert × Anteil × lateFactor – späte Anleger zahlen weniger Aufschlag als am Kapitelende (priceFactor)
    priceFactor: 1.5           # Anleger zahlen Imperiumswert × Anteil × 1,5 – sie kaufen die Zukunft (0.4.20+33: vorher 0,8; Bot-Messung: der Börsengang lohnte nie, das Geld half nicht)
  # Kapitel 2 „Der Herausforderer“ (4.12, GDD §13/§14). Texte: content/chapter.yaml → chapter2.
  chapter2:
    # 0.4.19+2: GDD §13 nennt 1 Mio. $ – das erreichte keine einzige Bot-Partie (bester Wert ~320.000 $,
    # 30 Seeds mit Raffinerie-Zug des Bots). Mit 200.000 $ besteht der Standard-Bot in etwa 30 % (PLATZHALTER).
    goalValue: 575000          # Imperiumswert ≥ so viel $ … (0.4.20+24: 500.000 → 575.000 $ – mit funktionierender Bot-Raffinerie bestand der Standard-Bot in 75,9 % (1.000 Kampagnen; Varianten 200: 550.000 68,5 %, 600.000 63 %); 0.4.20+5: 200.000 → 400.000 $ – seit der Verwalter die Förderung hält und die Provinz offen ist, bestand der Standard-Bot in 82,5 %, Ziel höchstens 70 %; 0.4.20+15: 400.000 → 500.000 $ – mit Spielspaß K1 und Spur-Gewichtung bestand er in 74,5–77,5 %, jetzt 67 % (200 Kampagnen; 450.000: 70,0 %, 480.000: 68,5 %))
    goalControl: 0.5           # … Kontrolle ≥ 50 % (Familienfirma: immer) und eigene Raffinerie oder Fernleitung zum Hafen
    swallowedControl: 0.5      # Ende „Geschluckt“: Thorne hält mehr Aktien als Jacob und Jacobs Kontrolle liegt darunter
  # Kapitel 3 „Der Konzernherr“ (4.19, GDD §13): Marke in ≥ brand.goal.regions Regionen oder ≥ brand.goal.share
  # Marktanteil (Zahlen unter brand.goal) und am Kapitelende mindestens dieses Rating. Texte: content/chapter.yaml → chapter3.
  chapter3:
    minRating: C
  # Verfehlte Kapitelprüfung (0.4.19+2, GDD §2: „startet das nächste Kapitel geschwächt“). PLATZHALTER.
  # Beim Start des nächsten Kapitels fehlt dieser Anteil der Kasse, und Jacob beginnt mit so viel Kraft weniger.
  missed: { cashShare: 0.15, strength: 20 }

# Systemwirkungen der Ereignisse (4.12): Antworten ab Kapitel 2 greifen in Ruf, Rivalen,
# Schattenbuch, Aufsichtsrat, Personal, Raffinerie, Leitungen, Gesetze und Familie ein
# (src/sim/eventSystems.ts, Beschreibung in content/events/README.md). Alle Werte PLATZHALTER.
eventSystems:
  evidenceStep: 10            # evidence ±1 = so viele Beweispunkte bei Delaney (0–100; Anklage ab investigation.chargeAt)
  lawPressureStep: 4          # lawPressure ±1 = so viel Druck auf ein Gesetz (Schwellen in content/laws/)
  bullardStrength: 2500       # rival.bullard.strength ±1 = so viel $ mehr (weniger) in Bullards Kasse
  successionStep: 0.04        # rival.margaret/pruett.strength ±1 = so viel Anteil im Crane-Aufsichtsrat (vor der Entscheidung)
  sharePrice: 1               # sharePrice ±0,05 wirkt × dies auf die Stimmung der Börse (zieht von selbst zur 1 zurück)
  dividendPressure: 5         # dividendPressure +1 = Treue −5 bei allen Räten, die Dividende wollen
  heirMax: 10                 # Werte der Erben bleiben zwischen −10 und 10
  ansehenStep: 3              # ansehen ±1 = so viele Punkte Ansehen in Hallstead (Kapitel 3, 0–100)
  partyStep: 0.01             # party ±1 = ein Prozentpunkt mehr (weniger) für die Partei
  # Gäste, die ein Ereignis in den Aufsichtsrat holen kann (boardMember); Namen in content/stocks.yaml → guests.
  boardGuests:
    silas: { agenda: growth, loyalty: 65 }        # Silas will Bohrtrupps und Quellen
    vandermeer: { agenda: dividend, loyalty: 45 }  # Ambrose Vandermeer, Bankhaus Vandermeer & Co. (Hallstead)
    hale: { agenda: dividend, loyalty: 55 }        # Martha Hale, Witwe (Kapitel 3: Aktien statt Pacht)
    ruth: { agenda: safety, loyalty: 70 }          # Ruth Harlan (Kapitel 3: Sitz im Rat)
  boardStartGuests: [vandermeer]  # sitzen ab Kapitelbeginn im Rat, wenn Harlan Oil eine AG ist (Anleger aus Hallstead, Bibel §5)
  # Was der Ruf (−100…100, GDD §4) bewirkt – je Punkt:
  reputation:
    jury: 0.002               # Öffentlichkeit: Verurteilungschance vor Gericht − 0,2 Punkte je Rufpunkt
    pressure: 0.003           # Politik: Chance, Delaney versetzen zu lassen, + 0,3 Punkte je Rufpunkt
    production: 0.001         # Arbeiter: eigene Förderung + 0,1 % je Rufpunkt (Moral, Unfälle, Streiks)
    revenge: 0.3              # Furcht: Rivalen schlagen erst bei Groll ≥ revengeGrudge + 0,3 × Furcht zurück
  # check:events: so viel $ ist ein Punkt der Wirkung wert (Prozentwerte wie sharePrice je Prozentpunkt).
  relevance:
