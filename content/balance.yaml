# Spielzahlen für den Prototyp.
# PLATZHALTER: grob geschätzt, werden durch das Tabellenmodell (Schritt 0.6)
# und den Papierprototyp (0.7–0.9) ersetzt. Nur hier ändern, nicht im Code.

start:
  cash: 2000          # $ Bargeld bei Spielbeginn (GDD §13)
  year: 88            # Jahr der Föderation
  rounds: 16          # Runden in Kapitel 1 (ein Quartal pro Runde)

map:
  width: 12           # Parzellen von West nach Ost
  height: 9           # Parzellen von Nord nach Süd
  saltHill:           # Mitte des Booms
    x: 6
    y: 4

# Geologie je Zone. Die Zone hängt vom Abstand zur Mitte von Salt Hill ab.
# Wahrscheinlichkeiten pro Zone müssen zusammen 1 ergeben.
geology:
  zones:
    - name: kern
      maxDistance: 1.5
      dry: 0.30
      small: 0.55
      gusher: 0.15
    - name: ring
      maxDistance: 3.5
      dry: 0.50
      small: 0.42
      gusher: 0.08
    - name: rand
      maxDistance: 99
      dry: 0.75
      small: 0.23
      gusher: 0.02
  # Förderbare Gesamtmenge in Barrel (gleichverteilt zwischen min und max)
  reserves:
    small:
      min: 2000
      max: 12000
    gusher:
      min: 30000
      max: 120000

# Pacht (GDD §5, §15). Bonus und Förderzins hängen von der Lage zum nächsten
# bekannten Fund und vom Landbesitzer ab.
lease:
  termRounds: 4         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  delayRental: 25       # PLATZHALTER: $ Verzögerungszins je ungebohrter Pacht und Runde
  royaltyMin: 0.10      # Förderzins wird auf 10–25 % begrenzt
  royaltyMax: 0.25
  bonusRounding: 10     # Bonus und Optionsgebühr auf 10 $ gerundet
  # Lage nach Abstand (Felder, auch diagonal) zum nächsten bekannten Fund.
  # Nach maxDistance aufsteigend sortiert; die letzte Lage gilt für den Rest.
  locations:
    - name: amFund
      label: Am Fund
      maxDistance: 1
      bonus: 8000
      royalty: 0.20
    - name: nachbar
      label: Nachbar eines Funds
      maxDistance: 2
      bonus: 2000
      royalty: 0.1666667  # 1/6
    - name: randlage
      label: Randlage
      maxDistance: 99
      bonus: 150
      royalty: 0.125
  # Landbesitzer: weight = Häufigkeit (vorerst alle gleich),
  # bonusFactor multipliziert den Lagebonus, royaltyAdd kommt auf den Förderzins.
  landowners:
    - name: neutral
      label: neutral
      weight: 1           # PLATZHALTER
      bonusFactor: 1.00
      royaltyAdd: 0
    - name: gierig
      label: gierig
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: 0.03
    - name: verschuldet
      label: verschuldet
      weight: 1           # PLATZHALTER
      bonusFactor: 1.25
      royaltyAdd: -0.03
    - name: misstrauisch
      label: misstrauisch
      weight: 1           # PLATZHALTER
      bonusFactor: 1.50
      royaltyAdd: 0
    - name: fromm
      label: fromm
      weight: 1           # PLATZHALTER
      bonusFactor: 0.90
      royaltyAdd: 0
  # Pachtoption: sichert Bonus und Förderzins für kurze Zeit.
  option:
    feeShare: 0.10        # PLATZHALTER: Gebühr = Anteil am Bonus
    termRounds: 2         # PLATZHALTER: Laufzeit in Runden, Kaufrunde mitgezählt
  # Jacob beginnt mit freien Optionen auf Randlage-Parzellen.
  startOptions:
    count: 2              # PLATZHALTER
    termRounds: 4         # PLATZHALTER

# Geologe (GDD §5): Er nennt nie die wahre Fundchance, sondern eine
# Bandbreite. Je genauer und je weniger verzerrt, desto eher deckt sie die
# Wahrheit ab.
forecast:
  widthMax: 50            # PLATZHALTER: breiteste Bandbreite in Prozentpunkten
  widthMin: 10            # PLATZHALTER: schmalste Bandbreite (bester Geologe)
  rounding: 5             # PLATZHALTER: Bandbreitengrenzen auf 5 Prozentpunkte runden
  geologist:
    accuracy: 3           # PLATZHALTER: Genauigkeit 1–5
    bias: 0               # PLATZHALTER: Verzerrung −15 bis +15 Punkte
