    rival: 25
    heat: 400
    trace: 400
    evidence: 400
    boardLoyalty: 40
    boardMember: 2000
    control: 1500
    sharePrice: 300
    rivalStake: 1500
    dividendPressure: 300
    staffLoyalty: 30
    hire: 1500
    fire: 1500
    research: 600
    refineryDown: 1500
    refineryOutput: 100
    productYield: 100
    productPrice: 100
    pipelineDown: 1500
    pipelineThroughput: 100
    transportFee: 8
    lawPressure: 150
    mood: 150
    tension: 150
    rating: 2000
    loan: 0.05
    appointmentsNext: 300
    heirValues: 250
    brand: 150                # je Punkt Bekanntheit
    stations: 2500            # je Tankstelle
    ansehen: 300
    favors: 1500
    consortium: 40
    stock: 1                  # je $ Aktien (mal Hebel)
    leverage: 300
    fever: 100
    party: 150
    seismik: 3000
    feldzug: 20000            # Preisabsprache oder Thornes Kredit in Cranes Feldzug (beendet einen Krieg bzw. bringt zehntausende $)

# Zeitsprünge (4.5, GDD §2/§13): Zwischen den Kapiteln rechnet die Welt die Jahre weiter –
# mit vereinfachten Regeln (src/sim/timeskip.ts), Texte in content/timeskip.yaml. Vor dem Sprung
# legt Jacob Direktiven fest (Haltung, Familie); Weichen-Telegramme unterbrechen den Sprung.
# Haltung: aggressive / balanced / cautious; Familie: little / some / much. Alle Werte PLATZHALTER.
timeskip:
  rounds: 24                  # Zeitsprung I: Jahr 5–10 = 24 Quartale
  nextChapterRounds: 16       # Kapitel 2 „Der Herausforderer“: Jahr 11–14
  pipelineRight: 1500         # 0.4.20+39: Ist die kleine Pipeline am Kapitelende vermessen, aber ohne alle Wegerechte, kauft der Verwalter jedes fehlende Recht für so viel $ und baut sie – die Briefe der Landbesitzer gibt es nur in Kapitel 1, sonst bliebe sie für immer liegen
  # Haltung (GDD §2: bestimmt Ertrag und Streuung). Wagemutig bohrt mehr und riskanter, erschließt
  # Nachbarbezirke und leiht – trifft ihn eine Kreditkrise, kündigt die Bank mehr (crisis) und er
  # muss Quellen billig verkaufen. Vorsichtig tilgt, hält Rücklage und bohrt nur Sicheres.
  reserve: { aggressive: 1000, balanced: 3000, cautious: 6000 }    # Rücklage in $, die der Verwalter nicht anrührt
  invest: { aggressive: 0.9, balanced: 0.5, cautious: 0.2 }        # Anteil des Überschusses, der jedes Jahr in neue Bohrungen geht
  minChance: { aggressive: 0.25, balanced: 0.4, cautious: 0.55 }    # gebohrt wird nur, wo der Geologe so viel Fundchance schätzt
  borrow: { aggressive: 0.6, balanced: 0.2, cautious: 0 }          # Anteil des freien Bankrahmens, den der Verwalter je Jahr leiht, wenn es etwas zu bohren gibt (Rest bleibt in der Kasse)
  repay: { aggressive: 0, balanced: 0.3, cautious: 0.8 }           # Anteil des Überschusses, der jedes Jahr Schulden tilgt
  maxNewWells: { aggressive: 5, balanced: 4, cautious: 3 }         # höchstens so viele neue Bohrungen je Jahr (0.4.20+2: vorsichtig 2 → 3)
  # 4.20: Nachbarbezirke für alle Haltungen. Vorher erschloss nur „wagemutig“ einen Bezirk – und weil nach Kapitel 1
  # am Salt Hill kaum Land frei ist, war das der einzige Weg zu neuem Öl: wagemutig endete mit dem 3,7-fachen
  # Imperium und gewann in 70 % der Seeds (Kampagnen-Bots, docs/botlaeufe.md). Jetzt erschließen alle einen,
  # wagemutig bis zu zwei, und ein Bezirk kostet mehr.
  expand: { aggressive: 2, balanced: 2, cautious: 2 }              # Nachbarbezirke, die der Verwalter höchstens erschließt, wenn am offenen Land nichts mehr lohnt (0.4.20+2: ausgewogen und vorsichtig 1 → 2; Förderung nachher ÷ vorher im Median vorher 0,35/0,23, siehe docs/botlaeufe.md)
  # Spielspaß K1: Tiefe Stufen sind teuer (600 m 1.800 $, 900 m 3.200 $). Plante der Verwalter jede Bohrung bis 900 m,
  # bohrte er kaum noch (Förderung nach dem Sprung ÷ vorher im Median 0,36 statt 0,55) – er geht höchstens bis 600 m.
  deepestStage: 2             # so tief bohrt der Verwalter höchstens; liegt das Öl tiefer, gibt er auf
  expandCost: 15000           # $ je erschlossenem Bezirk (Landvermesser, Wege, Agenten); 4.20: 8.000 → 15.000
  upkeepPerWell: 60           # $ je fördernde Quelle und Quartal (Vorarbeiter, Reparaturen)
  # 0.4.19+3: Deckel für den Verwalter. Vorher machten zwei Gusher mit 10.000–14.500 bbl je Runde aus 28.585 $
  # über 500.000 $ – der Sprung belohnte Glück statt das Spiel davor. Jetzt: keine neue Quelle startet stärker als
  # der Schnitt von Jacobs Quellen vor dem Sprung (mindestens minRate bbl je Runde), und je Jahr höchstens so viele
  # neue Quellen, wie vorher förderten (mindestens minNewWells). 0.4.20+2: Der Quellen-Deckel galt vorher für den
  # ganzen Sprung – die Förderung fiel im Schnitt von 22.000 auf 8.800 bbl je Runde, die Kasse wuchs auf 250.000 $.
  manager: { minNewWells: 2, minRate: 3000 }
  family:
    bond: { little: -6, some: -1, much: 4 }         # Beziehung zu Ruth und den Kindern je Jahr
    # Familienzeit kostet Wachstum (GDD §2) – unabhängig vom Geld: Ist Jacob zu Hause, bohrt
    # der Verwalter weniger, und ohne Jacobs Aufsicht bringt das Öl weniger ein.
    growth: { little: 1.15, some: 1, much: 0.7 }    # Faktor auf das Bohrbudget
    wells: { little: 1.25, some: 1, much: 0.6 }     # Faktor auf maxNewWells (abgerundet, mindestens 1)
    revenue: { little: 1.03, some: 1, much: 0.85 }  # Faktor auf den Verkaufserlös (Preise aushandeln, Schwund, Diebstahl)
    claraChance: { little: 0.2, some: 0.35, much: 0.5 }    # Chance je Jahr, dass Ruth Clara erwartet – nur der Zeitpunkt: im letzten Jahr kommt die Nachricht sicher (Weltbibel: Clara wird im Zeitsprung I geboren) …
    claraFromYear: 6          # … frühestens in diesem Spieljahr
    claraStart: 70            # Beziehung zu Clara bei der Geburt
    claraBond: 10             # Weiche „Zu Hause bleiben“: Ruth und Clara +10, „Die Geschäfte gehen vor“: −10
  neighbours:                 # Nachbarquellen am Salt Hill während des Sprungs
    decline: 0.03             # Anteil, der je Quartal versiegt oder aufgibt
    entryPrice: 0.7           # ab diesem Posted Price bohren neue Wildcatter …
    entryRate: 1              # … so viele Quellen je Quartal je 0,30 $ über entryPrice
  crisis:                     # Kreditkrise (Bankpanik oder Crash) während des Sprungs (GDD §15: wer im Boom zu viele Schulden macht, stirbt)
    callShare: 0.3            # die Bank kündigt so viel der Schulden …
    callLeverage: 0.6         # … plus so viel mal die Auslastung des Bankrahmens (Schulden ÷ Rahmen), höchstens alles
    rideCall: 0.3             # nach „weiter auf Pump“ kündigt sie zusätzlich so viel …
    rideStopYears: 2          # … gibt danach keinen Kredit mehr, und der Verwalter bohrt so viele Jahre länger nicht
    fireSale: 0.5             # was die Kasse über der Rücklage nicht deckt, bringen Quellen zu diesem Anteil ihres Werts; im Jahr der Kündigung bohrt er nicht
  switches:                   # Weichen (GDD §13, Zeitsprung I)
    panicRepay: 0.6           # Bankenpanik „tilgen“: so viel der Schulden sofort zurück, danach kein neuer Kredit
    rideBorrow: 0.3           # „weiter auf Pump“: so viel freier Bankrahmen zusätzlich je Jahr
    automobileYear: 7         # die ersten Motorwagen in Port Ellis
    automobileCost: 3000      # Beteiligung an einer Benzinanlage (bleibt: Aufschlag auf jeden verkauften Barrel, auch in Kapitel 2)
    automobilePremium: 0.05   # $ je Barrel mehr ab dem Jahr danach
    okaraFromYear: 6          # neues Ölgebiet in der Prärieprovinz Okara …
    okaraChance: 0.6          # … kommt mit dieser Chance
    okaraCost: 4000           # Pachten in Okara
    okaraSuccess: 0.55        # Chance, dass dort Öl kommt (gewürfelt, auch wenn Bullard die Pachten nimmt)
    okaraIncome: 900          # $ je Quartal bei Erfolg (mal Weltpreis-Faktor), ab dem Jahr danach – für Jacob oder Bullard, auch in Kapitel 2
    okaraValueQuarters: 8     # im Imperiumswert zählt Okara so viele Quartalseinnahmen
  rival:                      # Bullard während des Sprungs
    drillChance: 0.5          # bohrt je Jahr mit dieser Chance, wenn er die Bohrung bezahlen kann
    drillCost: 2500           # $ je Bohrung (dazu der Pachtbonus)
  # Zeitsprung II (Jahr 15–20, 4.19, GDD §13): dieselben Regeln je Quartal wie Zeitsprung I, dazu
  # die Kapitel-2-Firma (Raffinerie, Fernleitung, Anleihen) und die Weichen nach GDD §13. Alle Werte PLATZHALTER.
  # Ausgangslage im Text zum Kapitelstart (0.4.19+2): „schwach“ unter so vielen fördernden Quellen
  # oder unter diesem Imperiumswert (Kapitel 2 / Kapitel 3). Texte: content/timeskip.yaml → textWeak.
  weakStart: { wells: 3, value2: 50000, value3: 250000 }
  second:
    refineryMargin: 0.12      # $ je verkauftem Barrel mehr je Raffinerie-Stufe (Produkte statt Rohöl)
    harborFreight: 0.03       # $ je Barrel Fracht, wenn eine eigene Fernleitung zum Hafen läuft
    warFromYear: 16           # Kriegsgefahr in Übersee: frühestens in diesem Spieljahr …
    warTension: 35            # … sobald die Außenspannung im Weltmodell so hoch ist (oder Krieg herrscht)
    warPremium: 0.25          # Export trotz Risiko: Erlös je Barrel × (1 + so viel), solange der Sprung läuft
    warLossChance: 0.25       # Chance je Jahr, dass ein Tanker nicht zurückkommt …
    warLossCost: 15000        # … und so viel $ kostet
    navyYear: 17              # die Marine sucht Heizöl zum Festpreis (in diesem Spieljahr, nur wer dann fördert)
    # 0.4.19+2: vorher pauschal 6.000 $ je Quartal – auch ohne eine einzige Quelle. Jetzt je verkauftem Barrel.
    navyPremium: 0.08         # $ je verkauftem Barrel über dem Marktpreis (ab dem Quartal danach, bis zum Ende des Sprungs)
    gradyYear: 18             # Senator Grady bietet Reserveland an …
    gradyChance: 0.7          # … mit dieser Chance (sicher, wenn Grady Jacob einen Gefallen schuldet: k2_grady_spende)
    gradyCost: 12000          # Einlage für die Beteiligung an den Pachten
    gradyIncome: 2500         # $ je Quartal ab dem Jahr danach
    gradyTrace: 3             # Schwere der Spur „Reserveland“ im Schattenbuch (Skandal-Saat)
    collegeYear: 18           # Thomas geht aufs College (Weiche im Jahr, in dem er 17 wird, spätestens jetzt)
    collegeCost: 6000         # Studiengeld für vier Jahre
    collegeBond: 8            # College: Thomas +8; gleich in die Firma: Thomas −8

# Bot-Läufe (GDD §17, Schritt 1.14/2.15): Partien ohne Grafik mit vier Strategien.
# Was die Bots damit machen, steht in src/sim/bots.ts. Alle Werte PLATZHALTER.
bots:
  games: 1000              # Partien je Strategie
  seedPrefix: bot          # Seeds bot-0, bot-1, … – für jede Strategie dieselben
  timeskipEnds: 150        # Zeitsprung I (4.5): so viele Kapitelenden des Standard-Bots springen mit allen 9 Direktiven × 2 Antwort-Sätzen
  cautious: { minChance: 0.5, cashReserve: 500, maxStage: 2 }   # vorsichtig: Fundchance ab 50 %, 500 $ Rücklage, höchstens Stufe 2
  greedy: { minChance: 0.25, maxUndrilled: 1 }                 # gierig: pachtet ab 25 % Fundchance, hält höchstens 1 ungebohrte Pacht
  random: { actionsPerRound: 3, logisticsChance: 0.15 }         # zufällig: so viele Aktionen je Runde; mit 15 % je Runde eine zufällige Anschaffung (Tank, Gespann, Pipeline, Drohung …)
  # 2.15: ausgewogen ist der Standard-Bot – leiht, aber nur bis maxDebtShare des Bankrahmens.
  # Notfallregel (0.4.19+2): Nach trockenen Löchern, ohne Quelle und ohne Land leiht er bis emergencyDebtShare,
  # damit er nicht 14 Runden lang nichts tut (vorher blieb er in 35 % der Seeds ohne jeden Fund stehen).
  balanced: { minChance: 0.4, cashReserve: 300, maxStage: 3, maxDebtShare: 0.5, emergencyDebtShare: 0.6, maxUndrilled: 1 }
  # Spielspaß K1 (Tieferbohren): tiefer, wenn die Chance des Geologen ≥ Schwelle × Faktor
  # („lohnt ab“ im Ranch-Fenster = Kosten mit Risiko ÷ Wert eines Funds bis Kapitelende).
  # Vorher: vorsichtig bis Stufe 2 mit Rücklage, gierig immer, ausgewogen bis Stufe 3 – ohne Blick auf die Chance.
  deeper: { cautious: 1.5, greedy: 0.6, balanced: 1.0 }   # Spielspaß K1: gierig bohrt auch deutlich unter der Schwelle weiter (Push your luck, auf Kredit) – mit 0,9 ging er nach dem Streichen der Alltagsbriefe kaum noch pleite (greedyBankrupt ≥ 3 %)
  daysPerRound: 91         # ein Quartal; für die Anfangsrate in bbl/Tag (GDD §15)
  # Ereignisse (2.15): So bewerten die Bots eine Antwort – Geld zählt in $, dazu
  # strength = $ je Kraftpunkt, family = $ je Beziehungspunkt (Ruth, Thomas),
  # appointment = $ je Termin, overtimeFrom = Überstunden nur ab dieser Kraft (über 100 = nie).
  # Den Verkauf an Crane wählt kein Bot – die Partie läuft immer bis zum Kapitelende.
  # traceCost (Betrügerischer Bot, GDD §17) = $ je Schwerepunkt einer Spur für Delaney (Systemwirkung trace/heat in
  # Kapitel 2/3, Merkzeichen aus investigation.traces schon in Kapitel 1), × Faktor der Briefe wie Kraft und Familie.
  # Die ehrlichen Bots nehmen eine schmutzige Antwort nur, wenn sie klar mehr bringt; der betrügerische zählt jeden
  # Schwerepunkt als kleinen Gewinn (negativ) – hinter schmutzigen Antworten stecken Land, Gefallen und Absprachen,
  # die die einfache Bewertung in $ nicht sieht.
  events:
    cautious: { strength: 30, family: 20, appointment: 25, overtimeFrom: 101, traceCost: 2000 }
    greedy: { strength: 5, family: 0, appointment: 5, overtimeFrom: 40, traceCost: 200 }
    balanced: { strength: 15, family: 10, appointment: 10, overtimeFrom: 70, traceCost: 1000 }
    cheat: { strength: 15, family: 10, appointment: 10, overtimeFrom: 70, traceCost: -300 }
  # Transport (0.2.15+4): So nutzen die planenden Bots Lager und Wege – jeder nach seinem Charakter.
  # trader never|always|calc · teams never|overflow|cheaper · pipelinePayback: Pipeline nur, wenn die erwartete
  # Ersparnis das Wievielfache der Kosten bringt (0 = nie) · thorne exclusive|volume|calc|refuse ·
  # guards never|always|enemies · holdShare: so viel bleibt im Tank, wenn der Preis gerade steigt ·
  # margin: nur verkaufen, wenn nach Fracht und Förderzins etwas übrig bleibt (gierig: Menge vor Marge).
  transport:
    cautious: { trader: never, teams: overflow, tanks: true, pipelinePayback: 2, thorne: exclusive, guards: always, holdShare: 0, margin: true }
    greedy: { trader: always, teams: overflow, tanks: true, pipelinePayback: 1, thorne: refuse, guards: never, holdShare: 0.5, margin: false }
    balanced: { trader: calc, teams: cheaper, tanks: true, pipelinePayback: 1.5, thorne: calc, guards: enemies, holdShare: 0, margin: true }
  # Investitionen (0.2.15+7): Amortisation laut src/sim/invest.ts (mit Felddruck und Preisdruck).
  # pumpPayback/wellPayback = höchstens so viele Runden, bis sich Pumpe/weiteres Bohrloch bezahlt machen
  # (0 = nie) · rigs = höchstens so viele Türme (ein weiterer nur, wenn lohnende Bohrlöcher auf einen Turm
  # warten) · rent = mieten statt kaufen · steam/rods = Turm nachrüsten (nur aus der Kasse, ab der ersten Quelle).
  # Justiert mit npm run bots: Ein zweiter Turm lässt den gierigen Bot schneller wildcatten – auf Kredit;
  # schon mit 3 Türmen ging er in 20 % der Partien pleite. Ausgewogen mit 2 Türmen gewann 43 % der Seeds (über 40 %).
  # Feldkauf (0.4.20+31): Die Bots bieten Bullard offer × seinen Preis (höchstens einmal je Runde, für die Ranch mit dem
  # besten Ölfluss je Dollar) – nur wenn das Angebot höchstens maxPrice × Ölfluss ist und danach reserve $ übrig bleiben.
  buyout:
    # Bullards Preis liegt meist beim 1,5- bis 2,3-Fachen des Ölflusses über 8 Runden (Knappheit, Haltung) – für Jacob
    # zählt mehr: die Quelle fördert länger, freie Bohrplätze auf sicherem Land. Probe 100 Partien mit 1,0/1,4/2,0: kaum ein Kauf.
    cautious: { offer: 1.0, maxPrice: 1.8, reserve: 3000 }
    greedy: { offer: 1.2, maxPrice: 3.0, reserve: 500 }
    balanced: { offer: 1.1, maxPrice: 2.4, reserve: 2000 }
  invest:
    cautious: { pumpPayback: 2, wellPayback: 3, rigs: 1, rent: false, steam: false, rods: true }
    greedy: { pumpPayback: 2, wellPayback: 4, rigs: 2, rent: true, steam: true, rods: false }
    balanced: { pumpPayback: 3, wellPayback: 4, rigs: 1, rent: false, steam: true, rods: true }
  # Erkundung (Etappe 1): Kennt der Bot weniger als known bezahlbare freie Ranches mit mindestens until
  # Fundchance (Prognose-Mitte), reitet er bis zu rides Mal je Runde übers Land – vor den Briefen.
  explore:
    cautious: { rides: 1, until: 0.55, known: 1 }
    greedy: { rides: 1, until: 0.40, known: 1 }
    balanced: { rides: 1, until: 0.6, known: 3 }
  # Preis- und Fracht-Karten (Etappe 2): Welcher Bot welche Karte spielt (bluff: hält sich nach einem Zugeständnis
  # nicht an Thornes Bahngrenze). Die Messung (tools/termineMessung2.ts) nimmt für den Standard-Bot nur „thorne“
  # von hier und schaltet die übrigen Karten je Variante selbst.
  plans:
    # Spielspaß K1: Jeder planende Bot spielt die Karten nach Charakter – vorsichtig sichert ab (Liefervertrag, Gemeinschaft),
    # gierig zockt (Gerücht, Crane), ausgewogen drückt die Fracht (Thorne, Gemeinschaft). Thorne mit Bluff kostete den gierigen
    # Bot etwa 9.000 $ (mit billiger Bahn baut er die Pipeline nicht), Brennan dazu hob das Kapitelziel des Standard-Bots über 70 %.
    # Gesamt-Balance: vorsichtig spricht bei Thorne vor, ausgewogen setzt auf die Transportgemeinschaft statt auf Thorne
    # (mit Thorne gewann der ausgewogene 39–44 % der Seeds, Grenze 40 %).
    cautious: { cartel: false, contract: true, rumour: false, crane: false, thorne: true, brennan: false, pool: true, bluff: false, betray: false, guard: true, bank: true, quota: false, advance: false, royalty: true, interview: false }
    greedy: { cartel: false, contract: false, rumour: true, crane: true, thorne: false, brennan: true, pool: false, bluff: false, betray: false, guard: false, bank: true, quota: true, advance: true, royalty: false, interview: false }   # Weichen-Balance: gierig nimmt Brennan (sonst gewann der ausgewogene 39–41 % der Seeds)
    balanced: { cartel: false, contract: false, rumour: false, crane: false, thorne: false, brennan: false, pool: true, bluff: false, betray: false, guard: true, bank: true, quota: true, advance: false, royalty: true, interview: true }
    # Betrügerisch (GDD §17): Förderbremse mit Organisatoren-Klausel, Gerücht, Bluff bei Thorne – und den Pakt verkauft er
    # an Crane, sobald der genug zahlt (betray: feilschen mit Angebot).
    cheat: { cartel: true, contract: false, rumour: true, crane: true, thorne: true, brennan: false, pool: true, bluff: true, betray: true, guard: true, bank: true, quota: true, advance: false, royalty: true, interview: false }
  rightsEstimate: 600      # grobe Schätzung der Bots: so viel kosten die Wegerechte für die Pipeline zusammen
  # Zielwerte Kapitel 1 (2.15, GDD §15 und §17): Toleranzbereich min–max je Kennzahl.
  # Was gemessen wird, steht in src/sim/bots.ts (TARGETS); die Tabelle Ist/Ziel in docs/botlaeufe.md.
  targets:
    winRate: { min: 0, max: 0.40 }            # höchste Siegquote einer Strategie (GDD §17: keine über 40 %)
    standardBankrupt: { min: 0, max: 0.15 }   # Pleitequote ausgewogen (Standard-Bot): Kapitel 1 ist der Einstieg
    greedyBankrupt: { min: 0.03, max: 0.45 }  # Pleitequote gierig (GDD §15: wer im Boom zu viele Schulden macht, stirbt; Crashs kommen erst später); 0.4.20+1: 0,05 → 0,03 – mit der guten ersten Startoption kommt auch der gierige Bot fast immer früh zu Öl und stirbt seltener am Anfang (gemessen 4–4,5 %, vorher 8,7 %); die Kreditkrise kündigt ihm weiter
    cautiousBehind: { min: 0, max: 0.95 }     # Ø Imperium vorsichtig ÷ bester Ø der Mutigeren (GDD §15: wird überholt)
    # Spielspaß K1 (Tieferbohren): VORLÄUFIG 0,70 → 0,82. Mit Gewinnschwelle gibt der Standard-Bot hoffnungslose
    # Tiefen auf, und tiefe Funde sind 2–3-mal so groß: Kapitelziel 66,9 → 80,2 %. Ein höheres goalValue hilft kaum
    # (90.000 $ / 7 Quellen: ~71 %) und schiebt den Pipeline-Anteil über 80 % – die Gesamt-Balance folgt.
    standardGoal: { min: 0.20, max: 0.70 }    # Kapitelziel ausgewogen: erreichbar, aber nicht geschenkt (Spielspaß K1: Grenze bleibt 0,70, dafür Kapitelziel 95.000 $ / 8 Quellen)
    smallRateInRange: { min: 0.90, max: 1 }   # Anteil kleiner Funde mit 50–500 bbl/Tag (GDD §15)
    gusherFactor: { min: 2, max: 20 }         # Ø Anfangsrate Gusher ÷ kleiner Fund (GDD §15: deutlich mehr)
    decline: { min: 0.08, max: 0.15 }         # gemessener Rückgang je Quartal (GDD §15: 8–15 %)
    wildcatHit: { min: 0.05, max: 0.25 }      # blinde Wildcat-Bohrung in Randlage auf 300 m (GDD §15: 1 von 5 bis 1 von 10)
    appointments: { min: 4.5, max: 5 }        # Ø Termine je Runde des Standard-Bots (GDD §15: 5 je Quartal)
    routeShare: { min: 0, max: 0.75 }         # 0.2.15+4: höchster Anteil eines Transportwegs an allen verkauften Barrel – kein Weg dominiert
    pipelineSuccess: { min: 0, max: 0.80 }    # Spielspaß K1: bleibt 0,80 (gemessen um 0,79 – der vorsichtige Bot spricht jetzt bei Thorne vor und schafft das Ziel öfter ohne Pipeline). 0.4.20+1: 0,70 → 0,80 – mit der guten ersten Startoption und dem höheren Kapitelziel sind die erfolgreichen Partien noch mehr die großen Förderer (gemessen 77,4 %); ohne Pipeline schaffen es weiter etwa 15 % aller Partien (vorher 17 %). 0.2.15+4: Anteil der Partien mit Kapitelziel (planende Bots), in denen eine Pipeline läuft; Etappe 1: 0,60 → 0,65 – mit verdeckter Geologie schaffen weniger Partien das Ziel, und die erfolgreichen sind die großen Förderer, bei denen sich die Pipeline lohnt (über alle Partien läuft sie seltener als vorher); Etappe 3: 0,65 → 0,70 – weniger Briefe kosten weniger Geld und Termine, der Standard-Bot baut in erfolgreichen Partien öfter die Pipeline (39 → 53 %), kein Weg dominiert (routeShare um 0,40)
    # 0.2.15+8 Ausbau: Gute Quellen lohnen den Ausbau, aber „alles ausbauen“ ist keine Siegformel.
    expandedShare: { min: 0.05, max: 0.7 }    # Anteil der Ranches mit Fund (planende Bots) mit Pumpe oder weiterem Bohrloch
    investGain: { min: 1.02, max: 10 }        # Ø Imperium ausgewogen ÷ derselbe Bot ohne Ausbau (Investieren zahlt sich aus)
    allOutWins: { min: 0, max: 0.5 }          # Anteil der Seeds, in denen „alles ausbauen“ den Standard-Bot schlägt
  # Kampagnen-Bots (4.20): Dieselben Bots spielen Kapitel 1, Zeitsprung I, Kapitel 2, Zeitsprung II und Kapitel 3
  # (npm run kampagne, src/sim/campaignBots.ts). Je Strategie: Direktiven in beiden Zeitsprüngen (stance, family),
  # Börsengang am Ende von Kapitel 1 (ipo = verkaufter Anteil, 0 = Familienfirma), Antwort je Weiche, Rücklage für
  # Raffinerie, Marke, Tankstellen und Aktien, Tankstellen je Runde, Börse in Kapitel 3 (share = Anteil des freien
  # Geldes je Kauf, leverage = Hebel, sellOnWarning = verkauft, wenn die Zeitung vor der Blase warnt; null = nie),
  # Abwehr im Aktienbuch (defend: Räte umstimmen; Rückkauf von höchstens buyback der Aktien je Runde, sobald Thorne
  # thorneFrom hält oder die Kontrolle unter controlBelow fällt; null = wehrt sich nicht), Anleihen in Kapitel 2/3
  # (bonds.load = Anteil des Anleihen-Rahmens; fehlt = keine Anleihen).
  # Der Zufalls-Bot würfelt Direktiven, Börsengang, Weichen und Börse; die Kapitelsysteme fasst er mit
  # randomSystemsChance je Runde an.
  campaign:
    games: 1000
    randomSystemsChance: 0.3
    cautious:
      stance: cautious
      family: some
      ipo: 0
      answers: { bank_panic: repay, automobile: ignore, okara: pass, clara: home, war_export: hold, navy: accept, grady: refuse, college: college }
      reserve: 25000
      perRound: 2
      exchange: null
      defend: { thorneFrom: 0.05, controlBelow: 0.65, buyback: 0.05 }
      feldzug: { pact: false, loan: false, sellBelow: 25000 }    # 0.4.20+8: hält durch, verkauft Tankstellen, sobald die Rücklage angegriffen ist
    greedy:
      stance: aggressive
      family: little
      ipo: 0.33
      answers: { bank_panic: ride, automobile: invest, okara: lease, clara: business, war_export: export, navy: accept, grady: take, college: company }
      reserve: 5000
      perRound: 4
      exchange: { share: 0.05, leverage: 5, sellOnWarning: false }   # 0.4.20+17: 0,15 → 0,05 – mit 0,15 heizte sein Maklerkredit (~700.000 $) die Börse selbst bis zum Crash an (200 Kampagnen: Siegquote 15,5 → 21,5 %)
      bonds: { load: 0.1 }    # gibt Anleihen bis 10 % des Anleihen-Rahmens aus (0,2: Pleite 74,5 %, 0,5: 90,5 % – Anleihen bringen ihm nie mehr ein, die Krise in Kapitel 3 holt ihn)
      defend: { thorneFrom: 0.15, controlBelow: 0.55, buyback: 0.03 }
      feldzug: { pact: false, loan: true, sellBelow: 0 }         # 0.4.20+8: kämpft auf Pump – Thornes Geld, nie verkaufen (mit Absprache rettete ihn Margarets Gebietsaufteilung: Pleite 70 % → 24 %)
    balanced:
      stance: balanced
      family: some
      ipo: 0.2
      answers: { bank_panic: repay, automobile: invest, okara: lease, clara: home, war_export: hold, navy: accept, grady: refuse, college: college }
      reserve: 15000
      perRound: 3
      exchange: { share: 0.1, leverage: 2, sellOnWarning: true }
      defend: { thorneFrom: 0.1, controlBelow: 0.6, buyback: 0.05 }
      feldzug: { pact: false, loan: true, sellBelow: 5000 }      # 0.4.20+8 Cranes Feldzug: hält durch, überbrückt mit Thornes Geld, verkauft erst knapp vor null
    # Betrügerischer Bot (GDD §17): Wirtschaft, Haltung, Börse und Abwehr wie der Standard-Bot; nimmt Gradys Reserveland,
    # beendet Cranes Feldzug mit der Preisabsprache (Spur für Delaney) und zieht jeden schmutzigen Hebel (dirty, siehe
    # CampaignBotPolicy in src/sim/balance.ts): Sicherheitschef mit Sabotage bei Bullard, Anwalt und politischer Druck
    # gegen Delaney, Lobbyist und Umschläge in Hallstead, Doppelspiel im Konsortium.
    cheat:
      stance: balanced
      family: some
      ipo: 0.2
      answers: { bank_panic: repay, automobile: invest, okara: lease, clara: home, war_export: hold, navy: accept, grady: take, college: college }
      reserve: 15000
      perRound: 3
      exchange: { share: 0.1, leverage: 2, sellOnWarning: true }
      defend: { thorneFrom: 0.1, controlBelow: 0.6, buyback: 0.05 }
      feldzug: { pact: true, loan: false, sellBelow: 5000, pactAfter: 3 }   # lässt Crane erst 3 Runden bluten, dann die Absprache (sofort: Endwert gleicher Start +115.000 $ über dem Standard-Bot)
      dirty: { fixer: true, sabotageBelow: 40, lawyer: 3, pressure: true, lobbyist: tibbs, bribe: true, konsortium: ausspielen }   # Anwalt 2: Haft 42 %, 3: 35 % (60 Seeds)
  # Zielwerte Kapitel 1–3 (4.20, GDD §15 und §17): Toleranzbereich min–max je Kennzahl, Tabelle Ist/Ziel in
  # docs/botlaeufe.md (Abschnitt „Kapitel 2 und 3“). Krisen: GDD §15 nennt Zahlen je Kampagne (7 Kapitel, 73 Jahre);
  # Kapitel 1–3 sind 24 Jahre, also rund ein Drittel davon.
  campaignTargets:
    creditCrises: { min: 0.66, max: 1.32 }    # GDD §15: 2–4 Kreditkrisen je Kampagne × 24/73 (Welten des vorsichtigen Bots: kein Kauf auf Kredit, also „ohne Eingreifen“)
    gluts: { min: 0.33, max: 1.0 }            # GDD §15: 1–3 Ölschwemmen je Kampagne × 24/73
    wars: { min: 0, max: 0.66 }               # GDD §15: 0–2 Kriege je Kampagne × 24/73
    standardSurvives: { min: 0.6, max: 0.9 }  # Standard-Bot bis Ende Kapitel 3 (GDD §17: Kapitel 4 in 55–70 %)
    standardBankruptK2: { min: 0, max: 0.15 } # Pleitequote Standard-Bot in Kapitel 2 (mit Sprung I) nach bestandenem Kapitel 1 (wer Kapitel 1 ohne Quelle beendet, geht im Sprung meist pleite – das zählt standardSurvives)
    standardBankruptK3: { min: 0, max: 0.15 } # dasselbe für Kapitel 3 (mit Sprung II) nach bestandenem Kapitel 2
    greedyBankrupt: { min: 0.2, max: 0.75 }   # GDD §15: wer im Boom zu viele Schulden macht, stirbt (dazu die Hälfte seiner Kapitel-1-Partien ohne Quelle)
    greedyCrisisRisk: { min: 1.5, max: 20 }   # Pleite gierig in Kapitel 1 mit Kreditkrise ÷ ohne (der Crash trifft die Verschuldeten; ab Kapitel 2 hat der gierige Bot kaum noch Bankschulden – dort nur Kennzahl)
    standardGoalK2: { min: 0.2, max: 0.7 }    # Kapitelprüfung 2 erreichbar, aber nicht geschenkt
    standardGoalK3: { min: 0.2, max: 0.7 }    # Kapitelprüfung 3 erreichbar, aber nicht geschenkt
    growthK2: { min: 1.5, max: 50 }           # Ø Imperium Ende Kapitel 2 ÷ Ende Kapitel 1 (aus der Firma wird ein Herausforderer)
    growthK3: { min: 1.2, max: 50 }           # Ø Imperium Ende Kapitel 3 ÷ Ende Kapitel 2 (aus dem Herausforderer ein Konzern)
    cautiousBehind: { min: 0, max: 0.95 }     # Ø Endwert vorsichtig ÷ bester Ø der Mutigeren (GDD §15: wird überholt)
    winRate: { min: 0, max: 0.4 }             # höchste Siegquote einer Strategie über die Kampagne (GDD §17)
    fairWinRate: { min: 0, max: 0.4 }         # dasselbe, wenn alle Kapitel 2/3 vom Kapitelende des Standard-Bots aus spielen (Kapitel 1 herausgerechnet)
    stanceWin: { min: 0, max: 0.6 }           # höchste Siegquote einer Haltung im Zeitsprung (3 Haltungen; kein dominanter Weg)
    # Betrügerischer Bot (GDD §17): Betrug lohnt sich manchmal, oft endet er aber vor Gericht.
    cheatPrison: { min: 0.1, max: 0.4 }       # Anteil seiner Kampagnen, die mit Haft enden („Hinter Gittern“)
    cheatCaught: { min: 0.25, max: 0.8 }      # Anteil seiner Kampagnen mit einer Verurteilung (Geldstrafe, Zwangsverkauf oder Haft)

# Rivalen (GDD §9.2, §15). Bullard pachtet und bohrt nach Gewinn-Formel.
rivals:
  bullard:
    name: '"Big" Jim Bullard'
    personality: { risk: 5, aggression: 5, loyalty: 5, grudge: 5, patience: 1 }
    startCash: 6000
    actionsPerRound: 1
    valuePerFind: 25000      # 1.16: vorher 8.000 – alte Größenordnung; ein kleiner Fund (Ø 31.500 bbl × ~0,8 $) bringt jetzt etwa 25.000 $
    riskWeight: 0.10
    nearJacobBonus: 300
    nearFindChance: 0.15
    insight: 0.5             # Etappe 1, PLATZHALTER: Bullard ahnt die Hälfte dessen, was eine Ranch besser oder schlechter ist als ihre Zone
    noise: 1000              # 1.16: vorher 200, mit valuePerFind mitgezogen
    minUtility: 0
    drillRounds: 1
    ratePerWell: 4000        # Anfangsförderung je Quelle in Barrel je Runde; fällt wie bei Jacob um production.decline
    # Nachbesserung 0.1.14+3: statt pauschal 3.000 $ je Quelle und Runde verkauft Bullard
    # seine Förderung zum Posted Price: Förderung · (Preis · (1 − Förderzins) − Transport).
    transportPerBarrel: 0.40 # PLATZHALTER: $ je Barrel (eigene Fuhrwerke, zwischen Bahn 0,25 und Fuhrwerk 0,60)
    # 2.8: Bullard merkt sich Jacobs Antwort im Saloon (Merkzeichen, content/events/k1-rivalen.yaml).
    # Handschlag: Er pachtet nichts direkt neben Jacobs Land. Fehde (oder Verrat): Nachbarschaftsbonus × feudFactor.
    feudFactor: 2            # PLATZHALTER
  # 2.8 (GDD §9.2): Cornelius Crane, Crane Trust – diktiert den Posted Price und bietet am Kapitelende die Übernahme an.
  crane:
    name: Cornelius Crane
    priceCut: 0.10           # PLATZHALTER: Posted-Price-Druck – so viel $ je Barrel zahlt der Trust Jacob weniger …
    cutRounds: 4             # PLATZHALTER: … so viele Runden lang (ab der Runde nach der Antwort)
    allianceFactor: 0.5      # PLATZHALTER: mit Delgados Verband unabhängiger Produzenten nur die Hälfte
    takeoverPremium: 1.25    # PLATZHALTER: Übernahmeangebot = Imperiumswert × 1,25 …
    loyalPremium: 1.10       # PLATZHALTER: … nach einer Treueerklärung nur × 1,10 (er hat Jacob schon in der Tasche) …
    takeoverMin: 3000        # PLATZHALTER: … aber mindestens so viel $
  # 2.8 (GDD §9.2): Augustus Thorne, Thorne Rail & Trust Bank – Bahntarife (Erhöhung: transport.thorne).
  thorne:
    name: Augustus Thorne
    contractRounds: 6        # PLATZHALTER: Frachtvertrag – so viele Runden keine Tariferhöhung (ab der Unterschrift)
    refusedHikeFactor: 2     # PLATZHALTER: Vertrag abgelehnt – Thorne erhöht danach doppelt so oft
  # 2.8 (GDD §9.2): kleine Wildcatter im Hintergrund. Ihnen gehören die Nachbarquellen am Salt Hill
  # (market.neighbours) – sie ändern den Markt nicht, sie geben ihm Namen.
  wildcatters:
    min: 6                   # so viele kleine Firmen je Partie (mindestens …
    max: 8                   # … höchstens)
    names:                   # ENTWURF: Namen, aus denen jede Partie zieht (mindestens max Stück)
      - Ezra Pickett
      - Haskell & Dunn
      - Widow Carraway
      - Lars Lindqvist
      - Bascom Brothers
      - Caleb Shaw
      - Two-Rig Tilly
      - Jeb Merriwether
      - O'Rourke Drilling
      - Amos Fairweather

# --- 4.10 Andockpunkt: eigener Block diplomacy, bewusst neben rivals statt am Dateiende ---
# 4.10 Rivalen-Diplomatie und Crane-Nachfolge (GDD §9, §13 Kapitel 2). Eigenes Modul:
# src/sim/diplomacy*.ts. Erst ab Kapitel unlockChapter; in Kapitel 1 unsichtbar.
# Texte: content/diplomacy.yaml und content/events/k2-diplomatie.yaml.
# Alle Zahlen PLATZHALTER, bis Kapitel 2 spielbar ist und Bots darüber laufen.
diplomacy:
  unlockChapter: 2
  # Beziehungen (GDD §9.3): Vertrauen −100…+100 und Groll 0…100 getrennt; Verrat verfällt nie.
  relations:
    trustDrift: 2            # Vertrauen wandert je Runde so viele Punkte Richtung 0
    grudgeDecay: 4           # Groll verblasst je Runde um grudgeDecay × (6 − Nachtragen) / 5
    respectStart: 50         # Branchen-Respekt 0–100: wie sehr die Rivalen Jacobs Wort trauen
    betrayalTrust: 60        # Verrat: Vertrauen −60 beim Betrogenen …
    betrayalGrudge: 50       # … Groll +50 …
    betrayalRespect: 15      # … und Branchen-Respekt −15 bei allen
    revengeGrudge: 60        # ab diesem Groll schlägt ein Rivale zurück (GDD §9.5) …
    revengeChance: 0.3       # … je Runde mit dieser Chance × Aggressivität / 5
    revengeRounds: 2         # Rache wirkt so viele Runden
    revengePrice: 0.05       # Margaret/Pruett: Trust zahlt so viel $ je Barrel weniger
    revengeLeaseCost: 0.15   # Bullard/Delgado: Pachten so viel teurer (Anteil am Bonus)
    revengeRail: 0.03        # Thorne: Bahntarif dauerhaft so viel $ je Barrel höher
    revengeRelief: 25        # nach der Rache sinkt der Groll um so viel
    reconcileGrudge: 20      # Versöhnungsbrief nach einer Rache (Ereignis k2_rache_…): Groll − so viel
  # Persönlichkeiten (GDD §9.2, Skala 1–5); Bullard steht unter rivals.bullard.
  # kinds: welche Absprachen der Rivale überhaupt eingeht (price, territory, supply, cross).
  rivals:
    margaret: { personality: { risk: 4, aggression: 3, loyalty: 2, grudge: 3, patience: 4 }, kinds: [supply, cross] }
    pruett:   { personality: { risk: 1, aggression: 2, loyalty: 4, grudge: 3, patience: 5 }, kinds: [price, territory, cross] }
    bullard:  { kinds: [price, territory, cross] }
    thorne:   { personality: { risk: 3, aggression: 4, loyalty: 1, grudge: 4, patience: 4 }, kinds: [cross] }
    delgado:  { personality: { risk: 2, aggression: 2, loyalty: 5, grudge: 2, patience: 3 }, kinds: [] }
  # Startbeziehung aus Kapitel 1 (Merkzeichen aus content/events/k1-rivalen.yaml).
  carryOver:
    bullardPactTrust: 40     # Handschlag mit Bullard
    bullardFeudGrudge: 50    # Fehde
    craneLoyalTrust: 15      # Treueerklärung an Cornelius: beide Erben trauen Jacob etwas mehr
    delgadoMemberTrust: 30   # schon in Kapitel 1 in Delgados Verband
    thorneContractTrust: 15  # Frachtvertrag mit Thorne
    thorneRefusedGrudge: 20  # Frachtvertrag abgelehnt
  # Nachfolge im Crane Trust (GDD §13 Kapitel 2): Margaret Crane gegen Harold Pruett.
  succession:
    rounds: 8                # so viele Runden ringen beide um den Aufsichtsrat
    boardSeats: 12           # Sitze im Aufsichtsrat (nur Anzeige: Anteil × Sitze)
    startShare: 0.5          # Margarets Anteil im Aufsichtsrat zu Beginn
    creditDrift: 0.04        # Boom hilft Margaret, Krise Pruett: Anteil += creditDrift × (Kreditklima − 50) / 50
    noise: 0.06              # Zufall je Runde (± noise / 2)
    backCost: 1500           # Jacob stellt sich öffentlich hinter einen Erben: kostet so viel $ …
    backShift: 0.08          # … und verschiebt den Anteil um so viel (× Respekt-Faktor) …
    backAppointments: 1      # … und so viele Termine; einmal je Runde
    visitShift: 0.05         # Zusage beim Besuch (Ereignis) verschiebt den Anteil einmalig
    farewellTrust: 10        # Abschiedsbesuch bei Cornelius: beide Erben trauen Jacob mehr
    winnerTrust: 25          # Wer gewinnt, vergisst Jacobs Rückhalt nicht …
    loserGrudge: 20          # … wer verliert, auch nicht
    doubleGameTrust: 30      # beiden zugesagt: beide trauen Jacob danach so viel weniger
    congratsTrust: 10        # Glückwunsch an die Siegerin / den Sieger
    partnerTrust: 20         # Margaret führt: Partneraufschlag ab diesem Vertrauen – oder mit laufendem Liefervertrag/Kreuzbeteiligung
    margaretPremium: 0.06    # $ je Barrel, die Margarets Trust ihren Partnern mehr zahlt
    pruettCut: 0.05          # $ je Barrel, die Pruetts Trust allen weniger zahlt (Kostenkürzer) – außer Partnern einer Preisabsprache
    breakupPremium: 0.04     # zerschlagen: Crane Eastern und Crane Midland bieten gegeneinander, so viel $ je Barrel mehr
    # Zerschlagung (GDD §7.2): Druck sammelt sich je Runde; ab 1 wird der Trust zerschlagen.
    breakup:
      law: 0.2               # je Runde mit Kartellgesetz
      volksbund: 0.1         # je Runde, in der der Volksbund regiert
      mood: 0.15             # × (50 − Stimmung) / 50, nur bei Unmut
      decay: 0.05            # ohne Anlass sinkt der Druck je Runde
      push: 0.15             # Jacob schiebt an (Unterlagen an die Presse) oder bremst (Freunde in Hallstead)
      pushCost: 2000         # kostet so viel $ und einen Termin; einmal je Runde
      maxWithoutLaw: 0.9     # ohne Kartellgesetz keine Zerschlagung
  # Absprachen (GDD §9.4 Kooperation).
  pacts:
    appointments: 1          # ein Vorschlag am Schreibtisch kostet so viele Termine
    acceptThreshold: 15      # Zusage, wenn Vertrauen + Respekt-Bonus + Treue-Bonus − Groll ≥ diese Zahl
    respectWeight: 0.5       # Respekt-Bonus = respectWeight × (Respekt − 50)
    loyaltyWeight: 6         # Treue-Bonus = loyaltyWeight × (Vertragstreue − 3)
    acceptTrust: 5           # angenommenes Angebot: Vertrauen + so viel
    declineGrudge: 5         # abgelehntes Angebot: Groll + so viel
    rounds: 6                # eine Absprache gilt so viele Runden
    pricePremium: 0.08       # Preisabsprache: so viel $ je Barrel mehr
    territoryLeaseCost: 0.15 # Gebietsabsprache: Pachten so viel billiger (Anteil am Bonus)
    supplyPremium: 0.10      # Exklusiver Liefervertrag mit Crane Eastern: so viel $ je Barrel mehr …
    supplyBullardGrudge: 25  # … aber Bullard verliert seinen Abnehmer (GDD §9.7)
    crossCost: 3000          # Kreuzbeteiligung: so viel $ für die Aktien des anderen …
    crossShield: 0.25        # … und so viel Schutz vor Übernahmen (für 4.8)
    cartelHeat: 3            # Preis- und Gebietsabsprachen mit Kartellgesetz: Spur der Schwere 3
    cartelMood: 2            # jede laufende Kartellabsprache drückt die Stimmung um so viel (für 4.2)
    breakChance: 0.03        # Rivale bricht je Runde mit Chance breakChance × (6 − Vertragstreue) + Groll / 1000
    breakRounds: 2           # wer zuerst bricht, kassiert so viele Runden doppelt
    offerChance: 0.35        # je Runde schlägt ein Rivale mit dieser Chance selbst etwas vor …
    offerMaxGrudge: 40       # … aber nur, wenn sein Groll darunter liegt …
    offerMargin: 10          # … und er selbst fast zusagen würde: acceptScore ≥ acceptThreshold − offerMargin
    offerRounds: 2           # ein Angebot liegt so viele Runden auf dem Tisch
  # Übernahmen (GDD §9.4, §9.6): kleine Wildcatter kaufen; Pruett kauft in Krisen auf.
  takeovers:
    appointments: 1
    pricePerWell: 2500       # Kaufpreis je Quelle der Firma …
    premium: 0.2             # … plus Aufschlag
    barrelsPerWell: 300      # gekaufte Firma: Förderung je Quelle und Runde …
    costPerBarrel: 0.45      # … abzüglich Kosten je Barrel; der Rest geht an Jacob
    crisisCredit: 35         # Krise: Kreditklima unter diesem Wert
    pruettBuyChance: 0.3     # in der Krise kauft Pruett je Runde mit dieser Chance eine Firma (als Trustchef doppelt)
    distressPremium: 0.6     # Steht Jacob vor der Pleite, bietet Pruett Imperiumswert × 0,6 …
    distressMin: 5000        # … mindestens so viel $
    crisisHelpTrust: 5       # Jacob nimmt die Leute einer von Pruett geschluckten Firma auf: Delgado traut ihm mehr …
    crisisHelpGrudge: 5      # … Pruett grollt
  # Delgados Produzentenverband (GDD §9.2, §13 Kapitel 2).
  guild:
    foundDelay: 2            # Delgado gründet den Verband so viele Runden nach Kapitelbeginn
    startMembers: 12         # Mitglieder bei der Gründung
    fullMembers: 40          # ab so vielen Mitgliedern verhandelt der Verband mit voller Kraft
    growChance: 0.5          # je Runde kommt mit dieser Chance ein Mitglied dazu (mit Jacob zwei)
    dues: 150                # Beitrag je Runde
    premium: 0.06            # $ je Barrel mehr bei voller Kraft (gemeinsam gegen den Posted Price)
    leaveTrust: 10           # Austritt: Delgado traut Jacob so viel weniger
    tooBigValue: 600000      # ab diesem Imperiumswert ist Jacob für Delgado selbst ein Trust
    fightGrudge: 30          # Ausschluss im Streit: Delgados Groll + so viel
    outsiderLeaseCost: 0.1   # zu groß und nicht (mehr) im Verband: Unabhängige verpachten nur teurer
# --- Ende 4.10 Andockpunkt (Block diplomacy) ---

# Ereignis-System (2.1): Ereignisse stehen in content/events/, hier nur die Taktung.
events:
  maxPerRound: 1           # PLATZHALTER: höchstens so viele neue Ereignisse je Runde
  repeatCooldown: 3        # Wiederholungsschutz (2.10a): wiederkehrende Ereignisse und Varianten einer Gruppe frühestens nach 3 Runden wieder (ein Ereignis kann eigenen cooldown haben; höchstens guaranteeRounds, sonst stockt die Post-Garantie)
  # Posteingang (2.4, GDD §3): Briefe (mail: offer/demand/info/personal) kommen zusätzlich mit der Post.
  mail:
    maxPerRound: 1         # PLATZHALTER: höchstens so viele neue Briefe je Runde
    deadlineRounds: 2      # PLATZHALTER: Frist eines Briefs in Runden (Ankunftsrunde mitgezählt); letzte Runde = rotes Siegel
    guaranteeRounds: 8     # Kam von einer Briefart 8 Runden keiner, bringt die Post sicher einen (jede Art kommt so in jeder Partie). Etappe 3: 6 → 8 – weniger Pflichtpost, mehr Platz für Antworten auf Jacobs Pläne
    perRival: 1            # Etappe 3: höchstens ein Brief je Rivale und Runde (z. B. nie zwei Thorne-Briefe zugleich); sichere Briefe kommen trotzdem und zählen mit
  # Dokumentenprüfung (2.5, GDD §3): Briefe mit Dokument (Pachturkunde, Gutachten) können gefälscht sein.
  documents:
    forgeryChance: 0.5     # PLATZHALTER: Chance, dass ein Dokument gefälscht ist (ein Ereignis kann eigene forgeryChance haben)
    maxChecks: 2           # PLATZHALTER: so viele Felder prüft die Lupe je Dokument (sonst wäre alles prüfen zu leicht)
  # Befristete Nachwirkungen (0.2.15+3): Ereignis-Effekte price ($ je Barrel beim Crane Trust),
  # production (Anteil der eigenen Förderung) und leaseCost (Anteil am Pachtbonus) gelten so viele
  # Runden, die Antwortrunde mitgezählt. Dieselbe Wirkung aus demselben Ereignis zählt nur einmal.
  timedRounds: 4           # PLATZHALTER
  # Prüfung schwacher Antworten (0.2.15+3, npm run check:events): Eine Antwort ist spürbar, wenn sie
  # mindestens minShare × chapterMoney wert ist (Kapitel 1: 600 $; Ereignisse späterer Kapitel × laterChapterMoney: 200 $),
  # eine dauerhafte Wirkung hat (Tarif,
  # Fuhrwerke, Preis, Förderung, Pacht) oder ein Merkzeichen setzt, das später etwas abfragt.
  # Kraft und Familie zählen mit den Gewichten des Standard-Bots (bots.events.balanced), Öl zum Trendpreis.
  relevance:
    chapterMoney: 60000    # Briefe mit Gewicht: typisches Imperium zur Mitte von Kapitel 1 (Median Runde 6–11 ≈ 63.000 $, tools/briefGewicht.ts) – 1 % = 600 $
    laterChapterMoney: 20000  # Kapitel 2/3 wie bisher (1 % = 200 $), bis sie eigene Balance haben
    minShare: 0.01         # 1 % davon (Kapitel 1: 600 $, spätere Kapitel 200 $) – Ziel „Briefe mit Gewicht“: ein normaler Brief bewegt 1–3 % des Imperiums
    refBarrels: 9000       # typische Förderung je Runde zur Kapitelmitte (Briefe mit Gewicht: Median Runde 6–11 des Standard-Bots ≈ 9.000 bbl; vorher 5.000)
    refLeaseSpend: 1500    # typischer Pachtbonus in timedRounds Runden
    letterScale: 5         # Briefe mit Gewicht: In Kapitel 1 zählen Geld (ohne fixedCash), Kraft und Familie × 5 – typischer Faktor events.scale zur Kapitelmitte (tools/briefGewicht.ts)
  # Briefe mit Gewicht (Spielspaß-Durchgang, src/sim/letterScale.ts): Nur in Kapitel 1 wachsen die
  # Geldbeträge der Ereignis-Antworten (cash, auch die Geldbedingung minCash der Antwort) mit Jacobs
  # Geschäft. Faktor = Erlös je Runde ÷ ref, mindestens 1, höchstens max. Erlös je Runde = was Jacobs
  # Quellen in der letzten Runde gefördert haben (ohne Förderzins-Öl) × Ø Posted Price der letzten
  # rounds Runden. Ausnahme: fixedCash: true an der Antwort (echte feste Preise, Kredite mit Rückzahlung).
  scale:
    ref: 1250              # PLATZHALTER: bis 1.250 $ Erlös je Runde bleiben die Beträge wie geschrieben (Gesamt-Balance: mit 1.500 $ lag ein normaler Brief bei 0,9 % des Imperiums, Ziel 1–3 %)
    max: 8                 # PLATZHALTER: höchster Faktor (mit 4 bliebe ein normaler Brief am Kapitelende bei ~0,5 % des Imperiums)
    rounds: 3              # Posted Price über 3 Runden gemittelt

# Weichen statt Alltagspost (Spielspaß K1, src/sim/weichen.ts): Kapitel 1 hat nur noch wenige Ereignisse, jedes mit
# Folgen bis Kapitelende (lasting, land, rig an den Antworten in content/events/k1-*.yaml).
weichen:
  ruthCredit: 1.25         # PLATZHALTER: Steht Ruth mit auf den Urkunden, gibt die Bank 25 % mehr Rahmen (bis Kapitelende)

# Gekoppelte Briefe (Termine als Hauptwerkzeug, Etappe 3, src/sim/letters.ts): Viele Briefe in Kapitel 1
# kommen nur noch als Antwort auf Jacobs Pläne (Ritt, Besuch bei Thorne, Gerücht, Förderbremse …).
# Die Simulation setzt dafür Merkzeichen – welche, steht in letters.ts (LETTER_MARKS). Alles PLATZHALTER.
letters:
  window: 4                    # ein Plan-Merkzeichen (z. B. „thorne_besucht“) bleibt 4 Runden stehen – so lange kann ein Brief antworten
  holdStock: 2000              # „Öl zurückgehalten“: nach den Verkäufen stehen noch mindestens 2.000 bbl im Tank
  standing: 0.05               # Antworten, die den Wildcattern helfen (+) oder sie verprellen (−): so viel Ruf
  cheapExclusivePenalty: 0.20  # Brief „Exklusiv jetzt billiger“: Strafe je Barrel über andere Wege (statt 0,30 $)
  thorneLatest: 4              # Thornes Frachtvertrag kommt nach Jacobs erstem Besuch, spätestens ab Runde 4 (wie vorher; Rivalenzug 2.8)

# Termine und Kraft (2.3, GDD §3 und §4). Kraft ist für den Spieler nie als Zahl sichtbar.
agenda:
  appointments: 5          # Termine je Runde (GDD §3: zu Beginn 5 pro Quartal)
  maxOvertime: 2           # Überstunden: bis zu 2 Termine extra (GDD §3)
  overtimeCost: 5          # Kraft je Überstunde (GDD §4: −5 je Extra-Termin)
  restBonus: 5             # Kraft nach einer Runde ohne Überstunden (GDD §4: +5)
  tiredBelow: 50           # unter dieser Kraft … (GDD §4)
  tiredPenalty: 1          # … 1 Termin weniger je Runde
  strengthStart: 100
  strengthMax: 100         # Kapitel 1; sinkt mit dem Alter (90, 80, 70, 55) – kommt mit späteren Kapiteln
  # Schwellen (2.7, GDD §4): Was niedrige Kraft anrichtet.
  errorsBelow: 30          # unter 30: Fehler – die besten Antworten (sharp) fehlen, …
  errorsCheckPenalty: 1    # … und die Lupe prüft so viele Felder weniger
  sickBelow: 15            # unter 15 am Rundenende: Jacob wird krank (keine Termine, Ereignisse laufen ohne ihn)
  sickRoundsMax: 3         # krank 1–3 Runden: je tiefer die Kraft, desto länger (kein Zufall)
  collapseRounds: 4        # bei 0: Zusammenbruch, lange Krankheit (Tod und Erbfolge erst ab späteren Kapiteln)
  sickRecovery: 10         # PLATZHALTER: Kraft je Runde im Krankenbett (zusätzlich zur ruhigen Runde)

# Familie (2.7, GDD §12 und §4): Ruth und Thomas. Beziehung 0–100, angezeigt als Zustandswort.
# Texte stehen in content/family.yaml, Familientermine in content/events/.
family:
  ruthStart: 70            # PLATZHALTER: Beziehung zu Ruth bei Spielbeginn
  thomasBirthRound: 3      # Thomas kommt zu Beginn von Runde 3 zur Welt (Herbst 88; Ruth ist zu Spielbeginn schwanger)
  thomasStart: 70          # PLATZHALTER: Beziehung zu Thomas bei der Geburt
  neglect: 4               # PLATZHALTER: Beziehung −4 je Runde ohne Familienzeit (nicht, solange Jacob krank zu Hause liegt)
  strengthFrom: 3          # Familienzeit gibt am Rundenende Kraft: +3 bei kaputter …
  strengthTo: 8            # … bis +8 bei bester Beziehung (GDD §4: +3 bis +8)
  contentFrom: 60          # ab 60: zufrieden
  neglectedFrom: 35        # ab 35: vernachlässigt
  bitterFrom: 15           # ab 15: verbittert, darunter entfremdet

# Zeitung (2.6, GDD §7.2): Frühwarnzeichen. Die Zeitung schätzt den Posted Price,
# den der Trust am Ende der Runde festlegt, und zeigt nur eine Schlagzeile, nie die Zahl.
# Texte stehen in content/newspaper.yaml.
newspaper:
  fallFrom: 0.05           # PLATZHALTER: erwarteter Preisverfall ab 5 % → „Volle Tanks“ (die Nachbarn allein drücken ~4 % je Runde)
  crashFrom: 0.12          # PLATZHALTER: ab 12 % → „Tanks laufen über“
  riseFrom: 0.05           # PLATZHALTER: erwarteter Anstieg ab 5 % → „Leere Tanks“
  maxItems: 3              # Kurzmeldungen unter der Titelseite

# Einstieg (2.13): Tutorial-Hinweise führen durch Pacht, Bohrung und Verkauf.
# Texte stehen in content/tutorial.yaml; im Spiel lassen sie sich abschalten.
tutorial:
  lastRound: 8               # spätestens nach Runde 8 schweigen die Hinweise (halbes Kapitel)
  endAfterProducedRounds: 2  # fertig, wenn die erste Quelle 2 Runden gefördert hat (die Verkaufsrunde ist vorbei)
  dollarsPerPoint: 100       # Frühes Öl (0.4.4+): 100 $ Pacht wiegen einen Prozentpunkt Schätzung auf – der Hinweis rät nicht zur teuren Pacht, die kaum besser aussieht
  loanRounding: 100          # vorgeschlagene Kredite auf 100 $ aufgerundet (mindestens credit.minLoan)
  exploreBelow: 55           # Etappe 1, PLATZHALTER: sieht die beste bezahlbare Ranch schlechter aus als 55 %, rät der Hinweis erst zum Ritt übers Land

# 4.16 Andockpunkt – Nebeninvestments und Lobbyist in Hallstead (GDD §8, §10, §11).
# Erst ab Kapitel 3; in Kapitel 1 unsichtbar. Texte stehen in content/hallstead.yaml.
# Alle Beträge sind PLATZHALTER im Maßstab eines Konzerns (Kapitel 3), Balance mit Phase 4.
hallstead:
  unlockChapter: 3           # ab Kapitel 3 liegt die Hallstead-Mappe auf dem Tisch
  fallbackElectionEvery: 16  # ohne Weltmodell (4.1): Wahl alle 16 Runden (4 Jahre)
  bankRateDiscount: 0.02     # eigene Bank: Bankzins 2 Punkte billiger (wie credit.collateralDiscount, wirkt in credit.ts)
  holdings:
    sellFee: 0.05            # Verkauf kostet 5 % des Werts (Makler, Abschlag)
    # Wert je Runde: × (1 + drift + creditBeta·(Kreditklima − 50) + demandBeta·Nachfragewachstum ± noise)
    # crashDrop: einmal, wenn ein Crash beginnt. shock: Schlag aus heiterem Himmel, je Runde gewürfelt
    # (crashOnly: nur einmal je Crash gewürfelt, wenn er beginnt – höchstens ein Schlag je Krise).
    kinds:
      land:                  # Land in Boomtowns: steigt mit der Förderung, fällt, wenn das Feld versiegt
        price: 20000
        single: false
        yield: 0.012         # Pacht und Mieten je Runde
        drift: 0.015
        creditBeta: 0.0005
        demandBeta: 0.5
        noise: 0.04
        crashDrop: 0.15
        shock: { chance: 0.04, drop: 0.7, crashOnly: false }   # Feld versiegt: −70 %
      bahn:                  # Eisenbahnaktien: hohe Erträge im Boom, schwere Verluste im Crash
        price: 50000
        single: false
        yield: 0.015
        drift: 0.005
        creditBeta: 0.002
        demandBeta: 0.3
        noise: 0.06
        # Folgt dem Börsensektor „rail“ (Thorne Bahn), sobald Jacobs Börse offen ist: Wert × (1 + 0,6 × Kursänderung
        # der Sektor-Aktien in der letzten Runde). Der Crash-Einbruch (crashDrop) entfällt dann – der Kurs trägt ihn schon.
        exchangeSector: rail
        exchangeBeta: 0.6
        crashDrop: 0.35
        shock: { chance: 0, drop: 0, crashOnly: false }
      auto:                  # Autoaktien: wachsen mit der Nachfrage, stürzen im Crash am tiefsten
        price: 50000
        single: false
        yield: 0.004
        drift: 0.012
        creditBeta: 0.003
        demandBeta: 1.5
        noise: 0.1
        exchangeSector: auto   # folgt den Autoaktien der Börse (Motorwagen), s. Eisenbahn
        exchangeBeta: 0.6
        crashDrop: 0.45
        shock: { chance: 0, drop: 0, crashOnly: false }
      zeitung:               # eigene Zeitung: kostet eher, bringt Einfluss (Kampagnen)
        price: 150000
        single: true
        yield: -0.004
        drift: 0
        creditBeta: 0
        demandBeta: 0
        noise: 0.02
        crashDrop: 0.1
        shock: { chance: 0, drop: 0, crashOnly: false }
      bank:                  # eigene Bank: billige Kredite, Bankrun-Gefahr in jeder Kreditkrise
        price: 500000
        single: true
        yield: 0.02
        drift: 0.004
        creditBeta: 0.001
        demandBeta: 0
        noise: 0.03
        crashDrop: 0.2
        shock: { chance: 0.35, drop: 0.6, crashOnly: true }    # Bankrun: 35 % je Kreditkrise (einmal gewürfelt, wenn sie beginnt), −60 %
  newspaper:
    credibilityStart: 80     # Glaubwürdigkeit der eigenen Zeitung (0–100)
    campaignCost: 15         # jede Kampagne kostet so viel Glaubwürdigkeit
    recovery: 4              # Runde ohne Kampagne: +4
    moodPerCampaign: 3       # Stimmung (Weltmodell) +3 bei voller Glaubwürdigkeit
    favorsPerCampaign: 1     # Gefallen bei voller Glaubwürdigkeit
    scratchedBelow: 60       # Glaubwürdigkeit unter 60: „Die Leser werden misstrauisch“
    lostBelow: 30            # unter 30: „Niemand glaubt dem Blatt mehr“
  lobby:
    favorsPerCompetence: 0.5 # Gefallen je Runde = Kompetenz × 0,5 × Regierungsfaktor
    government: { handel: 1.25, volksbund: 0.75, provinz: 1.0 }
    maxFavors: 20            # mehr Gefallen schuldet einem niemand
    pushCost: 2              # Gesetz fordern oder verhindern: 2 Gefallen …
    pushStep: 25             # … für 25 Punkte Druck (−100 bis +100)
    waterCost: 3             # verwässern: 3 Gefallen …
    waterStep: 0.2           # … für 20 % weniger Wirkung
    maxWater: 0.6            # höchstens 60 % weniger Wirkung
    decay: 0.1               # Druck und Verwässerung verlieren je Runde 10 %
    maxShift: 0.3            # voller Druck ändert die Chance eines Gesetzes um höchstens 30 Punkte (Andockpunkt 4.3)
    bribe: { cost: 10000, favors: 4, heat: 10, heatDecay: 0.05 }  # Umschlag: Geld gegen Gefallen, macht Hitze (verblasst je Runde um 5 %; zählt × investigation.lobbyHeatFactor bei Delaney)
    donation: { min: 10000, perFavor: 10000, winMultiplier: 2 }  # Wahlkampfspende: gewinnt die Partei, 2 Gefallen je 10.000 $
    drunkChance: 0.2         # Trinker: Runde ohne Gefallen
    politicsChapter: 2       # 0.4.20+17 Provinzpolitik: ab Kapitel 2 Gesetze fordern/bremsen und spenden (Lobbyist, Umschlag, Verwässern erst mit Hallstead)
    ownFavors: 1             # 0.4.20+17: Jacobs eigene Kontakte bringen je Runde 1 Gefallen × Gewicht
    weight: { fullAt: 1200000, min: 0.1 }   # 0.4.20+17: Gewicht von Jacobs Wort = Imperiumswert ÷ 1,2 Mio. $ (mind. 0,1, höchstens 1) – wirkt auf Druck, Abstimmung und eigene Gefallen
    genieSpread: 0.5         # Genie: Gefallen ±50 % je nach Laune
    candidates:
      pryce:  { competence: 4, hireCost: 15000, salary: 6000, trait: gewissenhaft }
      lowell: { competence: 3, hireCost: 8000,  salary: 4000, trait: genie }
      tibbs:  { competence: 2, hireCost: 2000,  salary: 2000, trait: trinker }
# Weltmodell (4.1, GDD §7.1): neun Weltgrößen, je Runde (Quartal) fortgeschrieben
# in src/sim/world.ts. Indizes: Nachfrage, Förderkapazität und Weltpreis starten
# bei 1; Kreditklima, Stimmung, Außenspannung, Technik und Nationalismus laufen
# von 0 bis 100. Drei Rückkopplungen: (1) Preis → Neubohrungen → Angebot → Preis
# (dämpft, aber verzögert), (2) Boom → Kredit → Spekulation → Crash (schaukelt
# sich auf), (3) Knappheit → Außenspannung → Aufrüstung → Nachfrage → Knappheit
# (schaukelt sich auf, bis Krieg). Zielwerte (GDD §15) einer Welt ohne Spieler je
# Kampagne (73 Jahre): 2–4 Kreditkrisen, 1–3 Ölschwemmen, 0–2 Kriege.
# Alle Werte PLATZHALTER; Verläufe prüft `npm run welt` (docs/weltmodell.md).
worldModel:
  start:                     # jede Kampagne würfelt ihre eigene Ausgangslage
    tech: { min: 6, max: 10 }
    credit: { min: 32, max: 62 }     # breit: Welten starten in verschiedenen Phasen des Kreditzyklus
    mood: { min: 48, max: 60 }
    tension: { min: 10, max: 28 }
    nationalism: { min: 8, max: 20 }
    handel: { min: 0.30, max: 0.42 }     # Anteile der Parteien vor dem Normieren: meist führt die Handelspartei,
    volksbund: { min: 0.24, max: 0.38 }  # in etwa jeder vierten Welt eine andere
    provinz: { min: 0.22, max: 0.36 }
  supply:                    # Schleife 1: Angebot & Lager
    elasticity: 1.4          # ε: Nachfrage/Förderung hoch ε → Preis
    stockNorm: 0.25          # normales Lager in Quartalsbedarf
    stockMax: 1.0            # mehr passt in keinen Tank – der Rest läuft aus
    stockWeight: 0.35        # wie stark volle Tanks den Preis drücken
    utilBase: 0.85           # Auslastung der Quellen bei normaler Knappheit (Weltpreis = Trendpreis)
    utilSlope: 0.4           # Knappheit über/unter 1 → mehr/weniger gefördert (drosseln)
    utilMin: 0.6
    depletion: 0.02          # so viel Kapazität versiegt je Runde
    investSlope: 0.04        # Neubohrungen je Punkt Knappheit über 1 (Anteil der Kapazität), dazu Ersatz und Wachstum
    investMax: 0.07
    delay: 6                 # Runden, bis eine Neubohrung fördert (Verzögerung der Schleife 1)
    creditInvest: 0.6        # Kreditklima 100 → 60 % mehr Neubohrungen, 0 → 60 % weniger
    findChance: 0.007        # Riesenfund je Runde → Ölschwemme
    findSize: { min: 0.12, max: 0.22 }   # so viel Kapazität kommt auf einen Schlag dazu
  demand:
    growth: 0.012            # Wachstum je Runde ohne Sättigung (Industrie, später Autos)
    cap: 9                   # Sättigung des Nachfrage-Index
    techBoost: 0.6           # Technik 100 → Wachstum × 1,6
    crashDrop: 0.08          # im Crash fehlt so viel Nachfrage
    warBoost: 0.12           # im Krieg kommt so viel dazu
    armsDemand: 0.06         # Aufrüstung: Außenspannung 100 → so viel mehr Nachfrage
  price:
    min: 0.35                # Weltpreis-Index höchstens auf ein gutes Drittel …
    max: 2.8                 # … und höchstens auf knapp das Dreifache
    techCost: 0.25           # Technik senkt den Trendpreis: +100 Punkte → −25 %
    trendMin: 0.5            # tiefer sinkt der Trendpreis nie
  tech:
    rate: 0.017              # logistisches Wachstum je Runde (Forschung aller Firmen)
  credit:                    # Schleife 2: Kreditklima
    boom: 4                  # Punkte je Runde bei doppelter Knappheit (Weltpreis = 2 × Trendpreis; Boom macht Banken mutig)
    speculation: 0.09        # über 50 schaukelt es sich auf: + speculation × (Klima − 50)
    revert: 0.05             # Rückkehr zur Mitte
    noise: 3.5
    handel: 0.3              # Regierung Handelspartei lockert je Runde
    volksbund: -0.4          # Regierung Volksbund: Bankaufsicht
    provinz: 0
    crashFrom: 68            # ab hier kann es kippen
    crashChance: 0.04        # Chance je Runde an der Schwelle …
    crashSlope: 0.5          # … plus so viel bei Klima 100
    priceTrigger: 0.2        # Preissturz ab 20 % in einer Runde kippt ein Klima …
    priceTriggerFrom: 60     # … über diesem Wert
    after: 0.35              # Klima nach dem Crash = Klima × after
    pipelineCut: 0.5         # im Crash wird so viel der Bohrungen im Bau weitergebaut (Rest gestoppt)
    investCut: 0.5           # solange der Crash nachwirkt, wird nur so viel neu gebohrt
    rounds: { min: 4, max: 8 }   # so lange wirkt ein Crash nach
    # 4.4 Kreditzyklus (GDD §7.2): Boom → Überhitzung → Auslöser → Bankpanik oder Crash.
    boomFrom: 60             # ab hier „Boom“: die Banken leihen großzügiger
    tightFrom: 30            # bis hier „knapp“: die Banken leihen weniger
    panicAfter: 0.5          # Bankpanik (Auslöser ohne große Verschuldung): Klima × panicAfter …
    panicRounds: { min: 3, max: 5 }   # … so lange wirkt sie nach
    panicPipelineCut: 0.5    # so viel der Bohrungen im Bau wird in der Panik weitergebaut (die Banken drehen den Hahn zu wie im Crash)
    panicInvestCut: 0.5      # solange die Panik nachwirkt, wird nur so viel neu gebohrt
    leverage:                # Verschuldung der Firmen und Spekulation auf Kredit (0–100): wächst in langen Booms
      base: 25               # dahin baut sie sich ab
      build: 5               # je Runde × (Klima − 50) ÷ 50, nur über 50
      decay: 0.04            # Abbau je Runde: decay × (Verschuldung − base); Gleichgewicht = base + build ÷ decay × (Klima − 50) ÷ 50
      start: 0.5             # neue Welt: so viel des Gleichgewichts zum Start-Kreditklima – passend zur Phase, aber noch ohne Blase
      bubbleFrom: 45         # ab hier überhitzt: Banken heben die Zinsen, die Zeitung warnt vor der Blase
      crashFrom: 56          # ab hier wird ein Auslöser zum Crash, darunter nur zur Bankpanik (Crash in ~15 % der 20-Jahres-Welten)
      crashAfter: 0.4        # Verschuldung nach dem Crash = × crashAfter (Pleiten, Kredite gekündigt)
      panicAfter: 0.8        # … nach einer Bankpanik
  mood:
    speed: 0.2               # wie schnell die Stimmung ihrem Ziel folgt
    price: 25                # doppelte Knappheit → −25 Punkte (teures Benzin, teures Heizöl)
    crash: 18                # Arbeitslosigkeit im Crash
    panic: 6                 # 4.4: Bankpanik – Schlangen vor den Schaltern, aber kaum Entlassungen
    war: 6
    boom: 8                  # Kreditklima 100 → +8 (Wohlstand)
    noise: 3
  politics:
    drift: 0.012             # Anteilsverschiebung je Runde und Stimmungsabstand (in 50 Punkten)
    noise: 0.012
    minShare: 0.1
    fatigue: 0.002           # Regierungsmüdigkeit: die regierende Partei verliert je Runde so viel
    revert: 0.01             # Anteile kehren langsam zur Mitte zurück (keine Partei verschwindet für immer)
    electionEvery: 16        # GDD §7.1: Wahlen alle 4 Jahre
  acts:                      # 4.2: Jacobs öffentliches Handeln, wirkt am Rundenende auf Stimmung (Punkte) und Parteianteile
    maxMood: 6               # je Runde höchstens ± so viele Stimmungspunkte aus Jacobs Handeln
    maxParty: 0.015          # … und höchstens so viel Anteil je Partei
    price_war:         { mood: 1,    handel: -0.002, volksbund: 0,     provinz: 0.006 }  # echter Preiskampf (ab Kapitel 2): billiges Öl freut die Leute, ruinierte kleine Förderer rufen nach der Provinzliga
    independents_stand: { mood: 1,   handel: -0.004, volksbund: 0.003, provinz: 0.006 }  # Unabhängige gemeinsam gegen den Trust (Delgados Verband): Farmer und Arbeiter mögen das
    field_fire:        { mood: -3,   handel: -0.003, volksbund: 0.006, provinz: 0 }      # Feldbrand: Rauch bis Port Ellis, Ruf nach Aufsicht
    strike:            { mood: -1.5, handel: -0.002, volksbund: 0.004, provinz: 0 }
    strike_break:      { mood: -3,   handel: 0,      volksbund: 0.008, provinz: 0 }      # Streikbrecher
    charity:           { mood: 1,    handel: 0,      volksbund: 0,     provinz: 0 }      # Spende für Kirche, Schule, Witwen
    support_handel:    { mood: 0,    handel: 0.006,  volksbund: 0,     provinz: 0 }      # Spende/Stimmen für eine Partei
    support_volksbund: { mood: 0,    handel: 0,      volksbund: 0.006, provinz: 0 }
    support_provinz:   { mood: 0,    handel: 0,      volksbund: 0,     provinz: 0.006 }
    press_praise:      { mood: 1,    handel: 0.002,  volksbund: 0,     provinz: 0 }      # freundliche Presse
    press_scandal:     { mood: -2,   handel: -0.003, volksbund: 0.003, provinz: 0 }      # Skandal in der Zeitung
  programs:                  # 4.2: wie streng die Regierung auf Verfehlungen schaut (Faktor auf Stimmung nach unten)
    handel: { scrutiny: 0.75 }    # niedrige Steuern, wenig Regulierung – man drückt ein Auge zu
    volksbund: { scrutiny: 1.5 }  # gegen Trusts, für Aufsicht – jeder Brand wird zum Thema
    provinz: { scrutiny: 1 }
  laws:                      # 4.3 Gesetzeskatalog (GDD §10): Ablauf im Parlament; die Gesetze selbst stehen in content/laws/
    decay: 0.92              # Druck je Runde: alter Druck × decay + Druckpunkte der erfüllten Gründe (Gleichgewicht = Punkte ÷ 0,08; 0.4.20+19: 0,85 → 0,92)
    openingRound: 41         # 0.4.20+24: bis hierhin ruht das Parlament; in Runde 41 (Beginn Kapitel 2) wird das Eröffnungsgesetz fest beschlossen
    opening: income_tax      # … die Einkommensteuer (7 %) – sie führt das Politiksystem ein
    openingVote: 0.58        # … mit dieser Zustimmung (die Zeitung druckt sie)
    thresholdScale: 0.6      # 0.4.20+19: Faktor auf die Schwelle jedes Gesetzes (content/laws/) – Philipp: in jeder Welt sollen bis Kapitel 3 mehrere Gesetze durchkommen
    proposeChance: 0.5       # Chance je Runde, dass ein Gesetz über seiner Schwelle als Antrag ins Parlament kommt (0.4.20+19: 0,2 → 0,5)
    maxOpen: 3               # so viele Anträge gleichzeitig im Parlament (0.4.20+19: 1 → 3; die Zeitung bringt je Runde eine Gesetzesmeldung)
    debateRounds: { min: 2, max: 3 }   # Antrag → Debatte → Abstimmung nach so vielen Runden
    voteNoise: 0.04          # Zufall bei der Abstimmung: ± so viel Zustimmung (Abweichler, Kranke, Absprachen)
    closeVote: 0.05          # Debatte: liegt die erwartete Zustimmung näher als so viel an 50 %, meldet die Zeitung „knapp“
    cooldown: 6              # nach einer Niederlage so viele Runden kein neuer Antrag für dasselbe Gesetz (0.4.20+19: 12 → 6)
    failPressure: 0.3        # … und der Druck fällt auf diesen Anteil
    trust:                   # Marktanteil des größten Konzerns im Land (Crane Trust) – Hilfsgröße für das Kartellgesetz
      start: { min: 0.30, max: 0.46 }
      base: 0.38             # dahin kehrt der Anteil langsam zurück (Neue drängen nach, Alte versiegen)
      revert: 0.02
      government: { handel: 0.0025, volksbund: -0.002, provinz: 0 }   # je Runde: unter der Handelspartei wachsen Trusts ungestört, unter dem Volksbund schrumpfen sie (Aufsicht)
      credit: 0.001          # je Runde × (Kreditklima − 50) ÷ 50: billiges Geld → Übernahmen, knappes Geld → der Trust hält sich zurück
      crash: 0.006           # je Crash-Runde dazu: Pleitefirmen werden billig aufgekauft
      glut: 0.03             # Riesenfund → Ölschwemme → kleine Förderer gehen ein, der Trust kauft
      noise: 0.01
      min: 0.1
      max: 0.85
    lobby:                   # was Jacobs Gefallen im Parlament bewirken (Züge: WorldInput.lobby; Druck aus Hallstead/Provinz: lawInfluence)
      demand: 3              # fordern: so viele Druckpunkte auf einmal
      block: 0.06            # verhindern: so viel weniger Zustimmung bei der Abstimmung
      delay: 2               # verzögern: so viele Runden mehr Debatte
      influencePressure: 3   # 0.4.20+17: Jacobs Einfluss (−1 … +1, nach Firmengröße gewichtet) × 3 Druckpunkte je Runde
      influenceVote: 0.2     # … und × 0,2 Zustimmung bei der Abstimmung (voller Einfluss: ±20 Punkte)
      weakenFrom: 0.2        # verwässert ab 20 %: beim Beschluss gelten die aufgeweichten Regeln (lobby.weaken.rules)
  tension:                   # Schleife 3: Außenspannung
    base: 18                 # Ruhe-Niveau der Diplomatie
    revert: 0.04
    scarcity: 35             # Knappheit (Weltpreis ÷ Trendpreis) über scarcityFrom → Spannung steigt
    scarcityFrom: 1.1
    arms: 0.08               # Aufrüstung: + arms × (Spannung − armsFrom); ab gut 60 stärker als die Diplomatie
    armsFrom: 40
    nationalism: 0.02        # Nationalismus über nationalismFrom heizt die Lage an
    nationalismFrom: 50
    noise: 2.5
    warFrom: 70
    warChance: 0.03
    warSlope: 0.3
    warRounds: { min: 8, max: 16 }
    afterWar: 22
  nationalism:
    base: 15
    revert: 0.02
    drift: 0.12              # je Runde × Nachfrage-Index: je mehr Öl die Welt braucht, desto mehr Einmischung
    tension: 0.015           # × Außenspannung
    noise: 2
    nationalizeFrom: 80
    nationalizeChance: 0.06
    nationalizeLoss: 0.06    # so viel Förderkapazität geht bei einer Verstaatlichung verloren
    after: 40
  foreign:                   # 4.4 Außenspannung jenseits von Aldmark–Varenhold (das ist tension oben): Förderländer im Süden und in der Ferne
    costaNegra:              # instabile Republik im Süden: Unruhe 0–100 → Aufstand → Förderausfall
      start: { min: 15, max: 40 }
      base: 25
      revert: 0.06
      poverty: 25            # billiges Öl macht arm: × (povertyFrom − Knappheit)
      povertyFrom: 0.95
      nationalism: 0.04      # × (Nationalismus − nationalismFrom)
      nationalismFrom: 40
      meddling: 0.05         # Großmächte mischen sich ein: × (Spannung − meddlingFrom)
      meddlingFrom: 40
      noise: 4
      uprisingFrom: 65
      uprisingChance: 0.08
      uprisingSlope: 0.4
      rounds: { min: 2, max: 6 }
      after: 35
      share: 0.06            # Anteil Costa Negras an der Weltförderung
      loss: 0.7              # so viel davon fällt im Aufstand aus
    qasir:                   # Wüstenkönigreich in der Ferne: Unmut 0–100 → Ölembargo; sein Anteil wächst mit dem Ölhunger der Welt
      start: { min: 5, max: 20 }
      base: 15
      revert: 0.04
      courting: 0.04         # die Großmächte werben um Qasir: × (Spannung − courtingFrom)
      courtingFrom: 40
      war: 1.5               # je Kriegsrunde in Übersee
      nationalism: 0.05      # × (Nationalismus − nationalismFrom)
      nationalismFrom: 50
      noise: 3
      embargoFrom: 70
      embargoChance: 0.06
      embargoSlope: 0.3
      rounds: { min: 3, max: 6 }
      after: 40
      shareBase: 0.02        # Anteil Qasirs an der Weltförderung zu Beginn …
      shareGrowth: 0.03      # … plus so viel je Punkt Nachfrage über 1 …
      shareMax: 0.25         # … höchstens so viel
  chapter1:                  # wie sanft Kapitel 1 die Welt spürt
    priceWeight: 0.5         # Posted Price-Trend: 1 + 0,5 × (Weltpreis − 1) …
    priceMaxDev: 0.15        # … höchstens ±15 %
    rateWeight: 0.01         # Kreditklima 0/100 → Zins +1/−1 Punkt
    crashRate: 0.02          # im Crash zwei Punkte mehr
    panicRate: 0.01          # 4.4: in der Bankpanik einen Punkt mehr
    bubbleRate: 0.005        # 4.4: überhitzt – die Banken heben die Zinsen schon vorher (Frühwarnzeichen)
    rateMaxAdd: 0.03
    limit:                   # 4.4: Faktor auf den Bankrahmen je Phase des Kreditzyklus (auf 100 $ gerundet)
      crash: 0.5             # Banken kürzen die Rahmen
      panic: 0.7
      tight: 0.85
      normal: 1
      boom: 1.15
      overheated: 1.25       # in der Blase leihen die Banken am freigiebigsten – genau dann ist es am gefährlichsten
    nationalBarrels: 5000000 # Barrel je Runde, die der Weltindex 1 bedeutet (Salt Hill ist ein Bruchteil)
  news:                      # wann die Zeitung Zustände andeutet (keine Zahlen)
    creditEasy: 70
    creditTight: 30
    moodAngry: 32
    tensionHigh: 60
    unrestHigh: 62           # 4.4: Costa Negra so unruhig → Meldung „Unruhen in Costa Negra“ (knapp unter foreign.costaNegra.uprisingFrom: ein Zeichen, keine Dauerkulisse)
    qasirHigh: 62            # 4.4: Qasir so verstimmt → Meldung „Verstimmung in Qasir“ (knapp unter foreign.qasir.embargoFrom)
    pollFrom: 2              # 4.2: so viele Runden vor der Wahl druckt die Zeitung eine Umfrage
    pollClose: 0.015         # liegen die beiden Ersten näher als 1,5 Prozentpunkte: „Kopf an Kopf“ (gut jede vierte Umfrage; dann kippt eine einzelne Tat die Wahl am ehesten)

# Raffinerie und Produktmix (4.6, GDD §6) – ab Kapitel 2, in Kapitel 1 unsichtbar.
# Leistung = Kapazität × Technikstufe × Produktmix. Rohöl, das am Rundenende noch im
# Tank steht, geht bis zur eingestellten Menge in die Raffinerie; die Produkte gehen
# an den Großhandel. Logik: src/sim/refinery.ts, Texte: content/refinery.yaml.
# Alle Werte PLATZHALTER bis zu den Bot-Läufen für Kapitel 2.
refinery:
  unlockChapter: 2         # GDD §13: Raffinerie und Produktmix sind neue Mechanik in Kapitel 2
  # 0.4.20+18: kleinere Anlage, die mit der Firma wächst (vorher 25.000 bbl je Stufe – der Großhandel war schon bei
  # ~10–12.000 bbl satt, Ausbau lohnte nie). Messung: npx tsx tools/raffinerieLaeufe.ts (Tabelle in docs/phase4/4.6.md).
  buildCost: 80000         # $ für die erste Destillationsanlage (gut eingestellt in ~12 Runden bezahlt, mit Startmix nie)
  buildRounds: 3           # Bauzeit in Runden
  unitCapacity: 10000      # bbl Rohöl je Runde und Ausbaustufe
  maxLevel: 4              # höchstens so viele Ausbaustufen (Stufe 4 lohnt nur mit vielen Tankstellen und großem Markt)
  expandCost: 40000        # $ je weitere Ausbaustufe (0.4.20+21: 50.000 → 40.000 – Bots bauten kaum aus, Amortisation in K2 22–32 Runden; Stufe 3 lohnt erst mit Tankstellen)
  expandRounds: 2          # Bauzeit je Ausbau (die alte Anlage läuft weiter)
  upkeepPerLevel: 800      # Fixkosten je fertiger Ausbaustufe und Runde (Löhne, Kessel, Wache)
  operatingCost: 0.50      # $ je verarbeitetem Barrel Rohöl (Kohle, Chemikalien, Fässer)
  assetShare: 0.6          # Buchwert der Anlage im Imperiumswert (Anteil der Baukosten)
  fire:                    # GDD §6: Raffinerien brennen
    chance: 0.03           # je Runde, in der die Anlage läuft
    repairCost: 15000      # $
    repairRounds: 2        # so lange steht sie still
  sour:                    # GDD §6: saures Rohöl braucht mehr Verarbeitung und bringt weniger
    yieldLoss: 0.05        # zusätzlicher Verlust bei 100 % saurem Öl
    costAdd: 0.15          # $ je Barrel mehr bei 100 % saurem Öl
  crudeRef: 1.00           # Bezugs-Rohölpreis: Produktpreise hängen zu crudeLink am Posted Price
  worldDefaults:           # Bezugswelt: typische Welt zu Beginn von Kapitel 2 (Median aus 300 Welten nach 40 Runden,
                           # npm run welt); gilt auch, solange es kein Weltmodell gibt. Skalen wie state.worldModel (4.1).
    tech: 15               # Technikstand 0–100 (Kampagnenstart 6–10, nach 40 Runden ~12–17)
    tension: 20            # Außenspannung 0–100
    demand: 1.55           # Nachfrage-Index der Welt (effectiveDemand; Start 1, nach 40 Runden ~1,55)
  techs:                   # GDD §6: Technikstufen; Kapitel 2 kennt nur Stufe I
    - stage: 1
      label: Destillation
      loss: 0.05           # Verlust beim Destillieren (Gas, Rückstand)
      mix:                 # Spielraum je Produkt als Anteil der Ausbeute; Benzin ist Nebenprodukt (ca. 20 %)
        kerosene: { min: 0.15, max: 0.60 }   # Cracken (Forschung) senkt den Kerosin-Mindestanteil um so viel, wie es Benzin dazugibt
        lubricant: { min: 0.05, max: 0.15 }
        fuelOil: { min: 0.10, max: 0.55 }
        gasoline: { min: 0.15, max: 0.20 }
  startMix: { kerosene: 0.55, lubricant: 0.10, fuelOil: 0.15, gasoline: 0.20 }
  # Je Produkt: Grundpreis in $ je Barrel, Nachfrage des Großhandels in bbl je Runde (in der Bezugswelt),
  # Preiselastizität, Rohöl im Produkt (crudeLink), Grenzen der Raffineriespanne.
  # 0.4.20+25 (Philipp: raffiniertes Öl ist nie billiger als Rohöl, und die Produkte folgen dem Rohölpreis):
  #   Preis = crudeLink × Posted Price + Spanne × (Nachfrage/Angebot)^Elastizität, Spanne = basePrice − crudeLink × crudeRef,
  #   der Faktor begrenzt auf floor..ceiling. Ein überschwemmter Markt kostet Spanne, nie den Wert des Rohöls.
  #   Startmix bei voller Menge ~+0,30 $/bbl über dem Rohölverkauf, gut eingestellt ~+0,75 $/bbl.
  # 0.4.20+18: Die Märkte sind verschieden groß und verschieden viel wert. Kerosin bringt gut, aber der Markt ist
  # klein und schrumpft; Heizöl ist der große Markt; Schmieröl ist klein und teuer. Elastizität 2: Wer einen Markt
  # überschwemmt, verliert dort Spanne. Der Startmix (55 % Kerosin) liegt bewusst daneben.
  # Wachstum: Das allgemeine Wachstum trägt der Nachfrage-Index der Welt (trend.demand =
  # Exponent auf Welt-Nachfrage / worldDefaults.demand). perYear ist nur die Verschiebung
  # des Produkts gegenüber dieser allgemeinen Ölnachfrage (Kerosin verliert Anteile,
  # Benzin gewinnt); tech und tension wirken je 50 bzw. 100 Punkte über der Bezugswelt.
  # Benzin für die eigenen Tankstellen (Kapitel 3) geht nicht an den Großhandel (planRun, stationOfftake).
  products:
    kerosene:              # dominiert zu Beginn, verliert mit der Elektrifizierung Anteile
      basePrice: 1.80
      demand: 3000
      elasticity: 2.0
      crudeLink: 1.0
      floor: 0.3
      ceiling: 1.2
      trend: { refYear: 98, perYear: -0.02, tech: -0.15, tension: 0, war: 0, demand: 1, min: 0.2 }
    lubricant:             # Maschinen und Eisenbahn: kleine Menge, guter Preis, schnell gesättigt
      basePrice: 3.30
      demand: 1300
      elasticity: 2.0
      crudeLink: 1.0
      floor: 0.5
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.0, tech: 0.10, tension: 0, war: 0.1, demand: 1, min: 0.2 }
    fuelOil:               # Marine, Eisenbahn, Industrie
      basePrice: 1.90
      demand: 6500
      elasticity: 2.0
      crudeLink: 1.0
      floor: 0.5
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.0, tech: 0.05, tension: 0.8, war: 0.6, demand: 1, min: 0.2 }
    gasoline:              # Nebenprodukt; gewinnt mit der Automobilisierung Anteile
      basePrice: 2.30      # 0.4.20+25: 2,00 → 2,30 – sonst trägt Benzin für die Tankstellen den Ausbau auf Stufe 3 nicht mehr
      demand: 2200
      elasticity: 2.0
      crudeLink: 1.0
      floor: 0.5
      ceiling: 1.2
      trend: { refYear: 98, perYear: 0.08, tech: 0.30, tension: 0, war: 0.3, demand: 1, min: 0.2 }

# 4.7 Fernleitungen (GDD §6, Kapitel 2): große Pipelines vom Feld zum Hafen oder Bahnhof.
# Route planen (gerade Trasse über die Karte) → vermessen → Wegerechte je Ranch verhandeln
# (Briefe der Landbesitzer, Querköpfe, Stadtrat, Thornes Bahnkreuzung) → Bau über 1–4 Runden.
# Eine fertige Leitung zum Hafen umgeht Thornes Bahn: Ihr Öl fließt über den Weg „Pipeline“
# (transport.pipeline.costPerBarrel), Thorne senkt den Tarif (Druck) – und schickt Saboteure.
# Eine Leitung zum Bahnhof ist billiger und ruhiger, bringt das Öl aber nur auf Thornes Gleise:
# Sie erhöht die Kapazität des Wegs „Bahn“, jedes Barrel zahlt weiter Thornes Bahntarif. Code: src/sim/bigPipeline.ts. Alle Zahlen PLATZHALTER bis zur Balance von Kapitel 2.
bigPipelines:
  fromChapter: 2            # in Kapitel 1 unsichtbar
  destinations:             # Landmarken aus content/map.yaml
    - { id: hafen, bypassesRail: true }              # Hafen Port Ellis: an Thornes Bahn vorbei – Weg „Pipeline“
    - { id: bahnhof_portellis, bypassesRail: false } # Bahnhof Port Ellis: Öl bleibt auf Thornes Gleisen – Weg „Bahn“ zu seinem Tarif
  surveyPerUnit: 60         # Vermessung je Karteneinheit Trasse
  costPerUnit: 3000         # Bau je Karteneinheit (Salt Hill → Hafen ≈ 17 Einheiten ≈ 51.000 $)
  unitsPerRound: 5          # Baufortschritt je Runde …
  minRounds: 1              # … aber immer 1–4 Runden (GDD §6)
  maxRounds: 4
  capacity: 120000          # bbl je Runde und fertiger Fernleitung (Hafen: Weg „Pipeline“, Bahnhof: Weg „Bahn“)
  upkeepPerUnit: 40         # Streckenwärter je Einheit und Runde
  maxProjects: 3
  smallUpgradeCost: 8000    # Anschluss an die kleine Pipeline aus Kapitel 1: ihre Strecke wird aufgeweitet (Wegerechte hat Jacob schon)
  rights:
    pricePerArea: 400       # fairer Preis eines Wegerechts je Einheit² Ranchfläche …
    minPrice: 500           # … mindestens so viel
    acceptBase: 0.55        # Grundchance, dass ein faires Angebot angenommen wird
    offerFactor: { low: 0.7, fair: 1.0, generous: 1.6 }
    offerBonus: { low: -0.25, fair: 0, generous: 0.25 }
    landowner: { neutral: 0, gierig: -0.10, verschuldet: 0.15, misstrauisch: -0.15, fromm: -0.05 }
    moodWeight: 0.005       # je Punkt öffentlicher Stimmung über/unter 50 (Weltmodell 4.1)
    reputationBonus: 0.10   # Jacob gilt als anständiger Verhandler (Ereignis „Querkopf“)
    thorneMeddling: 0.10    # Thorne hetzt die Landbesitzer gegen eine Leitung zum Hafen auf
    holdoutAfter: 2         # nach so vielen Absagen (oder einer Absage auf ein großzügiges Angebot) stellt er sich quer
    holdoutDemand: 3        # der Querkopf verlangt das Dreifache
    detourLength: 2         # Umweg um eine Ranch: so viele Einheiten mehr Trasse
    townPrice: 3000         # Stadtrat Port Ellis: Durchleitung durch die Stadt
    townAccept: 0.6
    railDemand: 25000       # Thornes Preis für die Kreuzung seiner Gleise
    courtCost: 3000         # Klage auf Kreuzungsrecht beim Bezirksrichter …
    courtRounds: 2          # … dauert so lange …
    courtChance: 0.5        # … und geht so oft gut aus (+ politischer Einfluss / 200)
    expropriateInfluence: 60 # Enteignung nur mit politischem Einfluss ab 60 (GDD §6, §10)
    influencePerFavor: 5    # 0.4.20+9: Einfluss = Hallstead-Gefallen × 5 (höchstens 100; 12 Gefallen → 60)
    expropriateShare: 0.5   # Entschädigung: halber fairer Preis
  sabotage:
    building: 0.06          # Chance je Runde im Bau …
    ready: 0.08             # … und im Betrieb …
    perUnit: 0.003          # … plus so viel je Einheit Trasse
    thorneFactor: 1.5       # Leitung zum Hafen: Thorne schickt Leute
    thorneFeudFactor: 1.5   # … noch mehr, wenn Jacob seinen Unterhändler hinausgeworfen hat
    truceFactor: 0.5        # Waffenstillstand mit Thorne
    rivalFactor: 1.5        # Fehde mit Bullard
    revengeFactor: 1.5      # nach Einschüchterung der Landbesitzer
    guardsPerUnit: 15       # Wachleute je Einheit und Runde …
    guardsFactor: 0.3       # … senken die Chance auf 30 %
    repairShare: 0.04       # Reparatur: Anteil der Baukosten
    repairRounds: 1         # so lange steht sie still (im Bau: eine Runde Verzug)
    maxChance: 0.6
  thorne:
    cut: 0.04               # Tarifsenkung je Runde bei vollem Druck ($ je Barrel): vom Starttarif 0,25 $ fünf Runden bis zum Boden
    minTariff: 0.08         # eigener Boden in Kapitel 2 (tiefer als transport.thorne.minTariff aus Kapitel 1)
    fullPressureCapacity: 60000 # ab so viel fertiger Kapazität zum Hafen ist der Druck voll
  carrier:                  # Transportpflicht-Gesetz (4.3): fremdes Öl gegen Gebühr
    fee: 0.05
    volume: 20000
  assetShare: 0.5           # Fernleitungen zählen mit diesem Anteil ihrer Baukosten zum Imperiumswert

# 4.8 Aktien, Aufsichtsrat, Anleihen (GDD §8) – ab Kapitel 2, in Kapitel 1 unsichtbar.
# Regeln: src/sim/stocks.ts, Zahlen lesen: src/sim/stocksBalance.ts, Namen und Texte: content/stocks.yaml.
# Der Börsengang selbst fällt am Ende von Kapitel 1 (chapter.ipo). Alle Werte PLATZHALTER bis zu den Bot-Läufen von Kapitel 2.
stocks:
  fromChapter: 2             # ab diesem Kapitel gibt es Aktienbuch und Anleihen
  totalShares: 1000          # Aktien beim Börsengang (Jacob behält 1 − verkaufter Anteil)
  # Kurs = Imperiumswert / Aktien × Stimmung. Die Stimmung (1 = fair) folgt Gewinn, Dividende,
  # Kreditklima (4.1: credit 0–100, 50 = normal) und öffentlicher Stimmung (mood) und zieht zurück zur 1.
  price:
    min: 1                   # tiefer fällt eine Aktie nie (in $)
    sentimentMin: 0.4
    sentimentMax: 1.8
    profitWeight: 0.5        # Wertzuwachs der Runde (Anteil, höchstens ±0,2) × dieses Gewicht
    creditWeight: 0.06       # Boom an der Börse hebt, Kreditklemme drückt (je voller Ausschlag)
    moodWeight: 0.04         # schlechte Stimmung im Land drückt
    crashWeight: 0.06        # 0.4.20+9: je Runde, solange ein Crash nachwirkt (Börse oder Kreditcrash der Welt)
    noise: 0.04              # Gerüchte: zufälliger Ausschlag je Runde (±)
    reversion: 0.15          # so viel des Abstands zur 1 holt die Stimmung je Runde auf
  dividend:
    rates: [0.01, 0.03]      # wählbare Dividende: Anteil am Börsenwert (klein, groß)
    graceRounds: 4           # so lange ohne Dividende bleibt der Kurs ruhig (ein Jahr)
    missPenalty: 0.04        # danach je Runde ohne Dividende: Stimmung −0,04
    bonus: 0.03              # Runde mit Dividende: Stimmung +0,03
  issue:
    maxShare: 0.2            # höchstens so viele neue Aktien je Ausgabe (Anteil an allen Aktien)
    discount: 0.1            # neue Aktien gehen mit 10 % Abschlag auf den Kurs weg (Bankprovision)
    dilutionPenalty: 0.5     # Stimmung − Anteil neuer Aktien × 0,5
  buyback:
    premium: 0.1             # Rückkauf kostet Kurs + 10 %
    bonus: 0.2               # Stimmung + Anteil zurückgekaufter Aktien × 0,2
  # Aufsichtsrat: 5–9 Sitze (GDD §8). Sitze = seatsBase + verkaufter Anteil × seatsPerShare.
  board:
    seatsMin: 5
    seatsMax: 9
    seatsBase: 4
    seatsPerShare: 6         # 20 % → 5 Sitze, 49 % → 7 Sitze
    loyalFrom: 50            # ab dieser Treue (0–100) stimmt ein Rat mit Jacob
    weight: 0.6              # loyale Räte bringen diesen Anteil der Stimmen der freien Aktionäre mit
    gain: 3                  # Treue je Runde, in der die Agenda erfüllt ist …
    loss: 4                  # … und je Runde, in der sie verletzt ist
    maxDebtRatio: 0.3        # Agenda Sicherheit: Schulden höchstens 30 % des Imperiumswerts
    courtCost: 2000          # „Rat umstimmen“: Essen, Gefälligkeiten
    courtGain: 12            # … bringt so viel Treue (höchstens einmal je Runde)
    bigDecision: 0.25        # Anleihen über 25 % des Firmenwerts brauchen die Mehrheit (neue Aktien immer)
  # Forderungen des Aufsichtsrats: der unzufriedenste Rat verlangt etwas mit Frist.
  demands:
    chance: 0.35             # Chance je Runde ohne offene Forderung
    dueRounds: 3             # Frist in Runden
    dividendShare: 0.02      # Forderung Dividende: so viel vom Börsenwert
    debtCut: 0.25            # Forderung Schulden: um ein Viertel senken
    buybackShare: 0.03       # Forderung Rückkauf: so viele Aktien
    issueShare: 0.1          # Thornes Mann fordert so viele neue Aktien
    fulfillGain: 15          # zugesagt und erfüllt: Treue +15
    quietGain: 5             # erfüllt, ohne vorher zuzusagen: nur +5 (die Zusage zählt)
    failLoss: 20             # zugesagt, aber nicht erfüllt – oder die Zusage zurückgezogen: −20
    rejectLoss: 10           # abgelehnt oder ignoriert: −10
    # Thornes Mann fordert eigens (nicht als „unzufriedenster Rat“, seine Treue ist immer 0):
    spyChance: 0.15          # Chance je Runde ohne offene Forderung, solange Thorne im Rat sitzt
    spyPenalty: 0.08         # abgelehnt oder ignoriert: Thornes Zeitungen streuen Gerüchte, Stimmung der Börse −0,08
  # Thorne und die Strohmänner (GDD §8, §13: „zu viele Aktien verkauft – Thorne kauft sich über Strohmänner ein“).
  thorne:
    minOutside: 0.4          # erst wenn mindestens 40 % der Aktien nicht bei Jacob liegen, kann Thorne unbemerkt kaufen
    buyChance: 0.5           # Chance je Runde, dass er zukauft
    buyShare: 0.03           # so viele Aktien (Anteil an allen) je Kauf
    hostileFactor: 1.5       # hat Jacob ihn in Kapitel 1 abgewiesen (hostileMarks), kauft er so viel mehr
    hostileMarks: [thorne_abgelehnt]
    cheapBelow: 0.8          # Stimmung unter 0,8: Die Aktie ist billig – Thorne kauft doppelt
    floatKeep: 0.05          # so viel bleibt immer bei den Kleinaktionären
    maxStake: 0.45           # mehr will er nicht
    seatPer: 0.1             # je 10 % Anteil bekommt Thorne einen Sitz im Aufsichtsrat (sein Mann)
    maxSeats: 3
    investigateCost: 1500    # Detektei durchleuchtet das Aktienbuch: alle Strohmänner fliegen auf
    pressure: 2              # je Runde und je Mann Thornes im Rat verliert jeder andere Rat so viel Treue (er bearbeitet sie)
    blockFrom: 0.25          # Sperrminorität: ab diesem Anteil blockiert Thorne Rückkäufe (Jacobs Mittel im Stellvertreterkampf)
  # Misstrauensvotum und Stellvertreterkampf (GDD §8): nur wenn die Kontrolle unter 50 % liegt.
  vote:
    lookback: 2              # Kurs der letzten 2 Runden …
    dropFrom: 0.15           # … um 15 % gefallen, oder …
    moodBelow: 30            # … die Stimmung im Land (Skandale) unter 30
    proxyRounds: 2           # Stellvertreterkampf: so viele Runden Zeit
    pressCost: 1500          # Kleinaktionäre über die Presse mobilisieren …
    pressBonus: 0.04         # … bringt so viel Kontrolle (bis zum Ende des Kampfs)
  # Anleihen (GDD §8: ab Kapitel 2, große Summen, fester Zins, Zinsen laufen auch in Krisen).
  bonds:
    sizes: [10000, 25000, 50000]
    terms: [8, 12]           # Laufzeit in Runden (2 oder 3 Jahre)
    baseRate: 0.05           # Jahreszins …
    spreads: { A: 0, B: 0.01, C: 0.03 }  # … plus Aufschlag nach Rating (D: niemand zeichnet)
    climateSpread: 0.03      # … plus bis zu 3 Punkte in der Kreditklemme (credit 0), minus bis zu 3 im Boom (credit 100)
    minRate: 0.03
    fee: 0.02                # Bankprovision beim Ausgeben
    perRound: 1              # höchstens so viele neue Anleihen je Runde
    limitShare: 0.5          # Rahmen: alle Anleihen zusammen höchstens 50 % des Imperiumswerts …
    limitMin: 25000          # … aber mindestens so viel (damit auch eine kleine Firma eine Anleihe bekommt)
    loadSpread: 0.03         # Zinsaufschlag: je voll ausgeschöpftem Rahmen +3 Punkte (Anleihen-Quote nach der neuen Anleihe)

# Personal (4.9, GDD §11 und §3): Sekretärin/Prokurist und Fixer ab Kapitel 2, Richtlinien
# statt Mikromanagement, Loyalität und Löhne. Namen, Merkmale und Texte stehen in
# content/staff.yaml, die Regeln in src/sim/staff.ts und src/sim/staffRound.ts.
# Alles PLATZHALTER – Balance klärt sich mit den Bot-Läufen für Kapitel 2.
staff:
  unlockChapter: 2           # ab Kapitel 2 sichtbar (GDD §11); in Kapitel 1 gibt es kein Personal
  hireAppointments: 1        # Vorstellungsgespräch: 1 Termin (GDD §3: Besucher empfangen)
  recognitionAppointments: 1 # persönliche Anerkennung: 1 Termin (GDD §11)
  candidatesPerRole: 2       # so viele Bewerber je Stelle liegen auf dem Tisch
  candidateRefreshRounds: 4  # alle 4 Runden kommen neue Bewerbungen
  revealRounds: 4            # so lange ist die Kompetenz nur ungefähr (±1) sichtbar (GDD §11)
  namePool: 6                # Namen je Stelle in content/staff.yaml (muss passen)
  candidate:                 # wie Bewerber gewürfelt werden
    competence: { min: 1, max: 5 }
    ambition: { min: 1, max: 5 }
    secondTraitChance: 0.35  # Anteil mit zwei Merkmalen (GDD §11: 1–2)
  wage:
    secretary: 120           # $ je Runde bei Kompetenz 3, Lohnstufe „Markt“
    fixer: 220
    competenceStep: 0.15     # je Kompetenzstufe über/unter 3: ±15 %
    creditSensitivity: 0.004 # Lohnniveau folgt dem Kreditklima (4.1): je Punkt über 50 +0,4 %
    severanceRounds: 1       # Abfindung bei Entlassung: ein Rundenlohn
    # Lohn-Richtlinie (GDD §11 „Löhne 10 % über Markt“): Faktor und Loyalität je Runde.
    levels:
      - { id: knapp, factor: 0.9, loyalty: -3 }
      - { id: markt, factor: 1.0, loyalty: 0 }
      - { id: gut, factor: 1.1, loyalty: 2 }
      - { id: grosszuegig, factor: 1.25, loyalty: 4 }
    startLevel: markt
  loyalty:
    start: 60                # Loyalität 0–100 beim Einstellen
    recognition: 8           # persönliche Anerkennung (ein Termin, einmal je Runde und Person)
    cut: 10                  # Lohnkürzung: sofort minus
    scapegoat: 6             # ein Kollege wird entlassen: die anderen minus
    illegalOrder: 15         # Gewissenhafte bekommen einen schmutzigen Auftrag
    conscience: 2            # Gewissenhafte bei hoher Hitze: je Runde minus (sie sehen, was läuft)
    ambitionDrift: 1         # je Ehrgeiz über 3: minus je Runde (keine Beförderung)
    genieSwing: 4            # Genie ist launisch: ± so viel je Runde
    loyalFloor: 40           # „Treu bis zum Tod“ fällt nie darunter
    poachBelow: 35           # darunter kann ein Rivale abwerben …
    poachChance: 0.15        # … mit dieser Chance je Runde (Gierige doppelt)
    betrayBelow: 25          # darunter und …
    betrayAmbition: 4        # … ab diesem Ehrgeiz droht Verrat …
    betrayChance: 0.2        # … mit dieser Chance je Runde
    words:                   # Zustandswörter: ab diesem Wert
      treu: 75
      zufrieden: 50
      unzufrieden: 25        # darunter: abtrünnig
  secretary:
    extraAppointments: 1     # Termine mehr je Runde (GDD §3: 5, mit Sekretärin bis zu 7) …
    extraFromCompetence: 4   # … ab dieser Kompetenz einer mehr
    drunkChance: 0.2         # Trinker: Aussetzer in einer Runde (kein Extra-Termin, keine Post, kein Verkauf)
    judgementNoise: 200      # $ Fehleinschätzung je Antwort bei Kompetenz 1 (bei 5: keine)
    greedChance: 0.25        # Gierig: Chance je Verkauf, dass ein Teil verschwindet …
    greedSkim: 0.1           # … so viel vom Erlös
    charmBonus: 0.03         # Charmant: $ je Barrel mehr beim Verkauf nach Regel
    mailSpendLimit: 100      # Start-Richtlinie: Antworten bis 100 $ darf das Vorzimmer selbst geben
  sales:
    minPrice: 1.0            # Start-Richtlinie: Mindestpreis beim Trust in $ je Barrel
    share: 0.5               # Start-Richtlinie: so viel vom Tank je Runde
    misjudgeChance: 0.3      # bei Kompetenz 1 hält sich das Vorzimmer nicht an die Regel (bei 5: nie; Spieler doppelt)
  fixer:
    defense: 0.6             # Sabotage gegen Jacob × (1 − defense × Kompetenz/5)
    heatDecay: 5             # Hitze sinkt je Runde …
    heatDecayDiscreet: 10    # … beim Verschwiegenen schneller
    scandalFrom: 60          # ab dieser Hitze droht ein Skandal …
    scandalChance: 0.25      # … mit dieser Chance je Runde
    scandalFine: 500         # Geldstrafe und Schweigegeld
    scandalCool: 30          # danach ist es so viel kühler
    leakHeat: 30             # Verrat eines Fixers / Whistleblower: Hitze plus
    eventHeat: 15            # ein Brief schickt den Fixer los (Merkzeichen fixer_auftrag_brief): Hitze plus
    words:                   # Hitze als Wort: ab diesem Wert
      lauwarm: 20
      heiss: 60
    orders:                  # Aufträge (GDD §11: Spionage, Sabotage – und Hitze)
      spy: { cost: 150, heat: 10, successMin: 0.4, successMax: 0.95 }
      sabotage: { cost: 300, heat: 25, successMin: 0.25, successMax: 0.85, rivalCash: 400, delay: 1, caughtHeat: 15 }
# 4.11 Ermittler (GDD §4 „Hitze & Schattenbuch“, §10 „Ermittlungen & Justiz“), ab Kapitel 2.
# Spuren: Merkzeichen früherer schmutziger Entscheidungen mit Schwere 1–5; ihre Summe ist die Hitze.
# witness: true = ein Zeuge – verblasst nie und bringt Delaney zu Beginn der Vorermittlung Beweise.
# Texte im Schattenbuch: content/investigation.yaml. Delaneys Auftritte: content/events/k2-delaney.yaml.
# PLATZHALTER Kapitel 2: Beträge grob geschätzt (Kapitel 2 rechnet mit größerem Geld), Balance klärt sich mit 4.x.
investigation:
  fromChapter: 2
  traces:
    - { mark: moss_betrogen, severity: 3 }                 # Moss' Pachtpapier für 100 $
    - { mark: silas_betrogen, severity: 2 }                # frisierte Bücher für Silas
    - { mark: silas_kronzeuge, severity: 2, witness: true } # Silas redet in jedem Saloon
    - { mark: courier_gekauft, severity: 1 }               # gekaufter Zeitungsbericht
    - { mark: vale_geld, severity: 1 }                     # Geld unbekannter Herkunft (Mr. Vale)
    - { mark: thorne_exklusiv, severity: 1 }               # geheimer Exklusivvertrag mit der Bahn
  goodMarks: [moss_fair, silas_fair, nora_interview, ruth_teilhaberin]  # Leumund vor Gericht
  worldFallback: { mood: 50, government: null }  # Ersatz bis zum Weltmodell (4.1)
  fadeEvery: 8           # GDD §4: −1 Schwere je Spur alle 8 Runden, solange niemand ermittelt
  jumpFade: 1            # Zeitsprung vor Kapitel 2: so viele Stufen verblassen auf einmal (Zeugen nicht)
  rumorAt: 3             # Hitze ab hier: Gerücht (Nora fragt nach)
  rumorRounds: 2         # so viele Runden bleibt es mindestens beim Gerücht, bevor Delaney ermittelt
  probeAt: 5             # Hitze ab hier: Vorermittlung (Delaney kommt)
  chargeAt: 60           # Beweise (0–100) ab hier: Anklage
  heatWords: { warm: 3, hot: 5, glowing: 9 }  # Hitze als Wort im Schattenbuch (darunter: kühl)
  trialDelay: 2          # Runden von der Anklage bis zum Urteil
  cooldown: 4            # Runden nach einem Fall, bevor ein neuer beginnen kann
  evidence:
    perHeat: 2.5         # Beweise je Runde je Hitzepunkt
    perWitness: 15       # einmalig je Zeuge zu Beginn der Vorermittlung
    lawyerCut: 3         # weniger Beweise je Runde je Anwaltsstufe
    transferredDecay: 5  # Beweise, die je Runde verfallen, solange Delaney versetzt ist
    hostileFactor: 1.3   # hinausgeworfen: Delaney gräbt schneller
    divertedFactor: 0.75 # Nora schreibt über Crane: Delaney schaut auch dorthin
    candid: 10           # offen geantwortet: sofort so viel mehr Beweise …
    slipChance: 0.3      # Interview: Risiko eines Versprechers …
    slip: 10             # … der Delaney zur Vorermittlung so viele Beweise bringt
  trial:
    base: 0.25           # Grundchance einer Verurteilung
    perEvidence: 0.006   # + je Beweispunkt
    perLawyer: 0.08      # − je Anwaltsstufe
    perGood: 0.05        # − je Leumund-Merkzeichen
    moodWeight: 0.004    # + je Punkt Stimmung unter 50 (− darüber)
    interview: 0.08      # − nach einem Interview mit Nora
    min: 0.05
    max: 0.9
  fine:
    perHeat: 800         # $ Strafe je Hitzepunkt der offenen Spuren
    candidFactor: 0.5    # offen geantwortet: halbe Strafe
    heavyAt: 12          # Hitze ab hier: schwere Strafe (Zwangsverkauf) …
    heavyFactor: 2       # … und doppelte Geldstrafe
    prisonAt: 16         # Hitze ab hier: lange Haft – frühes Ende „Hinter Gittern“ (GDD §14, 4.12)
  lawyer:
    costPerLevel: 150    # $ je Runde je Stufe
    max: 5               # GDD §10: Anwälte Qualität 1–5
    early: 1             # Anwalt auf Abruf (Antwort auf Delaneys Ankunft)
    summoned: 2          # auf den Anwalt verwiesen (Antwort auf Delaneys Besuch)
  destroy:
    cost: 1500           # Spur vernichten
    cut: 2               # so viele Stufen weniger
    chance: 0.35         # Chance, dass jemand zusieht: neue Spur „Vertuschung“ …
    severity: 2          # … mit dieser Schwere …
    evidence: 10         # … und, wenn ermittelt wird, so viele Beweise mehr
  witness:
    cost: 3000           # Zeugen kaufen
    evidenceCut: 25      # Beweise weniger
    severity: 3          # neue Spur „Zeugenkauf“
  scapegoat:
    evidenceCut: 30      # einmal je Fall
    strength: 10         # kostet Kraft
  pressure:
    cost: 5000           # Spenden und Telefonate in Hallstead …
    favors: 3            # … 0.4.20+9: oder so viele Hallstead-Gefallen (4.16), wenn Jacob sie hat (zuerst)
    rounds: 4            # so lange ist Delaney versetzt
    chance: { handel: 0.7, volksbund: 0.25, provinz: 0.5, none: 0.5 }  # je regierender Partei (none: ohne Weltmodell)
    failEvidence: 15     # misslungen: so viele Beweise mehr …
    severity: 2          # … und eine neue Spur „Einflussnahme“
  crown:
    evidenceCut: 40      # Kronzeuge gegen den Crane Trust
  staffHeatFactor: 0.04  # 0.4.20+9: Hitze des Personals (Fixer, 0–100) × 0,04 zählt zur Hitze (100 → +4)
  lobbyHeatFactor: 0.2   # 0.4.20+16: Hitze der Umschläge (hallstead.lobby.bribe.heat, 10 je Umschlag) × 0,2 zählt zur Hitze (ein frischer Umschlag → +2)
  forcedSale:            # 0.4.20+9: Zwangsverkauf bei schwerer Strafe (PLATZHALTER)
    share: 0.25          # Anteil der fördernden Quellen (größte zuerst, aufgerundet)
    rounds: 8            # Erlös = letzte Rate × 8 Runden × Posted Price …
    discount: 0.5        # … × 0,5 (unter Wert)

# 4.11 Forschung bis Technikstufe II (GDD §5, §6, §7.1), ab Kapitel 2.
# Texte: content/research.yaml. Wirkung lesen andere Systeme über techEffect/hasTech/techTier (src/sim/research.ts).
# PLATZHALTER Kapitel 2.
research:
  fromChapter: 2
  workshop: 3000         # Versuchswerkstatt einrichten (einmalig)
  funding:               # Förderstufen: Kosten je Runde und Forschungspunkte je Runde
    - { cost: 500, points: 1 }     # sparsam
    - { cost: 1200, points: 2.5 }  # kräftig
  luck: { min: 0.5, max: 1.5 }     # Fortschritt je Runde schwankt
  # 0.4.20+29: Je Kapitel nur EINE Forschungsrichtung (domain), gewählt mit der ersten Förderung. Lizenzen anderer
  # Richtungen bleiben möglich, kosten aber × 1,5 – die Wahl soll zählen.
  licenseOffDirection: 1.5
  patentIncome: 400      # $ Lizenzgebühren je Runde und Patent, sobald die Welt die Technik braucht
  # Technikstand der Welt (0–100), solange es kein Weltmodell gibt. Skala wie worldModel.tech
  # auf main (4.1): Start 6–10, logistisch +1,7 % je Runde → Kapitel 2 (Jahr 11–14) etwa 11–22,
  # Kapitel 3 (Jahr 21–24) etwa 22–35. 12 ≈ Beginn von Kapitel 2.
  worldFallback: { tech: 12 }
  # 0.4.20+29: worldAt angehoben (vorher 10/17/20/15): Die Welt steht zu Beginn von Kapitel 2 bei ~12–20 (Median ~15, +1,7 % je Runde);
  # wer früh in EINE Richtung forscht (Stufe I in 2–5 Runden), hält das Patent in mindestens 80 % der Welten (Test „Patent-Check“).
  # worldAt: ab diesem Technikstand der Welt haben andere die Technik (Lizenz kaufbar, kein Patent mehr;
  # Jacobs Patent bringt ab dann Lizenzgebühren). Am Weltmodell von main ausgerichtet: Drehbohren ist
  # zu Beginn von Kapitel 2 schon verbreitet, Tanklaster und Rollenmeißel ziehen im Lauf von Kapitel 2
  # nach, Cracken gegen Ende von Kapitel 2 / in Kapitel 3. Voraussetzungen (requires) müssen weiter oben stehen.
  techs:
    - id: rotary         # Drehbohren (Stufe I, GDD §5): schneller, tiefer
      tier: 1
      domain: bohren
      points: 4
      worldAt: 18
      license: 2500
      effects: { drillTime: -0.25, depth: 150 }   # depth: jede Stufe so sicher wie eine 150 m flachere (Unfall/Klemmen)
    - id: rollenmeissel  # Rollenmeißel (Stufe II): harte Schichten
      tier: 2
      domain: bohren
      points: 6
      requires: [rotary]
      worldAt: 23
      license: 6000
      effects: { drillTime: -0.15, drillCost: -0.15, depth: 150 }
    - id: thermal_cracking  # Thermisches Cracken (Stufe II, GDD §6): Benzin-Höchstanteil im Mix 20 % → 40 % (Raffinerie 4.6)
      tier: 2
      domain: raffinerie
      points: 8
      worldAt: 25
      license: 8000
      effects: { gasolineYield: 0.2 }
    - id: tanklaster     # Tanklaster (Stufe II, GDD §6): klein, flexibel, für Tankstellen
      tier: 2
      domain: transport
      points: 5
      worldAt: 19
      license: 4000
      effects: { trucks: 0.5 }   # 0.4.20+9: eigene Gespanne schaffen 50 % mehr je Runde (PLATZHALTER)

# 4.14 Andockpunkt – Marke und Tankstellen (Kapitel 3, GDD §6 Vertrieb, §13 Kapitel 3).
# Eigene Marke, Tankstellennetz je Region, Marktanteil, Markenwert, Konkurrenz mit
# Margaret Cranes Marke. Rechnung in src/sim/brand.ts, Texte in content/brand.yaml.
# Alles PLATZHALTER bis zu den Bot-Läufen für Kapitel 3. Mengen in Barrel Benzin je Runde.
brand:
  unlockChapter: 3          # GDD §13: Marke und Tankstellen sind neu in Kapitel 3
  foundCost: 20000          # $ für Name, Schilder, Lackierung der ersten Zapfsäulen
  station:
    cost: 17500             # $ je Tankstelle (× costFactor der Region); 0.4.20+6: 6.000 → 17.500 – bei 6.000 erreichte der Standard-Bot das Kapitelziel 3 in 96 %, jetzt ~62 %
    buildRounds: 1          # so viele Runden dauert der Bau
    buildMax: 5             # höchstens so viele auf einmal in Auftrag geben
    upkeep: 900             # $ je Tankstelle und Runde (Pächter, Pumpe, Lieferwagen); 0.4.20+7: 300 → 900 – vorher machte eine Tankstelle nie Verlust, auch nicht im Crash oder Preiskampf; jetzt kostet der Wettlauf mit Crane (Kapitelziel 3 Standard-Bot 64 % → ~35 %)
    resale: 0.5             # Anteil der Baukosten beim Verkauf einer Tankstelle
    capacity: 4000          # bbl Benzin, die eine Tankstelle je Runde höchstens verkauft
    maxPerRegion: 40        # so viele Tankstellen je Marke und Region höchstens
  share:                    # Anziehung = Stationen^stationExponent × (awarenessBase + Bekanntheit/100) × Preisfaktor × Ruf
    stationExponent: 0.8    # unter 1: die zwanzigste Tankstelle bringt weniger als die erste
    awarenessBase: 0.3      # auch eine unbekannte Marke verkauft etwas – wer vorbeifährt, tankt
    reputationWeight: 0.4   # Ruf in der Öffentlichkeit ±100 → Anziehung ±40 % (GDD §6: ein Skandal senkt den Absatz sofort)
    independentAwareness: 0.2  # freie Tankstellen gelten als so bekannt (Bekanntheit 20)
  prices:                   # Preis an der Zapfsäule: Anziehung und Marge in $ je bbl
    billig: { attract: 1.4, margin: 0.2 }
    normal: { attract: 1.0, margin: 0.4 }
    teuer: { attract: 0.7, margin: 0.6 }
  priceWar:
    marginFactor: 0.5       # beide Marken billig in einer Region: Preiskampf, die Marge halbiert sich noch einmal
  awareness:
    decay: 0.08             # Anteil der Bekanntheit, der je Runde verblasst
    perStation: 1.2         # Bekanntheit je Runde × Wurzel der Tankstellen (Schilder an der Straße)
    scandalLoss: 6          # Bekanntheit weniger je Schwere eines Skandals (1–5), in jeder Region
  campaigns:                # Werbung (GDD §6): Kosten, Dauer in Runden, Bekanntheit je Runde
    - { id: plakate, cost: 3000, rounds: 2, gain: 6 }
    - { id: radio, cost: 8000, rounds: 2, gain: 12 }
    - { id: strassenkarten, cost: 5000, rounds: 4, gain: 4 }
  demand:
    growth: 0.03            # Automobilisierung: Benzinnachfrage wächst je Runde um 3 % (bis 4.1 sie liefert)
    crashDrop: 0.25         # im Kreditcrash (state.worldModel.crash > 0) tanken die Leute ein Viertel weniger – bewusst getrennt von worldModel.demand.crashDrop (Welt-Ölnachfrage): Benzin an der Zapfsäule reagiert stärker
  supply:
    boughtCost: 0.08        # $ je bbl, wenn die eigene Raffinerie (4.13) nicht genug Benzin liefert und zugekauft wird (0.4.20+16, 100 Kampagnen: 0,15 → Kapitelziel 3 Standard-Bot 20 %, 0,08 → 45 %, 0 → 57 %)
  crane:                    # Margaret Crane (Crane Eastern) führt den Kampf um die Marke (GDD §13)
    reactShare: 0.15        # ab so viel Marktanteil Jacobs in einer Region denkt sie über einen Preiskampf nach …
    warChance: 0.5          # … und beginnt ihn mit dieser Chance je Runde (auch, wenn Jacob billig verkauft)
    warRounds: 3            # so lange hält sie den Preiskampf durch
    cooldown: 2             # danach so viele Runden Ruhe in der Region
    expandChance: 0.35      # Chance je Runde und Region, neue Tankstellen zu bauen, solange ihr Anteil unter targetShare liegt
    expandStations: 2       # so viele auf einmal
    targetShare: 0.45       # so viel Marktanteil will sie je Region halten
    adGain: 2               # Bekanntheit je Runde durch ihre ständige Werbung
  value:
    profitMultiple: 4       # Markenwert = Gewinn des Netzes je Runde (ohne Werbewirkung, nie unter 0) × so viele Runden – ein Jahr Gewinn
    assetShare: 0.7         # Tankstellen zählen im Imperiumswert mit diesem Anteil ihrer Baukosten (0.4.20+7: 0,5 → 0,7 – sonst schrumpfte das Imperium in Kapitel 3, obwohl das Netz Gewinn macht)
  goal:                     # Kapitelprüfung Kapitel 3 (GDD §13): Marke in ≥ 3 Regionen oder ≥ 10 % Marktanteil
    regions: 3
    share: 0.25             # nationaler Marktanteil als zweiter Weg (0.4.20+6: 0,10 → 0,25 – 0,10 erreichte jede Marke nebenbei)
    # 0.4.20+6: Vertreten ist die Marke in einer Region erst mit so viel Marktanteil dort (letzte Abrechnung). Vorher
    # zählte eine feste Zahl Tankstellen (presenceStations 6) – wer genug Geld hatte, bestand immer (Standard-Bot 96 %,
    # auch mit 10 oder 12 Tankstellen nur eine Frage der Bauzeit). Jetzt entscheidet der Kampf gegen Crane.
    presenceShare: 0.3
  antitrust:                # GDD §15: Kartellbehörde ab 25 % regionalem oder 15 % nationalem Marktanteil (für 4.3 Gesetze)
    regional: 0.25
    national: 0.15
  regions:                  # Absatzgebiete; Namen in content/brand.yaml. demand in bbl Benzin je Runde zu Kapitelbeginn
    - { id: cordova, demand: 60000, costFactor: 0.8, independents: 6, craneStations: 6, craneAwareness: 35, fromChapter: 3 }
    - { id: okara, demand: 40000, costFactor: 0.9, independents: 5, craneStations: 4, craneAwareness: 25, fromChapter: 3 }
    - { id: mittelland, demand: 70000, costFactor: 1.0, independents: 8, craneStations: 10, craneAwareness: 45, fromChapter: 3 }
    - { id: ostkueste, demand: 110000, costFactor: 1.4, independents: 10, craneStations: 18, craneAwareness: 65, fromChapter: 3 }
    - { id: sierra_alta, demand: 50000, costFactor: 1.2, independents: 6, craneStations: 3, craneAwareness: 20, fromChapter: 4 }

# Börse und Kauf auf Kredit (4.15, GDD §8, §7.2): ab Kapitel 3. Eigener Zufall (Seed + ":boerse"),
# Code in src/sim/exchange.ts, Texte in content/exchange.yaml.
# Das Börsenfieber (0–100, 50 = normal) ist der Spiegel des Kreditklimas an der Börse: Es folgt dem
# Kreditklima aus dem Weltmodell (4.4), steigenden Kursen und Jacobs Kauf auf Kredit. Über 50 schaukelt
# es sich auf; ab crash.from kann es krachen – aber erst, wenn die Zeitung crash.minWarnings Runden
# lang gewarnt hat (gezählt wird das Kreditklima vom Rundenbeginn, so wie es in der Zeitung stand).
# Es gibt nur einen Kreditcrash: Ein Weltcrash (worldModel.credit) reißt die Börse mit, ein Börsencrash
# kippt auch das Weltmodell (Kreditklima × worldModel.credit.after, Dauer wie der Börsencrash).
# ALLES PLATZHALTER bis zur Balance von Kapitel 3.
exchange:
  unlockChapter: 3         # GDD §14: Börse und Kauf auf Kredit ab Kapitel 3
  startIndex: 100          # Börsenindex bei Öffnung (nur für den Ticker)
  history: 12              # so viele Kurse je Aktie merkt sich der Ticker (3 Jahre)
  minPrice: 1              # tiefer fällt kein Kurs ($ je Aktie)
  market:
    drift: 0.01            # Grundtrend des Index je Runde
    boom: 0.06             # Fieber 100 → +6 % je Runde zusätzlich, Fieber 0 → −6 %
    noise: 0.04            # Zufallsschwankung des Index je Runde (±)
  fever:
    start: { min: 45, max: 55 }
    revert: 0.08           # zieht je Runde so viel zur 50 zurück
    speculation: 0.09      # über 50 heizt es sich um so viel selbst an (stärker als revert → Blase; 4.20: 0,12 → 0,09 – die Blase wächst langsamer und braucht meist Kreditboom, Momentum oder Jacobs Kredit; vorher krachte die Börse in gut der Hälfte aller Kapitel 3)
    climate: 0.10          # je Punkt Weltkreditklima (worldModel.credit) über 50 so viele Punkte Fieber je Runde
    momentum: 30           # steigende Kurse heizen an: Indexänderung × momentum
    margin: 8              # Jacobs geliehenes Geld (voll ab margin.heatScale) heizt so viele Punkte je Runde an
    noise: 3               # Zufall je Runde (±)
  warnFrom: 70             # ab hier warnt die Zeitung: „Makler leihen jedem“
  alarmFrom: 82            # ab hier zweite Warnstufe: „Zinsen steigen“
  warnCredit: 65           # warnt auch, wenn das Kreditklima (4.4) so hoch ist
  boomFrom: 58             # ab hier schreibt die Zeitung vom Boom (keine Warnung)
  gloomTo: 35              # bis hier von Flaute
  crash:
    from: 78               # ab diesem Fieber kann es krachen
    chance: 0.15           # Chance je Runde ab crash.from …
    slope: 0.5             # … steigt bis Fieber 100 um so viel
    minWarnings: 2         # so viele Runden in Folge muss die Zeitung vorher gewarnt haben
    drop: { min: 0.40, max: 0.55 }   # Indexsturz in der Crashrunde (GDD §7.3: fast −50 %)
    tail: 0.08             # weitere Verluste je Runde, solange der Crash nachwirkt
    rounds: { min: 2, max: 4 }       # so lange wirkt er nach
    after: 0.45            # Fieber nach dem Crash (× vorher)
  margin:
    leverages: [1, 2, 5, 10]   # wählbarer Hebel beim Kauf
    maxLeverage: 10        # GDD §8: bis zu zehnfacher Hebel
    call: 0.5              # Eigenkapital unter 50 % des Einsatzes → der Makler fordert Nachschuss
    liquidate: 0.2         # unter 20 % verkauft er zwangsweise; fehlt Geld, zahlt Jacob aus der Kasse
    rate: 0.08             # Maklerzins pro Jahr bei normalem Kreditklima
    rateClimate: 0.08      # Kreditklima 100 → so viel Zins zusätzlich (0 → so viel weniger)
    minBuy: 500            # kleinster Einsatz in $
    heatScale: 400000      # so viel geliehenes Geld heizt Börse und Kreditklima voll an (0.4.20+6: 100.000 → 400.000 $ – in Kapitel 3 haben Firmen 500.000 $ und mehr; schon 10 % mit doppeltem Hebel lösten in 95 % der Welten eine Kreditkrise aus, GDD §8: „kann“ den Crash auslösen)
    creditShift: 4         # volle Hitze → so viele Punkte aufs Weltkreditklima der Folgerunde (worldModel.credit)
    fee: 0.01              # Maklergebühr bei Kauf und Verkauf
  sectors:
    rail: { beta: 1.0, idio: 0.03, dividend: 0.012 }
    bank: { beta: 1.3, idio: 0.02, dividend: 0.015 }
    oil: { beta: 0.8, idio: 0.04, dividend: 0.010 }
    auto: { beta: 1.8, idio: 0.06, dividend: 0.0 }
    steel: { beta: 1.1, idio: 0.03, dividend: 0.012 }
  stocks:                  # Namen und Beschreibungen in content/exchange.yaml
    - { id: thorne_bahn, sector: rail, start: 120 }
    - { id: handelsbank, sector: bank, start: 90 }
    - { id: crane_trust, sector: oil, start: 150 }
    - { id: motorwagen, sector: auto, start: 40 }
    - { id: westmark_stahl, sector: steel, start: 70 }

# Kapitel 3 – Der Konzernherr (4.17, GDD §5, §12, §13): Technikstufe III (Seismik), Mr. Vales
# Einladung ins Konsortium, Konsortialprojekte für große Vorhaben und die Aufnahme in die
# Gesellschaft (Stand). Erst ab fromChapter sichtbar; in Kapitel 1 und 2 ruht alles.
# Texte stehen in content/kapitel3.yaml. Alle Zahlen PLATZHALTER: Die Wirtschaft von
# Kapitel 3 gibt es noch nicht – grob zehn- bis zwanzigmal Kapitel 1.
kapitel3:
  fromChapter: 3
  # Ersatzwerte, solange das Weltmodell (4.1) nicht im Spielstand steht (0–100 wie dort).
  world: { tech: 50, credit: 50, tension: 30, mood: 50 }
  seismik:
    # Technikstand der Welt (4.1: Start 6–10, logistisch +1,7 % je Runde), ab dem Stufe I–V gilt.
    # Kurve: Runde 40 ≈ 11–18, Runde 80 ≈ 20–30, Runde 160 ≈ 49–63, Runde 256 ≈ 83–90.
    # Schnelle Welten erreichen eine Stufe so etwas früher; garantiert ist sie über chapterStages.
    techStages: [0, 15, 28, 55, 85]
    chapterStages: [1, 2, 3, 3, 4, 4, 5]  # Mindeststufe je Kapitel 1–7 (GDD §13: II in Kap. 2, III in Kap. 3, IV in Kap. 5)
    stage: 3                 # Reflexionsseismik braucht Technikstufe III (GDD §5)
    licenseCost: 20000       # Lizenz beim Patentinhaber (einmalig); Konsortium-Mitglieder zahlen nichts
    licenseFavors: 4         # oder Genehmigung über Hallstead-Gefallen statt Geld (spendFavors, ein Zugeständnis der Behörde)
    surveyCost: 6000         # eine Vermessung je Ranch
    surveyRounds: 1          # so lange ist der Spezialtrupp unterwegs
    crews: 1                 # Trupps mit der Lizenz
    crewCost: 15000          # jeder weitere Trupp
    maxCrews: 3
    width: 10                # Bandbreite der Fundchance in Prozentpunkten (Geologe: 10–50)
    insight: 0.3             # so stark sieht die Messung die wirkliche Falle statt nur die Zone (0–1); GDD §5: „gut“, nicht „sehr gut“
    rounding: 5              # Raster der Prozentangabe
    sizeMiss: 0.2            # Chance, dass die Größe eine Klasse daneben liegt (dann zwei Klassen Spanne)
    falseTrap: 0.25          # Fehlmessung: eine trockene Ranch zeigt eine Struktur – Chance und Falle wirken wie bei Öl
    missTrap: 0.15           # Fehlmessung: die Falle einer Ranch mit Öl bleibt unsichtbar – Chance wie bei einer trockenen
    sizeClasses:             # Größenklassen nach förderbarem Öl (GDD §5), aufsteigend
      - { id: tasche, from: 0 }
      - { id: klein, from: 50000 }
      - { id: mittel, from: 500000 }
      - { id: gross, from: 5000000 }
      - { id: riese, from: 50000000 }
  konsortium:
    inviteRound: 3           # Mr. Vales Einladung kommt zu Beginn der 3. Runde des Kapitels
    inviteDeadline: 2        # Bedenkzeit in Runden (Ankunftsrunde mitgezählt); Schweigen gilt als Absage
    trustStart: 50           # Vales Vertrauen 0–100
    trustValeGeld: 15        # Jacob hat in Kapitel 1 das Geld „eines Freundes“ behalten
    trustValeAbgelehnt: -10  # … oder zurückgegeben
    powerStart: 60           # Macht des Konsortiums 0–100 (Akteur im Weltmodell)
    memberIncome: 8000       # Anteil am Kartellgewinn je Runde als Mitglied
    doubleIncome: 14000      # Doppelspiel: Kartellgewinn plus Insiderwissen
    doubleDetect: 0.06       # Chance je Runde, dass das Doppelspiel auffliegt …
    doubleDetectGrowth: 0.03 # … plus so viel je Runde im Doppelspiel
    feignDetect: 0.10        # ein vorgetäuschter Gefallen erhöht die Chance dauerhaft um so viel
    favorEvery: 3            # alle so viele Runden verlangt Vale einen Gefallen
    favorEveryControlled: 2  # nach einer Rettung: Vale hat die Hand an den Förderquoten
    favorDeadline: 2         # Frist eines Gefallens (Ankunftsrunde mitgezählt)
    complyTrust: 10
    refuseTrust: -20
    expelBelow: 20           # darunter fliegt Jacob aus dem Konsortium
    trustWords: [35, 65]     # ab hier wirkt Vale abwartend, ab hier vertraut er (nur als Satz sichtbar)
    expelledPenalty: 5000    # je Runde beim Trendpreis market.basePrice; 0.4.20+9: wächst und fällt mit dem Posted Price
    expelledRounds: 6
    power: { join: 5, refuse: -5, double: 3, exposed: -15, broken: -10 }
    rescue: { cash: 50000, trust: 30 }  # Rettung in der Pleitefrist – gegen die Förderquoten
    worldInput: { tension: 0.04, credit: 0.03, mood: -0.02 }  # Wirkung je Machtpunkt über 50 auf die Weltgrößen
    favors:                  # Gefallen: Kosten beim Erfüllen (Texte in content/kapitel3.yaml)
      - { id: drosseln, cash: 6000 }
      - { id: spende_grady, cash: 4000, ansehen: -3 }
      - { id: preis_halten, cash: 5000 }
      - { id: zeitung_schweigen, cash: 3000, ansehen: -2 }
      - { id: crane_schonen, cash: 7000 }
  projekte:
    offerEvery: 3            # alle so viele Runden ein neues Angebot
    maxOffers: 2
    offerRounds: 2           # so lange liegt ein Angebot
    shares: [0.25, 0.5]      # Anteile, die Jacob zeichnen kann
    fraud: 0.05              # je Baurunde: ein Partner betrügt, das Projekt verzögert sich um eine Runde
    memberRisk: 0.5          # Konsortium-Mitglieder: Risiko mal so viel (Vale glättet die Wege)
    list:                    # minRank: Stand nötig (0 Emporkömmling … 3 aufgenommen); members: nur fürs Konsortium
      - { id: seismik_kampagne, cost: 120000, rounds: 2, income: 9000, risk: 0.05, minRank: 0, members: false }
      - { id: fernpipeline, cost: 200000, rounds: 4, income: 16000, risk: 0.10, minRank: 0, members: false }
      - { id: grossraffinerie, cost: 300000, rounds: 5, income: 24000, risk: 0.12, minRank: 2, members: false }
      - { id: hafen_tanklager, cost: 150000, rounds: 3, income: 11000, risk: 0.08, minRank: 1, members: false }
      - { id: costa_negra, cost: 250000, rounds: 3, income: 30000, risk: 0.25, minRank: 0, members: true }
  stand:
    start: 10                # Ansehen in Hallstead bei Kapitelbeginn (0–100): Ölgeld zählt dort nichts
    ranks: [0, 25, 50]       # ab so viel Ansehen: Emporkömmling, geduldet, anerkannt (aufgenommen nur über den Club)
    decay: 1                 # je Runde verblasst Ansehen um so viel (nicht unter start), bis Jacob aufgenommen ist
    donation: { cost: 15000, gain: 10, falloff: 0.7, cap: 60 }  # Stiftung: jede weitere bringt 70 % der vorigen, höchstens bis cap
    marriage: { cost: 40000, gain: 30, minRank: 1, thomas: -20 }  # Heirat in die Vandermeer-Familie: Ehevertrag (die Brautseite zahlt keine Mitgift an Jacob), Thomas' Beziehung
    breakOrder: { cost: 250000 }   # die Schulden der alten Familien aufkaufen: Türen auf, aber kein Ansehen mehr
    club: { cost: 10000, from: 75 }  # Aufnahme in den Hallstead Union Club ab so viel Ansehen
    member: 5                # Beitritt zum Konsortium: man gehört zu den Großen
    exposed: -20             # Doppelspiel aufgeflogen
    rateDiscount: [0, 0, 0.005, 0.01]  # Zinsrabatt der alten Banken je Rang (Emporkömmling … aufgenommen)

# Rivalen in Kapitel 3 (4.19, GDD §13: „Margaret Crane führt den Kampf um die Marke. Thorne bläht
# Aktien auf. Bullard verschuldet sich.“). Regeln in src/sim/rivalsK3.ts. Alle Werte PLATZHALTER.
# Feldkauf (0.4.20+27, Tester-Wunsch): Jacob bietet Bullard Geld für eine seiner Pachten – mit allem, was darauf steht.
# Bullards Preis = Ölfluss (Rate × Nettopreis über horizon Runden mit Rückgang; ungebohrt: seine Fundchance × valuePerFind)
#   × Knappheit (1 + scarcityWeight × Anteil der guten Ranches, die schon vergeben sind) × Haltung.
# Annahme-Chance logistisch: bei Bullards Preis 50 %, bei Preis × (1 + spread) ~73 %, × (1 + 2 spread) ~88 %.
buyout:
  horizon: 8               # PLATZHALTER: so viele Runden Ölfluss rechnet er (2 Jahre)
  goodChance: 0.35         # ab dieser Fundchance (Bullards Bild) zählt eine Ranch als gut
  scarcityWeight: 0.8      # alle guten Ranches vergeben: Preis × 1,8
  feud: 1.5                # Fehde/Verrat: er verkauft nur mit Aufschlag
  pakt: 0.9                # Handschlag: Freundschaftspreis
  distress: 0.7            # Kapitel 3, Bullard verschuldet (rivalsK3.bullard.distressAt): er braucht Geld
  spread: 0.15
  sliderMin: 0.5           # Regler von 50 % …
  sliderMax: 2             # … bis 200 % seines Preises
  step: 100
  cooldown: 3              # nach einer Ablehnung 3 Runden kein neues Angebot für diese Ranch

rivalsK3:
  margaret:
    startAwareness: 5         # Kapitelbeginn: Crane Eastern ist in jeder Region so viel bekannter
    push: 2                   # je Runde Bekanntheit für Crane Eastern in jeder Region, in der Harlan Tankstellen hat
    buildEvery: 4             # alle so viele Runden baut Margaret eine Tankstelle in Harlans stärkster Region
  thorne:
    stakePerRound: 0.5        # Prozentpunkte der Harlan-Aktien, die Thorne je Runde über Strohmänner kauft (nur Aktiengesellschaft) …
    grudgeFrom: 30            # … ab diesem Groll doppelt so viele
    stock: thorne_bahn        # die Aktie, die Thorne aufbläht (exchange.stocks)
    bubble: 0.04              # ihr Kurs steigt je Runde um so viel (außer im Crash) …
    crashDrop: 0.5            # … und fällt beim nächsten Börsencrash auf so viel
  bullard:
    startDebt: 20000          # Schulden zu Beginn von Kapitel 3 ($)
    borrowBelow: 10000        # leiht, sobald seine Kasse darunter liegt …
    borrow: 8000              # … so viel je Runde
    rate: 0.03                # Zins je Runde
    distressAt: 60000         # ab so viel Schulden ist er am Ende (Merkzeichen k3_bullard_verschuldet) …
    distressTrust: 10         # … und kommt mit Angeboten: Vertrauen + so viel

# 0.4.20+8 Cranes Feldzug (Kapitel 3, GDD §13 „Preiskampf an der Zapfsäule“, src/sim/feldzug.ts): die echte
# Bedrohung auch für den, der ohne Schulden spielt – sie trifft die festen Kosten des Tankstellennetzes.
# Zwei bequeme Auswege mit Haken: Preisabsprache (Spur für Delaney, kein Ausbau mehr) und Thornes Kredit
# (Pfand = Mehrheit an Harlan Oil; zur Frist nicht bezahlt → Ende „Geschluckt“). PLATZHALTER, per npm run kampagne justiert.
feldzug:
  fromChapter: 3
  trigger:
    stations: 10              # ab so vielen Harlan-Tankstellen (auch im Bau) denkt Margaret über den Feldzug nach …
    notBefore: 3              # … frühestens in dieser Runde des Kapitels …
    chance: 0.4               # … und kündigt ihn mit dieser Chance je Runde an (eine Runde später geht es los)
  war:
    margin: 0.25              # Jacobs Marge an der Zapfsäule × so viel in jeder Region mit Harlan-Tankstellen
    chestMin: 4               # Cranes Kriegskasse reicht für so viele Runden … (gewürfelt; Jacob sieht nur „voll/halb/knapp“)
    chestMax: 8               # … bis so viele
    craneAwareness: 8         # zum Auftakt wirbt Crane laut: Bekanntheit + so viel in Harlans Regionen
  bank:
    limitFactor: 0.5          # im Krieg gibt die Bank nur so viel des Rahmens (Thorne sitzt im Kreditausschuss)
  held:
    craneClose: 0.3           # durchgehalten: Crane schließt diesen Anteil ihrer Tankstellen in Harlans Regionen …
    reputation: 5             # … und Harlans Ruf in der Öffentlichkeit steigt um so viel
  pact:
    trace: 4                  # Preisabsprache: Spur dieser Schwere (1–5) im Schattenbuch …
    keepRegions: 1            # 0.4.20+17: 2 → 1 (200 Kampagnen: Siegquote gleicher Start Betrüger 41,5 → unter 40 %) – … und Gebietsaufteilung: Harlan behält nur so viele Regionen (die stärksten), Crane kauft die übrigen Tankstellen zum Restwert
  thorne:
    offerBelow: 25000         # sinkt die Kasse im Krieg darunter, bietet Pettibone Thornes Geld an …
    share: 0.15               # … so viel des Imperiumswerts …
    min: 40000                # … mindestens so viel …
    interest: 0.3             # … zur Frist mit so viel Zins zurück …
    rounds: 4                 # … nach so vielen Runden
