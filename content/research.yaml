  chosen: { de: "In diesem Kapitel forscht die Werkstatt an: {domain}.", en: "This chapter the workshop researches: {domain}." }
  locked: { de: "Dieses Kapitel forscht die Werkstatt an {domain} – erst im nächsten Kapitel wieder frei wählbar.", en: "This chapter the workshop researches {domain} – free to choose again next chapter." }
  surchargeNote: { de: "Lizenz außerhalb der Richtung: {factor} % Aufschlag", en: "Licence outside the chosen direction: {factor} % surcharge" }
