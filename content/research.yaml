  build: { de: "Versuchswerkstatt einrichten ({cost})", en: "Set up test workshop ({cost})" }
  research: { de: "Forschen: {funding} ({cost} je Runde)", en: "Research: {funding} ({cost} per round)" }
  stop: { de: "Anhalten", en: "Pause" }
  license: { de: "Lizenz kaufen ({cost})", en: "Buy licence ({cost})" }
  refuse: { de: "Rivalen die Lizenz verweigern", en: "Refuse licences to rivals" }
  allow: { de: "Lizenzen wieder vergeben", en: "Grant licences again" }
