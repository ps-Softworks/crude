# Story-Bögen (2.9, GDD §12): Wie ein Bogen ausgeht, liest die Simulation aus den
# Merkzeichen ab, die die Ereignisse in content/events/ setzen.
#
# Je Bogen:
#   name     – wer
#   outcomes – mögliche Ausgänge, von oben nach unten geprüft: Der erste, dessen
#              Merkzeichen (any: eins davon reicht) gesetzt ist, gilt.
#   open     – Text, solange noch keine Entscheidung gefallen ist.
#   draft    – true = Entwurf, Philipp überarbeitet die Texte noch.
# Jeder Ausgang hat einen kurzen Titel und einen Satz für den Kapitelabschluss
# („Was aus ihnen wurde“). Die Bögen selbst: k1-2-silas.yaml, k1-3-moss.yaml; Kapitel 2 (4.12) unten.
#
# Entwurf – Philipp überarbeitet.

silas:
  draft: true
  name: { de: "Silas Brandt", en: "Silas Brandt" }
  outcomes:
    # Betrogen und reden lassen: der spätere Kronzeuge (Weltbibel).
    - id: kronzeuge
      any: [silas_kronzeuge]
      title: { de: "Ein Mann mit einer Geschichte", en: "A Man with a Story" }
      text:
        de: Silas erzählt in jedem Saloon von Cordova, wie Jacob Harlan rechnet. Eine Reporterin hat alles mitgeschrieben.
        en: Silas tells every saloon in Cordova how Jacob Harlan does his sums. A reporter has written it all down.
    # Betrogen, aber spät doch bezahlt.
    - id: versoehnt
      any: [silas_versoehnt]
      title: { de: "Spät bezahlt", en: "Paid Late" }
      text:
        de: Silas hat sein Geld bekommen, spät. Er grüßt Jacob noch, aber er setzt sich nicht mehr an seinen Tisch.
        en: Silas got his money, late. He still greets Jacob, but he no longer sits at his table.
    - id: freund
      any: [silas_fair]
      title: { de: "Partner", en: "Partner" }
      text:
        de: Silas steht jeden Morgen am Turm, trinkt nur noch sonntags und nennt Jacob vor allen Leuten „mein Junge“.
        en: Silas is at the rig every morning, drinks only on Sundays and calls Jacob "my boy" in front of everyone.
    - id: ausgekauft
      any: [silas_ausgekauft]
      title: { de: "Ausgezahlt", en: "Paid Off" }
      text:
        de: Silas bohrt mit Jacobs Geld auf eigene Rechnung am Salt Hill. Sie schulden einander nichts mehr – und sehen sich selten.
        en: Silas drills on his own account at Salt Hill with Jacob's money. They owe each other nothing now – and rarely meet.
    # Betrogen, der Saloon steht noch aus.
    - id: verbittert
      any: [silas_betrogen]
      title: { de: "Betrogen", en: "Cheated" }
      text:
        de: Silas weiß, dass Jacob ihn betrogen hat. Noch schweigt er.
        en: Silas knows that Jacob cheated him. For now he keeps quiet.
  open:
    title: { de: "Noch offen", en: "Still Open" }
    text:
      de: Silas wartet noch auf seine Abrechnung.
      en: Silas is still waiting for his reckoning.

moss:
  draft: true
  name: { de: "Ezekiel Moss", en: "Ezekiel Moss" }
  outcomes:
    # Betrogen oder vertrieben – Daniel kehrt in Kapitel 3 als Bezirksstaatsanwalt zurück.
    - id: feind
      any: [moss_feind]
      title: { de: "Ein Sohn, der sich erinnert", en: "A Son Who Remembers" }
      text:
        de: Ezekiel Moss spricht Jacobs Namen nicht mehr aus. Sein Sohn Daniel studiert in Hallstead die Rechte.
        en: Ezekiel Moss no longer says Jacob's name. His son Daniel is studying law in Hallstead.
    - id: freund
      any: [moss_fair]
      title: { de: "Ein Nachbar", en: "A Neighbour" }
      text:
        de: Die Moss-Farm steht noch. Ezekiel schickt zu Weihnachten Honig, und Daniel schreibt aus Hallstead Briefe.
        en: The Moss farm still stands. Ezekiel sends honey at Christmas, and Daniel writes letters from Hallstead.
    - id: verloren
      any: [moss_verloren]
      title: { de: "Fortgezogen", en: "Moved Away" }
      text:
        de: Die Bank hat die Moss-Farm verkauft. Die Familie lebt jetzt bei Verwandten im Osten – niemand weiß genau, wo.
        en: The bank sold the Moss farm. The family now lives with relatives in the East – nobody knows exactly where.
  open:
    title: { de: "Noch offen", en: "Still Open" }
    text:
      de: Ezekiel Moss bestellt sein Land und hofft auf einen guten Winter.
      en: Ezekiel Moss works his land and hopes for a good winter.

# ---------------------------------------------------------------------------
# Kapitel 2 „Der Herausforderer“ (4.12): Die Bögen aus content/events/k2-story-*.yaml und die
# Nachfolge im Crane Trust (Merkzeichen setzt die Diplomatie, src/sim/diplomacyCore.ts).
# Der Kapitelabschluss zeigt nur die Bögen des Kapitels (src/sim/arcs.ts, ARC_CHAPTER).

nora_k2:
  draft: true
  name: { de: "Nora Whitlock", en: "Nora Whitlock" }
  outcomes:
    - id: verbuendet
      any: [nora_verbuendet]
      title: { de: "Eine ehrliche Quelle", en: "An Honest Source" }
      text:
        de: Nora hält Jacob für einen der wenigen in Cordova, der ihr nicht ins Gesicht lügt. Ihre Serie über den Trust trägt seine Zahlen.
        en: Nora thinks Jacob is one of the few in Cordova who doesn't lie to her face. Her series on the Trust carries his figures.
    - id: gekauft
      any: [ledger_gekauft]
      title: { de: "Die Zeitung gekauft", en: "The Paper Bought" }
      text:
        de: Jacob hat den Hallstead Ledger gekauft. Nora schreibt jetzt für eine andere Zeitung – und sie hat ein gutes Gedächtnis.
        en: Jacob bought the Hallstead Ledger. Nora now writes for another paper – and she has a good memory.
    - id: feindin
      any: [nora_feindin]
      title: { de: "Teil fünf: Harlan Oil", en: "Part Five: Harlan Oil" }
      text:
        de: Noras Serie über den Trust hat einen fünften Teil bekommen. Er handelt von Jacob Harlan.
        en: Nora's series on the Trust has gained a fifth part. It is about Jacob Harlan.
    - id: ohne
      any: [nora_ohne_jacob]
      title: { de: "Ohne ihn geschrieben", en: "Written Without Him" }
      text:
        de: Nora hat ihre Serie ohne Jacob geschrieben. Sein Name steht nur einmal darin, in einer Liste.
        en: Nora wrote her series without Jacob. His name appears only once, in a list.
    - id: quelle
      any: [nora_quelle, nora_interview_k2]
      title: { de: "Eine Quelle unter vielen", en: "One Source Among Many" }
      text:
        de: Jacob hat Nora geholfen, so weit es ihm nützte. Sie bedankt sich höflich und prüft jede seiner Zahlen zweimal.
        en: Jacob helped Nora as far as it suited him. She thanks him politely and checks every one of his figures twice.
  open:
    title: { de: "Noch offen", en: "Still Open" }
    text:
      de: Nora Whitlock schreibt noch an ihrer Serie über den Crane Trust.
      en: Nora Whitlock is still writing her series on the Crane Trust.

silas_k2:
  draft: true
  name: { de: "Silas Brandt", en: "Silas Brandt" }
  outcomes:
    - id: gewarnt
      any: [silas_k2_gewarnt]
      title: { de: "Der Mann, der zählte", en: "The Man Who Counted" }
      text:
        de: Silas hat die Strohmänner vor allen anderen gesehen. Im Rat hört man jetzt zu, wenn der Alte mit den acht Fingern redet.
        en: Silas spotted the straw men before anyone else. On the board they listen now when the old man with eight fingers speaks.
    - id: geschuetzt
      any: [silas_geschuetzt]
      title: { de: "Gehalten", en: "Stood By" }
      text:
        de: Jacob hat Silas gegen den Aufsichtsrat gehalten. Pettibone hat es nicht vergessen – Silas auch nicht.
        en: Jacob stood by Silas against the board. Pettibone hasn't forgotten – nor has Silas.
    - id: recht
      any: [silas_k2_recht_gegeben]
      title: { de: "Er hatte recht", en: "He Was Right" }
      text:
        de: Silas hatte recht mit den Vollmachten, und Jacob hat es zugegeben. Das war mehr wert als der Sitz.
        en: Silas was right about the proxies, and Jacob admitted it. That was worth more than the seat.
    - id: geopfert
      any: [silas_k2_geopfert]
      title: { de: "Der Schuldige", en: "The Scapegoat" }
      text:
        de: Der Rat brauchte einen Schuldigen für den Toten an Turm vier, und Jacob hat ihm Silas gegeben. Silas trinkt jetzt nicht mehr nur sonntags.
        en: The board needed someone to blame for the dead man at rig four, and Jacob gave them Silas. Silas no longer drinks only on Sundays.
    - id: ausgezahlt
      any: [silas_k2_ausgezahlt, silas_quellen_gekauft]
      title: { de: "Ausgezahlt", en: "Bought Out" }
      text:
        de: Jacob hat Silas seinen Anteil abgekauft. Silas hat jetzt Geld und keinen Turm mehr – und weiß nicht recht, was er damit soll.
        en: Jacob bought out Silas's share. Silas has money now and no rig – and doesn't quite know what to do with either.
    - id: kunde
      any: [silas_tarif_fair, silas_tarif_voll]
      title: { de: "Ein Kunde", en: "A Customer" }
      text:
        de: Silas schickt sein Öl durch Jacobs Leitung und zahlt dafür. Sie reden über Tarife, nicht über früher.
        en: Silas sends his oil through Jacob's line and pays for it. They talk about rates, not about the old days.
    - id: nachgezahlt
      any: [silas_k2_nachgezahlt]
      title: { de: "Spät nachgezahlt", en: "Paid at Last" }
      text:
        de: Jacob hat Silas nachgezahlt, was ihm zustand – zehn Jahre zu spät, aber vor Zeugen.
        en: Jacob paid Silas what he was owed – ten years late, but in front of witnesses.
    - id: gekauft
      any: [silas_schweigegeld]
      title: { de: "Schweigegeld", en: "Hush Money" }
      text:
        de: Silas hat Geld genommen und schweigt. Im Schattenbuch steht jetzt sein Name.
        en: Silas took money and keeps quiet. His name is now in the shadow book.
    - id: hinaus
      any: [silas_k2_hinausgeworfen]
      title: { de: "Hinausgeworfen", en: "Thrown Out" }
      text:
        de: Jacob hat Silas aus der Hauptversammlung werfen lassen. Der Saloon erzählt die Geschichte jeden Abend, jedes Mal ein bisschen schlimmer.
        en: Jacob had Silas thrown out of the shareholders' meeting. The saloon tells the story every night, a little worse each time.
  open:
    title: { de: "Noch offen", en: "Still Open" }
    text:
      de: Silas und die Herren vom Aufsichtsrat sind noch nicht miteinander fertig.
      en: Silas and the gentlemen of the board are not done with each other yet.

ruth_k2:
  draft: true
  name: { de: "Ruth Harlan", en: "Ruth Harlan" }
  outcomes:
    - id: partnerin
      any: [ruth_rat_behauptet]
      title: { de: "Eine Stimme im Rat", en: "A Voice on the Board" }
      text:
        de: Ruth sitzt im Aufsichtsrat, und wenn sie redet, schreiben die Herren mit. Vandermeer ist wiedergekommen.
        en: Ruth sits on the board, and when she speaks the gentlemen take notes. Vandermeer came back.
    - id: finanzen
      any: [ruth_finanzen]
      title: { de: "Die Bücher", en: "The Books" }
      text:
        de: Ruth führt die Finanzen von Harlan Oil, mit Titel und eigenem Schreibtisch. Die Bank fragt jetzt nach ihr, nicht nach Jacob.
        en: Ruth runs Harlan Oil's finances, with a title and a desk of her own. The bank asks for her now, not for Jacob.
    - id: still
      any: [ruth_rat_stumm]
      title: { de: "Ein Stuhl im Rat", en: "A Chair on the Board" }
      text:
        de: Ruth sitzt im Rat und schweigt. Jacob hat sie einmal nicht verteidigt; sie hat es sich gemerkt.
        en: Ruth sits on the board and keeps silent. Once Jacob didn't defend her; she remembered.
    - id: eigenes
      any: [ruth_eigenes_geschaeft]
      title: { de: "Harlan & Schwester", en: "Harlan & Sister" }
      text:
        de: Ruth und Hannah haben einen Laden am Bahnhof Salt Hill. Über der Tür steht Harlan – gemeint ist nicht Jacob.
        en: Ruth and Hannah have a shop by Salt Hill station. Above the door it says Harlan – and it doesn't mean Jacob.
    - id: verboten
      any: [ruth_verboten]
      title: { de: "Verhindert", en: "Prevented" }
      text:
        de: Jacob hat Ruths eigenes Geschäft verhindert. Die Bauplätze am Bahnhof gehören jetzt anderen. Ruth redet nicht mehr davon.
        en: Jacob stopped Ruth's own business. The lots by the station belong to others now. Ruth no longer speaks of it.
    - id: zuhause
      any: [ruth_zuhause, ruth_vertroestet_k2]
      title: { de: "Wieder vertröstet", en: "Put Off Again" }
      text:
        de: Ruth wartet – wieder. Die Kiste mit ihren Notizen steht jetzt auf dem Dachboden.
        en: Ruth waits – again. The box with her notes is up in the attic now.
  open:
    title: { de: "Noch offen", en: "Still Open" }
    text:
      de: Ruth hat ihre Frage noch nicht gestellt – oder Jacob hat sie noch nicht beantwortet.
      en: Ruth hasn't asked her question yet – or Jacob hasn't answered it.

crane_k2:
  draft: true
  name: { de: "Der Crane Trust", en: "The Crane Trust" }
  outcomes:
    - id: zerschlagen
      any: [k2_trust_zerschlagen]
      title: { de: "Zerschlagen", en: "Broken Up" }
      text:
        de: Der Staat hat den Crane Trust zerschlagen. Crane Eastern und Crane Midland bieten jetzt gegeneinander – und um Jacobs Öl.
        en: The state has broken up the Crane Trust. Crane Eastern and Crane Midland now bid against each other – and for Jacob's oil.
    - id: margaret
      any: [k2_nachfolge_margaret]
      title: { de: "Margaret Crane", en: "Margaret Crane" }
      text:
        de: Margaret Crane hat den Aufsichtsrat ihres Vaters gewonnen. Sie belohnt ihre Partner – und vergisst ihre Gegner nicht.
        en: Margaret Crane won her father's board. She rewards her partners – and doesn't forget her opponents.
    - id: pruett
      any: [k2_nachfolge_pruett]
      title: { de: "Harold Pruett", en: "Harold Pruett" }
      text:
        de: Harold Pruett führt den Trust. Er kürzt allen den Preis und kauft in jeder Krise auf, was billig zu haben ist.
        en: Harold Pruett runs the Trust. He cuts everyone's price and buys up whatever is cheap in every crisis.
  open:
    title: { de: "Noch nicht entschieden", en: "Not Yet Decided" }
    text:
      de: Margaret Crane und Harold Pruett ringen noch um den Trust.
      en: Margaret Crane and Harold Pruett are still fighting over the Trust.

# --- Kapitel 3 (4.19): content/events/k3-story-*.yaml und das Konsortium (4.17) ---

daniel_k3:
  draft: true
  name: { de: "Daniel Moss", en: "Daniel Moss" }
  outcomes:
    - id: anklage
      any: [daniel_anklage]
      title: { de: "Die Anklage", en: "The Indictment" }
      text:
        de: Daniel Moss hat Anklage gegen Jacob Harlan erhoben. Der Prozess wird Kapitel 4 überschatten.
        en: Daniel Moss has indicted Jacob Harlan. The trial will overshadow chapter 4.
    - id: bestechung
      any: [daniel_bestechung_versuch]
      title: { de: "Ein Umschlag zu viel", en: "One Envelope Too Many" }
      text:
        de: Jacob hat versucht, den Staatsanwalt zu kaufen. Daniel hat den Umschlag aufbewahrt – mit Datum.
        en: Jacob tried to buy the prosecutor. Daniel kept the envelope – with the date on it.
    - id: beugehaft
      any: [daniel_beugehaft]
      title: { de: "Beugehaft", en: "Held in Contempt" }
      text:
        de: Jacob hat die Vorladung missachtet und ein paar Nächte im Bezirksgefängnis verbracht. Angeklagt ist er nicht – vergessen hat es niemand.
        en: Jacob ignored the subpoena and spent a few nights in the county jail. He has not been charged – nobody has forgotten.
    - id: verbuendet
      any: [daniel_verbuendet]
      title: { de: "Gegen Thorne", en: "Against Thorne" }
      text:
        de: Daniel Moss und Jacob Harlan stehen auf derselben Seite – gegen Thorne. Keiner von beiden hätte das vor zwanzig Jahren geglaubt.
        en: Daniel Moss and Jacob Harlan stand on the same side – against Thorne. Neither would have believed it twenty years ago.
    - id: entlastet
      any: [daniel_entlastet]
      title: { de: "Entlastet", en: "Cleared" }
      text:
        de: Die Bücher haben Jacob entlastet. Daniel hat die Akte geschlossen und ihm die Hand gegeben – kurz.
        en: The books cleared Jacob. Daniel closed the file and shook his hand – briefly.
    - id: vergleich
      any: [daniel_vergleich, daniel_unfallkasse, moss_land_zurueck]
      title: { de: "Ein Vergleich", en: "A Settlement" }
      text:
        de: Jacob hat gezahlt oder zurückgegeben, was er nahm. Daniel hat es angenommen. Freunde sind sie nicht.
        en: Jacob paid or gave back what he took. Daniel accepted it. They are not friends.
    - id: weggelobt
      any: [daniel_weggelobt]
      title: { de: "Ins Richteramt gelobt", en: "Kicked Upstairs" }
      text:
        de: Daniel Moss ist jetzt Richter in Hallstead. Ein gutes Amt, weit weg von Cordova – und er weiß, wem er es verdankt.
        en: Daniel Moss is now a judge in Hallstead. A fine post, far from Cordova – and he knows whom he owes it to.
    - id: zeuge
      any: [daniel_zeuge_thorne, daniel_thorne_gedeckt]
      title: { de: "Der Zeuge", en: "The Witness" }
      text:
        de: Daniel brauchte Jacob als Zeugen gegen Thorne. Was Jacob gesagt – oder verschwiegen – hat, steht im Protokoll.
        en: Daniel needed Jacob as a witness against Thorne. What Jacob said – or kept quiet about – is in the record.
    - id: vertagt
      any: [daniel_vertagt]
      title: { de: "Vertagt", en: "Adjourned" }
      text:
        de: Ein ärztliches Attest hat die Sache vertagt. Daniel Moss wartet. Er ist jünger als Jacob.
        en: A doctor's note has adjourned the matter. Daniel Moss waits. He is younger than Jacob.
  open:
    title: { de: "Die Akte ist offen", en: "The File Is Open" }
    text:
      de: Daniel Moss sitzt im Amt des Bezirksstaatsanwalts. Was er über Jacob weiß, hat er noch nicht gesagt.
      en: Daniel Moss holds the district attorney's office. What he knows about Jacob, he has not said yet.

thomas_k3:
  draft: true
  name: { de: "Thomas Harlan", en: "Thomas Harlan" }
  outcomes:
    - id: bruch
      any: [thomas_bruch]
      title: { de: "Der Bruch", en: "The Break" }
      text:
        de: Thomas ist gegangen – mit eigenen Plänen und ohne den Namen seines Vaters über der Tür. Ein Rivale mehr.
        en: Thomas has left – with plans of his own and without his father's name over the door. One more rival.
    - id: versoehnt
      any: [thomas_versoehnt_k3]
      title: { de: "Versöhnt", en: "Reconciled" }
      text:
        de: Vater und Sohn haben sich ausgesprochen, spät in der Nacht, im Büro. Thomas bleibt.
        en: Father and son have talked it out, late at night, in the office. Thomas stays.
    - id: teilhaber
      any: [thomas_teilhaber]
      title: { de: "Teilhaber", en: "Partner" }
      text:
        de: Thomas hält Anteile und redet im Rat mit. Die alten Herren hören ihm zu, weil sie müssen.
        en: Thomas holds shares and speaks on the board. The old gentlemen listen because they have to.
    - id: abteilung
      any: [thomas_abteilung]
      title: { de: "Eine eigene Abteilung", en: "A Department of His Own" }
      text:
        de: Thomas leitet die Marke – Plakate, Straßenkarten, Tankstellen. Jacob nennt es Spielerei und liest jeden Bericht.
        en: Thomas runs the brand – posters, road maps, filling stations. Jacob calls it child's play and reads every report.
    - id: gezwungen
      any: [thomas_gezwungen]
      title: { de: "Gezwungen", en: "Forced" }
      text:
        de: Thomas arbeitet in der Firma, weil sein Vater es befohlen hat. Er tut, was man ihm sagt. Noch.
        en: Thomas works for the company because his father ordered it. He does what he is told. For now.
    - id: eigener_weg
      any: [thomas_eigener_weg]
      title: { de: "Sein eigener Weg", en: "His Own Way" }
      text:
        de: Thomas arbeitet für Crane Eastern. Margaret Crane schätzt ihn – und weiß, wessen Sohn er ist.
        en: Thomas works for Crane Eastern. Margaret Crane values him – and knows whose son he is.
    - id: feld
      any: [thomas_feld]
      title: { de: "Auf dem Bohrturm", en: "On the Derrick" }
      text:
        de: Thomas hat auf den Feldern angefangen, mit Schwielen statt Titel. Die Bohrleute nennen ihn beim Vornamen.
        en: Thomas started out in the fields, with calluses instead of a title. The drillers call him by his first name.
    - id: firma
      any: [thomas_firma]
      title: { de: "In der Firma", en: "In the Company" }
      text:
        de: Thomas sitzt im Büro neben seinem Vater, mit Titel. Der Rat misstraut ihm, die Kunden mögen ihn.
        en: Thomas sits in the office next to his father, with a title. The board distrusts him, the customers like him.
  open:
    title: { de: "Noch unentschieden", en: "Still Undecided" }
    text:
      de: Thomas ist zurück und wartet darauf, dass sein Vater sagt, was er von ihm will.
      en: Thomas is back and waiting for his father to say what he wants of him.

ruth_k3:
  draft: true
  name: { de: "Ruth Harlan", en: "Ruth Harlan" }
  outcomes:
    - id: partner
      any: [ehe_partner]
      title: { de: "Partner", en: "Partners" }
      text:
        de: Ruth und Jacob entscheiden wieder gemeinsam. Hallstead hat es bemerkt; Vandermeer fragt jetzt beide.
        en: Ruth and Jacob decide together again. Hallstead has noticed; Vandermeer now asks them both.
    - id: waffenstillstand
      any: [ehe_waffenstillstand]
      title: { de: "Waffenstillstand", en: "Truce" }
      text:
        de: Ruth bleibt. Sie haben Regeln, die keiner aufgeschrieben hat, und halten sich beide daran.
        en: Ruth stays. They have rules nobody wrote down, and both of them keep to them.
    - id: trennung
      any: [ehe_trennung]
      title: { de: "Getrennt", en: "Separated" }
      text:
        de: Ruth ist ausgezogen, in das Haus ihrer Schwester. Sie hat nichts mitgenommen außer ihren Büchern.
        en: Ruth has moved out, to her sister's house. She took nothing with her except her ledgers.
  open:
    title: { de: "Noch nicht gesagt", en: "Not Yet Said" }
    text:
      de: Ruth hat noch nicht entschieden, ob sie bleibt. Jacob hat noch nicht gefragt.
      en: Ruth hasn't decided yet whether she will stay. Jacob hasn't asked yet.

vale_k3:
  draft: true
  name: { de: "Mr. Vale", en: "Mr. Vale" }
  outcomes:
    - id: verstossen
      any: [k3_konsortium_verstossen]
      title: { de: "Hinausgeworfen", en: "Thrown Out" }
      text:
        de: Das Konsortium hat Jacob hinausgeworfen. Mr. Vale lässt ausrichten, er bedaure es. Die Preise für Harlans Öl fallen seitdem auffällig oft.
        en: The consortium has thrown Jacob out. Mr. Vale sends word that he regrets it. Harlan's oil prices have fallen remarkably often since.
    - id: doppelspiel
      any: [k3_konsortium_doppelspiel]
      title: { de: "Doppelspiel", en: "Double Game" }
      text:
        de: Jacob sitzt im Konsortium und arbeitet zugleich dagegen. Bisher hat Mr. Vale es nicht bemerkt – oder er wartet.
        en: Jacob sits in the consortium and works against it at the same time. So far Mr. Vale hasn't noticed – or he is waiting.
    - id: mitglied
      any: [k3_konsortium_mitglied]
      title: { de: "Am Tisch", en: "At the Table" }
      text:
        de: Jacob Harlan sitzt jetzt am Tisch auf dem Schloss in Aldmark. Mr. Vale nennt es „wie es ist“.
        en: Jacob Harlan now sits at the table in the castle in Aldmark. Mr. Vale calls it “the way things are”.
    - id: abgelehnt
      any: [k3_konsortium_abgelehnt]
      title: { de: "Abgelehnt", en: "Declined" }
      text:
        de: Jacob hat Mr. Vales Einladung abgelehnt. Vale war höflich. Er ist immer höflich.
        en: Jacob declined Mr. Vale's invitation. Vale was polite. He is always polite.
    - id: zugesagt
      any: [vale_k3_zugesagt]
      title: { de: "Die Reise ist gebucht", en: "The Journey Is Booked" }
      text:
        de: Jacob hat auf Vales Karte geantwortet. Die Einladung aufs Schloss steht noch aus.
        en: Jacob answered Vale's card. The invitation to the castle is still to come.
    - id: abgesagt
      any: [vale_k3_abgesagt]
      title: { de: "Eine Absage", en: "A Refusal" }
      text:
        de: Jacob hat Vales Karte mit einer Absage beantwortet. Vale hat sie aufbewahrt.
        en: Jacob answered Vale's card with a refusal. Vale kept it.
  open:
    title: { de: "Keine Karte", en: "No Card" }
    text:
      de: Mr. Vale hat sich noch nicht gemeldet – oder Jacob hat noch nicht geantwortet.
      en: Mr. Vale hasn't been in touch yet – or Jacob hasn't answered.

