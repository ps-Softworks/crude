# Zeitung (2.6, GDD §7.2): Schlagzeilen zu Beginn jeder Runde.
# Die Simulation sucht aus dem Spielzustand aus, WELCHE Schlagzeile erscheint;
# hier steht nur, wie sie klingt. Jeder Text mit Sprachschlüssel de/en
# (Englisch darf leer bleiben, dann erscheint Deutsch).
# Regel aus dem GDD: keine Zahlen – die Zeitung deutet an, sie rechnet nicht vor.
# ENTWURF: Texte und der Name der Zeitung sind Vorschläge.

name:
  de: Port Ellis Courier
  en: Port Ellis Courier

headlines:
  # --- Etappe 2: Preis-Aktionen (Termine als Hauptwerkzeug) ---
  # Jacobs Gerücht „Quellen versiegen“ hat gewirkt.
  rumour_dry:
    title:
      de: Versiegen die Quellen am Salt Hill?
      en: Are the Salt Hill wells running dry?
    text:
      de: Man hört von Brunnen, die plötzlich nur noch Wasser geben. Die Händler kaufen, solange es noch etwas zu kaufen gibt.
      en: There is talk of wells that suddenly give nothing but water. The traders are buying while there is still something to buy.
  # Jacobs Gerücht „Riesenfund bei Bullard“ hat gewirkt.
  rumour_bullard:
    title:
      de: Riesenfund bei Bullard?
      en: A giant strike at Bullard's?
    text:
      de: Im Saloon schwört einer, er habe bei Bullard eine Fontäne über den Turm schießen sehen. Die Farmer werden kleinlaut, die Käufer warten ab.
      en: In the saloon a man swears he saw a gusher shoot over Bullard's derrick. The farmers grow quiet, the buyers wait.
  # Ein Gerücht ist aufgeflogen.
  rumour_exposed:
    title:
      de: Wer streut die Gerüchte am Salt Hill?
      en: Who is spreading the Salt Hill rumours?
    text:
      de: Nora Whitlock hat nachgefragt und weiß jetzt, woher die Geschichten kamen. Ein Ölmann aus Port Ellis steht schlecht da – und ein Zeilenschinder des Courier ist seine Stelle los.
      en: Nora Whitlock has asked around and now knows where the stories came from. An oilman from Port Ellis looks bad – and a Courier hack has lost his job.
  # Jacobs Förderbremse ist geplatzt.
  cartel_collapse:
    title:
      de: Absprache der Wildcatter geplatzt
      en: Wildcatters' agreement collapses
    text:
      de: Wochenlang drosselten die kleinen Firmen am Salt Hill ihre Pumpen. Jetzt fördert jeder, was er kann, und die Tanks am Hafen laufen voll.
      en: For weeks the small outfits at Salt Hill throttled their pumps. Now everyone pumps what he can, and the harbour tanks are filling up.
  # Kartellverfahren gegen Jacobs Förderbremse.
  cartel_court:
    title:
      de: Staatsanwalt geht gegen Preisabsprache vor
      en: Prosecutor moves against price fixing
    text:
      de: Nach dem neuen Kartellgesetz hat Hallstead die erste Absprache am Salt Hill aufgelöst. Der Organisator muss zahlen.
      en: Under the new antitrust act Hallstead has broken up the first agreement at Salt Hill. The organiser has to pay.
  # --- Titelseite: Aussicht für den Ölpreis (Frühwarnzeichen) ---
  # Der Preis wird am Ende dieser Runde fallen – und zwar stark.
  outlook_crash:
    title:
      de: Tanks in Port Ellis laufen über
      en: Port Ellis tanks are overflowing
    text:
      de: Am Hafen stapeln sich die Fässer, die Händler winken ab. Wer jetzt noch Öl im Tank hat, sollte schnell verkaufen – der Trust wird den Preis kräftig drücken.
      en: Barrels are piling up at the harbour and the traders wave them away. Anyone still holding oil had better sell quickly – the Trust will push the price down hard.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Fässer bis an die Kaimauer"
          en: "Barrels up to the quay wall"
        text:
          de: "Die Schuten liegen voll, die Lagerhalter nehmen nichts mehr an. Wer noch Öl hat, sollte es loswerden, ehe der Trust den Preis in den Keller schickt."
          en: "The barges lie full and the storage men take nothing more. Whoever still has oil had better be rid of it before the Trust sends the price into the cellar."
      - title:
          de: "Öl in Strömen, Käufer auf der Flucht"
          en: "Oil in floods, buyers in flight"
        text:
          de: "Am Hafen weiß niemand mehr wohin mit dem Öl. In den Kontoren des Trusts wird schon ein neuer, viel niedrigerer Preis ausgehängt."
          en: "At the harbour no one knows where to put the oil any more. In the Trust's offices a new, much lower price is already being posted."
      - title:
          de: "Schwarze Flut in Port Ellis"
          en: "Black flood in Port Ellis"
        text:
          de: "Selbst die Fischer klagen über Ölfässer auf ihren Stegen. Die Händler bieten kaum noch etwas – es wird ein harter Fall."
          en: "Even the fishermen complain of oil barrels on their jetties. The traders hardly bid at all – it will be a hard fall."
  # Der Preis wird am Ende dieser Runde spürbar fallen.
  outlook_fall:
    title:
      de: Volle Tanks am Hafen
      en: Full tanks at the harbour
    text:
      de: Die Lagerhalter in Port Ellis klagen über Platzmangel. In den Kontoren des Trusts spricht man schon von einem niedrigeren Posted Price.
      en: The storage men in Port Ellis complain about a lack of space. In the Trust's offices there is already talk of a lower posted price.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Lagerhalter winken ab"
          en: "Storage men wave buyers off"
        text:
          de: "In Port Ellis wird der Platz knapp, und die Käufer lassen sich Zeit. Man rechnet in den Kontoren mit einem schwächeren Posted Price."
          en: "Space is getting tight in Port Ellis and the buyers take their time. In the offices a weaker posted price is expected."
      - title:
          de: "Zu viel Öl, zu wenig Fässer"
          en: "Too much oil, too few barrels"
        text:
          de: "Die Böttcher kommen mit dem Fassmachen nicht nach, die Tanks am Hafen füllen sich. Der Trust wird wohl nachgeben – nach unten."
          en: "The coopers cannot keep up with the barrels and the harbour tanks are filling. The Trust will likely give way – downwards."
      - title:
          de: "Händler werden wählerisch"
          en: "Traders turn choosy"
        text:
          de: "Am Kai wird um jedes Fass gefeilscht. Wer verkaufen will, sollte nicht zu lange warten."
          en: "On the quay every barrel is haggled over. Anyone who wants to sell should not wait too long."
  # Der Preis wird am Ende dieser Runde spürbar steigen.
  outlook_rise:
    title:
      de: Leere Tanks, ungeduldige Käufer
      en: Empty tanks, impatient buyers
    text:
      de: Die Raffinerien rufen nach Öl, doch am Salt Hill kommt weniger an als erwartet. Die Händler rechnen mit besseren Preisen.
      en: The refineries are calling for oil, but less is arriving from Salt Hill than expected. Traders expect better prices.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Raffinerien rufen nach Öl"
          en: "Refineries clamour for oil"
        text:
          de: "Aus dem Norden kommen Telegramme: mehr Öl, und zwar bald. Am Hafen stehen die Tanks halb leer."
          en: "Telegrams are coming from the north: more oil, and soon. At the harbour the tanks stand half empty."
      - title:
          de: "Käufer drängeln am Kai"
          en: "Buyers jostle on the quay"
        text:
          de: "Kaum ist ein Fuhrwerk entladen, ist das Öl schon verkauft. Die Händler sprechen offen von einem besseren Preis."
          en: "No sooner is a wagon unloaded than the oil is sold. The traders speak openly of a better price."
      - title:
          de: "Leere Fässer am Hafen"
          en: "Empty barrels at the harbour"
        text:
          de: "Die Böttcher haben Fässer übrig, die Lagerhalter nichts zu tun. Wer jetzt Öl bringt, wird gut bezahlt werden."
          en: "The coopers have barrels to spare and the storage men nothing to do. Whoever brings oil now will be paid well."
  # Keine große Bewegung in Sicht.
  outlook_steady:
    title:
      de: Ruhiger Handel am Salt Hill
      en: Quiet trading at Salt Hill
    text:
      de: Fässer kommen, Fässer gehen. Die Händler am Hafen sehen keinen Grund zur Aufregung.
      en: Barrels come, barrels go. The traders at the harbour see no reason for excitement.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Gewohnter Gang am Hafen"
          en: "Business as usual at the harbour"
        text:
          de: "Die Fuhrwerke rollen, die Händler zahlen, was sie letzte Woche zahlten. Niemand erwartet eine Überraschung."
          en: "The wagons roll, the traders pay what they paid last week. No one expects a surprise."
      - title:
          de: "Stille Woche im Ölgeschäft"
          en: "A quiet week in the oil trade"
        text:
          de: "In den Kontoren wird mehr über das Wetter gesprochen als über den Preis. Angebot und Nachfrage halten sich die Waage."
          en: "In the offices there is more talk of the weather than of the price. Supply and demand are in balance."
      - title:
          de: "Nichts Neues vom Posted Price"
          en: "Nothing new on the posted price"
        text:
          de: "Die Tanks sind weder voll noch leer. Die Händler am Kai sehen keinen Grund, ihre Preise zu ändern."
          en: "The tanks are neither full nor empty. The traders on the quay see no reason to change their prices."

  # --- Kurzmeldungen: was in der letzten Runde geschah ---
  price_cut:
    title:
      de: Trust senkt den Posted Price
      en: Trust cuts the posted price
    text:
      de: Der Crane Trust zahlt weniger je Barrel. Kleine Bohrfirmen rechnen nach.
      en: The Crane Trust pays less per barrel. Small drillers are doing their sums.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Weniger Geld je Barrel"
          en: "Less money per barrel"
        text:
          de: "Der Trust hat den Posted Price gesenkt. In den Bohrcamps wird der Gürtel enger geschnallt."
          en: "The Trust has lowered the posted price. In the drilling camps belts are being tightened."
      - title:
          de: "Trust dreht an der Schraube"
          en: "Trust turns the screw"
        text:
          de: "Ein neuer Aushang im Kontor des Crane Trust – und der Preis darauf ist niedriger als zuvor. Die Förderer murren."
          en: "A new notice in the Crane Trust's office – and the price on it is lower than before. The producers grumble."
      - title:
          de: "Schlechte Nachricht für die Förderer"
          en: "Bad news for the producers"
        text:
          de: "Der Crane Trust zahlt weniger für das Öl. Wer Schulden hat, rechnet jetzt zweimal."
          en: "The Crane Trust is paying less for oil. Anyone with debts now does his sums twice."
  price_raise:
    title:
      de: Trust zahlt mehr
      en: Trust pays more
    text:
      de: Der Crane Trust hebt den Posted Price an – das Öl am Salt Hill ist gefragt.
      en: The Crane Trust raises the posted price – Salt Hill oil is in demand.
    # 0.4.20+9: weitere Fassungen – die Zeitung wiederholt sich nicht Runde für Runde.
    variants:
      - title:
          de: "Mehr Geld je Barrel"
          en: "More money per barrel"
        text:
          de: "Der Trust hat den Posted Price angehoben. In den Saloons am Salt Hill wird eine Runde ausgegeben."
          en: "The Trust has raised the posted price. In the Salt Hill saloons a round is being stood."
      - title:
          de: "Gute Woche für die Förderer"
          en: "A good week for the producers"
        text:
          de: "Der Crane Trust zahlt mehr – das Öl ist gefragt wie lange nicht. Die Bohrmannschaften bekommen ihren Lohn pünktlich."
          en: "The Crane Trust is paying more – oil is wanted as it has not been for a long time. The drilling crews get their wages on time."
      - title:
          de: "Der Preis zieht an"
          en: "The price climbs"
        text:
          de: "Ein neuer Aushang im Kontor des Trusts, und diesmal lächeln die Förderer. Wer Öl im Tank hat, freut sich."
          en: "A new notice in the Trust's office, and this time the producers smile. Whoever has oil in the tank is glad of it."
  # 2.8: Der Crane Trust zahlt den Unabhängigen ab dieser Runde weniger (Jacob hat den Abschlag hingenommen).
  crane_cut:
    title:
      de: Trust drückt die Unabhängigen
      en: Trust squeezes the independents
    text:
      de: Der Crane Trust zahlt kleinen Produzenten weniger als den Posted Price. In den Saloons am Salt Hill wird geflucht.
      en: The Crane Trust pays small producers less than the posted price. In the Salt Hill saloons, men are cursing.
  rival_find:
    title:
      de: Bullard stößt auf Öl
      en: Bullard strikes oil
    text:
      de: '„Big" Jim Bullard feiert einen neuen Fund. Seine Fuhrwerke rollen bald zum Hafen.'
      en: '"Big" Jim Bullard celebrates a new strike. His wagons will soon be rolling to the harbour.'
  jacob_gusher:
    title:
      de: Gusher! Neuling trifft ins Schwarze
      en: Gusher! Newcomer hits the jackpot
    text:
      de: Eine Ölfontäne über dem Bohrturm von Jacob Harlan – ganz Port Ellis spricht davon.
      en: A fountain of oil above Jacob Harlan's derrick – all of Port Ellis is talking about it.
  jacob_find:
    title:
      de: Harlan findet Öl
      en: Harlan finds oil
    text:
      de: Der Neuling Jacob Harlan hat eine fündige Quelle. Die alten Hasen am Salt Hill horchen auf.
      en: The newcomer Jacob Harlan has a producing well. The old hands at Salt Hill take notice.
  # Lückenfüller, wenn sonst nichts passiert ist.
  classifieds:
    title:
      de: Kleinanzeigen
      en: Classifieds
    text:
      de: Gebrauchter Bohrturm zu verkaufen, kaum benutzt. Zimmer frei in der Front Street, nur an ordentliche Herren.
      en: Used derrick for sale, hardly used. Room to let on Front Street, respectable gentlemen only.

  # --- 0.4.20+9: Fernleitung (4.7) – fertig oder gesprengt (aus den Briefen der letzten Runde) ---
  pipeline_built:
    title:
      de: Harlans Fernleitung fließt
      en: Harlan's trunk line is flowing
    text:
      de: Das letzte Rohr ist verschraubt, das Öl läuft ohne Fuhrwerk und ohne Bahn. In Thornes Frachtbüro sieht man lange Gesichter.
      en: The last pipe is bolted on, and the oil runs without wagon or railway. In Thorne's freight office the faces are long.
  pipeline_damaged:
    title:
      de: Anschlag auf die Fernleitung
      en: Attack on the trunk line
    text:
      de: In der Nacht hat es an Harlans Leitung gekracht, Öl versickert im Gras. Der Sheriff sucht die Täter – wer sie bezahlt hat, fragt man sich in Port Ellis leise.
      en: In the night there was a blast on Harlan's line, and oil is seeping into the grass. The sheriff is looking for the culprits – who paid them is asked quietly in Port Ellis.

  # --- 0.4.20+9: Bundesanwalt Delaney (4.11) – neue Stufe der Ermittlung oder ihr Ausgang ---
  delaney_rumor:
    title:
      de: Fragen über einen Ölmann
      en: Questions about an oilman
    text:
      de: In Cordova erzählt man sich Geschichten über Harlans frühe Jahre am Salt Hill. Bundesanwalt Delaney soll zugehört haben.
      en: In Cordova people are telling stories about Harlan's early years at Salt Hill. Federal prosecutor Delaney is said to have listened.
  delaney_probe:
    title:
      de: Bundesanwalt ermittelt gegen Harlan
      en: Federal prosecutor investigates Harlan
    text:
      de: Delaney hat eine Vorermittlung eröffnet. Seine Leute befragen Farmer, Bohrmeister und alte Pächter – und sie schreiben alles auf.
      en: Delaney has opened a preliminary inquiry. His men are questioning farmers, drillers and old leaseholders – and they write everything down.
  delaney_charge:
    title:
      de: Anklage gegen Jacob Harlan
      en: Jacob Harlan indicted
    text:
      de: Das Bundesgericht in Cordova hat die Anklage zugelassen. Die Geschworenen werden gelost, die Anwälte wetzen die Federn.
      en: The federal court in Cordova has admitted the indictment. The jurors are being drawn and the lawyers are sharpening their pens.
  delaney_dropped:
    title:
      de: Delaney legt die Akte Harlan beiseite
      en: Delaney shelves the Harlan file
    text:
      de: Zu wenig Beweise, sagt man im Gerichtsgebäude. Harlans Freunde atmen auf – Delaney, heißt es, vergisst nichts.
      en: Too little evidence, they say at the courthouse. Harlan's friends breathe again – Delaney, it is said, forgets nothing.
  delaney_settled:
    title:
      de: Vergleich im Fall Harlan
      en: Settlement in the Harlan case
    text:
      de: Harlan zahlt, Delaney schließt die Akte. Vor Gericht kommt es nicht – was der Ölmann gestanden hat, bleibt hinter verschlossenen Türen.
      en: Harlan pays and Delaney closes the file. It will not come to court – what the oilman admitted stays behind closed doors.
  delaney_acquitted:
    title:
      de: Freispruch für Harlan
      en: Harlan acquitted
    text:
      de: Die Geschworenen in Cordova sprechen den Ölmann frei. Auf der Treppe des Gerichts schüttelt Harlan Hände, Delaney geht durch die Hintertür.
      en: The jury in Cordova acquits the oilman. On the courthouse steps Harlan shakes hands; Delaney leaves by the back door.
  delaney_convicted:
    title:
      de: Schuldig gesprochen
      en: Found guilty
    text:
      de: Das Bundesgericht verurteilt Jacob Harlan. Die Strafe ist hoch, der Name beschmutzt – in den Kontoren von Hallstead zählt man nach, wer ihm noch Kredit gibt.
      en: The federal court convicts Jacob Harlan. The penalty is heavy and the name tarnished – in the Hallstead offices they count who will still give him credit.

  # --- 0.4.20+9: Benzinpreiskampf mit Margaret Crane (4.14) – aus der letzten Markenabrechnung ---
  brand_price_war:
    title:
      de: Benzinkrieg an den Tankstellen
      en: Gasoline war at the filling stations
    text:
      de: Margaret Crane unterbietet Harlans Stationen, wo sie nur kann. Die Automobilisten tanken billig, die Pächter der Stationen zählen die Tage.
      en: Margaret Crane undercuts Harlan's stations wherever she can. The motorists fill up cheaply, the station keepers count the days.
  brand_price_war_end:
    title:
      de: Waffenruhe an der Zapfsäule
      en: Truce at the pump
    text:
      de: Crane hebt die Benzinpreise wieder an. Ob sie genug hat oder nur Atem holt, weiß an den Stationen niemand.
      en: Crane raises her gasoline prices again. Whether she has had enough or is only catching her breath, no one at the stations knows.

  # --- Öffentliches Handeln (4.2): Worüber man in der letzten Runde über Jacob
  # redete – höchstens eine Meldung, die lauteste zuerst. Die Tat verschiebt am
  # Rundenende die Stimmung im Land und die Parteien (balance.yaml, worldModel.acts). ---
  # Echter Preiskampf (Jacob unterbietet), erst ab Kapitel 2.
  public_price_war:
    title:
      de: Preiskampf am Salt Hill
      en: Price war at Salt Hill
    text:
      de: Harlan unterbietet die Konkurrenz, das Öl wird billiger. Die Kunden freuen sich, die kleinen Förderer zählen ihre Schulden – in Cordova hat die Provinzliga eine Antwort.
      en: Harlan is undercutting the competition and oil is getting cheaper. The customers are pleased, the small producers count their debts – in Cordova the Provincial League has an answer.
  public_independents_stand:
    title:
      de: Die Unabhängigen trotzen dem Trust
      en: The independents defy the Trust
    text:
      de: Zwanzig kleine Förderer verhandeln gemeinsam mit dem Crane Trust, Harlan unter ihnen – und der Trust gibt nach. Bei den Farmern und in den Versammlungen des Volksbunds hört man das gern, in Cordova jubelt die Provinzliga.
      en: Twenty small producers bargain together with the Crane Trust, Harlan among them – and the Trust gives way. The farmers and the People's League meetings like to hear it, and in Cordova the Provincial League cheers.
  public_field_fire:
    title:
      de: Feuer bei Harlan
      en: Fire at Harlan's
    text:
      de: Schwarzer Rauch über dem Salt Hill, bis Port Ellis zu sehen. Die Leser fragen, wer die Felder beaufsichtigt. Der Volksbund fordert Gesetze.
      en: Black smoke over Salt Hill, visible from Port Ellis. Readers ask who supervises the fields. The People's League is calling for laws.
  public_strike:
    title:
      de: Stillstand bei Harlan
      en: Standstill at Harlan's
    text:
      de: Harlans Männer haben die Arbeit niedergelegt. In den Versammlungen des Volksbunds wird ihr Name genannt.
      en: Harlan's men have laid down their tools. Their name is spoken at the People's League meetings.
  public_strike_break:
    title:
      de: Streikbrecher am Salt Hill
      en: Strikebreakers at Salt Hill
    text:
      de: Harlan holt neue Männer vom Hafen, die alten stehen am Zaun. Der Courier druckt ein Bild davon. Der Volksbund hat seinen Fall.
      en: Harlan brings new men from the docks while the old ones stand at the fence. The Courier prints a picture of it. The People's League has its case.
  public_charity:
    title:
      de: Ein Ölmann gibt
      en: An oilman gives
    text:
      de: Jacob Harlan spendet für die Stadt. Am Sonntag wird sein Name von der Kanzel genannt, und die Leute am Hafen nicken.
      en: Jacob Harlan has given to the town. On Sunday his name is read from the pulpit, and the men at the harbour nod.
  public_support_handel:
    title:
      de: Harlan hilft der Handelspartei
      en: Harlan helps the Commerce Party
    text:
      de: Der junge Förderer steht auf der Liste der Freunde der Handelspartei. In den Kontoren des Trusts zählt man solche Namen.
      en: The young producer is on the Commerce Party's list of friends. In the Trust's offices such names are counted.
  public_support_volksbund:
    title:
      de: Harlan gibt dem Volksbund
      en: Harlan gives to the People's League
    text:
      de: Flugblätter gegen die Tarife, mit Harlans Namen darunter. Am Bahnhof sieht man das nicht gern.
      en: Handbills against the tariffs, with Harlan's name at the bottom. At the railway station they don't like it.
  public_support_provinz:
    title:
      de: Harlan steht zur Provinzliga
      en: Harlan stands with the Provincial League
    text:
      de: Sein Name steht unter der Petition der Liga, gleich unter den Farmern. Cordova merkt sich, wer zu den Kleinen hält.
      en: His name is on the League's petition, just below the farmers. Cordova remembers who stands with the little men.
  public_press_praise:
    title:
      de: Ein Mann der Zukunft?
      en: A man of the future?
    text:
      de: Der Courier schreibt freundlich über Jacob Harlan. Wer Zeitung liest, glaubt an das Öl – und ein wenig an den Fortschritt.
      en: The Courier writes kindly of Jacob Harlan. Whoever reads the paper believes in oil – and a little in progress.
  public_press_scandal:
    title:
      de: Skandal am Salt Hill
      en: Scandal at Salt Hill
    text:
      de: Was der Courier über Harlan schreibt, wird im Saloon vorgelesen. Die Ölmänner seien alle gleich, sagen die Farmer.
      en: What the Courier writes about Harlan is read aloud in the saloon. The oilmen are all the same, the farmers say.

  # --- Weltmodell (4.1): höchstens eine Meldung je Runde. Erst, was geschah,
  # sonst ein Frühwarnzeichen (Schwellen in balance.yaml, worldModel.news). ---
  world_crash:
    title:
      de: Der große Krach von Hallstead
      en: The great Hallstead crash
    text:
      de: Eine große Bank schließt ihre Schalter, die Kurse stürzen. Wer auf Pump gekauft hat, ist ruiniert. Überall im Land kündigen Banken Kredite, kürzen die Rahmen und verlangen höhere Zinsen.
      en: A large bank has closed its doors and prices are tumbling. Whoever bought on margin is ruined. All over the country banks are calling in loans, cutting credit lines and demanding higher interest.
  # 4.4: Bankpanik – ein Auslöser ohne große Verschuldung: Schreck, Zinssprung, aber kein Zusammenbruch.
  world_panic:
    title:
      de: Ansturm auf die Banken
      en: A run on the banks
    text:
      de: Ein Gerücht, eine Pleite – und schon stehen die Sparer Schlange vor den Schaltern. Die Banken heben die Zinsen und leihen vorerst weniger. Die alten Bankiers sagen, das gehe vorüber.
      en: A rumour, a failure – and the savers are queuing at the counters. The banks raise their rates and lend less for now. The old bankers say it will pass.
  # 4.4: Frühwarnzeichen vor dem Crash – Verschuldung hoch, Banken heben schon die Zinsen.
  world_credit_bubble:
    title:
      de: Ganz Hallstead kauft auf Pump
      en: All of Hallstead is buying on margin
    text:
      de: Schuhputzer geben Börsentipps, Firmen leihen, um Aktien anderer Firmen zu kaufen. Die Banken leihen noch immer großzügig, heben aber still die Zinsen. Ein alter Bankier warnt, es brauche nur einen Funken.
      en: Bootblacks are giving stock tips, companies borrow to buy other companies' shares. The banks still lend freely but are quietly raising their rates. An old banker warns that a single spark is all it would take.
  # 4.4: Ausland – Costa Negra (Aufstand, Förderausfall) und Qasir (Ölembargo).
  world_costa_negra_unrest:
    title:
      de: Unruhen in Costa Negra
      en: Unrest in Costa Negra
    text:
      de: In der Hauptstadt im Süden marschieren Arbeiter und Soldaten gegen die Regierung. Die Ölfelder an der Küste sollen schon bewacht werden.
      en: In the southern capital workers and soldiers are marching against the government. The coastal oil fields are said to be under guard already.
  world_uprising:
    title:
      de: Aufstand in Costa Negra – die Ölfelder stehen still
      en: Uprising in Costa Negra – the oil fields fall silent
    text:
      de: Aufständische besetzen die Förderanlagen an der Küste, Tanker laufen leer aus. Händler in Port Ellis rechnen mit teurerem Öl, bis wieder Ruhe herrscht.
      en: Rebels have occupied the coastal oil works and tankers sail empty. Traders in Port Ellis expect dearer oil until order returns.
  world_uprising_end:
    title:
      de: Costa Negra fördert wieder
      en: Costa Negra pumps again
    text:
      de: Die neue Regierung im Süden lässt die Ölfelder wieder öffnen. Die ersten Tanker sind unterwegs nach Norden.
      en: The new government in the south has reopened the oil fields. The first tankers are on their way north.
  world_qasir_unrest:
    title:
      de: Verstimmung in Qasir
      en: Displeasure in Qasir
    text:
      de: Gesandte aus Aldmark und Varenhold drängen sich am Hof des Wüstenkönigs. Der König lässt ausrichten, sein Öl sei nicht jedermanns Öl.
      en: Envoys from Aldmark and Varenhold crowd the desert king's court. The king lets it be known that his oil is not everybody's oil.
  world_embargo:
    title:
      de: Qasir stoppt die Ölausfuhr
      en: Qasir halts its oil exports
    text:
      de: Der Wüstenkönig verhängt ein Embargo, kein Tanker verlässt mehr seine Häfen. In aller Welt steigen die Ölpreise.
      en: The desert king has declared an embargo; no tanker leaves his ports. Oil prices are rising all over the world.
  world_embargo_end:
    title:
      de: Qasir hebt das Embargo auf
      en: Qasir lifts its embargo
    text:
      de: Nach zähen Verhandlungen öffnet der Wüstenkönig seine Häfen wieder. Die Händler erwarten, dass der Ölpreis nachgibt.
      en: After hard negotiations the desert king reopens his ports. Traders expect the oil price to ease.
  world_recovery:
    title:
      de: Die Banken atmen auf
      en: The banks breathe again
    text:
      de: Nach Monaten der Angst öffnen die Bankhäuser in Hallstead wieder ihre Bücher. Wer heute Geld leihen will, wird nicht mehr gleich vor die Tür gesetzt.
      en: After months of fear the banking houses of Hallstead are opening their books again. Whoever wants to borrow today is no longer shown straight to the door.
  world_war:
    title:
      de: Krieg zwischen Aldmark und Varenhold
      en: War between Aldmark and Varenhold
    text:
      de: Jenseits des Ozeans sprechen die Kanonen. Flotten und Fabriken verlangen Öl, und in Hallstead streitet das Parlament, ob die Föderation neutral bleibt.
      en: Across the ocean the guns are speaking. Fleets and factories are crying out for oil, and in Hallstead parliament argues whether the Federation will stay neutral.
  world_peace:
    title:
      de: Frieden in Übersee
      en: Peace overseas
    text:
      de: Aldmark und Varenhold unterzeichnen einen Waffenstillstand. Die Händler in Port Ellis fragen sich, wer jetzt noch so viel Öl kauft.
      en: Aldmark and Varenhold sign an armistice. The traders in Port Ellis wonder who will buy so much oil now.
  world_nationalization:
    title:
      de: Costa Negra nimmt die Ölfelder
      en: Costa Negra seizes the oil fields
    text:
      de: Eine neue Regierung in Costa Negra erklärt die Felder der fremden Gesellschaften zum Eigentum des Volkes. Ausländische Ingenieure packen ihre Koffer.
      en: A new government in Costa Negra declares the fields of the foreign companies the property of the people. Foreign engineers are packing their bags.
  world_glut:
    title:
      de: Riesenfund lässt die Märkte zittern
      en: Giant strike shakes the markets
    text:
      de: Irgendwo ist ein Feld angebohrt worden, wie es noch keiner gesehen hat. Alle Nachbarn bohren um die Wette – bald wird es mehr Öl geben als Tanks.
      en: Somewhere a field has been tapped such as nobody has ever seen. All the neighbours are drilling for their lives – soon there will be more oil than tanks.
  world_election_handel:
    title:
      de: Handelspartei gewinnt die Wahl
      en: Commerce Party wins the election
    text:
      de: Industrie und Banken feiern in Hallstead. Die neue Regierung verspricht niedrige Steuern und freie Hand für große Unternehmen.
      en: Industry and the banks are celebrating in Hallstead. The new government promises low taxes and a free hand for big business.
  world_election_volksbund:
    title:
      de: Volksbund siegt bei der Wahl
      en: People's League wins the election
    text:
      de: Farmer und Arbeiter haben gewählt. Die neue Regierung kündigt eine strengere Aufsicht über Banken und Trusts an.
      en: Farmers and workers have voted. The new government announces stricter supervision of banks and trusts.
  world_election_provinz:
    title:
      de: Provinzliga stellt die Regierung
      en: Provincial League forms the government
    text:
      de: Die Provinzen haben Hallstead die Stirn geboten. Die neue Regierung will die kleinen Produzenten schützen – und fremdes Öl mit Zöllen belegen.
      en: The provinces have defied Hallstead. The new government wants to protect the small producers – and put tariffs on foreign oil.
  world_reelected_handel:
    title:
      de: Handelspartei bleibt an der Regierung
      en: Commerce Party stays in power
    text:
      de: Die Wähler haben der Regierung noch einmal vertraut. In Hallstead knallen die Korken, und die Banken rechnen mit vier weiteren ruhigen Jahren.
      en: The voters have trusted the government once more. Corks are popping in Hallstead, and the banks are counting on four more quiet years.
  world_reelected_volksbund:
    title:
      de: Volksbund behauptet sich
      en: People's League holds on
    text:
      de: Farmer und Arbeiter bleiben ihrer Regierung treu. Die Bankaufsicht bleibt streng, und die Trusts müssen weiter mit Prüfern rechnen.
      en: Farmers and workers stay loyal to their government. Bank supervision stays strict, and the trusts must keep reckoning with inspectors.
  world_reelected_provinz:
    title:
      de: Provinzliga regiert weiter
      en: Provincial League governs on
    text:
      de: Die Provinzen geben Hallstead nicht zurück. Die Regierung verspricht den kleinen Produzenten weiter Schutz – und den Importeuren weiter Zölle.
      en: The provinces will not hand Hallstead back. The government promises the small producers continued protection – and the importers continued tariffs.
  world_credit_tight:
    title:
      de: Die Banken werden vorsichtig
      en: The banks grow cautious
    text:
      de: In den Kontoren heißt es wieder „Sicherheiten, bitte“. Wer jetzt Geld braucht, zahlt mehr Zinsen als im letzten Jahr.
      en: In the counting houses it is "collateral, please" once more. Whoever needs money now pays more interest than last year.
  world_credit_easy:
    title:
      de: Geld ist billig wie nie
      en: Money has never been cheaper
    text:
      de: Die Banken leihen jedem, der einen Bohrturm zeichnen kann, und an der Börse kauft man auf Pump. Alte Bankiers schütteln den Kopf.
      en: The banks lend to anyone who can draw a derrick, and on the exchange people buy on credit. Old bankers shake their heads.
  world_mood_angry:
    title:
      de: Unmut im Land
      en: Discontent in the country
    text:
      de: Teures Heizöl, entlassene Arbeiter, leere Teller. In den Versammlungen des Volksbunds ist kein Stuhl mehr frei.
      en: Expensive heating oil, laid-off workers, empty plates. There is not a free chair left at the People's League meetings.
  world_tension:
    title:
      de: Diplomatische Noten zwischen Aldmark und Varenhold
      en: Diplomatic notes between Aldmark and Varenhold
    text:
      de: Beide Mächte rüsten ihre Flotten auf und kaufen Öl, wo sie es kriegen. Die Zeitungen in Übersee sprechen schon vom Krieg.
      en: Both powers are building up their fleets and buying oil wherever they can get it. The papers overseas are already talking of war.
  # 4.2: Umfrage kurz vor der Wahl (worldModel.news.pollFrom Runden vorher): wer vorn liegt.
  world_poll_handel:
    title:
      de: Umfrage sieht Handelspartei vorn
      en: Poll puts the Commerce Party ahead
    text:
      de: Vor der Wahl in Hallstead geben sich die Banken zuversichtlich. Die Wettbüros zahlen auf die Handelspartei am wenigsten.
      en: Ahead of the Hallstead election the banks are confident. The betting shops pay least on the Commerce Party.
  world_poll_volksbund:
    title:
      de: Volksbund liegt vor der Wahl vorn
      en: People's League leads before the election
    text:
      de: Die Säle des Volksbunds sind voll, die Wettbüros setzen auf Farmer und Arbeiter. In den Trusts denkt man über Anwälte nach.
      en: The People's League halls are full, the betting shops back the farmers and workers. In the trusts people are thinking about lawyers.
  world_poll_provinz:
    title:
      de: Provinzliga hofft auf den Sieg
      en: Provincial League hopes for victory
    text:
      de: Von Cordova bis an die Grenze hängen die Plakate der Liga. Die Wettbüros halten einen Sieg der Provinzen für möglich.
      en: From Cordova to the border hang the League's posters. The betting shops think a victory for the provinces is possible.
  # Kopf an Kopf (worldModel.news.pollClose): Jetzt kann eine Schlagzeile die Wahl entscheiden.
  world_poll_close_handel:
    title:
      de: Kopf an Kopf – Handelspartei knapp vorn
      en: Neck and neck – Commerce Party narrowly ahead
    text:
      de: Die Wettbüros sind sich uneins, die Handelspartei liegt nur eine Nasenlänge vorn. Ein Brand, ein Streik, eine Spende – jede Schlagzeile kann die Wahl jetzt kippen.
      en: The betting shops can't agree; the Commerce Party is ahead by a nose. A fire, a strike, a donation – any headline could tip the election now.
  world_poll_close_volksbund:
    title:
      de: Kopf an Kopf – Volksbund knapp vorn
      en: Neck and neck – People's League narrowly ahead
    text:
      de: Die Säle des Volksbunds sind voll, doch er liegt nur knapp vorn, und die Wettbüros zögern. Ein Brand, ein Streik, eine Spende – jede Schlagzeile kann die Wahl jetzt kippen.
      en: The People's League halls are full, yet it is only narrowly ahead, and the betting shops hesitate. A fire, a strike, a donation – any headline could tip the election now.
  world_poll_close_provinz:
    title:
      de: Kopf an Kopf – Provinzliga knapp vorn
      en: Neck and neck – Provincial League narrowly ahead
    text:
      de: Die Liga liegt eine Nasenlänge vorn, Hallstead wird nervös. Ein Brand, ein Streik, eine Spende – jede Schlagzeile kann die Wahl jetzt kippen.
      en: The League is ahead by a nose and Hallstead is getting nervous. A fire, a strike, a donation – any headline could tip the election now.
