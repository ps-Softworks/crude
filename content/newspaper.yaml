# Zeitung (2.6, GDD §7.2): Schlagzeilen zu Beginn jeder Runde.
# Die Simulation sucht aus dem Spielzustand aus, WELCHE Schlagzeile erscheint;
# hier steht nur, wie sie klingt. Jeder Text mit Sprachschlüssel de/en
# (Englisch darf leer bleiben, dann erscheint Deutsch).
# Regel aus dem GDD: keine Zahlen – die Zeitung deutet an, sie rechnet nicht vor.
# ENTWURF: Texte und der Name der Zeitung sind Vorschläge.

name:
  de: Port Ellis Courier
  en: Port Ellis Courier

headlines:
  # --- Titelseite: Aussicht für den Ölpreis (Frühwarnzeichen) ---
  # Der Preis wird am Ende dieser Runde fallen – und zwar stark.
  outlook_crash:
    title:
      de: Tanks in Port Ellis laufen über
      en: Port Ellis tanks are overflowing
    text:
      de: Am Hafen stapeln sich die Fässer, die Händler winken ab. Wer jetzt noch Öl im Tank hat, sollte schnell verkaufen – der Trust wird den Preis kräftig drücken.
      en: Barrels are piling up at the harbour and the traders wave them away. Anyone still holding oil had better sell quickly – the Trust will push the price down hard.
  # Der Preis wird am Ende dieser Runde spürbar fallen.
  outlook_fall:
    title:
      de: Volle Tanks am Hafen
      en: Full tanks at the harbour
    text:
      de: Die Lagerhalter in Port Ellis klagen über Platzmangel. In den Kontoren des Trusts spricht man schon von einem niedrigeren Posted Price.
      en: The storage men in Port Ellis complain about a lack of space. In the Trust's offices there is already talk of a lower posted price.
  # Der Preis wird am Ende dieser Runde spürbar steigen.
  outlook_rise:
    title:
      de: Leere Tanks, ungeduldige Käufer
      en: Empty tanks, impatient buyers
    text:
      de: Die Raffinerien rufen nach Öl, doch am Salt Hill kommt weniger an als erwartet. Die Händler rechnen mit besseren Preisen.
      en: The refineries are calling for oil, but less is arriving from Salt Hill than expected. Traders expect better prices.
  # Keine große Bewegung in Sicht.
  outlook_steady:
    title:
      de: Ruhiger Handel am Salt Hill
      en: Quiet trading at Salt Hill
    text:
      de: Fässer kommen, Fässer gehen. Die Händler am Hafen sehen keinen Grund zur Aufregung.
      en: Barrels come, barrels go. The traders at the harbour see no reason for excitement.

  # --- Kurzmeldungen: was in der letzten Runde geschah ---
  price_cut:
    title:
      de: Trust senkt den Posted Price
      en: Trust cuts the posted price
    text:
      de: Der Crane Trust zahlt weniger je Barrel. Kleine Bohrfirmen rechnen nach.
      en: The Crane Trust pays less per barrel. Small drillers are doing their sums.
  price_raise:
    title:
      de: Trust zahlt mehr
      en: Trust pays more
    text:
      de: Der Crane Trust hebt den Posted Price an – das Öl am Salt Hill ist gefragt.
      en: The Crane Trust raises the posted price – Salt Hill oil is in demand.
  # 2.8: Der Crane Trust zahlt den Unabhängigen ab dieser Runde weniger (Jacob hat den Abschlag hingenommen).
  crane_cut:
    title:
      de: Trust drückt die Unabhängigen
      en: Trust squeezes the independents
    text:
      de: Der Crane Trust zahlt kleinen Produzenten weniger als den Posted Price. In den Saloons am Salt Hill wird geflucht.
      en: The Crane Trust pays small producers less than the posted price. In the Salt Hill saloons, men are cursing.
  rival_find:
    title:
      de: Bullard stößt auf Öl
      en: Bullard strikes oil
    text:
      de: '„Big" Jim Bullard feiert einen neuen Fund. Seine Fuhrwerke rollen bald zum Hafen.'
      en: '"Big" Jim Bullard celebrates a new strike. His wagons will soon be rolling to the harbour.'
  jacob_gusher:
    title:
      de: Gusher! Neuling trifft ins Schwarze
      en: Gusher! Newcomer hits the jackpot
    text:
      de: Eine Ölfontäne über dem Bohrturm von Jacob Harlan – ganz Port Ellis spricht davon.
      en: A fountain of oil above Jacob Harlan's derrick – all of Port Ellis is talking about it.
  jacob_find:
    title:
      de: Harlan findet Öl
      en: Harlan finds oil
    text:
      de: Der Neuling Jacob Harlan hat eine fündige Quelle. Die alten Hasen am Salt Hill horchen auf.
      en: The newcomer Jacob Harlan has a producing well. The old hands at Salt Hill take notice.
  # Lückenfüller, wenn sonst nichts passiert ist.
  classifieds:
    title:
      de: Kleinanzeigen
      en: Classifieds
    text:
      de: Gebrauchter Bohrturm zu verkaufen, kaum benutzt. Zimmer frei in der Front Street, nur an ordentliche Herren.
      en: Used derrick for sale, hardly used. Room to let on Front Street, respectable gentlemen only.

  # --- Weltmodell (4.1): höchstens eine Meldung je Runde. Erst, was geschah,
  # sonst ein Frühwarnzeichen (Schwellen in balance.yaml, worldModel.news). ---
  world_crash:
    title:
      de: Panik an der Börse von Hallstead
      en: Panic on the Hallstead exchange
    text:
      de: Eine große Bank schließt ihre Schalter, die Kurse stürzen. Überall im Land kündigen Banken Kredite und verlangen höhere Zinsen.
      en: A large bank has closed its doors and prices are tumbling. All over the country banks are calling in loans and demanding higher interest.
  world_recovery:
    title:
      de: Die Banken atmen auf
      en: The banks breathe again
    text:
      de: Nach Monaten der Angst öffnen die Bankhäuser in Hallstead wieder ihre Bücher. Wer heute Geld leihen will, wird nicht mehr gleich vor die Tür gesetzt.
      en: After months of fear the banking houses of Hallstead are opening their books again. Whoever wants to borrow today is no longer shown straight to the door.
  world_war:
    title:
      de: Krieg zwischen Aldmark und Varenhold
      en: War between Aldmark and Varenhold
    text:
      de: Jenseits des Ozeans sprechen die Kanonen. Flotten und Fabriken verlangen Öl, und in Hallstead streitet das Parlament, ob die Föderation neutral bleibt.
      en: Across the ocean the guns are speaking. Fleets and factories are crying out for oil, and in Hallstead parliament argues whether the Federation will stay neutral.
  world_peace:
    title:
      de: Frieden in Übersee
      en: Peace overseas
    text:
      de: Aldmark und Varenhold unterzeichnen einen Waffenstillstand. Die Händler in Port Ellis fragen sich, wer jetzt noch so viel Öl kauft.
      en: Aldmark and Varenhold sign an armistice. The traders in Port Ellis wonder who will buy so much oil now.
  world_nationalization:
    title:
      de: Costa Negra nimmt die Ölfelder
      en: Costa Negra seizes the oil fields
    text:
      de: Eine neue Regierung in Costa Negra erklärt die Felder der fremden Gesellschaften zum Eigentum des Volkes. Ausländische Ingenieure packen ihre Koffer.
      en: A new government in Costa Negra declares the fields of the foreign companies the property of the people. Foreign engineers are packing their bags.
  world_glut:
    title:
      de: Riesenfund lässt die Märkte zittern
      en: Giant strike shakes the markets
    text:
      de: Irgendwo ist ein Feld angebohrt worden, wie es noch keiner gesehen hat. Alle Nachbarn bohren um die Wette – bald wird es mehr Öl geben als Tanks.
      en: Somewhere a field has been tapped such as nobody has ever seen. All the neighbours are drilling for their lives – soon there will be more oil than tanks.
  world_election_handel:
    title:
      de: Handelspartei gewinnt die Wahl
      en: Commerce Party wins the election
    text:
      de: Industrie und Banken feiern in Hallstead. Die neue Regierung verspricht niedrige Steuern und freie Hand für große Unternehmen.
      en: Industry and the banks are celebrating in Hallstead. The new government promises low taxes and a free hand for big business.
  world_election_volksbund:
    title:
      de: Volksbund siegt bei der Wahl
      en: People's League wins the election
    text:
      de: Farmer und Arbeiter haben gewählt. Die neue Regierung kündigt eine strengere Aufsicht über Banken und Trusts an.
      en: Farmers and workers have voted. The new government announces stricter supervision of banks and trusts.
  world_election_provinz:
    title:
      de: Provinzliga stellt die Regierung
      en: Provincial League forms the government
    text:
      de: Die Provinzen haben Hallstead die Stirn geboten. Die neue Regierung will die kleinen Produzenten schützen – und fremdes Öl mit Zöllen belegen.
      en: The provinces have defied Hallstead. The new government wants to protect the small producers – and put tariffs on foreign oil.
  world_credit_tight:
    title:
      de: Die Banken werden vorsichtig
      en: The banks grow cautious
    text:
      de: In den Kontoren heißt es wieder „Sicherheiten, bitte“. Wer jetzt Geld braucht, zahlt mehr Zinsen als im letzten Jahr.
      en: In the counting houses it is "collateral, please" once more. Whoever needs money now pays more interest than last year.
  world_credit_easy:
    title:
      de: Geld ist billig wie nie
      en: Money has never been cheaper
    text:
      de: Die Banken leihen jedem, der einen Bohrturm zeichnen kann, und an der Börse kauft man auf Pump. Alte Bankiers schütteln den Kopf.
      en: The banks lend to anyone who can draw a derrick, and on the exchange people buy on credit. Old bankers shake their heads.
  world_mood_angry:
    title:
      de: Unmut im Land
      en: Discontent in the country
    text:
      de: Teures Heizöl, entlassene Arbeiter, leere Teller. In den Versammlungen des Volksbunds ist kein Stuhl mehr frei.
      en: Expensive heating oil, laid-off workers, empty plates. There is not a free chair left at the People's League meetings.
  world_tension:
    title:
      de: Diplomatische Noten zwischen Aldmark und Varenhold
      en: Diplomatic notes between Aldmark and Varenhold
    text:
      de: Beide Mächte rüsten ihre Flotten auf und kaufen Öl, wo sie es kriegen. Die Zeitungen in Übersee sprechen schon vom Krieg.
      en: Both powers are building up their fleets and buying oil wherever they can get it. The papers overseas are already talking of war.
