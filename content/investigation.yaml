# Ermittler (4.11, GDD §4 und §10): Texte fürs Schattenbuch in der Schreibtischschublade.
# Entwurf von Claude – Philipp überarbeitet.
#
# traces   – je Spur ein Satz, so wie Jacob ihn ins Schattenbuch schreiben würde.
#            Schlüssel = Merkzeichen aus balance.yaml (investigation.traces) oder die Art
#            einer neuen Spur aus Kapitel 2 (vertuschung, zeugenkauf, einflussnahme,
#            absprache = Kartell- oder Gebietsabsprache mit einem Rivalen aus 4.10).
# stages   – wo Delaney gerade steht (Ruhe, Gerücht, Vorermittlung, Anklage, abgeschlossen).
# heat     – die Hitze als Wort (Schwellen: balance.yaml investigation.heatWords).
# verdicts – wie der letzte Fall ausging.
# npm run check:content prüft, dass jede Spur aus balance.yaml hier einen Text hat.

traces:
  moss_betrogen:
    de: "Ezekiel Moss' Pachtpapier für hundert Dollar. Er konnte nicht lesen, was er unterschrieb."
    en: "Ezekiel Moss's lease paper for a hundred dollars. He couldn't read what he signed."
  silas_betrogen:
    de: "Bücher ohne Gewinn, gezeigt an Silas Brandt. Ruth weiß, wo die richtigen liegen."
    en: "Books without profit, shown to Silas Brandt. Ruth knows where the real ones are."
  silas_kronzeuge:
    de: "Silas erzählt in jedem Saloon von Cordova, wie Jacob Harlan rechnet. Ein Zeuge, der nicht vergisst."
    en: "Silas tells every saloon in Cordova how Jacob Harlan does his sums. A witness who does not forget."
  courier_gekauft:
    de: "Ein gekaufter Bericht im Courier. Nora Whitlock hat ihn ausgeschnitten."
    en: "A bought report in the Courier. Nora Whitlock clipped it out."
  vale_geld:
    de: "Ein Umschlag von einem Herrn im grauen Mantel. Keine Quittung, kein Absender."
    en: "An envelope from a gentleman in a grey coat. No receipt, no sender."
  thorne_exklusiv:
    de: "Ein Exklusivvertrag mit Thorne Rail, den kein anderer Förderer zu sehen bekam."
    en: "An exclusive contract with Thorne Rail that no other producer got to see."
  vertuschung:
    de: "Papiere im Ofen – und jemand, der gesehen hat, wer sie hineinwarf."
    en: "Papers in the stove – and someone who saw who threw them in."
  zeugenkauf:
    de: "Ein Zeuge, der sich gegen Geld an nichts mehr erinnert. Bis er Geld von jemand anderem bekommt."
    en: "A witness who remembers nothing for money. Until someone else pays him."
  einflussnahme:
    de: "Telefonate nach Hallstead, um einen Bundesanwalt loszuwerden. Delaney kennt jeden Namen."
    en: "Telephone calls to Hallstead to get rid of a federal prosecutor. Delaney knows every name."
  absprache:
    de: "Ein Handschlag mit einem Rivalen über Preise und Gebiete. Das Kartellgesetz nennt das Verschwörung."
    en: "A handshake with a rival over prices and territories. The antitrust law calls that conspiracy."
  # 4.12: Spur aus einer Antwort auf ein Ereignis – das Schattenbuch zeigt die Beschriftung der Spur
  # (trace.label) oder den Titel des Ereignisses; dieser Text steht nur, wenn beides fehlt.
  ereignis:
    de: "Eine Entscheidung, die besser niemand nachliest."
    en: "A decision nobody had better look up."

stages:
  ruhe:
    de: "Niemand stellt Fragen. Noch nicht."
    en: "Nobody is asking questions. Not yet."
  geruecht:
    de: "In Cordova wird geredet. Delaney sitzt in seinem Büro und hört zu."
    en: "People are talking in Cordova. Delaney sits in his office and listens."
  vorermittlung:
    de: "Delaney ermittelt. Er lädt Leute vor, liest Grundbücher und schreibt alles auf."
    en: "Delaney is investigating. He summons people, reads land registers and writes everything down."
  anklage:
    de: "Die Anklage ist erhoben. Das Bundesgericht in Cordova hat einen Termin."
    en: "Charges have been filed. The federal court in Cordova has set a date."
  abgeschlossen:
    de: "Der Fall ist abgeschlossen. Delaney hat die Akte ins Regal gestellt – nicht in den Ofen."
    en: "The case is closed. Delaney has put the file on the shelf – not in the stove."

