reasons:
  inaktiv: { de: "Das kommt erst in Kapitel 2.", en: "That only comes in chapter 2." }
  ende: { de: "Das Kapitel ist zu Ende.", en: "The chapter is over." }
  entschieden: { de: "Die Nachfolge ist entschieden.", en: "The succession is decided." }
  schon: { de: "Das hast du in dieser Runde schon getan.", en: "You already did that this round." }
  geld: { de: "Dafür fehlt das Geld.", en: "You don't have the money for that." }
  zeit: { de: "Dafür fehlt die Zeit in dieser Runde.", en: "You don't have the time this round." }
  unbekannt: { de: "Das gibt es nicht mehr.", en: "That no longer exists." }
