  verraten: { de: "Du hast ihn verraten – er verhandelt nicht mehr mit dir.", en: "You betrayed them – they won't negotiate with you anymore." }
  laeuft: { de: "Das läuft schon oder liegt schon auf dem Tisch.", en: "That is already running or already on the table." }
  vergeben: { de: "Die Firma gehört schon jemandem.", en: "The firm already belongs to someone." }
