# Kapitelende (2.11, GDD §13, §14): Texte für den Ergebnisbildschirm von Kapitel 1 (oben) und
# Kapitel 2 (4.12, Block chapter2 unten).
# Die Zahlen der Kapitelprüfung (Imperiumswert, Quellen, Börsengang) stehen in
# content/balance.yaml unter chapter. Die Regeln in src/sim/chapter.ts.
#
# Platzhalter in Texten: {anteil} = verkaufter Anteil in %, {preis} = Erlös in $.
#
# Entwurf – Philipp überarbeitet.

draft: true

# Ausgänge des Kapitels. erreicht/verfehlt nach der Kapitelprüfung,
# verkauft = frühes Ende „Der kluge Mann“ (Crane-Übernahme angenommen).
endings:
  erreicht:
    title: { de: "Kapitel 1 geschafft", en: "Chapter 1 Complete" }
    text:
      de: >-
        Vier Jahre in Cordova. Aus dem geliehenen Bohrturm ist eine Firma geworden,
        mit der man in Port Ellis rechnen muss. Die Bank grüßt Jacob jetzt zuerst.
      en: >-
        Four years in Cordova. The borrowed rig has become a company Port Ellis has
        to reckon with. The bank greets Jacob first now.
  verfehlt:
    title: { de: "Kapitel 1 verfehlt", en: "Chapter 1 Missed" }
    text:
      de: >-
        Vier Jahre in Cordova, und Jacob ist noch immer ein kleiner Wildcatter. Die
        Firma lebt, aber sie ist zu klein, um Anleger oder Banker zu beeindrucken.
        Er wird geschwächt in die nächsten Jahre gehen.
      en: >-
        Four years in Cordova, and Jacob is still a small wildcatter. The company is
        alive, but too small to impress investors or bankers. He goes into the next
        years weakened.
  verkauft:
    title: { de: "Der kluge Mann", en: "The Wise Man" }
    text:
      de: >-
        Jacob Harlan hat seine Firma an den Crane Trust verkauft. Cornelius Crane
        schüttelt ihm die Hand, als hätte er nie etwas anderes erwartet. Jacob ist ein
        reicher Mann – und in Cordova bohrt jetzt ein anderer.
      en: >-
        Jacob Harlan has sold his company to the Crane Trust. Cornelius Crane shakes
        his hand as if he had never expected anything else. Jacob is a rich man – and
        someone else drills in Cordova now.

# Die Prüfung selbst, wie sie auf dem Bildschirm steht.
goals:
  solvent: { de: "Nicht bankrott (Kasse nicht im Minus)", en: "Not bankrupt (cash not negative)" }
  value: { de: "Imperiumswert mindestens {ziel}", en: "Empire value at least {ziel}" }
  wells: { de: "oder mindestens {ziel} fördernde Quellen", en: "or at least {ziel} producing wells" }

# Boni (GDD §13): zeigen nur an, was Jacob zusätzlich geschafft hat.
# transport.any: Merkzeichen, die als eigene Transportlösung zählen (eins reicht).
# Seit 0.2.15+2 zählt die eigene Pipeline (Merkzeichen pipeline_gebaut setzt die
# Simulation, sobald sie fertig ist). Die Silas-Frage gilt als geklärt, sobald der
# Bogen in content/arcs.yaml einen Ausgang hat.
bonus:
  transport:
    any: [pipeline_gebaut]
    label: { de: "Eigene Transportlösung", en: "Own transport solution" }
  silas:
    label: { de: "Silas-Frage geklärt", en: "Silas question settled" }

# Entscheidung zum Kapitelende: Umwandlung in eine Aktiengesellschaft (GDD §8, §13).
ipo:
  title: { de: "Eine Aktiengesellschaft?", en: "A Joint-Stock Company?" }
  text:
    de: >-
      Ein Bankier aus der Hauptstadt sitzt in Jacobs Büro. Er könnte aus der Firma eine
      Aktiengesellschaft machen und einen Teil der Anteile an Anleger verkaufen. Das
      bringt Geld für das nächste Kapitel – aber jeder verkaufte Anteil ist eine Stimme,
      die nicht mehr Jacob gehört.
    en: >-
      A banker from the capital sits in Jacob's office. He could turn the company into a
      joint-stock company and sell part of the shares to investors. That brings money for
      the next chapter – but every share sold is a vote that no longer belongs to Jacob.
  sell: { de: "{anteil} verkaufen – {preis}", en: "Sell {anteil} – {preis}" }
  keep: { de: "Familienfirma bleiben", en: "Stay a family firm" }
  sold:
    de: Jacob verkauft {anteil} seiner Firma an Anleger und bekommt {preis}. Er behält die Mehrheit – noch.
    en: Jacob sells {anteil} of his company to investors and receives {preis}. He keeps the majority – for now.
  kept:
    de: Jacob schickt den Bankier wieder nach Hause. Die Firma bleibt in der Familie.
    en: Jacob sends the banker home. The company stays in the family.
  blocked:
    de: Für eine so kleine Firma interessiert sich kein Anleger. Die Firma bleibt in der Familie.
    en: No investor is interested in such a small company. It stays in the family.

# Kapitel 2 „Der Herausforderer“ (4.12, GDD §13/§14). Die Zahlen der Prüfung stehen in
# content/balance.yaml unter chapter.chapter2, die Regeln in src/sim/chapter.ts.
# Platzhalter in goals: {ziel} = Zielwert.
chapter2:
  endings:
    erreicht:
      title: { de: "Kapitel 2 geschafft", en: "Chapter 2 Complete" }
      text:
        de: >-
          Vier Jahre gegen den Crane Trust. Harlan Oil hat eigene Wege zum Markt, Jacob hält
          die Zügel seiner Firma noch selbst, und in Hallstead nennt man seinen Namen im selben
          Atemzug wie die alten Familien – nicht immer freundlich.
        en: >-
          Four years against the Crane Trust. Harlan Oil has its own roads to market, Jacob still
          holds the reins of his company, and in Hallstead his name is spoken in the same breath
          as the old families – not always kindly.
    verfehlt:
      title: { de: "Kapitel 2 verfehlt", en: "Chapter 2 Missed" }
      text:
        de: >-
          Vier Jahre Kampf, und der Trust sitzt noch immer zwischen Jacobs Quellen und dem Markt.
          Harlan Oil lebt – aber als Herausforderer, den niemand mehr fürchtet. Jacob geht geschwächt
          in die nächsten Jahre.
        en: >-
          Four years of fighting, and the Trust still sits between Jacob's wells and the market.
          Harlan Oil lives on – but as a challenger nobody fears any more. Jacob goes into the next
          years weakened.
    verkauft:
      title: { de: "Der kluge Mann", en: "The Wise Man" }
      text:
        de: >-
          Jacob Harlan hat seine Firma an Harold Pruett verkauft. Pruett zahlt bar und lächelt
          dabei nicht. Jacob ist ein reicher Mann – und Harlan Oil heißt ab Montag anders.
        en: >-
          Jacob Harlan has sold his company to Harold Pruett. Pruett pays in cash and doesn't smile
          while doing it. Jacob is a rich man – and from Monday Harlan Oil has another name.
    abgesetzt:
      title: { de: "Abgesetzt", en: "Ousted" }
      text:
        de: >-
          Der Aufsichtsrat hat Jacob Harlan abgesetzt. Die Herren danken ihm für seine Verdienste
          und bitten um den Schlüssel zum Büro. Seine Aktien darf er behalten – seine Firma nicht.
        en: >-
          The board has ousted Jacob Harlan. The gentlemen thank him for his services and ask for
          the key to the office. He may keep his shares – not his company.
    geschluckt:
      title: { de: "Geschluckt", en: "Swallowed" }
      text:
        de: >-
          Hinter den Strohmännern stand die ganze Zeit Augustus Thorne. Er hält jetzt mehr Aktien
          als Jacob, und Harlan Oil fährt ab sofort für Thorne Rail.
        en: >-
          Behind the straw men stood Augustus Thorne all along. He now holds more shares than Jacob,
          and Harlan Oil runs for Thorne Rail from now on.
    haft:
      title: { de: "Hinter Gittern", en: "Behind Bars" }
      text:
        de: >-
          Die Geschworenen haben gesprochen, und der Richter hat sich Zeit gelassen mit dem Strafmaß.
          Jacob Harlan geht für Jahre ins Bundesgefängnis. Ruth bringt sonntags Zeitungen.
        en: >-
          The jury has spoken, and the judge took his time with the sentence. Jacob Harlan goes to
          federal prison for years. Ruth brings newspapers on Sundays.
  goals:
    transport: { de: "Eigene Raffinerie oder eigene Fernleitung zum Hafen", en: "Own refinery or own pipeline to the harbour" }
    control: { de: "Kontrolle über Harlan Oil mindestens {ziel}", en: "Control of Harlan Oil at least {ziel}" }
    value: { de: "Imperiumswert mindestens {ziel}", en: "Empire value at least {ziel}" }
  # Ruf (GDD §4, 4.12): Achsen und Wörter für Kassenbuch und Kapitelabschluss.
  reputation:
    title: { de: "Ruf", en: "Reputation" }
    axes:
      public: { de: "Öffentlichkeit", en: "Public" }
      politics: { de: "Politik", en: "Politics" }
      workers: { de: "Arbeiter", en: "Workers" }
      industryRespect: { de: "Branche (Respekt)", en: "Industry (respect)" }
      industryFear: { de: "Branche (Furcht)", en: "Industry (fear)" }
      standing: { de: "Gesellschaft", en: "Society" }
    words:
      verhasst: { de: "verhasst", en: "hated" }
      misstrauisch: { de: "misstrauisch", en: "distrusted" }
      neutral: { de: "neutral", en: "neutral" }
      geachtet: { de: "geachtet", en: "respected" }
      verehrt: { de: "verehrt", en: "revered" }
  next:
    title: { de: "Kapitel 3 – Der Konzernherr", en: "Chapter 3 – The Magnate" }
    text:
      de: >-
        Sechs Jahre führt ein Verwalter das Tagesgeschäft. Danach ist Harlan Oil ein Konzern – die
        Börse lockt, und Hallsteads alte Familien öffnen die ersten Türen. Oder schlagen sie zu.
      en: >-
        For six years a manager runs the daily business. After that Harlan Oil is a corporation – the
        stock exchange beckons, and Hallstead's old families open the first doors. Or slam them shut.

# Kapitel 3 „Der Konzernherr“ (4.19, GDD §13/§14): Ausgänge, Prüfung, Ende des Early-Access-Umfangs.
# Platzhalter: {regionen} Ziel Regionen, {anteil} Ziel Marktanteil, {rating} Mindest-Rating.
chapter3:
  endings:
    erreicht:
      title: { de: "Kapitel 3 geschafft", en: "Chapter 3 Complete" }
      text:
        de: >-
          Vier Jahre als Konzernherr. Harlans Schild hängt über Tankstellen in mehreren Provinzen,
          die Banken in Hallstead nehmen Jacobs Anrufe entgegen, und Margaret Crane grüßt ihn
          inzwischen zuerst.
        en: >-
          Four years as a magnate. Harlan's sign hangs over filling stations in several provinces,
          the banks in Hallstead take Jacob's calls, and Margaret Crane now greets him first.
    verfehlt:
      title: { de: "Kapitel 3 verfehlt", en: "Chapter 3 Missed" }
      text:
        de: >-
          Harlan Oil ist groß, aber nicht dort, wo die Kunden tanken – oder die Bank zweifelt an den
          Büchern. In Hallstead spricht man von einem Ölmann, nicht von einem Konzernherrn.
        en: >-
          Harlan Oil is big, but not where the customers fill up – or the bank doubts its books. In
          Hallstead they speak of an oilman, not of a magnate.
    verkauft:
      title: { de: "Der kluge Mann", en: "The Wise Man" }
      text:
        de: >-
          Jacob Harlan hat verkauft. Harold Pruett zahlt bar, wie immer, und Harlan Oil verschwindet
          in einem größeren Namen. Jacob hat Zeit – zum ersten Mal seit Salt Hill.
        en: >-
          Jacob Harlan has sold. Harold Pruett pays in cash, as always, and Harlan Oil disappears into
          a bigger name. Jacob has time – for the first time since Salt Hill.
    abgesetzt:
      title: { de: "Abgesetzt", en: "Ousted" }
      text:
        de: >-
          Der Aufsichtsrat hat Jacob Harlan abgesetzt, mitten im Kampf um die Marke. Die Herren
          sprechen von einer neuen Zeit. Jacob hört das Wort zum ersten Mal über sich selbst.
        en: >-
          The board has ousted Jacob Harlan in the middle of the battle for the brand. The gentlemen
          speak of a new era. Jacob hears the phrase used about himself for the first time.
    geschluckt:
      title: { de: "Geschluckt", en: "Swallowed" }
      text:
        de: >-
          Thornes Strohmänner haben über Jahre gekauft, Block um Block. Jetzt gehört ihm mehr von
          Harlan Oil als Jacob – und die Tankstellen tragen bald seinen Namen.
        en: >-
          Thorne's straw men bought for years, block by block. Now he owns more of Harlan Oil than
          Jacob – and the filling stations will soon bear his name.
    haft:
      title: { de: "Hinter Gittern", en: "Behind Bars" }
      text:
        de: >-
          Die Akten haben gereicht. Jacob Harlan geht ins Bundesgefängnis, und in Cordova erzählt man
          sich, wer die Akte geöffnet hat.
        en: >-
          The files were enough. Jacob Harlan goes to federal prison, and in Cordova people tell each
          other who opened the file.
  goals:
    brand: { de: "Eigene Marke in mindestens {regionen} Regionen oder {anteil} Marktanteil", en: "Own brand in at least {regionen} regions or {anteil} market share" }
    rating: { de: "Am Kapitelende mindestens Rating {rating}", en: "At least rating {rating} at the chapter's end" }
  next:
    title: { de: "Ende des Early-Access-Umfangs – Kapitel 4 folgt", en: "End of the Early Access Scope – Chapter 4 Follows" }
    text:
      de: >-
        Hier endet, was CRUDE bisher erzählt: drei Kapitel, zwei Zeitsprünge, vierundzwanzig Jahre
        im Leben von Jacob Harlan. Kapitel 4 „Der Magnat“ folgt – danke fürs Spielen!
      en: >-
        This is where CRUDE's story ends for now: three chapters, two time skips, twenty-four years
        in the life of Jacob Harlan. Chapter 4 “The Tycoon” follows – thanks for playing!
