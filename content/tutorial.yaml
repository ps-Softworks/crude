# Einstieg (2.13): Tutorial-Hinweise für die ersten Runden. Die Simulation
# (src/sim/tutorial.ts) sucht aus dem Spielzustand aus, WELCHER Hinweis kommt;
# hier steht nur, wie er klingt. Jeder Text mit Sprachschlüssel de/en.
# Platzhalter in geschweiften Klammern füllt das Spiel ein:
#   {ort}     Ranch auf der Karte, z. B. Moss-Farm
#   {kosten}  Betrag in $
#   {chance}  Prognose, z. B. 35–60 % Fundchance
#   {quelle}  wer sie stellt – je Wissensstufe der Ranch (sources unten), z. B. „nach deinem Ritt rechnest du mit“
#   {weg}     Fuhrwerk oder Bahn
#   {schwelle} ab welcher Chance sich das Tieferbohren lohnt, z. B. 6 % (Spielspaß K1)
# Ab 0.2.15+10 nennen die Texte die Gegenstände am Schreibtisch mit Kürzel
# (Wandkarte K, Kassenbuch G, Frachtmappe V, Glocke E).
# ENTWURF: Ton und Wortwahl sind Vorschläge.

title:
  de: Einstieg
  en: Getting started

steps:
  lease:
    de: Pacht
    en: Lease
  drill:
    de: Bohrung
    en: Drilling
  sell:
    de: Verkauf
    en: Sale

hints:
  # Schritt 1: Land sichern.
  explore:
    de: Was du über das Land weißt, ist bisher Gerede. Reite hin und sieh selbst nach – Sickerstellen, Salzwasser, Hügelzüge. Öffne den Kalender (T) und buche „Übers Land reiten“ für {ort}, oder klick die Ranch auf der Wandkarte (K) an. Das kostet zwei Termine, keinen Cent.
    en: What you know about the land so far is talk. Ride out and see for yourself – seeps, salt water, ridges. Open the calendar (T) and book “Ride the country” for {ort}, or click the ranch on the wall map (K). It costs two appointments, not a cent.
  lease_option:
    de: Ohne Land kein Öl. Du hast eine Option auf {ort} – {quelle} {chance}. Öffne die Wandkarte (K), klick die golden umrandete Ranch mit dem Fähnchen „hier“ an und wähle „Option einlösen“ ({kosten}) – das ist der Preis, den du dir mit der Option gesichert hast. Danach gehört dir die Pacht.
    en: No land, no oil. You hold an option on {ort} – {quelle} {chance}. Open the wall map (K), click the ranch and choose “Exercise option” ({kosten}) – the price you locked in with the option. Then the lease is yours.
  lease_buy:
    de: Ohne Land kein Öl. {ort} sieht gut aus – {quelle} {chance}. Öffne die Wandkarte (K) – die Ranch ist dort golden umrandet und trägt ein Fähnchen „hier“. Klick sie an und wähle „Pacht kaufen“ ({kosten}). Behalte Geld für die Bohrung übrig.
    en: No land, no oil. {ort} looks promising – {quelle} {chance}. Open the wall map (K) – the ranch has a gold frame and a “here” flag. Click it and choose “Buy lease” ({kosten}). Keep money aside for the drilling.
  lease_none:
    de: Für Pacht und Bohrung reicht das Geld gerade nicht. Die Bank leiht dir etwas (Kassenbuch, G) – oder du läutest die Glocke (E) und wartest auf Einnahmen.
    en: There is not enough money for a lease and a well right now. The bank will lend you some (ledger, G) – or ring the bell (E) and wait for income.
  loan_lease:
    de: Für Pacht und Bohrung reicht die Kasse nicht mehr. Kein Wildcatter bohrt mit eigenem Geld – leih dir im Kassenbuch (G) {kosten}, dann pachte {ort}.
    en: Your cash no longer covers a lease and a well. No wildcatter drills with his own money – borrow {kosten} in the ledger (G), then lease {ort}.

  # Schritt 2: bohren.
  drill:
    de: Deine Pacht auf {ort} ist bereit. Klick sie auf der Wandkarte (K) an und wähle „Bohren“ ({kosten}). Der Turm braucht eine Runde für die erste Stufe.
    en: Your lease on {ort} is ready. Click it on the wall map (K) and choose “Drill” ({kosten}). The rig needs one round for the first stage.
  drill_no_money:
    de: Deine Pacht auf {ort} wartet, aber die Bohrung kostet {kosten}. Hol dir das Geld im Kassenbuch (G), sonst verfällt die Pacht ungenutzt.
    en: Your lease on {ort} is waiting, but drilling costs {kosten}. Get the money in the ledger (G), or the lease will lapse unused.
  loan_drill:
    de: Deine Pacht auf {ort} wartet, aber für die Bohrung fehlt Geld. Leih dir im Kassenbuch (G) {kosten} – sonst verfällt die Pacht ungenutzt.
    en: Your lease on {ort} is waiting, but there is no money for the drilling. Borrow {kosten} in the ledger (G) – or the lease will lapse unused.
  drill_wait:
    de: Der Turm bohrt. Läute die Glocke (E) – erst danach zeigt sich, ob in der Tiefe Öl liegt.
    en: The rig is drilling. Ring the bell (E) – only then will you know whether there is oil down there.
  deeper:
    de: Auf {ort} war in dieser Tiefe nichts. Für die nächste Stufe stehen noch {chance} – lohnen würde es schon ab {schwelle}, denn tief unten sind die Funde größer. Wähle „Tiefer bohren“ ({kosten}).
    en: Nothing at this depth on {ort}. The next stage still has {chance} – it would pay from {schwelle}, because finds are bigger deep down. Choose “Drill deeper” ({kosten}).
  abandon:
    de: Auf {ort} war in dieser Tiefe nichts, und der Geologe gibt der nächsten Stufe weniger, als sich lohnen würde (steht im Ranch-Fenster). Wähle „Aufgeben“ – dann ist der Turm frei für eine neue Pacht.
    en: Nothing at this depth on {ort}, and the geologist gives the next stage less than it would take to pay off (see the ranch window). Choose “Abandon” – then the rig is free for a new lease.
  fish:
    de: Auf {ort} klemmt das Werkzeug. Wähle „Fischen“ ({kosten}), um es zu bergen – dann bohrt der Turm weiter.
    en: The tool is stuck on {ort}. Choose “Fish” ({kosten}) to recover it – then the rig carries on.
  fish_abandon:
    de: Auf {ort} klemmt das Werkzeug, und für die Bergung fehlt das Geld. Wähle „Aufgeben“ – dann ist der Turm wieder frei.
    en: The tool is stuck on {ort} and there is no money to recover it. Choose “Abandon” – then the rig is free again.
  found_wait:
    de: Öl auf {ort}! Die Quelle fördert ab jetzt jede Runde in deinen Tank. Läute die Glocke (E), dann kannst du verkaufen.
    en: Oil on {ort}! From now on the well pumps into your tank every round. Ring the bell (E), then you can sell.

  # Schritt 3: verkaufen.
  sell:
    de: Im Tank liegt Öl. In der Frachtmappe unter „Verkauf“ (V) kauft der Crane Trust es dir ab – per {weg} bleibt dir am meisten je Barrel. Wähle „Per {weg} verkaufen“.
    en: There is oil in your tank. In the freight folder under “Sale” (V) the Crane Trust buys it – by {weg} you keep the most per barrel. Choose “Sell by {weg}”.
  sold:
    de: Verkauft! Pacht, Bohrung, Verkauf – das ist der Kreislauf am Salt Hill. Läute die Glocke (E). Ab jetzt sagt dir Ruths Zettel auf der Schreibunterlage, was ansteht.
    en: Sold! Lease, drill, sell – that is the cycle at Salt Hill. Ring the bell (E). From now on Ruth's note on the blotter tells you what is next.

# Fassungen für die Karte (0.2.15+11): Im Ranch-Fenster und am Kartenrand ist man
# schon auf der Karte – dort fällt der Weg („Öffne die Wandkarte …“) weg. Fehlt
# ein Hinweis hier, gilt der Text oben. Gleiche Platzhalter wie oben.
onMap:
  explore:
    de: Was du über das Land weißt, ist bisher Gerede. Klick {ort} an und wähle „Übers Land reiten“ – zwei Termine, dann weißt du mehr über die Ranch und zwei Nachbarn.
    en: What you know about the land so far is talk. Click {ort} and choose “Ride the country” – two appointments, and you will know more about the ranch and two neighbours.
  lease_option:
    de: Ohne Land kein Öl. Du hast eine Option auf {ort} – {quelle} {chance}. Klick die Ranch an und wähle „Option einlösen“ ({kosten}) – dein gesicherter Preis.
    en: No land, no oil. You hold an option on {ort} – {quelle} {chance}. Click the ranch and choose “Exercise option” ({kosten}) – your locked-in price.
  lease_buy:
    de: Ohne Land kein Öl. {ort} sieht gut aus – {quelle} {chance}. Klick die Ranch (goldener Rahmen, Fähnchen „hier“) an und wähle „Pacht kaufen“ ({kosten}).
    en: No land, no oil. {ort} looks promising – {quelle} {chance}. Click the ranch (gold frame, “here” flag) and choose “Buy lease” ({kosten}).
  drill:
    de: Deine Pacht auf {ort} ist bereit. Wähle „Bohren“ ({kosten}). Der Turm braucht eine Runde für die erste Stufe.
    en: Your lease on {ort} is ready. Choose “Drill” ({kosten}). The rig needs one round for the first stage.

# Wer die Prognose stellt (Platzhalter {quelle}, 0.4.19+2) – je Wissensstufe der Ranch.
# Ritt, Farmer und Geologe sind verschiedene Stufen; der Text soll das nicht verwischen.
sources:
  geruecht:
    de: nach dem, was man sich erzählt, rechnest du mit
    en: going by what people say, you reckon on
  ritt:
    de: nach deinem eigenen Ritt rechnest du mit
    en: going by your own ride, you reckon on
  karte:
    de: nach der Karte des Geologen rechnest du mit
    en: going by the geologist's map, you reckon on
  bericht:
    de: nach dem Bohrbericht rechnest du mit
    en: going by the drilling log, you reckon on
