# Planungsbrett und Erkundung (Termine als Hauptwerkzeug, Etappe 1 und 2). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Zahlen der Karten stehen in balance.yaml unter
# plans.cards, die Regeln in src/sim/plans.ts und src/sim/exploration.ts, für die Reiter Markt
# und Fracht (Etappe 2) in src/sim/pricing.ts und src/sim/freight.ts.
# Feste Termine ohne eigene Karte (Abend mit Ruth, Sonntag am Fluss …) nehmen Titel und
# Text aus ihrem Ereignis in content/events/.

title: { de: "Planungsbrett", en: "Planning Board" }

tabs:
  land: { de: "Land", en: "Land" }
  markt: { de: "Markt", en: "Market" }
  fracht: { de: "Fracht", en: "Freight" }
  leute: { de: "Leute", en: "People" }

cards:
  ritt:
    title: { de: "Übers Land reiten", en: "Ride the Country" }
    text:
      de: "Einen Tag im Sattel: die Ranch und zwei Nachbarn ablaufen, nach Sickerstellen, Salzwasser und Hügelzügen sehen."
      en: "A day in the saddle: walk the ranch and two neighbours, looking for seeps, salt water and ridges."
    risk: { de: "Ein langer Tag im Sattel kostet Kraft.", en: "A long day in the saddle costs strength." }
  farmer:
    title: { de: "Alten Farmer fragen", en: "Ask the Old Farmer" }
    text:
      de: "Wer seit vierzig Jahren Wasser aus demselben Brunnen zieht, weiß, ob es einmal nach Öl roch."
      en: "A man who has drawn water from the same well for forty years knows whether it ever smelled of oil."
    risk: { de: "Ein gieriger Farmer erzählt gern, was den Pachtpreis hebt.", en: "A greedy farmer likes to tell what raises the lease price." }
  geologe_einstellen:
    title: { de: "Geologen einstellen", en: "Hire a Geologist" }
    text:
      de: "Ein Geologe aus Port Ellis mit Hammer, Lupe und Notizbuch. Ordentliche Arbeit, eigene Meinung."
      en: "A geologist from Port Ellis with hammer, lens and notebook. Decent work, opinions of his own."
    risk: { de: "Ob er schönfärbt oder schwarzmalt, zeigt erst seine Trefferbilanz. Kostet Lohn jede Runde.", en: "Whether he flatters or doubts only shows in his record. Costs wages every round." }
  geologe_hale:
    title: { de: "Hale anheuern", en: "Hire Hale" }
    text:
      de: "Hale sitzt jeden Abend im Saloon und kennt angeblich jede Formation in Cordova. Er ist billig."
      en: "Hale sits in the saloon every evening and claims to know every formation in Cordova. He is cheap."
    risk: { de: "Ungenau – und er sieht überall Öl.", en: "Imprecise – and he sees oil everywhere." }
  geologe_hallstead:
    title: { de: "Geologen aus Hallstead holen", en: "Bring a Geologist from Hallstead" }
    text:
      de: "Dr. Merriweather lehrt an der Universität und kommt nur, wenn man ihn persönlich abholt. Seine Karten sind die besten im Land."
      en: "Dr. Merriweather teaches at the university and only comes if fetched in person. His maps are the best in the land."
    risk: { de: "Drei Tage Reise und teurer Lohn.", en: "Three days of travel and a steep wage." }
  geologe_besprechung:
    title: { de: "Mit dem Geologen kartieren", en: "Map with the Geologist" }
    text:
      de: "Einen Tag mit dem Geologen über der Karte und draußen auf dem Land: Er kartiert die Ranch und zwei Nachbarn."
      en: "A day with the geologist over the map and out on the land: he maps the ranch and two neighbours."
    risk: { de: "So gut wie der Geologe – nicht besser.", en: "As good as the geologist – no better." }
  bohrbericht:
    title: { de: "Bohrbericht kaufen", en: "Buy a Drilling Log" }
    text:
      de: "Bullards Bohrmeister trinkt gern und braucht Geld. Für ein paar Dollar erzählt er, was in einem Loch zum Vorschein kam."
      en: "Bullard's driller likes his drink and needs money. For a few dollars he tells what came up in a hole."
    risk: { de: "Nur, wo gebohrt wurde. Was er über das Loch sagt, gilt fast sicher – und ein wenig für die Nachbarn.", en: "Only where someone drilled. What he says about the hole is nearly certain – and a little for the neighbours." }
  tagebuch:
    title: { de: "Bullards Bohrtagebuch lesen", en: "Read Bullard's Drilling Diary" }
    text:
      de: "Nachts in Bullards Bohrhütte, mit einer Laterne und einem Notizblock: Sein Tagebuch verrät, wo er Ölsand fand."
      en: "At night in Bullard's drilling shack, with a lantern and a notepad: his diary tells where he found oil sand."
    risk: { de: "Eine Nacht ohne Schlaf. Wird Jacob erwischt, gibt es Fehde mit Bullard.", en: "A night without sleep. If Jacob is caught, it means a feud with Bullard." }
  rute:
    title: { de: "Rutengänger bestellen", en: "Hire a Dowser" }
    text:
      de: "Der alte Lemuel Haskett läuft mit seiner Haselrute über das Land. Die Bohrleute schwören darauf."
      en: "Old Lemuel Haskett walks the land with his hazel rod. The drillers swear by it."
    risk: { de: "Reiner Zufall – aber die Männer sind danach besserer Laune.", en: "Pure chance – but the men are in better spirits afterwards." }
  feldinspektion:
    title: { de: "Feldinspektion", en: "Field Inspection" }
    text:
      de: "Mit Silas die Leitungen abgehen und die Lecks finden, bevor das Öl im Boden versickert."
      en: "Walk the lines with Silas and find the leaks before the oil soaks into the ground."
    risk: { de: "Kostet etwas Kraft.", en: "Costs a little strength." }

  # --- Reiter Markt (Etappe 2): den Ölpreis selbst bewegen ---
  foerderbremse:
    title: { de: "Förderbremse gründen", en: "Found a Production Pact" }
    text:
      de: "Ein Abend im Saloon mit den kleinen Wildcattern: Alle drosseln ihre Pumpen für vier Runden, damit der Trust nicht im Öl ertrinkt – und der Preis steigt. Wer mitmacht, entscheidet jeder selbst."
      en: "An evening in the saloon with the small wildcatters: everyone throttles their pumps for four rounds so the Trust doesn't drown in oil – and the price rises. Each decides for himself whether to join."
    risk: { de: "Jede Runde kann einer heimlich voll fördern; bricht mehr als ein Drittel, platzt der Pakt – und keiner traut Jacob mehr. Steigt der Preis zu hoch, schlägt Crane zurück.", en: "Each round someone may secretly pump full; if more than a third break, the pact collapses – and nobody trusts Jacob any more. If the price climbs too high, Crane strikes back." }
  pakt_halten:
    title: { de: "Pakt zusammenhalten", en: "Hold the Pact Together" }
    text:
      de: "Bei den Bohrstellen der Mitglieder vorbeireiten, Hände schütteln, nachzählen. Wer gesehen wird, betrügt seltener."
      en: "Ride past the members' rigs, shake hands, count barrels. Whoever is watched cheats less."
    risk: { de: "Ohne diesen Termin wächst die Versuchung bei allen.", en: "Without this appointment temptation grows for everyone." }
  pakt_verlaengern:
    title: { de: "Förderbremse verlängern", en: "Extend the Pact" }
    text:
      de: "Die vier Runden sind bald um. Noch einmal alle an einen Tisch – vier Runden mehr."
      en: "The four rounds are nearly up. Everyone around the table once more – four more rounds."
    risk: { de: "Je länger der Pakt läuft, desto größer die Versuchung zu betrügen.", en: "The longer the pact runs, the greater the temptation to cheat." }
  bullard_einladen:
    title: { de: "Bullard einladen", en: "Invite Bullard" }
    text:
      de: "Ohne Bullard ist jede Förderbremse löchrig. Mit Handschlag kommt er vielleicht, in Fehde nie."
      en: "Without Bullard any pact leaks. With a handshake he might come, in a feud never."
    risk: { de: "Drinnen kann er brechen und alles auf einmal fördern; draußen fährt er manchmal voll auf.", en: "Inside he may break and pump everything at once; outside he sometimes goes full throttle." }
  zur_rede:
    title: { de: "Zur Rede stellen", en: "Confront Him" }
    text:
      de: "Jacob reitet zum Verdächtigen, nachts, wenn die Pumpe laufen sollte. Wer erwischt wird, hält sich ab jetzt an den Pakt."
      en: "Jacob rides to the suspect at night, when the pump shouldn't be running. Whoever is caught keeps to the pact from now on."
  liefervertrag:
    title: { de: "Liefervertrag mit dem Händler", en: "Supply Contract with the Trader" }
    text:
      de: "Der unabhängige Händler in Port Ellis zahlt einen festen Preis für eine feste Menge je Runde – etwas unter dem heutigen Preis, je länger, desto weniger. Dafür ist er sicher, wenn am Salt Hill neue Quellen den Preis drücken."
      en: "The independent trader in Port Ellis pays a fixed price for a fixed quantity each round – a little below today's price, the longer the deal, the less. In return it is safe when new wells at Salt Hill push the price down."
    risk: { de: "Fehlmenge kostet Strafe, steigt der Preis, verschenkt Jacob Geld, und Crane grollt die ganze Zeit. Im Kreditcrash kann der Händler pleitegehen.", en: "Shortfalls cost penalties, if the price rises Jacob gives money away, and Crane bears a grudge the whole time. In a credit crash the trader may go bust." }
  geruecht:
    title: { de: "Gerücht streuen", en: "Spread a Rumour" }
    text:
      de: "Ein paar Dollar für einen Zeilenschinder des Courier und ein paar Runden im Saloon: Was die Händler glauben, bewegt den Preis – nicht nur eine Runde lang."
      en: "A few dollars for a Courier hack and a few rounds in the saloon: what the traders believe moves the price – for more than one round."
    risk: { de: "Jedes Gerücht wirkt schwächer als das letzte – und fliegt leichter auf. Dann deckt Nora Whitlock auf, woher es kam: Sie redet nie wieder mit Jacob, Crane zahlt sofort weniger, und nach einem falschen Versiegen fällt der Preis, weil sich die Händler betrogen fühlen.", en: "Each rumour works less than the last – and is easier to expose. Then Nora Whitlock finds out where it came from: she never speaks to Jacob again, Crane pays less at once, and after a false drying-up the price falls because the traders feel cheated." }
  crane_feilschen:
    title: { de: "Mit Crane feilschen", en: "Haggle with Crane" }
    text:
      de: "Ins Kontor des Trusts, mit allem, was Jacob in der Hand hat: Verträge, eigene Wege, einen Pakt, volle Tanks. Je mehr, desto weiter gibt Crane nach."
      en: "Into the Trust's office with everything Jacob holds: contracts, his own routes, a pact, full tanks. The more, the further Crane gives way."
    risk: { de: "Crane ist launisch, gibt nie gern nach und schon gar nicht zweimal kurz hintereinander. Reicht es nicht, gilt Jacob als Bittsteller: Der Abschlag kommt sofort und dauert länger. Cranes bestes Angebot hat einen Preis: Verrat an den Unabhängigen.", en: "Crane is moody, never likes to give way, least of all twice in a short time. If it is not enough, Jacob counts as a supplicant: the discount comes at once and lasts longer. Crane's best offer has a price: betraying the independents." }

  # --- Reiter Fracht (Etappe 2): die Frachtkosten drücken ---
  thorne_vorsprechen:
    title: { de: "Bei Thorne vorsprechen", en: "Call on Thorne" }
    text:
      de: "In Thornes Büro am Bahnhof: Druck gegen Widerstand. Gebündelte Mengen, Ausweichwege, eine Pipeline oder ein Gesetz in Hallstead – je mehr Jacob in der Hand hat, desto weiter geht der Tarif herunter."
      en: "In Thorne's office at the station: pressure against resistance. Bundled volumes, other routes, a pipeline or a bill in Hallstead – the more Jacob holds, the further the rate comes down."
    risk: { de: "Thornes Laune ist nicht vorherzusagen. Ohne genug Druck gibt es eine Abfuhr: Der Tarif steigt sofort, und er erhöht danach öfter. Wer mit Ausweichwegen droht, dem lässt Thorne am Bahnhof nachzählen – nicht jede Woche, aber wer dann das meiste per Bahn schickt, zahlt sofort deutlich mehr.", en: "Thorne's mood cannot be predicted. Without enough pressure he sends Jacob away: the rate rises at once, and he raises it more often afterwards. Whoever threatens other routes gets counted at the station – not every week, but whoever then ships most by rail pays a lot more at once." }
  brennan:
    title: { de: "Brennan unter Vertrag nehmen", en: "Put Brennan Under Contract" }
    text:
      de: "Brennan und seine Fuhrleute fahren vier Runden lang nur für Jacob – billiger als die Mietfuhrwerke und mit mehr Platz."
      en: "Brennan and his teamsters haul only for Jacob for four rounds – cheaper than hired wagons and with more room."
    risk: { de: "Unter der Mindestmenge zahlt Jacob die wartenden Fuhrleute jede Runde trotzdem – auch wenn die Bahn gerade billiger ist. Thorne wird versuchen, Brennan abzuwerben.", en: "Below the minimum Jacob still pays the waiting teamsters every round – even when the railway happens to be cheaper. Thorne will try to lure Brennan away." }
  transportgemeinschaft:
    title: { de: "Transportgemeinschaft gründen", en: "Found a Freight Pool" }
    text:
      de: "Die kleinen Wildcatter verladen ihr Öl gemeinsam mit Jacobs – große Mengen sind ein Druckmittel gegen Thorne, und solange die Gemeinschaft läuft, gibt er Rabatt auf Jacobs Bahnfracht. Auf Wunsch bauen sie eine Pipeline zusammen."
      en: "The small wildcatters load their oil together with Jacob's – big volumes are leverage against Thorne, and while the pool lasts he gives a discount on Jacob's rail freight. If wanted, they build a pipeline together."
    risk: { de: "Der Rabatt gilt gegen eine Zusage an Thorne: Fährt die Gemeinschaft zusammen weniger als vereinbart, zahlt Jacob jede Runde Strafe. Wer sich vernachlässigt fühlt, springt ab – dann wird die Zusage schnell zu groß. Eine gemeinsame Pipeline ist billiger, trägt aber auch fremdes Öl.", en: "The discount comes with a promise to Thorne: if the pool ships less than agreed, Jacob pays a penalty every round. Whoever feels neglected jumps ship – and the promise soon becomes too big. A shared pipeline is cheaper but also carries others' oil." }
  gemeinschaft_halten:
    title: { de: "Gemeinschaft zusammenhalten", en: "Hold the Pool Together" }
    text:
      de: "Beim Verladen helfen, Streit um die Waggons schlichten. In dieser Runde springt niemand ab."
      en: "Help with loading, settle quarrels over the wagons. Nobody jumps ship this round."
  exklusiv_kuendigen:
    title: { de: "Exklusivvertrag kündigen", en: "Cancel the Exclusive Contract" }
    text:
      de: "Raus aus Thornes Exklusivvertrag – mit einer Abfindung und genug Druck, dass er es hinnimmt."
      en: "Out of Thorne's exclusive contract – with a settlement and enough pressure that he accepts it."
    risk: { de: "Teuer. Ohne Druckmittel lacht Thorne nur.", en: "Expensive. Without leverage Thorne just laughs." }

  # 0.4.20+31 Deals im Adressbuch (Regeln src/sim/deals.ts).
  bank_zins:
    title: { de: "Zins nachverhandeln", en: "Renegotiate the Rate" }
    text:
      de: "Mr. Pettibone empfängt im Hinterzimmer der Salt Hill Savings. Wer pünktlich zahlt, bekommt vielleicht einen Punkt nachgelassen – auf alle Bankkredite."
      en: "Mr. Pettibone receives in the back room of Salt Hill Savings. Pay on time and he may knock a point off – on every bank loan."
    risk: { de: "Sagt er nein, darf Jacob ein Jahr lang nicht wiederkommen.", en: "If he says no, Jacob may not come back for a year." }
  bank_stundung:
    title: { de: "Zinsen stunden", en: "Defer the Interest" }
    text:
      de: "Diese Runde keine Bankzinsen aus der Kasse – die Bank schlägt sie auf die Schuld, mit Aufschlag."
      en: "No bank interest out of the till this round – the bank adds it to the debt, with a surcharge."
    risk: { de: "Teures Geld: Die Schuld wächst um mehr, als die Zinsen gekostet hätten.", en: "Expensive money: the debt grows by more than the interest would have cost." }
  bank_pfand:
    title: { de: "Bohrturm verpfänden", en: "Pledge a Rig" }
    text:
      de: "Ein eigener Bohrturm als Sicherheit – dafür räumt die Bank mehr Kredit ein. Der Turm bohrt weiter."
      en: "One of Jacob's own rigs as security – in return the bank extends more credit. The rig keeps drilling."
    risk: { de: "Versäumt Jacob eine Zahlung, gehört der Turm der Bank. Dann zahlt er Miete.", en: "If Jacob misses a payment, the rig belongs to the bank. Then he pays rent." }
  bahn_festtarif:
    title: { de: "Festtarif mit Thorne", en: "Fixed Rate with Thorne" }
    text:
      de: "Thorne friert den Tarif ein – kein Aufschlag, solange der Vertrag läuft. Er will dafür Menge sehen."
      en: "Thorne freezes the rate – no increase while the contract runs. In return he wants volume."
    risk: { de: "Fährt Jacob weniger als die Mindestmenge per Bahn, zahlt er für jedes fehlende Barrel.", en: "If Jacob ships less than the minimum by rail, he pays for every missing barrel." }
  bahn_kontingent:
    title: { de: "Frachtkontingent kaufen", en: "Buy a Freight Allotment" }
    text:
      de: "Bahnfracht im Voraus, deutlich unter dem Tarif. Die Barrel fahren dann ohne weitere Fracht."
      en: "Rail freight paid in advance, well below the rate. Those barrels then travel without further freight."
    risk: { de: "Das Geld ist weg. Was in der Frist nicht gefahren ist, verfällt.", en: "The money is gone. Whatever isn't shipped in time is forfeit." }
  crane_vorschuss:
    title: { de: "Vorschuss von Crane", en: "Advance from Crane" }
    text:
      de: "Crane zahlt heute für Öl, das Jacob erst noch liefert – mit Abschlag. Geld jetzt, wenn die Kasse knapp ist."
      en: "Crane pays today for oil Jacob has yet to deliver – at a discount. Money now, when the till is tight."
    risk: { de: "Was nicht rechtzeitig an Crane geht, muss Jacob mit Aufschlag zurückzahlen.", en: "Whatever isn't delivered to Crane in time, Jacob must repay with a surcharge." }
  haendler_grossabnahme:
    title: { de: "Großabnahme", en: "Bulk Purchase" }
    text:
      de: "Der Händler hat einen Kunden an der Küste und nimmt diese Runde deutlich mehr – zu seinem besseren Preis."
      en: "The trader has a customer on the coast and takes much more this round – at his better price."
    risk: { de: "Crane merkt sich jeden Barrel, der am Trust vorbeigeht.", en: "Crane remembers every barrel that goes past the Trust." }
  turm_verleihen:
    title: { de: "Bohrturm verleihen", en: "Lend a Rig" }
    text:
      de: "Ein Nachbar braucht einen Turm. Steht einer still, bringt er Miete statt Staub."
      en: "A neighbour needs a rig. If one stands idle, it earns rent instead of dust."
    risk: { de: "Solange er weg ist, bohrt er nicht für Jacob – und er kommt nicht immer heil zurück.", en: "While it's away it doesn't drill for Jacob – and it doesn't always come back in one piece." }
  foerderzins:
    title: { de: "Förderzins nachverhandeln", en: "Renegotiate the Royalty" }
    text:
      de: "Bares auf den Tisch, und der Besitzer gibt ein paar Prozent vom Förderzins ab – für immer."
      en: "Cash on the table, and the owner gives up a few points of the royalty – for good."
    risk: { de: "Lohnt nur, wenn die Quelle lange genug fließt. Mancher Besitzer will gar nicht.", en: "Only pays off if the well flows long enough. Some owners won't hear of it." }
  interview:
    title: { de: "Interview im Courier", en: "Interview in the Courier" }
    text:
      de: "Nora Whitlock will über den neuen Mann am Salt Hill schreiben. Gute Presse macht die anderen Ölleute zugänglicher."
      en: "Nora Whitlock wants to write about the new man at Salt Hill. Good press makes the other oilmen more approachable."
    risk: { de: "Nora schreibt, was sie sieht – auch das, was Jacob lieber nicht gedruckt sähe.", en: "Nora writes what she sees – including what Jacob would rather not see in print." }
  wache:
    title: { de: "Wache an die Tanks", en: "Guard the Tanks" }
    text:
      de: "Sheriff Tatum stellt für ein paar Dollar einen Mann mit Flinte an die Tanks. Volle Tanks locken Diebe."
      en: "For a few dollars Sheriff Tatum posts a man with a shotgun at the tanks. Full tanks attract thieves."
    risk: { de: "Hält nur diese Runde.", en: "Only lasts this round." }

# Adressbuch (0.4.20+29): Stellen, die Jacob aufsuchen kann – Reihenfolge = Anzeige.
# Jede Karte aus balance.yaml plans.cards steht bei genau einer Stelle (cards), feste
# Termine ohne eigene Karte über ihr Ereignis (events). Was sonst nirgends steht, landet
# bei der letzten Stelle.
contacts:
  bank:
    name: { de: "Bank", en: "Bank" }
    who: { de: "Salt Hill Savings · Mr. Pettibone", en: "Salt Hill Savings · Mr. Pettibone" }
    cards: [bank_zins, bank_stundung, bank_pfand]
  geologen:
    name: { de: "Geologen", en: "Geologists" }
    who: { de: "Gutachter, Saloon-Kenner, Rutengänger", en: "Surveyors, saloon experts, dowsers" }
    cards: [geologe_einstellen, geologe_hale, geologe_hallstead, geologe_besprechung, rute]
  grundbesitzer:
    name: { de: "Grundbesitzer", en: "Landowners" }
    who: { de: "Farmer und Rancher am Salt Hill", en: "Farmers and ranchers at Salt Hill" }
    cards: [farmer, foerderzins]
  oelleute:
    name: { de: "Andere Ölleute", en: "Other Oilmen" }
    who: { de: "Bullard und die kleinen Förderer", en: "Bullard and the small producers" }
    cards: [foerderbremse, pakt_halten, pakt_verlaengern, transportgemeinschaft, gemeinschaft_halten, bullard_einladen, zur_rede, turm_verleihen]
    events: [termin_lohnbohren]
  eisenbahn:
    name: { de: "Eisenbahn", en: "Railway" }
    who: { de: "Thorne Golfbahn · Augustus Thorne", en: "Thorne Gulf Railway · Augustus Thorne" }
    cards: [thorne_vorsprechen, bahn_festtarif, bahn_kontingent, exklusiv_kuendigen]
  crane:
    name: { de: "Crane Trust", en: "Crane Trust" }
    who: { de: "Kontor im Hafen · Cornelius Crane", en: "Harbour office · Cornelius Crane" }
    cards: [crane_feilschen, crane_vorschuss]
  haendler:
    name: { de: "Händler in Port Ellis", en: "Trader in Port Ellis" }
    who: { de: "kauft unabhängig vom Trust", en: "buys independently of the Trust" }
    cards: [liefervertrag, haendler_grossabnahme]
  fuhrleute:
    name: { de: "Fuhrleute", en: "Teamsters" }
    who: { de: "Brennan und seine Gespanne", en: "Brennan and his teams" }
    cards: [brennan]
  zeitung:
    name: { de: "Zeitung", en: "Newspaper" }
    who: { de: "der Courier und seine Zeilenschinder", en: "the Courier and its hacks" }
    cards: [interview, geruecht]
  sheriff:
    name: { de: "Sheriff", en: "Sheriff" }
    who: { de: "Sheriff Tatum", en: "Sheriff Tatum" }
    cards: [wache]
  familie:
    name: { de: "Familie", en: "Family" }
    who: { de: "Ruth und die Kinder", en: "Ruth and the children" }
    events: [termin_ruth, termin_familie, termin_familie_k2, termin_familie_k3, termin_kinder_k3, termin_sonntag]
  selbst:
    name: { de: "Selbst erledigen", en: "Do It Yourself" }
    who: { de: "ohne Gesprächspartner", en: "no one to talk to" }
    cards: [ritt, bohrbericht, tagebuch, feldinspektion]

# Hinweise im Ranch-Fenster: was Jacob gesehen hat (seen) bzw. vergeblich gesucht (unseen).
clues:
  sickerstelle:
    seen: { de: "Sickerstelle am Bach – ein öliger Film auf dem Wasser", en: "Seep by the creek – an oily film on the water" }
    unseen: { de: "keine Sickerstelle", en: "no seep" }
  salzwasser:
    seen: { de: "Salzwasser im Brunnen", en: "Salt water in the well" }
    unseen: { de: "süßes Wasser im Brunnen", en: "sweet water in the well" }
  formation:
    seen: { de: "Hügelzug über dem Salzrücken", en: "A ridge above the salt" }
    unseen: { de: "flaches Land ohne Formation", en: "flat land without a formation" }
  brunnen:
    seen: { de: "Der alte Brunnen roch nach Öl", en: "The old well smelled of oil" }
    unseen: { de: "Der Brunnen gab immer nur Wasser", en: "The well only ever gave water" }
  kartierung:
    seen: { de: "Karte des Geologen: günstige Schichten", en: "Geologist's map: favourable strata" }
    unseen: { de: "Karte des Geologen: ungünstige Schichten", en: "Geologist's map: unfavourable strata" }
