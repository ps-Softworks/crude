# Planungsbrett und Erkundung (Termine als Hauptwerkzeug, Etappe 1 und 2). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Zahlen der Karten stehen in balance.yaml unter
# plans.cards, die Regeln in src/sim/plans.ts und src/sim/exploration.ts, für die Reiter Markt
# und Fracht (Etappe 2) in src/sim/pricing.ts und src/sim/freight.ts.
# Feste Termine ohne eigene Karte (Abend mit Ruth, Sonntag am Fluss …) nehmen Titel und
# Text aus ihrem Ereignis in content/events/.

title: { de: "Planungsbrett", en: "Planning Board" }

tabs:
  land: { de: "Land", en: "Land" }
  markt: { de: "Markt", en: "Market" }
  fracht: { de: "Fracht", en: "Freight" }
  leute: { de: "Leute", en: "People" }

cards:
  ritt:
    title: { de: "Übers Land reiten", en: "Ride the Country" }
    text:
      de: "Einen Tag im Sattel: die Ranch und zwei Nachbarn ablaufen, nach Sickerstellen, Salzwasser und Hügelzügen sehen."
      en: "A day in the saddle: walk the ranch and two neighbours, looking for seeps, salt water and ridges."
    risk: { de: "Ein langer Tag im Sattel kostet Kraft.", en: "A long day in the saddle costs strength." }
  farmer:
    title: { de: "Alten Farmer fragen", en: "Ask the Old Farmer" }
    text:
      de: "Wer seit vierzig Jahren Wasser aus demselben Brunnen zieht, weiß, ob es einmal nach Öl roch."
      en: "A man who has drawn water from the same well for forty years knows whether it ever smelled of oil."
    risk: { de: "Ein gieriger Farmer erzählt gern, was den Pachtpreis hebt.", en: "A greedy farmer likes to tell what raises the lease price." }
  geologe_einstellen:
    title: { de: "Geologen einstellen", en: "Hire a Geologist" }
    text:
      de: "Ein Geologe aus Port Ellis mit Hammer, Lupe und Notizbuch. Ordentliche Arbeit, eigene Meinung."
      en: "A geologist from Port Ellis with hammer, lens and notebook. Decent work, opinions of his own."
    risk: { de: "Ob er schönfärbt oder schwarzmalt, zeigt erst seine Trefferbilanz. Kostet Lohn jede Runde.", en: "Whether he flatters or doubts only shows in his record. Costs wages every round." }
  geologe_hale:
    title: { de: "Hale anheuern", en: "Hire Hale" }
    text:
      de: "Hale sitzt jeden Abend im Saloon und kennt angeblich jede Formation in Cordova. Er ist billig."
      en: "Hale sits in the saloon every evening and claims to know every formation in Cordova. He is cheap."
    risk: { de: "Ungenau – und er sieht überall Öl.", en: "Imprecise – and he sees oil everywhere." }
  geologe_hallstead:
    title: { de: "Geologen aus Hallstead holen", en: "Bring a Geologist from Hallstead" }
    text:
      de: "Dr. Merriweather lehrt an der Universität und kommt nur, wenn man ihn persönlich abholt. Seine Karten sind die besten im Land."
      en: "Dr. Merriweather teaches at the university and only comes if fetched in person. His maps are the best in the land."
    risk: { de: "Drei Tage Reise und teurer Lohn.", en: "Three days of travel and a steep wage." }
  geologe_besprechung:
    title: { de: "Mit dem Geologen kartieren", en: "Map with the Geologist" }
    text:
      de: "Einen Tag mit dem Geologen über der Karte und draußen auf dem Land: Er kartiert die Ranch und einen Nachbarn."
      en: "A day with the geologist over the map and out on the land: he maps the ranch and one neighbour."
    risk: { de: "So gut wie der Geologe – nicht besser.", en: "As good as the geologist – no better." }
  bohrbericht:
    title: { de: "Bohrbericht kaufen", en: "Buy a Drilling Log" }
    text:
      de: "Bullards Bohrmeister trinkt gern und braucht Geld. Für ein paar Dollar erzählt er, was in einem Loch zum Vorschein kam."
      en: "Bullard's driller likes his drink and needs money. For a few dollars he tells what came up in a hole."
    risk: { de: "Nur, wo gebohrt wurde. Was er über das Loch sagt, gilt fast sicher – und ein wenig für die Nachbarn.", en: "Only where someone drilled. What he says about the hole is nearly certain – and a little for the neighbours." }
  tagebuch:
    title: { de: "Bullards Bohrtagebuch lesen", en: "Read Bullard's Drilling Diary" }
    text:
      de: "Nachts in Bullards Bohrhütte, mit einer Laterne und einem Notizblock: Sein Tagebuch verrät, wo er Ölsand fand."
      en: "At night in Bullard's drilling shack, with a lantern and a notepad: his diary tells where he found oil sand."
    risk: { de: "Eine Nacht ohne Schlaf. Wird Jacob erwischt, gibt es Fehde mit Bullard.", en: "A night without sleep. If Jacob is caught, it means a feud with Bullard." }
  rute:
    title: { de: "Rutengänger bestellen", en: "Hire a Dowser" }
    text:
      de: "Der alte Lemuel Haskett läuft mit seiner Haselrute über das Land. Die Bohrleute schwören darauf."
      en: "Old Lemuel Haskett walks the land with his hazel rod. The drillers swear by it."
    risk: { de: "Reiner Zufall – aber die Männer sind danach besserer Laune.", en: "Pure chance – but the men are in better spirits afterwards." }
  feldinspektion:
    title: { de: "Feldinspektion", en: "Field Inspection" }
    text:
      de: "Mit Silas die Leitungen abgehen und die Lecks finden, bevor das Öl im Boden versickert."
      en: "Walk the lines with Silas and find the leaks before the oil soaks into the ground."
    risk: { de: "Kostet etwas Kraft.", en: "Costs a little strength." }

  # --- Reiter Markt (Etappe 2): den Ölpreis selbst bewegen ---
  foerderbremse:
    title: { de: "Förderbremse gründen", en: "Found a Production Pact" }
    text:
      de: "Ein Abend im Saloon mit den kleinen Wildcattern: Alle drosseln ihre Pumpen für vier Runden, damit der Trust nicht im Öl ertrinkt – und der Preis steigt. Wer mitmacht, entscheidet jeder selbst."
      en: "An evening in the saloon with the small wildcatters: everyone throttles their pumps for four rounds so the Trust doesn't drown in oil – and the price rises. Each decides for himself whether to join."
    risk: { de: "Jede Runde kann einer heimlich voll fördern; bricht mehr als ein Drittel, platzt der Pakt – und keiner traut Jacob mehr. Steigt der Preis zu hoch, schlägt Crane zurück.", en: "Each round someone may secretly pump full; if more than a third break, the pact collapses – and nobody trusts Jacob any more. If the price climbs too high, Crane strikes back." }
  pakt_halten:
    title: { de: "Pakt zusammenhalten", en: "Hold the Pact Together" }
    text:
      de: "Bei den Bohrstellen der Mitglieder vorbeireiten, Hände schütteln, nachzählen. Wer gesehen wird, betrügt seltener."
      en: "Ride past the members' rigs, shake hands, count barrels. Whoever is watched cheats less."
    risk: { de: "Ohne diesen Termin wächst die Versuchung bei allen.", en: "Without this appointment temptation grows for everyone." }
  pakt_verlaengern:
    title: { de: "Förderbremse verlängern", en: "Extend the Pact" }
    text:
      de: "Die vier Runden sind bald um. Noch einmal alle an einen Tisch – vier Runden mehr."
      en: "The four rounds are nearly up. Everyone around the table once more – four more rounds."
    risk: { de: "Je länger der Pakt läuft, desto größer die Versuchung zu betrügen.", en: "The longer the pact runs, the greater the temptation to cheat." }
  bullard_einladen:
    title: { de: "Bullard einladen", en: "Invite Bullard" }
    text:
      de: "Ohne Bullard ist jede Förderbremse löchrig. Mit Handschlag kommt er vielleicht, in Fehde nie."
      en: "Without Bullard any pact leaks. With a handshake he might come, in a feud never."
    risk: { de: "Drinnen kann er brechen und alles auf einmal fördern; draußen fährt er manchmal voll auf.", en: "Inside he may break and pump everything at once; outside he sometimes goes full throttle." }
  zur_rede:
    title: { de: "Zur Rede stellen", en: "Confront Him" }
    text:
      de: "Jacob reitet zum Verdächtigen, nachts, wenn die Pumpe laufen sollte. Wer erwischt wird, hält sich ab jetzt an den Pakt."
      en: "Jacob rides to the suspect at night, when the pump shouldn't be running. Whoever is caught keeps to the pact from now on."
  liefervertrag:
    title: { de: "Liefervertrag mit dem Händler", en: "Supply Contract with the Trader" }
    text:
      de: "Der unabhängige Händler in Port Ellis zahlt einen festen Preis für eine feste Menge je Runde – etwas unter dem heutigen Preis, je länger, desto weniger. Dafür ist er sicher, wenn am Salt Hill neue Quellen den Preis drücken."
      en: "The independent trader in Port Ellis pays a fixed price for a fixed quantity each round – a little below today's price, the longer the deal, the less. In return it is safe when new wells at Salt Hill push the price down."
    risk: { de: "Fehlmenge kostet Strafe, steigt der Preis, verschenkt Jacob Geld, und Crane grollt die ganze Zeit. Im Kreditcrash kann der Händler pleitegehen.", en: "Shortfalls cost penalties, if the price rises Jacob gives money away, and Crane bears a grudge the whole time. In a credit crash the trader may go bust." }
  geruecht:
    title: { de: "Gerücht streuen", en: "Spread a Rumour" }
    text:
      de: "Ein paar Dollar für einen Zeilenschinder des Courier und ein paar Runden im Saloon: Was die Händler glauben, bewegt den Preis der nächsten Runde."
      en: "A few dollars for a Courier hack and a few rounds in the saloon: what the traders believe moves next round's price."
    risk: { de: "Jedes Gerücht wirkt schwächer als das letzte – und fliegt leichter auf. Dann deckt Nora Whitlock auf, woher es kam: Sie redet nie wieder mit Jacob, und Crane zahlt weniger.", en: "Each rumour works less than the last – and is easier to expose. Then Nora Whitlock finds out where it came from: she never speaks to Jacob again, and Crane pays less." }
  crane_feilschen:
    title: { de: "Mit Crane feilschen", en: "Haggle with Crane" }
    text:
      de: "Ins Kontor des Trusts, mit allem, was Jacob in der Hand hat: Verträge, eigene Wege, einen Pakt, volle Tanks. Je mehr, desto weiter gibt Crane nach."
      en: "Into the Trust's office with everything Jacob holds: contracts, his own routes, a pact, full tanks. The more, the further Crane gives way."
    risk: { de: "Mit zu wenig in der Hand gilt Jacob als Bittsteller. Cranes bestes Angebot hat einen Preis: Verrat an den Unabhängigen.", en: "With too little in hand Jacob counts as a supplicant. Crane's best offer has a price: betraying the independents." }

  # --- Reiter Fracht (Etappe 2): die Frachtkosten drücken ---
  thorne_vorsprechen:
    title: { de: "Bei Thorne vorsprechen", en: "Call on Thorne" }
    text:
      de: "In Thornes Büro am Bahnhof: Druck gegen Widerstand. Gebündelte Mengen, Ausweichwege, eine Pipeline oder ein Gesetz in Hallstead – je mehr Jacob in der Hand hat, desto weiter geht der Tarif herunter."
      en: "In Thorne's office at the station: pressure against resistance. Bundled volumes, other routes, a pipeline or a bill in Hallstead – the more Jacob holds, the further the rate comes down."
    risk: { de: "Thornes Laune ist nicht vorherzusagen. Ohne genug Druck gibt es eine Abfuhr, und er erhöht danach öfter. Wer mit Ausweichwegen droht und dann doch alles per Bahn schickt, wird erwischt.", en: "Thorne's mood cannot be predicted. Without enough pressure he sends Jacob away and raises the rate more often. Whoever threatens other routes and then ships everything by rail gets caught." }
  brennan:
    title: { de: "Brennan unter Vertrag nehmen", en: "Put Brennan Under Contract" }
    text:
      de: "Brennan und seine Fuhrleute fahren vier Runden lang nur für Jacob – billiger als die Mietfuhrwerke und mit mehr Platz."
      en: "Brennan and his teamsters haul only for Jacob for four rounds – cheaper than hired wagons and with more room."
    risk: { de: "Unter der Mindestmenge zahlt Jacob die wartenden Fuhrleute trotzdem. Thorne wird versuchen, Brennan abzuwerben.", en: "Below the minimum Jacob still pays the waiting teamsters. Thorne will try to lure Brennan away." }
  transportgemeinschaft:
    title: { de: "Transportgemeinschaft gründen", en: "Found a Freight Pool" }
    text:
      de: "Die kleinen Wildcatter verladen ihr Öl gemeinsam mit Jacobs – große Mengen sind ein Druckmittel gegen Thorne. Auf Wunsch bauen sie eine Pipeline zusammen."
      en: "The small wildcatters load their oil together with Jacob's – big volumes are leverage against Thorne. If wanted, they build a pipeline together."
    risk: { de: "Wer sich vernachlässigt fühlt, springt ab. Eine gemeinsame Pipeline ist billiger, trägt aber auch fremdes Öl.", en: "Whoever feels neglected jumps ship. A shared pipeline is cheaper but also carries others' oil." }
  gemeinschaft_halten:
    title: { de: "Gemeinschaft zusammenhalten", en: "Hold the Pool Together" }
    text:
      de: "Beim Verladen helfen, Streit um die Waggons schlichten. In dieser Runde springt niemand ab."
      en: "Help with loading, settle quarrels over the wagons. Nobody jumps ship this round."
  exklusiv_kuendigen:
    title: { de: "Exklusivvertrag kündigen", en: "Cancel the Exclusive Contract" }
    text:
      de: "Raus aus Thornes Exklusivvertrag – mit einer Abfindung und genug Druck, dass er es hinnimmt."
      en: "Out of Thorne's exclusive contract – with a settlement and enough pressure that he accepts it."
    risk: { de: "Teuer. Ohne Druckmittel lacht Thorne nur.", en: "Expensive. Without leverage Thorne just laughs." }

