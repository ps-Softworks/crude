      marks: [ruth_finanzen]

# Entwurf – Philipp überarbeitet.
# Spät im Kapitel: Familie gegen Rat. Doktor Haskell ist alt geworden.
- id: k2_ruth_clara
  title:
    de: Claras Fieber
    en: Clara's Fever
  text:
    de: >-
      Clara hat seit zwei Tagen Fieber. Doktor Haskell, der inzwischen am Stock
      geht, will sie heute noch im Krankenhaus in Port Ellis sehen. Am selben Abend
      stimmt der Aufsichtsrat über die Dividende ab. Ruth hat den Mantel schon an
      und sieht Jacob an: Einer muss fahren, und einer muss in die Sitzung.
    en: >-
      Clara has had a fever for two days. Doctor Haskell, who walks with a cane
      now, wants to see her at the hospital in Port Ellis tonight. That same
      evening the board votes on the dividend. Ruth already has her coat on and
      looks at Jacob: one of them must drive, and one must go to the meeting.
  conditions: { minChapter: 2, maxChapter: 2, minRound: 12 }
  certain: true
  choices:
    - id: jacob_faehrt
      label: { de: "Selbst fahren – der Rat soll ohne ihn beschließen", en: "Drive himself – let the board decide without him" }
      result:
        de: >-
          Jacob sitzt die Nacht am Bett. Clara hält seinen Daumen, auch im Schlaf.
          Der Rat beschließt ohne ihn eine hohe Dividende; das Geld fehlt im
          nächsten Quartal in der Kasse.
        en: >-
          Jacob sits by the bed all night. Clara holds his thumb, even in her sleep.
          Without him the board votes a high dividend; the money is missing from the
          till next quarter.
      # TODO-Effekt: clara: +15, control: -1, dividendPressure: +1
      effects: { ruth: 10, cash: -4000, strength: -5 }
      marks: [clara_k2_vater_da]
    - id: ruth_faehrt
      label: { de: "Ruth fahren lassen und in die Sitzung gehen", en: "Let Ruth drive and go to the meeting" }
      result:
        de: >-
          Jacob setzt die Reinvestition durch, knapp. Um Mitternacht ruft Ruth aus
          Port Ellis an: Es ist die Lunge, es wird gut. Clara fragt am nächsten
          Morgen, wo Papa war.
        en: >-
          Jacob pushes the reinvestment through, narrowly. At midnight Ruth calls
          from Port Ellis: it's her lungs, she'll be fine. The next morning Clara
          asks where Papa was.
      # TODO-Effekt: clara: -10
      effects: { ruth: -10, cash: 2000 }
      marks: [clara_k2_vater_fehlte]
