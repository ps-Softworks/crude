      result:
        de: "Bis zum Morgen stehen die Tanks noch. Jacob hat Brandblasen an beiden Händen und hustet drei Wochen. Die Männer erzählen in Hallstead, der Chef habe geschaufelt wie ein Bohrarbeiter."
        en: "By morning the tanks are still standing. Jacob has burn blisters on both hands and coughs for three weeks. The men tell people in Hallstead the boss dug like a roughneck."
