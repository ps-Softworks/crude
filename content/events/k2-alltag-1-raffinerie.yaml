  text:
    de: >-
      Um drei Uhr nachts weckt die Werksglocke halb Port Ellis. Ein Kessel, der längst
      hätte raus müssen, hat nachgegeben, das Feuer läuft die Rinne entlang zu den
      Kerosintanks. Der Werksdirektor steht in Hemdsärmeln im Hof und brüllt Zahlen, die
      niemand versteht. Jacob ist keine fünfundzwanzig mehr und rennt trotzdem.
    en: >-
      At three in the morning the works bell wakes half of Port Ellis. A still that
      should have come out long ago has given way, and the fire runs along the gutter
      towards the kerosene tanks. The works director stands in his shirtsleeves in the yard
      shouting figures nobody understands. Jacob is no longer twenty-five and runs anyway.
