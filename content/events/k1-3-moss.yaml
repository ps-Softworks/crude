# Kapitel 1 – Story-Bogen Ezekiel Moss (2.9, GDD §12, Weltbibel).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# Moss braucht Geld, sonst nimmt ihm die Bank die Farm. Der Bogen kommt in jeder
# Partie (certain: true):
#
#   Runde 5+  moss_schulden     fair leihen (Moss verpachtet Jacob seine Farm ohne Bonus,
#                               halber Förderzins), für einen Spottpreis kaufen (alle
#                               Förderzinsen gehören Jacob, aber Daniel erzählt es überall:
#                               Pachten bis Kapitelende teurer) oder ablehnen
#   danach    moss_versteigerung (abgelehnt) Die Bank versteigert die Farm –
#                               doch noch helfen, selbst ersteigern (Druck) oder wegbleiben
#
# Spielspaß K1 (Weichen statt Alltagspost): Wagenweg, Dank, Spekulant und Daniels Abschied
# sind gestrichen; die Folgen stehen direkt an den Antworten (land, lasting – src/sim/weichen.ts).
#
# Wie der Bogen ausgeht, liest content/arcs.yaml aus den Merkzeichen ab.
# moss_feind setzen beide harten Wege (Betrug und Druck) – Daniel merkt es sich.

# Entwurf – Philipp überarbeitet.
- id: moss_schulden
  visitor: moss
  ranch: moss
  title:
    de: Ezekiel Moss hält den Hut in der Hand
    en: Ezekiel Moss, Hat in Hand
  text:
    de: >-
      Ezekiel Moss steht in Jacobs Bretterbude, den Hut in der Hand, und man sieht,
      was ihn das kostet. Die Bank in Port Ellis will bis zum Winter 2.500 $ für die
      Hypothek, sonst nimmt sie ihm die Farm. Er bietet an, alle künftigen Förderzinsen seines
      Landes gegen Bargeld abzutreten. Lesen kann er das Papier nicht.
    en: >-
      Ezekiel Moss stands in Jacob's plank shack, hat in hand, and it plainly costs
      him. The bank in Port Ellis wants 2,500 $ on the mortgage by winter or it takes his farm. He
      offers to sign over all future royalties from his land for cash. He cannot
      read the paper.
  conditions: { minRound: 5, maxChapter: 1 }
  certain: true
  choices:
    - id: leihen
      label: { de: "Ihm 2.500 $ leihen, ohne Papier – dafür bekommt Jacob die Farm zur Pacht", en: "Lend him 2,500 $, no paper – Jacob gets to lease the farm in return" }
      result:
        de: >-
          Moss zählt das Geld zweimal. „Gott sieht das“, sagt er – es klingt wie Dank
          und Drohung zugleich. Am Sonntag bringt er die Pachturkunde: die Moss-Farm,
          ohne Bonus und zum halben Förderzins, bis Kapitelende.
        en: >-
          Moss counts the money twice. "God sees this," he says – it sounds like thanks
          and threat at once. On Sunday he brings the lease: the Moss farm, no bonus
          and half the royalty, until the end of the chapter.
      requires: { minCash: 2500 }
      effects: { cash: -2500 }
      fixedCash: true
      land: { figure: moss, royalty: 0.0625 }
      marks: [moss_fair]
    - id: papier
      label: { de: "Ihm 800 $ für das ganze Papier geben – alle Förderzinsen gehören dann Jacob", en: "Give him 800 $ for the whole paper – all royalties are Jacob's then" }
      result:
        de: >-
          Moss setzt sein Kreuz unter einen Vertrag, der dreimal so viel wert ist.
          Sein Junge Daniel steht in der Tür und sieht zu. Jacob bohrt auf der Moss-Farm
          ohne Förderzins – aber Daniel erzählt es jedem Farmer am Salt Hill: Pachten
          kosten bis Kapitelende ein Zehntel mehr.
        en: >-
          Moss puts his cross under a contract worth three times as much. His boy
          Daniel stands in the doorway, watching. Jacob drills the Moss farm royalty-free
          – but Daniel tells every farmer on Salt Hill: leases cost a tenth more until
          the end of the chapter.
      requires: { minCash: 800 }
      effects: { cash: -800, leaseCost: 0.1 }
      fixedCash: true
      lasting: true
      land: { figure: moss, royalty: 0 }
      marks: [moss_betrogen, moss_feind]
    - id: ablehnen
      label: { de: "Ablehnen – Jacob ist keine Bank", en: "Refuse – Jacob is no bank" }
      result:
        de: Moss setzt den Hut wieder auf. „Dann eben die Bank“, sagt er an der Tür.
        en: Moss puts his hat back on. "The bank, then," he says at the door.
      marks: [moss_abgewiesen]
      default: true

# Entwurf – Philipp überarbeitet.
# Nachwirkung: nur wenn Jacob Moss abgewiesen hat, 2 Runden danach.
- id: moss_versteigerung
  ranch: moss
  title:
    de: Die Versteigerung
    en: The Auction
  text:
    de: >-
      Vor der Bank in Port Ellis hängt ein Zettel: Die Moss-Farm wird am Samstag
      versteigert. Ezekiel steht daneben im Sonntagsanzug, als könne er die
      Buchstaben durch Anstarren ändern. Daniel hält seinen Arm.
    en: >-
      A notice hangs outside the bank in Port Ellis: the Moss farm goes to auction
      on Saturday. Ezekiel stands beside it in his Sunday suit, as though he could
      change the letters by staring at them. Daniel holds his arm.
  marked: [moss_abgewiesen]
  delay: 2
  certain: true
  conditions: { maxChapter: 1 }   # sicheres Ereignis: nur Kapitel 1
  choices:
    - id: doch_helfen
      label: { de: "Moss die 2.500 $ doch noch geben – gegen die Farm zur Pacht", en: "Give Moss the 2,500 $ after all – for the farm on lease" }
      result:
        de: >-
          Moss nimmt das Geld vor der Bank, vor allen Leuten. „Spät, aber nicht zu
          spät“, sagt er. Der Zettel kommt ab, und Jacob pachtet die Moss-Farm ohne
          Bonus zum halben Förderzins.
        en: >-
          Moss takes the money outside the bank, in front of everyone. "Late, but not
          too late," he says. The notice comes down, and Jacob leases the Moss farm with
          no bonus at half the royalty.
      requires: { minCash: 2500 }
      effects: { cash: -2500 }
      fixedCash: true
      land: { figure: moss, royalty: 0.0625 }
      marks: [moss_fair]
    - id: ersteigern
      label: { de: "Die Farm selbst ersteigern ({cash}) – sie gehört dann Jacob, ohne Förderzins", en: "Buy the farm at auction yourself ({cash}) – it is Jacob's then, royalty-free" }
      result:
        de: >-
          Jacob bietet als Einziger. Am Abend lädt Ezekiel seine Habe auf einen
          Wagen. Daniel dreht sich am Gatter noch einmal um und sieht Jacob lange an.
          Die Moss-Farm gehört Jacob – kein Bonus, kein Förderzins.
        en: >-
          Jacob is the only bidder. In the evening Ezekiel loads his belongings onto a
          wagon. At the gate Daniel turns once more and looks at Jacob for a long time.
          The Moss farm is Jacob's – no bonus, no royalty.
      requires: { minCash: 3000 }
      effects: { cash: -3000 }
      fixedCash: true
      land: { figure: moss, royalty: 0 }
      marks: [moss_vertrieben, moss_feind]
    - id: wegbleiben
      label: { de: "Nicht hingehen – es ist nicht Jacobs Sache", en: "Stay away – it is not Jacob's business" }
      result:
        de: >-
          Ein Mann aus Hallstead kauft die Farm. Die Familie Moss zieht zu Verwandten in
          die Kohleprovinzen. Am Salt Hill merkt man sich, wer zugesehen hat: Pachten
          kosten bis Kapitelende ein Zehntel mehr.
        en: >-
          A man from Hallstead buys the farm. The Moss family moves to relatives in the
          coal provinces. Salt Hill remembers who stood by: leases cost a tenth more until
          the end of the chapter.
      appointments: 0
      effects: { leaseCost: 0.1 }
      lasting: true
      marks: [moss_verloren]
      default: true
