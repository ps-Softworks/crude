# Kapitel 1 – Alltag, Paket 4: Rivalen und Bank (2.10b, Ereignisse 31–43). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Ton: Weltbibel, GDD §9.2 (Crane, Thorne, Bullard,
# Wildcatter), §6 (Bankkredit, Geldverleiher zu etwa 40 %).
#
# Erfunden und nicht in der Weltbibel: Bankier Pettibone (Thornes Bankfiliale in Port Ellis),
# Geldverleiher Ike Rourke, Stationsvorsteher Gaffney, Händler Merriwether, Prüfer Lusk.
# Two-Rig Tilly und Ezra Pickett sind Wildcatter-Namen aus balance.yaml (rivals.wildcatters).
#
# Nachwirkungen (Merkzeichen) – nur innerhalb dieses Pakets gelesen:
#   bank_kredit → bank_tilgung (4 Runden später, Brief)
#   wucher_kredit → wucher_faellig (2 Runden später)
#   wechsel_gehalten → wechsel_geplatzt (Würfel; kommt nicht in jeder Partie)
# Merkzeichen aus Paket 1–3 / Rivalen, die hier gelesen werden: bullard_handschlag, bullard_fehde.

# --- Bank und Geld ---------------------------------------------------------------

- id: bank_kredit
  visitor: bankier
  rival: thorne
  title:
    de: Ein Kredit von Thornes Bank
    en: A Loan from Thorne's Bank
  text:
    de: >-
      Mr. Pettibone leitet die Filiale der Thorne Rail & Trust Bank in Port Ellis.
      Er hat Jacobs Türme gezählt, bevor Jacob ihn besucht hat. 600 $ könne er
      sofort geben, in vier Quartalen zurück, mit 700. „Wir glauben an Cordova,
      Mr. Harlan. Und an Sicherheiten.“
    en: >-
      Mr. Pettibone runs the Port Ellis branch of Thorne Rail & Trust Bank. He
      counted Jacob's derricks before Jacob ever called on him. He can lend 600 $
      at once, back in four quarters, as 700. "We believe in Cordova, Mr. Harlan.
      And in collateral."
  conditions: { minLeases: 1, minRound: 3, maxRound: 11, maxCash: 1500 }
  chance: 0.1
  choices:
    - id: annehmen
      label: { de: "Unterschreiben (+600 $, in vier Quartalen 700 $ zurück)", en: "Sign (+600 $, 700 $ due in four quarters)" }
      result:
        de: Pettibone zählt die Scheine zweimal, dann schiebt er sie hinüber. Seine Feder kratzt Jacobs Namen in ein dickes Buch.
        en: Pettibone counts the notes twice, then slides them across. His pen scratches Jacob's name into a thick ledger.
      effects: { cash: 600 }
      marks: [bank_kredit]
    - id: ablehnen
      label: { de: "Danken und gehen", en: "Thank him and leave" }
      result:
        de: Pettibone nickt, als habe er nichts anderes erwartet. „Die Tür steht offen. Noch.“
        en: Pettibone nods as if he expected nothing else. "The door is open. For now."
      appointments: 0
      default: true

- id: bank_tilgung
  mail: demand
  rival: thorne
  marked: [bank_kredit]
  delay: 4
  chance: 0.9
  deadline: 2
  title:
    de: Die Bank erinnert an die Tilgung
    en: The Bank Calls In Its Loan
  text:
    de: >-
      Ein Brief auf dem Papier der Thorne Rail & Trust Bank: Die 700 $ sind fällig.
      Darunter, in kleinerer Schrift, was die Bank im Fall der Säumnis pfänden darf.
      Öl im Tank steht ganz oben auf der Liste.
    en: >-
      A letter on Thorne Rail & Trust Bank paper: the 700 $ are due. Below it, in
      smaller print, what the bank may seize in case of default. Oil in the tank
      heads the list.
  choices:
    - id: zahlen
      label: { de: "Zahlen (700 $)", en: "Pay (700 $)" }
      result:
        de: Pettibone quittiert mit einem Lächeln, das nichts kostet. Die Seite im dicken Buch wird durchgestrichen.
        en: Pettibone signs the receipt with a smile that costs nothing. The page in the thick ledger is crossed out.
      requires: { minCash: 700 }
      effects: { cash: -700 }
    - id: haelfte
      label: { de: "Halb in bar, halb in Öl (350 $ und 350 Barrel)", en: "Half in cash, half in oil (350 $ and 350 barrels)" }
      result:
        de: Pettibone rechnet das Öl zum Posted Price an, keinen Cent darüber. Die Bank verkauft es eine Woche später teurer.
        en: Pettibone credits the oil at the posted price, not a cent more. The bank sells it a week later for more.
      requires: { minCash: 350, minOilStock: 350 }
      effects: { cash: -350, oilStock: -350 }
      appointments: 2
    - id: pfaendung
      label: { de: "Nicht zahlen", en: "Don't pay" }
      result:
        de: Zwei Männer der Bank kommen mit einem Wagen und einer Liste. Sie nehmen das Öl aus dem Tank und, was fehlt, in bar.
        en: Two bank men arrive with a wagon and a list. They take the oil from the tank and the rest in cash.
      effects: { oilStock: -400, cash: -400 }
      appointments: 0
      default: true

- id: wucher_kredit
  title:
    de: Ike Rourke leiht jedem
    en: Ike Rourke Lends to Anyone
  text:
    de: >-
      Hinter dem Mietstall hat Ike Rourke einen Tisch, eine Kasse und einen Neffen
      mit Knüppel. Er leiht ohne Papiere und ohne Fragen. 300 $ jetzt, 420 $ in
      zwei Quartalen. „Ich frag nicht, wofür. Ich frag nur einmal nach.“
    en: >-
      Behind the livery stable Ike Rourke keeps a table, a cash box and a nephew
      with a club. He lends without papers and without questions. 300 $ now,
      420 $ in two quarters. "I don't ask what for. I only ask once."
  conditions: { minRound: 2, maxCash: 400, maxRound: 13 }
  chance: 0.15
  choices:
    - id: leihen
      label: { de: "Leihen (+300 $, in zwei Quartalen 420 $)", en: "Borrow (+300 $, 420 $ in two quarters)" }
      result:
        de: Rourke zählt das Geld auf den Tisch und schreibt nichts auf. Der Neffe merkt sich Jacobs Gesicht.
        en: Rourke counts the money onto the table and writes nothing down. The nephew memorises Jacob's face.
      effects: { cash: 300 }
      marks: [wucher_kredit]
      appointments: 0
    - id: nein
      label: { de: "Weitergehen", en: "Walk on" }
      result:
        de: Rourke zuckt die Schultern. „Du kommst wieder. Alle kommen wieder.“
        en: Rourke shrugs. "You'll be back. Everybody comes back."
      appointments: 0
      default: true

- id: wucher_faellig
  marked: [wucher_kredit]
  delay: 2
  chance: 1
  title:
    de: Rourkes Neffe wartet am Turm
    en: Rourke's Nephew Waits at the Derrick
  text:
    de: >-
      Der Neffe mit dem Knüppel sitzt auf einem Fass neben Jacobs Bohrturm und
      schnitzt an einem Stock. Es seien 420 $, sagt er, und er habe den ganzen Tag
      Zeit. Der Bohrtrupp arbeitet sehr leise.
    en: >-
      The nephew with the club sits on a barrel beside Jacob's derrick, whittling
      a stick. It's 420 $, he says, and he has all day. The drilling crew works
      very quietly.
  choices:
    - id: zahlen
      label: { de: "Zahlen (420 $)", en: "Pay (420 $)" }
      result:
        de: Der Neffe zählt nach, steckt das Geld ein und tippt an die Mütze. Am Abend ist das Fass, auf dem er saß, leer.
        en: The nephew counts, pockets the money and touches his cap. By evening the barrel he sat on is empty.
      requires: { minCash: 420 }
      effects: { cash: -420 }
    - id: oel
      label: { de: "Mit Öl bezahlen (500 Barrel)", en: "Pay in oil (500 barrels)" }
      result:
        de: Rourke nimmt Öl, aber nur zu seinem Preis. Zwei Wagen fahren voll nach Port Ellis.
        en: Rourke takes oil, but only at his price. Two wagons roll full to Port Ellis.
      requires: { minOilStock: 500 }
      effects: { oilStock: -500 }
    - id: sitzen
      label: { de: "Ihn sitzen lassen", en: "Leave him sitting there" }
      result:
        de: Am Abend geht der Neffe. In der Nacht brennt der Schuppen mit dem Seil und dem Werkzeug. Rourke bekommt sein Geld trotzdem, aus Jacobs Kasse, vor Zeugen.
        en: In the evening the nephew leaves. That night the shed with the rope and tools burns. Rourke gets his money anyway, out of Jacob's till, in front of witnesses.
      effects: { cash: -420, strength: -6 }
      appointments: 0
      default: true

- id: wechsel_angebot
  mail: offer
  title:
    de: Ein Wechsel aus Hallstead
    en: A Bill of Exchange from Hallstead
  text:
    de: >-
      Der Händler Merriwether will 300 Barrel kaufen und bietet 360 $ – mehr als der
      Trust zahlt. Allerdings nicht in bar, sondern mit einem Wechsel auf eine Bank
      in Hallstead, fällig in einem halben Jahr. Pettibone würde ihn sofort
      ankaufen, mit Abschlag.
    en: >-
      The trader Merriwether wants 300 barrels and offers 360 $ – more than the
      Trust pays. Not in cash, though, but with a bill on a Hallstead bank, due in
      half a year. Pettibone would buy the bill at once, at a discount.
  conditions: { minOilStock: 300, minRound: 3 }
  chance: 0.12
  choices:
    - id: abschlag
      label: { de: "Verkaufen und den Wechsel gleich bei der Bank einlösen (+270 $)", en: "Sell and cash the bill at the bank right away (+270 $)" }
      result:
        de: Pettibone prüft das Papier mit einer Lupe und zieht ein Viertel ab. Ein Viertel ist viel. Bargeld ist Bargeld.
        en: Pettibone examines the paper through a glass and takes off a quarter. A quarter is a lot. Cash is cash.
      effects: { oilStock: -300, cash: 270 }
    - id: halten
      label: { de: "Verkaufen und den Wechsel behalten", en: "Sell and keep the bill" }
      result:
        de: Der Wechsel kommt in die Kiste unter dem Bett. Ruth liest ihn zweimal und legt ihn zurück, ohne etwas zu sagen.
        en: The bill goes in the box under the bed. Ruth reads it twice and puts it back without a word.
      effects: { oilStock: -300 }
      marks: [wechsel_gehalten]
    - id: nein
      label: { de: "Ablehnen – nur Bargeld", en: "Decline – cash only" }
      result:
        de: Merriwether kauft woanders. Ein Händler, der nicht bar zahlt, hat meistens einen Grund.
        en: Merriwether buys elsewhere. A trader who won't pay cash usually has a reason.
      appointments: 0
      default: true

- id: wechsel_geplatzt
  mail: demand
  marked: [wechsel_gehalten]
  delay: 2
  chance: 0.4
  title:
    de: Die Bank in Hallstead zahlt nicht
    en: The Hallstead Bank Won't Pay
  text:
    de: >-
      Der Wechsel kommt zurück, mit einem roten Stempel: „Protestiert“. Die Bank in
      Hallstead kennt Merriwether nicht mehr. Ein Anwalt dort würde es versuchen,
      für einen Vorschuss.
    en: >-
      The bill comes back with a red stamp: "Protested". The Hallstead bank no
      longer knows Merriwether. A lawyer there would try, for a retainer.
  choices:
    - id: anwalt
      label: { de: "Den Anwalt bezahlen (100 $) und auf einen Teil hoffen", en: "Pay the lawyer (100 $) and hope for a share" }
      result:
        de: "Nach Monaten kommt ein Scheck über 300 $. Abzüglich des Anwalts bleiben 200 $, und ein Brief, der länger ist als der Scheck wert."
        en: "After months a cheque for 300 $ arrives. Less the lawyer, 200 $ remain – and a letter longer than the cheque is worth."
      requires: { minCash: 100 }
      effects: { cash: 200 }
      appointments: 2
    - id: abschreiben
      label: { de: "Abschreiben", en: "Write it off" }
      result:
        de: Jacob legt den Wechsel in die Kiste zurück, als Erinnerung. 300 Barrel für ein Stück Papier.
        en: Jacob puts the bill back in the box, as a reminder. 300 barrels for a piece of paper.
      appointments: 0
      default: true

# --- Rivalen -------------------------------------------------------------------

- id: crane_vorkauf
  rival: crane
  mail: offer
  title:
    de: Der Trust will vorkaufen
    en: The Trust Wants to Buy Ahead
  text:
    de: >-
      Ein junger Mann aus dem Büro des Crane Trust, Anzug, keine Schwielen. Der Trust
      kaufe Jacobs Tank jetzt leer, zu fünf Cent über dem Posted Price, wenn Jacob
      unterschreibt, ein Jahr nur an Crane zu liefern. Er hat den Vertrag schon
      ausgefüllt.
    en: >-
      A young man from the Crane Trust office, a suit, no calluses. The Trust will
      empty Jacob's tank now, at five cents over the posted price, if Jacob signs
      to deliver only to Crane for a year. He has already filled in the contract.
  conditions: { minOilStock: 400, minRound: 4 }
  chance: 0.12
  choices:
    - id: unterschreiben
      label: { de: "Unterschreiben (400 Barrel gegen 440 $)", en: "Sign (400 barrels for 440 $)" }
      result:
        de: Der junge Mann bläst auf die Tinte. „Mr. Crane schätzt verlässliche Partner.“ Im Hafen weiß man es am Abend.
        en: The young man blows on the ink. "Mr. Crane values reliable partners." By evening the harbour knows.
      effects: { oilStock: -400, cash: 440 }
    - id: ablehnen
      label: { de: "Ablehnen", en: "Decline" }
      result:
        de: Er faltet den Vertrag sorgfältig. „Das Angebot gilt nicht zweimal.“
        en: He folds the contract carefully. "The offer isn't made twice."
      appointments: 0
      default: true

- id: crane_pruefer
  visitor: lusk
  rival: crane
  title:
    de: Der Prüfer findet Wasser
    en: The Inspector Finds Water
  text:
    de: >-
      Lusk, der Prüfer des Trust am Verladeplatz, hält Jacobs Probe gegen das Licht
      und schüttelt den Kopf. Zu viel Wasser, zu viel Sand. Zweite Klasse, zwanzig
      Prozent Abzug. Bei Bullards Fässern, die neben Jacobs stehen, hat er nicht
      hingesehen.
    en: >-
      Lusk, the Trust's inspector at the loading yard, holds Jacob's sample to the
      light and shakes his head. Too much water, too much sand. Second grade, twenty
      percent off. He didn't look at Bullard's barrels standing next to Jacob's.
  conditions: { minProducingWells: 1, minOilStock: 200, minRound: 3 }
  chance: 0.1
  choices:
    - id: nachpruefen
      label: { de: "Eine zweite Probe verlangen und danebenstehen", en: "Demand a second sample and stand beside him" }
      result:
        de: Jacob schöpft selbst, aus der Mitte des Fasses. Lusk misst noch einmal und findet nichts mehr. Er notiert sich Jacobs Namen.
        en: Jacob draws it himself, from the middle of the barrel. Lusk measures again and finds nothing. He writes down Jacob's name.
      effects: { strength: -4 }
      appointments: 2
      sharp: true
    - id: schmieren
      label: { de: "Lusk eine Zigarre und 60 $ anbieten", en: "Offer Lusk a cigar and 60 $" }
      result:
        de: "Die Probe ist plötzlich klar. Lusk steckt die Zigarre ein und das Geld schneller. Seitdem bekommt Jacobs Öl immer erste Klasse."
        en: "Suddenly the sample is clear. Lusk pockets the cigar, and the money faster. Since then Jacob's oil always gets first grade."
      requires: { minCash: 60 }
      effects: { cash: -60, price: 0.02 }
    - id: hinnehmen
      label: { de: "Den Abzug hinnehmen", en: "Accept the deduction" }
      result:
        de: "Zweite Klasse – und Lusk bleibt dabei. Eine Weile zahlt der Trust Jacob fünf Cent weniger je Barrel und verkauft dasselbe Öl in Hallstead als erste."
        en: "Second grade – and Lusk sticks to it. For a while the Trust pays Jacob five cents less a barrel and sells the same oil in Hallstead as first."
      effects: { price: -0.05 }
      appointments: 0
      default: true

- id: bullard_ausbruch
  rival: bullard
  marked: [bullard_handschlag]
  delay: 2
  title:
    de: Bullards Quelle bricht aus
    en: Bullard's Well Blows Out
  text:
    de: >-
      Mitten in der Nacht hämmert Bullards Vorarbeiter an die Tür. Bullards neue
      Quelle ist durchgegangen, das Öl steht hundert Fuß hoch, und wenn ein Funke
      kommt, brennt der halbe Hügel. Bullard braucht jeden Mann, der eine Schaufel
      halten kann.
    en: >-
      In the middle of the night Bullard's foreman pounds on the door. Bullard's
      new well has blown wild, oil a hundred feet high, and one spark will burn
      half the hill. Bullard needs every man who can hold a shovel.
  conditions: { minRound: 4 }
  chance: 0.15
  choices:
    - id: helfen
      label: { de: "Mit dem ganzen Trupp hinfahren", en: "Ride over with the whole crew" }
      result:
        de: "Bis zum Morgen schaufeln sie einen Wall und fangen das Öl in einer Grube. Bullard sagt nichts, er drückt Jacob nur die Schulter. Das ist bei ihm viel. Das Öl aus der Grube, sagt er, gehöre Jacob: 300 Barrel."
        en: "By morning they have shovelled a dike and caught the oil in a pit. Bullard says nothing; he only grips Jacob's shoulder. For him that is a lot. The oil in the pit, he says, belongs to Jacob: 300 barrels."
      effects: { strength: -8, oilStock: 300 }
      appointments: 3
    - id: maenner
      label: { de: "Den Trupp schicken, selbst bleiben (80 $ Nachtlohn)", en: "Send the crew, stay behind (80 $ night wages)" }
      result:
        de: "Die Männer kommen bei Sonnenaufgang zurück, schwarz bis zu den Augen, mit 150 Barrel aus der Grube. Bullard lässt ausrichten, er habe Jacob nicht gesehen."
        en: "The men come back at sunrise, black to the eyes, with 150 barrels from the pit. Bullard sends word that he did not see Jacob."
      requires: { minCash: 80 }
      effects: { cash: -80, oilStock: 150 }
    - id: schlafen
      label: { de: "Die Tür zumachen", en: "Close the door" }
      result:
        de: Das Feuer kommt nicht. Aber am nächsten Abend sitzt Bullard im Saloon mit dem Rücken zu Jacob.
        en: The fire never comes. But the next evening Bullard sits in the saloon with his back to Jacob.
      appointments: 0
      default: true

- id: bullard_seil
  rival: bullard
  marked: [bullard_fehde]
  notMarked: [brand_geholfen, drohung_aufgehoben, drohung_sheriff]
  delay: 1
  title:
    de: Das Seil ist angeschnitten
    en: The Cable Has Been Cut
  text:
    de: >-
      Silas zeigt Jacob das Bohrseil: sauber angeschnitten, eine Handbreit über der
      Rolle, wo man es beim Anfahren nicht sieht. Hätte es beim nächsten Schlag
      gehalten? Niemand hat jemanden gesehen. Bullards Männer haben gestern gelacht.
    en: >-
      Silas shows Jacob the drilling cable: neatly cut, a hand's breadth above the
      pulley, where nobody looks at start-up. Would it have held the next stroke?
      Nobody saw anybody. Bullard's men were laughing yesterday.
  conditions: { minLeases: 1 }
  chance: 0.2
  choices:
    - id: wache
      label: { de: "Eine Nachtwache für die ganze Saison bezahlen (200 $)", en: "Pay for a night watch all season (200 $)" }
      result:
        de: Zwei Männer mit Laternen und einer Flinte. In den nächsten Nächten passiert nichts, und das kostet jede Nacht.
        en: Two men with lanterns and a shotgun. Nothing happens the next few nights, and that costs every night.
      requires: { minCash: 200 }
      effects: { cash: -200 }
    - id: zurueck
      label: { de: "Bullards Seil auch anschneiden lassen", en: "Have Bullard's cable cut too" }
      result:
        de: Drei Tage später reißt bei Bullard das Seil, das Gestänge fällt ins Loch. Im Saloon wird es still, wenn Jacob hereinkommt.
        en: Three days later Bullard's cable snaps and the tools fall down the hole. The saloon goes quiet when Jacob walks in.
      marks: [bullard_rache]
      appointments: 0
    - id: ersetzen
      label: { de: "Ein neues Seil kaufen und schweigen (60 $)", en: "Buy a new cable and keep quiet (60 $)" }
      result:
        de: "Das alte Seil hängt jetzt im Schuppen, als Andenken. Silas schaut es jeden Morgen an. Bis das neue Seil eingelaufen ist, schlägt der Turm nur halb so oft."
        en: "The old cable now hangs in the shed as a keepsake. Silas looks at it every morning. Until the new rope is broken in, the derrick strikes only half as often."
      effects: { cash: -60, production: -0.1 }
      default: true

- id: bullard_rache_folge
  draft: true
  marked: [bullard_rache]
  delay: 1
  chance: 0.5
  title:
    de: Bullards Antwort
    en: Bullard's Answer
  text:
    de: >-
      Bullard hat das angeschnittene Seil nicht vergessen. In der Nacht brennt der
      Schuppen neben Jacobs Tank, und am Morgen steht einer von Bullards Männern
      am Zaun und raucht. „Quitt, Harlan?“, ruft er herüber. „Oder noch eine Runde?“
    en: >-
      Bullard has not forgotten the cut rope. In the night the shed beside Jacob's
      tank burns, and in the morning one of Bullard's men stands at the fence,
      smoking. "Even, Harlan?" he calls over. "Or another round?"
  choices:
    - id: quitt
      label: { de: "„Quitt.“ Den Schuppen neu bauen (150 $)", en: "\"Even.\" Rebuild the shed (150 $)" }
      result:
        de: Jacob nickt zum Zaun hinüber. Der Mann tippt an den Hut und geht. Der neue Schuppen riecht nach frischem Holz und nach Waffenstillstand.
        en: Jacob nods toward the fence. The man touches his hat and leaves. The new shed smells of fresh timber and of truce.
      requires: { minCash: 150 }
      effects: { cash: -150 }
    - id: noch_eine
      label: { de: "„Noch eine Runde.“", en: "\"Another round.\"" }
      result:
        de: In der Woche darauf brennt auch Bullards Kesselhaus. Am Salt Hill schläft jetzt keiner mehr ruhig – Jacobs Männer am wenigsten, und am Turm fehlt es an Händen.
        en: The week after, Bullard's boiler house burns too. Nobody at Salt Hill sleeps soundly now – Jacob's men least of all, and the derrick is short of hands.
      effects: { strength: -6, production: -0.15 }
    - id: abschreiben
      label: { de: "Nichts sagen und das Öl umfüllen", en: "Say nothing and move the oil" }
      result:
        de: Mit dem Schuppen ist ein Teil des Öls verbrannt. Jacob schreibt es ab. Der Mann am Zaun lacht.
        en: Part of the oil burned with the shed. Jacob writes it off. The man at the fence laughs.
      effects: { oilStock: -300 }
      appointments: 0
      default: true

- id: thorne_waggons
  rival: thorne
  title:
    de: Die Kesselwagen kommen nicht
    en: The Tank Cars Don't Come
  text:
    de: >-
      Seit zwei Wochen stehen Jacobs Fässer am Gleis. Stationsvorsteher Gaffney
      bedauert: Thorne Rail habe zu wenig Kesselwagen, die Großen gehen vor. Er sagt
      es zu Jacobs Hut, nicht zu Jacob. Dann schaut er auf seine Uhr, lange.
    en: >-
      For two weeks Jacob's barrels have stood at the siding. Stationmaster Gaffney
      is sorry: Thorne Rail has too few tank cars, the big shippers come first. He
      says it to Jacob's hat, not to Jacob. Then he looks at his watch, a long time.
  conditions: { minOilStock: 200, minRound: 3 }
  chance: 0.12
  choices:
    - id: trinkgeld
      label: { de: "Gaffney ein „Trinkgeld“ geben (40 $)", en: "Give Gaffney a \"tip\" (40 $)" }
      result:
        de: "Am nächsten Morgen stehen zwei Kesselwagen am Gleis. Gaffney grüßt jetzt mit Namen und bucht Jacobs Fässer in die billigere Klasse – einen Cent je Barrel."
        en: "The next morning two tank cars stand on the siding. Gaffney now greets him by name and books Jacob's barrels in the cheaper class – one cent a barrel."
      requires: { minCash: 40 }
      effects: { cash: -40, railTariff: -0.01 }
    - id: fuhrwerk
      label: { de: "Mit Fuhrwerken zum Hafen fahren (90 $)", en: "Haul it to the harbour by wagon (90 $)" }
      result:
        de: Sechs Wagen, zwei Tage, ein gebrochenes Rad. Das Öl kommt an, Thorne bekommt nichts.
        en: Six wagons, two days, one broken wheel. The oil arrives; Thorne gets nothing.
      requires: { minCash: 90 }
      effects: { cash: -90 }
      appointments: 2
    - id: warten
      label: { de: "Warten", en: "Wait" }
      result:
        de: "Die Fässer stehen in der Sonne. Holz schwindet, Öl tropft. Als die Wagen kommen, fehlen 250 Barrel."
        en: "The barrels stand in the sun. Wood shrinks, oil drips. When the cars come, 250 barrels are missing."
      effects: { oilStock: -250 }
      appointments: 0
      default: true

- id: tilly_tank
  title:
    de: Two-Rig Tilly schlägt einen Tank vor
    en: Two-Rig Tilly Proposes a Tank
  text:
    de: >-
      Tilly bohrt mit zwei Türmen am Nordhang und raucht Pfeife wie ein Fuhrmann.
      Sie will mit Jacob einen gemeinsamen Erdtank graben, halbe-halbe, damit
      keiner von beiden an Lusks Verladeplatz verkaufen muss, wenn der Preis fällt.
    en: >-
      Tilly drills with two rigs on the north slope and smokes a pipe like a
      teamster. She wants to dig a shared earthen tank with Jacob, half and half,
      so neither of them has to sell at Lusk's yard when the price drops.
  conditions: { minProducingWells: 1, minRound: 3 }
  chance: 0.1
  choices:
    - id: graben
      label: { de: "Mitmachen (150 $ und eine Woche Arbeit)", en: "Join in (150 $ and a week's work)" }
      result:
        de: "Der Tank ist ein Loch mit Lehmwänden und einem Bretterdach. Tilly füllt ihre Hälfte als Erste, und Jacob lagert hundert Barrel mit ein. Wer nicht sofort verkaufen muss, verkauft besser: Eine Weile bekommt Jacob ein paar Cent mehr."
        en: "The tank is a pit with clay walls and a plank roof. Tilly fills her half first, and Jacob stores a hundred barrels alongside. Whoever need not sell at once sells better: for a while Jacob gets a few cents more."
      requires: { minCash: 150 }
      effects: { cash: -150, oilStock: 100, strength: -3, price: 0.03 }
      appointments: 2
    - id: nein
      label: { de: "Lieber allein bleiben", en: "Rather stay on his own" }
      result:
        de: Tilly klopft die Pfeife aus. „Allein bist du billiger zu kaufen, Harlan. Denk dran.“
        en: Tilly knocks out her pipe. "Alone you're cheaper to buy, Harlan. Remember that."
      appointments: 0
      default: true

- id: pickett_pleite
  title:
    de: Ezra Pickett gibt auf
    en: Ezra Pickett Gives Up
  text:
    de: >-
      Ezra Pickett hat drei trockene Löcher gebohrt und keine Kraft für ein viertes.
      Auf einem Brett vor seinem Zelt steht „Alles muss weg“. Sein Öl im Tank, zwei
      Kessel, ein Pferd. Er will nach Hause, bevor der Winter kommt.
    en: >-
      Ezra Pickett has drilled three dry holes and has no strength for a fourth. A
      board outside his tent reads "Everything must go". His oil in the tank, two
      boilers, a horse. He wants to go home before winter.
  conditions: { minRound: 4, minCash: 200 }
  chance: 0.1
  choices:
    - id: billig
      label: { de: "Sein Öl billig kaufen (300 Barrel für 150 $)", en: "Buy his oil cheap (300 barrels for 150 $)" }
      result:
        de: Pickett nimmt das Geld, ohne zu handeln. Er weint nicht, er schaut nur lange auf die Türme.
        en: Pickett takes the money without haggling. He doesn't cry; he just looks at the derricks a long time.
      requires: { minCash: 150 }
      effects: { cash: -150, oilStock: 300 }
    - id: fair
      label: { de: "Den vollen Preis zahlen (300 Barrel für 300 $)", en: "Pay full price (300 barrels for 300 $)" }
      result:
        de: "Pickett zählt zweimal nach. „Das hätte keiner gemacht.“ Er erzählt es jedem im Hafen, bevor sein Schiff ablegt. Die Farmer am Hügel hören es gern – sie verpachten an Jacob eine Weile billiger."
        en: "Pickett counts twice. \"Nobody would have done that.\" He tells everyone at the harbour before his boat sails. The farmers on the hill like to hear it – for a while they lease to Jacob cheaper."
      requires: { minCash: 300 }
      effects: { cash: -300, oilStock: 300, leaseCost: -0.15 }
    - id: vorbei
      label: { de: "Vorbeigehen", en: "Walk past" }
      result:
        de: Am nächsten Tag hat Bullard alles gekauft, das Pferd eingeschlossen.
        en: The next day Bullard has bought the lot, horse included.
      appointments: 0
      default: true
