# Kapitel 1 – Posteingang (2.4, GDD §3). Entwurf von Claude, bitte in eigener Stimme umschreiben.
# Vorlage und Erklärung: docs/ereignis-vorlage.md
#
# Briefe haben eine Briefart (mail) und eine Frist (deadline, Standard aus balance.yaml:
# events.mail.deadlineRounds). In der letzten Runde der Frist trägt der Brief das rote Siegel;
# danach gilt die Standard-Wahl.
#   offer    = Angebot (Pachten, Ausrüstung, Kredite, Partnerschaften)
#   demand   = Forderung (Löhne, Klagen, Erpressung)
#   info     = Information (Geologenberichte, Spionage, Gerüchte)
#   personal = Persönliches (Familie, Freunde, Feinde)
#
# Garantie: Kam von einer Briefart events.mail.guaranteeRounds Runden keiner, bringt die Post
# sicher einen davon (sofern einer kommen kann).
#
# Etappe 3 (Briefe ausdünnen): Die meisten Briefe in Kapitel 1 antworten jetzt auf Jacobs Pläne
# (src/sim/letters.ts). Hier bleiben die Witwe (Forderung, selten; die Hale-Ranch der Karte hängt an ihr)
# und der Courier (Information, einmal je Partie), damit jede Briefart in jeder Partie kommen kann:
# Forderungen bringt sicher Crane (Abschlag, Runde 6), Angebote Thorne (Frachtvertrag, spätestens Runde 4)
# und Crane (Übernahme, Runde 15), Persönliches Ruths Geburtstag. Gestrichen: Seilerei, Ölkauf, Mietstall,
# falscher Geologe (steckt jetzt in Hales Gutachten), Brief der Mutter, Drohzettel.

# --- Forderungen ------------------------------------------------------------

- id: post_witwe
  ranch: hale
  mail: demand
  deadline: 3
  title:
    de: Ein Brief von Anwalt Pruitt
    en: A Letter from Lawyer Pruitt
  text:
    de: >-
      Anwalt Pruitt schreibt im Namen von Mrs. Hale, deren Mann im Frühjahr am
      Salt Hill vom Bohrturm fiel. Sie verlangt {cash:zahlen} Entschädigung. Sonst, so
      Pruitt, „wird der Bezirksrichter sich der Sache annehmen“.
    en: >-
      Lawyer Pruitt writes on behalf of Mrs. Hale, whose husband fell from a
      derrick at Salt Hill in the spring. She asks {cash:zahlen} in compensation. Otherwise,
      says Pruitt, "the district judge will take up the matter".
  conditions: { minRound: 5 }
  chance: 0.06
  choices:
    - id: zahlen
      label: { de: "Der Witwe {cash} zahlen", en: "Pay the widow {cash}" }
      result:
        de: 'Mrs. Hale schickt eine Karte. Darauf steht nur: „Danke. Er mochte Sie.“'
        en: 'Mrs. Hale sends a card. It says only: "Thank you. He liked you."'
      requires: { minCash: 200 }
      effects: { cash: -200 }
    - id: verhandeln
      label: { de: "Zu Pruitt gehen und verhandeln ({cash})", en: "Go to Pruitt and bargain ({cash})" }
      result:
        de: Pruitt nimmt {cash} und lächelt dabei so, dass Jacob weiß, wie viel davon bei der Witwe ankommt.
        en: Pruitt takes {cash} and smiles in a way that tells Jacob how much of it will reach the widow.
      requires: { minCash: 100 }
      effects: { cash: -100 }
      appointments: 2
      sharp: true              # beste Antwort (2.7): fehlt, wenn Jacob erschöpft ist
    - id: abweisen
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Der Bezirksrichter spricht Mrs. Hale {cash} zu. Nora Whitlock sitzt in der letzten Reihe und schreibt mit.
        en: The district judge awards Mrs. Hale {cash}. Nora Whitlock sits in the back row, taking notes.
      effects: { cash: -350 }
      appointments: 0
      default: true

# --- Informationen ----------------------------------------------------------

- id: post_kurier
  mail: info
  title:
    de: Der Port Ellis Courier
    en: The Port Ellis Courier
  text:
    de: >-
      Die Zeitung von gestern, mit Fettflecken. Auf Seite drei: neue Bohrtürme am
      Salt Hill, volle Tanks im Hafen, ein Gerücht über Bullards nächste Pacht.
      Wer zwischen den Zeilen liest, weiß, wohin der Preis geht.
    en: >-
      Yesterday's paper, grease-stained. On page three: new derricks at Salt Hill,
      full tanks at the harbour, a rumour about Bullard's next lease. Read between
      the lines and you know where the price is heading.
  chance: 0.05
  choices:
    - id: lesen
      label: { de: "In Ruhe lesen", en: "Read it properly" }
      result:
        de: "Jacob liest bis die Lampe rußt. Er kennt jetzt jeden Bohrturm am Hügel beim Namen. Er weiß jetzt, wann er verkaufen muss – ein paar Cent je Barrel."
        en: "Jacob reads until the lamp smokes. He now knows every derrick on the hill by name. Now he knows when to sell – a few cents a barrel."
      effects: { strength: -1, price: 0.02 }
    - id: ueberfliegen
      label: { de: "Überfliegen", en: "Skim it" }
      result:
        de: Die Zeitung landet unter dem Kaffeebecher. Jacob legt die Füße hoch, zum ersten Mal seit Tagen.
        en: The paper ends up under the coffee mug. Jacob puts his feet up for the first time in days.
      effects: { strength: 7 }
      appointments: 0
      default: true
