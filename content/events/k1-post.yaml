# Kapitel 1 – Posteingang (2.4, GDD §3). Entwurf von Claude, bitte in eigener Stimme umschreiben.
# Vorlage und Erklärung: docs/ereignis-vorlage.md
#
# Briefe haben eine Briefart (mail) und eine Frist (deadline, Standard aus balance.yaml:
# events.mail.deadlineRounds). In der letzten Runde der Frist trägt der Brief das rote Siegel;
# danach gilt die Standard-Wahl.
#   offer    = Angebot (Pachten, Ausrüstung, Kredite, Partnerschaften)
#   demand   = Forderung (Löhne, Klagen, Erpressung)
#   info     = Information (Geologenberichte, Spionage, Gerüchte)
#   personal = Persönliches (Familie, Freunde, Feinde)
#
# Garantie: Kam von einer Briefart events.mail.guaranteeRounds Runden keiner, bringt die Post
# sicher einen davon. Damit das immer klappt, gibt es je Art einen „Alltagsbrief“ ohne
# Bedingungen, der öfter kommen darf (once: false).

# --- Angebote ---------------------------------------------------------------

- id: post_seil
  mail: offer
  once: false
  title:
    de: Kessler & Söhne, Seilerei
    en: Kessler & Sons, Ropemakers
  text:
    de: >-
      Ein gedruckter Zettel aus Port Ellis: Kessler & Söhne bieten Hanfseil aus
      Kentucky-Hanf, „reißt nicht, auch wenn der Bohrmeister es tut“. 80 $ die
      Rolle, frei Bohrstelle.
    en: >-
      A printed handbill from Port Ellis: Kessler & Sons offer rope of Kentucky
      hemp, "won't snap, even if your driller does". 80 $ a coil, delivered to the rig.
  chance: 0.15
  choices:
    - id: kaufen
      label: { de: "Eine Rolle bestellen (80 $)", en: "Order a coil (80 $)" }
      result:
        de: Das neue Seil singt am Turm. Die Männer fluchen weniger, Jacob schläft besser.
        en: The new rope hums on the derrick. The men curse less, Jacob sleeps better.
      requires: { minCash: 80 }
      effects: { cash: -80, strength: 3 }
    - id: ablegen
      label: { de: "In den Ofen damit", en: "Into the stove" }
      result:
        de: Der Zettel brennt gut. Das alte Seil hält – noch.
        en: The handbill burns well. The old rope holds – for now.
      appointments: 0
      default: true

- id: post_oelkauf
  mail: offer
  title:
    de: Ein Händler will Öl auf Vorkasse
    en: A Dealer Wants Oil, Cash Up Front
  text:
    de: >-
      Ein Ölhändler aus dem Osten schreibt auf feinem Papier: Er nimmt 300 Barrel
      zu einem festen Preis, zahlbar sofort, abzuholen am Hafen. Der Preis liegt
      unter dem Posted Price, aber Geld in der Hand ist Geld in der Hand.
    en: >-
      An oil dealer from the East writes on fine paper: he will take 300 barrels
      at a fixed price, paid at once, collected at the harbour. The price is below
      the posted price, but money in hand is money in hand.
  conditions: { minRound: 4, minOilStock: 300 }
  chance: 0.3
  choices:
    - id: verkaufen
      label: { de: "300 Barrel für 210 $ abgeben", en: "Sell 300 barrels for 210 $" }
      result:
        de: Der Händler zahlt in Gold. Jacob fragt sich, was er weiß, das Jacob nicht weiß.
        en: The dealer pays in gold. Jacob wonders what he knows that Jacob doesn't.
      requires: { minOilStock: 300 }
      effects: { oilStock: -300, cash: 210 }
    - id: ablehnen
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Der Brief bleibt unbeantwortet. Am Hafen kauft ein anderer.
        en: The letter goes unanswered. Someone else sells at the harbour.
      appointments: 0
      default: true

# --- Forderungen ------------------------------------------------------------

- id: post_mietstall
  mail: demand
  once: false
  title:
    de: Rechnung vom Mietstall
    en: A Bill from the Livery Stable
  text:
    de: >-
      Der Mietstall in Port Ellis schickt seine Rechnung für Futter und Hufeisen
      der Fuhrpferde: 60 $. Darunter, mit Bleistift: „Wer nicht zahlt, läuft.“
    en: >-
      The livery stable in Port Ellis sends its bill for the dray horses' feed and
      shoes: 60 $. Below, in pencil: "Them as don't pay, walk."
  chance: 0.15
  choices:
    - id: zahlen
      label: { de: "Bezahlen (60 $)", en: "Pay (60 $)" }
      result:
        de: Der Stallknecht quittiert mit einem Kreuz.
        en: The stable hand signs the receipt with a cross.
      requires: { minCash: 60 }
      effects: { cash: -60 }
      appointments: 0
    - id: liegen
      label: { de: "Liegen lassen", en: "Let it lie" }
      result:
        de: Der Stallbesitzer holt sich das Geld mit Aufschlag – vor allen Leuten im Saloon.
        en: The stable owner collects with a surcharge – in front of everyone at the saloon.
      effects: { cash: -90, strength: -2 }
      appointments: 0
      default: true

- id: post_witwe
  mail: demand
  deadline: 3
  title:
    de: Ein Brief von Anwalt Pruitt
    en: A Letter from Lawyer Pruitt
  text:
    de: >-
      Anwalt Pruitt schreibt im Namen von Mrs. Hale, deren Mann im Frühjahr am
      Salt Hill vom Bohrturm fiel. Sie verlangt 200 $ Entschädigung. Sonst, so
      Pruitt, „wird der Bezirksrichter sich der Sache annehmen“.
    en: >-
      Lawyer Pruitt writes on behalf of Mrs. Hale, whose husband fell from a
      derrick at Salt Hill in the spring. She asks 200 $ in compensation. Otherwise,
      says Pruitt, "the district judge will take up the matter".
  conditions: { minRound: 5 }
  chance: 0.25
  choices:
    - id: zahlen
      label: { de: "Der Witwe 200 $ zahlen", en: "Pay the widow 200 $" }
      result:
        de: 'Mrs. Hale schickt eine Karte. Darauf steht nur: „Danke. Er mochte Sie.“'
        en: 'Mrs. Hale sends a card. It says only: "Thank you. He liked you."'
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [witwe_bezahlt]
    - id: verhandeln
      label: { de: "Zu Pruitt gehen und verhandeln (100 $)", en: "Go to Pruitt and bargain (100 $)" }
      result:
        de: Pruitt nimmt 100 $ und lächelt dabei so, dass Jacob weiß, wie viel davon bei der Witwe ankommt.
        en: Pruitt takes 100 $ and smiles in a way that tells Jacob how much of it will reach the widow.
      requires: { minCash: 100 }
      effects: { cash: -100 }
      appointments: 2
    - id: abweisen
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Der Bezirksrichter spricht Mrs. Hale 350 $ zu. Nora Whitlock sitzt in der letzten Reihe und schreibt mit.
        en: The district judge awards Mrs. Hale 350 $. Nora Whitlock sits in the back row, taking notes.
      effects: { cash: -350 }
      marks: [witwe_verklagt]
      appointments: 0
      default: true

# --- Informationen ----------------------------------------------------------

- id: post_kurier
  mail: info
  once: false
  title:
    de: Der Port Ellis Courier
    en: The Port Ellis Courier
  text:
    de: >-
      Die Zeitung von gestern, mit Fettflecken. Auf Seite drei: neue Bohrtürme am
      Salt Hill, volle Tanks im Hafen, ein Gerücht über Bullards nächste Pacht.
      Wer zwischen den Zeilen liest, weiß, wohin der Preis geht.
    en: >-
      Yesterday's paper, grease-stained. On page three: new derricks at Salt Hill,
      full tanks at the harbour, a rumour about Bullard's next lease. Read between
      the lines and you know where the price is heading.
  chance: 0.15
  choices:
    - id: lesen
      label: { de: "In Ruhe lesen", en: "Read it properly" }
      result:
        de: Jacob liest bis die Lampe rußt. Er kennt jetzt jeden Bohrturm am Hügel beim Namen.
        en: Jacob reads until the lamp smokes. He now knows every derrick on the hill by name.
      effects: { strength: 2 }
    - id: ueberfliegen
      label: { de: "Überfliegen", en: "Skim it" }
      result:
        de: Die Zeitung landet unter dem Kaffeebecher.
        en: The paper ends up under the coffee mug.
      appointments: 0
      default: true

- id: post_geologe
  mail: info
  title:
    de: Ein Bericht, der zu schön ist
    en: A Report That Is Too Good
  text:
    de: >-
      Ein Geologe namens Dr. Ambrose Pike schickt ungefragt einen Bericht: Unter
      der Parzelle am Bach liege „ohne jeden Zweifel“ ein zweiter Salzdom. Für
      weitere 100 $ verrate er, wo genau. Die Proben im Umschlag riechen nach Lampenöl.
    en: >-
      A geologist named Dr. Ambrose Pike sends an unsolicited report: beneath the
      parcel by the creek lies "beyond all doubt" a second salt dome. For another
      100 $ he will say exactly where. The samples in the envelope smell of lamp oil.
  conditions: { minRound: 3 }
  chance: 0.25
  choices:
    - id: bezahlen
      label: { de: "Pike 100 $ schicken", en: "Send Pike 100 $" }
      result:
        de: Pikes Antwort kommt nie. In Port Ellis erzählt man, er habe dasselbe an zwölf Männer verkauft.
        en: Pike's answer never comes. In Port Ellis they say he sold the same report to twelve men.
      requires: { minCash: 100 }
      effects: { cash: -100 }
      marks: [pike_bezahlt]
    - id: entlarven
      label: { de: "Die Proben Silas zeigen", en: "Show the samples to Silas" }
      result:
        de: Silas riecht daran und lacht, bis er husten muss. „Lampenöl und Bahnschotter, Junge.“
        en: Silas sniffs them and laughs until he coughs. "Lamp oil and railway ballast, boy."
      marks: [pike_entlarvt]
    - id: wegwerfen
      label: { de: "Wegwerfen", en: "Throw it away" }
      result:
        de: Der Bericht wandert in den Ofen.
        en: The report goes into the stove.
      appointments: 0
      default: true

# --- Persönliches -----------------------------------------------------------

- id: post_mutter
  mail: personal
  once: false
  title:
    de: Ein Brief aus den Kohleprovinzen
    en: A Letter from the Coal Provinces
  text:
    de: >-
      Jacobs Mutter schreibt in großer, vorsichtiger Schrift. Der Vater hustet
      schlimmer, das Dach ist dicht, der Pfarrer lässt grüßen. Ob Jacob genug
      isst. Ob Ruth gesund ist. Ob er bald einmal schreibt.
    en: >-
      Jacob's mother writes in a large, careful hand. Father's cough is worse, the
      roof holds, the pastor sends his regards. Is Jacob eating enough. Is Ruth well.
      Will he write soon.
  chance: 0.15
  choices:
    - id: antworten
      label: { de: "Einen langen Brief zurückschreiben", en: "Write a long letter back" }
      result:
        de: Jacob schreibt bis spät in die Nacht. Danach ist ihm leichter.
        en: Jacob writes late into the night. Afterwards he feels lighter.
      effects: { strength: 5 }
    - id: geld
      label: { de: "Ein paar Zeilen und 50 $ schicken", en: "Send a few lines and 50 $" }
      result:
        de: Das Geld kommt an. Die Mutter schreibt zurück, sie hätte lieber mehr Zeilen gehabt.
        en: The money arrives. His mother writes back that she would rather have had more lines.
      requires: { minCash: 50 }
      effects: { cash: -50, strength: 2 }
      appointments: 0
    - id: liegen
      label: { de: "Später antworten", en: "Answer later" }
      result:
        de: Der Brief liegt in der Schublade. Jacob denkt öfter an ihn, als ihm lieb ist.
        en: The letter lies in the drawer. Jacob thinks of it more often than he would like.
      effects: { strength: -3 }
      appointments: 0
      default: true

- id: post_drohung
  mail: personal
  deadline: 1
  title:
    de: Ein Zettel unter der Tür
    en: A Note Under the Door
  text:
    de: >-
      Kein Umschlag, keine Unterschrift, nur ein Zettel unter der Tür der Pension:
      „Salt Hill ist voll. Fahr heim, Kohlenjunge, solange du noch fahren kannst.“
      Die Schrift ist ungelenk, das Papier stammt aus Bullards Lohnbüro.
    en: >-
      No envelope, no signature, just a note under the boarding-house door: "Salt
      Hill is full. Go home, coal boy, while you still can." The hand is clumsy;
      the paper comes from Bullard's pay office.
  conditions: { minRound: 4, minLeases: 1 }
  chance: 0.25
  choices:
    - id: sheriff
      label: { de: "Den Zettel zum Sheriff bringen", en: "Take the note to the sheriff" }
      result:
        de: Der Sheriff liest ihn, faltet ihn und steckt ihn ein. „Ich kümmere mich drum“, sagt er, ohne aufzustehen.
        en: The sheriff reads it, folds it and pockets it. "I'll see to it," he says without getting up.
      marks: [drohung_sheriff]
    - id: aufheben
      label: { de: "Aufheben – für später", en: "Keep it – for later" }
      result:
        de: Jacob legt den Zettel zu seinen Papieren. Man weiß nie, wann Bullards Briefpapier noch nützlich wird.
        en: Jacob puts the note with his papers. You never know when Bullard's stationery might come in handy.
      appointments: 0
      marks: [drohung_aufgehoben]
    - id: verbrennen
      label: { de: "Verbrennen und nicht mehr daran denken", en: "Burn it and think no more of it" }
      result:
        de: Der Zettel brennt. Der Gedanke nicht – Jacob schläft schlecht.
        en: The note burns. The thought does not – Jacob sleeps badly.
      effects: { strength: -4 }
      appointments: 0
      default: true
