# Kapitel 3 – Alltag, Paket 5: Gesellschaft und Stand (Phase 4). Entwurf – Philipp überarbeitet.
# Grundlage: Story-Bibel §9 (K3 Thema 5: Club, Kirchenvorstand, Ball, Porträt,
# Krankenhausstiftung), §3 „Weitere“ (Cornelia Vandermeer: „Geld riecht, Mr. Harlan. Wir
# lehren es nur, leiser zu riechen.“; Bruder Abel, Arbeiterkirche; Dan Kerrigan), GDD §13
# Kapitel 3 („Hallsteads alte Familien öffnen die ersten Türen – oder schlagen sie zu“),
# Weltbibel (Jacobs Groll auf die alten Familien).
#
# Nur Kapitel 3 (minChapter/maxChapter 3). Stand und Ruf gibt es als Wirkung noch nicht –
# Ersatz: Kraft (Jacob zahlt mit Nerven) und Geld, siehe „# TODO-Effekt“.
#
# Merkzeichen aus Kapitel 1: kerrigan_lager (Dan Kerrigan lebt und zählt Fässer).
# Merkzeichen dieses Pakets:
#   k3_club_antrag → k3_club_kugel
#   k3_portraet_allein → k3_portraet_flur (Paket 8)

- id: k3_club_antrag
  title:
    de: Der Hallstead Club
    en: The Hallstead Club
  text:
    de: >-
      Ein Bankier aus Hallstead, der Jacobs Anleihen verkauft, bietet an, ihn für den
      Hallstead Club vorzuschlagen. Ledersessel, Porträts von Männern, deren Großväter
      schon reich waren, und eine Abstimmung mit weißen und schwarzen Kugeln. Eine
      einzige schwarze genügt. „Man fragt nicht, wer sie wirft, Mr. Harlan. Das gehört
      zum Charme.“
    en: >-
      A Hallstead banker who sells Jacob's bonds offers to propose him for the Hallstead
      Club. Leather armchairs, portraits of men whose grandfathers were already rich, and
      a vote with white and black balls. A single black one suffices. "One doesn't ask
      who casts it, Mr. Harlan. That's part of the charm."
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.3
  choices:
    - id: antrag
      label: { de: "Sich vorschlagen lassen (2.000 $ Aufnahmegebühr)", en: "Let himself be proposed (2,000 $ admission fee)" }
      result:
        de: Der Antrag liegt aus, drei Wochen lang, in einem Glaskasten neben der Garderobe. Jacob liest, wer unterschrieben hat. Es sind wenige.
        en: The application lies on display for three weeks in a glass case by the cloakroom. Jacob reads who has signed. They are few.
      requires: { minCash: 2000 }
      effects: { cash: -2000 }  # TODO-Effekt: standing: Abstimmung läuft
      marks: [k3_club_antrag]
    - id: nein
      label: { de: "„Ich habe ein eigenes Haus mit Sesseln.“", en: "\"I have a house of my own with armchairs.\"" }
      result:
        de: Der Bankier lacht höflich. Danach verkauft er Jacobs Anleihen mit einem Viertelpunkt mehr Zins. Er sagt, es sei der Markt.
        en: The banker laughs politely. Afterwards he sells Jacob's bonds at a quarter point more interest. He says it's the market.
      effects: { cash: -500 }  # TODO-Effekt: credit: -1, standing: 0
      default: true

- id: k3_club_kugel
  marked: [k3_club_antrag]
  delay: 2
  chance: 0.8
  conditions: { minChapter: 3, maxChapter: 3 }
  title:
    de: Eine schwarze Kugel
    en: A Black Ball
  text:
    de: >-
      Der Bankier kommt persönlich, um es zu sagen: Es lag eine schwarze Kugel in der
      Urne. Eine. Der Club bedaure. Man könne es in einem Jahr noch einmal versuchen.
      Auf dem Weg hinaus erwähnt er, dass Cornelia Vandermeer an diesem Abend im Club
      zu Gast war, was selten vorkommt.
    en: >-
      The banker comes in person to say it: there was a black ball in the urn. One. The
      club regrets. One could try again in a year. On the way out he mentions that
      Cornelia Vandermeer was a guest at the club that evening, which rarely happens.
  choices:
    - id: bibliothek
      label: { de: "Dem Club eine Bibliothek stiften (5.000 $)", en: "Endow the club with a library (5,000 $)" }
      result:
        de: Im nächsten Jahr liegen nur weiße Kugeln in der Urne. Über der Bibliothekstür steht in Messing ein Name, der nicht Harlan ist – Jacob hat es so verlangt. Er geht nie hinein.
        en: The next year the urn holds only white balls. Above the library door a name stands in brass that is not Harlan – Jacob insisted. He never goes in.
      requires: { minCash: 5000 }
      effects: { cash: -5000 }  # TODO-Effekt: standing: +3, boardLoyalty: { vandermeer: +5 }
    - id: druck
      label: { de: "Herausfinden, wessen Bank am Club hängt – und Kredite kündigen", en: "Find out whose bank the club depends on – and call in loans" }
      result:
        de: Drei Clubmitglieder bekommen Briefe von Harlans Anwälten. Im nächsten Jahr wird Jacob aufgenommen. Niemand setzt sich im Lesesaal neben ihn.
        en: Three club members get letters from Harlan's lawyers. The next year Jacob is admitted. No one sits beside him in the reading room.
      effects: { cash: 1500, strength: -10 }  # TODO-Effekt: standing: +1, reputation: { industryFear: +3 }, rival: { vandermeer: -10 }
      appointments: 2
    - id: hinnehmen
      label: { de: "Hinnehmen", en: "Accept it" }
      result:
        de: Jacob nimmt es hin. Abends steht er lange am Fenster. Ruth fragt nicht, woran er denkt. Sie weiß es seit zwanzig Jahren.
        en: Jacob accepts it. In the evening he stands at the window a long time. Ruth doesn't ask what he is thinking. She has known for twenty years.
      effects: { strength: -15 }  # TODO-Effekt: standing: -1
      appointments: 0
      default: true

- id: k3_kirchenvorstand
  visitor: prediger
  title:
    de: Zwei Kirchen, ein Scheckbuch
    en: Two Churches, One Chequebook
  text:
    de: >-
      Bruder Abel ist mager geblieben, aber sein Bart ist weiß. Das Dach der
      Arbeiterkirche in Salt Hill ist eingefallen, die Gemeinde betet im Freien. Am
      selben Morgen kam ein Brief der Ersten Kirche von Port Ellis: Man biete Mr. Harlan
      einen Sitz im Kirchenvorstand an, wo auch der Bürgermeister sitzt. Die Orgel
      müsse erneuert werden. Bruder Abel hat den Brief auf dem Tisch gesehen.
    en: >-
      Brother Abel has stayed thin, but his beard is white. The roof of the workers'
      church in Salt Hill has caved in; the congregation prays in the open. That same
      morning a letter came from the First Church of Port Ellis: Mr. Harlan is offered a
      seat on the church board, where the mayor also sits. The organ needs renewing.
      Brother Abel has seen the letter on the desk.
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.25
  choices:
    - id: dach
      label: { de: "Das Dach in Salt Hill bezahlen (2.000 $)", en: "Pay for the roof in Salt Hill (2,000 $)" }
      result:
        de: Am Sonntag nach dem Richtfest predigt Bruder Abel über den reichen Mann und das Nadelöhr. Er sieht Jacob dabei nicht an. Es ist trotzdem freundlich gemeint.
        en: On the Sunday after the roofing, Brother Abel preaches on the rich man and the eye of the needle. He doesn't look at Jacob. It is kindly meant all the same.
      requires: { minCash: 2000 }
      effects: { cash: -2000, strength: 5 }  # TODO-Effekt: reputation: { workers: +3 }
    - id: vorstand
      label: { de: "Den Sitz im Vorstand nehmen und die Orgel stiften (4.000 $)", en: "Take the board seat and donate the organ (4,000 $)" }
      result:
        de: Die neue Orgel ist so laut, dass man sie bis zum Hafen hört. Der Bürgermeister gibt Jacob nach dem Gottesdienst die Hand. Bruder Abel predigt weiter unter freiem Himmel.
        en: The new organ is so loud it can be heard down at the harbour. After the service the mayor shakes Jacob's hand. Brother Abel keeps preaching under the open sky.
      requires: { minCash: 4000 }
      effects: { cash: -4000 }  # TODO-Effekt: standing: +2, reputation: { workers: -2 }
    - id: keins
      label: { de: "„Gott hat genug Dächer.“", en: "\"God has roofs enough.\"" }
      result:
        de: Bruder Abel steht auf und setzt den Hut auf. „Dann bete ich für Sie unter seinem.“
        en: Brother Abel rises and puts on his hat. "Then I'll pray for you under His."
      appointments: 0
      default: true

- id: k3_portraet
  title:
    de: Ein Maler aus Aldmark
    en: A Painter from Aldmark
  text:
    de: >-
      Der Maler hat Herzöge in Aldmark gemalt und jetzt, sagt er, Ölbarone in Westmark,
      weil die Herzöge nicht mehr zahlen. Er schlägt ein Porträt für die Halle des neuen
      Hauses vor, lebensgroß. Er mustert Jacobs Hände und sagt, die müsse er
      verstecken. „Man sieht ihnen an, dass sie gearbeitet haben, Sir.“
    en: >-
      The painter has painted dukes in Aldmark and now, he says, oil barons in Westmark,
      because the dukes no longer pay. He proposes a portrait for the hall of the new
      house, life-size. He studies Jacob's hands and says he must hide them. "One can see
      they have worked, sir."
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.25
  choices:
    - id: allein
      label: { de: "Allein, im Anzug, die Hände versteckt (2.500 $)", en: "Alone, in a suit, hands hidden (2,500 $)" }
      result:
        de: Das Bild hängt sechs Monate später in der Halle. Der Mann darauf sieht reich aus und ein wenig fremd. Die Dienstboten nennen ihn „der Herr im Flur“.
        en: Six months later the picture hangs in the hall. The man in it looks rich and a little strange. The servants call him "the gentleman in the hall".
      requires: { minCash: 2500 }
      effects: { cash: -2500 }  # TODO-Effekt: standing: +1, legacy: +1
      marks: [k3_portraet_allein]
    - id: familie
      label: { de: "Mit Ruth und den Kindern, die Hände sichtbar (3.000 $, 2 Termine)", en: "With Ruth and the children, hands showing (3,000 $, 2 appointments)" }
      result:
        de: Die Sitzungen dauern Wochen. Ruth und Jacob reden dabei mehr als seit Jahren, weil man stillhalten muss. Auf dem Bild hält Jacob einen Bohrmeißel, wie früher.
        en: The sittings take weeks. Ruth and Jacob talk more than in years, because one has to keep still. In the picture Jacob holds a drill bit, as he once did.
      requires: { minCash: 3000 }
      effects: { cash: -3000, ruth: 10, thomas: 8 }  # TODO-Effekt: clara: +8, standing: 0
      appointments: 2
    - id: nein
      label: { de: "„Ich hänge mich nicht an die Wand.“", en: "\"I won't hang myself on a wall.\"" }
      result:
        de: Der Maler zuckt die Schultern und malt im nächsten Monat Margaret Crane. Ihr Bild hängt bald in der Ausstellung in Hallstead.
        en: The painter shrugs and paints Margaret Crane the next month. Her picture soon hangs in the Hallstead exhibition.
      appointments: 0
      default: true

- id: k3_krankenhaus
  title:
    de: Ein Flügel für das Krankenhaus
    en: A Wing for the Hospital
  text:
    de: >-
      Doktor Haskell leitet jetzt das Krankenhaus von Port Ellis. Es hat zwanzig Betten
      für eine Stadt mit vierzigtausend Menschen, die meisten davon Arbeiter. Er braucht
      einen neuen Flügel. Die Stadt würde ihn nach dem Stifter benennen. „Mir ist egal,
      wie er heißt, Jacob. Mir ist nur wichtig, dass er nächsten Winter steht.“
    en: >-
      Doctor Haskell now runs the Port Ellis hospital. It has twenty beds for a town of
      forty thousand people, most of them workers. He needs a new wing. The town would
      name it after the donor. "I don't care what it's called, Jacob. I only care that it
      stands next winter."
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.25
  choices:
    - id: name
      label: { de: "Den Harlan-Flügel stiften (6.000 $)", en: "Endow the Harlan Wing (6,000 $)" }
      result:
        de: Über dem Eingang steht HARLAN in Stein. Bei der Eröffnung hält der Bürgermeister eine Rede, der Ledger bringt ein Foto. Haskell steht am Rand und zählt Betten.
        en: HARLAN stands in stone above the entrance. At the opening the mayor gives a speech and the Ledger runs a photograph. Haskell stands at the edge counting beds.
      requires: { minCash: 6000 }
      effects: { cash: -6000 }  # TODO-Effekt: standing: +2, reputation: { public: +3 }, legacy: +2
    - id: anonym
      label: { de: "Anonym stiften (6.000 $)", en: "Endow it anonymously (6,000 $)" }
      result:
        de: Der Flügel heißt nach einer Heiligen. Niemand weiß, wer bezahlt hat, außer Haskell und Ruth. Ruth sieht Jacob an diesem Abend lange an.
        en: The wing is named after a saint. No one knows who paid except Haskell and Ruth. Ruth looks at Jacob a long time that evening.
      requires: { minCash: 6000 }
      effects: { cash: -6000, ruth: 8, strength: 5 }  # TODO-Effekt: reputation: { workers: +1 }
    - id: nein
      label: { de: "„Die Stadt soll ihr Krankenhaus selbst bauen.“", en: "\"Let the town build its own hospital.\"" }
      result:
        de: Haskell nickt. Im Winter liegen die Kranken auf den Fluren. Zwei davon arbeiten auf Harlan-Feldern.
        en: Haskell nods. In winter the sick lie in the corridors. Two of them work on Harlan fields.
      effects: { production: -0.05 }  # TODO-Effekt: reputation: { workers: -2 }
      appointments: 0
      default: true

- id: k3_wohltaetigkeitsball
  title:
    de: Die Versteigerung bei den Vandermeers
    en: The Auction at the Vandermeers'
  text:
    de: >-
      Cornelia Vandermeer lädt zum Wohltätigkeitsball zugunsten der Waisen der
      Kohleprovinzen. Versteigert wird ein Gemälde aus ihrem Besitz. Jeder in Hallstead
      wird sehen, wer wie viel bietet. Auf der Einladung steht, mit Tinte nachgetragen:
      „Geld riecht, Mr. Harlan. Wir lehren es nur, leiser zu riechen.“
    en: >-
      Cornelia Vandermeer invites to a charity ball for the orphans of the coal
      provinces. A painting from her own collection is to be auctioned. All Hallstead
      will see who bids how much. On the invitation, added in ink: "Money smells,
      Mr. Harlan. We merely teach it to smell more quietly."
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.25
  choices:
    - id: hoch
      label: { de: "Das Bild ersteigern, egal zu welchem Preis (5.000 $, 2 Termine)", en: "Win the painting at any price (5,000 $, 2 appointments)" }
      result:
        de: Jacob bietet, bis alle anderen aufhören. Applaus, kurz und kühl. Cornelia Vandermeer dankt ihm öffentlich für seine „bemerkenswerte Entschlossenheit“. Alle hören, was sie meint.
        en: Jacob bids until everyone else stops. Applause, brief and cool. Cornelia Vandermeer thanks him publicly for his "remarkable determination". Everyone hears what she means.
      requires: { minCash: 5000 }
      effects: { cash: -5000, strength: -5 }  # TODO-Effekt: standing: +1, reputation: { public: +1 }
      appointments: 2
    - id: massvoll
      label: { de: "Maßvoll bieten und früh gehen (1.000 $)", en: "Bid modestly and leave early (1,000 $)" }
      result:
        de: Ein Bankier aus Hallstead ersteigert das Bild. Jacob ist um elf zu Hause. Ruth hat auf ihn gewartet.
        en: A Hallstead banker wins the painting. Jacob is home by eleven. Ruth waited up for him.
      requires: { minCash: 1000 }
      effects: { cash: -1000, ruth: 5 }  # TODO-Effekt: standing: 0
    - id: waisen
      label: { de: "Nicht hingehen, den Waisenhäusern direkt spenden (2.000 $)", en: "Stay away, give to the orphanages directly (2,000 $)" }
      result:
        de: Das Geld kommt in den Kohleprovinzen an, ohne Ball. Jemand in Hallstead nennt es ungehobelt. In einer Kohlestadt, die Jacob kennt, hängt danach sein Bild in der Schule.
        en: The money reaches the coal provinces without a ball. Someone in Hallstead calls it uncouth. In a coal town Jacob knows, his picture hangs in the school afterwards.
      effects: { cash: -2000, strength: 10 }  # TODO-Effekt: standing: -1, reputation: { workers: +2 }
      default: true

- id: k3_kerrigan_tor
  marked: [kerrigan_lager]
  delay: 0
  chance: 0.35
  conditions: { minChapter: 3, maxChapter: 3 }
  title:
    de: Dan Kerrigan am Tor
    en: Dan Kerrigan at the Gate
  text:
    de: >-
      Drinnen sitzen Gäste aus Hallstead beim Essen, ein Bankier, ein Richter, ihre
      Frauen. Draußen am Tor steht Dan Kerrigan, der seit zwanzig Jahren Fässer zählt
      und heute in Rente geht. Er hat eine Flasche dabei, die er nicht selbst trinken
      darf. Der Diener fragt, ob er ihn wegschicken soll.
    en: >-
      Inside, guests from Hallstead sit at dinner, a banker, a judge, their wives.
      Outside at the gate stands Dan Kerrigan, who has counted barrels for twenty years
      and retires today. He has brought a bottle he isn't allowed to drink himself. The
      servant asks whether he should send him away.
  choices:
    - id: herein
      label: { de: "Ihn an den Tisch holen", en: "Bring him to the table" }
      result:
        de: Kerrigan sitzt zwischen dem Richter und dessen Frau und erzählt vom Brand am Salt Hill. Der Richter hört zu, die Frau nicht. Jacob lacht an diesem Abend zum ersten Mal seit Wochen.
        en: Kerrigan sits between the judge and his wife and tells of the fire at Salt Hill. The judge listens, the wife doesn't. Jacob laughs that evening for the first time in weeks.
      effects: { strength: 15 }  # TODO-Effekt: standing: -1, reputation: { workers: +2 }
    - id: kueche
      label: { de: "In die Küche bitten, mit einem Umschlag (1.000 $)", en: "Ask him into the kitchen, with an envelope (1,000 $)" }
      result:
        de: Jacob geht zwischen zwei Gängen in die Küche. Kerrigan nimmt den Umschlag und lässt die Flasche da. Er sagt „Mr. Harlan“, zum ersten Mal.
        en: Jacob slips into the kitchen between two courses. Kerrigan takes the envelope and leaves the bottle. He says "Mr. Harlan", for the first time.
      requires: { minCash: 1000 }
      effects: { cash: -1000 }  # TODO-Effekt: reputation: { workers: +1 }
    - id: weg
      label: { de: "„Sagen Sie ihm, ich komme morgen vorbei.“", en: "\"Tell him I'll call tomorrow.\"" }
      result:
        de: Jacob kommt am nächsten Tag nicht vorbei und am übernächsten auch nicht. Die Flasche steht noch Wochen im Pförtnerhaus.
        en: Jacob doesn't call the next day, nor the day after. The bottle stands in the gatehouse for weeks.
      effects: { strength: -15 }  # TODO-Effekt: reputation: { workers: -2 }
      appointments: 0
      default: true
