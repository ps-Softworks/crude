# Kapitel 1 – Ruth merkt, dass Jacob am Ende ist (2.3). Entwurf von Claude, bitte
# in eigener Stimme umschreiben. Kraft ist nie als Zahl sichtbar (GDD §4) – Ruth
# spricht es an. Kommt nur, wenn Jacob müde ist (maxStrength), und kann wiederkommen.

- id: ruth_sorge
  visitor: ruth
  title:
    de: Ruth bringt das Abendessen
    en: Ruth Brings Supper
  text:
    de: >-
      Ruth bringt einen Teller ins Büro, weil Jacob wieder nicht zum Essen
      gekommen ist. Sie stellt ihn auf die Papiere und bleibt stehen. „Du bist
      grau im Gesicht, Jacob. Du schläfst über den Büchern ein. Was nützt uns eine
      Quelle, wenn du darüber umfällst?“
    en: >-
      Ruth brings a plate to the office because Jacob missed supper again. She
      sets it down on the papers and stays standing. "You're grey in the face,
      Jacob. You fall asleep over the books. What good is a well to us if you drop
      dead over it?"
  conditions: { maxStrength: 60 }
  chance: 0.5
  once: false
  choices:
    - id: versprechen
      label: { de: "Ihr versprechen, kürzerzutreten, und mit ihr nach Hause gehen", en: "Promise her to slow down, and walk home with her" }
      result:
        de: Jacob schließt das Büro ab und geht mit ihr. Ruth sagt nichts mehr, aber sie lässt ihn ausschlafen.
        en: Jacob locks up the office and goes with her. Ruth says no more, but she lets him sleep late.
      effects: { strength: 12, ruth: 4 }
    - id: abwinken
      label: { de: "Abwinken – nach der nächsten Quelle wird es ruhiger", en: "Wave it off – it'll calm down after the next well" }
      result:
        de: Ruth räumt den Teller ab, halb voll.
        en: Ruth clears the plate away, half full.
      effects: { ruth: -4 }
      appointments: 0
      default: true
