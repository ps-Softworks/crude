# Kapitel 1 – Alltag, Paket 2: Geschäft in Port Ellis (2.10a, Ereignisse 11–20). Entwurf von
# Claude, bitte in eigener Stimme umschreiben. Fuhrwerke, Fässer, Tanks, Pachten, Gerüchte.
# Wiederholungsschutz und Entwürfe: siehe Kopf von k1-8-alltag-1.yaml.

# --- Brennans Fuhrleute (Etappe 3: nur, solange Brennan unter Vertrag fährt; „Sumpf“ hineingelegt) ---

- id: fuhre_aufschlag
  mail: demand
  marked: [brennan_faehrt]
  once: false
  cooldown: 4
  title:
    de: Brennans Fuhrleute wollen Aufschlag
    en: Brennan's Teamsters Want More
  text:
    de: >-
      Brennan schreibt mit Bleistift auf einem Frachtzettel: Drei Tage Regen, und der
      Fuhrweg nach Port Ellis ist ein brauner Sumpf. Seine Leute stehen mit den
      Ochsengespannen am Feldrand und rühren sich nicht. Der Weg sei schlechter
      geworden, die Fässer schwerer und der Whiskey teurer. Zehn Cent mehr das Fass –
      Vertrag hin oder her.
    en: >-
      Brennan writes in pencil on a freight slip: three days of rain, and the wagon
      road to Port Ellis is a brown swamp. His men stand with their ox teams at the
      edge of the field and don't move. The road has got worse, the barrels heavier
      and the whiskey dearer. Ten cents more a barrel – contract or no contract.
  conditions: { minOilStock: 100, minRound: 2 }
  chance: 0.3
  choices:
    - id: zahlen
      label: { de: "Den Aufschlag für die Saison zahlen ({cash})", en: "Pay the surcharge for the season ({cash})" }
      result:
        de: Die Ochsen ziehen an. Der Sprecher tippt sich an den Hut.
        en: The oxen pull. The spokesman touches his hat.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      appointments: 0
    - id: bohlen
      label: { de: "Mit dem Trupp einen Bohlenweg legen ({cash} Holz)", en: "Lay a plank road with the crew ({cash} timber)" }
      result:
        de: Zwei Tage im Schlamm, dann liegt ein Bohlenweg bis zur Straße. Die Fuhrleute haben keinen Grund mehr zu murren und fahren zum alten Preis.
        en: Two days in the mud, then a plank road runs to the highway. The teamsters have nothing left to grumble about and drive at the old price.
      requires: { minCash: 40 }
      effects: { cash: -40, strength: -6 }
      appointments: 2
      sharp: true              # beste Antwort (2.7): fehlt, wenn Jacob erschöpft ist
    - id: warten
      label: { de: "Sie stehen lassen", en: "Leave them standing" }
      result:
        de: "Die Fässer stehen zwei Wochen im Regen und dann in der Sonne. Holz schwindet, Öl leckt – 250 Barrel sind weg."
        en: "The barrels stand two weeks in the rain and then in the sun. Wood shrinks, oil leaks – 250 barrels are gone."
      effects: { oilStock: -250 }
      appointments: 0
      default: true

- id: spekulant_angebot
  mail: offer
  draft: true                # Schlüsselszene: das erste große Angebot für Jacobs Land
  deadline: 3
  title:
    de: Ein Herr aus Hallstead will kaufen
    en: A Gentleman from Hallstead Wants to Buy
  text:
    de: >-
      Ein Brief auf schwerem Papier, das Siegel einer Kanzlei in Hallstead. Ein
      Mr. Ashcombe möchte Jacobs Pacht übernehmen, „als Anlage für Mandanten“.
      Er bietet 900 $ sofort. Unter der Unterschrift steht kein Vorname.
    en: >-
      A letter on heavy paper, the seal of a Hallstead law firm. A Mr. Ashcombe
      wishes to take over Jacob's lease, "as an investment for clients". He offers
      900 $ at once. There is no first name under the signature.
  conditions: { minLeases: 2, minRound: 5 }
  chance: 0.04
  choices:
    - id: hochhandeln
      label: { de: "Ihm für {cash} ein Vorkaufsrecht geben", en: "Sell him a right of first refusal for {cash}" }
      result:
        de: "Ashcombe zahlt prompt. Drei Wochen später kauft er auch Bullards Nachbarpacht – seitdem verlangen die Farmer am Hügel mehr."
        en: "Ashcombe pays promptly. Three weeks later he buys Bullard's neighbouring lease too – since then the farmers on the hill have asked for more."
      effects: { cash: 300, leaseCost: 0.2 }
    - id: behalten
      label: { de: "Nicht antworten – das Land bleibt", en: "Don't reply – the land stays" }
      result:
        de: Der Brief kommt in die Schublade zu den anderen. Ashcombe kauft stattdessen Bullards Nachbarpacht, und die Farmer am Hügel rechnen seitdem mit Hallsteader Preisen.
        en: The letter goes into the drawer with the others. Ashcombe buys Bullard's neighbouring lease instead, and the farmers on the hill have reckoned in Hallstead prices ever since.
      effects: { leaseCost: 0.1 }
      appointments: 0
      default: true

- id: bezirk_steuer
  mail: demand
  title:
    de: Der Bezirk will Steuern
    en: The County Wants Its Taxes
  text:
    de: >-
      Der Bezirkskämmerer von Cordova hat entdeckt, dass Bohrtürme Bauwerke sind.
      Für jedes Bauwerk ist eine Abgabe fällig, rückwirkend ab Frühjahr. Der Brief
      ist höflich und lang und endet mit dem Wort „Pfändung“.
    en: >-
      The county treasurer of Cordova has discovered that derricks are structures.
      Every structure owes a levy, backdated to the spring. The letter is polite and
      long and ends with the word "distraint".
  conditions: { minLeases: 1, minRound: 6 }
  chance: 0.05
  choices:
    - id: zahlen
      label: { de: "Zahlen ({cash})", en: "Pay ({cash})" }
      result:
        de: Der Kämmerer schickt eine Quittung mit Stempel. Es ist der schönste Stempel in Cordova.
        en: The treasurer sends a stamped receipt. It is the finest stamp in Cordova.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      appointments: 0
    - id: einspruch
      label: { de: "Zum Bezirksgericht und Einspruch einlegen", en: "Go to the county court and appeal" }
      result:
        de: Der Richter liest das Gesetz laut vor und findet kein Wort über Bohrtürme. Die Abgabe halbiert sich.
        en: The judge reads the statute aloud and finds no word about derricks. The levy is halved.
      requires: { minCash: 60 }
      effects: { cash: -60, strength: -3 }
      appointments: 2
    - id: liegen
      label: { de: "Liegen lassen", en: "Let it lie" }
      result:
        de: "Der Sheriff pfändet eine Dampfpumpe und versteigert sie an Bullard. Mit Gebühren kostet das {cash}."
        en: "The sheriff seizes a steam pump and auctions it to Bullard. With fees that costs {cash}."
      effects: { cash: -320 }
      appointments: 0
      default: true

# --- Antworten auf Jacobs Pläne (Etappe 3) ------------------------------------
# Erkundung: Wer übers Land reitet, dem bietet ein Bohrmeister seine Bohrliste an (wird zum Bohrbericht
# auf einer Ranch, siehe src/sim/letters.ts). Zurückgehaltenes Öl: Jemand will, dass Jacob billig verkauft.

- id: geruecht_fund
  mail: offer
  once: false
  cooldown: 6
  marked: [erkundet]
  title:
    de: Ein Bohrmeister verkauft seine Bohrliste
    en: A Driller Sells His Log
  text:
    de: >-
      Eine Postkarte von einem Bohrmeister, der früher für Silas gearbeitet hat:
      Er habe gehört, dass Jacob übers Land reitet. Letzten Herbst habe er auf einer
      Ranch ganz in der Nähe eine Probebohrung gemacht, bevor seinem Geldgeber das
      Geld ausging. Die Bohrliste – Fuß für Fuß, Schicht für Schicht – gebe er für
      {cash:kaufen} ab. Sonst eben an Bullard.
    en: >-
      A postcard from a driller who used to work for Silas: he hears Jacob has been
      riding the country. Last autumn he sank a test hole on a ranch close by,
      before his backer ran out of money. The log – foot by foot, layer by layer –
      is his for {cash:kaufen}. Otherwise Bullard gets it.
  conditions: { minRound: 2 }
  chance: 0.3
  choices:
    - id: kaufen
      label: { de: "Die Bohrliste kaufen ({cash})", en: "Buy the log ({cash})" }
      result:
        de: Die Bohrliste kommt mit der nächsten Post, in Wachstuch eingeschlagen. Ruth trägt die Ranch auf der Karte ein.
        en: The log arrives with the next post, wrapped in oilcloth. Ruth marks the ranch on the map.
      requires: { minCash: 150 }
      effects: { cash: -150 }
      marks: [bohrliste_gekauft]
    - id: ablegen
      label: { de: "Bullard soll sie haben", en: "Let Bullard have it" }
      result:
        de: Die Postkarte hängt über dem Schreibtisch. Bullard zahlt den Bohrmeister und pachtet eine Woche später zwei Ranches am Bach – die Farmer dort verlangen seitdem mehr.
        en: The postcard hangs over the desk. Bullard pays the driller and a week later leases two ranches by the creek – the farmers there have asked more ever since.
      effects: { leaseCost: 0.1 }
      appointments: 0
      default: true

- id: geruecht_tanks
  mail: info
  once: false
  cooldown: 4
  marked: [oel_zurueckgehalten]
  title:
    de: Volle Tanks im Hafen
    en: Full Tanks at the Harbour
  text:
    de: >-
      Ein Zettel ohne Absender, in ordentlicher Kontorschrift: Die Tanks des Crane
      Trust am Hafen seien bis zum Rand voll, und Crane kaufe in diesem Monat
      kein Barrel mehr zu. Wer jetzt verkauft, verkauft gut.
    en: >-
      A note with no sender, in a neat clerk's hand: the Crane Trust's tanks at the
      harbour are full to the brim, and Crane won't buy another barrel this month.
      Sell now and you sell well.
  conditions: { minOilStock: 400, minRound: 3 }
  chance: 0.3
  choices:
    - id: verkaufen
      label: { de: "Sofort 400 Barrel an einen Händler abgeben (+160 $)", en: "Sell 400 barrels to a dealer at once (+160 $)" }
      result:
        de: Der Händler zahlt, ohne zu feilschen. Das war vielleicht der Fehler.
        en: The dealer pays without haggling. That may have been the mistake.
      requires: { minOilStock: 400 }
      effects: { oilStock: -400, cash: 160 }
      fixedCash: true
      appointments: 0
    - id: pruefen
      label: { de: "Selbst zum Hafen und die Tanks ansehen", en: "Go to the harbour and look at the tanks" }
      result:
        de: "Die Tanks klingen hohl, wenn man dagegen klopft. Jemand wollte, dass Jacob billig verkauft. Jacob lässt Lusk wissen, dass er es weiß. Der Trust zahlt ihm eine Weile ein paar Cent mehr, damit er schweigt."
        en: "The tanks ring hollow when you knock on them. Someone wanted Jacob to sell cheap. Jacob lets Lusk know that he knows. For a while the Trust pays him a few cents more to keep quiet."
      effects: { strength: -3, price: 0.03 }
      sharp: true              # beste Antwort (2.7): fehlt, wenn Jacob erschöpft ist
    - id: ignorieren
      label: { de: "Zettel ohne Absender liest man nicht", en: "Notes without a sender don't get read" }
      result:
        de: Der Zettel geht in den Ofen. Lusk merkt, dass Jacob nicht anbeißt, und lässt ihn bei der Probe eine Weile spüren, wer die Fässer annimmt.
        en: The note goes into the stove. Lusk notices that Jacob won't bite, and for a while at the sampling he lets him feel who accepts the barrels.
      effects: { price: -0.02 }
      appointments: 0
      default: true
