      widow. Then to Silas, who lives in a boarding house in Port Ellis now and no
      longer knows where to go in the mornings. "He says he was sober," Nora says.
      "The men say so too. Your board needed someone to blame, Mr. Harlan, and you
      delivered him. Is that true?"
