# Kapitel 1 – Alltag, Paket 6: Familie, Presse, Politik in Cordova (2.10b, Ereignisse 57–67).
# Entwurf von Claude, bitte in eigener Stimme umschreiben. Ton: Weltbibel (Ruth will mitreden,
# Nora Whitlock, die drei Parteien, käuflicher Sheriff, langsamer Bezirksrichter).
#
# Erfunden und nicht in der Weltbibel: Ruths Schwester Hannah, Redakteur Bixby vom Courier
# (der Courier selbst stammt aus Paket 2/3), die Kandidaten Amos Teague (Handelspartei) und
# Walt Harrow (Volksbund), Gerichtsschreiber Doolittle, Grenznachbar Fenwick.
#
# Folgen früherer Pakete, die hier aufgegriffen werden:
#   ruth_buchhalterin (Ruth und die Quittungen) → ruth_anteil
#   nora_interview (Nora will ein Gespräch)      → nora_artikel
#   thomas_geboren (setzt die Simulation)         → thomas_taufe
# Neu für spätere Kapitel: ruth_teilhaberin, volksbund_spende, handelspartei_spende, liga_petition.
# Etappe 3 (Briefe ausdünnen): Wahltag ist in „Zwei Kandidaten“ aufgegangen, das Angebot des Couriers in
# „Nora will ein Gespräch“; gestrichen sind das Haus an der Bay Street, Thomas' Krupp und der langsame Richter.

# --- Familie ------------------------------------------------------------------

- id: ruth_anteil
  visitor: ruth
  marked: [ruth_buchhalterin]
  delay: 3
  chance: 0.3
  draft: true                # Schlüsselszene: Ruth will einen eigenen Anteil (Weltbibel: Ziel und Bruchstelle)
  title:
    de: Ruth will ihren Namen auf dem Papier
    en: Ruth Wants Her Name on the Paper
  text:
    de: >-
      Ruth führt seit Monaten die Bücher. Heute legt sie eine Pachturkunde auf den
      Tisch, die Feder daneben. Sie will ihren Namen neben Jacobs, nicht darunter.
      „Wenn dir etwas passiert, Jacob, dann bin ich vor dem Richter nur deine Witwe.“
    en: >-
      Ruth has kept the books for months. Today she lays a lease deed on the table,
      the pen beside it. She wants her name next to Jacob's, not beneath it. "If
      something happens to you, Jacob, before the judge I'm only your widow."
  choices:
    - id: ja
      label: { de: "Unterschreiben lassen", en: "Let her sign" }
      result:
        de: "Ruth schreibt langsam und sehr gerade. Danach liest sie die Urkunde noch einmal, als hätte sie sie selbst aufgesetzt. Bei den nächsten Pachten verhandelt sie mit – und die Farmer geben ihr nach."
        en: "Ruth writes slowly and very straight. Afterwards she reads the deed again, as if she had drawn it up herself. At the next leases she bargains too – and the farmers give way to her."
      effects: { ruth: 15, leaseCost: -0.15 }
      marks: [ruth_teilhaberin]
    - id: spaeter
      label: { de: "„Wenn die zweite Quelle fließt“", en: "\"When the second well flows\"" }
      result:
        de: Ruth nickt und legt die Urkunde in die Kiste unter dem Bett. Sie wird sich das Datum merken.
        en: Ruth nods and puts the deed in the box under the bed. She will remember the date.
      effects: { ruth: -5 }
      marks: [ruth_vertroestet]
    - id: nein
      label: { de: "„Das ist Männersache“", en: "\"That's men's business\"" }
      result:
        de: Ruth nimmt die Feder und legt sie in die Schublade. Am Abend führt sie die Bücher weiter, aber sie spricht nicht mehr darüber.
        en: Ruth takes the pen and puts it in the drawer. That evening she keeps the books as before, but she no longer talks about them.
      effects: { ruth: -20 }
      marks: [ruth_zurueckgewiesen]
      appointments: 0
      default: true

- id: ruth_schwester
  mail: personal
  title:
    de: Hannah schreibt aus den Kohleprovinzen
    en: Hannah Writes from the Coal Provinces
  text:
    de: >-
      Ruths Schwester Hannah heiratet im Herbst, in der alten Kapelle neben der
      Zeche. Sie schreibt vier Seiten und auf jeder steht: Komm. Die Fahrt dauert
      eine Woche, hin und zurück zwei, und kostet, was ein Bohrtrupp im Monat verdient.
    en: >-
      Ruth's sister Hannah is getting married in the autumn, in the old chapel by
      the colliery. She writes four pages, and every one says: come. The journey
      takes a week, two there and back, and costs what a drilling crew earns in a month.
  conditions: { minRound: 4, maxRound: 14 }
  chance: 0.04
  choices:
    - id: zusammen
      label: { de: "Zusammen fahren ({cash}, drei Termine)", en: "Go together ({cash}, three appointments)" }
      result:
        de: Die Kohlestadt ist kleiner, als Jacob sie in Erinnerung hat. Ruth tanzt mit ihm, zum ersten Mal seit Port Ellis.
        en: The coal town is smaller than Jacob remembers. Ruth dances with him, for the first time since Port Ellis.
      requires: { minCash: 250 }
      effects: { cash: -250, ruth: 12, strength: 4 }
      appointments: 3
    - id: allein
      label: { de: "Ruth allein fahren lassen ({cash})", en: "Let Ruth go alone ({cash})" }
      result:
        de: Drei Wochen ist die Pension still. Ruth kommt mit einem Kuchen zurück und mit Hannahs Grüßen, die nicht ganz freundlich klingen.
        en: For three weeks the boarding house is quiet. Ruth comes back with a cake and with Hannah's greetings, which don't sound entirely friendly.
      requires: { minCash: 150 }
      effects: { cash: -150, ruth: 6 }
    - id: geschenk
      label: { de: "Ein Geschenk schicken ({cash})", en: "Send a present ({cash})" }
      result:
        de: Ein Teeservice aus Port Ellis, gut verpackt. Ruth schreibt die Karte. Sie schreibt nur ihren eigenen Namen darunter.
        en: A tea service from Port Ellis, well packed. Ruth writes the card. She signs only her own name.
      effects: { cash: -40, ruth: -6 }
      appointments: 0
      default: true

- id: thomas_taufe
  conditions: { maxThomasAge: 3 }   # 4.5: getauft wird als Kleinkind, nicht in Kapitel 2
  marked: [thomas_geboren]
  delay: 1
  chance: 0.2
  title:
    de: Wer wird Pate?
    en: Who Will Be Godfather?
  text:
    de: >-
      Die Taufe ist am Sonntag. Ruth fragt, wer Pate wird. Silas hat schon dreimal
      erwähnt, dass er noch nie Pate war. Pettibone von der Bank hat beiläufig
      gesagt, er fühle sich geehrt, falls. Ruth schaut Jacob an und wartet.
    en: >-
      The christening is on Sunday. Ruth asks who will be godfather. Silas has
      mentioned three times that he has never been one. Pettibone from the bank said
      in passing he'd be honoured, should the occasion arise. Ruth looks at Jacob
      and waits.
  choices:
    - id: silas
      label: { de: "Silas", en: "Silas" }
      result:
        de: Silas kommt nüchtern und in einem geliehenen Anzug. Er hält Thomas, als wäre er aus Glas, und weint als Einziger.
        en: Silas comes sober and in a borrowed suit. He holds Thomas as if he were made of glass, and he is the only one who cries.
      effects: { ruth: 8, strength: 8 }
    - id: bankier
      label: { de: "Pettibone", en: "Pettibone" }
      result:
        de: "Pettibone schenkt einen silbernen Löffel mit dem Zeichen der Thorne-Bank. Silas trinkt draußen. Ein Wort von ihm an der Bahn, und Jacobs Fässer fahren einen Cent billiger. Ruth sagt nichts dazu."
        en: "Pettibone gives a silver spoon bearing the Thorne bank's mark. Silas drinks outside. One word from him at the railway, and Jacob's barrels travel a cent cheaper. Ruth says nothing about it."
      effects: { ruth: -3, railTariff: -0.01 }
    - id: ruth
      label: { de: "Ruth soll entscheiden", en: "Let Ruth decide" }
      result:
        de: Ruth wählt ihre Schwester Hannah, die nicht kommen kann. Bruder Abel tauft. Es ist klein und sehr still.
        en: Ruth chooses her sister Hannah, who cannot come. Brother Abel baptises. It's small and very quiet.
      effects: { ruth: 2 }
      appointments: 0
      default: true

# --- Presse -------------------------------------------------------------------

- id: nora_artikel
  marked: [nora_interview]
  delay: 2
  chance: 0.35
  draft: true                # Schlüsselszene: Noras erster Artikel über Jacob – wie reagiert er?
  title:
    de: Noras Artikel ist erschienen
    en: Nora's Article Is Out
  text:
    de: >-
      „Die neuen Männer vom Salt Hill, Teil drei: Jacob Harlan.“ Nora hat genau
      aufgeschrieben, was Jacob gesagt hat – auch das, was er lieber nicht gesagt
      hätte. Im Saloon wird vorgelesen. Lusk vom Trust hat den Artikel an die Wand
      seines Büros genagelt.
    en: >-
      "The New Men of Salt Hill, Part Three: Jacob Harlan." Nora wrote down exactly
      what Jacob said – including what he'd rather not have said. In the saloon it's
      being read aloud. Lusk from the Trust has nailed the article to his office wall.
  choices:
    - id: danken
      label: { de: "Nora schreiben, dass es stimmt", en: "Write to Nora that it's accurate" }
      result:
        de: "Nora antwortet mit einer Zeile. „Das schreibt mir sonst keiner.“ Sie wird wiederkommen. Die Farmer, die den Artikel gelesen haben, wissen jetzt, dass Jacob zu seinem Wort steht."
        en: "Nora replies with one line: \"Nobody else writes me that.\" She will be back. The farmers who read the article now know that Jacob stands by his word."
      marks: [nora_respekt]
      effects: { leaseCost: -0.15 }
    - id: beschweren
      label: { de: "Sich beim Redakteur beschweren", en: "Complain to the editor" }
      result:
        de: "Bixby druckt eine Richtigstellung, klein, auf Seite sechs. Nora bekommt eine Rüge und ein Notizbuch mehr. Lusk nimmt den Artikel von der Wand. Der Trust schätzt Männer, die die Presse zurechtweisen."
        en: "Bixby prints a correction, small, on page six. Nora gets a reprimand and one more notebook. Lusk takes the article off his wall. The Trust values men who put the press in its place."
      marks: [nora_beschwert]
      effects: { price: 0.02 }
    - id: lachen
      label: { de: "Den Artikel im Saloon selbst vorlesen", en: "Read the article aloud in the saloon yourself" }
      result:
        de: Jacob liest mit verstellter Stimme, der Saloon brüllt. Am Ende lacht sogar Bullard. Am Abend ist Jacob müder als nach einer Schicht. Die Farmer lachen mit – und merken sich, was Jacob für Land zahlt.
        en: Jacob reads in a put-on voice and the saloon roars. By the end even Bullard is laughing. By evening Jacob is wearier than after a shift. The farmers laugh along – and remember what Jacob pays for land.
      effects: { strength: -2, leaseCost: 0.1 }
      appointments: 0
      default: true

# --- Politik in Cordova -------------------------------------------------------

- id: wahl_spende
  draft: true                # Schlüsselszene: erste Berührung mit den Parteien (GDD §8)
  title:
    de: Zwei Kandidaten für den Bezirk
    en: Two Candidates for the County
  text:
    de: >-
      Im Herbst wählt Cordova einen neuen Bezirksrat. Amos Teague von der
      Handelspartei kommt mit Zigarren und spricht von Eisenbahnen. Walt Harrow vom
      Volksbund kommt zu Fuß und spricht von Thornes Tarifen. Beide brauchen Geld.
    en: >-
      In the autumn Cordova elects a new county council. Amos Teague of the Trade
      Party comes with cigars and talks about railways. Walt Harrow of the People's
      League comes on foot and talks about Thorne's tariffs. Both need money.
  conditions: { minRound: 5 }
  chance: 0.08
  choices:
    - id: teague
      public: [support_handel]
      label: { de: "Teague unterstützen ({cash})", en: "Back Teague ({cash})" }
      result:
        de: "Teague schüttelt Jacobs Hand zu lange. „Die Handelspartei vergisst ihre Freunde nicht.“ Im Büro des Trust wird Jacobs Name genannt. Eine Weile zahlt der Trust Jacob ein paar Cent mehr."
        en: "Teague shakes Jacob's hand too long. \"The Trade Party doesn't forget its friends.\" Jacob's name comes up in the Trust office. For a while the Trust pays Jacob a few cents more."
      requires: { minCash: 100 }
      effects: { cash: -100, price: 0.03 }
    - id: harrow
      public: [support_volksbund]
      label: { de: "Harrow unterstützen ({cash})", en: "Back Harrow ({cash})" }
      result:
        de: "Harrow nimmt das Geld, als wäre es ihm peinlich. Er wird es auf Flugblätter drucken, mit Jacobs Namen darunter. Harrows Lärm über die Tarife wirkt: Thorne gibt einen Cent nach, um Ruhe zu haben."
        en: "Harrow takes the money as if embarrassed by it. He'll spend it on handbills, with Jacob's name at the bottom. Harrow's noise about the tariffs works: Thorne gives up a cent to keep the peace."
      requires: { minCash: 100 }
      effects: { cash: -100, railTariff: -0.01 }
    - id: hinfuehren
      public: [support_handel]
      label: { de: "Am Wahltag den Trupp für Teague hinführen (+{cash})", en: "March the crew to vote for Teague on election day (+{cash})" }
      result:
        de: "Teagues Männer stehen mit einem Fass Bier und einem Beutel Silberdollar vor dem Wahllokal. Jacobs Männer trinken das Bier und wählen, wie man es ihnen sagt. Teague gewinnt. Im Kontor des Trusts hat Jacob jetzt einen Freund, der ein paar Cent je Barrel wert ist."
        en: "Teague's men stand outside the polling station with a barrel of beer and a bag of silver dollars. Jacob's men drink the beer and vote as they're told. Teague wins. In the Trust's counting house Jacob now has a friend worth a few cents a barrel."
      effects: { cash: 30, price: 0.02 }
    - id: keiner
      label: { de: "Keinem etwas geben", en: "Give to neither" }
      result:
        de: Beide gehen höflich. Nach der Wahl weiß der Gewinner trotzdem, wer nichts gegeben hat – und der neue Bezirksrat lässt Jacobs Pachtanträge eine Weile liegen.
        en: Both leave politely. After the election the winner knows all the same who gave nothing – and the new county council lets Jacob's lease applications sit for a while.
      effects: { leaseCost: 0.1 }
      appointments: 0
      default: true

- id: liga_petition
  title:
    de: Eine Petition der Provinzliga
    en: A Provincial League Petition
  text:
    de: >-
      Die Provinzliga sammelt Unterschriften für ein Gesetz: Wer in Cordova Gleise
      oder Rohre besitzt, muss das Öl aller Förderer zum selben Preis befördern. Der
      Sammler ist ein alter Farmer mit einem Klemmbrett. Thornes Leute stehen auf der
      anderen Straßenseite und schauen, wer unterschreibt.
    en: >-
      The Provincial League is collecting signatures for a law: whoever owns rails or
      pipes in Cordova must carry every producer's oil at the same price. The
      collector is an old farmer with a clipboard. Thorne's men stand across the
      street watching who signs.
  conditions: { minRound: 4 }
  chance: 0.07
  choices:
    - id: unterschreiben
      public: [support_provinz]
      label: { de: "Unterschreiben, gut sichtbar", en: "Sign, where everyone can see" }
      result:
        de: "Jacobs Name steht als vierter auf der Liste, unter drei Farmern. Gaffney am Bahnhof grüßt ihn danach nicht mehr. Die Farmer am Hügel verpachten Jacob seitdem billiger; Thorne verlangt einen Cent mehr."
        en: "Jacob's name is fourth on the list, below three farmers. Gaffney at the station stops greeting him after that. Since then the farmers on the hill lease to Jacob cheaper; Thorne charges a cent more."
      effects: { railTariff: 0.01, leaseCost: -0.15 }
    - id: geld
      label: { de: "Nicht unterschreiben, aber still Geld geben ({cash})", en: "Don't sign, but quietly give money ({cash})" }
      result:
        de: Der Farmer steckt das Geld ein, ohne zu danken. „Feigheit kostet bei uns fünfzig“, sagt er.
        en: The farmer pockets the money without thanks. "Cowardice costs fifty with us," he says.
      requires: { minCash: 100 }
      effects: { cash: -100 }
    - id: nein
      label: { de: "Vorbeigehen", en: "Walk on" }
      result:
        de: "Thornes Männer nicken Jacob zu. Das ist schlimmer als ein Blick. Am Bahnhof werden seine Fässer seitdem bevorzugt verladen, einen Cent billiger."
        en: "Thorne's men nod to Jacob. That's worse than a glare. At the station his barrels are loaded first since then, a cent cheaper."
      effects: { railTariff: -0.01 }
      appointments: 0
      default: true
