# Kapitel 1 – Dokumentenprüfung (2.5, GDD §3). Entwurf von Claude, bitte in eigener Stimme umschreiben.
# Vorlage und Erklärung: docs/ereignis-vorlage.md
#
# Ein Brief mit „document“ trägt ein Dokument und ein Vergleichsstück. Beim Eintreffen würfelt das
# Spiel, ob es gefälscht ist (forgeryChance, sonst events.documents.forgeryChance in balance.yaml).
# Gefälscht wird genau ein Feld mit „forged“ – dort steht dann der falsche Wert.
# Mit der Lupe prüft Jacob bis zu events.documents.maxChecks Felder.
#   requiresFound: true   – Wahl geht nur, wenn die Lupe die Fälschung gefunden hat
#   marksIfForged: [...]  – Merkzeichen, die nur gesetzt werden, wenn das Dokument gefälscht war
#                           (die verdeckte Folge: ein späteres Ereignis mit marked: [...] kostet Geld)
# Kapitel 1 ist leicht: Der falsche Wert steht sichtbar neben dem richtigen.
#
# Etappe 3 (gekoppelte Briefe, src/sim/letters.ts): Beide Briefe kommen nur, wenn Jacob gerade erkundet
# (erkundet). Was er kauft, wird ein Hinweis auf einer echten Ranch der Karte:
#   pike_pacht_gekauft      Pikes Bohrliste → Bohrbericht (Stufe 3); gefälscht (pike_urkunde_falsch): wertlos
#                           (die Namen stammen aus der Zeit, als Pike eine Pacht verkaufte; Kapitel 3 liest sie)
#   hale_gutachten_gekauft  Hales Gutachten → Kartierung wie von Hale (dazu hale_beteiligt für Kapitel 3); gefälscht (hale_gutachten_falsch):
#                           ein „Ölsand“ auf einer trockenen Ranch – die Lupe schützt davor

# --- Bohrliste gegen Bohrregister des Bezirks --------------------------------

- id: dok_pike_urkunde
  mail: offer
  deadline: 3
  marked: [erkundet]
  title:
    de: Amos Pike verkauft eine Bohrliste
    en: Amos Pike Sells a Drilling Log
  text:
    de: >-
      Ein Landmakler namens Amos Pike schreibt aus dem Grand Hotel: Er habe gehört,
      dass Jacob übers Land reitet. Bevor ihm das Geld ausging, habe er auf einer
      Ranch ganz in der Nähe probebohren lassen. Die beglaubigte Bohrliste gebe er für
      300 $ ab – „Sie verstehen, die Eile“. Ruth hat im Bezirksamt den Eintrag im
      Bohrregister abgeschrieben.
    en: >-
      A land agent named Amos Pike writes from the Grand Hotel: he hears Jacob has been
      riding the country. Before his money ran out he had a test hole sunk on a ranch
      close by. The certified log is Jacob's for 300 $ – "you understand, the hurry".
      Ruth copied the entry in the county drilling register.
  chance: 0.35
  document:
    title: { de: Bohrliste, en: Drilling Log }
    reference: { de: dem Bohrregister des Bezirks, en: the county drilling register }
    fields:
      - id: parzelle
        label: { de: Probebohrung, en: Test hole }
        value: { de: "Nr. 14, Salt Hill Süd", en: "No. 14, Salt Hill South" }
        reference: { de: "Nr. 14, Salt Hill Süd", en: "No. 14, Salt Hill South" }
        forged: { de: "Nr. 41, Salt Hill Süd", en: "No. 41, Salt Hill South" }
      - id: eigentuemer
        label: { de: Auftraggeber, en: Commissioned by }
        value: { de: Amos Pike, en: Amos Pike }
        reference: { de: Amos Pike, en: Amos Pike }
      - id: datum
        label: { de: Eingetragen am, en: Registered on }
        value: { de: 2. Februar 1888, en: 2 February 1888 }
        reference: { de: 2. Februar 1888, en: 2 February 1888 }
        forged: { de: 12. Februar 1888, en: 12 February 1888 }
      - id: unterschrift
        label: { de: Unterschrift Bezirksamt, en: County clerk's signature }
        value: { de: "gez. O. Marsh, Schreiber", en: "signed O. Marsh, clerk" }
        reference: { de: "O. Marsh, Schreiber", en: "O. Marsh, clerk" }
        forged: { de: "gez. O. Marshall, Schreiber", en: "signed O. Marshall, clerk" }
  choices:
    - id: kaufen
      label: { de: "Die Bohrliste kaufen (300 $)", en: "Buy the log (300 $)" }
      result:
        de: Pike zählt die Scheine zweimal, lüftet den Hut und ist mit dem Abendzug fort. Ruth sucht die Ranch auf der Karte.
        en: Pike counts the notes twice, tips his hat and is gone on the evening train. Ruth looks for the ranch on the map.
      requires: { minCash: 300 }
      effects: { cash: -300 }
      marks: [pike_pacht_gekauft]
      marksIfForged: [pike_urkunde_falsch]
    - id: erpressen
      label: { de: "Pike die Fälschung vorhalten – 250 $ fürs Schweigen", en: "Show Pike the forgery – 250 $ for silence" }
      result:
        de: Pike wird weiß, dann zahlt er. Jacob hat jetzt Geld und einen Feind, der weiß, wo er wohnt.
        en: Pike goes white, then pays. Jacob now has money and an enemy who knows where he lives.
      requiresFound: true
      effects: { cash: 250 }
    - id: anzeigen
      label: { de: "Mit der Bohrliste zum Sheriff", en: "Take the log to the sheriff" }
      result:
        de: Der Sheriff gähnt, nimmt die Bohrliste aber an sich. Pike verlässt Port Ellis noch in der Nacht. Jacob schläft ruhig.
        en: The sheriff yawns but keeps the log. Pike leaves Port Ellis that same night. Jacob sleeps soundly.
      requiresFound: true
      effects: { strength: 15 }
    - id: ablehnen
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Pikes Brief landet in der Schublade. Eine Woche später hat Bullard die Bohrliste – und pachtet, was darauf steht. Die Farmer verlangen seitdem mehr.
        en: Pike's letter goes in the drawer. A week later Bullard has the log – and leases what it shows. The farmers have asked more ever since.
      effects: { leaseCost: 0.1 }
      appointments: 0
      default: true

# --- Geologengutachten gegen Nachbarbohrung ----------------------------------
# Etappe 3: Der „zu schöne Bericht“ des falschen Geologen (früher eigener Brief) steckt jetzt hier.

- id: dok_hale_gutachten
  mail: info
  deadline: 3
  marked: [erkundet]
  title:
    de: Das Gutachten des Dr. Hale
    en: Dr. Hale's Survey
  text:
    de: >-
      Dr. Lucius Hale, „Geologe, ausgebildet in Hallstead“, hat gehört, dass Jacob
      übers Land reitet. Er habe eine Ranch in der Nähe begutachtet, „ohne jeden
      Zweifel ein zweiter Salzdom“. Das Gutachten gebe er für 100 $ ab. Silas hat die
      Bohrliste der Nachbarbohrung besorgt.
    en: >-
      Dr. Lucius Hale, "geologist, trained in Hallstead", has heard Jacob is riding
      the country. He has surveyed a ranch nearby, "beyond any doubt a second salt
      dome". The survey is Jacob's for 100 $. Silas got hold of the log of the
      neighbouring well.
  chance: 0.35
  document:
    title: { de: Gutachten, en: Survey }
    reference: { de: der Bohrliste der Nachbarbohrung, en: the neighbouring well's log }
    fields:
      - id: gestein
        label: { de: Gestein über dem Ölsand, en: Rock above the oil sand }
        value: { de: Kalkstein über Salz, en: Limestone over salt }
        reference: { de: Kalkstein über Salz, en: Limestone over salt }
      - id: tiefe
        label: { de: Tiefe des Ölsands, en: Depth of the oil sand }
        value: { de: "1.240 Fuß", en: "1,240 feet" }
        reference: { de: "1.180 Fuß", en: "1,180 feet" }
        forged: { de: "380 Fuß", en: "380 feet" }
      - id: proben
        label: { de: Proben mit Öl, en: Samples showing oil }
        value: { de: "3 von 12, Spuren", en: "3 of 12, traces" }
        reference: { de: "2 von 12, Spuren", en: "2 of 12, traces" }
        forged: { de: "12 von 12, reines Öl", en: "12 of 12, pure oil" }
      - id: unterschrift
        label: { de: Unterschrift, en: Signature }
        value: { de: "Dr. L. Hale", en: "Dr. L. Hale" }
  choices:
    - id: beteiligen
      label: { de: "Das Gutachten kaufen (100 $)", en: "Buy the survey (100 $)" }
      result:
        de: Hale schüttelt Jacob die Hand, lange und herzlich. Das Gutachten kommt in einem Umschlag mit Siegel.
        en: Hale shakes Jacob's hand, long and warmly. The survey comes in a sealed envelope.
      requires: { minCash: 100 }
      effects: { cash: -100 }
      marks: [hale_gutachten_gekauft, hale_beteiligt]
      marksIfForged: [hale_gutachten_falsch]
    - id: entlarven
      label: { de: "Hale das Gutachten zurückschicken – mit Anmerkungen", en: "Return Hale's survey – annotated" }
      result:
        de: "Jacob schreibt die echten Zahlen an den Rand. Nora Whitlock hört davon und bringt eine kleine Meldung. Hale sucht seine Kunden jetzt woanders. Die Farmer am Hügel merken sich, wer Schwindler entlarvt."
        en: "Jacob writes the real figures in the margin. Nora Whitlock hears of it and runs a short item. Hale now looks for customers elsewhere. The farmers on the hill remember who unmasks swindlers."
      requiresFound: true
      effects: { strength: 5, leaseCost: -0.15 }
    - id: ablehnen
      label: { de: "Ablegen", en: "File it away" }
      result:
        de: Das Gutachten verschwindet in der Schublade. Hale verkauft es an Bullard, und der überbietet Jacob bei den Farmern am Bach.
        en: The survey disappears into the drawer. Hale sells it to Bullard, who outbids Jacob with the farmers by the creek.
      effects: { leaseCost: 0.1 }
      appointments: 0
      default: true
