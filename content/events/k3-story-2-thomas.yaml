# Kapitel 3 – Story-Bogen Thomas im Unternehmen oder nicht (Phase 4, Story-Bibel §7 B).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# Thomas ist 19–23 (0.4.19+3: College-Weiche mit 17, drei Jahre im Osten, das letzte Jahr bricht er ab). Er kommt zurück aus dem Osten, mit Ideen zu Marke und Automobil, die
# Jacob für Spielerei hält und Margaret Crane nicht. Jacob will einen Nachfolger, Thomas
# einen Vater. Alle Ereignisse nur in Kapitel 3 (minChapter/maxChapter); Runden 1–16.
#
#   R1–2   k3_thomas_heimkehr        Wer holt ihn am Bahnhof ab?
#   R3–6   k3_thomas_weg             Schlüsselszene: Firma / Felder / eigener Weg / zwingen
#          k3_thomas_weg_fremd       dieselbe Wahl, wenn Jacob Thomas' Geburt verpasst hat
#   R8+    k3_thomas_idee            (thomas_firma) Straßenkarten und Plakate
#          k3_thomas_feld            (thomas_feld) Thomas auf dem Bohrturm
#          k3_thomas_brief           (thomas_eigener_weg) Brief von Crane Eastern
#          k3_thomas_gezwungen_folge (thomas_gezwungen) Der Rat misstraut dem Sohn
#   R8+    k3_thomas_evelyn          Vandermeer-Ball: Evelyn Crane (Heiratssaat)
#   R12+   k3_thomas_bruch           (thomas_gekraenkt, bei Harlan Oil) Thomas geht – Saat „Rivale“
#          k3_thomas_bruch_crane     (thomas_gekraenkt + thomas_eigener_weg) Er verlässt Crane Eastern
#                                    und gründet selbst – ein Rivale beider Häuser
#
# Ausgänge für spätere Kapitel (content/relevance.yaml): thomas_firma, thomas_feld,
# thomas_eigener_weg, thomas_gezwungen, thomas_bruch, thomas_versoehnt_k3, thomas_abteilung,
# thomas_benutzt, thomas_teilhaber, heirat_crane_saat, heirat_crane_verboten.
#
# Anknüpfung Kapitel 1: geburt_verpasst → k3_thomas_weg_fremd.
# Anknüpfung Kapitel 2 (nach Merge von phase4/inhalte-k2-story nachtragen):
#   thomas_internat / thomas_felder → eigene Fassungen von k3_thomas_weg (Ostküste oder Turm)
#   thomas_buero / thomas_ferngehalten → k3_thomas_idee (er kennt die Firma / er kennt sie nicht)
#   thomas_wahrheit / thomas_geschont → Werte des Erben (heirValues)
#   zs2_thomas_college / zs2_thomas_kein_college (Block A) → Text von k3_thomas_heimkehr
# WUNSCH (Story-Bibel §10): Silhouette nach Alter – Thomas steht bis dahin als „kind“ in
# content/figures.yaml, obwohl er hier 20 ist. Effekte heirValues, boardLoyalty, brand.

# Thomas kommt zurück. Gealtertes Detail: Er ist größer als Jacob.
- id: k3_thomas_heimkehr
  title:
    de: Der Mittagszug aus dem Osten
    en: The Noon Train from the East
  text:
    de: >-
      Thomas kommt mit dem Mittagszug, nach drei Jahren College im Osten. Das letzte
      Studienjahr will er nicht mehr abwarten. Er ist fast zwanzig, trägt einen Anzug aus
      Hallstead und einen Koffer voller Bücher, und er ist inzwischen einen Fingerbreit
      größer als sein Vater. Die Bankiers aus Hallstead sind auf zwölf Uhr bestellt. Ruth fragt beim
      Frühstück, wer zum Bahnhof fährt, und sieht dabei nicht von der Zeitung auf.
    en: >-
      Thomas arrives on the noon train, after three years of college in the east. He
      doesn't want to wait for the last year of study. He is almost twenty, wears a Hallstead suit
      and carries a trunk full of books, and he is now a finger's breadth taller than his
      father.
      The bankers from Hallstead are expected at twelve o'clock. At breakfast Ruth asks who is going
      to the station, without looking up from the newspaper.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 1, maxRound: 2 }
  marked: [zs2_thomas_college]
  certain: true
  choices:
    - id: selbst
      label: { de: "Selbst fahren – die Sitzung verschieben", en: "Go himself – postpone the meeting" }
      result:
        de: >-
          Thomas steht auf dem Bahnsteig und sucht die Kutsche, nicht den Vater. Als er
          Jacob sieht, bleibt er einen Moment stehen. Dann lacht er. Auf der Heimfahrt
          reden sie über nichts, eine ganze Stunde lang.
        en: >-
          Thomas stands on the platform looking for the carriage, not his father. When he
          sees Jacob he stops for a moment. Then he laughs. On the drive home they talk
          about nothing for a whole hour.
      effects: { thomas: 15, strength: -5, boardLoyalty: { vandermeer: -5 } }
      sharp: true
    - id: ruth
      label: { de: "Ruth fahren lassen – die Sitzung geht vor", en: "Let Ruth go – the meeting comes first" }
      result:
        de: >-
          Ruth und Thomas kommen lachend zur Tür herein. Als Jacob am Abend dazukommt,
          hören sie auf zu lachen, nicht unfreundlich. Einfach so.
        en: >-
          Ruth and Thomas come through the door laughing. When Jacob joins them in the
          evening, they stop laughing – not unkindly. Just so.
      effects: { thomas: -15, ruth: 5 }
    - id: kutscher
      label: { de: "Den Kutscher schicken", en: "Send the coachman" }
      result:
        de: >-
          Der Kutscher bringt den Koffer und einen Gruß. Thomas ist zu Fuß gegangen, sagt
          er, über die Felder. Er wollte sehen, was aus Salt Hill geworden ist.
        en: >-
          The coachman brings the trunk and a greeting. Thomas walked, he says, across the
          fields. He wanted to see what has become of Salt Hill.
      effects: { thomas: -20 }
      default: true

# Entwurf – Philipp überarbeitet (0.4.19+2).
# Fassung ohne College (zs2_thomas_kein_college): Thomas ist schon seit Jahren in der Firma.
- id: k3_thomas_aufstieg
  visitor: thomas
  title:
    de: Drei Jahre am Turm
    en: Three Years at the Rig
  text:
    de: >-
      Thomas arbeitet seit drei Jahren bei Harlan Oil, seit er siebzehn war: erst im
      Frachtbüro, dann draußen an den Türmen. Die Trupps nennen ihn nicht „den Sohn“,
      sondern bei seinem Spitznamen. Heute steht er in Arbeitshosen in Jacobs Büro und
      ist inzwischen einen Fingerbreit größer als sein Vater. „Ich will nicht ewig
      Vorarbeiter sein. Entweder ich lerne bei dir, wie man die Firma führt – oder ich
      lerne es woanders.“
    en: >-
      Thomas has worked at Harlan Oil for three years, since he was seventeen: first in
      the freight office, then out at the rigs. The crews don't call him "the son" but
      by his nickname. Today he stands in Jacob's office in work trousers, now a
      finger's breadth taller than his father. "I don't want to be a foreman forever.
      Either I learn from you how to run the company – or I learn it somewhere else."
  conditions: { minChapter: 3, maxChapter: 3, minRound: 1, maxRound: 2 }
  marked: [zs2_thomas_kein_college]
  certain: true
  choices:
    - id: lehren
      label: { de: "Ihn mit in die Besprechungen nehmen", en: "Take him along to the meetings" }
      result:
        de: >-
          Thomas sitzt ab Montag hinten in jeder Besprechung und schreibt mit, in
          Bleistift, wie seine Mutter. Nach der dritten stellt er eine Frage, die
          Vandermeer nicht beantworten kann.
        en: >-
          From Monday Thomas sits at the back of every meeting and takes notes, in
          pencil, like his mother. After the third he asks a question Vandermeer cannot
          answer.
      effects: { thomas: 12, strength: -5, heirValues: { thomas: { business: 1 } } }
    - id: warten
      label: { de: "„Noch ein Jahr am Turm. Dann sehen wir.“", en: "\"One more year at the rig. Then we'll see.\"" }
      result:
        de: >-
          Thomas nickt und geht zurück zu den Trupps. Er sagt nichts mehr dazu. Am Abend
          schreibt er einen Brief nach Osten, an eine Adresse, die Jacob nicht kennt.
        en: >-
          Thomas nods and goes back to the crews. He says nothing more about it. In the
          evening he writes a letter east, to an address Jacob doesn't know.
      effects: { thomas: -10 }
      default: true
    - id: frei
      label: { de: "„Lern es woanders. Du kommst zurück, wenn du willst.“", en: "\"Learn it elsewhere. Come back when you want to.\"" }
      result:
        de: >-
          Thomas sieht ihn lange an. „Das hätte ich nicht von dir erwartet.“ Er bleibt
          trotzdem bis zum Ende des Quartals, damit sein Turm nicht ohne Vorarbeiter ist.
        en: >-
          Thomas looks at him for a long time. "I didn't expect that from you." He stays
          until the end of the quarter anyway, so that his rig isn't left without a
          foreman.
      effects: { thomas: 15, heirValues: { thomas: { ambition: 1 } } }

# Entwurf – Philipp überarbeitet.
# Schlüsselszene: Was wird Thomas? (Jacob war bei der Geburt.)
- id: k3_thomas_weg
  visitor: thomas
  draft: true
  title:
    de: „Schenk mir keine Abteilung“
    en: '"Don''t Give Me a Department"'
  text:
    de: >-
      Thomas sitzt auf dem Stuhl, auf dem sonst die Bankiers sitzen, und hält sich zu
      gerade. Er hat Pläne mitgebracht: Tankstellen mit einem Zeichen, das man von der
      Straße aus erkennt, Karten für Automobilisten. „Du hast mir beigebracht, dass man
      nichts geschenkt bekommt. Also schenk mir keine Abteilung.“ Margaret Crane hat ihm
      geschrieben, sagt er. Er sagt es so, dass Jacob es hören muss.
    en: >-
      Thomas sits in the chair where the bankers usually sit and holds himself too
      straight. He has brought plans: filling stations with a sign you can recognise
      from the road, maps for motorists. "You taught me nobody gets anything for free.
      So don't give me a department." Margaret Crane has written to him, he says. He
      says it so that Jacob has to hear it.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 3, maxRound: 6 }
  notMarked: [geburt_verpasst, thomas_firma, thomas_feld, thomas_eigener_weg, thomas_gezwungen]
  certain: true
  choices:
    - id: firma
      label: { de: "Ganz unten im Vertrieb anfangen lassen", en: "Have him start at the bottom in sales" }
      result:
        de: >-
          Thomas bekommt einen Schreibtisch im Keller neben den Frachtbriefen. Er ist am
          ersten Tag um sechs da. Jacob erfährt es vom Pförtner, nicht von ihm.
        en: >-
          Thomas gets a desk in the basement next to the bills of lading. On the first day
          he is in at six. Jacob learns it from the porter, not from him.
      effects: { thomas: 10, heirValues: { thomas: { business: 1, ambition: 1 } } }
      marks: [thomas_firma]
    - id: feld
      label: { de: "Ihn auf die Felder schicken – mit einem eigenen Bohrtrupp", en: "Send him to the fields – with a drilling crew of his own" }
      result:
        de: >-
          „Wie du damals“, sagt Thomas und weiß nicht, ob er sich freuen soll. Er bekommt
          einen eigenen Trupp am Nordhang und kommt nur noch sonntags in die Stadt, mit
          Schlamm an den Stiefeln und Ideen, die er jetzt an den Türmen ausprobiert.
        en: >-
          "Like you back then," says Thomas, unsure whether to be glad. He gets a crew of
          his own on the north slope and only comes into town on Sundays, with mud on his
          boots and ideas he now tries out at the rigs.
      effects: { thomas: 10, heirValues: { thomas: { loyalty: 1, moral: 1 } } }
      marks: [thomas_feld]
    - id: eigener_weg
      label: { de: "„Geh, wohin du willst. Auch zu Margaret.“", en: "\"Go wherever you like. Even to Margaret.\"" }
      result:
        de: >-
          Thomas starrt ihn an, als hätte er mit allem gerechnet außer damit. Er nimmt die
          Stelle bei Crane Eastern. Zum Abschied umarmt er seinen Vater, ungeschickt, wie
          man jemanden umarmt, den man lange nicht umarmt hat.
        en: >-
          Thomas stares at him as if he had expected anything but this. He takes the post
          at Crane Eastern. On leaving he hugs his father, awkwardly, the way you hug
          someone you have not hugged in a long time.
      effects: { thomas: 15, heirValues: { thomas: { ambition: 2, loyalty: -1 } }, rival: { margaret: { trust: 5 } } }
      marks: [thomas_eigener_weg]
    - id: zwingen
      label: { de: "„Montag fängst du als mein Stellvertreter an. Ende.“", en: "\"Monday you start as my deputy. That's that.\"" }
      result:
        de: >-
          Thomas faltet seine Pläne zusammen, sehr ordentlich. „Ja, Vater.“ Er hat ihn nie zuvor Vater genannt. Er hat immer Papa gesagt.
        en: >-
          Thomas folds his plans away, very neatly. "Yes, Father." He has never called him
          Father before. He always said Dad.
      effects: { thomas: -20, heirValues: { thomas: { loyalty: 1, ambition: -2 } } }
      marks: [thomas_gezwungen]
      default: true

