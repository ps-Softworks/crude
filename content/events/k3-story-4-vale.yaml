# Kapitel 3 – Bogen D, Auftakt: Mr. Vales Karte (Phase 4, Story-Bibel §7 D).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# 0.4.19+2: Es gibt nur EINE Einladung – den Brief des Systems „Konsortium“ (content/kapitel3.yaml →
# konsortium.letter, Runde 3, graues Siegel ohne Wappen, Schloss Kerrow). Über Zusage oder Absage
# entscheidet Jacob dort; das System setzt k3_konsortium_* (kapitel3Runde.ts). Die Karte hier liegt im
# selben Umschlag: ein paar persönliche Zeilen von Vale, je nach Kapitel 1. Jacob entscheidet nur, was
# mit der Karte geschieht – Ruth kann sie nur finden, wenn er sie im Mantel lässt (vale_karte_offen,
# liest k3_ruth_vale), oder er zeigt sie ihr selbst (ruth_gefragt).
#
#   R3–4   k3_vale_karte            ohne Kapitel-1-Vorgeschichte: „als hätten sie sich schon gesehen“
#          k3_vale_karte_schuld     (vale_geld) er spricht über die Schuld, ohne das Wort zu benutzen
#          k3_vale_karte_respekt    (vale_abgelehnt) er spricht mit Respekt
#
# Merkzeichen: vale_karte_offen (Karte bleibt im Mantel, liest k3_ruth_vale) · ruth_gefragt (Ruth gezeigt).

# Die Karte – ohne Vorgeschichte aus Kapitel 1.
- id: k3_vale_karte
  mail: personal
  deadline: 3
  title:
    de: Eine Karte im Umschlag
    en: A Card in the Envelope
  text:
    de: >-
      Im Umschlag mit dem grauen Siegel steckt noch etwas: eine Karte, schweres Papier,
      ohne Wappen. „Man trifft sich, wie es ist. Sieben Herren, ein Tisch, kein Protokoll.
      Ihre Anwesenheit auf Kerrow würde mich ehren.“ Unterschrieben mit einem einzigen
      Buchstaben: V. Jacob kennt niemanden, der so unterschreibt. Beim zweiten Lesen ist
      er nicht mehr sicher. Er hält die Karte weiter weg als früher.
    en: >-
      In the envelope with the grey seal there is something else: a card, heavy paper,
      no crest. "One meets as it is. Seven gentlemen, one table, no minutes. Your presence
      at Kerrow would honour me." Signed with a single letter: V. Jacob knows no one who
      signs like that. On the second reading he is no longer sure. He holds the card
      further away than he used to.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 3, maxRound: 4 }
  notMarked: [vale_geld, vale_abgelehnt]
  certain: true
  choices:
    - id: liegen
      label: { de: "Die Karte in die Manteltasche stecken", en: "Put the card in his coat pocket" }
      result:
        de: Die Karte wandert in die Innentasche des Mantels. Dort bleibt sie, und manchmal spürt Jacob ihre Kante.
        en: The card goes into the inside pocket of his coat. There it stays, and sometimes Jacob feels its edge.
      marks: [vale_karte_offen]
      default: true
    - id: ruth
      label: { de: "Die Karte Ruth zeigen", en: "Show the card to Ruth" }
      result:
        de: >-
          Ruth liest die Karte zweimal, wie er. „Sieben Herren und kein Protokoll“, sagt sie.
          „Dann schreib wenigstens du mit.“ Sie gibt sie ihm zurück, mit der Schrift nach unten.
        en: >-
          Ruth reads the card twice, as he did. "Seven gentlemen and no minutes," she says.
          "Then at least you take notes." She hands it back, writing face down.
      effects: { ruth: 20, strength: -3 }
      marks: [ruth_gefragt]
    - id: ofen
      label: { de: "Die Karte in den Ofen werfen", en: "Throw the card in the stove" }
      result:
        de: Das schwere Papier brennt langsam. Jacob sieht zu, bis das V verschwunden ist. Eine Woche später kommt eine Zeile aus Aldmark, ohne Gruß – „Papier brennt, Mr. Harlan. Erinnerungen nicht.“
        en: The heavy paper burns slowly. Jacob watches until the V is gone. A week later a line arrives from Aldmark, without greeting – "Paper burns, Mr. Harlan. Memories do not."
      effects: { consortium: { trust: -10 } }

# Die Karte – Jacob hat in Kapitel 1 Vales 500 $ behalten (vale_geld).
- id: k3_vale_karte_schuld
  mail: personal
  deadline: 3
  title:
    de: Unter Freunden
    en: Between Friends
  text:
    de: >-
      Im Umschlag mit dem grauen Siegel steckt eine Karte. „Ein Freund, der vor zwanzig
      Jahren an Sie geglaubt hat, würde sich freuen, Sie auf Kerrow zu sehen. Zinsen sind
      unter Freunden noch immer nicht nötig.“ Unterschrieben: V. Jacob erinnert sich an
      neue Scheine in einem Umschlag ohne Absender und an einen Herrn im grauen Mantel.
      Der Herr muss heute ein alter Mann sein. Auf der Karte sieht man es nicht.
    en: >-
      In the envelope with the grey seal there is a card. "A friend who believed in you
      twenty years ago would be glad to see you at Kerrow. Between friends, interest is
      still unnecessary." Signed: V. Jacob remembers new bills in an envelope with no
      sender, and a gentleman in a grey coat. The gentleman must be an old man by now. The
      card doesn't show it.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 3, maxRound: 4 }
  marked: [vale_geld]
  certain: true
  choices:
    - id: liegen
      label: { de: "Die Karte in die Manteltasche stecken", en: "Put the card in his coat pocket" }
      result:
        de: Die Karte wandert in die Innentasche des Mantels, zu den Dingen, die Jacob nicht bezahlt hat.
        en: The card goes into the inside pocket of his coat, with the things Jacob has not paid for.
      marks: [vale_karte_offen]
      default: true
    - id: ruth
      label: { de: "Ruth die Karte zeigen – und von den 500 $ erzählen", en: "Show Ruth the card – and tell her about the 500 $" }
      result:
        de: >-
          Ruth hört zu, ohne ihn zu unterbrechen. „Zwanzig Jahre“, sagt sie dann. „Und du
          hast gedacht, so etwas vergisst einer wie er.“ Sie ist nicht wütend. Das ist schlimmer.
        en: >-
          Ruth listens without interrupting. "Twenty years," she says then. "And you thought a
          man like that forgets." She isn't angry. That is worse.
      effects: { ruth: 15, strength: -5 }
      marks: [ruth_gefragt]
    - id: zurueck
      label: { de: "Die 500 $ mit Zinsen nach Aldmark schicken (1.500 $)", en: "Send the 500 $ back to Aldmark with interest (1,500 $)" }
      result:
        de: >-
          Der Scheck wird eingelöst, von einer Bank in Aldmark, am Tag seiner Ankunft. Eine
          Antwort kommt nicht. Jacob hat bezahlt, was er schuldete. Ob Mr. Vale das auch so
          sieht, weiß er nicht.
        en: >-
          The cheque is cashed by a bank in Aldmark on the day it arrives. No answer comes.
          Jacob has paid what he owed. Whether Mr. Vale sees it the same way, he does not
          know.
      requires: { minCash: 1500 }
      effects: { cash: -1500, consortium: { trust: -5 } }

# Die Karte – Jacob hat in Kapitel 1 Vales Umschlag zurückgegeben (vale_abgelehnt).
- id: k3_vale_karte_respekt
  mail: personal
  deadline: 3
  title:
    de: „Aus Bewunderung“
    en: '"Out of Admiration"'
  text:
    de: >-
      Im Umschlag mit dem grauen Siegel steckt diesmal ein ganzer Brief. „Sie haben vor
      zwanzig Jahren fünfhundert Dollar zurückgegeben, Mr. Harlan. Ich habe Sie seitdem
      nicht aus den Augen gelassen. Aus Bewunderung. Ein Mann, der nein sagen kann, gehört
      an den Tisch auf Kerrow.“ Unterschrieben: V. Die Handschrift ist dieselbe wie vor
      zwanzig Jahren, Strich für Strich.
    en: >-
      This time the envelope with the grey seal holds a whole letter. "Twenty years ago you
      returned five hundred dollars, Mr. Harlan. I have not let you out of my sight since.
      Out of admiration. A man who can say no belongs at the table at Kerrow." Signed: V.
      The handwriting is the same as twenty years ago, stroke for stroke.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 3, maxRound: 4 }
  marked: [vale_abgelehnt]
  certain: true
  choices:
    - id: liegen
      label: { de: "Den Brief in die Manteltasche stecken", en: "Put the letter in his coat pocket" }
      result:
        de: Der Brief wandert in die Innentasche des Mantels. Jacob liest ihn in dieser Woche noch zweimal.
        en: The letter goes into the inside pocket of his coat. Jacob reads it twice more that week.
      marks: [vale_karte_offen]
      default: true
    - id: ruth
      label: { de: "Den Brief Ruth zeigen", en: "Show the letter to Ruth" }
      result:
        de: >-
          „Er hat dich zwanzig Jahre beobachtet“, sagt Ruth, „und schreibt es dir, als wäre es
          ein Kompliment.“ Sie legt den Brief weg, als wäre er heiß.
        en: >-
          "He has watched you for twenty years," says Ruth, "and writes it to you as if it were
          a compliment." She puts the letter down as if it were hot.
      effects: { ruth: 20, strength: -3 }
      marks: [ruth_gefragt]
    - id: ofen
      label: { de: "Den Brief in den Ofen werfen", en: "Throw the letter in the stove" }
      result:
        de: Jacob schreibt keine Zeile zurück. Das ist, denkt er, dieselbe Antwort wie damals im Hotel. Vale wird es so verstehen.
        en: Jacob writes not a line back. That, he thinks, is the same answer as back then at the hotel. Vale will understand it so.
      effects: { consortium: { trust: -10 } }
