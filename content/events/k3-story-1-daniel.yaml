# Nachwirkung: der Umschlag. Bestechung scheitert immer.
- id: k3_daniel_bestechung_folge
  title:
    de: Beweisstück Nummer eins
    en: Exhibit Number One
  text:
    de: >-
      Der Ledger bringt es auf Seite eins: Der Bezirksstaatsanwalt hat ein Bestechungsgeld
      als Beweisstück registriert. Der Name des Gebers wird „aus Rücksicht auf das
      laufende Verfahren“ nicht genannt. In Hallstead weiß jeder, wer gemeint ist. Am
      Nachmittag sagt Cornelia Vandermeer ein Abendessen ab.
    en: >-
      The Ledger runs it on the front page: the district attorney has logged a bribe as
      evidence. The giver's name is withheld "out of regard for the ongoing
      proceedings". In Hallstead everyone knows who is meant. In the afternoon Cornelia
      Vandermeer cancels a dinner.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_bestechung_versuch]
  delay: 1
  certain: true
  choices:
    - id: leugnen
      label: { de: "Alles leugnen", en: "Deny everything" }
      result:
        de: >-
          Jacob leugnet in drei Zeitungen. Daniel antwortet in keiner. Er wartet einfach,
          und das Warten liegt Jacob schwerer im Magen als jeder Artikel.
        en: >-
          Jacob denies it in three newspapers. Daniel answers in none. He simply waits,
          and the waiting sits heavier in Jacob's stomach than any article.
      effects: { strength: -20, reputation: { public: -3, politics: -3 } }
      default: true
    - id: suendenbock
      label: { de: "Einen Prokuristen opfern – „ohne mein Wissen“ (1.500 $ Abfindung)", en: "Sacrifice a clerk – \"without my knowledge\" (1,500 $ severance)" }
      result:
        de: >-
          Der Prokurist nimmt die Abfindung und die Schuld. Seine Frau spuckt vor Jacobs
          Kutsche aus. Daniel lässt ihn vorladen und fragt ihn nur eines: wer ihm das
          Geld gegeben hat.
        en: >-
          The clerk takes the severance and the blame. His wife spits in front of Jacob's
          carriage. Daniel summons him and asks him only one thing: who gave him the money.
      effects: { cash: -1500, staffLoyalty: { all: -10 }, trace: { severity: 2, label: Sündenbock } }
      marks: [daniel_suendenbock]

# Entwurf – Philipp überarbeitet.
# Der Umschlag wird zur Anklage. Bibel/GDD: „Ein Bestechungsversuch macht es schlimmer, nicht besser.“
# Darum teurer als jeder Anwalts-Weg: Umschlag (3.000 $) + Folge + hier mindestens 6.000 $ und Kraft.
- id: k3_daniel_anklage_bestechung
  mail: demand
  deadline: 2
  draft: true
  title:
    de: Punkt eins
    en: Count One
  text:
    de: >-
      Die Anklageschrift ist dünner als erwartet, neun Seiten. Mehr braucht sie nicht.
      Punkt eins: versuchte Bestechung eines Beamten des Bezirks Cordova. Beweisstück
      Nummer eins: ein Umschlag, versiegelt, beschriftet, datiert. Die übrigen Punkte
      folgen auf den Seiten danach. Daniel hat keinen davon gestrichen. Er hat sie nur
      hinter den Umschlag gestellt.
    en: >-
      The indictment is thinner than expected, nine pages. It needs no more. Count one:
      attempted bribery of an official of Cordova County. Exhibit number one: an envelope,
      sealed, labelled, dated. The remaining counts follow on the pages after. Daniel has
      struck none of them. He has only put them behind the envelope.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_bestechung_versuch]
  notMarked: [daniel_vergleich, daniel_anklage]
  delay: 3
  certain: true
  choices:
    - id: kaempfen
      label: { de: "Kämpfen – die teuerste Kanzlei aus Hallstead (6.000 $)", en: "Fight – the most expensive firm in Hallstead (6,000 $)" }
      result:
        de: >-
          Die Kanzlei nimmt den Fall und sagt Jacob ehrlich, wie er steht: schlecht. Einen
          Umschlag kann man nicht wegerklären. Man kann nur hoffen, dass die Geschworenen
          selbst einmal einen angeboten haben.
        en: >-
          The firm takes the case and tells Jacob honestly where he stands: badly. An
          envelope cannot be explained away. One can only hope the jurors once offered one
          themselves.
      effects: { cash: -6000, strength: -15, heat: 3, reputation: { politics: -3 } }
      marks: [daniel_anklage]
      default: true
    - id: gestehen
      label: { de: "Den Bestechungsversuch öffentlich gestehen (8.000 $ Strafe)", en: "Confess the bribery attempt in public (8,000 $ fine)" }
      result:
        de: >-
          Jacob steht im Gerichtssaal von Port Ellis und sagt einen Satz. Daniel lässt die
          übrigen Punkte fallen, alle. „Das ist das Erste, was Sie mir freiwillig gegeben
          haben“, sagt er im Flur. „Es hat Sie elftausend Dollar gekostet.“
        en: >-
          Jacob stands in the Port Ellis courtroom and says one sentence. Daniel drops the
          remaining counts, all of them. "That is the first thing you have given me
          freely," he says in the corridor. "It cost you eleven thousand dollars."
      requires: { minCash: 8000 }
      effects: { cash: -8000, strength: -10, reputation: { public: -3, politics: -2 }, heat: -2 }
      marks: [daniel_vergleich]

# Nachwirkung: Jacob hat gegen Thorne ausgesagt (Zeugen-Fassung oder Vorladung) – Thorne schlägt zurück.
# Nur hier passt „Nötigung eines Zeugen“; die Kooperation in den Fällen gegen Jacob hat eigene Folgen.
- id: k3_daniel_zeuge_folge
  visitor: bankier
  rival: thorne
  title:
    de: Pettibone kündigt
    en: Pettibone Gives Notice
  text:
    de: >-
      Mr. Pettibone ist grau geworden, aber nicht weicher. Er legt ein Schreiben der
      Thorne-Bank vor: Die Kreditlinie von Harlan Oil wird zum Quartalsende gekündigt,
      „wegen veränderter Risikolage“. Er sagt nicht, welches Risiko. Er sieht dabei auf
      das Foto von Daniel Moss in der Zeitung auf Jacobs Tisch.
    en: >-
      Mr. Pettibone has gone grey but no softer. He presents a letter from the Thorne
      bank: Harlan Oil's line of credit is cancelled at quarter's end "owing to a changed
      risk position". He does not say which risk. As he speaks he looks at the
      photograph of Daniel Moss in the newspaper on Jacob's desk.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_zeuge_thorne]
  delay: 2
  certain: true
  choices:
    - id: abloesen
      label: { de: "Den Kredit sofort ablösen (3.000 $)", en: "Pay off the credit at once (3,000 $)" }
      result:
        de: >-
          Jacob schreibt den Scheck, während Pettibone noch sitzt. Pettibone faltet ihn
          sorgfältig. „Mr. Thorne wird beeindruckt sein“, sagt er. Es klingt nicht wie
          ein Kompliment.
        en: >-
          Jacob writes the cheque while Pettibone is still seated. Pettibone folds it
          carefully. "Mr. Thorne will be impressed," he says. It does not sound like a
          compliment.
      effects: { cash: -3000, rating: -1 }
      default: true
    - id: mit_daniel
      label: { de: "Daniel sagen, was Thorne tut – und weitermachen", en: "Tell Daniel what Thorne is doing – and carry on" }
      result:
        de: >-
          Daniel nimmt das Kündigungsschreiben zu den Akten. „Nötigung eines Zeugen“,
          sagt er, fast zufrieden. Die Thorne-Linie verteuert die Fracht. Jacob und
          Daniel essen zum ersten Mal zusammen zu Mittag. Sie reden über Ezekiel.
        en: >-
          Daniel adds the cancellation letter to his files. "Intimidation of a witness,"
          he says, almost pleased. The Thorne line raises its freight. Jacob and Daniel
          have lunch together for the first time. They talk about Ezekiel.
      effects: { railTariff: 0.05, rival: { thorne: { grudge: 10 } } }
      marks: [daniel_verbuendet]

# Nachwirkung: Daniel wurde ins Richteramt gelobt. Er weiß, warum.
- id: k3_daniel_weggelobt_folge
  mail: personal
  deadline: 2
  title:
    de: Ein Brief vom Richter
    en: A Letter from the Judge
  text:
    de: >-
      Briefpapier des Bezirksgerichts Port Ellis, die Handschrift ruhig. „Sie haben mich
      befördert, Mr. Harlan. Mein Nachfolger heißt so, wie Mr. Thorne es sich wünscht.
      Ich habe das aufgeschrieben, mit Datum. Richter sitzen länger als Staatsanwälte.
      Hochachtungsvoll, D. Moss.“
    en: >-
      Letterhead of the Port Ellis district court, the handwriting calm. "You have
      promoted me, Mr. Harlan. My successor bears the name Mr. Thorne wished for. I have
      written that down, with the date. Judges sit longer than prosecutors. Respectfully,
      D. Moss."
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_weggelobt]
  delay: 2
  certain: true
  choices:
    - id: thornes_mann
      label: { de: "Thornes Staatsanwalt eine Wahlspende schicken (2.000 $)", en: "Send Thorne's prosecutor a campaign donation (2,000 $)" }
      result:
        de: Der neue Staatsanwalt bedankt sich persönlich, mit Zigarre. Jacob hat jetzt zwei Männer im Bezirk, die ihm etwas schulden – und einen, dem er etwas schuldet.
        en: The new prosecutor thanks him in person, with a cigar. Jacob now has two men in the county who owe him something – and one to whom he owes something.
      requires: { minCash: 2000 }
      effects: { cash: -2000, favors: 1, heat: 1 }
    - id: nichts
      label: { de: "Den Brief in die Schublade legen", en: "Put the letter in the drawer" }
      result:
        de: >-
          Der neue Staatsanwalt ist Thornes Mann, und Thorne lässt es Jacob spüren: Die
          Frachtsätze steigen, und keiner im Bezirk findet das untersuchenswert.
        en: >-
          The new prosecutor is Thorne's man, and Thorne lets Jacob feel it: freight rates
          rise, and no one in the county thinks it worth investigating.
      effects: { railTariff: 0.05, rival: { thorne: { trust: 5 } } }
      default: true
