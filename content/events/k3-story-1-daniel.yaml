# Entwurf – Philipp überarbeitet.
# Die Akte – Fassung Sheriff: Tatum, abgewählt, redet über das Geld von damals.
- id: k3_daniel_akte_zeuge
  visitor: daniel
  draft: true
  title:
    de: Ein Zeuge gegen Thorne
    en: A Witness Against Thorne
  text:
    de: >-
      Daniel Moss hat nichts gegen Jacob in der Hand. Er sagt es gleich, damit es aus
      dem Weg ist. Er ermittelt gegen Augustus Thorne: Strohmänner im Aktienbuch,
      Frachtrabatte für Freunde, ein Richter in Port Ellis mit einem neuen Haus. „Sie
      sind der einzige Mann in Cordova, der lange genug mit Thorne Geschäfte gemacht
      hat, um es zu beschwören. Und groß genug, um es zu überleben.“
    en: >-
      Daniel Moss has nothing on Jacob. He says so at once, to get it out of the way.
      He is investigating Augustus Thorne: straw men in the share register, freight
      rebates for friends, a judge in Port Ellis with a new house. "You are the only man
      in Cordova who has done business with Thorne long enough to swear to it. And big
      enough to survive it."
  conditions: { minChapter: 3, maxChapter: 3, minRound: 5 }
  notMarked: [moss_feind]
  certain: true
  rival: thorne
  choices:
    - id: aussagen
      label: { de: "Gegen Thorne aussagen", en: "Testify against Thorne" }
      result:
        de: >-
          Jacob sagt vier Stunden lang aus. Eine Woche später erhöht die Thorne-Linie die
          Fracht für Harlan Oil, „aus betrieblichen Gründen“. Daniel schickt eine Karte:
          „Ich weiß, was das kostet.“
        en: >-
          Jacob testifies for four hours. A week later the Thorne line raises Harlan Oil's
          freight "for operational reasons". Daniel sends a card: "I know what this costs."
      effects: { railTariff: 0.05, rival: { thorne: { trust: -20, grudge: 10 } } }
      marks: [daniel_zeuge_thorne]
    - id: verweigern
      label: { de: "Höflich ablehnen", en: "Decline politely" }
      result:
        de: >-
          Daniel nickt, als hätte er damit gerechnet. „Dann sehen wir uns vor der Grand
          Jury, Mr. Harlan. Dort ist Ablehnen weniger höflich.“
        en: >-
          Daniel nods as if he expected it. "Then we will meet before the grand jury, Mr.
          Harlan. There, declining is less polite."
      marks: [daniel_zeuge_verweigert]
      default: true
    - id: bestechen
      label: { de: "Ihn bitten, Harlan Oil herauszuhalten (3.000 $ für die Wahlkasse)", en: "Ask him to keep Harlan Oil out of it (3,000 $ for his campaign fund)" }
      result:
        de: >-
          Daniel legt das Geld in eine Beweismitteltüte. „Jetzt habe ich doch etwas gegen
          Sie in der Hand“, sagt er. „Sie haben es mir gerade gegeben.“
        en: >-
          Daniel puts the money in an evidence bag. "Now I do have something on you," he
          says. "You just handed it to me."
      requires: { minCash: 3000 }
      effects: { cash: -3000, heat: 3, trace: { severity: 3, label: "Geld an den Staatsanwalt" } }
      marks: [daniel_bestechung_versuch]
    - id: wegloben
      label: { de: "Ihn über Senator Grady ins Richteramt loben (5.000 $)", en: "Have Senator Grady promote him to the bench (5,000 $)" }
      result:
        de: >-
          Daniel wird Richter in Hallstead. Die Ermittlung gegen Thorne schläft ein.
          Thorne schickt Jacob eine Kiste Zigarren ohne Karte.
        en: >-
          Daniel becomes a judge in Hallstead. The investigation into Thorne goes to
          sleep. Thorne sends Jacob a box of cigars with no card.
      requires: { minCash: 5000 }
      effects: { cash: -5000, favors: -2, rival: { thorne: { trust: 10 } } }
      marks: [daniel_weggelobt]

# Entwurf – Philipp überarbeitet.
# Kapitel 1: Jacob hat das Wegerecht über die Moss-Weide sauber gekauft (wegerecht_moss).
# Story-Bibel §8: „Daniel: keine Enteignung zu finden.“ Gilt in jeder Fassung, auch beim Feind.
- id: k3_daniel_wegerecht
  visitor: daniel
  draft: true
  title:
    de: Die einzige saubere Akte
    en: The Only Clean File
  text:
    de: >-
      Daniel Moss bringt eine dünne Akte zurück, die einzige, die er nicht behalten will:
      die Pipeline über die Weide seines Vaters. Zwei Wochen lang hat er nach einer
      Enteignung gesucht, nach einer Drohung, nach einem gefälschten Kreuz. „Es gibt
      keine“, sagt er. „Mein Vater hat unterschrieben, und Sie haben bezahlt, jedes Jahr
      pünktlich.“ Er legt die Akte hin, als wäre sie schwerer als die anderen.
    en: >-
      Daniel Moss brings back a thin file, the only one he does not want to keep: the
      pipeline across his father's pasture. For two weeks he searched for an
      expropriation, a threat, a forged cross. "There is none," he says. "My father
      signed, and you paid, punctually, every year." He lays the file down as if it were
      heavier than the others.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 7, maxRound: 12 }
  marked: [wegerecht_moss]
  notMarked: [daniel_weggelobt]
  certain: true
  choices:
    - id: erzaehlen
      label: { de: "Ihm erzählen, wie sein Vater damals verhandelt hat", en: "Tell him how his father bargained back then" }
      result:
        de: >-
          Jacob erzählt, wie Ezekiel um jeden Dollar gefeilscht hat, die Bibel in der Hand,
          und wie er am Ende doch unterschrieben hat. Daniel hört zu, ohne mitzuschreiben.
          Zum ersten Mal.
        en: >-
          Jacob tells how Ezekiel haggled over every dollar, Bible in hand, and how in the
          end he signed all the same. Daniel listens without taking notes. For the first time.
      effects: { strength: -5 }
      appointments: 2
      marks: [daniel_trost]
    - id: schliessen
      label: { de: "„Dann schließen Sie die Akte.“", en: "\"Then close the file.\"" }
      result:
        de: Daniel nickt und schließt sie. „Das tue ich“, sagt er. „Nur diese.“
        en: Daniel nods and closes it. "I will," he says. "Just this one."
      default: true

# Nachwirkung: Jacob wollte nicht aussagen – Daniel lädt ihn vor.
- id: k3_daniel_vorladung
  mail: demand
  deadline: 2
  title:
    de: Vorladung vor die Grand Jury
    en: Summons Before the Grand Jury
  text:
    de: >-
      Ein Bote bringt das Papier persönlich, mit Unterschrift und Siegel des Bezirks
      Cordova: Jacob Harlan hat als Zeuge in der Sache Thorne zu erscheinen. Unten, mit
      der Hand: „Ich hätte es Ihnen lieber erspart. D. M.“
    en: >-
      A messenger delivers the paper in person, signed and sealed by Cordova County:
      Jacob Harlan is to appear as a witness in the Thorne matter. At the bottom, by
      hand: "I would rather have spared you this. D. M."
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_zeuge_verweigert]
  delay: 2
  certain: true
  choices:
    - id: erscheinen
      label: { de: "Erscheinen und aussagen", en: "Appear and testify" }
      result:
        de: >-
          Jacob sagt aus, knapp und genau. Die Thorne-Linie erhöht die Fracht. Daniel
          nickt ihm im Flur zu, mehr nicht.
        en: >-
          Jacob testifies, brief and precise. The Thorne line raises its freight. Daniel
          nods to him in the corridor, no more.
      effects: { railTariff: 0.05 }
      marks: [daniel_zeuge_thorne]
    - id: attest
      label: { de: "Doktor Haskell ein Attest schreiben lassen (500 $)", en: "Have Doctor Haskell write a certificate (500 $)" }
      result:
        de: >-
          Haskell schreibt das Attest, und es stimmt sogar. „Ihr Herz, Jacob. Das war
          keine Gefälligkeit.“ Daniel vertagt um drei Monate.
        en: >-
          Haskell writes the certificate, and it is even true. "Your heart, Jacob. That
          was no favour." Daniel adjourns for three months.
      effects: { cash: -500, strength: -10 }
      marks: [daniel_vertagt]
    - id: fernbleiben
      label: { de: "Nicht erscheinen", en: "Do not appear" }
      result:
        de: >-
          Das Gericht verhängt eine Ordnungsstrafe wegen Missachtung. Der Ledger druckt
          den Beschluss auf Seite eins, neben einem alten Foto von Jacob am Bohrturm.
        en: >-
          The court imposes a fine for contempt. The Ledger prints the order on the front
          page, next to an old photograph of Jacob at the derrick.
      effects: { cash: -2000, reputation: { public: -3 }, heat: 1 }
      marks: [daniel_missachtung]
      default: true

# Nachwirkung: Jacob ist der Vorladung ferngeblieben. Daniel hat nichts gegen ihn in der Hand –
# also keine Anklage, sondern Beugehaft, bis er aussagt. Eine eigene Folge statt des Anwalts-Wegs.
- id: k3_daniel_missachtung
  title:
    de: Beugehaft
    en: Held in Contempt
  text:
    de: >-
      Um acht Uhr morgens stehen zwei Hilfssheriffs im Vorzimmer, die Hüte in der Hand,
      verlegen. Das Gericht hat Beugehaft angeordnet, bis Jacob Harlan in der Sache Thorne
      aussagt. Der Ältere hat vor zwanzig Jahren auf Jacobs Feldern Rohre geschleppt.
      „Tut mir leid, Mr. Harlan“, sagt er. „Der Staatsanwalt lässt ausrichten, Sie sollen
      einen warmen Mantel mitnehmen. Die Zellen sind kalt.“
    en: >-
      At eight in the morning two deputies stand in the outer office, hats in hand,
      embarrassed. The court has ordered Jacob Harlan held until he testifies in the
      Thorne matter. The older one hauled pipe on Jacob's fields twenty years ago. "Sorry,
      Mr. Harlan," he says. "The district attorney says you should bring a warm coat. The
      cells are cold."
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_missachtung]
  delay: 1
  certain: true
  rival: thorne
  choices:
    - id: aussagen
      label: { de: "Mitgehen und aussagen", en: "Go with them and testify" }
      result:
        de: >-
          Jacob sagt am selben Vormittag aus, drei Stunden lang. Daniel bedankt sich nicht.
          „Das hätten wir billiger haben können, Mr. Harlan“, sagt er nur. „Für uns beide.“
        en: >-
          Jacob testifies that same morning, for three hours. Daniel does not thank him.
          "We could have had this cheaper, Mr. Harlan," is all he says. "Both of us."
      effects: { strength: -10, railTariff: 0.05 }
      appointments: 2
      marks: [daniel_zeuge_thorne]
    - id: zelle
      label: { de: "Mitgehen und schweigen", en: "Go with them and stay silent" }
      result:
        de: >-
          Jacob sitzt eine Woche in der Zelle unter dem Gericht von Port Ellis. Der Ledger
          druckt ein Foto der vergitterten Tür. Ruth bringt jeden Abend Decken und sagt
          nichts. Thorne schickt eine Kiste Zigarren in die Zelle. Am achten Tag lässt Daniel
          ihn gehen: „Ich bin nicht hier, um Sie zu brechen.“
        en: >-
          Jacob spends a week in the cell beneath the Port Ellis courthouse. The Ledger
          prints a photograph of the barred door. Ruth brings blankets every evening and
          says nothing. Thorne sends a box of cigars to the cell. On the eighth day Daniel
          lets him go: "I am not here to break you."
      effects: { strength: -25, production: -0.1, reputation: { public: -3 }, rival: { thorne: { trust: 10 } } }
      appointments: 3
      marks: [daniel_beugehaft]
      default: true
    - id: thorne
      label: { de: "Thornes Anwälte holen lassen – Thorne bietet es an", en: "Send for Thorne's lawyers – Thorne is offering" }
      result:
        de: >-
          Thornes Anwälte finden bis Mittag einen Formfehler in der Anordnung. Jacob ist
          zum Essen zu Hause. Am Nachmittag senkt die Thorne-Linie seine Fracht. Daniel
          schreibt ihm eine Zeile: „Jetzt wissen wir beide, für wen Sie schweigen.“
        en: >-
          By noon Thorne's lawyers have found a flaw in the order. Jacob is home for lunch.
          In the afternoon the Thorne line lowers his freight. Daniel writes him one line:
          "Now we both know whom you are keeping silent for."
      effects: { railTariff: -0.03, strength: -5, rival: { thorne: { trust: 15 } }, heat: 2 }
      marks: [daniel_thorne_gedeckt]

# Entwurf – Philipp überarbeitet.
# Nachwirkung: Jacob hat im Moss-Fall kooperiert. Daniel hat alles gesehen und bietet an, was er
# einem Mann anbietet, der nichts verschwiegen hat. Ausgang für Kapitel 4: Vergleich oder Anklage.
- id: k3_daniel_ergebnis_moss
  visitor: daniel
  draft: true
  title:
    de: Was im Heft stand
    en: What the Book Said
  text:
    de: >-
      Daniels Leute haben Jacobs Archiv verlassen. Daniel kommt allein, mit dem Schulheft
      und einem Bericht von neun Seiten. Die Bücher bestätigen, was der Junge damals
      aufgeschrieben hat. „Sie haben mir nichts verschwiegen, Mr. Harlan. Darum biete ich
      Ihnen an, was ich einem Mann anbiete, der nichts verschwiegen hat.“ Ein Geständnis in
      einem Punkt, eine Strafe, kein Prozess. Über seinen Ohren ist das Haar grau geworden,
      in diesen zwei Monaten oder schon lange.
    en: >-
      Daniel's people have left Jacob's archive. Daniel comes alone, with the exercise
      book and a report of nine pages. The books confirm what the boy wrote down back then.
      "You concealed nothing from me, Mr. Harlan. So I offer you what I offer a man who
      concealed nothing." An admission on one count, a fine, no trial. Above his ears the
      hair has gone grey, in these two months or long before.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_kooperation_moss]
  notMarked: [moss_betrogen]   # 0.4.19+3: nach dem Vertrag (Farm blieb Moss') → k3_daniel_ergebnis_moss_vertrag
  delay: 2
  certain: true
  choices:
    - id: gestehen
      label: { de: "Das Geständnis unterschreiben (4.000 $ Strafe)", en: "Sign the admission (4,000 $ fine)" }
      result:
        de: >-
          Jacob unterschreibt. Daniel liest es zweimal, faltet es und legt es in das
          Schulheft, zwischen die Seiten von damals. „Jetzt steht es an der richtigen
          Stelle“, sagt er.
        en: >-
          Jacob signs. Daniel reads it twice, folds it and lays it in the exercise book,
          between the pages from back then. "Now it is in the right place," he says.
      requires: { minCash: 4000 }
      effects: { cash: -4000, strength: -10, reputation: { public: -2 }, evidence: -2 }
      marks: [daniel_vergleich]
    - id: land
      label: { de: "Kein Geständnis – aber das Land an die Familie Moss zurückgeben", en: "No admission – but return the land to the Moss family" }
      result:
        de: >-
          Daniel sieht lange auf die Urkunde. „Das ist kein Geständnis“, sagt er. „Es ist
          mehr.“ Er nimmt an. Im Frühjahr lässt er den Zaun neu setzen, an der alten Stelle,
          mit eigenen Händen.
        en: >-
          Daniel looks at the deed a long time. "That is no admission," he says. "It is
          more." He accepts. In spring he has the fence set again, in the old place, with
          his own hands.
      effects: { production: -0.2, strength: -10, reputation: { public: 2 } }
      marks: [daniel_vergleich, moss_land_zurueck]
      sharp: true
    - id: schweigen
      label: { de: "Nicht unterschreiben – Daniel soll tun, was er muss", en: "Do not sign – let Daniel do what he must" }
      result:
        de: >-
          Daniel steckt den Bericht wieder ein. „Sie haben mir alles gezeigt, und jetzt
          wollen Sie nicht unterschreiben, was ich gesehen habe“, sagt er. „Das verstehe ich
          nicht. Ich muss es auch nicht verstehen.“
        en: >-
          Daniel puts the report away again. "You showed me everything, and now you will not
          sign what I saw," he says. "I don't understand that. I don't have to."
      effects: { cash: -2000, strength: -10, evidence: 2 }
      marks: [daniel_anklage]
      default: true

