# Kapitel 3 – Story-Bogen Daniel Moss wird Bezirksstaatsanwalt (Phase 4, Story-Bibel §7 A).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# Zwanzig Jahre nach Kapitel 1 ist Daniel Moss 35 und will Bezirksstaatsanwalt
# von Cordova werden. Ziel: dass das Gesetz auch für Reiche gilt. Er ist unbestechlich –
# Bestechung macht alles schlimmer. Alle Ereignisse nur in Kapitel 3 (minChapter/maxChapter).
# Runden zählen innerhalb des Kapitels (1–16), wie in der Story-Bibel.
#
#   R1–3   k3_daniel_wahl            Daniel kandidiert: unterstützen, Gegner finanzieren, heraushalten
#          k3_daniel_wahlnacht       (daniel_bekaempft) Er gewinnt trotzdem – der Ledger druckt die Spender
#   R2+    k3_daniel_antritt         Antrittsbesuch – Fassungen je nach Kapitel 1:
#          _antritt (moss_fair) · _antritt_feind (moss_feind) · _antritt_entschuldigung
#          (moss_feind + daniel_entschuldigung: „Trost oder Beweis“) · _antritt_neutral (abgewiesen)
#          · _antritt_fremd (moss_verloren: erst beim Namen versteht Jacob)
#   R3–4   k3_daniel_vorwarnung      (daniel_gefoerdert) Dankbarkeit gegen Pflicht: Vorwarnung, nie Gefälligkeit
#   R5+    k3_daniel_akte_*          Schlüsselszene: was Daniel gegen Jacob in der Hand hat (genau eine Fassung)
#          _moss (moss_feind) · _sheriff (sheriff_bezahlt) · _kerrigan (kerrigan_verheizt)
#          · _pike (pike_urkunde_falsch) · _zeuge (nichts – er braucht Jacob gegen Thorne)
#          kooperieren · Anwälte · bestechen (scheitert immer) · wegloben ins Richteramt
#   R7–12  k3_daniel_wegerecht       (wegerecht_moss) „Keine Enteignung zu finden.“
#   R6–10  k3_moss_beerdigung        Ezekiel stirbt (tableau): Sarg tragen / hinten mit Ruth / Hauptversammlung
#          _feind: Daniel stellt sich zwischen Jacob und das Grab · k3_moss_grab (moss_verloren)
#
# Wie es nach der Akte weitergeht – jeder Weg endet in einem Ausgang für Kapitel 4:
#   kooperieren   _moss → k3_daniel_ergebnis_moss      Geständnis, Land zurück oder Anklage
#                 _sheriff → k3_daniel_kronzeuge       Aussage gegen Tatum (Vergleich) oder Anklage
#                 _kerrigan → k3_daniel_ergebnis_kerrigan  Geständnis, Unfallkasse oder Anklage
#                 _pike → daniel_entlastet (sofort)    Pike lügt – die Bücher beweisen es
#                 _zeuge → k3_daniel_zeuge_folge       Thorne schlägt zurück; mit Daniel: daniel_verbuendet
#   Anwälte       → k3_daniel_angebot (+3, Tür nicht zu) · _angebot_trost (Feind mit Trost)
#                 · sonst k3_daniel_anklage (+5) bzw. _anklage_feind (moss_feind)
#   bestechen     → k3_daniel_bestechung_folge (+1) → k3_daniel_anklage_bestechung (+3) – teurer als
#                 jeder Anwalts-Weg (Bibel: „ein Bestechungsversuch macht es schlimmer, nicht besser“)
#   wegloben      → k3_daniel_weggelobt_folge
#   Zeuge ablehnen → k3_daniel_vorladung → aussagen / Attest (daniel_vertagt) / fernbleiben
#                 → k3_daniel_missachtung (Beugehaft – keine Anklage gegen Jacob, er hat ja nichts getan)
#
# Ausgänge für Kapitel 4 (content/relevance.yaml): daniel_verbuendet, daniel_anklage,
# daniel_vergleich, daniel_entlastet, daniel_weggelobt, daniel_bestechung_versuch (K4-Prüfung:
# keine Anklage!), daniel_zeuge_thorne, daniel_beugehaft, daniel_thorne_gedeckt, daniel_vertagt,
# daniel_unfallkasse, moss_land_zurueck.
#
# Anknüpfung Kapitel 2 (nach Merge von phase4/inhalte-k2-story nachtragen, bis dahin setzt
# keine Wahl diese Merkzeichen – check:content würde sie als Tippfehler melden):
#   daniel_angestellt  → eigene Fassung von k3_daniel_akte („Er kennt die Akten von innen.“)
#   silas_k2_geopfert  → weitere Fassung von k3_daniel_akte (der tote Arbeiter)
#   zs2_grady_reserveland → weitere Fassung von k3_daniel_akte (Gradys Reserveland)
#   delaney_akte_harlan → Daniel und Delaney streiten um die Zuständigkeit
# WUNSCH (Story-Bibel §10): Bedingungen anyMarked, investigationStage, minControl. Die Effekte
# heat, trace, evidence (Daniels Ermittlung), reputation und favors wirken seit 4.19.

# Entwurf – Philipp überarbeitet.
- id: k3_daniel_wahl
  title:
    de: Ein Name auf den Wahlplakaten
    en: A Name on the Election Posters
  text:
    de: >-
      An jedem Telegrafenmast zwischen Salt Hill und Port Ellis klebt dasselbe Plakat:
      DANIEL MOSS – DAS GESETZ GILT FÜR ALLE. Das Foto zeigt einen Mann mit früh
      ergrauten Schläfen, wie sein Vater sie hatte. Am Abend sitzen zwei Herren der
      Handelspartei in Jacobs Salon. Ihr Kandidat brauche Geld, sagen sie. Viel Geld.
      Moss rede zu oft von „Ölbaronen“.
    en: >-
      Every telegraph pole between Salt Hill and Port Ellis carries the same poster:
      DANIEL MOSS – THE LAW IS FOR EVERYONE. The photograph shows a man with temples
      gone grey early, as his father's did. In the evening two gentlemen of the Trade
      Party sit in Jacob's parlour. Their candidate needs money, they say. A great
      deal. Moss talks too often about "oil barons".
  conditions: { minChapter: 3, maxChapter: 3, minRound: 1, maxRound: 3 }
  certain: true
  choices:
    - id: unterstuetzen
      label: { de: "Daniels Wahlkampf unterstützen (1.500 $)", en: "Back Daniel's campaign (1,500 $)" }
      result:
        de: >-
          Daniel schickt die Spende nicht zurück. Er schickt eine Quittung, mit Datum
          und Unterschrift, und eine Zeile: „Das ändert nichts. Aber ich weiß es.“
        en: >-
          Daniel does not send the money back. He sends a receipt, dated and signed,
          and one line: "This changes nothing. But I know it."
      requires: { minCash: 1500 }
      effects: { cash: -1500 }
      marks: [daniel_unterstuetzt]
    - id: gegner
      label: { de: "Den Kandidaten der Handelspartei finanzieren (2.500 $)", en: "Fund the Trade Party's candidate (2,500 $)" }
      result:
        de: >-
          Die Herren bedanken sich mit einem festen Händedruck. Zwei Wochen lang hängen
          neue Plakate über Daniels. Dann regnet es, und das Papier löst sich.
        en: >-
          The gentlemen thank him with a firm handshake. For two weeks new posters hang
          over Daniel's. Then it rains, and the paper peels away.
      requires: { minCash: 2500 }
      effects: { cash: -2500, party: { handel: 2 }, favors: 1 }
      marks: [daniel_bekaempft]
    - id: heraushalten
      label: { de: "Sich heraushalten", en: "Stay out of it" }
      result:
        de: Jacob schenkt den Herren nach und sagt nichts. Sie gehen früher als geplant.
        en: Jacob refills the gentlemen's glasses and says nothing. They leave earlier than planned.
      default: true

# Nachwirkung: Jacob hat den Gegner bezahlt. Daniel gewinnt trotzdem.
- id: k3_daniel_wahlnacht
  title:
    de: Dreihundertzwölf Stimmen
    en: Three Hundred and Twelve Votes
  text:
    de: >-
      Daniel Moss gewinnt mit dreihundertzwölf Stimmen Vorsprung. Am Morgen danach
      druckt der Ledger die Liste der Spender seines Gegners. Jacobs Name steht an
      zweiter Stelle, gleich hinter einer Bank aus Hallstead. In der Arbeiterkirche
      liest Bruder Abel die Liste vor, Name für Name, ohne ein Wort dazu.
    en: >-
      Daniel Moss wins by three hundred and twelve votes. The morning after, the Ledger
      prints the list of his opponent's donors. Jacob's name stands second, just behind
      a bank from Hallstead. In the workers' church Brother Abel reads the list aloud,
      name by name, without a word of his own.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_bekaempft]
  delay: 1
  certain: true
  choices:
    - id: dazu_stehen
      label: { de: "Dazu stehen: „Wahlspenden sind kein Verbrechen.“", en: "Own it: \"Campaign money is no crime.\"" }
      result:
        de: >-
          Der Satz steht am nächsten Tag auf Seite eins. Darunter, kleiner: „Noch nicht.“
          Jacob schläft schlecht in dieser Woche.
        en: >-
          The sentence is on the front page the next day. Below it, smaller: "Not yet."
          Jacob sleeps badly that week.
      effects: { strength: -15, reputation: { public: -3, workers: -3 } }
      default: true
    - id: zuschuetten
      label: { de: "Den Ledger mit Anzeigen besänftigen (1.200 $)", en: "Soothe the Ledger with advertising (1,200 $)" }
      result:
        de: >-
          Der Verleger nimmt die Anzeigen und druckt keine Liste mehr. Daniel liest beide
          Ausgaben, die mit und die ohne. Er legt sie zusammen ab.
        en: >-
          The publisher takes the advertising and prints no more lists. Daniel reads both
          editions, with and without. He files them together.
      requires: { minCash: 1200 }
      effects: { cash: -1200, trace: { severity: 1, label: "Anzeigen gegen Schweigen" } }

# Entwurf – Philipp überarbeitet.
# Antritt – Fassung fair: Jacob hat Ezekiel in Kapitel 1 geholfen.
- id: k3_daniel_antritt
  visitor: daniel
  draft: true
  title:
    de: Der Bezirksstaatsanwalt
    en: The District Attorney
  text:
    de: >-
      Daniel Moss behält den Mantel an. Er ist größer als sein Vater, schmaler, und er
      schreibt mit, während er redet. „Mein Vater lässt grüßen, Mr. Harlan. Er sagt,
      ich soll mich vor Ihnen in Acht nehmen. Ich habe ihm gesagt, es sei umgekehrt.“
      Er lächelt dabei nicht. Auf dem Tisch liegt sein Notizbuch, aufgeschlagen auf
      einer leeren Seite.
    en: >-
      Daniel Moss keeps his coat on. He is taller than his father, narrower, and he
      takes notes while he talks. "My father sends his regards, Mr. Harlan. He says I
      should beware of you. I told him it was the other way round." He does not smile.
      His notebook lies on the desk, open at an empty page.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 2 }
  marked: [moss_fair]
  notMarked: [moss_feind]
  certain: true
  choices:
    - id: buecher
      label: { de: "Ihm die Bücher zeigen, bevor er fragt", en: "Show him the books before he asks" }
      result:
        de: >-
          Daniel blättert eine Stunde lang. Dann schickt er zwei Prüfer auf die Felder,
          und die Bohrtrupps stehen drei Wochen lang Rede und Antwort statt am Gestänge.
          „Danke“, sagt er. „Das hat noch keiner gemacht.“
        en: >-
          Daniel leafs through them for an hour. Then he sends two inspectors to the
          fields, and for three weeks the crews answer questions instead of working the
          rods. "Thank you," he says. "No one has done that before."
      effects: { production: -0.1, evidence: -1, reputation: { politics: 2 } }
      marks: [daniel_offen]
    - id: anwalt
      label: { de: "Freundlich bleiben – der Firmenanwalt wartet im Nebenzimmer (800 $)", en: "Stay friendly – the company lawyer waits next door (800 $)" }
      result:
        de: >-
          Daniel bemerkt die angelehnte Tür. Er spricht danach etwas lauter, damit auch
          der Herr nebenan alles versteht.
        en: >-
          Daniel notices the door left ajar. After that he speaks a little louder, so the
          gentleman next door can follow everything.
      effects: { cash: -800 }
      default: true
    - id: kalt
      label: { de: "Ihn spüren lassen, wem Cordova gehört", en: "Let him feel who owns Cordova" }
      result:
        de: >-
          Daniel schreibt einen Satz in sein Notizbuch und klappt es zu. „Mein Vater hat
          sich geirrt“, sagt er an der Tür. „Er hält Sie für einen anständigen Mann.“
        en: >-
          Daniel writes one sentence in his notebook and closes it. "My father was
          wrong," he says at the door. "He thinks you are a decent man."
      marks: [daniel_kalt]

# Entwurf – Philipp überarbeitet.
# Antritt – Fassung Feind: Jacob hat Moss betrogen oder die Farm ersteigert.
- id: k3_daniel_antritt_feind
  visitor: daniel
  draft: true
  title:
    de: „Ich lese es Ihnen vor“
    en: '"I Will Read It to You"'
  text:
    de: >-
      Daniel Moss setzt sich nicht. Er zieht ein abgegriffenes Schulheft aus der
      Manteltasche, das Papier gelb, die Schrift die eines Jungen. „Ich habe mir damals
      etwas aufgeschrieben, Mr. Harlan. Ich lese es Ihnen vor.“ Ein Datum. Eine Summe.
      Der Name seines Vaters. Draußen schlägt die Kirchenuhr, und Jacob merkt, dass er
      die Hände auf dem Tisch gefaltet hat wie ein Angeklagter.
    en: >-
      Daniel Moss does not sit down. He takes a worn school exercise book from his coat
      pocket, the paper yellow, the handwriting a boy's. "I wrote something down back
      then, Mr. Harlan. I will read it to you." A date. A sum. His father's name.
      Outside the church clock strikes, and Jacob notices he has folded his hands on
      the desk like a defendant.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 2 }
  marked: [moss_feind]
  notMarked: [daniel_entschuldigung]
  certain: true
  choices:
    - id: zuhoeren
      label: { de: "Zuhören bis zum Ende", en: "Listen to the end" }
      result:
        de: >-
          Es dauert elf Minuten. Daniel klappt das Heft zu. „Mehr wollte ich nicht. Noch
          nicht.“ Jacob sitzt danach lange allein im Büro und lässt niemanden herein.
        en: >-
          It takes eleven minutes. Daniel closes the book. "That is all I wanted. For
          now." Afterwards Jacob sits alone in the office for a long time and lets no one in.
      effects: { strength: -15 }
      default: true
    - id: geld
      label: { de: "Wiedergutmachung anbieten (3.000 $ für die Familie Moss)", en: "Offer amends (3,000 $ for the Moss family)" }
      result:
        de: >-
          Daniel nimmt den Scheck und betrachtet ihn. „Den nehme ich für meinen Vater. Er
          hat es verdient.“ Er steckt ihn ein. „Das Heft behalte ich für mich.“
        en: >-
          Daniel takes the cheque and studies it. "I will take this for my father. He has
          earned it." He pockets it. "The book I keep for myself."
      requires: { minCash: 3000 }
      effects: { cash: -3000 }
    - id: unterbrechen
      label: { de: "Ihn unterbrechen: „Das ist zwanzig Jahre her.“", en: "Cut him off: \"That was twenty years ago.\"" }
      result:
        de: >-
          „Neunzehn“, sagt Daniel und schreibt die Zahl dazu. „Verjährt ist es nicht. Ich
          habe nachgesehen.“
        en: >-
          "Nineteen," says Daniel, and writes the number down. "It has not lapsed. I
          checked."
      marks: [daniel_kalt]

# Entwurf – Philipp überarbeitet.
# Antritt – Fassung Feind mit Entschuldigung (Kapitel 1: Trost oder Beweis – hier entscheidet es sich).
- id: k3_daniel_antritt_entschuldigung
  visitor: daniel
  draft: true
  title:
    de: Trost oder Beweis
    en: Comfort or Evidence
  text:
    de: >-
      Daniel Moss legt ein altes Schulheft auf den Tisch und schlägt es an einer
      markierten Stelle auf. „Darunter steht, dass Sie zu mir gekommen sind und sich
      entschuldigt haben. Ich habe zwanzig Jahre lang nicht gewusst, wofür ich das
      aufgeschrieben habe, Mr. Harlan. Als Trost oder als Beweis.“ Er wartet. Auf
      seinem Ärmel ist ein Tintenfleck, den niemand mehr herauswaschen wird.
    en: >-
      Daniel Moss lays an old exercise book on the desk and opens it at a marked page.
      "Below this it says you came to me and apologised. For twenty years I have not
      known why I wrote that down, Mr. Harlan. As comfort or as evidence." He waits.
      There is an ink stain on his sleeve that no one will ever wash out.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 2 }
  marked: [moss_feind, daniel_entschuldigung]
  certain: true
  choices:
    - id: ernst
      label: { de: "„Es war ernst gemeint. Es ist es noch.“", en: "\"I meant it. I still do.\"" }
      result:
        de: >-
          Daniel sieht ihn lange an. Dann schreibt er etwas unter die alte Zeile, in der
          Schrift eines Mannes. Was, sagt er nicht. Er gibt Jacob zum Abschied die Hand.
        en: >-
          Daniel looks at him a long time. Then he writes something under the old line,
          in a man's hand. What, he does not say. He shakes Jacob's hand on leaving.
      effects: { strength: -10 }
      marks: [daniel_trost]
      sharp: true
    - id: beweis
      label: { de: "„Dann lesen Sie es vor Gericht vor.“", en: "\"Then read it out in court.\"" }
      result:
        de: Daniel klappt das Heft zu. „Das werde ich“, sagt er. Es klingt nicht wie eine Drohung, sondern wie ein Termin.
        en: Daniel closes the book. "I will," he says. It does not sound like a threat. It sounds like an appointment.
      marks: [daniel_kalt]
      default: true
    - id: schweigen
      label: { de: "Nichts sagen", en: "Say nothing" }
      result:
        de: >-
          Das Schweigen dauert, bis die Sekretärin klopft. Daniel steht auf. „Das ist
          auch eine Antwort“, sagt er. „Ich weiß nur noch nicht, welche.“
        en: >-
          The silence lasts until the secretary knocks. Daniel stands. "That is an answer
          too," he says. "I just don't know yet which one."
      effects: { strength: -15 }

# Entwurf – Philipp überarbeitet.
# Antritt – Fassung neutral: Jacob hat Moss damals abgewiesen (Farm verloren oder doch nicht).
- id: k3_daniel_antritt_neutral
  visitor: daniel
  draft: true
  title:
    de: „Das ist kein Verbrechen“
    en: '"That Is No Crime"'
  text:
    de: >-
      Daniel Moss nimmt den angebotenen Stuhl, aber keinen Kaffee. „Sie haben meinem
      Vater damals Nein gesagt, Mr. Harlan. Das ist kein Verbrechen. Ich wollte nur,
      dass Sie wissen, dass ich es weiß.“ Er spricht leise, wie jemand, der gelernt hat,
      dass Leute sich vorbeugen, wenn man leise spricht. Jacob beugt sich vor.
    en: >-
      Daniel Moss takes the offered chair but no coffee. "You told my father no, back
      then, Mr. Harlan. That is no crime. I only wanted you to know that I know." He
      speaks quietly, like someone who has learned that people lean in when you speak
      quietly. Jacob leans in.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 2 }
  marked: [moss_abgewiesen]
  notMarked: [moss_fair, moss_feind, moss_verloren]
  certain: true
  choices:
    - id: buecher
      label: { de: "Ihm die Bücher zeigen, bevor er fragt", en: "Show him the books before he asks" }
      result:
        de: >-
          Daniel schickt zwei Prüfer auf die Felder. Drei Wochen lang stehen die Trupps
          Rede und Antwort. „Ich hatte Sie anders erwartet“, sagt er zum Schluss.
        en: >-
          Daniel sends two inspectors to the fields. For three weeks the crews answer
          questions. "I expected you to be different," he says at the end.
      effects: { production: -0.1, evidence: -1 }
      marks: [daniel_offen]
    - id: anwalt
      label: { de: "Höflich bleiben und den Anwalt schreiben lassen (800 $)", en: "Stay polite and let the lawyer write (800 $)" }
      result:
        de: Daniel bekommt einen Brief mit vier Seiten und keiner Auskunft. Er bedankt sich schriftlich, mit einer Seite.
        en: Daniel receives a letter of four pages and no information. He thanks them in writing, in one page.
      effects: { cash: -800 }
      default: true
    - id: kalt
      label: { de: "„Dann wissen Sie ja, wo die Tür ist.“", en: "\"Then you know where the door is.\"" }
      result:
        de: Daniel steht auf, ohne Eile. „Jetzt weiß ich noch etwas“, sagt er.
        en: Daniel rises without hurry. "Now I know something else," he says.
      marks: [daniel_kalt]

# Entwurf – Philipp überarbeitet.
# Antritt – Fassung fremd: Die Familie Moss ist fort (moss_verloren). Erst beim Namen versteht Jacob.
- id: k3_daniel_antritt_fremd
  visitor: daniel
  draft: true
  title:
    de: Ein Name, den Jacob sucht
    en: A Name Jacob Searches For
  text:
    de: >-
      Ein schmaler Mann Mitte dreißig, die Schläfen früh ergraut, stellt sich als neuer
      Bezirksstaatsanwalt vor. „Daniel Moss.“ Jacob kennt den Namen von den Plakaten an jedem Telegrafenmast. Erst jetzt, mit dem Mann vor sich, versteht er ihn: eine Farm am Salt Hill, ein Farmer mit
      einer Bibel, eine Versteigerung, zu der Jacob nicht gegangen ist. Daniel sieht ihm
      dabei zu, wie er sich erinnert. Er hat Zeit. Er hat zwanzig Jahre gehabt.
    en: >-
      A narrow man in his mid-thirties, temples grey too early, introduces himself as
      the new district attorney. "Daniel Moss." Jacob knows the name from the posters on every telegraph pole. Only now, with the man in front of him, does he understand it: a farm on Salt Hill, a farmer with a
      Bible, an auction Jacob did not attend. Daniel watches him remember. He has time.
      He has had twenty years.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 2 }
  marked: [moss_verloren]
  notMarked: [moss_fair, moss_feind]
  certain: true
  choices:
    - id: fragen
      label: { de: "„Ihr Vater. Was ist aus ihm geworden?“", en: "\"Your father. What became of him?\"" }
      result:
        de: >-
          „Das erzähle ich Ihnen ein andermal“, sagt Daniel. „Wenn Sie es dann noch wissen
          wollen.“ Er bleibt eine Stunde. Er fragt nach nichts, was mit Öl zu tun hat.
        en: >-
          "I'll tell you another time," says Daniel. "If you still want to know by then."
          He stays an hour. He asks about nothing that has to do with oil.
      effects: { strength: -5 }
      appointments: 2
    - id: anwalt
      label: { de: "Höflich bleiben und den Anwalt schreiben lassen (800 $)", en: "Stay polite and let the lawyer write (800 $)" }
      result:
        de: Daniel bekommt einen Brief mit vier Seiten und keiner Auskunft. Er bedankt sich schriftlich, mit einer Seite.
        en: Daniel receives a letter of four pages and no information. He thanks them in writing, in one page.
      effects: { cash: -800 }
      default: true
    - id: vergessen
      label: { de: "So tun, als sage ihm der Name nichts", en: "Pretend the name means nothing to him" }
      result:
        de: >-
          „Natürlich nicht“, sagt Daniel. „Warum sollte er.“ Er schreibt einen Satz in sein
          Notizbuch, ohne hinzusehen, als hätte er ihn schon vorher gewusst.
        en: >-
          "Of course not," says Daniel. "Why would it." He writes a sentence in his notebook
          without looking, as if he had known it beforehand.
      marks: [daniel_kalt]

# Entwurf – Philipp überarbeitet.
# Jacob hat Daniel in Kapitel 1 die Fahrkarte nach Hallstead bezahlt (daniel_gefoerdert).
# Story-Bibel: Er zahlt mit Fairness zurück – Vorwarnung, nie Gefälligkeit. Kommt vor der Akte.
- id: k3_moss_beerdigung
  tableau: true
  ranch: moss
  draft: true
  title:
    de: Der Zaun, den er gebaut hat
    en: The Fence He Built
  text:
    de: >-
      Ezekiel Moss wird auf seiner eigenen Weide begraben, neben dem Zaun, den er vor
      vierzig Jahren gesetzt hat. Unter der Erde laufen zwei Rohre von Jacobs Pipeline,
      und keiner der Trauergäste erwähnt es. Daniel steht am Kopfende, barhäuptig im
      Nieselregen. Am selben Vormittag erwartet die Bank in Port Ellis Jacob zur Unterschrift unter die neue Anleihe. Der
      Sarg ist schwerer, als ein alter Mann sein dürfte. Es fehlt ein Träger.
    en: >-
      Ezekiel Moss is buried on his own pasture, beside the fence he set forty years
      ago. Beneath the ground run two pipes of Jacob's line, and none of the mourners
      mentions it. Daniel stands at the head, bareheaded in the drizzle. The same morning the bank in Port Ellis expects Jacob to sign the new bond. The coffin is heavier than
      an old man should be. One bearer is missing.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 6, maxRound: 10 }
  marked: [moss_fair]
  notMarked: [moss_feind]
  certain: true
  choices:
    - id: sarg
      label: { de: "Den Sarg mittragen", en: "Help carry the coffin" }
      result:
        de: >-
          Jacob nimmt die freie Ecke. Daniel sieht ihn über den Sarg hinweg an und nickt
          einmal. Auf dem Rückweg spürt Jacob sein Herz, wie Doktor Haskell es ihm
          vorausgesagt hat.
        en: >-
          Jacob takes the free corner. Daniel looks at him across the coffin and nods
          once. On the way back Jacob feels his heart, just as Doctor Haskell said he would.
      effects: { strength: -15 }
      appointments: 2
      marks: [daniel_sarg_getragen]
    - id: mit_ruth
      label: { de: "Mit Ruth hingehen und hinten stehen", en: "Go with Ruth and stand at the back" }
      result:
        de: >-
          Ruth hält seinen Arm. Sie singen das Lied, das Ezekiel jeden Sonntag falsch
          gesungen hat. Auf dem Heimweg sagt sie: „Das war richtig.“ Mehr nicht.
        en: >-
          Ruth holds his arm. They sing the hymn Ezekiel sang off-key every Sunday. On
          the way home she says, "That was right." Nothing more.
      effects: { ruth: 15, strength: -5 }
    - id: kranz
      label: { de: "Einen Kranz schicken – die Bank geht vor", en: "Send a wreath – the bank comes first" }
      result:
        de: >-
          Der Kranz ist der größte am Grab. Daniel liest die Schleife, „In Dankbarkeit,
          J. Harlan“, und lässt sie umdrehen, sodass man die Schrift nicht mehr sieht.
        en: >-
          The wreath is the largest at the grave. Daniel reads the ribbon, "In gratitude,
          J. Harlan", and has it turned so the writing no longer shows.
      marks: [moss_beerdigung_verpasst]
      default: true

# Entwurf – Philipp überarbeitet.
# Ezekiel Moss stirbt (Feind). Daniel stellt sich zwischen Jacob und das Grab.
- id: k3_moss_beerdigung_feind
  tableau: true
  draft: true
  title:
    de: Zwischen Jacob und dem Grab
    en: Between Jacob and the Grave
  text:
    de: >-
      Ezekiel Moss wird auf dem Armenfriedhof von Port Ellis begraben, weit weg von dem
      Land, das einmal seins war. Als Jacob durch das Tor kommt, löst sich Daniel aus
      der Reihe der Trauernden und stellt sich mitten auf den Weg. Er sagt nichts. Er
      steht nur da, die Hände in den Manteltaschen, bis alle anderen sich umgedreht haben.
    en: >-
      Ezekiel Moss is buried in the paupers' cemetery at Port Ellis, far from the land
      that was once his. As Jacob comes through the gate, Daniel steps out of the line
      of mourners and stands in the middle of the path. He says nothing. He simply
      stands there, hands in his coat pockets, until everyone else has turned round.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 6, maxRound: 10 }
  marked: [moss_vertrieben]
  certain: true
  choices:
    - id: umkehren
      label: { de: "Umkehren", en: "Turn back" }
      result:
        de: >-
          Jacob geht zurück zur Kutsche. Hinter ihm beginnt der Pfarrer zu sprechen. Den
          Rest des Tages redet Jacob mit niemandem.
        en: >-
          Jacob walks back to the carriage. Behind him the pastor begins to speak. For
          the rest of the day Jacob talks to no one.
      effects: { strength: -15 }
      default: true
    - id: vorbei
      label: { de: "An ihm vorbei zum Grab gehen", en: "Walk past him to the grave" }
      result:
        de: >-
          Daniel tritt einen halben Schritt zur Seite, gerade genug. Als Jacob die Erde
          wirft, hört er hinter sich, wie ein Bleistift über Papier geht.
        en: >-
          Daniel steps half a pace aside, just enough. As Jacob throws the earth, he hears
          a pencil moving over paper behind him.
      marks: [daniel_kalt]
    - id: warten
      label: { de: "Am Tor warten, bis alle gegangen sind – dann allein hin", en: "Wait at the gate until everyone has gone – then go alone" }
      result:
        de: >-
          Es regnet zwei Stunden. Als Jacob endlich am Grab steht, sieht er Daniel auf
          der Straße stehen geblieben. Er hat zugesehen. Er geht, ohne sich umzudrehen.
        en: >-
          It rains for two hours. When Jacob finally stands at the grave, he sees Daniel
          has stopped in the street. He has been watching. He leaves without turning.
      effects: { strength: -20 }
      marks: [daniel_trost]

