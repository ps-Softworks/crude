# Entwurf – Philipp überarbeitet.
# Nachwirkung: Jacob hat im Sheriff-Fall kooperiert („Diesmal“). Daniel braucht ihn im Zeugenstand
# gegen Tatum – dafür Straffreiheit. Ausgang für Kapitel 4: Vergleich oder Anklage.
- id: k3_daniel_angebot
  visitor: daniel
  draft: true
  title:
    de: „Mehr kann ich nicht“
    en: '"I Can Do No More"'
  text:
    de: >-
      Daniel Moss kommt spät am Abend, ohne Gehilfen. Er legt einen Vergleich auf den
      Tisch: eine Zahlung an den Bezirk, ein Eingeständnis in einem Punkt, kein Prozess.
      „Mein Vater hätte gewollt, dass ich Ihnen das anbiete. Mehr kann ich nicht.“ Er
      sieht müde aus. Jacob merkt, dass Daniel jetzt so alt ist wie er selbst damals in
      Port Ellis, und rechnet nach, ob das stimmt.
    en: >-
      Daniel Moss comes late in the evening, without his clerk. He lays a settlement on
      the desk: a payment to the county, an admission on one count, no trial. "My father
      would have wanted me to offer you this. I can do no more." He looks tired. Jacob
      realises Daniel is now as old as he himself was back in Port Ellis, and counts to
      check.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_anwaelte]
  notMarked: [daniel_kalt, moss_feind, moss_beerdigung_verpasst]
  delay: 3
  certain: true
  choices:
    - id: vergleich
      label: { de: "Den Vergleich annehmen (6.000 $)", en: "Accept the settlement (6,000 $)" }
      result:
        de: >-
          Jacob unterschreibt. Daniel faltet das Papier zweimal und steckt es ein. „Er
          hätte Sie gemocht, heute“, sagt er. „Ich bin nicht sicher, ob ich es tue.“
        en: >-
          Jacob signs. Daniel folds the paper twice and puts it away. "He would have liked
          you, today," he says. "I am not sure I do."
      effects: { cash: -6000, evidence: -2, reputation: { public: -1 } }
      marks: [daniel_vergleich]
    - id: prozess
      label: { de: "Ablehnen – dann eben vor Gericht", en: "Refuse – court it is" }
      result:
        de: >-
          Daniel nimmt das Papier wieder mit. An der Tür bleibt er stehen. „Ich hatte
          gehofft, dass Sie es nicht tun. Ich weiß nicht, warum.“
        en: >-
          Daniel takes the paper back. At the door he stops. "I hoped you would not. I
          don't know why."
      effects: { cash: -2000, strength: -10, evidence: 2 }
      marks: [daniel_anklage]
      default: true

# Entwurf – Philipp überarbeitet.
# Das Angebot an den Feind: Jacob hat Daniel in Kapitel 3 einmal Trost gegeben. Nur moss_feind –
# das Schulheft aus dem Antritt gibt es nur in den Feind-Fassungen.
- id: k3_daniel_angebot_trost
  visitor: daniel
  draft: true
  title:
    de: Etwas anderes
    en: Something Else
  text:
    de: >-
      Daniel Moss legt das alte Schulheft neben einen Vergleich. „Ich habe lange
      überlegt, ob ich das, was ich über Sie aufgeschrieben habe, als Beweis lese oder
      als etwas anderes. Heute lese ich es als etwas anderes, Mr. Harlan.“ Er schiebt
      das Papier über den Tisch. „Morgen vielleicht nicht mehr.“
    en: >-
      Daniel Moss lays the old exercise book beside a settlement. "I have thought a long
      time about whether I read what I wrote about you as evidence or as something else.
      Today I read it as something else, Mr. Harlan." He pushes the paper across the
      desk. "Tomorrow perhaps not."
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_anwaelte, daniel_trost, moss_feind]
  notMarked: [daniel_kalt]
  delay: 3
  certain: true
  choices:
    - id: vergleich
      label: { de: "Den Vergleich annehmen (5.000 $)", en: "Accept the settlement (5,000 $)" }
      result:
        de: Jacob unterschreibt. Daniel nimmt das Heft und den Vergleich und lässt die Tür offen, als er geht.
        en: Jacob signs. Daniel takes the book and the settlement and leaves the door open as he goes.
      effects: { cash: -5000 }
      marks: [daniel_vergleich]
    - id: prozess
      label: { de: "Ablehnen", en: "Refuse" }
      result:
        de: >-
          Daniel nickt. Er reißt eine Seite aus dem Heft, faltet sie und lässt sie auf
          Jacobs Tisch liegen. Es ist die mit der Entschuldigung. Oder die vom Friedhof.
          Jacob liest sie nicht.
        en: >-
          Daniel nods. He tears a page from the book, folds it and leaves it on Jacob's
          desk. It is the one with the apology. Or the one from the cemetery. Jacob does
          not read it.
      effects: { cash: -2000, strength: -10 }
      marks: [daniel_anklage]
      default: true

# Entwurf – Philipp überarbeitet.
# Kein Angebot: Daniel erhebt Anklage (kalte Antworten, Beerdigung verpasst). Fassung ohne Moss-Unrecht –
# die Feind-Fassung mit dem Datum aus Kapitel 1 ist k3_daniel_anklage_feind.
- id: k3_daniel_anklage
  mail: demand
  deadline: 2
  draft: true
  title:
    de: Die Anklageschrift
    en: The Indictment
  text:
    de: >-
      Die Anklageschrift umfasst einundsechzig Seiten. Auf der ersten steht „Bezirk
      Cordova gegen Jacob Harlan“. Auf der letzten, unter Daniels Unterschrift, steht
      nichts weiter, kein Gruß, keine Zeile. Jacob blättert zweimal zurück, um sicher zu
      sein, dass er nichts übersehen hat. Seine Lesebrille liegt seit diesem Jahr neben
      dem Tintenfass.
    en: >-
      The indictment runs to sixty-one pages. The first reads "Cordova County versus
      Jacob Harlan". The last, below Daniel's signature, bears nothing more, no greeting,
      not a line. Jacob leafs back twice to be sure he has missed nothing. Since this
      year his reading glasses have lain beside the inkwell.
  conditions: { minChapter: 3, maxChapter: 3 }
  marked: [daniel_anwaelte]
  notMarked: [moss_feind, daniel_vergleich, daniel_anklage]
  delay: 5
  certain: true
  choices:
    - id: kaempfen
      label: { de: "Kämpfen – die beste Kanzlei aus Hallstead (4.000 $)", en: "Fight – the best firm in Hallstead (4,000 $)" }
      result:
        de: >-
          Die Kanzlei verlangt einen Vorschuss und ein eigenes Büro in Port Ellis. Der
          Prozess wird Jahre dauern. Daniel hat Zeit.
        en: >-
          The firm demands a retainer and its own office in Port Ellis. The trial will
          take years. Daniel has time.
      effects: { cash: -4000, strength: -10, heat: 2, evidence: 1 }
      marks: [daniel_anklage]
      default: true
    - id: einraeumen
      label: { de: "Einen Punkt einräumen und um einen Vergleich bitten (7.000 $)", en: "Admit one count and ask for a settlement (7,000 $)" }
      result:
        de: >-
          Daniel lässt Jacob eine Woche warten. Dann nimmt er an, zu seinen Bedingungen.
          „Sie haben gefragt“, sagt er. „Mein Vater musste damals auch fragen.“
        en: >-
          Daniel makes Jacob wait a week. Then he accepts, on his own terms. "You asked,"
          he says. "My father had to ask too, back then."
      effects: { cash: -7000, strength: -10 }
      marks: [daniel_vergleich]
    - id: verbrennen
      label: { de: "Die Bücher, nach denen er fragt, verbrennen lassen", en: "Have the ledgers he is asking for burned" }
      result:
        de: >-
          Im Hof hinter dem Büro brennt eine Nacht lang ein Feuer. Der Prokurist, der es
          angezündet hat, kündigt am nächsten Morgen. Er weiß jetzt etwas über Jacob, das
          Daniel noch nicht weiß.
        en: >-
          A fire burns all night in the yard behind the office. The clerk who lit it
          resigns the next morning. He now knows something about Jacob that Daniel does
          not yet know.
      effects: { strength: -20, trace: { severity: 3, label: "Bücher verbrannt" }, heat: 3 }
      marks: [daniel_anklage, daniel_beweise_vernichtet]

