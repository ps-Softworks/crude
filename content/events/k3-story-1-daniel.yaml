# Nachwirkung: Moss hat die Farm in Kapitel 1 verloren – er ist schon lange tot.
- id: k3_moss_grab
  title:
    de: Ein Grabstein aus Port Ellis
    en: A Headstone from Port Ellis
  text:
    de: >-
      Der Bezirksstaatsanwalt lässt seinen Vater umbetten. Ezekiel Moss starb vor sechs Jahren bei Verwandten in den Kohleprovinzen, in einer Kammer über einer Futterhandlung. Niemand hat es
      Jacob geschrieben. Jetzt soll er auf den Friedhof von Salt Hill, mit Blick auf
      die Felder, auf denen einmal Baumwolle stand. Der Steinmetz fragt, wer den Stein bezahlt.
    en: >-
      The district attorney is having his father reburied. Ezekiel Moss died six years ago with relatives in the coal provinces, in a room above a feed store. No one wrote to Jacob. Now he is
      to lie in the Salt Hill cemetery, overlooking the fields where cotton once grew.
      The stonemason asks who is paying for the stone.
  conditions: { minChapter: 3, maxChapter: 3, minRound: 6, maxRound: 10 }
  marked: [moss_verloren]
  notMarked: [moss_fair, moss_feind]
  certain: true
  choices:
    - id: stein
      label: { de: "Den Stein bezahlen, ohne Namen (600 $)", en: "Pay for the stone, anonymously (600 $)" }
      result:
        de: >-
          Der Steinmetz hält dicht, eine Woche lang. Dann weiß es ganz Salt Hill. Daniel
          schickt den Betrag zurück, auf den Cent genau, und eine Zeile: „Wir kommen zurecht.“
        en: >-
          The stonemason keeps quiet for a week. Then all of Salt Hill knows. Daniel sends
          the sum back, to the cent, with one line: "We manage."
      requires: { minCash: 600 }
      effects: { cash: -600 }
    - id: hingehen
      label: { de: "Zur Umbettung gehen", en: "Attend the reburial" }
      result:
        de: >-
          Es sind sieben Leute da. Daniel bemerkt Jacob erst am Ende. „Sie kannten ihn
          kaum“, sagt er. „Doch“, sagt Jacob. „Ich habe Nein zu ihm gesagt.“
        en: >-
          Seven people are there. Daniel notices Jacob only at the end. "You hardly knew
          him," he says. "I did," says Jacob. "I told him no."
      effects: { strength: -10 }
      appointments: 2
      marks: [daniel_trost]
    - id: nichts
      label: { de: "Es nicht zu seiner Sache machen", en: "Not make it his business" }
      result:
        de: Jacob liest die Anzeige im Ledger und blättert weiter. Am Abend liest er sie noch einmal.
        en: Jacob reads the notice in the Ledger and turns the page. In the evening he reads it again.
      default: true

# Entwurf – Philipp überarbeitet.
# Die Akte – Fassung Moss: Daniel hat das Papier von damals (Betrug oder Versteigerung).
- id: k3_daniel_akte_moss
  visitor: daniel
  draft: true
  title:
    de: Die Akte Moss
    en: The Moss File
  text:
    de: >-
      Daniel Moss legt einen Aktendeckel auf Jacobs Tisch. Darin: der Zuschlag der
      Versteigerung, bei der sein Vater die Farm verlor, und wer an diesem Tag geboten hat.
      Dazu drei Aussagen von Nachbarn, beglaubigt. „Ich
      klage noch nicht an, Mr. Harlan. Ich frage zuerst. So hat mein Vater es mir
      beigebracht.“
    en: >-
      Daniel Moss lays a folder on Jacob's desk. Inside: the auction award by which his
      father lost the farm, and who bid that day. With it, three statements from
      neighbours, notarised. "I am not charging you yet, Mr.
      Harlan. I am asking first. That is how my father taught me."
  conditions: { minChapter: 3, maxChapter: 3, minRound: 5 }
  marked: [moss_feind]
  notMarked: [moss_betrogen]   # 0.4.19+3: Versteigerung (moss_vertrieben); der Vertrag (moss_betrogen) → k3_daniel_akte_moss_vertrag
  certain: true
  choices:
    - id: kooperieren
      label: { de: "Kooperieren: alle Unterlagen, alle Zeugen", en: "Cooperate: every paper, every witness" }
      result:
        de: >-
          Zwei Monate lang sitzen Daniels Leute in Jacobs Archiv. Die Prüfer legen drei
          Bohrstellen still, bis die Grenzen neu vermessen sind. Daniel sagt zum Schluss:
          „Damit habe ich nicht gerechnet.“ Er klingt fast enttäuscht.
        en: >-
          For two months Daniel's people sit in Jacob's archive. The inspectors shut three
          well sites until the boundaries are re-surveyed. At the end Daniel says, "I did
          not expect that." He sounds almost disappointed.
      effects: { production: -0.15, cash: -1000, evidence: -1, heat: -2 }
      marks: [daniel_kooperation_moss]
    - id: anwaelte
      label: { de: "Die Anwälte antworten lassen (1.500 $)", en: "Let the lawyers answer (1,500 $)" }
      result:
        de: >-
          Die Kanzlei aus Hallstead schickt einen Herrn mit drei Koffern. Daniel empfängt
          ihn höflich und notiert, wie viele Stunden er abrechnet.
        en: >-
          The firm from Hallstead sends a gentleman with three trunks. Daniel receives him
          politely and notes how many hours he bills.
      effects: { cash: -1500, evidence: 1 }
      marks: [daniel_anwaelte]
      default: true
    - id: bestechen
      label: { de: "Ihm einen Umschlag anbieten (3.000 $)", en: "Offer him an envelope (3,000 $)" }
      result:
        de: >-
          Daniel öffnet den Umschlag nicht. Er lässt ihn von seinem Gehilfen in eine
          Beweismitteltüte legen, beschriften und versiegeln. „Danke“, sagt er. „Das
          spart mir ein Jahr.“
        en: >-
          Daniel does not open the envelope. He has his clerk place it in an evidence bag,
          label it and seal it. "Thank you," he says. "That saves me a year."
      requires: { minCash: 3000 }
      effects: { cash: -3000, heat: 3, trace: { severity: 3, label: "Umschlag an den Staatsanwalt" } }
      marks: [daniel_bestechung_versuch]
    - id: wegloben
      label: { de: "Ihn über Senator Grady ins Richteramt loben (5.000 $)", en: "Have Senator Grady promote him to the bench (5,000 $)" }
      result:
        de: >-
          Drei Monate später ist Daniel Moss Richter in Hallstead, jünger als jeder vor
          ihm. Sein Nachfolger ist ein freundlicher Mann, der gern Zigarren nimmt.
        en: >-
          Three months later Daniel Moss is a judge in Hallstead, younger than anyone
          before him. His successor is a friendly man who likes to accept cigars.
      requires: { minCash: 5000 }
      effects: { cash: -5000, favors: -3 }
      marks: [daniel_weggelobt]

