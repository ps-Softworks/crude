# Kapitel 3 – Alltag, Paket 4: Seismik und Konsortium (Phase 4). Entwurf – Philipp überarbeitet.
# Grundlage: Story-Bibel §9 (K3 Thema 4: Dr. Hale, Messtrupp, Quoten im Alltag, Ashcombe),
# §8 (hale_* → Dr. Hale und Seismik), GDD §5 (Reflexionsseismik, Technikstufe III, braucht
# Spezialtrupp; Patente und Lizenzen), §9.2 (Sir Reginald Ashcombe – Royal Aldmark Petroleum,
# ab Kapitel 5: hier nur als Vorschau), Weltbibel (Mr. Vale, das Konsortium).
#
# Nur Kapitel 3 (minChapter/maxChapter 3). Seit 4.19 wirken Seismik (seismik: +1 Lizenz bzw.
# Trupp, −1 Trupp weniger) und Konsortium (consortium: Vales Vertrauen, Macht) als Systemwirkungen.
#
# Merkzeichen aus Kapitel 1: hale_beteiligt, hale_gutachten_falsch (Dr. L. Hales Gutachten am
# Cedar Creek – echt oder gefälscht).
# Merkzeichen dieses Pakets:
#   k3_seismik_hale → k3_seismik_ergebnis
#   k3_seismik_verkauft, k3_quote_eingehalten, k3_quote_ignoriert, k3_ashcombe_kontakt
#     → content/relevance.yaml (Konsortium / Mr. Vales Einladung, Kapitel 4–5)

- id: k3_messtrupp
  title:
    de: Dynamit auf der Weide
    en: Dynamite in the Pasture
  text:
    de: >-
      Ein Messtrupp hat auf einer Weide der Hollins-Prärie Ladungen gezündet, um die
      Schichten abzuhören. Drei trächtige Kühe haben verkalbt. Der Rancher steht mit
      einer Schrotflinte am Zaun und lässt keinen Wagen mehr durch. Er ist so alt, wie
      Ezekiel Moss war, als Jacob nach Cordova kam, und genauso stur.
    en: >-
      A survey crew set off charges in a Hollins Prairie pasture to listen to the strata.
      Three pregnant cows lost their calves. The rancher stands at the fence with a
      shotgun and lets no more wagons through. He is as old as Ezekiel Moss was when
      Jacob came to Cordova, and just as stubborn.
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.25
  choices:
    - id: entschaedigen
      label: { de: "Die Kühe dreifach bezahlen und sich entschuldigen (1.500 $)", en: "Pay three times for the cows and apologise (1,500 $)" }
      result:
        de: Der Rancher nimmt das Geld und lässt den Trupp weitermessen, wenn er vorher Bescheid bekommt. Seine Nachbarn hören davon.
        en: The rancher takes the money and lets the crew keep surveying if he is told beforehand. His neighbours hear of it.
      requires: { minCash: 1500 }
      effects: { cash: -1500, leaseCost: -0.1, reputation: { public: 1 } }
    - id: sheriff
      label: { de: "Den Sheriff schicken – die Messrechte sind bezahlt", en: "Send the sheriff – the survey rights are paid for" }
      result:
        de: Der Sheriff nimmt dem Alten die Flinte ab. Die Messungen gehen weiter. Auf der ganzen Prärie verlangen die Rancher jetzt das Doppelte für jede Pacht.
        en: The sheriff takes the old man's shotgun. The surveying continues. All over the prairie the ranchers now ask double for every lease.
      effects: { leaseCost: 0.25, strength: -5, reputation: { public: -2 } }
      default: true
    - id: abziehen
      label: { de: "Den Trupp abziehen", en: "Withdraw the crew" }
      result:
        de: Die Weide bleibt ungemessen. Die Linien auf Hales Karte haben jetzt ein weißes Loch, genau dort, wo sie interessant werden.
        en: The pasture stays unsurveyed. The lines on the map now have a white hole, exactly where they get interesting.
      effects: { seismik: -1 }

- id: k3_quoten
  mail: info
  title:
    de: Ein Rundschreiben ohne Absender
    en: A Circular without a Sender
  text:
    de: >-
      Gutes Papier, kein Briefkopf, keine Unterschrift. Das Rundschreiben „empfiehlt den
      großen Förderern der Föderation“, im kommenden Jahr ein Zehntel weniger zu fördern,
      „im Interesse stabiler Verhältnisse“. Darunter eine Tabelle: wer wie viel. Harlans
      Zeile ist genau ausgefüllt, genauer als Jacobs eigene Bücher.
    en: >-
      Good paper, no letterhead, no signature. The circular "recommends to the great
      producers of the Federation" that they produce a tenth less next year, "in the
      interest of stable conditions". Below, a table: who, how much. Harlan's line is
      filled in exactly, more exactly than Jacob's own books.
  conditions: { minChapter: 3, maxChapter: 3 }
  chance: 0.3
  choices:
    - id: einhalten
      label: { de: "Ein Zehntel weniger fördern", en: "Produce a tenth less" }
      result:
        de: Harlan fördert weniger, die anderen auch. Der Preis steigt, still und gleichmäßig, als hätte ihn jemand an einer Schnur gezogen.
        en: Harlan produces less, so do the others. The price rises, quietly and evenly, as if someone had pulled it on a string.
      effects: { price: 0.25, consortium: { power: 5 } }
      marks: [k3_quote_eingehalten]
    - id: ignorieren
      label: { de: "Mehr fördern, solange die anderen sparen", en: "Produce more while the others hold back" }
      result:
        de: Harlan verkauft in die Lücke, die die anderen lassen. Drei Monate lang. Dann liegt ein zweites Rundschreiben auf dem Tisch, nur mit Harlans Zeile, rot unterstrichen.
        en: Harlan sells into the gap the others leave. For three months. Then a second circular lies on the desk, with only Harlan's line, underlined in red.
      effects: { production: 0.15, consortium: { trust: -10 }, rival: { bullard: { grudge: 5 }, thorne: { grudge: 5 }, crane: { grudge: 5 } } }
      marks: [k3_quote_ignoriert]
      default: true

- id: k3_ashcombe_brief
  mail: offer
  title:
    de: Ein Angebot aus Aldmark
    en: An Offer from Aldmark
  text:
    de: >-
      Ein Brief mit dem Wappen der Royal Aldmark Petroleum, unterschrieben von einem
      Sekretär im Auftrag von Sir Reginald Ashcombe. Die Kaiserliche Flotte stellt auf
      Öl um und sucht einen zweiten Lieferanten außerhalb des Reichs, „zur Sicherheit“.
      Zehn Jahre, fester Preis. Das Angebot ist großzügig. Varenhold wird davon lesen.
    en: >-
      A letter bearing the crest of Royal Aldmark Petroleum, signed by a secretary on
      behalf of Sir Reginald Ashcombe. The Imperial Fleet is converting to oil and seeks
      a second supplier outside the empire, "for security". Ten years, fixed price. The
      offer is generous. Varenhold will read of it.
  conditions: { minChapter: 3, maxChapter: 3, minOilStock: 2000 }
  chance: 0.2
  choices:
    - id: liefern
      label: { de: "Liefern – 2.000 Barrel als erste Ladung (+3.200 $)", en: "Supply – 2,000 barrels as first cargo (+3,200 $)" }
      result:
        de: Ein Tanker unter aldmärkischer Flagge legt in Port Ellis an. Die Matrosen sprechen eine Sprache, die die Hafenarbeiter nicht verstehen. Das Geld verstehen alle.
        en: A tanker under the Aldmark flag docks at Port Ellis. The sailors speak a language the dockers don't understand. Everyone understands the money.
      requires: { minOilStock: 2000 }
      effects: { oilStock: -2000, cash: 3200, tension: 3, consortium: { power: -3 } }
      marks: [k3_ashcombe_kontakt]
    - id: ablehnen
      label: { de: "„Westmärkisches Öl bleibt in Westmark.“", en: "\"Westmark oil stays in Westmark.\"" }
      result:
        de: Der Sekretär bedankt sich in drei Zeilen. Den Vertrag bekommt Harold Pruett. Die Handelskammer in Hallstead nennt Jacob einen Patrioten. Es bringt nichts ein.
        en: The secretary thanks him in three lines. Harold Pruett gets the contract. The Hallstead chamber of commerce calls Jacob a patriot. It earns nothing.
      appointments: 0
      default: true
