# Kapitel 1 – feste Termine (2.3). Entwurf von Claude, bitte in eigener Stimme umschreiben.
# Feste Termine (routine: true) werden nicht gewürfelt: Sie stehen jede Runde im
# Terminkalender, solange die Bedingungen stimmen, und kosten Termine
# (appointments). Bleibt einer liegen, passiert nichts. Zusammen mit den Ereignissen
# gibt es mehr zu tun, als 5 Termine hergeben – Jacob muss wählen oder Überstunden
# machen (kosten Kraft). Zahlen sind Platzhalter.

- id: termin_ruth
  routine: true
  appointments: 1
  notMarked: [thomas_geboren]   # nach der Geburt: termin_familie
  title:
    de: Ein Abend mit Ruth
    en: An Evening with Ruth
  text:
    de: >-
      Ruth hat Kaffee aufgesetzt und den Stuhl ans Fenster der Pension gerückt.
      Das Kind tritt, sagt sie, und legt Jacobs Hand auf ihren Bauch.
    en: >-
      Ruth has put the coffee on and pulled the chair up to the boarding-house
      window. The baby is kicking, she says, and puts Jacob's hand on her belly.
  choices:
    - id: bleiben
      label: { de: "Den Abend bei ihr bleiben", en: "Stay the evening with her" }
      result:
        de: Jacob schläft zum ersten Mal seit Wochen, ohne vom Bohrseil zu träumen.
        en: For the first time in weeks, Jacob sleeps without dreaming of the drilling cable.
      # Familienzeit (2.7): Die Kraft kommt am Rundenende, +3 bis +8 je nach Beziehung.
      effects: { ruth: 6 }

- id: termin_familie
  conditions: { maxThomasAge: 3 }   # 4.5: Abend mit dem Kleinkind; ab Kapitel 2 gilt termin_familie_k2
  routine: true
  appointments: 1
  marked: [thomas_geboren]
  delay: 0
  title:
    de: Ein Abend zu dritt
    en: An Evening for Three
  text:
    de: >-
      Thomas schreit, bis Jacob ihn nimmt, und schläft dann auf seiner Brust ein,
      als hätte er nie etwas anderes gewollt. Ruth lacht zum ersten Mal seit Tagen.
    en: >-
      Thomas screams until Jacob picks him up, then falls asleep on his chest as if
      he had never wanted anything else. Ruth laughs for the first time in days.
  choices:
    - id: bleiben
      label: { de: "Den Abend bei Ruth und Thomas bleiben", en: "Stay the evening with Ruth and Thomas" }
      result:
        de: Jacob sitzt bis spät im Schaukelstuhl, das Kind auf dem Arm. Das Bohrseil kann warten.
        en: Jacob sits late in the rocking chair with the child in his arms. The drilling cable can wait.
      # Familienzeit (2.7): Die Kraft kommt am Rundenende, +3 bis +8 je nach Beziehung.
      effects: { ruth: 5, thomas: 6 }

- id: termin_familie_k2
  routine: true
  appointments: 1
  draft: true                # 4.5: Familienabend ab Kapitel 2 – Thomas ist ein Schuljunge, Clara klein
  marked: [thomas_geboren]
  delay: 0
  conditions: { minChapter: 2, maxChapter: 2, minThomasAge: 4 }   # nur Kapitel 2 (Kapitel-1-Ereignisse ohne minChapter kommen nur in Kapitel 1; in Kapitel 3 ist Thomas erwachsen)
  title:
    de: Ein Abend mit den Kindern
    en: An Evening with the Children
  text:
    de: >-
      Thomas will Jacob am Küchentisch seine Rechenaufgaben zeigen, und Clara will
      auf den Schoß, sobald jemand sitzt. Ruth hält Jacob den Teller warm.
    en: >-
      Thomas wants to show Jacob his sums at the kitchen table, and Clara wants a lap
      the moment anyone sits down. Ruth keeps Jacob's plate warm.
  choices:
    - id: bleiben
      label: { de: "Den Abend zu Hause bleiben", en: "Stay home for the evening" }
      result:
        de: Jacob rechnet mit Thomas, bis Clara auf seinem Arm einschläft. Die Post bleibt bis morgen liegen.
        en: Jacob does sums with Thomas until Clara falls asleep in his arms. The mail waits until morning.
      # Familienzeit (2.7, 4.5): Ruth und beide Kinder; clara wirkt erst ab Claras Geburt.
      effects: { ruth: 5, thomas: 6, clara: 6 }

- id: termin_familie_k3
  routine: true
  appointments: 1
  draft: true                # 0.4.19+3: Sonntagsessen in Kapitel 3 – vorher gab es dort keine Familienkarte mehr
  marked: [thomas_geboren]
  notMarked: [ehe_trennung]
  delay: 0
  conditions: { minChapter: 3, maxChapter: 3 }
  title:
    de: Sonntagsessen
    en: Sunday Dinner
  text:
    de: >-
      Ruth hat den großen Tisch decken lassen, obwohl sie nur zu viert sind. Thomas kommt
      mit Stiefeln, die nach Feld riechen, Clara mit einem Buch, das sie unter dem Tisch
      weiterliest. Für einen Abend fragt niemand nach dem Kurs.
    en: >-
      Ruth has had the big table laid, though there are only four of them. Thomas comes in
      boots that smell of the fields, Clara with a book she goes on reading under the table.
      For one evening nobody asks about the share price.
  choices:
    - id: bleiben
      label: { de: "Den Sonntag mit der Familie verbringen", en: "Spend Sunday with the family" }
      result:
        de: Thomas und Clara streiten über Automobile, Ruth schlichtet, und Jacob merkt erst beim Kaffee, dass er den ganzen Abend nicht an Hallstead gedacht hat.
        en: Thomas and Clara argue about automobiles, Ruth makes peace, and only over coffee does Jacob notice he hasn't thought about Hallstead all evening.
      # Familienzeit (GDD §4: wichtigste Kraftquelle) – Ruth und beide Kinder.
      effects: { ruth: 5, thomas: 5, clara: 6, strength: 4 }

- id: termin_kinder_k3
  routine: true
  appointments: 1
  draft: true                # 0.4.19+3: nach der Trennung – die Kinder kommen sonntags allein
  marked: [ehe_trennung]
  delay: 0
  conditions: { minChapter: 3, maxChapter: 3 }
  title:
    de: Sonntag mit den Kindern
    en: Sunday with the Children
  text:
    de: >-
      Seit Ruth ausgezogen ist, kommen Thomas und Clara sonntags zum Essen, abwechselnd
      pünktlich. Der große Tisch ist zu groß. Sie sitzen an einem Ende.
    en: >-
      Since Ruth moved out, Thomas and Clara come to dinner on Sundays, taking turns at being
      on time. The big table is too big. They sit at one end of it.
  choices:
    - id: bleiben
      label: { de: "Den Sonntag mit den Kindern verbringen", en: "Spend Sunday with the children" }
      result:
        de: Clara erzählt von der Schule, Thomas von den Türmen. Von Ruth erzählt keiner. Beim Abschied sagt Clara, Mama lasse grüßen. Jacob weiß nicht, ob das stimmt.
        en: Clara talks about school, Thomas about the derricks. Nobody talks about Ruth. As she leaves, Clara says Mama sends her regards. Jacob doesn't know if that's true.
      effects: { thomas: 5, clara: 7, strength: 2 }

- id: termin_sonntag
  routine: true
  appointments: 2
  title:
    de: Ein Sonntag am Fluss
    en: A Sunday by the River
  text:
    de: >-
      Die Türme stehen sonntags still, nur die Pumpen nicht. Am Cordova-Fluss
      angeln die Kinder der Bohrleute, und niemand will etwas von Jacob.
    en: >-
      The derricks stand still on Sundays, only the pumps don't. By the Cordova
      river the drillers' children are fishing, and nobody wants anything from Jacob.
  choices:
    - id: ausspannen
      label: { de: "Einen ganzen Tag ausspannen", en: "Take a whole day off" }
      result:
        de: Jacob kommt mit Sonnenbrand und leerem Kopf zurück.
        en: Jacob comes back sunburnt and with an empty head.
      effects: { strength: 15 }

- id: termin_lohnbohren
  routine: true
  appointments: 2
  title:
    de: Auf fremden Türmen aushelfen
    en: Hiring Out on Other Rigs
  text:
    de: >-
      Solange die eigene Quelle nichts gibt, zahlen die Nachbarn gut für einen
      Mann, der ein Bohrseil führen kann. Die Arbeit ist hart, das Geld bar.
    en: >-
      As long as his own well gives nothing, the neighbours pay well for a man
      who can work a drilling cable. The work is hard, the money is cash.
  conditions: { maxProducingWells: 0 }
  choices:
    - id: anheuern
      label: { de: "Zwei Tage für einen Nachbarn bohren (+120 $)", en: "Drill two days for a neighbour (+120 $)" }
      result:
        de: Jacob bringt 120 $ und Blasen an beiden Händen nach Hause.
        en: Jacob brings home 120 $ and blisters on both hands.
      effects: { cash: 120, strength: -3 }
      fixedCash: true

- id: termin_rundgang
  routine: true
  appointments: 2
  title:
    de: Rundgang an den Quellen
    en: Walking the Wells
  text:
    de: >-
      Silas meint, an den Leitungen tropft es. Wer selbst hinsieht, findet die
      Lecks, bevor das Öl im Boden versickert.
    en: >-
      Silas reckons the lines are dripping. A man who looks for himself finds the
      leaks before the oil soaks into the ground.
  conditions: { minProducingWells: 1 }
  choices:
    - id: abgehen
      label: { de: "Mit Silas die Leitungen abgehen", en: "Walk the lines with Silas" }
      result:
        de: Drei Lecks geflickt – 40 Barrel, die sonst im Boden versickert wären.
        en: Three leaks patched – 40 barrels that would otherwise have soaked away.
      effects: { oilStock: 40, strength: -3 }

# termin_port_ellis (Reise nach Port Ellis, um den Bahntarif feilschen) entfällt mit dem Planungsbrett
# (Termine als Hauptwerkzeug, Etappe 1); mit Thorne verhandelt Jacob in Etappe 2 über die Karte „Bei Thorne vorsprechen“.
