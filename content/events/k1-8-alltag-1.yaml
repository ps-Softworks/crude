# Kapitel 1 – Alltag, Paket 1: die Bohrstelle (2.10a, Ereignisse 1–10). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Ton: Weltbibel, GDD §13 Kapitel 1 (Salt Hill, Seilschlag,
# Bohrtrupp, Brände).
#
# Wiederholungsschutz (2.10a):
#   once: false   = darf wiederkommen, frühestens nach cooldown Runden (Standard events.repeatCooldown)
#   group: name   = Varianten eines wiederkehrenden Ereignisses halten gemeinsam Abstand –
#                   nach einer Bohrpanne kommt so schnell keine zweite, egal welche.
#   draft: true   = Schlüsselszene, Entwurf – Philipp soll sie sich ansehen.

# --- Bohrpanne (Etappe 3: drei Varianten zu einer zusammengelegt, höchstens einmal in 4 Runden) ---

- id: panne_meissel
  once: false
  cooldown: 4
  title:
    de: Der Meißel ist ab
    en: The Bit Has Snapped
  text:
    de: >-
      Ein Junge vom Bohrtrupp kommt gerannt, die Mütze in der Hand. Der Meißel
      ist auf vierhundert Fuß abgebrochen und steckt im Loch. Der Schmied in
      Port Ellis hat einen neuen, sagt er, aber nicht billig.
    en: >-
      A boy from the drilling crew comes running, cap in hand. The bit snapped
      at four hundred feet and is stuck in the hole. The smith in Port Ellis has
      a new one, he says, but not cheap.
  conditions: { minLeases: 1 }
  chance: 0.08
  choices:
    - id: neu
      label: { de: "Einen neuen Meißel kaufen (220 $)", en: "Buy a new bit (220 $)" }
      result:
        de: Der neue Meißel ist blank und schwer. Am Abend schlägt der Turm wieder.
        en: The new bit is bright and heavy. By evening the derrick is pounding again.
      requires: { minCash: 220 }
      effects: { cash: -220 }
      appointments: 0
    - id: schmieden
      label: { de: "Selbst hinfahren und den alten schweißen lassen (40 $)", en: "Ride out and have the old one welded (40 $)" }
      result:
        de: Jacob steht den halben Tag neben der Esse. Der Meißel hält, die Schultern tun weh.
        en: Jacob stands half the day beside the forge. The bit holds; his shoulders ache.
      requires: { minCash: 40 }
      effects: { cash: -40, strength: -4 }
      appointments: 2
    - id: warten
      label: { de: "Den Trupp warten lassen", en: "Let the crew wait" }
      result:
        de: "Der Trupp sitzt drei Tage im Schatten und wird trotzdem bezahlt, an den Pumpen fehlen die Hände. Am Ende kauft der Vorarbeiter den Meißel – teurer."
        en: "The crew sits three days in the shade and gets paid anyway, and hands are missing at the pumps. In the end the foreman buys the bit – dearer."
      effects: { cash: -100, production: -0.1 }
      appointments: 0
      default: true

# Etappe 3: „Der Trupp will den Sonntag“ ist hier hineingelegt. Gruppe trupp (mit dem Streik): höchstens einmal in 4 Runden.
- id: trupp_lohn
  group: trupp
  once: false
  cooldown: 4
  title:
    de: Der Trupp will mehr
    en: The Crew Wants More
  text:
    de: >-
      Der Vorarbeiter, ein breiter Mann namens Hollister, steht mit dem Hut auf
      dem Kopf in der Tür. Bei Bullard zahle man fünfzig Cent mehr am Tag. Und
      seit Bruder Abel am Hafen predigt, wollen die Männer sonntags nicht mehr an
      den Turm. Die Männer seien zufrieden, sagt er. Noch.
    en: >-
      The foreman, a broad man named Hollister, stands in the doorway with his hat
      still on. At Bullard's they pay fifty cents more a day. And since Brother Abel
      started preaching at the harbour, the men won't come to the derrick on
      Sundays. The men are content, he says. For now.
  conditions: { minLeases: 1, minRound: 2 }
  chance: 0.08
  choices:
    - id: zahlen
      label: { de: "Den Lohn erhöhen (150 $)", en: "Raise the wages (150 $)" }
      result:
        de: "Hollister nickt und nimmt endlich den Hut ab. Die Männer arbeiten, als ginge es um ihr eigenes Öl."
        en: "Hollister nods and finally takes off his hat. The men work as if it were their own oil."
      requires: { minCash: 150 }
      effects: { cash: -150, production: 0.1 }
      appointments: 0
    - id: sonntag
      label: { de: "Den Sonntag geben", en: "Give them Sunday" }
      result:
        de: Sonntags steht der Turm still, und der Lohn bleibt gleich. Am Montag arbeiten die Männer, als hätten sie etwas zu beweisen.
        en: On Sundays the derrick stands still and the wages stay the same. On Monday the men work as if they had something to prove.
      effects: { cash: -60, strength: 2, production: 0.05 }
    - id: reden
      label: { de: "Mit den Männern am Feuer reden", en: "Talk to the men by the fire" }
      result:
        de: Jacob erzählt von der Grube, in der sein Vater alt wurde. Die Männer bleiben – für diesmal und für ein Fass Bier.
        en: Jacob tells them about the pit where his father grew old. The men stay – this time, and for a barrel of beer.
      effects: { cash: -30, strength: -3, production: 0.05 }
      requires: { minCash: 30 }
      sharp: true              # beste Antwort (2.7): fehlt, wenn Jacob erschöpft ist
    - id: nein
      label: { de: "Sieben Tage, wie überall – und kein Cent mehr", en: "Seven days, like everywhere – and not a cent more" }
      result:
        de: "Hollister setzt den Hut auf und geht. Am Montag fehlen drei Männer, am Turm wird weniger gesungen."
        en: "Hollister puts his hat on and leaves. On Monday three men are missing, and there is less singing at the derrick."
      effects: { production: -0.1 }
      marks: [trupp_unmut]
      appointments: 0
      default: true

- id: trupp_unfall
  title:
    de: Ein Mann vom Turm
    en: A Man Off the Derrick
  text:
    de: >-
      Der junge Eli Ward ist von der Plattform gefallen, zwanzig Fuß. Er lebt,
      aber das Bein steht falsch. Der Wundarzt will Geld im Voraus, und Elis Mutter
      wohnt drei Tagesreisen weit weg.
    en: >-
      Young Eli Ward fell from the platform, twenty feet. He's alive, but his leg
      sits wrong. The surgeon wants money up front, and Eli's mother lives three
      days' journey away.
  conditions: { minLeases: 1, minRound: 4 }
  chance: 0.08
  choices:
    - id: arzt
      label: { de: "Den Arzt bezahlen und Eli Lohn weiterzahlen (200 $)", en: "Pay the doctor and keep Eli on wages (200 $)" }
      result:
        de: Eli humpelt nach sechs Wochen wieder ins Lager und kocht jetzt für den Trupp. Er kocht schlecht, aber niemand sagt es.
        en: After six weeks Eli limps back into camp and now cooks for the crew. He cooks badly, but nobody says so.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [eli_versorgt]
    - id: arzt_nur
      label: { de: "Nur den Arzt bezahlen (100 $)", en: "Pay only the doctor (100 $)" }
      result:
        de: Das Bein wird gerichtet. Eli fährt mit dem nächsten Wagen nach Hause.
        en: The leg is set. Eli rides home on the next wagon.
      requires: { minCash: 100 }
      effects: { cash: -100 }
      appointments: 0
    - id: nichts
      label: { de: "Das ist Sache des Trupps", en: "That's the crew's business" }
      result:
        de: Die Männer legen zusammen. Hollister sieht Jacob danach eine Woche lang nicht an.
        en: The men pass the hat. Hollister doesn't look at Jacob for a week.
      effects: { strength: -4 }
      appointments: 0
      default: true
      marks: [eli_im_stich]

# --- Die Quelle ------------------------------------------------------------------

- id: quelle_salzwasser
  title:
    de: Salz im Öl
    en: Salt in the Oil
  text:
    de: >-
      Das Öl aus Jacobs Quelle schmeckt nach Meer. Im Fass setzt sich unten Wasser
      ab, grau und salzig. Der Händler am Hafen hat es auch gemerkt und will den
      Preis drücken.
    en: >-
      The oil from Jacob's well tastes of the sea. Water settles at the bottom of
      the barrel, grey and salty. The dealer at the harbour has noticed too and
      wants to knock down the price.
  conditions: { minProducingWells: 1, minRound: 4 }
  chance: 0.1
  choices:
    - id: absetzen
      label: { de: "Absetztanks bauen lassen (150 $)", en: "Have settling tanks built (150 $)" }
      result:
        de: "In zwei Holztanks setzt sich das Wasser ab. Der Händler riecht am Öl und sagt nichts mehr. Für sauberes Öl zahlt der Trust ein paar Cent mehr."
        en: "The water settles out in two wooden tanks. The dealer sniffs the oil and says no more. For clean oil the Trust pays a few cents more."
      requires: { minCash: 150 }
      effects: { cash: -150, price: 0.03 }
    - id: mischen
      label: { de: "Das Wasser unters Öl mischen und verkaufen", en: "Mix the water in and sell it" }
      result:
        de: "Es geht durch – diesmal, und bringt 150 $ extra. Der Händler schreibt sich Jacobs Namen in ein kleines schwarzes Buch; die nächsten Monate prüft der Trust jedes Fass und zieht ab."
        en: "It goes through – this time, and brings in 150 $ extra. The dealer writes Jacob's name in a little black book; for months the Trust tests every barrel and docks him."
      effects: { cash: 150, price: -0.05 }
      appointments: 0
    - id: hinnehmen
      label: { de: "Den Abschlag hinnehmen", en: "Accept the discount" }
      result:
        de: Der Händler zahlt weniger und lächelt dabei.
        en: The dealer pays less and smiles while he does.
      effects: { cash: -80, oilStock: -50 }
      appointments: 0
      default: true

- id: quelle_gas
  title:
    de: Gas am Bohrloch
    en: Gas at the Wellhead
  text:
    de: >-
      Am Bohrloch riecht es süßlich, und die Männer bekommen Kopfweh. Silas
      verbietet jede Pfeife im Umkreis von hundert Schritt. Eine Laterne am
      falschen Ort, sagt er, und Salt Hill hat einen Turm weniger.
    en: >-
      It smells sweetish at the wellhead and the men get headaches. Silas forbids
      every pipe within a hundred paces. One lantern in the wrong place, he says,
      and Salt Hill has one derrick fewer.
  conditions: { minProducingWells: 1 }
  chance: 0.08
  choices:
    - id: ableiten
      label: { de: "Ein Rohr legen und das Gas unter den Kessel leiten (120 $)", en: "Lay a pipe and lead the gas under the boiler (120 $)" }
      result:
        de: "Silas leitet das Gas unter den Kessel. Die Pumpe läuft Tag und Nacht, ohne ein Scheit Holz, und nachts brennt eine gelbe Flamme über dem Feld."
        en: "Silas leads the gas under the boiler. The pump runs day and night without a stick of wood, and at night a yellow flame burns over the field."
      requires: { minCash: 120 }
      effects: { cash: -120, production: 0.1 }
    - id: wache
      label: { de: "Selbst Nachtwache halten", en: "Stand night watch yourself" }
      result:
        de: Jacob sitzt drei Nächte im Dunkeln neben dem Bohrloch. Nichts passiert. Er schläft im Sattel ein.
        en: Jacob sits three nights in the dark beside the wellhead. Nothing happens. He falls asleep in the saddle.
      effects: { strength: -7 }
      appointments: 2
    - id: ignorieren
      label: { de: "Den Männern sagen, sie sollen aufpassen", en: "Tell the men to be careful" }
      result:
        de: Ein Mann zündet sich doch eine an. Die Stichflamme versengt den Turm; die Reparatur dauert eine Woche.
        en: One man lights up anyway. The flash scorches the derrick; repairs take a week.
      effects: { cash: -180, oilStock: -100, strength: -3 }
      appointments: 0
      default: true

- id: brand_nachbar
  tableau: true
  draft: true                # Schlüsselszene: erster Feldbrand am Salt Hill (GDD §13)
  title:
    de: Feuer am Salt Hill
    en: Fire on Salt Hill
  text:
    de: >-
      In der Nacht steht der Himmel über Salt Hill rot. Ein Turm von Bullard brennt,
      und der Wind dreht auf Jacobs Parzellen. Bullards Männer schreien nach jedem,
      der eine Schaufel halten kann.
    en: >-
      In the night the sky over Salt Hill turns red. One of Bullard's derricks is
      burning, and the wind is turning towards Jacob's parcels. Bullard's men are
      shouting for anyone who can hold a shovel.
  conditions: { minLeases: 1, minRound: 3 }
  chance: 0.06
  choices:
    - id: helfen
      public: [press_praise]
      label: { de: "Den ganzen Trupp zum Löschen schicken", en: "Send the whole crew to fight the fire" }
      result:
        de: Bis zum Morgen werfen Jacobs Männer Erde ins Feuer. Bullard steht rußschwarz daneben und gibt Jacob wortlos die Hand.
        en: Until dawn Jacob's men throw earth on the fire. Bullard stands by, black with soot, and shakes Jacob's hand without a word.
      effects: { strength: -6 }
      appointments: 2
      marks: [brand_geholfen]
    - id: graben
      label: { de: "Einen Graben um die eigenen Türme ziehen", en: "Dig a trench around your own derricks" }
      result:
        de: Jacobs Türme bleiben stehen. Bullards brennt bis auf die Grundmauern. Am Morgen weiß jeder am Hügel, wo Jacob gestanden hat. Ein paar Fässer am Rand verbrennen trotzdem.
        en: Jacob's derricks stand. Bullard's burns to the ground. By morning everyone on the hill knows where Jacob stood. A few barrels at the edge burn all the same.
      effects: { strength: -4, oilStock: -60 }
    - id: schlafen
      public: [field_fire]
      label: { de: "Das ist Bullards Feuer", en: "That's Bullard's fire" }
      result:
        de: Das Feuer springt auf Jacobs Öltank über. Bullards Männer sehen zu.
        en: The fire leaps to Jacob's oil tank. Bullard's men watch.
      effects: { oilStock: -200, cash: -150 }
      appointments: 0
      default: true
