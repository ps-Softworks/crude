# Kapitel 1 – Preis-Aktionen (Termine als Hauptwerkzeug, Etappe 2). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Vorlage und Erklärung: docs/ereignis-vorlage.md
#
# Die Aktionen selbst sind Karten auf dem Planungsbrett (Reiter Markt, Texte in content/plans.yaml,
# Regeln in src/sim/pricing.ts). Hier stehen die Briefe, die darauf antworten.
# Merkzeichen, die die Simulation setzt (PRICING_MARKS):
#   foerderbremse         Jacob hat eine Förderbremse gegründet
#   kartell_verdacht      ein Mitglied fördert heimlich voll (die Simulation löscht es nach zwei Runden
#                         wieder; ein neuer Verdacht kommt erst, wenn der alte zur Rede gestellt ist)
#   kartell_geplatzt      die Förderbremse ist geplatzt
#   kartell_verraten      Jacob ist für Cranes Geld ausgestiegen
#   bullard_kartellbruch  Bullard hat die Förderbremse gebrochen
#   liefervertrag         Liefervertrag mit dem Händler
#   haendler_pleite       der Händler ist im Kreditcrash pleitegegangen
#   geruecht_aufgeflogen  ein Gerücht ist aufgeflogen
#   crane_bittsteller     Crane hat Jacob abblitzen lassen
#   crane_handel          Jacob hat mit Crane einen Handel geschlossen
# Merkzeichen, die die Simulation liest:
#   kartell_ermahnt       Antwort auf „kartell_verdacht“: Der Verdächtige ist zur Rede gestellt
# Etappe 3 (gekoppelte Briefe, src/sim/letters.ts):
#   liefervertrag_fehlmenge  Jacob hat dem Händler zu wenig geliefert → haendler_mahnung
#   liefervertrag_aufgeloest Antwort: Der Liefervertrag endet gegen Abfindung
#   geruecht_aufgeflogen     → nora_entlarvt;  nora_versoehnt (Antwort): Nora warnt wieder vor

- id: kartell_verdacht
  mail: info
  certain: true
  once: false
  marked: [kartell_verdacht]
  conditions: { maxChapter: 1 }
  title:
    de: Bei einem von uns läuft die Pumpe nachts
    en: Someone's Pump Runs at Night
  text:
    de: >-
      Ein Zettel unter der Tür, auf Packpapier, ohne Namen: „Einer aus der
      Förderbremse fördert nachts heimlich voll. Wenn du deinen Pakt behalten
      willst, reit hin, bevor die anderen es merken.“
    en: >-
      A note under the door, on wrapping paper, unsigned: "One of the pact pumps
      full at night. If you want to keep your pact, ride out before the others
      notice."
  choices:
    - id: hinreiten
      label: { de: "Noch heute Nacht hinreiten und ihn zur Rede stellen", en: "Ride out tonight and confront him" }
      result:
        de: Jacob steht im Dunkeln neben der laufenden Pumpe, bis der Mann ihn sieht. Ab jetzt bleibt sie nachts still.
        en: Jacob stands in the dark beside the running pump until the man sees him. From now on it stays quiet at night.
      effects: { strength: -3 }
      marks: [kartell_ermahnt]
    - id: abwarten
      label: { de: "Abwarten – Gerede gibt es immer", en: "Wait – there's always talk" }
      result:
        de: Jacob legt den Zettel weg. Vielleicht ist es nur Gerede. Vielleicht auch nicht. Die anderen im Pakt merken, dass er nicht hinreitet.
        en: Jacob puts the note away. Maybe it's only talk. Maybe not. The others in the pact notice that he doesn't ride out.
      marks: [wildcatter_verprellt]
      appointments: 0
      default: true

# Etappe 3: Der Händler mahnt, wenn Jacob weniger liefert, als der Vertrag verlangt.
- id: haendler_mahnung
  mail: demand
  once: false
  cooldown: 4
  marked: [liefervertrag_fehlmenge]
  chance: 1
  deadline: 2
  conditions: { maxChapter: 1 }
  title:
    de: Der Händler mahnt
    en: The Dealer Sends a Reminder
  text:
    de: >-
      Merriwether, der Händler in Port Ellis, schreibt in gestochener Kontorschrift:
      Die vereinbarte Menge sei nicht gekommen. Die Strafe habe er abgezogen, aber
      seine Kunden in Hallstead warteten. Entweder Mr. Harlan liefere nach – oder man
      löse den Vertrag, gegen eine anständige Abfindung.
    en: >-
      Merriwether, the dealer in Port Ellis, writes in a fine clerk's hand: the agreed
      amount did not arrive. He has deducted the penalty, but his customers in
      Hallstead are waiting. Either Mr. Harlan delivers the balance – or they dissolve
      the contract, against a decent settlement.
  choices:
    - id: nachliefern
      label: { de: "500 Barrel aus dem Tank nachliefern (+400 $)", en: "Deliver 500 barrels from the tank (+400 $)" }
      result:
        de: Zwei Wagen fahren zum Händler. Merriwether zahlt den Vertragspreis abzüglich seiner Mühe und schreibt „erledigt“ unter die Mahnung.
        en: Two wagons go to the dealer. Merriwether pays the contract price less his trouble and writes "settled" under the reminder.
      requires: { minOilStock: 500 }
      effects: { oilStock: -500, cash: 400 }
      fixedCash: true
      appointments: 0
    - id: aufloesen
      label: { de: "Den Vertrag auflösen ({cash} Abfindung)", en: "Dissolve the contract ({cash} settlement)" }
      result:
        de: Merriwether nimmt das Geld und zerreißt den Vertrag vor Jacobs Augen. „Vielleicht ein andermal, Mr. Harlan.“
        en: Merriwether takes the money and tears up the contract in front of Jacob. "Another time perhaps, Mr. Harlan."
      requires: { minCash: 300 }
      effects: { cash: -300 }
      marks: [liefervertrag_aufgeloest]
    - id: vertroesten
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Merriwether erzählt im Hafen, auf Harlans Wort sei kein Verlass. Lusk am Verladeplatz hört es auch und zahlt eine Weile weniger.
        en: Merriwether tells the harbour that Harlan's word can't be relied on. Lusk at the loading yard hears it too and pays less for a while.
      effects: { price: -0.02 }
      appointments: 0
      default: true

# Etappe 3: Nora schreibt, nachdem Jacobs Gerücht aufgeflogen ist (geruecht_aufgeflogen).
- id: nora_entlarvt
  mail: personal
  marked: [geruecht_aufgeflogen]
  chance: 1
  deadline: 3
  conditions: { maxChapter: 1 }
  title:
    de: Ein Brief von Nora Whitlock
    en: A Letter from Nora Whitlock
  text:
    de: >-
      Nora Whitlock schreibt ohne Anrede: Sie habe das Gerücht gedruckt, weil sie
      Jacob geglaubt habe. Jetzt lache der ganze Hafen über den Courier. „Sie haben
      mich benutzt, Mr. Harlan. Ich möchte wissen, warum – oder ich schreibe es
      selbst auf.“
    en: >-
      Nora Whitlock writes without a salutation: she printed the rumour because she
      believed Jacob. Now the whole harbour laughs at the Courier. "You used me,
      Mr. Harlan. I want to know why – or I'll write it down myself."
  choices:
    - id: wahrheit
      label: { de: "Hinfahren und ihr die Wahrheit sagen", en: "Go to her and tell her the truth" }
      result:
        de: Nora hört zu, ohne mitzuschreiben. Am Ende klappt sie das Notizbuch auf. „Nächstes Mal fragen Sie mich vorher.“ Sie warnt wieder vor, wenn der Preis kippt.
        en: Nora listens without taking notes. At the end she opens her notebook. "Next time, ask me first." She warns him again when the price is about to turn.
      effects: { strength: -3 }
      marks: [nora_versoehnt]
      appointments: 2
    - id: geld
      label: { de: "Ihr Schweigegeld anbieten ({cash})", en: "Offer her money to keep quiet ({cash})" }
      result:
        de: Nora schickt das Geld nicht zurück. Sie schreibt den Betrag in ihr Notizbuch, mit Datum.
        en: Nora doesn't send the money back. She writes the sum in her notebook, with the date.
      requires: { minCash: 150 }
      effects: { cash: -150 }
      # 0.4.19+3: nora_schweigegeld dazu – Nora hat dieses Geld behalten (anders als die 50 $ nach dem Brand);
      # Kapitel 2 erzählt das in k2_nora_schweigegeld statt im Courier-Absatz.
      marks: [nora_bestechung, nora_schweigegeld]
    - id: schweigen
      label: { de: "Nicht antworten", en: "Don't reply" }
      result:
        de: Am Samstag steht im Courier, wer das Gerücht gestreut hat. Die Farmer am Hügel lesen es und verlangen von Jacob mehr für ihr Land.
        en: On Saturday the Courier prints who spread the rumour. The farmers on the hill read it and ask Jacob more for their land.
      effects: { leaseCost: 0.15 }
      appointments: 0
      default: true
