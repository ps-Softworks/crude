# Kapitel 2 – Story-Bogen „Silas gegen den Aufsichtsrat“ (GDD §13 Kapitel 2, Story-Bibel §3 und §6 B).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# Jahr 11–14 (98–101 d. F.). Silas ist 54–57 (V), der Bart weiß, er trinkt „nur sonntags“ – das
# stimmt nicht mehr. Jedes Ereignis trägt { minChapter: 2, maxChapter: 2 }.
# Runden zählen im Kapitel ab 1. Merkzeichen aus Kapitel 1 setzt der Zeitsprung mit
# marksIntoNextChapter (src/sim/events.ts) auf Runde 0 – „vor Kapitelbeginn“ (Test in events.test.ts).
#
# Drei Wege, je nach Kapitel 1:
#   B1 Silas im Rat (silas_fair)
#     Runde 3+  k2_silas_rat            Ratssitz oder Trupps
#     Runde 5+  k2_silas_unfall         Ein Toter an Turm vier – decken, abberufen, auszahlen
#               k2_silas_unfall_akte    … mit silas_gedeckt (K1): Pettibone hat die Quittung für das Seil
#     Runde 8+  k2_silas_strohmann      Schlüsselszene: „Die Herren kaufen dich, Junge, Stück für Stück.“
#     danach    k2_silas_recht          (silas_ausgelacht) Sieben Vollmachten – Thornes Mann will in den Rat
#               k2_silas_vollmachten    (silas_k2_geprueft) Fünf Vollmachten – dieselbe Gefahr, abgeschwächt
#   B2 Silas als Kunde (silas_ausgekauft)
#     Runde 4+  k2_silas_tarif          „Silas gegen den Tarif“
#     +3        k2_silas_foerderer      (silas_tarif_fair)      Die drei anderen kleinen Förderer – Lusk droht
#               k2_silas_bullard        (silas_tarif_voll)      Bullard will Silas' Quellen
#               k2_silas_turm           (silas_quellen_gekauft) Silas' Turm: noch einmal bohren
#   B3 Silas als Zeuge (silas_betrogen – auch versöhnt oder Kronzeuge)
#     Runde 6+  k2_silas_hauptversammlung  Schlüsselszene: zehn Aktien und eine alte Geschichte
#     +2–4      k2_silas_delaney        (silas_k2_nachgezahlt)    Delaney liest mit: „Bücher ohne Gewinn“
#               k2_silas_saloon         (silas_k2_hinausgeworfen) Der Saloon erzählt es jeden Abend
#               k2_silas_kreuz          (silas_schweigegeld)      Ein Kreuz ist keine Unterschrift
#   (Silas' Geschichte bei Nora: k2_nora_silas, k2_nora_geopfert in k2-story-1-nora.yaml)
#
# Ausgänge des Bogens (für content/arcs.yaml – erster passender gilt):
#   gewarnt      silas_k2_gewarnt                       Silas hat Jacob vor den Strohmännern bewahrt
#   geschuetzt   silas_geschuetzt                       Jacob hat Silas gegen den Rat gehalten
#   recht        silas_k2_recht_gegeben                 Silas hatte recht, Jacob hat es zugegeben
#   geopfert     silas_k2_geopfert                      Der Rat hat einen Schuldigen bekommen
#   ausgezahlt   silas_k2_ausgezahlt, silas_quellen_gekauft
#   kunde        silas_tarif_fair, silas_tarif_voll
#   nachgezahlt  silas_k2_nachgezahlt
#   gekauft      silas_schweigegeld
#   hinaus       silas_k2_hinausgeworfen
#   (Feinere Ausgänge aus den Folgeszenen: silas_k2_entschuldigt, silas_k2_fuersprecher, silas_an_bullard …)
#
# Merkzeichen aus Kapitel 1: silas_fair, silas_gedeckt, silas_ausgekauft, silas_betrogen.
# Neu, liest Kapitel 2: silas_geschuetzt, silas_k2_geopfert (Nora), silas_ausgelacht, silas_k2_geprueft,
#   silas_tarif_fair, silas_tarif_voll, silas_quellen_gekauft, silas_k2_nachgezahlt,
#   silas_k2_hinausgeworfen, silas_schweigegeld.
# Neu für Kapitel 3 (content/relevance.yaml): silas_ratssitz, silas_trupps, silas_k2_ausgezahlt,
#   silas_k2_gewarnt, silas_k2_recht_gegeben, silas_tarif_fair, silas_tarif_voll,
#   silas_quellen_gekauft, silas_k2_nachgezahlt, silas_k2_hinausgeworfen, silas_schweigegeld,
#   silas_k2_thorne_im_rat, silas_k2_vollmacht_abgewehrt, silas_k2_beobachter, silas_k2_genossen,
#   silas_k2_stolz, silas_k2_tarif_zurueck, silas_k2_vor_bullard, silas_k2_tarif_spaet, silas_an_bullard,
#   silas_k2_letzte_quelle, silas_k2_bohrmeister, silas_turm_verkauft, silas_k2_buecher_offen,
#   silas_k2_fuersprecher, silas_k2_buecher_verbrannt, silas_k2_entschuldigt, silas_k2_hausverbot,
#   silas_k2_schweigegeld_notar, silas_k2_spaete_wahrheit.

# Entwurf – Philipp überarbeitet.
- id: k2_silas_rat
  visitor: silas
  title:
    de: Silas im zu engen Anzug
    en: Silas in a Suit Too Tight
  text:
    de: >-
      Silas kommt in einem Anzug, der an den Schultern spannt; Ruth hat ihn in Port
      Ellis machen lassen. Der Bart ist weiß geworden, an der linken Hand fehlen
      zwei Finger. Morgen tagt der Aufsichtsrat der Harlan Oil. Pettibone hat
      ausrichten lassen, ein Bohrmeister gehöre an den Turm, nicht an den Tisch.
      „Die Herren wollen wissen, wie viel ein Barrel kostet“, sagt Silas. „Fragt
      mal, was ein Finger kostet. Ich hab noch acht.“
    en: >-
      Silas comes in a suit that pulls at the shoulders; Ruth had it made in Port
      Ellis. His beard has gone white, and two fingers are missing from his left
      hand. Tomorrow Harlan Oil's board meets. Pettibone has sent word that a
      drilling boss belongs at the rig, not at the table. "The gentlemen want to
      know what a barrel costs," Silas says. "Ask them what a finger costs. I've got
      eight left."
  conditions: { minChapter: 2, maxChapter: 2, minRound: 3 }
  marked: [silas_fair]
  delay: 0
  certain: true
  choices:
    - id: sitz
      label: { de: "Ihm den Ratssitz geben, der ihm zusteht", en: "Give him the board seat he is owed" }
      result:
        de: >-
          Silas sitzt am nächsten Morgen als Erster am Tisch und geht als Letzter. Er
          liest nichts, er hört zu. Pettibone setzt sich ans andere Ende und verlangt
          fortan zu jedem Punkt eine schriftliche Vorlage; Jacob schreibt sie nachts.
          Die Bohrtrupps arbeiten, als wäre es ihr eigener Sitz.
        en: >-
          Next morning Silas is first at the table and last to leave. He reads
          nothing; he listens. Pettibone sits at the far end and from then on demands
          a written paper on every item; Jacob writes them at night. The drilling
          crews work as if it were their own seat.
      effects: { strength: -8, boardMember: silas, boardLoyalty: { silas: 15, bankier: -10 }, reputation: { workers: 3 } }
      marks: [silas_ratssitz]
    - id: trupps
      label: { de: "Ihm die Trupps geben und den Sitz einem Bankier überlassen", en: "Give him the crews and leave the seat to a banker" }
      result:
        de: >-
          Silas nickt langsam. „Turm statt Tisch. Na gut, Junge.“ Ein Mann von
          Vandermeer & Co. bekommt den Sitz und bringt eine günstige Kreditlinie mit.
          Silas trinkt an diesem Abend nicht nur sonntags.
        en: >-
          Silas nods slowly. "Rig, not table. All right, boy." A man from Vandermeer
          & Co. gets the seat and brings a cheap line of credit with him. That
          evening Silas doesn't drink only on Sundays.
      effects: { cash: 3000, strength: -3, boardLoyalty: { vandermeer: 10, silas: -10 }, control: -2 }
      marks: [silas_trupps]
      default: true

# Entwurf – Philipp überarbeitet.
# Ohne silas_gedeckt aus Kapitel 1. Mit: k2_silas_unfall_akte.
- id: k2_silas_unfall
  rival: thorne
  title:
    de: Der Tote an Turm vier
    en: The Dead Man at Rig Four
  text:
    de: >-
      An Turm vier ist ein Gestänge gebrochen. Ein junger Bohrarbeiter ist tot,
      zwei Wochen verheiratet. Silas hatte die Schicht. Er war nüchtern, sagen die
      Männer, und Silas sagt es auch, mit roten Augen. Der Rat glaubt es nicht.
      Pettibone verlangt, dass Silas geht – „aus Verantwortung gegenüber den
      Aktionären“.
    en: >-
      A drill string has broken at rig four. A young driller is dead, married two
      weeks. Silas had the shift. He was sober, the men say, and Silas says so too,
      with red eyes. The board doesn't believe it. Pettibone demands that Silas go –
      "out of responsibility to the shareholders".
  conditions: { minChapter: 2, maxChapter: 2, minRound: 5 }
  marked: [silas_fair]
  notMarked: [silas_gedeckt]
  delay: 0
  certain: true
  choices:
    - id: decken
      label: { de: "Silas decken und der Witwe eine Rente zahlen (2.500 $)", en: "Stand by Silas and pay the widow a pension (2,500 $)" }
      result:
        de: >-
          Jacob stellt sich in der Sitzung vor Silas. Die Witwe bekommt jeden Monat
          Geld, Silas bringt es ihr selbst. Pettibone lässt ins Protokoll schreiben,
          dass er dagegen war.
        en: >-
          Jacob stands in front of Silas at the meeting. The widow gets money every
          month; Silas brings it to her himself. Pettibone has it minuted that he was
          against it.
      requires: { minCash: 2500 }
      effects: { cash: -2500, boardLoyalty: { bankier: -10, vandermeer: -5 }, reputation: { workers: 5 } }
      marks: [silas_geschuetzt]
    - id: abberufen
      label: { de: "Silas abberufen – der Rat hat recht", en: "Remove Silas – the board is right" }
      result:
        de: >-
          Silas räumt seinen Spind an Turm vier selbst. Er gibt Jacob nicht die Hand.
          Die Trupps arbeiten weiter, aber langsamer, und am Zahltag fehlen drei
          Männer.
        en: >-
          Silas clears out his locker at rig four himself. He doesn't shake Jacob's
          hand. The crews keep working, but slower, and on payday three men are
          missing.
      effects: { boardLoyalty: { bankier: 10 }, reputation: { workers: -5 } }
      marks: [silas_k2_geopfert]
      default: true
    - id: auszahlen
      label: { de: "Ihm seine Aktien abkaufen, damit er in Ehren geht (8.000 $)", en: "Buy his shares so he can leave with honour (8,000 $)" }
      result:
        de: >-
          Silas zählt das Geld nicht. „Ist ein guter Preis für einen alten Mann“,
          sagt er. „Für den Jungen an Turm vier zahlt keiner was.“ Die Hälfte gibt er
          der Witwe.
        en: >-
          Silas doesn't count the money. "It's a good price for an old man," he says.
          "Nobody pays anything for the boy at rig four." He gives half to the widow.
      requires: { minCash: 8000 }
      effects: { cash: -8000, control: 3 }
      marks: [silas_k2_ausgezahlt]

# Entwurf – Philipp überarbeitet.
# Mit silas_gedeckt aus Kapitel 1: Jacob zahlte damals das gerissene Seil und schwieg.
- id: k2_silas_unfall_akte
  rival: thorne
  draft: true
  title:
    de: Pettibones Mappe
    en: Pettibone's Folder
  text:
    de: >-
      An Turm vier ist ein Gestänge gebrochen, ein junger Bohrarbeiter ist tot.
      Silas hatte die Schicht und war nüchtern, sagen die Männer. Pettibone legt
      eine Mappe auf den Ratstisch: die Quittung für ein Bohrseil, elf Jahre alt,
      bar bezahlt von Jacob Harlan am Morgen nach einer Nacht, über die am Salt
      Hill niemand redet. „Der Mann hat schon einmal getrunken, meine Herren. Und
      Mr. Harlan hat es bezahlt.“
    en: >-
      A drill string has broken at rig four; a young driller is dead. Silas had the
      shift and was sober, the men say. Pettibone lays a folder on the board table:
      the receipt for a drilling cable, eleven years old, paid in cash by Jacob
      Harlan the morning after a night nobody on Salt Hill talks about. "The man has
      been drinking before, gentlemen. And Mr. Harlan paid for it."
  conditions: { minChapter: 2, maxChapter: 2, minRound: 5 }
  marked: [silas_fair, silas_gedeckt]
  delay: 0
  certain: true
  choices:
    - id: decken
      label: { de: "Zu Silas stehen – auch zu dem Seil damals (3.500 $)", en: "Stand by Silas – and by the old cable too (3,500 $)" }
      result:
        de: >-
          „Ich habe das Seil bezahlt, weil er es wert war“, sagt Jacob. „Er ist es
          noch.“ Die Witwe bekommt eine Rente, der Rat einen Gutachter, der Silas
          entlastet. Pettibone schließt die Mappe und behält sie.
        en: >-
          "I paid for the cable because he was worth it," Jacob says. "He still is."
          The widow gets a pension, the board an expert who clears Silas. Pettibone
          closes the folder and keeps it.
      requires: { minCash: 3500 }
      effects: { cash: -3500, boardLoyalty: { bankier: -15 }, trace: { severity: 1, label: "Seil von Salt Hill" } }
      marks: [silas_geschuetzt]
    - id: abberufen
      label: { de: "Silas fallen lassen, bevor die Mappe Jacob trifft", en: "Drop Silas before the folder hits Jacob" }
      result:
        de: >-
          Silas hört es von Pettibone, nicht von Jacob. Er räumt den Spind. Ganz
          hinten liegt eine volle Flasche, unangebrochen. Er stellt sie Jacob auf den
          Schreibtisch und geht.
        en: >-
          Silas hears it from Pettibone, not from Jacob. He clears his locker. Right
          at the back is a full bottle, unopened. He sets it on Jacob's desk and
          leaves.
      effects: { boardLoyalty: { bankier: 10 }, reputation: { workers: -8 } }
      marks: [silas_k2_geopfert]
      default: true
    - id: auszahlen
      label: { de: "Ihm die Aktien abkaufen und die Mappe mitkaufen (10.000 $)", en: "Buy his shares and the folder with them (10,000 $)" }
      result:
        de: >-
          Pettibone verkauft die Mappe nicht, aber er vergisst sie, als Silas' Aktien
          bei Jacob liegen. Silas nimmt das Geld. „Jetzt hast du mich zweimal
          bezahlt, Junge. Einmal hätte gereicht.“
        en: >-
          Pettibone doesn't sell the folder, but he forgets it once Silas's shares are
          with Jacob. Silas takes the money. "Now you've paid for me twice, boy. Once
          would have done."
      requires: { minCash: 10000 }
      effects: { cash: -10000, control: 3, boardLoyalty: { bankier: 5 } }
      marks: [silas_k2_ausgezahlt]

# Entwurf – Philipp überarbeitet.
# Schlüsselszene (GDD: typische Falle – Thorne kauft sich über Strohmänner ein).
- id: k2_silas_strohmann
  visitor: silas
  rival: thorne
  draft: true
  title:
    de: Sieben Namen auf Packpapier
    en: Seven Names on Brown Paper
  text:
    de: >-
      Silas legt ein Stück Packpapier auf den Eichenschreibtisch. Darauf stehen, in
      großen, mühsamen Buchstaben, sieben Namen. Er hat sie im Aktienbuch in
      Hallstead abgeschrieben, Buchstabe für Buchstabe, weil er nicht schnell
      lesen kann. Keiner der Männer wohnt, wo er angeblich wohnt. Alle haben mit
      Schecks derselben Bank bezahlt – der, die Thornes Eisenbahn gehört. „Die
      Herren kaufen dich, Junge“, sagt Silas. „Stück für Stück.“
    en: >-
      Silas lays a piece of brown paper on the oak desk. On it, in large laboured
      letters, are seven names. He copied them from the share register in
      Hallstead, letter by letter, because he can't read fast. None of the men lives
      where he is supposed to. All paid with cheques from the same bank – the one
      Thorne's railway owns. "The gentlemen are buying you, boy," Silas says. "Piece
      by piece."
  conditions: { minChapter: 2, maxChapter: 2, minRound: 8 }
  marked: [silas_geschuetzt]
  delay: 2
  certain: true
  choices:
    - id: zurueckkaufen
      label: { de: "Ihm glauben und die Aktien zurückkaufen (12.000 $)", en: "Believe him and buy the shares back (12,000 $)" }
      result:
        de: >-
          Jacob kauft über drei Wochen und vier Makler. Der Kurs steigt, als wüsste
          jemand Bescheid. Am Ende sind fünf der sieben Namen aus dem Buch
          verschwunden. Silas sagt nur: „Acht Finger, Junge. Und die Augen sind noch
          gut.“
        en: >-
          Jacob buys over three weeks through four brokers. The price climbs as if
          someone knew. In the end five of the seven names are gone from the book.
          Silas only says: "Eight fingers, boy. And the eyes are still good."
      requires: { minCash: 12000 }
      effects: { cash: -12000, control: 4, rivalStake: { thorne: -4 }, sharePrice: 0.05 }
      marks: [silas_k2_gewarnt]
    - id: pruefen
      label: { de: "Den Anwalt nachforschen lassen (1.500 $)", en: "Have the lawyer look into it (1,500 $)" }
      result:
        de: >-
          Der Anwalt braucht sechs Wochen und findet zwei der sieben Männer. Sie
          hätten gekauft, sagen sie, weil ein Freund dazu geraten habe. Der Freund hat
          keinen Namen. Die anderen fünf bleiben im Buch.
        en: >-
          The lawyer takes six weeks and finds two of the seven men. They bought, they
          say, because a friend advised it. The friend has no name. The other five
          stay in the book.
      requires: { minCash: 1500 }
      effects: { cash: -1500, control: 1, rivalStake: { thorne: 2 } }
      marks: [silas_k2_geprueft]
    - id: auslachen
      label: { de: "Lachen – Silas sieht Gespenster", en: "Laugh – Silas is seeing ghosts" }
      result:
        de: >-
          Silas faltet das Papier zusammen, sorgfältig, und steckt es ein. „Hab ich
          auch mal gesagt“, meint er, „von einem Seil.“ Er geht ohne Gruß.
        en: >-
          Silas folds the paper, carefully, and puts it away. "I said that once too,"
          he says, "about a cable." He leaves without a word.
      effects: { boardLoyalty: { silas: -15 }, rivalStake: { thorne: 5 } }
      marks: [silas_ausgelacht]
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# Nachwirkung (silas_ausgelacht): Silas hatte recht. Es geht um einen Ratssitz für Thornes Mann –
# nicht um die Dividende (die stimmt der Rat in k2_ruth_clara ab).
- id: k2_silas_recht
  rival: thorne
  title:
    de: Vollmachten von Fremden
    en: Proxies from Strangers
  text:
    de: >-
      Hauptversammlung im Saal über der Bank in Port Ellis. Pettibone verliest
      Vollmachten: sieben Aktionäre, die niemand je gesehen hat, übertragen ihm
      ihre Stimmen. Es sind die Namen von Silas' Packpapier. Mit ihnen schlägt
      Pettibone einen Herrn von Thornes Eisenbahngesellschaft für den Aufsichtsrat
      vor. Silas sitzt in der letzten Reihe, den Hut auf den Knien, und sieht Jacob
      nicht an.
    en: >-
      Shareholders' meeting in the hall above the bank in Port Ellis. Pettibone
      reads out proxies: seven shareholders nobody has ever seen transfer their
      votes to him. They are the names from Silas's brown paper. With them
      Pettibone nominates a gentleman from Thorne's railway company to the board.
      Silas sits in the back row, hat on his knees, and doesn't look at Jacob.
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_ausgelacht]
  delay: 3
  certain: true
  appointments: 2
  choices:
    - id: zugeben
      label: { de: "Nach der Versammlung zu Silas gehen und sagen, dass er recht hatte", en: "Go to Silas after the meeting and tell him he was right" }
      result:
        de: >-
          Silas hört zu, die Hände um den Hut. „Zu spät für den Stuhl“, sagt er.
          „Nicht zu spät für mich.“ Am nächsten Morgen steht er wieder am Turm.
          Thornes Mann sitzt trotzdem im Rat und lässt sich als Erstes die
          Frachtverträge zeigen.
        en: >-
          Silas listens, hands around his hat. "Too late for the chair," he says. "Not
          too late for me." Next morning he is back at the rig. Thorne's man still
          has his seat, and the first thing he asks to see is the freight contracts.
      effects: { strength: -4, control: -3, boardLoyalty: { silas: 10 }, boardMember: thorne, railTariff: 0.03 }
      marks: [silas_k2_recht_gegeben, silas_k2_thorne_im_rat]
    - id: anfechten
      label: { de: "Die Vollmachten anfechten lassen (5.000 $)", en: "Challenge the proxies (5,000 $)" }
      result:
        de: >-
          Drei Vollmachten erklärt der Notar für ungültig, vier bleiben. Mit
          Vandermeers Stimme reicht es Pettibone trotzdem – aber nur für ein Jahr,
          nicht für fünf. Silas ist vor dem Ende gegangen.
        en: >-
          The notary declares three proxies void; four stand. With Vandermeer's vote
          it is still enough for Pettibone – but for one year, not five. Silas left
          before the end.
      requires: { minCash: 5000 }
      effects: { cash: -5000, control: -1, rival: { thorne: { grudge: 10 } }, boardMember: thorne }
      marks: [silas_k2_thorne_im_rat]
    - id: hinnehmen
      label: { de: "Die Abstimmung laufen lassen", en: "Let the vote go ahead" }
      result:
        de: >-
          Thornes Mann bekommt den Sitz für fünf Jahre. In der ersten Woche liest er
          jeden Frachtvertrag der Harlan Oil, in der zweiten kennt Thornes Bahn jeden
          Preis. Silas geht vor dem Ende der Versammlung.
        en: >-
          Thorne's man gets the seat for five years. In the first week he reads every
          Harlan Oil freight contract; by the second, Thorne's railway knows every
          price. Silas leaves before the meeting ends.
      effects: { control: -4, boardMember: thorne, rivalStake: { thorne: 3 }, railTariff: 0.06 }
      marks: [silas_k2_thorne_im_rat]
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# Nachwirkung (silas_k2_geprueft): Jacob ließ nur den Anwalt nachforschen – fünf Strohmänner blieben.
# Abgeschwächte Fassung von k2_silas_recht: Pettibone braucht Vandermeer, Silas sitzt neben Jacob.
- id: k2_silas_vollmachten
  rival: thorne
  title:
    de: Fünf Vollmachten
    en: Five Proxies
  text:
    de: >-
      Hauptversammlung im Saal über der Bank in Port Ellis. Pettibone verliest
      fünf Vollmachten – die fünf Namen, die der Anwalt nicht gefunden hat. Damit
      schlägt er einen Herrn von Thornes Eisenbahngesellschaft für den
      Aufsichtsrat vor. Fünf Stimmen reichen nicht, er braucht Vandermeer, und
      Vandermeer wiegt noch ab. Silas sitzt diesmal neben Jacob, das Packpapier in
      der Brusttasche. „Zwei hat dein Anwalt gefunden“, sagt er leise. „Die zwei
      sitzen hinten links.“
    en: >-
      Shareholders' meeting in the hall above the bank in Port Ellis. Pettibone
      reads out five proxies – the five names the lawyer didn't find. With them he
      nominates a gentleman from Thorne's railway company to the board. Five votes
      aren't enough; he needs Vandermeer, and Vandermeer is still weighing it up.
      This time Silas sits beside Jacob, the brown paper in his breast pocket. "Your
      lawyer found two," he says quietly. "Those two are sitting at the back on the
      left."
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_k2_geprueft]
  delay: 3
  certain: true
  appointments: 2
  choices:
    - id: aussagen
      label: { de: "Die zwei Männer vor der Versammlung sagen lassen, wer ihnen geraten hat (2.500 $)", en: "Have the two men tell the meeting who advised them (2,500 $)" }
      result:
        de: >-
          Die beiden reden, als ihnen der Anwalt ihre Kosten erstattet. Der Freund
          ohne Namen bekommt einen: ein Prokurist von Thornes Bank. Vandermeer stimmt
          gegen Pettibone, und der Vorschlag fällt durch. Silas klopft Jacob einmal
          auf die Schulter.
        en: >-
          The two talk once the lawyer covers their costs. The friend with no name
          gets one: a clerk from Thorne's bank. Vandermeer votes against Pettibone,
          and the motion fails. Silas claps Jacob on the shoulder, once.
      requires: { minCash: 2500 }
      effects: { cash: -2500, rival: { thorne: { grudge: 5 } }, boardLoyalty: { silas: 5, bankier: -5 } }
      marks: [silas_k2_vollmacht_abgewehrt]
    - id: beobachter
      label: { de: "Thornes Mann als Gast ohne Stimme zulassen", en: "Admit Thorne's man as a guest without a vote" }
      result:
        de: >-
          Thornes Mann sitzt fortan mit am Tisch und stimmt nicht mit. Er bedankt
          sich mit einem besseren Frachttarif. Silas sagt nichts. Auf dem Heimweg
          fragt er nur, wie viel ein Stuhl kostet, auf dem keiner sitzen darf.
        en: >-
          From now on Thorne's man sits at the table and doesn't vote. He says thank
          you with a better freight rate. Silas says nothing. On the way home he only
          asks what a chair costs that nobody is allowed to sit on.
      effects: { control: -1, rivalStake: { thorne: 2 }, railTariff: -0.03 }
      marks: [silas_k2_beobachter]
    - id: hinnehmen
      label: { de: "Es auf Vandermeer ankommen lassen", en: "Leave it to Vandermeer" }
      result:
        de: >-
          Vandermeer stimmt mit Pettibone. Thornes Mann bekommt den Sitz für ein Jahr
          und liest als Erstes die Frachtverträge. Silas steckt das Packpapier wieder
          ein. „Zwei gefunden, fünf vergessen, Junge. Fünf haben gereicht.“
        en: >-
          Vandermeer votes with Pettibone. Thorne's man gets the seat for one year and
          reads the freight contracts first. Silas puts the brown paper away again.
          "Two found, five forgotten, boy. Five were enough."
      effects: { control: -2, boardMember: thorne, railTariff: 0.03 }
      marks: [silas_k2_thorne_im_rat]
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# B2: Mit silas_ausgekauft aus Kapitel 1 bohrt Silas seit zehn Jahren auf eigene Rechnung am Salt Hill.
- id: k2_silas_tarif
  visitor: silas
  title:
    de: Silas gegen den Tarif
    en: Silas Against the Tariff
  text:
    de: >-
      Silas bohrt seit zehn Jahren auf eigene Rechnung am Salt Hill: drei kleine
      Quellen, ein Turm, der Sohn seiner Schwester als Gehilfe. Der Trust zahlt
      ihm, was er will, und die Bahn nimmt, was sie will. Jetzt fragt Silas, ob
      sein Öl zu Jacobs Frachtpreis mitfahren darf. Er ist grau geworden und hat
      sich die Rede aufgeschrieben, obwohl er sie nicht lesen kann. „Silas gegen
      den Tarif, so nennen sie das im Saloon. Ich hab gesagt, ich red mit dem
      Jungen.“
    en: >-
      Silas has been drilling on his own account at Salt Hill for ten years: three
      small wells, one rig, his sister's son as helper. The Trust pays him what it
      likes and the railway takes what it likes. Now Silas asks whether his oil may
      travel at Jacob's freight rate. He has gone grey and has written his speech
      down, though he can't read it. "Silas against the tariff, that's what they
      call it in the saloon. I said I'd talk to the boy."
  # Silas' Öl fährt über Jacobs Frachtvertrag oder durch Jacobs Leitung: Die Durchleitungsgebühr (transportFee, 4.12)
  # zahlt er nur, solange eine eigene Leitung läuft – deshalb ohne Bedingung minPipelines.
  conditions: { minChapter: 2, maxChapter: 2, minRound: 4 }
  marked: [silas_ausgekauft]
  delay: 0
  certain: true
  choices:
    - id: freundschaft
      label: { de: "Freundschaftstarif – zum Selbstkostenpreis", en: "Friendship rate – at cost" }
      result:
        de: >-
          Silas spuckt in die Hand und schlägt ein. Am Salt Hill erzählt er, Harlan
          sei noch immer der Junge von damals. Drei andere kleine Förderer fragen in
          der Woche darauf, ob sie auch dürfen.
        en: >-
          Silas spits in his palm and shakes. On Salt Hill he tells everyone Harlan is
          still the boy he was. Three other small producers ask the next week whether
          they may too.
      effects: { cash: -2000, reputation: { industryRespect: 5 } }
      marks: [silas_tarif_fair]
    - id: voll
      label: { de: "Den vollen Tarif verlangen", en: "Charge the full rate" }
      result:
        de: >-
          Silas zahlt. „Ist ehrliches Geld“, sagt er, wie damals. Er sieht sich im
          Büro um, als zähle er die Stühle. Am Salt Hill sagt er nichts über Harlan,
          und das ist neu.
        en: >-
          Silas pays. "It's honest money," he says, as he did back then. He looks
          round the office as if counting the chairs. On Salt Hill he says nothing
          about Harlan, and that is new.
      effects: { cash: 2000, transportFee: 300 }
      marks: [silas_tarif_voll]
      default: true
    - id: kaufen
      label: { de: "Ihm die Quellen abkaufen (9.000 $)", en: "Buy his wells (9,000 $)" }
      result:
        de: >-
          Silas nimmt das Geld und behält den Turm. „Den verkauf ich nicht, Junge.
          Den hab ich dir schon mal geliehen.“ Die drei Quellen fördern ab jetzt für
          Harlan Oil.
        en: >-
          Silas takes the money and keeps the rig. "That one I don't sell, boy. I lent
          it to you once already." From now on the three wells pump for Harlan Oil.
      requires: { minCash: 9000 }
      effects: { cash: -9000, production: 0.1 }
      marks: [silas_quellen_gekauft]

# Entwurf – Philipp überarbeitet.
# B2, Folge (silas_tarif_fair): Der Freundschaftstarif spricht sich herum – und der Trust hört mit.
- id: k2_silas_foerderer
  visitor: silas
  rival: crane
  title:
    de: Drei Hüte in der Hand
    en: Three Hats in Hand
  text:
    de: >-
      Silas bringt die drei anderen kleinen Förderer vom Salt Hill mit: zwei
      Brüder mit einem gemeinsamen Turm und eine Witwe, die die Quelle ihres Mannes
      allein weiterbetreibt. Sie halten die Hüte in der Hand, Silas nicht. „Die
      wollen auch zum Selbstkostenpreis mitfahren, Junge. Ich hab gesagt, du bist
      noch der von damals.“ Am Morgen kam ein Brief von Lusk: Der Trust sehe es
      nicht gern, wenn ein Kunde des Trusts anderer Leute Öl billig verlade.
    en: >-
      Silas brings the three other small producers from Salt Hill: two brothers
      with one derrick between them and a widow who runs her husband's well on her
      own. They hold their hats in their hands; Silas doesn't. "They want to ship
      at cost too, boy. I told them you're still the one from back then." That
      morning a letter came from Lusk: the Trust does not like to see one of its
      customers loading other people's oil cheaply.
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_tarif_fair]
  delay: 3
  certain: true
  choices:
    - id: alle
      label: { de: "Alle vier zum Selbstkostenpreis mitnehmen", en: "Take all four at cost" }
      result:
        de: >-
          Die Waggons sind jetzt voll, und die Bahn gibt auf volle Waggons Rabatt.
          Lusk zieht drei Cent je Barrel ab und schreibt dazu, das sei keine Strafe,
          nur Buchhaltung. Am Salt Hill nennen sie die vier jetzt „Harlans Leute“.
        en: >-
          The wagons are full now, and the railway gives a discount on full wagons.
          Lusk docks three cents a barrel and adds that this is no punishment, only
          bookkeeping. On Salt Hill they call the four "Harlan's people" now.
      effects: { rival: { crane: { trust: -15 } }, reputation: { industryRespect: 8 }, railTariff: -0.04, price: -0.03 }
      marks: [silas_k2_genossen]
    - id: nur_silas
      label: { de: "Nur Silas – die anderen sollen zum Trust", en: "Only Silas – the others should go to the Trust" }
      result:
        de: >-
          Silas setzt den Hut auf. „Dann zahl ich ab jetzt den vollen Tarif, Junge,
          damit keiner sagt, ich wär dein Hund.“ Er zahlt, pünktlich, jeden Monat.
          Mit Jacob trinkt er keinen mehr.
        en: >-
          Silas puts his hat on. "Then from now on I pay the full rate, boy, so nobody
          says I'm your dog." He pays, on time, every month. He doesn't drink with
          Jacob any more.
      effects: { cash: 1500, transportFee: 300, boardLoyalty: { silas: -15 } }
      marks: [silas_k2_stolz]
      default: true
    - id: zuruecknehmen
      label: { de: "Lusk nachgeben und auch Silas' Tarif zurücknehmen", en: "Give in to Lusk and withdraw Silas's rate too" }
      result:
        de: >-
          Lusk schickt einen besseren Preis und eine Kiste Zigarren. Silas schickt
          nichts. Die Witwe verkauft ihre Quelle im Herbst an Bullard.
        en: >-
          Lusk sends a better price and a box of cigars. Silas sends nothing. The widow
          sells her well to Bullard in the autumn.
      effects: { cash: 2000, rival: { crane: { trust: 10 }, bullard: { strength: 1 } }, reputation: { industryRespect: -6 }, price: 0.02 }
      marks: [silas_k2_tarif_zurueck]

# Entwurf – Philipp überarbeitet.
# B2, Folge (silas_tarif_voll): Silas zahlt den vollen Tarif – und Bullard bietet ihm einen besseren Weg.
- id: k2_silas_bullard
  visitor: silas
  rival: bullard
  title:
    de: Bullards Angebot
    en: Bullard's Offer
  text:
    de: >-
      Silas kommt nicht zum Reden, er kommt zum Sagen. Wade Bullard war bei ihm,
      mit einem Gebot für die drei Quellen und den Turm: zehntausend, bar, und Silas
      dürfe bis zum Tod in der Hütte wohnen. „Ich frag dich zuerst, Junge. Das bin
      ich dir schuldig. Oder du mir, weiß nicht mehr.“ Bullards Land grenzt dann an
      Jacobs Pachten am Salt Hill, Zaun an Zaun.
    en: >-
      Silas doesn't come to talk; he comes to tell. Wade Bullard has been to see
      him, with an offer for the three wells and the rig: ten thousand, cash, and
      Silas may live in the hut until he dies. "I'm asking you first, boy. I owe you
      that. Or you owe me, I don't know any more." Bullard's land would then border
      Jacob's leases on Salt Hill, fence to fence.
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_tarif_voll]
  delay: 3
  certain: true
  choices:
    - id: ueberbieten
      label: { de: "Bullards Gebot überbieten (11.000 $)", en: "Outbid Bullard (11,000 $)" }
      result:
        de: >-
          Silas nimmt Jacobs Geld und behält die Hütte, nicht den Turm. Wade Bullard
          reitet ohne Gruß am Büro vorbei. Die drei Quellen fördern ab jetzt für
          Harlan Oil.
        en: >-
          Silas takes Jacob's money and keeps the hut, not the rig. Wade Bullard rides
          past the office without a greeting. From now on the three wells pump for
          Harlan Oil.
      requires: { minCash: 11000 }
      effects: { cash: -11000, rival: { bullard: { trust: -10 } } }
      marks: [silas_k2_vor_bullard]
    - id: tarif
      label: { de: "Ihm doch den Freundschaftstarif geben, damit er bleibt (2.500 $)", en: "Give him the friendship rate after all, so he stays (2,500 $)" }
      result:
        de: >-
          „Jetzt auf einmal“, sagt Silas. Er schlägt trotzdem ein. Bullard bekommt
          nichts, und Silas erzählt im Saloon, Harlan habe zehn Jahre und einen
          Bullard gebraucht.
        en: >-
          "All of a sudden," says Silas. He shakes on it anyway. Bullard gets nothing,
          and in the saloon Silas tells people Harlan needed ten years and a Bullard.
      requires: { minCash: 2500 }
      effects: { cash: -2500 }
      marks: [silas_k2_tarif_spaet]
    - id: ziehen
      label: { de: "Ihn an Bullard verkaufen lassen", en: "Let him sell to Bullard" }
      result:
        de: >-
          Silas verkauft. Eine Woche später steht an Jacobs Zaun ein Schild mit
          Bullards Namen, und Bullards Landmann bietet den Farmern ringsum mehr als
          Harlan.
        en: >-
          Silas sells. A week later a sign with Bullard's name stands at Jacob's
          fence, and Bullard's land agent offers the farmers round about more than
          Harlan does.
      effects: { rival: { bullard: { strength: 2 } } }
      marks: [silas_an_bullard]
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# B2, Folge (silas_quellen_gekauft): Silas hat die Quellen verkauft, den Turm nicht.
- id: k2_silas_turm
  visitor: silas
  title:
    de: Der Turm, den er behielt
    en: The Rig He Kept
  text:
    de: >-
      Silas' alter Turm steht seit dem Verkauf still am Rand der Pacht, die jetzt
      Harlan Oil gehört. Silas kommt mit dem Neffen und einer Karte, auf die er mit
      dem Daumen zeigt: die Ecke am Bach, wo er immer Öl vermutet hat. „Lass mich
      da noch einmal bohren, Junge. Mit meinem Turm, auf meine Kosten. Was
      rauskommt, teilen wir. Ich hab dir den Turm einmal geliehen. Jetzt leih mir
      die Ecke.“
    en: >-
      Since the sale Silas's old rig has stood idle at the edge of the lease that
      Harlan Oil now owns. Silas comes with his nephew and a map, and points with
      his thumb: the corner by the creek, where he always thought there was oil.
      "Let me drill there one more time, boy. My rig, my cost. Whatever comes up,
      we share. I lent you the rig once. Now lend me the corner."
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_quellen_gekauft]
  delay: 3
  certain: true
  choices:
    - id: erlauben
      label: { de: "Ihm die Ecke leihen und die Leitung legen (1.500 $)", en: "Lend him the corner and lay the line (1,500 $)" }
      result:
        de: >-
          Silas bohrt sechs Wochen, der Neffe schläft am Turm. In achthundert Fuß
          kommt Öl, nicht viel, aber es kommt. Silas steht im Regen aus Öl und lacht
          wie vor elf Jahren.
        en: >-
          Silas drills for six weeks; his nephew sleeps at the rig. At eight hundred
          feet oil comes, not much, but it comes. Silas stands in the rain of oil and
          laughs as he did eleven years ago.
      requires: { minCash: 1500 }
      effects: { cash: -1500, production: 0.05 }
      marks: [silas_k2_letzte_quelle]
    - id: bohrmeister
      label: { de: "Ihm stattdessen einen Turm der Firma geben – als Bohrmeister", en: "Give him a company rig instead – as drilling boss" }
      result:
        de: >-
          Silas überlegt eine Nacht. Dann nimmt er an und verkauft seinen alten Turm
          dem Neffen, für einen Dollar. Die Trupps an den drei Quellen arbeiten unter
          ihm schneller als unter jedem anderen.
        en: >-
          Silas thinks it over for a night. Then he accepts and sells his old rig to
          his nephew for a dollar. The crews at the three wells work faster under him
          than under anyone else.
      effects: { cash: -1000, reputation: { workers: 3 }, staffLoyalty: { all: 5 } }
      marks: [silas_k2_bohrmeister]
    - id: nein
      label: { de: "„Die Ecke gehört der Firma, Silas“", en: "\"The corner belongs to the company, Silas\"" }
      result:
        de: >-
          Silas faltet die Karte. Im Herbst verkauft er den Turm an Bullard. Die
          Männer an den drei Quellen, die Silas noch kennen, arbeiten seitdem nach
          Vorschrift und keine Minute länger.
        en: >-
          Silas folds the map. In the autumn he sells the rig to Bullard. The men at
          the three wells who still know Silas work to rule since then, not a minute
          longer.
      effects: { rival: { bullard: { strength: 1 } } }
      marks: [silas_turm_verkauft]
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# B3: Mit silas_betrogen aus Kapitel 1 (auch wenn er später versöhnt wurde oder Nora alles aufschrieb).
- id: k2_silas_hauptversammlung
  draft: true
  title:
    de: Zehn Aktien und eine Geschichte
    en: Ten Shares and a Story
  text:
    de: >-
      Hauptversammlung der Harlan Oil. In der dritten Reihe steht ein alter Mann
      auf, der auf keiner Liste der Großaktionäre steht. Silas Brandt hat zehn
      Aktien gekauft, mehr nicht – genug, um reden zu dürfen. Er erzählt von einem
      Bohrturm, den er einem jungen Mann geliehen hat, und von Büchern, in denen
      kein Gewinn stand. Die Herren aus Hallstead hören zu, wie man einem
      Theaterstück zuhört. Pettibone schreibt mit.
    en: >-
      Harlan Oil's shareholders' meeting. In the third row an old man stands up who
      is on no list of major shareholders. Silas Brandt has bought ten shares, no
      more – enough to be allowed to speak. He tells of a derrick he lent a young
      man, and of books in which there was no profit. The gentlemen from Hallstead
      listen the way one listens to a play. Pettibone takes notes.
  conditions: { minChapter: 2, maxChapter: 2, minRound: 6 }
  marked: [silas_betrogen]
  delay: 0
  certain: true
  appointments: 2
  choices:
    - id: nachzahlen
      label: { de: "Öffentlich nachzahlen, was ihm zusteht (6.000 $)", en: "Pay him publicly what he's owed (6,000 $)" }
      result:
        de: >-
          Jacob steht auf und sagt vor allen, Silas habe recht. Am nächsten Tag geht
          ein Scheck hinaus. Silas löst ihn ein und schickt eine Karte: „Spät. Aber in
          Tinte.“ Vandermeer findet, so etwas sage man nicht vor Aktionären.
        en: >-
          Jacob stands and says before everyone that Silas is right. Next day a cheque
          goes out. Silas cashes it and sends a card: "Late. But in ink." Vandermeer
          thinks one doesn't say such things before shareholders.
      requires: { minCash: 6000 }
      effects: { cash: -6000, reputation: { workers: 5, public: 3 }, boardLoyalty: { vandermeer: -5 } }
      marks: [silas_k2_nachgezahlt]
    - id: hinausbegleiten
      label: { de: "Ihn hinausbegleiten lassen", en: "Have him shown out" }
      result:
        de: >-
          Zwei Saaldiener nehmen Silas an den Armen, freundlich, wie man einen
          Betrunkenen nimmt. Er war nüchtern. Am nächsten Morgen weiß es jeder
          Bohrtrupp in Cordova.
        en: >-
          Two ushers take Silas by the arms, kindly, the way one takes a drunk. He was
          sober. By next morning every drilling crew in Cordova knows.
      effects: { reputation: { workers: -8 }, heat: 3 }
      marks: [silas_k2_hinausgeworfen]
      default: true
    - id: schweigegeld
      label: { de: "Ihm nach der Versammlung Geld für sein Schweigen anbieten (3.000 $)", en: "Offer him money for his silence after the meeting (3,000 $)" }
      result:
        de: >-
          Ein Anwalt bringt Silas einen Umschlag und ein Papier. Silas unterschreibt
          mit einem Kreuz und lacht dabei. Das Papier liegt jetzt in Jacobs Schrank.
          Wer sonst davon weiß, weiß niemand.
        en: >-
          A lawyer brings Silas an envelope and a paper. Silas signs with a cross and
          laughs as he does. The paper now lies in Jacob's cabinet. Who else knows
          about it, nobody knows.
      requires: { minCash: 3000 }
      effects: { cash: -3000, trace: { severity: 3, label: "Schweigegeld an Silas Brandt" } }
      marks: [silas_schweigegeld]

# Entwurf – Philipp überarbeitet.
# B3, Folge (silas_k2_nachgezahlt): Ein öffentliches „Silas hat recht“ ist auch ein Geständnis.
- id: k2_silas_delaney
  title:
    de: Bücher ohne Gewinn
    en: Books Without Profit
  text:
    de: >-
      Ein Brief aus Hallstead, Justizministerium, unterschrieben von Frank Delaney,
      Bundesanwalt. Er habe in der Zeitung gelesen, Mr. Harlan habe vor seinen
      Aktionären eingeräumt, einem Partner zu wenig ausgezahlt zu haben. Er bitte
      um die Bücher der damaligen Teilhaberschaft am Salt Hill, „zur Durchsicht“.
      Auf Jacobs Schreibtisch steht noch Silas' Karte: „Spät. Aber in Tinte.“
    en: >-
      A letter from Hallstead, Department of Justice, signed by Frank Delaney,
      federal prosecutor. He has read in the paper that Mr. Harlan admitted before
      his shareholders to underpaying a partner. He requests the books of the
      former partnership on Salt Hill, "for review". Silas's card still stands on
      Jacob's desk: "Late. But in ink."
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_k2_nachgezahlt]
  delay: 4
  certain: true
  choices:
    - id: herausgeben
      label: { de: "Die alten Bücher herausgeben", en: "Hand over the old books" }
      result:
        de: >-
          Delaney behält die Bücher drei Monate und schickt sie mit einer höflichen
          Karte zurück. Er hat sich Seiten notiert. Der Anwalt sagt, das sei gut, und
          sieht dabei nicht gut aus.
        en: >-
          Delaney keeps the books for three months and sends them back with a polite
          card. He has noted pages. The lawyer says that's good, and doesn't look as
          if it were.
      effects: { cash: -1000, strength: -6, evidence: 1, heat: 2 }
      marks: [silas_k2_buecher_offen]
      default: true
    - id: fuersprecher
      label: { de: "Silas bitten, Delaney zu sagen, dass alles beglichen ist", en: "Ask Silas to tell Delaney it's all settled" }
      result:
        de: >-
          Silas fährt mit Jacob nach Hallstead, im Sonntagsanzug, und sagt Delaney,
          was er sagen will: Er sei bezahlt, spät, aber ganz. Delaney hört zu wie
          einer, der so etwas oft hört. Er legt die Akte trotzdem nicht weg, nur
          weiter nach unten.
        en: >-
          Silas travels to Hallstead with Jacob, in his Sunday suit, and tells Delaney
          what he means to say: he has been paid, late, but in full. Delaney listens
          like a man who hears that often. He doesn't put the file away, only further
          down the pile.
      effects: { strength: -10, evidence: -1 }
      marks: [silas_k2_fuersprecher]
      appointments: 3
    - id: verbrennen
      label: { de: "Die alten Bücher verbrennen lassen", en: "Have the old books burned" }
      result:
        de: >-
          Der Ofen im Büro brennt eine Nacht lang. Delaney bekommt einen Brief des
          Anwalts: Die Bücher seien bei einem Umzug verloren gegangen. Er antwortet
          mit einer Zeile: „Bedauerlich.“
        en: >-
          The office stove burns all night. Delaney gets a letter from the lawyer: the
          books were lost in a move. He replies with one line: "Regrettable."
      effects: { cash: -500, trace: { severity: 2, label: "Verbrannte Bücher vom Salt Hill" }, evidence: 1 }
      marks: [silas_k2_buecher_verbrannt]
      appointments: 0

# Entwurf – Philipp überarbeitet.
# B3, Folge (silas_k2_hinausgeworfen): Silas erzählt es im Saloon, jeden Abend.
- id: k2_silas_saloon
  title:
    de: Jeden Abend im Saloon
    en: Every Evening in the Saloon
  text:
    de: >-
      Im Saloon am Salt Hill erzählt Silas jeden Abend, wie ihn zwei Saaldiener
      aus der Hauptversammlung getragen haben, „wie einen Betrunkenen, und ich war
      nüchtern“. Die Bohrtrupps hören zu und bestellen ihm das nächste Glas. Der
      Vorarbeiter von Turm zwei lässt ausrichten, die Männer würden gern hören, was
      Mr. Harlan dazu sagt. Am besten im Saloon.
    en: >-
      Every evening in the saloon on Salt Hill, Silas tells how two ushers carried
      him out of the shareholders' meeting, "like a drunk, and I was sober". The
      drilling crews listen and buy him the next glass. The foreman of rig two
      sends word that the men would like to hear what Mr. Harlan has to say about
      it. Preferably in the saloon.
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_k2_hinausgeworfen]
  delay: 2
  certain: true
  choices:
    - id: hingehen
      label: { de: "In den Saloon gehen und sich vor allen entschuldigen", en: "Go to the saloon and apologise in front of everyone" }
      result:
        de: >-
          Es wird still, als Jacob hereinkommt. Er sagt drei Sätze. Silas hört sie
          an, ohne aufzustehen. „Hast lange gebraucht, Junge“, sagt er, und schiebt
          ihm ein Glas hin. Am Montag sind alle Trupps pünktlich.
        en: >-
          It goes quiet when Jacob walks in. He says three sentences. Silas hears them
          out without getting up. "Took you long enough, boy," he says, and pushes a
          glass across. On Monday every crew is on time.
      effects: { strength: -8, reputation: { workers: 6 }, boardLoyalty: { bankier: -5 } }
      marks: [silas_k2_entschuldigt]
      appointments: 2
    - id: praemie
      label: { de: "Den Trupps eine Prämie zahlen (2.000 $)", en: "Pay the crews a bonus (2,000 $)" }
      result:
        de: >-
          Die Männer nehmen das Geld. Am Abend trinken sie es im Saloon, auf Silas.
          Gearbeitet wird wieder wie vorher, geredet auch.
        en: >-
          The men take the money. In the evening they drink it in the saloon, to
          Silas. They work as before again, and talk as before too.
      requires: { minCash: 2000 }
      effects: { cash: -2000 }
    - id: hausverbot
      label: { de: "Den Saloon kaufen und Silas Hausverbot erteilen (4.000 $)", en: "Buy the saloon and bar Silas (4,000 $)" }
      result:
        de: >-
          Der Wirt verkauft gern. Silas trinkt seitdem vor der Tür, auf einer
          Kiste, und die Männer trinken mit ihm draußen. Drinnen bleibt es leer.
        en: >-
          The landlord is glad to sell. Since then Silas drinks outside the door, on a
          crate, and the men drink with him outside. Inside stays empty.
      requires: { minCash: 4000 }
      effects: { cash: -4000, reputation: { workers: -10 }, heat: 2 }
      marks: [silas_k2_hausverbot]
    - id: nichts
      label: { de: "Nicht darauf eingehen", en: "Don't respond" }
      result:
        de: >-
          Silas erzählt weiter, und die Geschichte wird jeden Abend ein wenig länger.
          An Turm zwei fehlt am Zahltag eine halbe Schicht.
        en: >-
          Silas keeps telling it, and the story grows a little longer every evening.
          At rig two half a shift is missing on payday.
      effects: { reputation: { workers: -4 } }
      appointments: 0
      default: true

# Entwurf – Philipp überarbeitet.
# B3, Folge (silas_schweigegeld): Das Papier mit dem Kreuz taugt nichts – und Silas schweigt nicht.
- id: k2_silas_kreuz
  title:
    de: Ein Kreuz ist keine Unterschrift
    en: A Cross Is Not a Signature
  text:
    de: >-
      Der Anwalt hat das Papier aus Jacobs Schrank noch einmal gelesen. Ein Kreuz
      ohne Zeugen, sagt er, sei vor Gericht so viel wert wie das Papier selbst.
      Silas wusste das; deshalb hat er gelacht. Im Saloon erzählt er seine
      Geschichte jetzt mit einem neuen Ende – einem Umschlag mit dreitausend
      Dollar. Ein Herr aus Hallstead, sagt der Wirt, habe sich alles
      aufgeschrieben.
    en: >-
      The lawyer has read the paper from Jacob's cabinet again. A cross without
      witnesses, he says, is worth in court about what the paper is worth. Silas
      knew that; that's why he laughed. In the saloon he now tells his story with a
      new ending – an envelope with three thousand dollars. A gentleman from
      Hallstead, says the landlord, wrote it all down.
  conditions: { minChapter: 2, maxChapter: 2 }
  marked: [silas_schweigegeld]
  delay: 4
  certain: true
  choices:
    - id: notar
      label: { de: "Noch einmal zahlen – diesmal vor Notar und Zeugen (5.000 $)", en: "Pay again – this time before a notary and witnesses (5,000 $)" }
      result:
        de: >-
          Silas unterschreibt vor dem Notar, wieder mit einem Kreuz, diesmal mit zwei
          Zeugen. „Jetzt bin ich teuer, Junge“, sagt er. Im Saloon erzählt er nichts
          mehr. Der Notar führt ein Register, und Register lesen andere auch.
        en: >-
          Silas signs before the notary, with a cross again, this time with two
          witnesses. "Now I'm expensive, boy," he says. He tells nothing more in the
          saloon. The notary keeps a register, and other people read registers too.
      requires: { minCash: 5000 }
      effects: { cash: -5000, trace: { severity: 4, label: "Beurkundetes Schweigegeld an Silas Brandt" } }
      marks: [silas_k2_schweigegeld_notar]
    - id: wahrheit
      label: { de: "Zu Silas gehen und ihm sagen, was damals wirklich war", en: "Go to Silas and tell him what really happened back then" }
      result:
        de: >-
          Jacob sitzt eine Stunde in Silas' Hütte. Er redet, Silas nicht. Am Ende legt
          Silas den Umschlag auf den Tisch, halb leer. „Den Rest hab ich vertrunken“,
          sagt er. „War eh kein gutes Geld.“ Das Papier verbrennen sie zusammen im Ofen.
        en: >-
          Jacob sits in Silas's hut for an hour. He talks; Silas doesn't. At the end
          Silas puts the envelope on the table, half empty. "I drank the rest," he
          says. "Wasn't good money anyway." They burn the paper together in the stove.
      effects: { strength: -12, cash: 1500, trace: { severity: -2 }, reputation: { workers: 3 } }
      marks: [silas_k2_spaete_wahrheit]
      appointments: 2
    - id: liegen_lassen
      label: { de: "Das Papier im Schrank lassen", en: "Leave the paper in the cabinet" }
      result:
        de: >-
          Das Papier bleibt im Schrank, die Geschichte im Saloon. Zwei Bohrmeister
          fragen beim Zahltag, ob in ihren Umschlägen auch etwas fürs Schweigen sei.
        en: >-
          The paper stays in the cabinet, the story in the saloon. On payday two
          drilling bosses ask whether there's something for silence in their
          envelopes too.
      effects: { reputation: { workers: -6 }, heat: 2 }
      appointments: 0
      default: true
