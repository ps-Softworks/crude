# Kapitel 1 – Der Arzt (2.7, GDD §4: „Arzt oder Kur (kostet Geld): +10, einmal pro
# Kapitel“). Entwurf von Claude, bitte in eigener Stimme umschreiben. Kraft ist nie
# als Zahl sichtbar – der Arzt spricht es an. Kommt nur, wenn Jacob erschöpft ist
# (maxStrength 29 = unter agenda.errorsBelow).

- id: arzt_besuch
  visitor: arzt
  title:
    de: Doktor Haskell klopft
    en: Doctor Haskell Knocks
  text:
    de: >-
      Ruth hat den Doktor geholt, ohne Jacob zu fragen. Haskell horcht ihn ab,
      lässt ihn die Hand ausstrecken und sieht zu, wie sie zittert. „Sie brennen
      an beiden Enden, Mr. Harlan. Noch ein Winter so, und ich komme mit dem
      Bestatter wieder.“
    en: >-
      Ruth fetched the doctor without asking Jacob. Haskell listens to his chest,
      has him hold out his hand and watches it tremble. "You're burning at both
      ends, Mr. Harlan. One more winter like this and I'll be back with the undertaker."
  conditions: { maxStrength: 29 }
  chance: 0.7
  once: true
  choices:
    - id: kur
      label: { de: "Tun, was der Doktor sagt – Tropfen und eine Woche Ruhe (40 $)", en: "Do as the doctor says – drops and a week of rest (40 $)" }
      result:
        de: Eine Woche lang führt Ruth das Geschäft vom Küchentisch aus. Jacob schläft, isst und schläft.
        en: For a week Ruth runs the business from the kitchen table. Jacob sleeps, eats and sleeps.
      requires: { minCash: 40 }
      appointments: 2
      effects: { cash: -40, strength: 15, ruth: 3 }
    - id: wegschicken
      label: { de: "Den Doktor bezahlen und wegschicken (10 $)", en: "Pay the doctor and send him away (10 $)" }
      result:
        de: Haskell nimmt die 10 $ und lässt eine Flasche Tropfen da. „Für die Witwe“, sagt er an der Tür.
        en: Haskell takes the 10 $ and leaves a bottle of drops. "For the widow," he says at the door.
      appointments: 0
      effects: { cash: -10, ruth: -3 }
      default: true
