# Kapitel 1 – Story-Bogen Silas Brandt (2.9, GDD §12, Weltbibel).
# Entwurf – Philipp überarbeitet. Alle Texte hier sind Entwürfe von Claude.
#
# Silas hat Jacob den Bohrturm geliehen und soll dafür 30 % der ersten Quellen
# bekommen. Der Bogen kommt in jeder Partie (certain: true):
#
#   Runde 8+  silas_abrechnung  Die Abrechnung – fair beteiligen (Silas bleibt Bohrmeister:
#                               Stahlgestänge, halbes Risiko), auskaufen (der Turm mit
#                               Dampfmaschine gehört Jacob) oder betrügen
#   danach    silas_saloon      (betrogen) Silas redet – doch noch zahlen oder ihn reden
#                               lassen (Pachten bis Kapitelende teurer, späterer Kronzeuge)
#
# Spielspaß K1 (Weichen statt Alltagspost): Das gerissene Seil, die Nachtschicht und der
# Abschied sind gestrichen – die Folgen stehen jetzt direkt an der Abrechnung.
#
# Wie der Bogen ausgeht, liest content/arcs.yaml aus den Merkzeichen ab.
# Merkzeichen für spätere Kapitel: silas_fair, silas_ausgekauft, silas_betrogen,
# silas_versoehnt, silas_kronzeuge (Weltbibel: Freund oder Kronzeuge).

# Entwurf – Philipp überarbeitet.
- id: silas_abrechnung
  visitor: silas
  title:
    de: Die Abrechnung
    en: The Reckoning
  text:
    de: >-
      Silas sitzt nüchtern auf der Kiste vor Jacobs Bude, den Hut zwischen den
      Knien. Er hat Schulden beim Schmied und eine Rechnung im Saloon. „Dreißig
      vom Hundert, Junge, so war's abgemacht. Ich will nur wissen, woran ich bin.“
      Ruth hat die Zahlen. Jacob hat das letzte Wort.
    en: >-
      Silas sits sober on the crate outside Jacob's shack, hat between his knees.
      He owes the blacksmith and the saloon. "Thirty in a hundred, boy, that was the
      deal. I just want to know where I stand." Ruth has the figures. Jacob has the
      last word.
  conditions: { minRound: 8, maxChapter: 1 }
  certain: true
  choices:
    - id: fair
      label: { de: "Ihm {cash} auf seinen Anteil zahlen und ihn als Bohrmeister behalten", en: "Pay him {cash} against his share and keep him on as driller" }
      result:
        de: >-
          Ruth setzt den Vertrag auf, Silas malt seinen Namen darunter, langsam wie
          ein Schuljunge. Dann lacht er so laut, dass die Pferde scheuen. Am nächsten
          Morgen zieht er Stahlgestänge in seinen Turm: Unfälle und klemmendes Werkzeug
          nur noch halb so oft.
        en: >-
          Ruth draws up the contract and Silas paints his name beneath it, slow as a
          schoolboy. Then he laughs so loudly the horses shy. Next morning he fits steel
          rods to his rig: accidents and stuck tools only half as often.
      requires: { minCash: 500 }
      effects: { cash: -500 }
      rig: rods
      marks: [silas_fair]
    - id: auskaufen
      label: { de: "Seinen Anteil für {cash} ablösen – der Turm samt Dampfmaschine gehört dann Jacob", en: "Buy out his share for {cash} – the rig and its steam engine are Jacob's" }
      result:
        de: >-
          Silas zählt die Scheine auf dem Fass. „Ist ehrliches Geld“, sagt er.
          „Nur nicht so viel, wie es mal hätte werden können.“ Die Dampfmaschine, die
          er für den Turm bestellt hatte, lässt er stehen: Jacob bohrt billiger und
          eine Runde schneller.
        en: >-
          Silas counts the bills on the barrel. "It's honest money," he says. "Just
          not as much as it might have been." He leaves behind the steam engine he had
          ordered for the rig: Jacob drills cheaper and a round faster.
      requires: { minCash: 1000 }
      effects: { cash: -1000 }
      rig: steam
      marks: [silas_ausgekauft]
    - id: betruegen
      label: { de: "Ihm Bücher zeigen, in denen kein Gewinn steht – das Geld bleibt bei Jacob", en: "Show him books in which there is no profit – the money stays with Jacob" }
      result:
        de: >-
          Silas kann die Zahlen nicht lesen, aber er kann Jacobs Gesicht lesen. Er
          steht auf, setzt den Hut auf und geht, ohne sich umzudrehen.
        en: >-
          Silas cannot read the figures, but he can read Jacob's face. He gets up,
          puts on his hat and leaves without looking back.
      marks: [silas_betrogen]
      default: true

# Entwurf – Philipp überarbeitet.
# Nachwirkung (betrogen): Silas redet im Saloon.
- id: silas_saloon
  title:
    de: Silas redet
    en: Silas Talks
  text:
    de: >-
      Im Saloon steht Silas auf einem Stuhl und erzählt jedem, der es hören will,
      wie Jacob Harlan rechnet. Eine junge Frau mit Notizbuch hört besonders genau
      zu. Der Wirt schickt einen Jungen zu Jacob.
    en: >-
      In the saloon Silas stands on a chair and tells anyone who will listen how
      Jacob Harlan does his sums. A young woman with a notebook listens especially
      closely. The barkeeper sends a boy to fetch Jacob.
  marked: [silas_betrogen]
  delay: 2
  certain: true
  conditions: { maxChapter: 1 }   # sicheres Ereignis: nur Kapitel 1
  choices:
    - id: nachzahlen
      label: { de: "Hingehen und ihm doch noch seinen Anteil zahlen ({cash})", en: "Go and pay him his share after all ({cash})" }
      result:
        de: >-
          Silas steigt vom Stuhl und starrt auf das Geld. „Spät“, sagt er. Dann
          nimmt er es doch, und die Geschichte endet mitten im Satz.
        en: >-
          Silas climbs down from the chair and stares at the money. "Late," he says.
          Then he takes it anyway, and the story ends in mid-sentence.
      requires: { minCash: 800 }
      effects: { cash: -800 }
      marks: [silas_versoehnt]
    - id: reden_lassen
      label: { de: "Ihn reden lassen – wer glaubt schon einem Säufer", en: "Let him talk – who believes a drunk" }
      result:
        de: >-
          Silas redet bis zur Sperrstunde. Die Frau mit dem Notizbuch schreibt
          jedes Wort mit. Am Salt Hill weiß bald jeder Farmer, wie Harlan rechnet:
          Pachten kosten bis Kapitelende ein Fünftel mehr.
        en: >-
          Silas talks until closing time. The woman with the notebook writes down
          every word. Soon every farmer on Salt Hill knows how Harlan does his sums:
          leases cost a fifth more until the end of the chapter.
      appointments: 0
      effects: { leaseCost: 0.2 }
      lasting: true
      marks: [silas_kronzeuge]
      default: true
