# Kapitel 2 – Rivalen-Diplomatie und Crane-Nachfolge (4.10, GDD §9, §13). Entwurf von Claude,
# bitte in eigener Stimme umschreiben. Vorlage und Erklärung: docs/ereignis-vorlage.md
#
# Diese Ereignisse kommen erst, wenn die Simulation die Diplomatie startet (Kapitel 2):
# Sie hängen alle an Merkzeichen, die nur src/sim/diplomacy*.ts setzt. In Kapitel 1
# erscheint keins davon.
#
# Merkzeichen der Simulation (src/sim/diplomacyCore.ts, DIPLO_MARKS – Namen nicht ändern):
#   k2_diplomatie          die Diplomatie hat begonnen (Kapitelstart)
#   k2_nachfolge_margaret  Margaret Crane hat den Aufsichtsrat gewonnen
#   k2_nachfolge_pruett    Harold Pruett hat den Aufsichtsrat gewonnen
#   k2_trust_zerschlagen   das Gericht hat den Crane Trust zerschlagen
#   k2_verband_gegruendet  Rosa Delgado hat den Produzentenverband gegründet
#   k2_verband_uebernommen Jacob war schon in Kapitel 1 in Delgados Verband (delgado_verband) – er ist gleich Mitglied
#   k2_verband_zu_gross    Harlan Oil ist für Delgado selbst ein Trust geworden
#   k2_verrat              Jacob hat zum ersten Mal eine Absprache gebrochen
#   k2_hintergangen        ein Rivale hat zum ersten Mal eine Absprache mit Jacob gebrochen
#
# Merkzeichen aus Antworten, die die Simulation liest (je genau einmal):
#   k2_crane_abschied      beide Erben trauen Jacob mehr (diplomacy.succession.farewellTrust)
#   k2_rueckhalt_margaret  Zusage an Margaret: ihr Anteil im Aufsichtsrat steigt (visitShift)
#   k2_rueckhalt_pruett    Zusage an Pruett – beiden zugesagt = doppeltes Spiel (doubleGameTrust)
#   k2_gratuliert          die neue Führung traut Jacob mehr (congratsTrust)
#   k2_verband_beitritt    Jacob tritt dem Verband bei (Beitrag je Runde: guild.dues)
#   k2_verband_abgelehnt   Delgado traut Jacob weniger (guild.leaveTrust)
#   k2_verband_austritt    Jacob tritt freiwillig aus (ohne Groll)
#   k2_verband_streit      Delgado schließt Jacob aus (Groll: guild.fightGrudge)
#   k2_entschuldigt        Branchen-Respekt kommt zur Hälfte zurück (relations.betrayalRespect / 2)
#   k2_angeprangert        Respekt + betrayalRespect / 3; wer zuletzt gebrochen hat: Groll + 10 (wiederholbar)
#   k2_verband_kuendigung  schon aus Kapitel 1 im Verband, kündigt beim Neubeginn (guild.leaveTrust)
#
# Anlässe (setzt die Simulation JEDES MAL neu; das Ereignis kommt in der Runde danach,
# danach löscht die Simulation den Anlass wieder – deshalb „once: false“):
#   k2_angebot_<rivale>_<art>  ein Rivale bietet eine Absprache an (art: price, territory, supply, cross)
#   k2_angebot_pruett_buyout   Pruett will Harlan Oil kaufen (Jacob steht vor der Pleite)
#   k2_rache_<rivale>          ein Rivale hat sich gerächt (GDD §9.5)
#   k2_bruch                   ein Rivale hat eine Absprache gebrochen (jedes Mal)
#   k2_krisenkauf              Pruett hat in der Krise eine kleine Firma geschluckt
#
# Wiederholbare Antworten (die Simulation liest sie sooft sie kommen):
#   k2_angebot_<rivale>_<art>_ja / _nein   Angebot annehmen / ablehnen (Ablehnen: Groll + pacts.declineGrudge)
#   k2_rache_<rivale>_versoehnt            Versöhnung: Groll − relations.reconcileGrudge
#   k2_krisenkauf_hilfe                    Delgado traut Jacob mehr, Pruett grollt (takeovers.crisisHelp…)
# Ohne Antwort (Standard-Wahl) verfällt ein Angebot einfach – es liegt bis dahin auch an der
# Pinnwand unter „Absprachen“. Jedes Angebot, das balance.yaml einem Rivalen erlaubt
# (diplomacy.rivals.<rivale>.kinds), braucht hier einen Brief (ein Test prüft das).

# --- Nachfolge im Crane Trust -------------------------------------------------

- id: k2_crane_rueckzug
  conditions: { minChapter: 1, maxChapter: 2 }   # Der Nachfolgekampf beginnt mit der Diplomatie in Kapitel 2 – in Kapitel 3 (4.19) ist er entschieden
  notMarked: [crane_abgelehnt, crane_abschlag, crane_treue]
  visitor: crane
  certain: true
  marked: [k2_diplomatie]
  draft: true                # Schlüsselszene: Cornelius Crane tritt ab, der Nachfolgekampf beginnt
  title:
    de: Cornelius Crane nimmt Abschied
    en: Cornelius Crane Takes His Leave
  text:
    de: >-
      Cornelius Crane ist alt geworden. Er setzt sich unaufgefordert, legt den
      Zylinder auf Jacobs Schreibtisch und sieht lange aus dem Fenster. „Ich höre
      auf, Harlan. Der Aufsichtsrat wählt meinen Nachfolger – Margaret oder Pruett.
      Beide werden an Ihre Tür klopfen. Ich wollte, dass Sie es von mir hören.“
    en: >-
      Cornelius Crane has grown old. He sits down without being asked, sets his top
      hat on Jacob's desk and looks out of the window for a long time. "I'm stepping
      down, Harlan. The board will choose my successor – Margaret or Pruett. Both
      will come knocking at your door. I wanted you to hear it from me."
  choices:
    - id: zuhoeren
      label: { de: "Ihm zuhören und zum Abschied die Hand geben", en: "Listen to him and shake his hand in farewell" }
      result:
        de: >-
          Crane erzählt eine Stunde lang von Port Ellis, als es noch drei Tanks gab.
          Beim Gehen sagt er: „Sie waren ein würdiger Gegner.“ Margaret und Pruett
          werden davon hören.
        en: >-
          For an hour Crane talks about Port Ellis when it had only three tanks. As
          he leaves he says: "You were a worthy opponent." Margaret and Pruett will
          hear about it.
      marks: [k2_crane_abschied]
      appointments: 1
    - id: kurz
      label: { de: "Ihn höflich zur Tür bringen", en: "Politely see him to the door" }
      result:
        de: Crane nickt, als hätte er nichts anderes erwartet, und geht.
        en: Crane nods as if he had expected nothing else, and leaves.
      appointments: 0
      default: true

