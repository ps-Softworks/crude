- id: k2_margaret_besuch
  conditions: { minChapter: 1, maxChapter: 2 }   # Der Nachfolgekampf beginnt mit der Diplomatie in Kapitel 2 – in Kapitel 3 (4.19) ist er entschieden
  visitor: margaret
  certain: true
  marked: [k2_diplomatie]
  delay: 1
  title:
    de: Margaret Crane
    en: Margaret Crane
  text:
    de: >-
      Margaret Crane kommt ohne Anmeldung und ohne Begleitung. Sie führt Crane Eastern, die Ostküstensparte des Trusts: Tankstellen, Werbung, Kunden. „Pruett will den
      Trust zu einer Buchhaltung machen. Ich will ihn zu einer Marke machen. Dafür
      brauche ich Öl – und Leute im Aufsichtsrat, die wissen, wer es liefert.“
    en: >-
      Margaret Crane arrives unannounced and alone. She runs Crane Eastern, the Trust's East Coast division: filling stations, advertising, customers. "Pruett wants to turn the
      Trust into a ledger. I want to turn it into a brand. For that I need oil – and
      people on the board who know who supplies it."
  choices:
    - id: zusagen
      label: { de: "Ihr Rückhalt im Aufsichtsrat zusagen", en: "Promise her support on the board" }
      result:
        de: Margaret lächelt knapp. „Ich merke mir, wer früh an meiner Seite stand.“
        en: Margaret smiles briefly. "I remember who stood by me early."
      marks: [k2_rueckhalt_margaret]
    - id: unverbindlich
      label: { de: "Freundlich, aber unverbindlich bleiben", en: "Stay friendly but noncommittal" }
      result:
        de: „Wie Sie meinen.“ Sie zieht die Handschuhe wieder an. „Die Entscheidung fällt ohne Sie, Mr. Harlan.“
        en: '"As you wish." She pulls her gloves back on. "The decision will be made without you, Mr. Harlan."'
      appointments: 0
      default: true

- id: k2_pruett_besuch
  conditions: { minChapter: 1, maxChapter: 2 }   # Der Nachfolgekampf beginnt mit der Diplomatie in Kapitel 2 – in Kapitel 3 (4.19) ist er entschieden
  visitor: pruett
  certain: true
  marked: [k2_diplomatie]
  delay: 2
  title:
    de: Harold Pruett
    en: Harold Pruett
  text:
    de: >-
      Harold Pruett, Chef von Crane Midland, der Sparte des Trusts im Mittleren Westen, legt eine Mappe mit Kostentabellen auf
      den Tisch, bevor er Guten Tag sagt. „Margaret gibt Geld für Plakate aus. Ich
      spare es. Wer mit mir rechnet, Mr. Harlan, kann mit stabilen Preisen rechnen.“
    en: >-
      Harold Pruett, head of Crane Midland, the Trust's Midwest division, puts a folder of cost tables on the desk before
      he says good day. "Margaret spends money on billboards. I save it. Whoever
      counts on me, Mr. Harlan, can count on stable prices."
  choices:
    - id: zusagen
      label: { de: "Ihm Rückhalt im Aufsichtsrat zusagen", en: "Promise him support on the board" }
      result:
        de: Pruett notiert etwas in seiner Mappe. „Gut. Ich vergesse keine Zahl und keinen Namen.“
        en: Pruett writes something in his folder. "Good. I never forget a number or a name."
      marks: [k2_rueckhalt_pruett]
    - id: unverbindlich
      label: { de: "Die Mappe zurückgeben, ohne etwas zu versprechen", en: "Hand back the folder without promising anything" }
      result:
        de: Pruett nimmt die Mappe, als wäre nichts gewesen. Man sieht ihm nicht an, ob er gekränkt ist.
        en: Pruett takes the folder as if nothing had happened. You can't tell whether he is offended.
      appointments: 0
      default: true

- id: k2_nachfolge_margaret
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: margaret
  certain: true
  marked: [k2_nachfolge_margaret]
  title:
    de: Margaret Crane führt den Trust
    en: Margaret Crane Leads the Trust
  text:
    de: >-
      Der Aufsichtsrat hat gewählt. Margaret Crane kommt in einem neuen Automobil
      vorgefahren, mit dem Wappen des Trusts auf der Tür. „Ab jetzt zahlt der Trust
      seinen Partnern mehr als den anderen. Die Frage ist, Mr. Harlan, was Sie sind.“
    en: >-
      The board has voted. Margaret Crane pulls up in a new automobile with the
      Trust's crest on the door. "From now on the Trust pays its partners more than
      the others. The question, Mr. Harlan, is which you are."
  choices:
    - id: gratulieren
      label: { de: "Gratulieren und Blumen schicken lassen (50 $)", en: "Congratulate her and have flowers sent (50 $)" }
      result:
        de: Am nächsten Tag kommt eine Karte zurück, mit Tinte statt Schreibmaschine. Das ist bei ihr viel.
        en: The next day a card comes back, written in ink rather than typed. With her, that means a lot.
      requires: { minCash: 50 }
      effects: { cash: -50 }
      marks: [k2_gratuliert]
    - id: abwarten
      label: { de: "Abwarten, was sie daraus macht", en: "Wait and see what she makes of it" }
      result:
        de: Margaret steigt wieder ein. Der Motor läuft noch.
        en: Margaret gets back in. The engine is still running.
      appointments: 0
      default: true

- id: k2_nachfolge_pruett
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: pruett
  certain: true
  marked: [k2_nachfolge_pruett]
  title:
    de: Harold Pruett führt den Trust
    en: Harold Pruett Leads the Trust
  text:
    de: >-
      Pruett hat gewonnen. Er kommt mit derselben Mappe wie damals, nur dicker.
      „Der Trust spart jetzt. Auch beim Posted Price. Wer mit mir eine Absprache
      hat, spürt es nicht. Die anderen schon.“
    en: >-
      Pruett has won. He arrives with the same folder as before, only thicker. "The
      Trust is economizing now. Including on the posted price. Those who have an
      agreement with me won't feel it. The others will."
  choices:
    - id: gratulieren
      label: { de: "Ihm förmlich gratulieren (50 $ für ein Essen im Hotel)", en: "Congratulate him formally (50 $ for a hotel dinner)" }
      result:
        de: Pruett isst wenig und bezahlt sein Getränk selbst. Aber er bleibt bis zum Kaffee.
        en: Pruett eats little and pays for his own drink. But he stays for coffee.
      requires: { minCash: 50 }
      effects: { cash: -50 }
      marks: [k2_gratuliert]
    - id: abwarten
      label: { de: "Nur nicken", en: "Just nod" }
      result:
        de: Pruett nickt zurück. Ein Mann, der Zahlen versteht, braucht keine Worte.
        en: Pruett nods back. A man who understands numbers needs no words.
      appointments: 0
      default: true

- id: k2_trust_zerschlagen
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  marked: [k2_trust_zerschlagen]
  deadline: 2
  title:
    de: Der Crane Trust wird zerschlagen
    en: The Crane Trust Is Broken Up
  text:
    de: >-
      Sonderausgabe, noch druckfeucht: Das Gericht in Hallstead zerschlägt den Crane
      Trust. Aus den Sparten werden eigene Firmen: Margaret Crane behält Crane Eastern, die Ostküste, Harold Pruett Crane Midland, die Pipelines im Mittleren Westen. Beide brauchen jetzt Öl –
      und bieten gegeneinander.
    en: >-
      Special edition, ink still wet: the court in Hallstead breaks up the Crane
      Trust. The divisions become companies of their own: Margaret Crane keeps Crane Eastern, the East Coast, Harold Pruett Crane Midland, the Midwest pipelines. Both now need oil – and are bidding
      against each other.
  choices:
    - id: gratulieren
      label: { de: "Beiden zum neuen Anfang schreiben (50 $ Telegramme)", en: "Write to both on their fresh start (50 $ in telegrams)" }
      result:
        de: Zwei Antworten, beide höflich, beide kühl. Aber beide haben geantwortet.
        en: Two replies, both polite, both cool. But both replied.
      requires: { minCash: 50 }
      effects: { cash: -50 }
      marks: [k2_gratuliert]
      appointments: 0
    - id: weglegen
      label: { de: "Die Zeitung weglegen", en: "Put the paper down" }
      result:
        de: Draußen hupt ein Automobil. Die Welt ist eine andere als heute Morgen.
        en: Outside an automobile honks. The world is different from this morning.
      appointments: 0
      default: true

# --- Delgados Produzentenverband ---------------------------------------------

- id: k2_verband_gruendung
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: delgado
  certain: true
  marked: [k2_verband_gegruendet]
  notMarked: [k2_verband_uebernommen]   # schon in Kapitel 1 beigetreten → k2_verband_mitglied
  draft: true                # Schlüsselszene: Rosa Delgado gründet den Verband (GDD §13 Kapitel 2)
  title:
    de: Rosa Delgado gründet den Verband
    en: Rosa Delgado Founds the Association
  text:
    de: >-
      Rosa Delgado trägt ein Bündel Unterschriften unter dem Arm, an den Ecken
      ölverschmiert. „Ein Dutzend Unabhängige, Harlan. Gemeinsam verhandeln wir
      gegen den Posted Price, gemeinsam vor Gericht. Wir brauchen Leute wie Sie –
      und Ihren Beitrag, jedes Quartal.“
    en: >-
      Rosa Delgado carries a bundle of signatures under her arm, oil-stained at the
      corners. "A dozen independents, Harlan. Together we bargain against the posted
      price, together we go to court. We need people like you – and your dues, every
      quarter."
  choices:
    - id: beitreten
      label: { de: "Beitreten (Beitrag jedes Quartal)", en: "Join (dues every quarter)" }
      result:
        de: >-
          Jacob unterschreibt unter einem Farmer aus Hollow Creek. Delgado faltet das
          Blatt sorgfältig. „Jetzt sind wir mehr als der Trust denkt.“
        en: >-
          Jacob signs below a farmer from Hollow Creek. Delgado folds the sheet
          carefully. "Now there are more of us than the Trust thinks."
      marks: [k2_verband_beitritt]
    - id: ablehnen
      label: { de: "Ablehnen – Harlan Oil verhandelt allein", en: "Decline – Harlan Oil negotiates alone" }
      result:
        de: „Allein ist man schnell, Harlan. Zusammen kommt man weiter.“ Sie geht zur nächsten Tür.
        en: '"Alone you move fast, Harlan. Together you get further." She goes on to the next door.'
      marks: [k2_verband_abgelehnt]
      appointments: 0
      default: true

- id: k2_verband_mitglied
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: delgado
  certain: true
  marked: [k2_verband_uebernommen]
  delay: 3
  title:
    de: Rosa Delgado mit der neuen Satzung
    en: Rosa Delgado with the New Charter
  text:
    de: >-
      Rosa Delgado legt eine gedruckte Satzung auf den Tisch, die erste mit Stempel.
      „Aus unserem Haufen ist ein Verband geworden, Harlan. Sie waren dabei, als es
      noch drei Farmer und ein Tisch im Saloon waren. Ihr Name steht schon drin –
      es sei denn, Sie wollen ihn streichen.“
    en: >-
      Rosa Delgado puts a printed charter on the desk, the first one with a seal.
      "Our little crowd has become an association, Harlan. You were there when it
      was three farmers and a table in the saloon. Your name is already in it –
      unless you want it struck out."
  choices:
    - id: bleiben
      label: { de: "Dabeibleiben (Beitrag jedes Quartal)", en: "Stay in (dues every quarter)" }
      result:
        de: Delgado klopft zweimal auf die Satzung, wie auf eine Tür. „Dann bis zur Versammlung.“
        en: Delgado knocks twice on the charter, as if on a door. "Then I'll see you at the meeting."
      appointments: 0
      default: true
    - id: kuendigen
      label: { de: "Kündigen – Harlan Oil geht allein weiter", en: "Resign – Harlan Oil goes on alone" }
      result:
        de: >-
          Delgado streicht den Namen selbst, mit einem einzigen geraden Strich.
          „Die anderen werden fragen, warum. Ich sage ihnen, Sie hätten es eilig.“
        en: >-
          Delgado strikes out the name herself, with one straight line. "The others
          will ask why. I'll tell them you were in a hurry."
      marks: [k2_verband_kuendigung]
      appointments: 0

- id: k2_verband_zu_gross
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: delgado
  certain: true
  marked: [k2_verband_zu_gross]
  title:
    de: Delgado stellt Jacob zur Rede
    en: Delgado Confronts Jacob
  text:
    de: >-
      Rosa Delgado bleibt in der Tür stehen. „Im Verband sagen sie, Harlan Oil sei
      selbst schon ein Trust. Ich habe sie verteidigt. Jetzt frage ich Sie: Gegen
      wen kämpfen wir eigentlich noch?“
    en: >-
      Rosa Delgado stays standing in the doorway. "In the association they say
      Harlan Oil is a trust itself already. I defended you. Now I'm asking you: who
      are we still fighting against?"
  choices:
    - id: austreten
      label: { de: "Freiwillig austreten, im Guten", en: "Leave voluntarily, on good terms" }
      result:
        de: Delgado nickt langsam. „Das rechne ich Ihnen an. Mehr nicht.“
        en: Delgado nods slowly. "I'll give you credit for that. Nothing more."
      marks: [k2_verband_austritt]
    - id: wehren
      label: { de: "Sich wehren – der Verband braucht Harlan Oil", en: "Push back – the association needs Harlan Oil" }
      result:
        de: >-
          Die Versammlung stimmt ab. Jacob ist draußen, und die Unabhängigen reden
          über ihn wie früher über Crane.
        en: >-
          The assembly votes. Jacob is out, and the independents talk about him the
          way they used to talk about Crane.
      marks: [k2_verband_streit]
      appointments: 0
      default: true

# --- Verrat ---------------------------------------------------------------------

- id: k2_verrat_gerede
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  marked: [k2_verrat]
  deadline: 2
  title:
    de: Harlans Wort
    en: Harlan's Word
  text:
    de: >-
      In der Börse von Port Ellis erzählt man sich, Harlan halte keine Absprache.
      Eine Notiz von Nora Whitlock liegt bei: „Ich schreibe darüber nächste Woche.
      Möchten Sie etwas dazu sagen?“
    en: >-
      At the Port Ellis exchange they're saying Harlan keeps no agreement. A note
      from Nora Whitlock is enclosed: "I'm writing about it next week. Would you
      like to comment?"
  choices:
    - id: entschuldigen
      label: { de: "Eine Entschuldigung abdrucken lassen und Schaden ersetzen (500 $)", en: "Have an apology printed and make good the damage (500 $)" }
      result:
        de: Die Anzeige steht auf Seite zwei. Manche lachen. Andere nehmen Jacobs Brief wieder an.
        en: The notice runs on page two. Some laugh. Others start accepting Jacob's letters again.
      requires: { minCash: 500 }
      effects: { cash: -500 }
      marks: [k2_entschuldigt]
    - id: schweigen
      label: { de: "Schweigen", en: "Say nothing" }
      result:
        de: Noras Artikel erscheint. Er ist kurz und sachlich – und deshalb umso schlimmer.
        en: Nora's article appears. It is short and factual – and all the worse for it.
      appointments: 0
      default: true

- id: k2_hintergangen_brief
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: personal
  certain: true
  once: false                # kommt bei jedem Bruch (Anlass k2_bruch), nicht nur beim ersten
  marked: [k2_bruch]
  deadline: 2
  title:
    de: Die Absprache ist gebrochen
    en: The Agreement Is Broken
  text:
    de: >-
      Ruth legt Jacob den Brief hin, ohne ein Wort. Ein knapper Satz auf teurem
      Papier: Man sehe sich „aus geschäftlichen Gründen“ nicht mehr an die
      Absprache gebunden. Unterschrift, kein Gruß.
    en: >-
      Ruth puts the letter in front of Jacob without a word. A curt sentence on
      expensive paper: for "business reasons" the sender no longer considers
      himself bound by the agreement. A signature, no regards.
  choices:
    - id: anprangern
      label: { de: "Den Bruch in der Börse und bei Nora Whitlock öffentlich machen", en: "Make the breach public at the exchange and to Nora Whitlock" }
      result:
        de: >-
          Am nächsten Tag weiß ganz Port Ellis, wer sein Wort gebrochen hat. Jacob
          steht gut da. Der andere wird es ihm nicht danken.
        en: >-
          The next day all of Port Ellis knows who broke his word. Jacob looks good.
          The other side won't thank him for it.
      marks: [k2_angeprangert]
    - id: schweigen
      label: { de: "Schweigen und es sich merken", en: "Say nothing and remember it" }
      result:
        de: Jacob legt den Brief in die Schublade. Ganz unten, aber nicht weg.
        en: Jacob puts the letter in the drawer. At the bottom, but not gone.
      appointments: 0
      default: true

# --- Angebote der Rivalen (Briefe; Anlass k2_angebot_<rivale>_<art>) ----------
# Antworten kosten keinen Termin – es ist ein Brief. Das Angebot gilt so lange wie
# der Brief (diplomacy.pacts.offerRounds = deadline).

- id: k2_angebot_margaret_supply
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_margaret_supply]
  deadline: 2
  appointments: 0
  title:
    de: Margaret Crane will Ihr Öl – nur Ihres
    en: Margaret Crane Wants Your Oil – Yours Alone
  text:
    de: >-
      Ein Brief auf Papier mit dem Wappen von Crane Eastern, die Schrift steil und
      schnell: „Meine Tankstellen brauchen einen Lieferanten, auf den ich mich
      verlassen kann. Ich zahle Ihnen mehr als der Posted Price – wenn Sie nur an
      mich liefern. Bullard wird sich einen neuen Abnehmer suchen müssen. M. C.“
    en: >-
      A letter on paper bearing the Crane Eastern crest, the hand steep and quick:
      "My filling stations need a supplier I can rely on. I'll pay you more than the
      posted price – if you supply only me. Bullard will have to find himself a new
      buyer. M. C."
  choices:
    - id: annehmen
      label: { de: "Annehmen – mehr je Barrel, aber Bullard verliert seinen Abnehmer", en: "Accept – more per barrel, but Bullard loses his buyer" }
      result:
        de: Jacob unterschreibt den Liefervertrag. Irgendwo im Saloon wird Bullard davon hören.
        en: Jacob signs the supply contract. Somewhere in the saloon, Bullard will hear about it.
      marks: [k2_angebot_margaret_supply_ja]
    - id: ablehnen
      label: { de: "Ablehnen – Harlan Oil liefert, wem es will", en: "Decline – Harlan Oil sells to whom it pleases" }
      result:
        de: Jacobs Antwort ist kurz und höflich. Margaret wird sie trotzdem als Absage lesen.
        en: Jacob's reply is short and polite. Margaret will still read it as a refusal.
      marks: [k2_angebot_margaret_supply_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Der Brief rutscht unter die anderen. Das Angebot verfällt von selbst.
        en: The letter slides under the others. The offer lapses on its own.
      default: true

- id: k2_angebot_margaret_cross
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_margaret_cross]
  deadline: 2
  appointments: 0
  title:
    de: Margaret Crane schlägt einen Aktientausch vor
    en: Margaret Crane Proposes a Share Swap
  text:
    de: >-
      „Wer sich gegenseitig gehört, kauft sich nicht gegenseitig auf“, schreibt
      Margaret Crane. Sie bietet ein Paket Aktien von Crane Eastern gegen eines von
      Harlan Oil. Der Tausch kostet Jacob Geld, aber danach steht sie zwischen ihm
      und jedem, der seine Firma schlucken will.
    en: >-
      "People who own each other don't buy each other out," writes Margaret Crane.
      She offers a block of Crane Eastern shares for one of Harlan Oil. The swap
      costs Jacob money, but afterwards she stands between him and anyone who
      wants to swallow his company.
  choices:
    - id: annehmen
      label: { de: "Annehmen (3.000 $ für die Aktien)", en: "Accept (3,000 $ for the shares)" }
      result:
        de: Die Aktien liegen im Safe. Margaret und Jacob sind jetzt ein kleines bisschen dieselbe Firma.
        en: The shares lie in the safe. Margaret and Jacob are now, just slightly, the same company.
      requires: { minCash: 3000 }    # = diplomacy.pacts.crossCost (ein Test prüft das)
      marks: [k2_angebot_margaret_cross_ja]
    - id: ablehnen
      label: { de: "Ablehnen – Harlan Oil gehört Harlan", en: "Decline – Harlan Oil belongs to Harlan" }
      result:
        de: Margaret antwortet nicht. Bei ihr ist das eine Antwort.
        en: Margaret doesn't reply. With her, that is a reply.
      marks: [k2_angebot_margaret_cross_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Der Brief bleibt ungeöffnet im Stapel, bis das Angebot verfallen ist.
        en: The letter stays unopened in the pile until the offer has lapsed.
      default: true

- id: k2_angebot_pruett_price
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_pruett_price]
  deadline: 2
  appointments: 0
  title:
    de: Harold Pruett schlägt eine Preisabsprache vor
    en: Harold Pruett Proposes a Price Agreement
  text:
    de: >-
      Eine Tabelle, zwei Spalten, eine Unterschrift. Pruett hat ausgerechnet, um
      wie viel der Preis steigt, wenn Harlan Oil und seine Leute im selben Quartal
      Öl zurückhalten. Darunter, kleiner: „Unter uns. Schriftlich nur dies.“
    en: >-
      A table, two columns, a signature. Pruett has calculated how far the price
      rises if Harlan Oil and his people hold back oil in the same quarter. Below,
      smaller: "Between us. This is all there will be in writing."
  choices:
    - id: annehmen
      label: { de: "Annehmen – mehr je Barrel (unter einem Kartellgesetz verboten)", en: "Accept – more per barrel (illegal under an antitrust law)" }
      result:
        de: Jacob schickt die Tabelle mit einem Haken zurück. Pruett wird sie abheften.
        en: Jacob sends the table back with a tick. Pruett will file it.
      marks: [k2_angebot_pruett_price_ja]
    - id: ablehnen
      label: { de: "Ablehnen", en: "Decline" }
      result:
        de: Pruett notiert die Absage in seiner Mappe. Er notiert alles.
        en: Pruett notes the refusal in his folder. He notes everything.
      marks: [k2_angebot_pruett_price_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Die Tabelle vergilbt im Posteingang. Das Angebot verfällt.
        en: The table yellows in the in-tray. The offer lapses.
      default: true

- id: k2_angebot_pruett_territory
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_pruett_territory]
  deadline: 2
  appointments: 0
  title:
    de: Harold Pruett zieht eine Linie auf der Karte
    en: Harold Pruett Draws a Line on the Map
  text:
    de: >-
      Pruett schickt eine Landkarte mit einem sauberen Bleistiftstrich. Diesseits
      pachtet Harlan Oil, jenseits pachten seine Leute. „Wer sich nicht gegenseitig
      überbietet, zahlt den Farmern weniger. Das ist keine Freundschaft, Mr. Harlan.
      Das ist Rechnen.“
    en: >-
      Pruett sends a map with a neat pencil line. On this side Harlan Oil leases,
      on the other side his people do. "Those who don't outbid each other pay the
      farmers less. That's not friendship, Mr. Harlan. That's arithmetic."
  choices:
    - id: annehmen
      label: { de: "Annehmen – Pachten billiger (unter einem Kartellgesetz verboten)", en: "Accept – cheaper leases (illegal under an antitrust law)" }
      result:
        de: Jacob zeichnet den Strich mit Tinte nach und schickt die Karte zurück.
        en: Jacob traces the line in ink and sends the map back.
      marks: [k2_angebot_pruett_territory_ja]
    - id: ablehnen
      label: { de: "Ablehnen – das Land gehört dem, der zuerst kommt", en: "Decline – the land belongs to whoever gets there first" }
      result:
        de: Die Karte geht unbeschriftet zurück. Pruett wird es verstehen.
        en: The map goes back unmarked. Pruett will understand.
      marks: [k2_angebot_pruett_territory_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Die Karte bleibt gefaltet. Das Angebot verfällt.
        en: The map stays folded. The offer lapses.
      default: true

- id: k2_angebot_pruett_cross
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_pruett_cross]
  deadline: 2
  appointments: 0
  title:
    de: Harold Pruett bietet einen Aktientausch an
    en: Harold Pruett Offers a Share Swap
  text:
    de: >-
      „Eine Versicherung“, schreibt Pruett. Er bietet Aktien seiner Gesellschaft
      gegen Aktien von Harlan Oil, mit einer Aufstellung, was das Jacob kostet und
      was es ihm erspart, falls jemand Harlan Oil an der Börse kaufen will.
    en: >-
      "An insurance policy," writes Pruett. He offers shares in his company for
      shares in Harlan Oil, with a statement of what it costs Jacob and what it
      saves him if anyone tries to buy Harlan Oil on the exchange.
  choices:
    - id: annehmen
      label: { de: "Annehmen (3.000 $ für die Aktien)", en: "Accept (3,000 $ for the shares)" }
      result:
        de: Pruett bestätigt den Eingang mit einer Quittung. Auf den Cent genau.
        en: Pruett confirms receipt with a receipt. To the cent.
      requires: { minCash: 3000 }    # = diplomacy.pacts.crossCost
      marks: [k2_angebot_pruett_cross_ja]
    - id: ablehnen
      label: { de: "Ablehnen", en: "Decline" }
      result:
        de: Die Aufstellung geht zurück. Pruett wird eine neue anlegen, ohne Harlan Oil.
        en: The statement goes back. Pruett will draw up a new one, without Harlan Oil.
      marks: [k2_angebot_pruett_cross_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Das Angebot verfällt.
        en: The offer lapses.
      default: true

- id: k2_angebot_bullard_price
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_bullard_price]
  deadline: 2
  appointments: 0
  title:
    de: Bullard will den Preis hochtreiben
    en: Bullard Wants to Drive the Price Up
  text:
    de: >-
      Bullards Brief ist mit Bleistift geschrieben und riecht nach Zigarre. „Harlan.
      Wenn wir beide einen Monat lang weniger nach Port Ellis schicken, zahlt der
      Trust, was wir wollen. Schlag ein oder lass es. Big Jim.“
    en: >-
      Bullard's letter is written in pencil and smells of cigar. "Harlan. If we both
      send less to Port Ellis for a month, the Trust pays what we want. Shake on it
      or don't. Big Jim."
  choices:
    - id: annehmen
      label: { de: "Einschlagen – mehr je Barrel (unter einem Kartellgesetz verboten)", en: "Shake on it – more per barrel (illegal under an antitrust law)" }
      result:
        de: Jacob schreibt ein Wort unter Bullards Brief und schickt ihn zurück. „Abgemacht.“
        en: Jacob writes one word under Bullard's letter and sends it back. "Deal."
      marks: [k2_angebot_bullard_price_ja]
    - id: ablehnen
      label: { de: "Ablehnen", en: "Decline" }
      result:
        de: Bullard flucht so laut, dass man es angeblich bis zur Bahnstation hört.
        en: Bullard swears so loudly that they say you could hear it at the railway station.
      marks: [k2_angebot_bullard_price_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Bullard wartet nicht gern. Das Angebot verfällt.
        en: Bullard doesn't like waiting. The offer lapses.
      default: true

- id: k2_angebot_bullard_territory
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_bullard_territory]
  deadline: 2
  appointments: 0
  title:
    de: Bullard will das Revier teilen
    en: Bullard Wants to Split the Territory
  text:
    de: >-
      „Du nimmst den Osten, ich den Westen. Keiner bietet dem anderen die Pacht weg.
      Die Farmer werden heulen, aber die heulen sowieso.“ Darunter ein Daumenabdruck
      in Öl, wo andere ihr Siegel setzen.
    en: >-
      "You take the east, I take the west. Nobody bids the other's lease away. The
      farmers will howl, but they howl anyway." Below, a thumbprint in oil where
      others would put a seal.
  choices:
    - id: annehmen
      label: { de: "Einschlagen – Pachten billiger (unter einem Kartellgesetz verboten)", en: "Shake on it – cheaper leases (illegal under an antitrust law)" }
      result:
        de: Jacob setzt seinen eigenen Daumen daneben. Bullard wird lachen, wenn er es sieht.
        en: Jacob puts his own thumb next to it. Bullard will laugh when he sees it.
      marks: [k2_angebot_bullard_territory_ja]
    - id: ablehnen
      label: { de: "Ablehnen – Harlan Oil pachtet, wo es will", en: "Decline – Harlan Oil leases where it likes" }
      result:
        de: Bullard schickt den Brief zerknüllt zurück. Mehr braucht er nicht zu sagen.
        en: Bullard sends the letter back crumpled. He needs to say no more.
      marks: [k2_angebot_bullard_territory_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Das Angebot verfällt.
        en: The offer lapses.
      default: true

- id: k2_angebot_bullard_cross
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_bullard_cross]
  deadline: 2
  appointments: 0
  title:
    de: Bullard will Anteile tauschen
    en: Bullard Wants to Swap Stakes
  text:
    de: >-
      „Die feinen Herren in Port Ellis kaufen uns Kleine einen nach dem anderen“,
      schreibt Bullard. „Gib mir ein Stück von Harlan Oil, ich geb dir ein Stück von
      meinem Laden. Dann müssen sie uns beide schlucken, und daran verschlucken sie sich.“
    en: >-
      "The fine gentlemen in Port Ellis are buying us small fry one after another,"
      writes Bullard. "Give me a piece of Harlan Oil, I'll give you a piece of my
      outfit. Then they have to swallow both of us, and they'll choke on it."
  choices:
    - id: annehmen
      label: { de: "Annehmen (3.000 $ für die Anteile)", en: "Accept (3,000 $ for the stake)" }
      result:
        de: Bullard kommt persönlich, um die Papiere zu holen, und trinkt Jacobs Whiskey aus.
        en: Bullard comes in person to collect the papers and finishes Jacob's whiskey.
      requires: { minCash: 3000 }    # = diplomacy.pacts.crossCost
      marks: [k2_angebot_bullard_cross_ja]
    - id: ablehnen
      label: { de: "Ablehnen", en: "Decline" }
      result:
        de: „Wie du willst“, steht auf der Rückseite einer Rechnung. Mehr nicht.
        en: '"Suit yourself," it says on the back of an invoice. Nothing more.'
      marks: [k2_angebot_bullard_cross_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Das Angebot verfällt.
        en: The offer lapses.
      default: true

- id: k2_angebot_thorne_cross
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: offer
  certain: true
  once: false
  marked: [k2_angebot_thorne_cross]
  deadline: 2
  appointments: 0
  title:
    de: Augustus Thorne bietet eine Beteiligung an
    en: Augustus Thorne Offers a Holding
  text:
    de: >-
      Die Trust Bank schreibt auf Büttenpapier. Mr. Thorne regt einen „freundschaftlichen
      Austausch von Anteilen“ an: Bahn und Bohrturm, eine Familie. Wer die Zeilen
      zweimal liest, merkt, wie gern Thorne einen Fuß in Jacobs Tür hätte.
    en: >-
      The Trust Bank writes on handmade paper. Mr. Thorne suggests a "friendly
      exchange of shares": railway and derrick, one family. Read the lines twice and
      you notice how much Thorne would like a foot in Jacob's door.
  choices:
    - id: annehmen
      label: { de: "Annehmen (3.000 $ für die Anteile)", en: "Accept (3,000 $ for the shares)" }
      result:
        de: Thornes Sekretär holt die Papiere ab und verbeugt sich etwas zu tief.
        en: Thorne's secretary collects the papers and bows a little too low.
      requires: { minCash: 3000 }    # = diplomacy.pacts.crossCost
      marks: [k2_angebot_thorne_cross_ja]
    - id: ablehnen
      label: { de: "Höflich ablehnen", en: "Politely decline" }
      result:
        de: Die Bank bedauert. Sie bedauert sehr förmlich.
        en: The bank regrets. It regrets very formally.
      marks: [k2_angebot_thorne_cross_nein]
    - id: liegen
      label: { de: "Liegen lassen", en: "Leave it lying" }
      result:
        de: Das Angebot verfällt.
        en: The offer lapses.
      default: true

# --- Pruett kauft auf -----------------------------------------------------------

- id: k2_angebot_pruett_buyout
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  visitor: pruett
  certain: true
  once: false
  marked: [k2_angebot_pruett_buyout]
  title:
    de: Harold Pruett mit einer Mappe
    en: Harold Pruett with a Folder
  text:
    de: >-
      Pruett steht in der Tür, bevor Ruth ihn ankündigen kann. Er legt eine Mappe auf
      den Tisch: Jacobs Schulden, Jacobs Fristen, alles in sauberen Spalten. Ganz
      unten eine Summe, rund und niedrig. „Ich kaufe Harlan Oil, Mr. Harlan. Heute
      noch zu diesem Preis. Morgen kauft es vielleicht die Bank.“ Die Summe steht
      auch an der Pinnwand unter „Absprachen“.
    en: >-
      Pruett is in the doorway before Ruth can announce him. He puts a folder on the
      desk: Jacob's debts, Jacob's deadlines, all in neat columns. At the very bottom
      a sum, round and low. "I'm buying Harlan Oil, Mr. Harlan. Today, at this price.
      Tomorrow the bank may buy it instead." The sum is also on the pinboard under
      "Agreements".
  choices:
    - id: verkaufen
      label: { de: "Unterschreiben und verkaufen – das Spiel endet", en: "Sign and sell – the game ends" }
      result:
        de: Pruett schraubt seinen Füller zu. „Eine vernünftige Entscheidung.“ Er nimmt die Mappe mit.
        en: Pruett screws the cap back on his pen. "A sensible decision." He takes the folder with him.
      marks: [k2_angebot_pruett_buyout_ja]
    - id: hinaus
      label: { de: "Ihn hinauswerfen", en: "Throw him out" }
      result:
        de: Pruett nimmt die Mappe, als hätte er nichts anderes erwartet. An der Tür notiert er etwas.
        en: Pruett takes the folder as if he had expected nothing else. At the door he writes something down.
      marks: [k2_angebot_pruett_buyout_nein]
    - id: bedenkzeit
      label: { de: "Um Bedenkzeit bitten", en: "Ask for time to think" }
      result:
        de: „Bis übermorgen“, sagt Pruett und lässt eine Abschrift da. Das Angebot gilt so lange.
        en: '"Until the day after tomorrow," says Pruett, and leaves a copy. The offer stands until then.'
      appointments: 0
      default: true

- id: k2_krisenkauf
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_krisenkauf]
  deadline: 2
  title:
    de: Pruett schluckt wieder einen
    en: Pruett Swallows Another One
  text:
    de: >-
      Der Courier meldet es auf Seite drei, zwischen Viehpreisen und Todesanzeigen:
      Wieder hat Harold Pruett eine kleine Bohrfirma aus der Pleite gekauft, für
      einen Bruchteil ihres Werts. Die Bohrleute stehen vor dem Tor und wissen nicht,
      ob sie morgen noch Arbeit haben.
    en: >-
      The Courier reports it on page three, between cattle prices and obituaries:
      once again Harold Pruett has bought a small drilling outfit out of bankruptcy,
      for a fraction of its value. The drillers stand at the gate and don't know if
      they'll still have work tomorrow.
  choices:
    - id: helfen
      label: { de: "Den Bohrleuten Arbeit bei Harlan Oil anbieten (300 $)", en: "Offer the drillers work at Harlan Oil (300 $)" }
      result:
        de: >-
          Ein Dutzend Männer kommt am Montag mit ihren Werkzeugkisten. Delgado hört
          davon und nickt. Pruett hört auch davon.
        en: >-
          A dozen men turn up on Monday with their toolboxes. Delgado hears of it and
          nods. Pruett hears of it too.
      requires: { minCash: 300 }
      effects: { cash: -300 }
      marks: [k2_krisenkauf_hilfe]
    - id: weglegen
      label: { de: "Die Zeitung weglegen", en: "Put the paper down" }
      result:
        de: So läuft das Geschäft. Heute trifft es die anderen.
        en: That's how business goes. Today it's the others.
      appointments: 0
      default: true

# --- Rache der Rivalen (GDD §9.5; Anlass k2_rache_<rivale>) ---------------------

- id: k2_rache_margaret
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_rache_margaret]
  deadline: 2
  title:
    de: Crane Eastern zahlt weniger
    en: Crane Eastern Pays Less
  text:
    de: >-
      Die Abrechnung aus Port Ellis kommt mit einem neuen Satz, ohne Erklärung.
      Margaret Crane hat ihren Einkäufern eine Liste gegeben, und Harlan Oil steht
      darauf – ganz oben.
    en: >-
      The statement from Port Ellis arrives with a new rate, without explanation.
      Margaret Crane has given her buyers a list, and Harlan Oil is on it – at the top.
  choices:
    - id: versoehnen
      label: { de: "Ihr Blumen und einen versöhnlichen Brief schicken (200 $)", en: "Send her flowers and a conciliatory letter (200 $)" }
      result:
        de: Die Blumen kommen nicht zurück. Bei Margaret ist das schon ein Anfang.
        en: The flowers don't come back. With Margaret, that is already a start.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [k2_rache_margaret_versoehnt]
    - id: hinnehmen
      label: { de: "Zähneknirschend hinnehmen", en: "Grit your teeth and take it" }
      result:
        de: Jacob legt die Abrechnung zu den anderen. Sie wird nicht leichter.
        en: Jacob puts the statement with the others. It doesn't get any lighter.
      appointments: 0
      default: true

- id: k2_rache_pruett
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_rache_pruett]
  deadline: 2
  title:
    de: Pruett kürzt aus Prinzip
    en: Pruett Cuts on Principle
  text:
    de: >-
      Ein Formbrief der Einkaufsabteilung, unterschrieben von Pruett selbst: Für
      Lieferungen von Harlan Oil gelte „bis auf Weiteres“ ein Abschlag. Die Begründung
      ist eine Zahl, sonst nichts.
    en: >-
      A form letter from the purchasing department, signed by Pruett himself: for
      deliveries from Harlan Oil a discount applies "until further notice". The
      justification is a number, nothing else.
  choices:
    - id: versoehnen
      label: { de: "Ihn zum Essen einladen und die Rechnung übernehmen (200 $)", en: "Invite him to dinner and pick up the bill (200 $)" }
      result:
        de: Pruett isst wenig und sagt noch weniger. Aber er notiert sich den Abend.
        en: Pruett eats little and says even less. But he makes a note of the evening.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [k2_rache_pruett_versoehnt]
    - id: hinnehmen
      label: { de: "Hinnehmen", en: "Take it" }
      result:
        de: Jacob rechnet nach. Pruett hat sich nicht verrechnet.
        en: Jacob does the sums. Pruett hasn't miscalculated.
      appointments: 0
      default: true

- id: k2_rache_bullard
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_rache_bullard]
  deadline: 2
  title:
    de: Bullard bietet überall mit
    en: Bullard Bids Everywhere
  text:
    de: >-
      Wo immer Jacobs Landmann auftaucht, war Bullards Mann schon da und hat den
      Farmern mehr versprochen. „Er sagt, er hat Zeit und Geld genug, um Sie zu
      ärgern“, berichtet der Landmann.
    en: >-
      Wherever Jacob's landman turns up, Bullard's man has been there first and
      promised the farmers more. "He says he has time and money enough to annoy
      you," the landman reports.
  choices:
    - id: versoehnen
      label: { de: "Ihm eine Kiste Whiskey in den Saloon schicken (200 $)", en: "Send a case of whiskey to him at the saloon (200 $)" }
      result:
        de: Bullard trinkt den Whiskey mit seinen Leuten. Auf Jacobs Wohl, sagt man – halb im Scherz.
        en: Bullard drinks the whiskey with his men. To Jacob's health, they say – half in jest.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [k2_rache_bullard_versoehnt]
    - id: hinnehmen
      label: { de: "Hinnehmen", en: "Take it" }
      result:
        de: Die Pachten werden teurer. Bullard lacht im Saloon darüber.
        en: The leases get dearer. Bullard laughs about it in the saloon.
      appointments: 0
      default: true

- id: k2_rache_delgado
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_rache_delgado]
  deadline: 2
  title:
    de: Rosa Delgado warnt die Farmer
    en: Rosa Delgado Warns the Farmers
  text:
    de: >-
      In den Gemeindehäusern hängt ein Zettel in Delgados Schrift: Wer an Harlan Oil
      verpachtet, solle den Vertrag zweimal lesen. Die Farmer lesen ihn jetzt dreimal –
      und verlangen mehr.
    en: >-
      A notice in Delgado's handwriting hangs in the meeting halls: anyone leasing to
      Harlan Oil should read the contract twice. The farmers now read it three times –
      and ask for more.
  choices:
    - id: versoehnen
      label: { de: "Der Verbandskasse etwas spenden und sie um ein Gespräch bitten (200 $)", en: "Donate to the association's fund and ask her for a talk (200 $)" }
      result:
        de: Delgado nimmt das Geld für die Witwenkasse und hört zu. Den Zettel hängt sie nicht ab, aber keinen neuen auf.
        en: Delgado takes the money for the widows' fund and listens. She doesn't take the notice down, but she puts up no new ones.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [k2_rache_delgado_versoehnt]
    - id: hinnehmen
      label: { de: "Hinnehmen", en: "Take it" }
      result:
        de: Jacobs Landmann geht jetzt mit mehr Geld in der Tasche zu den Farmern.
        en: Jacob's landman now goes to the farmers with more money in his pocket.
      appointments: 0
      default: true

- id: k2_rache_thorne
  conditions: { minChapter: 1 }   # jedes Kapitel – die Merkzeichen der Simulation entscheiden (Phase 4)
  mail: info
  certain: true
  once: false
  marked: [k2_rache_thorne]
  deadline: 2
  title:
    de: Neuer Tarif der Thorne Rail
    en: New Thorne Rail Tariff
  text:
    de: >-
      Die Thorne Rail teilt mit, dass sich der Frachttarif für Harlan Oil „infolge
      gestiegener Kosten“ erhöht. Für niemanden sonst sind die Kosten gestiegen.
      Diesmal gilt es für immer.
    en: >-
      Thorne Rail announces that the freight tariff for Harlan Oil is rising "owing to
      increased costs". For nobody else have the costs increased. This time it is
      permanent.
  choices:
    - id: versoehnen
      label: { de: "Bei der Trust Bank vorsprechen und ein Konto eröffnen (200 $)", en: "Call at the Trust Bank and open an account (200 $)" }
      result:
        de: Thorne empfängt Jacob nicht selbst. Aber er lässt ausrichten, er habe von dem Konto gehört.
        en: Thorne doesn't receive Jacob himself. But he sends word that he has heard about the account.
      requires: { minCash: 200 }
      effects: { cash: -200 }
      marks: [k2_rache_thorne_versoehnt]
    - id: hinnehmen
      label: { de: "Hinnehmen", en: "Take it" }
      result:
        de: Jacob rechnet die Fuhrwerke noch einmal durch. Vielleicht lohnt sich die Pipeline doch.
        en: Jacob runs the numbers on the wagons again. Perhaps the pipeline is worth it after all.
      appointments: 0
      default: true
