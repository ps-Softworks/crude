# Kapitel 1 – Probe-Ereignis (2.2). Entwurf von Claude, bitte in eigener Stimme umschreiben.
# Vorlage und Erklärung: docs/ereignis-vorlage.md
# Ruth will die Bücher führen. Setzt ein Merkzeichen für spätere Kapitel (Ruths Anteile).

- id: ruth_buecher
  visitor: ruth
  title:
    de: Ruth und die Quittungen
    en: Ruth and the Receipts
  text:
    de: >-
      Ruth sitzt nachts am Küchentisch der Pension, vor sich Jacobs Quittungen.
      Drei Rechnungen hat der Holzhändler doppelt gestellt – 80 $, die einfach
      weg gewesen wären. „Lass mich die Bücher führen, Jacob“, sagt sie. „Ich
      habe das für Krämer Pell zehn Jahre gemacht.“
    en: >-
      Ruth sits at the boarding-house kitchen table late at night, Jacob's receipts
      spread before her. The lumber dealer billed three of them twice – 80 $ that
      would simply have vanished. "Let me keep the books, Jacob," she says. "I did
      it for Pell the grocer for ten years."
  conditions: { minRound: 2, maxRound: 6 }
  chance: 0.35
  choices:
    - id: ueberlassen
      label: { de: "Ruth die Bücher überlassen", en: "Let Ruth keep the books" }
      result:
        de: Ruth holt die 80 $ beim Holzhändler zurück. Ab jetzt steht ihre Handschrift in den Büchern.
        en: Ruth gets the 80 $ back from the lumber dealer. From now on, the ledgers are in her hand.
      effects: { cash: 80 }
      marks: [ruth_buchhalterin]
    - id: danken
      label: { de: "Ihr danken – die Firma ist meine Sache", en: "Thank her – the company is my business" }
      result:
        de: Jacob holt die 80 $ selbst zurück. Ruth legt die Quittungen hin und spricht nicht mehr davon.
        en: Jacob collects the 80 $ himself. Ruth puts the receipts down and never mentions them again.
      effects: { cash: 80 }
      marks: [ruth_beiseite]
      default: true
