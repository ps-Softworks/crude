# Kapitel 1 – Alltag, Paket 5: Arbeiter und Unglücke (2.10b, Ereignisse 44–56). Entwurf von
# Claude, bitte in eigener Stimme umschreiben. Ton: Weltbibel (Salt Hill: Brände, Unfälle,
# Streit), GDD §13 Kapitel 1.
#
# Erfunden und nicht in der Weltbibel: Vorarbeiter Hollis Crabb, Mateo Ruiz aus Costa Negra,
# Hilfssheriff Pruitt (nicht verwandt mit Anwalt Pruitt), der „Torpedomann“ Dutch Haller,
# die Farmerstochter Annie Lusk.
#
# Folgen früherer Pakete, die hier aufgegriffen werden:
#   kerrigan_eingestellt (Kumpel aus der Grube)  → kerrigan_husten
#   eli_versorgt / eli_im_stich (Unfall am Turm) → eli_zurueck / eli_mutter
#   sheriff_bezahlt (Sheriff bietet Schutz an)   → diebe_gefasst statt diebe_tank (Gruppe diebe)
# Neu: trupp_unmut (Sonntagsarbeit verlangt) → streik.

# --- Arbeiter -----------------------------------------------------------------

- id: trupp_sonntag
  title:
    de: Der Trupp will den Sonntag
    en: The Crew Wants Sunday Off
  text:
    de: >-
      Seit Bruder Abel am Hafen predigt, wollen die Männer sonntags nicht mehr an den
      Turm. Vorarbeiter Crabb hat die Mütze in der Hand, aber er sagt es deutlich:
      sechs Tage, nicht sieben. Bei Bullard arbeiten sie sieben.
    en: >-
      Since Brother Abel started preaching at the harbour, the men won't come to the
      derrick on Sundays. Foreman Crabb holds his cap, but he says it plainly: six
      days, not seven. At Bullard's they work seven.
  conditions: { minLeases: 1, minRound: 3 }
  chance: 0.1
  choices:
    - id: geben
      label: { de: "Den Sonntag geben", en: "Give them Sunday" }
      result:
        de: Sonntags steht der Turm still, und der Lohn bleibt gleich. Am Montag arbeiten die Männer, als hätten sie etwas zu beweisen.
        en: On Sundays the derrick stands still and the wages stay the same. On Monday the men work as if they had something to prove.
      effects: { cash: -60, strength: 2 }
      marks: [trupp_sonntag]
    - id: zuschlag
      label: { de: "Sonntagszuschlag zahlen (100 $)", en: "Pay a Sunday bonus (100 $)" }
      result:
        de: Die meisten nehmen das Geld. Zwei gehen trotzdem in die Kirche und kommen nicht wieder.
        en: Most of them take the money. Two go to church anyway and don't come back.
      requires: { minCash: 100 }
      effects: { cash: -100 }
    - id: nein
      label: { de: "Sieben Tage, wie überall", en: "Seven days, like everywhere" }
      result:
        de: Crabb setzt die Mütze auf und geht. Am Turm wird weniger gesungen.
        en: Crabb puts his cap on and leaves. There is less singing at the derrick.
      marks: [trupp_unmut]
      appointments: 0
      default: true

- id: streik
  marked: [trupp_unmut]
  delay: 2
  chance: 0.35
  title:
    de: Der Turm steht still
    en: The Derrick Stands Still
  text:
    de: >-
      Am Morgen sitzen die Männer vor dem Kesselhaus und rauchen. Keiner rührt den
      Heizer an. Crabb sagt, sie wollen einen Sonntag und zehn Cent mehr am Tag,
      und wenn nicht, dann gehen sie zu Tilly.
    en: >-
      In the morning the men sit outside the boiler house, smoking. Nobody touches
      the fire. Crabb says they want a Sunday and ten cents more a day, and if not,
      they'll go to Tilly.
  choices:
    - id: nachgeben
      label: { de: "Nachgeben (150 $)", en: "Give in (150 $)" }
      result:
        de: Bis Mittag läuft der Kessel wieder. Crabb gibt Jacob die Hand, ohne zu lächeln.
        en: By noon the boiler is running again. Crabb shakes Jacob's hand without smiling.
      requires: { minCash: 150 }
      effects: { cash: -150 }
      marks: [streik_nachgegeben]
    - id: ersetzen
      label: { de: "Neue Männer vom Hafen holen (120 $)", en: "Bring new men from the docks (120 $)" }
      result:
        de: Die neuen Männer sind billig und ungeschickt. Die alten stehen am Zaun und schauen zu, wie einer sich die Hand quetscht.
        en: The new men are cheap and clumsy. The old ones stand at the fence and watch one of them crush his hand.
      requires: { minCash: 120 }
      effects: { cash: -120, strength: -4 }
      marks: [streikbrecher]
      appointments: 2
    - id: aussitzen
      label: { de: "Aussitzen", en: "Sit it out" }
      result:
        de: Zehn Tage Stillstand. Dann kommen sie zurück, weil sie Hunger haben. Vergessen tun sie es nicht.
        en: Ten days idle. Then they come back because they're hungry. They don't forget it.
      effects: { cash: -200, strength: -5 }
      marks: [streik_ausgesessen]
      appointments: 0
      default: true

- id: kerrigan_husten
  marked: [kerrigan_eingestellt]
  delay: 3
  chance: 0.3
  title:
    de: Dan Kerrigan hustet Blut
    en: Dan Kerrigan Coughs Blood
  text:
    de: >-
      Dan Kerrigan arbeitet wie zwei, aber morgens hustet er hinter dem Kesselhaus,
      bis er sich festhalten muss. Heute war Blut im Taschentuch. Er versteckt es
      schlecht. „Sag's nicht, Jacob. Ich brauch die Arbeit.“
    en: >-
      Dan Kerrigan works like two men, but in the mornings he coughs behind the
      boiler house until he has to hold on. Today there was blood in the
      handkerchief. He hides it badly. "Don't, Jacob. I need the work."
  choices:
    - id: arzt
      label: { de: "Ihn zu Doktor Haskell schicken und weiterbezahlen (90 $)", en: "Send him to Doctor Haskell and keep paying him (90 $)" }
      result:
        de: Haskell verschreibt trockene Luft und keine Arbeit. Kerrigan lacht darüber. Er kommt trotzdem jeden Tag zum Zaun und schaut zu.
        en: Haskell prescribes dry air and no work. Kerrigan laughs at that. He still comes to the fence every day to watch.
      requires: { minCash: 90 }
      effects: { cash: -90 }
      marks: [kerrigan_geschont]
    - id: buero
      label: { de: "Ihm die Bücher und das Lager geben", en: "Give him the books and the store shed" }
      result:
        de: Kerrigan zählt jetzt Fässer und Seile, im Sitzen. Er ist gründlich. Ruth sagt, er sei der Erste, der ihre Zahlen nicht verbessert.
        en: Kerrigan now counts barrels and rope, sitting down. He is thorough. Ruth says he's the first who doesn't correct her figures.
      appointments: 2
      sharp: true
      marks: [kerrigan_geschont]
    - id: schweigen
      label: { de: "Ihn weiterarbeiten lassen", en: "Let him keep working" }
      result:
        de: Kerrigan arbeitet weiter. Jacob hört den Husten jetzt auch nachts, obwohl die Pension eine Meile entfernt ist.
        en: Kerrigan works on. Jacob hears the cough at night now too, though the boarding house is a mile away.
      effects: { strength: -3 }
      marks: [kerrigan_verheizt]
      appointments: 0
      default: true

- id: eli_zurueck
  marked: [eli_versorgt]
  delay: 4
  chance: 0.3
  title:
    de: Eli Ward ist zurück
    en: Eli Ward Is Back
  text:
    de: >-
      Eli Ward steht am Turm, auf einen Stock gestützt. Das Bein ist gerade
      gewachsen, aber kürzer. Auf die Plattform kann er nicht mehr. Er fragt, ob
      Jacob einen Nachtwächter braucht. Er schlafe ohnehin schlecht.
    en: >-
      Eli Ward stands at the derrick, leaning on a stick. The leg healed straight,
      but shorter. He can't go up on the platform any more. He asks whether Jacob
      needs a night watchman. He sleeps badly anyway.
  choices:
    - id: waechter
      label: { de: "Ihn als Wächter einstellen (50 $)", en: "Hire him as watchman (50 $)" }
      result:
        de: Eli sitzt nachts mit der Laterne am Tank und zählt die Sterne, sagt er. Seitdem fehlt kein Fass mehr.
        en: Eli sits by the tank at night with the lantern and counts the stars, he says. Since then no barrel goes missing.
      requires: { minCash: 50 }
      effects: { cash: -50 }
      marks: [eli_waechter]
    - id: nein
      label: { de: "Bedauern – es gibt keine Stelle", en: "Regret – there's no position" }
      result:
        de: Eli nickt, als hätte er es gewusst. Er humpelt zum Hafen, wo Bullards Leute anheuern.
        en: Eli nods as if he knew. He limps to the harbour, where Bullard's people hire.
      appointments: 0
      default: true

- id: eli_mutter
  mail: personal
  marked: [eli_im_stich]
  delay: 3
  chance: 0.4
  title:
    de: Ein Brief von Elis Mutter
    en: A Letter from Eli's Mother
  text:
    de: >-
      Die Schrift ist ungelenk, die Rechtschreibung auch. Martha Ward schreibt, ihr
      Junge liege seit dem Sturz bei ihr in der Kammer und könne nicht arbeiten. Sie
      verlange nichts. Sie wolle nur, dass Mr. Harlan es wisse.
    en: >-
      The handwriting is clumsy, the spelling too. Martha Ward writes that her boy
      has lain in her room since the fall and cannot work. She asks for nothing. She
      only wants Mr. Harlan to know.
  choices:
    - id: geld
      label: { de: "Geld schicken (60 $)", en: "Send money (60 $)" }
      result:
        de: Jacob schreibt drei Sätze und legt das Geld dazu. Den dritten Satz streicht er wieder.
        en: Jacob writes three sentences and encloses the money. He crosses out the third sentence.
      requires: { minCash: 60 }
      effects: { cash: -60 }
      marks: [eli_spaet_geholfen]
    - id: weglegen
      label: { de: "Den Brief weglegen", en: "Put the letter away" }
      result:
        de: Der Brief liegt unter der Lampe. Ruth hat ihn gelesen. Sie sagt nichts, aber sie legt ihn nicht weg.
        en: The letter lies under the lamp. Ruth has read it. She says nothing, but she doesn't put it away.
      effects: { ruth: -4 }
      appointments: 0
      default: true

- id: crabb_lager
  title:
    de: Im Lager fehlt Seil
    en: Rope Is Missing from the Store
  text:
    de: >-
      Ruth hat nachgezählt: Es fehlen zweihundert Fuß Seil und ein Satz
      Rohrzangen. Vorarbeiter Crabb hat den Schlüssel. In Salt Hill verkauft einer
      gebrauchtes Werkzeug, billig, ohne zu sagen, woher.
    en: >-
      Ruth has counted again: two hundred feet of rope and a set of pipe tongs are
      missing. Foreman Crabb has the key. In Salt Hill someone is selling used tools,
      cheap, without saying where from.
  conditions: { minLeases: 1, minRound: 4 }
  chance: 0.08
  choices:
    - id: stellen
      label: { de: "Crabb unter vier Augen fragen", en: "Ask Crabb in private" }
      result:
        de: Crabb leugnet erst, dann nicht mehr. Seine Tochter ist krank. Er zahlt es vom Lohn ab, und er bleibt.
        en: Crabb denies it, then stops denying it. His daughter is sick. He pays it back from his wages, and he stays.
      appointments: 2
      sharp: true
      marks: [crabb_geschont]
    - id: entlassen
      label: { de: "Crabb vor dem Trupp entlassen", en: "Fire Crabb in front of the crew" }
      result:
        de: Crabb geht ohne ein Wort. Der Trupp arbeitet eine Woche schneller und redet nicht mit Jacob.
        en: Crabb leaves without a word. The crew works faster for a week and doesn't talk to Jacob.
      effects: { cash: -40 }
      marks: [crabb_entlassen]
    - id: neues_schloss
      label: { de: "Ein neues Schloss kaufen und nichts sagen", en: "Buy a new lock and say nothing" }
      result:
        de: Das Schloss kostet zwei Dollar, das fehlende Werkzeug mehr. Nach einem Monat fehlt wieder etwas.
        en: The lock costs two dollars, the missing tools more. After a month something is missing again.
      effects: { cash: -110 }
      appointments: 0
      default: true

- id: mateo_papiere
  title:
    de: Ein Mann ohne Papiere
    en: A Man Without Papers
  text:
    de: >-
      Hilfssheriff Pruitt will Mateo Ruiz mitnehmen, Jacobs besten Heizer. Mateo
      kommt aus Costa Negra und hat keine Papiere; auf jeden Kopf ohne Papiere gibt
      es fünf Dollar Prämie. Mateo steht neben dem Kessel und schaut Jacob an.
    en: >-
      Deputy Pruitt wants to take Mateo Ruiz, Jacob's best fireman. Mateo comes from
      Costa Negra and has no papers; there's a five-dollar bounty on every head
      without them. Mateo stands by the boiler and looks at Jacob.
  conditions: { minLeases: 1, minRound: 3 }
  chance: 0.08
  choices:
    - id: buergen
      label: { de: "Für Mateo bürgen und mit zum Richter gehen", en: "Vouch for Mateo and go to the judge with him" }
      result:
        de: Ein ganzer Tag im Bezirksgericht, ein Stempel, ein Formular. Mateo bleibt. Pruitt merkt sich, wer sich eingemischt hat.
        en: A whole day at the county court, a stamp, a form. Mateo stays. Pruitt remembers who interfered.
      effects: { cash: -20, strength: -3 }
      marks: [mateo_geschuetzt]
      appointments: 2
    - id: zahlen
      label: { de: "Pruitt die Prämie selbst zahlen (25 $)", en: "Pay Pruitt the bounty yourself (25 $)" }
      result:
        de: Pruitt nimmt fünfundzwanzig statt fünf und tippt an den Hut. Er kommt nächsten Monat wieder, sagt er.
        en: Pruitt takes twenty-five instead of five and touches his hat. He'll be back next month, he says.
      requires: { minCash: 25 }
      effects: { cash: -25 }
      marks: [pruitt_bezahlt]
      appointments: 0
    - id: ausliefern
      label: { de: "Mateo gehen lassen", en: "Let Mateo go" }
      result:
        de: Pruitt nimmt Mateo am Arm. Der Kessel läuft am Nachmittag schlechter. Niemand im Trupp sagt etwas.
        en: Pruitt takes Mateo by the arm. The boiler runs worse in the afternoon. Nobody in the crew says anything.
      marks: [mateo_ausgeliefert]
      appointments: 0
      default: true

# --- Unglücke -----------------------------------------------------------------

- id: blitz_tank
  group: unglueck
  title:
    de: Der Blitz schlägt in den Tank
    en: Lightning Strikes the Tank
  text:
    de: >-
      Ein Gewitter vom Golf, ein einziger Schlag, und Jacobs Holztank brennt. Die
      Flammen stehen still und gerade, schwarzer Rauch bis Port Ellis. Wenn der Tank
      überkocht, läuft brennendes Öl den Hang hinunter zu den Türmen.
    en: >-
      A storm off the Gulf, a single strike, and Jacob's wooden tank is burning. The
      flames stand still and straight, black smoke all the way to Port Ellis. If the
      tank boils over, burning oil will run down the slope to the derricks.
  conditions: { minOilStock: 300, minRound: 2 }
  chance: 0.06
  choices:
    - id: graben
      label: { de: "Einen Graben ziehen lassen und das Öl ablassen", en: "Have a trench dug and drain the oil" }
      result:
        de: Die ganze Nacht schaufeln. Ein Teil des Öls läuft in den Graben und wird gerettet, der Rest verbrennt. Die Türme stehen noch.
        en: Shovelling all night. Part of the oil runs into the trench and is saved; the rest burns. The derricks still stand.
      effects: { oilStock: -150, strength: -7 }
      appointments: 3
      sharp: true
    - id: kanone
      label: { de: "Den Tank mit der Kanone der Feuerwehr anschießen lassen (60 $)", en: "Have the fire brigade's cannon shoot the tank open (60 $)" }
      result:
        de: Der zweite Schuss trifft unten. Das Öl läuft aus und brennt am Boden ab, weg von den Türmen. Vom Tank bleiben Reifen und Asche.
        en: The second shot hits low. The oil runs out and burns off on the ground, away from the derricks. Of the tank, hoops and ash remain.
      requires: { minCash: 60 }
      effects: { cash: -60, oilStock: -250 }
    - id: brennen
      label: { de: "Brennen lassen", en: "Let it burn" }
      result:
        de: Der Tank brennt drei Tage. Das Öl ist weg, und das Bohrhaus daneben auch.
        en: The tank burns three days. The oil is gone, and the drill house beside it too.
      effects: { oilStock: -300, cash: -120 }
      appointments: 0
      default: true

- id: sturm_golf
  group: unglueck
  title:
    de: Ein Sturm vom Golf
    en: A Gale off the Gulf
  text:
    de: >-
      Zwei Tage Wind, der die Bretter von den Dächern reißt. In Port Ellis steht das
      Wasser in den Straßen. Am dritten Morgen liegt Jacobs Bohrturm quer über dem
      Kesselhaus, und das Dach der Pension hat ein Loch über dem Bett.
    en: >-
      Two days of wind that strips boards from the roofs. In Port Ellis the water
      stands in the streets. On the third morning Jacob's derrick lies across the
      boiler house, and the boarding-house roof has a hole above the bed.
  conditions: { minLeases: 1, minRound: 3 }
  chance: 0.06
  choices:
    - id: turm
      label: { de: "Zuerst den Turm aufrichten (180 $)", en: "Raise the derrick first (180 $)" }
      result:
        de: Zimmerleute sind nach einem Sturm teuer. In einer Woche schlägt der Turm wieder. Ruth hat das Loch mit einer Plane geflickt, allein.
        en: Carpenters are dear after a storm. Within a week the derrick is pounding again. Ruth patched the hole with a tarpaulin, alone.
      requires: { minCash: 180 }
      effects: { cash: -180, ruth: -5 }
    - id: familie
      label: { de: "Erst die Familie, dann der Turm (200 $)", en: "Family first, then the derrick (200 $)" }
      result:
        de: Jacob flickt das Dach selbst, mit Ruth, die die Leiter hält. Der Turm wartet eine Woche länger und kostet dann mehr.
        en: Jacob patches the roof himself, with Ruth holding the ladder. The derrick waits a week longer and then costs more.
      requires: { minCash: 200 }
      effects: { cash: -200, ruth: 5 }
      appointments: 2
    - id: selbst
      label: { de: "Alles selbst mit dem Trupp machen", en: "Do it all yourself with the crew" }
      result:
        de: Zwei Wochen, jeder Tag bis zur Dunkelheit. Der Turm steht schief, aber er steht. Das Dach tropft.
        en: Two weeks, every day until dark. The derrick stands crooked, but it stands. The roof drips.
      effects: { cash: -60, strength: -8 }
      appointments: 0
      default: true

- id: torpedo
  title:
    de: Der Torpedomann
    en: The Torpedo Man
  text:
    de: >-
      Dutch Haller fährt einen gefederten Wagen mit Stroh und Kisten, und alle Pferde
      gehen ihm aus dem Weg. Für 120 $ lässt er einen Nitroglyzerin-Torpedo in Jacobs
      Bohrloch hinab. Danach, sagt er, fließt die Quelle wie am ersten Tag. Oder er
      fliegt mit dem Turm in die Luft. Das sei noch nie passiert, fast.
    en: >-
      Dutch Haller drives a sprung wagon full of straw and crates, and every horse
      shies away from him. For 120 $ he will lower a nitroglycerin torpedo into
      Jacob's hole. Afterwards, he says, the well flows like the first day. Or he
      goes up with the derrick. That's never happened, almost.
  conditions: { minProducingWells: 1, minRound: 5 }
  chance: 0.08
  choices:
    - id: schiessen
      label: { de: "Die Quelle schießen lassen (120 $)", en: "Have the well shot (120 $)" }
      result:
        de: Ein dumpfer Schlag unter den Füßen, dann eine Fontäne aus Öl und Steinen. Der Tank füllt sich in einem Tag. Silas hat sich die ganze Zeit hinter dem Wagen versteckt.
        en: A dull thump underfoot, then a fountain of oil and stones. The tank fills in a day. Silas hid behind the wagon the whole time.
      requires: { minCash: 120 }
      effects: { cash: -120, oilStock: 250 }
      appointments: 2
    - id: nein
      label: { de: "Den Wagen weiterfahren lassen", en: "Let the wagon roll on" }
      result:
        de: Haller fährt zu Bullard. Am Abend hört man einen Knall bis zur Pension. Bullards Quelle fließt jetzt wie am ersten Tag.
        en: Haller drives on to Bullard's. That evening a bang is heard as far as the boarding house. Bullard's well now flows like the first day.
      appointments: 0
      default: true

- id: kind_grube
  draft: true                # Schlüsselszene: ein Kind in der Schlammgrube – wer ist Jacob, wenn niemand zuschaut?
  title:
    de: Ein Kind in der Schlammgrube
    en: A Child in the Slush Pit
  text:
    de: >-
      Annie, die kleine Tochter eines Farmers vom Nordhang, ist in die alte
      Schlammgrube neben einem verlassenen Bohrloch gefallen. Die Wände geben nach,
      sobald jemand näherkommt. Es ist nicht Jacobs Grube. Seine Männer schauen ihn an.
    en: >-
      Annie, the little daughter of a farmer from the north slope, has fallen into
      the old slush pit beside an abandoned hole. The walls give way as soon as
      anyone comes near. It's not Jacob's pit. His men look at him.
  conditions: { minRound: 3 }
  chance: 0.05
  choices:
    - id: selbst
      label: { de: "Selbst am Seil hinunter", en: "Go down on a rope yourself" }
      result:
        de: Jacob kommt schwarz bis zum Hals heraus, das Kind auf dem Arm. Es weint, also lebt es. Der Farmer kann kein Wort sagen.
        en: Jacob comes out black to the neck, the child in his arms. She's crying, so she's alive. The farmer can't say a word.
      effects: { strength: -8, ruth: 4 }
      marks: [annie_gerettet]
      appointments: 2
    - id: trupp
      label: { de: "Den Trupp eine Rampe aus Brettern bauen lassen", en: "Have the crew build a plank ramp" }
      result:
        de: Es dauert eine Stunde, eine lange. Dann reicht Crabb das Kind nach oben. Es hustet Schlamm und lebt.
        en: It takes an hour, a long one. Then Crabb hands the child up. She coughs mud and lives.
      effects: { cash: -30, strength: -2 }
      marks: [annie_gerettet]
    - id: weg
      label: { de: "Nach dem Sheriff schicken und weiterarbeiten", en: "Send for the sheriff and get back to work" }
      result:
        de: Der Sheriff kommt am Nachmittag. Das Kind haben bis dahin Bullards Männer herausgeholt. In Salt Hill erzählt man es so.
        en: The sheriff comes in the afternoon. By then Bullard's men have pulled the child out. That's how they tell it in Salt Hill.
      marks: [annie_weggesehen]
      appointments: 0
      default: true

- id: diebe_tank
  group: diebe
  notMarked: [sheriff_bezahlt]
  title:
    de: Jemand zapft den Tank an
    en: Someone Is Tapping the Tank
  text:
    de: >-
      Am Morgen ist der Boden um den Tank nass und riecht nach Öl. Unten im Holz
      steckt ein Zapfhahn, den niemand eingebaut hat. Wagenspuren führen zur Straße
      nach Port Ellis. Es fehlen etwa zweihundert Barrel.
    en: >-
      In the morning the ground around the tank is wet and smells of oil. A tap that
      nobody fitted is stuck in the bottom stave. Wagon tracks lead to the Port
      Ellis road. About two hundred barrels are gone.
  conditions: { minOilStock: 300, minRound: 3 }
  chance: 0.08
  choices:
    - id: spuren
      label: { de: "Den Spuren selbst nachreiten", en: "Follow the tracks yourself" }
      result:
        de: Die Spuren enden an einem Hof hinter dem Mietstall. Die Fässer stehen noch da, mit frischem Brandzeichen. Jacob holt sie zurück, mit Silas und einer Flinte.
        en: The tracks end at a yard behind the livery stable. The barrels are still there, freshly branded. Jacob takes them back, with Silas and a shotgun.
      effects: { oilStock: -40, strength: -4 }
      appointments: 2
      sharp: true
    - id: sheriff
      label: { de: "Den Sheriff holen", en: "Fetch the sheriff" }
      result:
        de: Sheriff Tatum schaut sich den Zapfhahn an, schreibt etwas auf und reitet wieder. Er schaut dabei nicht in Richtung Mietstall.
        en: Sheriff Tatum looks at the tap, writes something down and rides off. He doesn't look toward the livery stable.
      effects: { oilStock: -200 }
    - id: abschreiben
      label: { de: "Den Hahn ausbauen und abschreiben", en: "Pull the tap and write it off" }
      result:
        de: Zweihundert Barrel. In der Woche danach kauft ein Händler im Hafen sehr billig Öl ein.
        en: Two hundred barrels. The week after, a trader at the harbour is buying oil very cheaply.
      effects: { oilStock: -200 }
      appointments: 0
      default: true

- id: diebe_gefasst
  group: diebe
  marked: [sheriff_bezahlt]
  delay: 1
  title:
    de: Der Sheriff hat die Diebe
    en: The Sheriff Has the Thieves
  text:
    de: >-
      Sheriff Tatum steht morgens vor dem Tank, zwei Männer gefesselt auf einem Wagen,
      daneben sechs Fässer mit Jacobs Öl. Die beiden hätten nachts gezapft. „Dafür
      zahlen Sie mich ja“, sagt Tatum. Er wartet. Ein Fass für die Mühe, meint er,
      sei üblich.
    en: >-
      Sheriff Tatum stands at the tank in the morning, two men tied up on a wagon,
      beside them six barrels of Jacob's oil. They were tapping at night. "That's
      what you pay me for," Tatum says. He waits. One barrel for the trouble, he
      reckons, is customary.
  conditions: { minOilStock: 300, minRound: 3 }
  chance: 0.12
  choices:
    - id: fass
      label: { de: "Ihm das Fass geben", en: "Give him the barrel" }
      result:
        de: Tatum lädt das Fass selbst auf. Die beiden Diebe sind am Sonntag wieder frei; einer arbeitet jetzt für Tatum.
        en: Tatum loads the barrel himself. The two thieves are free again on Sunday; one of them now works for Tatum.
      effects: { oilStock: -40 }
    - id: gericht
      label: { de: "Auf einem Prozess bestehen", en: "Insist on a trial" }
      result:
        de: Der Bezirksrichter verhandelt in drei Wochen, Jacob muss aussagen. Die Diebe bekommen ein halbes Jahr. Tatum grüßt seitdem knapper.
        en: The county judge hears it in three weeks; Jacob has to testify. The thieves get half a year. Tatum's greeting has been curter since.
      effects: { strength: -3 }
      marks: [diebe_verurteilt]
      appointments: 2
    - id: danke
      label: { de: "Danken und nichts weiter fragen", en: "Thank him and ask nothing more" }
      result:
        de: Tatum nimmt das Fass trotzdem. Üblich ist üblich.
        en: Tatum takes the barrel anyway. Customary is customary.
      effects: { oilStock: -40 }
      appointments: 0
      default: true
