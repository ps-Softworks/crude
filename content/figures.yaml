# Figuren (2.12, GDD §16): Bis die gezeichneten Porträts kommen, steht jede Person
# als Silhouette auf dem Papier. Hier steht nur, welche Silhouette zu wem gehört –
# die Formen selbst zeichnet src/ui/Silhouette.tsx.
#
# Mögliche Silhouetten:
#   hut       – Mann mit Hut (Jacob)
#   frau      – Frau mit Haarknoten
#   kind      – Säugling / kleines Kind
#   muetze    – Arbeiter mit Schirmmütze und Bart
#   strohhut  – Farmer mit breitem Strohhut
#   zylinder  – Herr mit Zylinder (Bankiers, Trust)
#   kopf      – ohne Kopfbedeckung (Ersatz für alle, die hier fehlen)
#
# Schlüssel = die Kennung der Person, wie sie in family.yaml (ruth, thomas) und
# arcs.yaml (silas, moss) steht.
#
# Besucher (0.2.15+10): Ein Ereignis mit „visitor: silas“ (content/events) lässt
# diese Person vor Jacobs Schreibtisch treten. Dafür braucht sie einen Namen:
#   silas: { form: muetze, name: Silas }
# Der Name steht an der Tür („Silas wartet“) und über dem Gespräch.
# npm run check:content prüft, dass jede Figur aus „visitor“ hier steht.

jacob: { form: hut, name: Jacob }
ruth: { form: frau, name: Ruth }
thomas: { form: kind, name: Thomas }
silas: { form: muetze, name: Silas }
moss: { form: strohhut, name: Ezekiel Moss }
crane: { form: zylinder, name: Mr. Crane }

# Besucher am Schreibtisch (0.2.15+10) – ENTWURF, Namen aus den Ereignistexten.
daniel: { form: kopf, name: Daniel Moss }
spekulant: { form: zylinder, name: Ein Herr aus Hallstead }
